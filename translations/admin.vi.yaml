se_pow_max_cap_info: Số cao nhất sau khi áp dụng hệ số. 1500000 mất khoảng 25 giây trên điện thoại chậm.
se_pow_sensitivity: Chống bot - độ nhạy phát hiện rủi ro
se_pow_sensitivity_info: Phần trăm các ngưỡng mặc định (tăng từ 5 yêu cầu/10 phút, 3 lỗi/giờ hoặc 2 đăng ký/24 giờ mỗi IP; cao từ 20 / 10 / 5; mạng gấp ba lần). 200 = cần gấp đôi số sự kiện, 50 = một nửa.
se_pow_max_number: Chống bot - độ khó (số tối đa)
se_pow_max_number_info: Trình duyệt thử các giá trị băm tới số này, trung bình một nửa. 100000 mất khoảng nửa giây đến một giây. Số càng lớn thì bot càng tốn công.
