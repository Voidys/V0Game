se_planet_creation_info: Hành tinh chính mới có thể được đặt lần lượt qua các hệ và thiên hà, ngẫu nhiên, theo khối, hoặc 50% ngẫu nhiên và 50% theo khối.<br>Đặt ngẫu nhiên lấp đầy đều các thiên hà và hệ ở vị trí ngẫu nhiên.<br>Đặt theo khối chọn một hệ đã có một hoặc hai hành tinh. Nếu không có hệ như vậy hoặc có dưới 50 người chơi thì đặt ngẫu nhiên.
