se_bash_war_exempt: Chiến tranh bỏ qua giới hạn bash
se_bash_war_exempt_info: 'Các đợt tấn công giữa các liên minh đang có chiến tranh (đã được chấp nhận, cũ hơn một ngày) không tính vào giới hạn bash. Tắt: tấn công trong chiến tranh được tính như mọi đợt khác.'
se_honor_pair_cap: Số trận danh dự mỗi cặp (24 giờ)
se_honor_pair_cap_info: Số trận danh dự giữa cùng hai người chơi (theo cả hai chiều) được cộng danh dự trong 24 giờ. Các trận sau đó được tính là trung lập. 0 = không giới hạn.
se_market_push_tolerance: Dung sai giao dịch chợ
se_market_push_tolerance_info: Chênh lệch giá trị được chấp nhận của một giao dịch chợ tính theo phần trăm (0-90) trước khi bị tính là ép giá. Mặc định 30.
se_transport_push_check: Chốt chặn ép giá vận chuyển
se_transport_push_check_info: Từ chối vận chuyển, giữ và chuyển (hàng hóa và tàu) sang người chơi khác khi trong 7 ngày gần nhất, giá trị gửi cho họ vượt quá giá trị họ gửi lại quá mức giới hạn bên dưới.
se_transport_push_limit: Giới hạn ép giá vận chuyển
se_transport_push_limit_info: Giá trị hàng hóa tính bằng đơn vị deuterium (theo tỷ giá chợ) mà trên đó chốt chặn được áp dụng. 0 = tắt chốt chặn.
se_depot_cost_real_consumption: Chi phí kho trạm theo mức tiêu thụ thực
se_depot_cost_real_consumption_info: Kho trạm liên minh tính mức tiêu thụ nhiên liệu thực tế của hạm đội (theo công nghệ động cơ và nhiên liệu của chủ sở hữu) / 10 mỗi giờ thay vì mức tiêu thụ cơ bản / 10.
se_hours: Giờ
se_remember_me_days: '"Giữ đăng nhập" có hiệu lực trong'
se_remember_me_days_info: 'Số ngày mà một lần đăng nhập có tích "Giữ đăng nhập" vẫn giữ được sau khi khởi động lại trình duyệt và phiên hết hạn. Đổi mật khẩu sẽ kết thúc hiệu lực này. 0 tắt tùy chọn.'
se_session_lifetime: Phiên hết hạn sau khi không hoạt động trong
se_session_lifetime_info: 'Số giờ không có yêu cầu nào, sau đó người chơi bị đăng xuất ("phiên đã hết hạn").'
abuse_menu: Báo cáo lạm dụng
abuse_days: Ngày
abuse_apply: Áp dụng
abuse_weights: 'Trọng số giá trị kim loại : tinh thể : deuterium'
abuse_none: Không tìm thấy gì trong khoảng này.
abuse_from: Từ
abuse_to: Đến
abuse_count: Số lượng
abuse_sent: Đã gửi
abuse_back: Đã trả về
abuse_net: Giá trị ròng
abuse_linked: Liên kết
abuse_last: Lần cuối
abuse_link_ip: cùng IP
abuse_link_multi: nhóm multi
abuse_link_multi_known: nhóm multi (đã biết)
abuse_link_subnet: cùng subnet (yếu hơn)
abuse_thresholds: 'Ngưỡng: một cặp chuyển giao được liệt kê khi một chiều từ %s đơn vị kim loại trở lên, với tối đa %s chiều ngược lại; cặp giao dịch chợ từ %s giao dịch, bị đánh dấu khi chênh lệch trên %s. Không có dòng nào nghĩa là không cặp nào chạm ngưỡng (hoặc nhật ký trống), không có nghĩa là không có gì xảy ra.'
abuse_transfers: Vận chuyển và giữ một chiều
abuse_transfers_info: Vận chuyển, giữ và chuyển tàu (chưa bị thu hồi; tàu tính theo giá chế tạo) giữa hai người chơi mà hàng hóa một chiều có giá trị ít nhất %s đơn vị kim loại trong khi chiều ngược lại có tối đa %s. Sắp xếp theo giá trị ròng; trọng số là tỷ giá chợ đã lưu.
abuse_trades: Giao dịch chợ lặp lại
abuse_trades_info: Giao dịch tài nguyên giữa cùng hai người chơi, ít nhất %s lần. Tỷ lệ = giá trị bên cho nhiều chia cho bên kia (1.00 = bằng giá tham chiếu chợ); trên %s chênh lệch thì cặp bị đánh dấu.
abuse_giver: Cho nhiều hơn
abuse_receiver: Nhận nhiều hơn
abuse_ratio: Tỷ lệ
abuse_outlier: bất thường
abuse_protections: Cấp bảo vệ tái thiết
abuse_protections_info: Người chơi được cấp bảo vệ tái thiết trong khoảng này. Đối thủ là phía bên kia của báo cáo chiến đấu trận đó; chiến lợi phẩm là giá trị hạm đội của họ thu được (mảnh vỡ và giá trị bị phá hủy không được lưu).
abuse_protected: Người chơi được bảo vệ
abuse_granted: Được cấp
abuse_opponents: Đối thủ
abuse_loot: Chiến lợi phẩm của đối thủ
abuse_report: Báo cáo
abuse_recalls: Rút quân khi đã tới nơi hoặc sau khi tới
abuse_recalls_info: Các hạm đội tấn công, ACS và hủy diệt bị rút khi thời gian đến đã đạt (kiểu rút sau khi đến).
abuse_mission: Nhiệm vụ
abuse_arrival: Đến nơi
abuse_recalled: Đã rút
abuse_late: Sau khi đến
abuse_fought: đã chiến đấu
abuse_mission_1: Tấn công
abuse_mission_2: Tấn công ACS
abuse_mission_9: Hủy diệt
abuse_missiles_skipped: 'Số lần phóng tên lửa so với nội dung hầm không thuộc báo cáo này: các bảng không lưu lịch sử hầm để so sánh.'
abuse_link_device: cùng thiết bị
abuse_graph: Cụm luồng giá trị
abuse_graph_info: 'Người chơi được liên kết qua luồng giá trị trong %s ngày gần nhất (khoảng cố định): vận chuyển, giữ, chuyển tàu (theo giá chế tạo), giao dịch chợ (cả hai bên) và chiến lợi phẩm, cộng cả hai chiều. Chỉ nối các cặp đã chuyển ít nhất %s đơn vị kim loại và %s luồng; các nhóm liên kết từ hai người trở lên được liệt kê (top %s theo giá trị). Ròng = giá trị của cặp một chiều nhất trong cụm (tỷ lệ trên tổng giá trị). Cờ liên kết cho biết thành viên có chung IP, thiết bị hay nhóm multi với thành viên khác không. Số dòng đọc được giới hạn cho mỗi nguồn.'
abuse_members: Thành viên
abuse_value: Tổng giá trị
abuse_flows: Luồng
abuse_top_edge: Cặp một chiều nhất
abuse_activity: Hoạt động xuất quân (24 giờ)
abuse_activity_info: Các tài khoản xuất quân nhiều nhất trong 24 giờ gần nhất; đỉnh = số lần xuất quân trong giờ bận nhất. Đỉnh cao đều đặn có thể là dấu hiệu chơi bằng script.
abuse_player: Người chơi
abuse_launches: Lần xuất quân
abuse_peak: Đỉnh / giờ
adm_dash_unprotected: 'Các chốt chặn chống lạm dụng đang tắt trong vũ trụ này:'
adm_dash_unprotected_push: Chốt chặn ép giá cho vận chuyển, giữ và chuyển đang tắt (transport_push_check / transport_push_limit).
adm_dash_unprotected_honor: Giới hạn trận danh dự là 0 (danh dự không giới hạn giữa cùng hai người chơi).
adm_dash_unprotected_bash: Chiến tranh đã khai báo bỏ qua giới hạn bash (bash_war_exempt).
adm_dash_unprotected_depot: Chi phí giữ kho trạm đang theo mức tiêu thụ cơ bản thấp (depot_cost_real_consumption tắt).
adm_dash_unprotected_market: Dung sai ép giá chợ trên 10 % (market_push_tolerance).
