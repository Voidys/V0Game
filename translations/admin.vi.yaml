se_noob_protection_multi_info: 'Bạn chỉ có thể tấn công người chơi có điểm nằm trong khoảng điểm của bạn × hệ số này. Ví dụ với 18: nếu bạn có 1.000 điểm, bạn có thể tấn công người chơi dưới 18.000 điểm. Người chơi 20.000 điểm có thể tấn công bất kỳ ai tới 360.000 điểm, nên người 50.000 điểm vẫn nằm trong tầm.'
