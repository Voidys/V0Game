install_desc: "Kurulum Aracını etkinleştirmek için dosyayı \"var/ENABLE_INSTALL_TOOL\"<br> Dosya adı büyük/küçük harfe duyarlıdır ve dosya türü sonu yoktur.<br> Dosya boş olabilir. \nKurulum tamamlandıktan sonra veya bir saatten eskiyse otomatik olarak silinecektir."
