intro_text: 'V0Game en iyi ogame projelerinden birisidir.<br>V0Game mevcut gelistirilmis en yeni ve guvenilir Xnova versiyonudur. V0Game gerek kullanim kolayligi, gerek kod esnekligi, dinamizmi, kod kalitesi ve islevleri ile goz almaktadir. Her zaman sizin beklentilerinizden daha iyi olmaya calistik. <br><br> Kurulumdaki direktifler kurulum esnasinda size rehberlik edecektir. Her sorun ve problemde, bize danismak icin kesinlikle tereddut etmeyin!<br><br>The V0Game bir acik kod uygulamasidir ve GNU GPL v3 lisanslidir. Lisans hakkinda bilgi edinmek icin asagidaki "Lisans" linkine tiklayabilirsiniz.  <br><br> Kurulum islemine baslamadan once sisteminiz V0Game kurmak icin gerekli ozelliklere sahip olup olmadigi test edilecektir. '
intro_upgrade_head: Sisteminizde V0Game mevcut kurulu mu?
intro_upgrade_text: <p>Sisteminizde V0Game kurulu, kolay bir guncelleme istermisiniz?</p><p>Buraya tiklayarak sisteminizin eski veritabanini bir kac tiklama ile guncelleyebilirsiniz.!</p>
