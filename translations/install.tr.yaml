ins_feat_seasons_info: 'Aylık sıralama (akıncı, savaşçı, savunucu, kaşif, geri dönüştürücü); sıfırlama yok, kazananlar rozet alır.'
ins_feat_cosmetics: 'Rozetler ve unvanlar'
ins_feat_cosmetics_info: 'Kazanılan rozetleri, unvanları ve isim renklerini oyuncu kartında ve sohbette gösterir.'
ins_feat_bounties: 'Ödül avı'
ins_feat_bounties_info: 'Oyuncular başka bir oyuncuya kaynak koyar; filosunun yeterli kısmını yok eden onları toplar.'
ins_feat_alliance_wars: 'İttifak savaş skoru'
ins_feat_alliance_wars_info: 'İttifak diplomasisinde ilan edilen savaşlar için canlı skor tablosu.'
ins_feat_battle_feed: 'Savaş akışı'
ins_feat_battle_feed_info: 'Büyük savaşlar genel sohbette duyurulur (sohbet gerekir).'
ins_feat_derelicts: 'Enkaz alanları'
ins_feat_derelicts_info: 'Geri kazanım alanları bir süreliğine galakside belirir; oraya ilk ulaşan geri dönüştürücüler toplar.'
ins_feat_mothership: 'Korsan ana gemisi'
ins_feat_mothership_info: 'Nadir bir dünya boss''u; yalnızca ACS''de yenilebilir, ganimet verilen hasara göre paylaşılır.'
ins_feat_expedition_stories: 'Keşif hikâyeleri'
ins_feat_expedition_stories_info: 'Nadir sinyaller oyuncuyu daha büyük ödüllü kısa bir keşif görevine götürür.'
ins_feat_relics: 'Kalıntılar'
ins_feat_relics_info: 'Keşiflerde kalıntılar bulunabilir (yaygından epiğe, set bonuslu); oyuncular bunları küçük güçlendirmeler için gezegenlerine takar.'
