Achievement_text:
  '1': 'Nech dopadnout 5 svých útoků mezi půlnocí a šestou ráno během jedné noci, aniž bys jediný vyhrál.'
  '2': Měl jsi flotily nepřetržitě na cestě 90 dní.
  '3': 'Přišel jsi o flotilu, zatímco jsi měl nastavený jazyk „francouzština“.'
  '4': Vyzkoumej iontovou technologii 10.
  '5': Vyzkoumej gravitonový výzkum 2, jen protože můžeš.
  '6': Jeden z tvých útoků se vrátil jen s 1 kovem, 1 krystalem a 1 deuteriem.
  '7': 'Poraz flotilu pirátských nebo vetřeleckých lodí o celkem alespoň 10 000 lodích. Vesmír je náš!'
  '8': Dostav se na štamgast (úterý ve 20:00 na Discordu).
  '9': Postav svou první Hvězdu smrti.
  '10': Znič hráči měsíc.
  '11': Hraj 14 dní výhradně na mobilu.
  '12': Tvou flotilu při první expedici zničila černá díra.
  '13': Pošli flotilu pryč méně než 5 sekund před dopadem příchozího útoku.
  '14': Přijď o 10 flotil kvůli černým dírám. Prázdnota má hlad.
  '15': 'Nezískej svůj první měsíc za 10 bojů při maximální šanci na měsíc.'
  '16': Více než 250 tvých recyklátorů se vrátilo s prázdnou.
  '17': Zařaď do jedné stavební zakázky alespoň 5000 raketometů.
  '18': Spal 5 milionů deuteria jako palivo na jedné planetě během 24 hodin.
  '19': Vyzkoumej pancéřovou technologii 3.
  '20': Vyzkoumej pancéřovou technologii 6.
  '21': Vyzkoumej pancéřovou technologii 9.
  '22': Vyzkoumej pancéřovou technologii 12.
  '23': Vyzkoumej pancéřovou technologii 15.
  '24': Vyzkoumej laserovou technologii 12.
  '25': Přihlas se k Rekordům.
  '26': Smaž planetu, která ti dává nejvíc bodů (alespoň 100 000 bodů).
  '27': Vyzkoumej mezigalaktickou výzkumnou síť 1.
  '28': Vylepši všechny tři sklady na měsíci alespoň na úroveň 3.
  '29': Zkolektivizuj flotilu hráče s vyšším skóre pomocí 5členného ACS.
  '30': Odraž 5členný ACS úplně sám.
  '31': Pošli svým útokem hráče do režimu dovolené.
  '32': 'Přepadni 1000 planet s motivem „SetSail“. Arr!'
  '33': Vrať se z režimu dovolené.
  '34': Buď poprvé napaden. Vítej ve vesmíru.
  '35': Zaútoč na aktivního hráče, který má méně než 1/10 tvých bodů.
  '36': "Dostaň zprávu, která obsahuje jeden z následujících bloků:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Nech se vyhladit 5členným ACS.
  '38': 'Zaútoč na členy své vlastní aliance. Přátelská palba, někdo?'
  '39': Zaútoč na někoho s přesně 42 loděmi.
  '40': Kolonizuj planetu vzdálenou alespoň půl vesmíru.
  '41': Zablokuj slot flotily na týden špatnou nabídkou na tržišti.
  '42': Dostaň se 4krát do Bojové síně na poražené straně.
  '43': "Vyhraj bitvu, zatímco je tvůj účet označen jako neaktivní,\r\n            na jedné ze svých planet, kam předtím dorazila flotila s dobou letu delší než 7 dní."
  '44': 'Vyráběj surovinu na planetě déle než 7 dní při méně než 100 % energie.'
  '45': Vyhraj útok proti hráči z první pětky v obraně.
  '46': Spusť ochranu před bashingem vypálením meziplanetárních raket.
  '47': Znič 5 měsíců.
  '48': Přijď o 5 Hvězd smrti při pokusu o zničení měsíců. Au.
  '49': Zbourej kolonii krátce po jejím založení.
  '50': "Přijď o všechny solární satelity na planetě s dostatkem\r\n            energie na výzkum gravitonové technologie, aniž bys gravitonovou technologii vyzkoumal."
  '51': Spotřebuj všechno deuterium při procházení pohledu na galaxii.
  '52': >-
    Postav Hvězdu smrti, aniž bys předtím postavil jiné bojové lodě (lehký
    stíhač, těžký stíhač, křižník, bitevní loď, bombardér, ničitel nebo bojový
    křižník).
  '53': Měj nejvyšší úroveň v 5 výzkumech současně.
  '54': 'Načasuj útok na aktivního hráče tak, aby dopadl 1. 1. v 00:00:00.'
  '55': Zvláštní úspěch
  '56': 'Dosáhni úrovně 15 hyperprostorového pohonu.'
  '57': 'Dosáhni úrovně 15 astrofyziky.'
  '58': 'Vyzkoumej každou technologii (kromě gravitonu) alespoň jednou.'
  '59': 'Dostaň každý výzkum (kromě gravitonu) na úroveň 10.'
  '60': 'Měj 1 000 000 000 jedné suroviny na jedné planetě nebo měsíci.'
  '61': 'Měj 1000 solárních satelitů najednou na jedné planetě.'
  '62': 'Zastav každé pole planety s alespoň 250 poli.'
  '63': 'Vylepši sklady kovu, krystalu a deuteria na úroveň 15 na jedné planetě.'
  '64': 'Měj na 9 planetách důl na kov úrovně 30 nebo vyšší.'
  '65': 'Zadej jednu stavební zakázku, která trvá déle než 30 dní.'
  '66': 'Nech 50 svých nabídek na trhu koupit jinými hráči.'
  '67': 'Vyhraj obranu proti útočníkům v hodnotě alespoň 10násobku tvé flotily a obrany (útočníci v hodnotě alespoň 1 000 000 surovin).'
  '68': 'Vyhraj útok, při kterém zničíš alespoň 1000 nepřátelských jednotek a neztratíš ani jednu jednotku.'
  '69': 'Skonči souboj remízou po maximálním počtu kol, přičemž každá strana ztratí alespoň 10 000 jednotek.'
  '70': 'Buď napaden na planetě bez lodí a obrany, takže útočník nic nevyplení.'
  '71': 'Získej měsíc ze souboje, který měl jen 1 % šanci na měsíc.'
  '72': 'Znič jedním útokem meziplanetárních raket alespoň 100 obranných jednotek.'
  '73': 'Znič v jednom souboji na své planetě alespoň 100 nepřátelských špionážních sond.'
  '74': 'Vyplení celkem 1 000 000 000 surovin.'
  '75': 'Recykluj celkem 1 000 000 000 surovin.'
  '76': 'Oprav celkem 1000 lodí z polí trosek.'
  '77': 'Získej 1000 bodů cti.'
  '78': 'Staň se poprvé psancem.'
  '79': 'Zúčastni se jako útočník 25 vyhraných společných útoků.'
  '80': 'Zažij každý možný výsledek expedice alespoň jednou.'
  '81': 'Pošli 1000 expedic.'
  '82': 'Vyhraj expediční souboj proti velké cizí flotile.'
  '83': 'Najdi na 50 expedicích velké množství surovin.'
  '84': 'Pošli flotilu na cestu tam delší než 24 hodin.'
  '85': 'Nech flotilu dorazit k cíli 29. února.'
  '86': 'Přijď v pátek třináctého o celou útočnou flotilu.'
  '87': 'Nech dva své útoky (mimo společný útok) dopadnout na stejný cíl ve stejnou sekundu.'
  '88': 'Měj současně flotily na cestě do každé galaxie vesmíru.'
  '89': 'Dokonči tutoriál.'
  '90': 'Měj současně aktivní smlouvy se 3 dalšími aliancemi (dostanou ho všichni členové aliance).'
  '91': 'Vytvoř 5 wiki stránek aliance.'
  '92': 'Měj 10 přijatých žádostí o přátelství.'
  '93': 'Buď 7 dní po sobě číslo 1 v žebříčku celkových bodů.'
  '94': 'Měj současně 100 Hvězd smrti na jedné planetě nebo měsíci.'
  '95': 'Obsaď všechny planetární sloty, které tvá astrofyzika dovoluje (alespoň 9), každou planetu s alespoň 200 poli.'
  '96': 'Získej dalších 50 úspěchů.'
