registerWelcomePMText: >-
  Vítej v %s! Nejdřív postav solární elektrárnu, protože k produkci surovin je
  potřeba energie. Otevři v levém menu Budovy a začni solární elektrárnou.<br>Až
  budeš mít energii, můžeš stavět doly. Zůstaň v Budovách a postav důl na kovy,
  pak důl na krystaly.<br><br>K stavbě lodí potřebuješ loděnici. Menu Technologie
  vlevo ukazuje, co je potřeba k jejímu odemčení.<br>Máš-li další otázky,
  mrkni do FAQ, do wiki, nebo otevři ticket podpory.<br><br>Tým ti přeje
  spoustu zábavy při objevování vesmíru!
