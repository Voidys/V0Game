home_meme_alt: 'Komiksový mem z velitelského můstku {game_name}'
home_meme_alt_deep_space_transit: "Komiks: dva kadeti v raketoplánu – jeden se hroutí při pohledu na pole asteroidů, druhý se šklebí na zářící mlhovinu. „Běžné hlídky v sektoru vs. objevení neprozkoumané mlhoviny bohaté na suroviny.“"
home_meme_alt_deuterium_joyride: "Komiks: unavený velitel na pozorovací palubě sleduje, jak se dva rekruti poflakují venku – „Koukám, jak si nováčci vyplýtvali všechno deuterium na projížďky venku, zatímco já čekám 12 hodin na vylepšení dolů.“"
home_meme_alt_enemy_fleet: "Komiks: kadet si v panice svírá hlavu, zatímco blikají poplachy – „1000 nepřátelských ničitelů na cestě?! Myslel jsem, že tenhle sektor je bezpečný?!“"
home_meme_alt_fleet_decimated: "Komiks: voják v šoku zírá před sebe, zatímco venku před rozbitou kupolí explodují lodě – „Když 20 hodin farmíš suroviny a pak ti flotila hráče z první trojky přiskočí a za 3 sekundy všechno rozebere.“"
home_meme_alt_solo_scouting: "Komiks: velitel Kamioka se šklebí a pokládá robotickou ruku kadetovi na rameno – „Nebojte, kadete. Vrchní velení má ‚úplnou‘ důvěru ve vaši samostatnou průzkumnou misi do Vesmíru.“"
home_meme_alt_this_is_fine: "Komiks: pes ve skafandru klidně sedí v hořícím velitelském centru a říká „To je v pohodě“ – „Klid. Moje flotila se vrací jen o 4 hodiny později.“"
