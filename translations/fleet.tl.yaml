sys_expe_attack_1_1_1: Isang desperadong space pirate ang nagtangkang agawin ang expedition fleet natin.
sys_expe_attack_1_1_2: >-
  Inatake kami ng ilang primitibong barbaro gamit ang mga spaceship. Pero
  kahindik-hindik ang kondisyon ng mga barko nila. Kung seryosong banta ang
  firepower nila, napilitan sana kaming gumanti ng sarili naming putok.
sys_expe_attack_1_1_3: >-
  Naharang namin ang ilang radio message ng mga lasing na lasing na pirata.
  Mukhang aatakihin tayo.
sys_expe_attack_1_1_4: >-
  Kinailangan naming labanan ang ilang pirata, pero buti na lang mas marami
  kami.
sys_expe_attack_1_1_5: >-
  Iniulat ng fleet natin na may isang Moa Tikarr at ang kanyang crew na
  humiling ng walang kondisyong pagsuko ng fleet natin. Kung seryoso sila,
  malalaman nilang napakahusay naming ipagtanggol ang sarili.
sys_expe_attack_1_2_1: Hindi inaasahang nakasagupa ng expedition fleet mo ang ilang space pirate.
sys_expe_attack_1_2_2: >-
  Napasok kami sa ambush ng ilang star pirate! Sa kasamaang-palad, hindi
  maiiwasan ang laban.
sys_expe_attack_1_2_3: >-
  Naging patibong pala ng ilang tusong pirata ang paghingi ng tulong ng
  ibang expedition fleet. Hindi maiiwasan ang laban.
sys_expe_attack_1_3_1: >-
  Hindi galing sa mga hindi kilalang alien ang mga naharang na signal, kundi sa
  isang lihim na base ng pirata! Hindi natuwa ang mga pirata sa presensya namin
  sa sector nila.
sys_expe_attack_1_3_2: Iniulat ng expedition fleet ang matinding laban sa mga hindi kilalang barko ng pirata!
sys_expe_attack_1_3_3: >-
  May natanggap lang kaming agarang mensahe mula sa expedition commander:
  "Sinusugod nila tayo! Lumundag sila palabas ng hyperspace, buti na lang mga
  pirata lang sila, kaya may tsansa tayo, lalaban tayo!"
sys_expe_attack_2_1_1: Hindi magandang unang pakikipag-ugnayan ang naranasan ng expedition fleet mo sa isang hindi kilalang species.
sys_expe_attack_2_1_2: Inatake ng ilang kakaibang barko ang expedition fleet nang walang babala!
sys_expe_attack_2_1_3: Inatake ang expedition natin ng maliit na grupo ng mga hindi kilalang spacecraft!
sys_expe_attack_2_1_4: >-
  Iniulat ng expedition fleet ang pakikipag-ugnayan sa mga hindi kilalang
  barko. Hindi ma-decode ang mga radio message, pero mukhang
  pinapagana na ng mga kakaibang barko ang mga armas nila.
sys_expe_attack_2_2_1: Inaatake ng isang hindi kilalang species ang expedition natin!
sys_expe_attack_2_2_2: >-
  Mukhang nilabag ng expedition fleet mo ang teritoryo ng isang dating hindi
  kilalang pero lubhang agresibong lahi ng alien.
sys_expe_attack_2_2_3: >-
  Bigla na lang naputol ang koneksyon sa expedition fleet natin. Ang huli
  naming narinig, malakas ang pagbabarilan sa fleet. Hindi nakilala ang mga
  umatake.
sys_expe_attack_2_3_1: >-
  Nakasalubong ng expedition mo ang isang alien invasion fleet at nag-uulat ito
  ng matitinding laban!
sys_expe_attack_2_3_2: >-
  Isang malaking grupo ng mga crystalline na barko na hindi alam ang pinagmulan
  ang direktang tumatama sa landas ng expedition fleet natin. Dapat tayong
  maghanda sa pinakamasama.
sys_expe_attack_2_3_3: >-
  Nahirapan kami nang kaunti sa tamang pagbigkas ng diyalekto ng lahing alien.
  Aksidenteng sumigaw ang diplomat natin ng 'Fire!' sa halip na 'Peace!'
sys_expe_attackname_1: Mga Pirata
sys_expe_attackname_2: Mga Alien
