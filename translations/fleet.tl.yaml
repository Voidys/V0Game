sys_expe_depleted_max_1: >-
  Entry mula sa logbook ng communications officer: Kung sakaling makaramdam
  kami ng panganib, puwede kaming laging makipagsanib-puwersa sa ibang mga
  expedition na lumilipad dito.
sys_expe_depleted_max_2: >-
  Entry mula sa logbook ng communications officer: Kung magpapatuloy ito,
  kakailanganin na naming maglagay ng mga navigation buoy para mapamahalaan ang
  trapikong ito.
sys_expe_depleted_max_3: >-
  Entry mula sa logbook ng communications officer: Baka mas makabubuting
  magbukas na lang ng souvenir shop dito kaysa magpadala pa ng isa pang
  expedition.
sys_expe_depleted_med_1: >-
  Entry mula sa logbook ng communications officer: Nakakita kami ng mga bakas
  ng ilang expedition fleet sa lugar. Pauwi na kami.
sys_expe_depleted_med_2: >-
  Entry mula sa logbook ng communications officer: Nakipag-ugnayan kami nang
  magiliw sa radyo sa ilang ibang expedition sa sector na ito.
sys_expe_depleted_med_3: >-
  Entry mula sa logbook ng communications officer: Ipinagdiwang namin ang
  pagtatapos ng expedition kasama ang crew ng isa pang expedition fleet na
  naglalakbay sa parehong sector. Wala rin silang bagong maiulat.
sys_expe_depleted_min_1: >-
  Entry mula sa logbook ng communications officer: Mukhang may mga tao nang
  nakarating sa bahaging ito ng galaxy.
sys_expe_depleted_min_2: >-
  Entry mula sa logbook ng communications officer: Nakakita kami ng mga labi
  ng lumang spaceship. Hindi kami ang unang narito.
sys_expe_depleted_min_3: >-
  Entry mula sa logbook ng communications officer: Muntik na kaming makabanggaan
  ng isa pang expedition fleet. Hindi ko akalaing may iba pang tao rito.
sys_expe_depleted_not_1: >-
  Entry mula sa logbook ng communications officer: Mukhang hindi pa
  nasasaliksik ang bahaging ito ng universe.
sys_expe_depleted_not_2: >-
  Entry mula sa logbook ng communications officer: Napakagandang pakiramdam
  maging unang naglalakbay sa isang hindi pa nasasaliksik na sector.
sys_expe_feqeuence_few: Mahigit 10 expedition sa nakaraang 24 oras
sys_expe_feqeuence_many: Mahigit 50 expedition sa nakaraang 24 oras
sys_expe_feqeuence_medium: Mahigit 25 expedition sa nakaraang 24 oras
sys_expe_found_goods: '%s %s ang namina.'
sys_expe_found_ress_1_1: >-
  Nakatuklas ang expedition mo ng maliit na asteroid cluster na may mga
  resource na puwedeng kunin.
sys_expe_found_ress_1_2: >-
  Sa isang malayong planetoid, may natagpuang ilang madaling abutin na resource
  field at matagumpay na nakuha ang mga raw material.
sys_expe_found_ress_1_3: >-
  Natisod ng expedition mo ang napakaluma nang mga labi ng spaceship mula sa
  isang matagal nang labanan. May ilang piyesang nailigtas at na-recycle.
sys_expe_found_ress_1_4: >-
  Nakatuklas ang expedition ng planetang kontaminado ng radiation na may
  lubhang nakalalasong atmosphere. Gayunpaman, ipinakita ng mga scan na
  maraming raw material ang planetang ito. Gumamit ng mga automated drone para
  subukang makakuha ng pinakamaraming resource hangga't kaya.
sys_expe_found_ress_2_1: >-
  Nakahanap ang expedition mo ng sinaunang freighter convoy na puno ang karga
  pero walang tao. May ilang resource na nakuha.
sys_expe_found_ress_2_2: >-
  Nakahanap ang expedition mo ng malalaking deposito ng raw material sa isang
  maliit na buwan na may sarili nitong atmosphere. Kasalukuyang kinukuha ng crew
  ang kayamanang ito.
sys_expe_found_ress_2_3: >-
  Nakasalubong namin ang maliit na convoy ng mga sibilyang barko na lubhang
  nangangailangan ng pagkain at gamot. Kapalit nito, nakatanggap kami ng
  malaking halaga ng kapaki-pakinabang na resource.
sys_expe_found_ress_3_1: >-
  Iniulat ng expedition fleet mo ang pagkatuklas ng malaking labi ng alien
  na barko. Bagaman wala silang magawa sa teknolohiya nito, nabuwag ang barko
  sa magkakahiwalay na bahagi, na nagbigay ng mahahalagang raw material.
sys_expe_found_ress_3_2: >-
  Naglalaman ng napakaraming raw material ang asteroid belt sa paligid ng
  isang hindi kilalang planeta. Napuno ng expedition fleet ang mga
  imbakan nito!
sys_expe_found_ress_logbook_1: >-
  Entry mula sa logbook ng first officer: Ginamit namin ang bawat bakanteng
  espasyo, pero hindi pa rin namin nadala ang lahat ng resource na nakita namin.
sys_expe_found_ress_logbook_2: >-
  Entry mula sa logbook ng first officer: Kung may ilan pa sana kaming cargo
  ship! Ngayon, kailangan naming iwan ang napakaraming resource.
sys_expe_found_ress_logbook_3: >-
  Entry mula sa logbook ng first officer: Itinapon na namin ang lahat ng hindi
  na namin kailangan, pero hindi pa rin kami makagawa ng sapat na espasyo para
  sa lahat ng resource na nakita namin.
sys_expe_found_ress_logbook_4: >-
  Entry mula sa logbook ng first officer: Kahit ginawa na naming imbakan ang
  cafeteria at lahat ng lounge, hindi pa rin namin madala ang lahat ng
  resource na nakita namin.
sys_expe_found_ships_1_1: >-
  Natuklasan namin ang mga labi ng naunang expedition! Sinusuri ng mga technician
  namin kung may mga wreck na maibabalik sa paggana.
sys_expe_found_ships_1_2: >-
  May nakita kaming abandonadong base ng pirata. May ilang lumang barko pa sa
  hangar. Sinusuri ng mga technician namin kung magagamit pa ang ilan sa mga
  barko.
sys_expe_found_ships_1_3: >-
  Nakahanap ang expedition namin ng planetang halos tuluyang nawasak ng mga
  digmaan. Naglutangan sa orbit ang iba't ibang labi ng barko. Sinubukang
  ayusin ng mga technician ang ilan sa mga ito. Baka may matutunan pa kami
  tungkol sa nangyari rito.
sys_expe_found_ships_1_4: >-
  Natisod ng expedition ang lumang starbase na mukhang matagal nang
  inabandona. May ilang barkong natagpuan sa hangar ng kuta. Nagawa ng mga
  technician na paliparin ulit ang ilan sa mga ito.
sys_expe_found_ships_2_1: >-
  Nakita namin ang mga labi ng isang armada. Agad na sumakay ang mga
  technician ng expedition sa mga barkong bahagyang buo pa at naayos nila ang
  ilan sa mga ito.
sys_expe_found_ships_2_2: >-
  Natuklasan ng expedition namin ang isang lumang automatic shipyard na may
  ilang barkong nasa production phase pa. Matapos maibalik ang suplay ng energy
  ng shipyard, nagtrabaho ang mga technician namin para tapusin ang pagtatayo
  ng mga ito.
sys_expe_found_ships_3_1: >-
  Nakahanap kami ng napakalaking sementeryo ng mga barko. Nagawa ng ilang
  technician ng expedition na paandarin ulit ang isa o dalawang barko.
sys_expe_found_ships_3_2: >-
  Natuklasan namin ang isang planetang may mga labi ng sibilisasyon. May isa
  pang napakalaking ship station na buo pa na namataan mula sa kalawakan.
  Bumaba sa ibabaw ang ilan sa mga technician at piloto namin para alamin kung
  may ilang barkong maisasalba.
sys_expe_found_ships_logbook_1: >-
  Entry mula sa logbook ng engine room officer: Kung may dinala pa sana kaming
  ilang barko, madali sana naming naiuwi ang ilan sa mga gandang iyon!
sys_expe_found_ships_logbook_2: >-
  Entry mula sa logbook ng engine room officer: Sa kasamaang-palad, wala kaming
  kapasidad para maibalik ang lahat ng barkong natuklasan namin sa misyong ito.
sys_expe_found_ships_logbook_3: >-
  Entry mula sa logbook ng engine room officer: Sa kasamaang-palad, wala kaming
  sapat na kapasidad para maiuwi ang lahat ng barkong nahanap namin.
sys_expe_found_ships_nothing: Walang barkong natagpuan.
sys_expe_lost_fleet_1: >-
  Ang tanging natira sa expedition ay ang sumusunod na radio message: Zzzrrt
  Diyos ko!...Krrrzzzzt ang zrrrtrzt nakikita krgzzzz oo mula sa paano
  Krzzzzzzzztzzzz...
sys_expe_lost_fleet_2: >-
  Ang huling natanggap namin mula sa expedition ay ilang hindi kapani-paniwalang
  magagandang close-up ng nagbubukas na black hole.
sys_expe_lost_fleet_3: >-
  Isang nuclear breach sa isa sa mga command ship ang nagdulot ng chain
  reaction na sumira sa buong expedition sa isang nakamamanghang pagsabog.
sys_expe_lost_fleet_4: >-
  Hindi bumalik ang expedition fleet mula sa hyperspace jump nila. Pinag-iisipan
  pa rin ng mga scientist natin kung ano ang maaaring nangyari, pero mukhang
  tuluyan nang nawala ang fleet.
sys_expe_nothing_1: >-
  Walang kapana-panabik na naiuwi ang expedition na ito maliban sa ilang
  kakaibang maliliit na hayop mula sa isang hindi kilalang planetang latian.
sys_expe_nothing_2: >-
  Nakakuha ang expedition mo ng magagandang larawan ng isang supernova. Pero
  wala talagang bagong natuklasan sa expedition na ito. Ngunit malaki ang
  tsansa nitong manalo ng Best Picture in the Universe competition ngayong
  taon.
sys_expe_nothing_3: >-
  Isang kakaibang computer virus ang nagpahina sa navigation pagkaalis sa solar
  system. Dahil dito, paikot-ikot na lumipad ang buong expedition fleet sa
  buong oras. Hindi na kailangang sabihin, hindi masyadong matagumpay ang
  expedition.
sys_expe_nothing_4: >-
  Isang life form na purong energy ang nagpatitig sa lahat ng miyembro ng
  expedition sa mga nakakahipnotismong simbolo sa kanilang screen sa loob ng ilang
  araw. Nang malinaw na ulit ang isip ng karamihan, kinailangang
  ikansela ang expedition dahil sa kakulangan ng deuterium.
sys_expe_nothing_5: >-
  Well, alam na namin ngayon na ang mga Class 5 na pulang anomalya ay hindi
  lang nagdudulot ng magulong epekto sa mga sistema ng barko, kundi puwede ring
  magdulot ng malawakang hallucination sa crew. Sa kasamaang-palad, wala nang
  ibang natuklasan sa expedition na ito.
sys_expe_nothing_6: >-
  Sa kabila ng pangako sa simula ng mga scan sa sector na ito, sa
  kasamaang-palad, bumalik kaming walang dala.
sys_expe_nothing_7: >-
  Marahil hindi dapat ipinagdiwang ang kaarawan ng kapitan sa malayong planetang
  ito. Isang masamang hemorrhagic fever ang nagpadala sa karamihan ng crew sa
  sickbay, at dahil sa matinding kakulangan ng tauhan, nabigo ang expedition.
sys_expe_nothing_8: >-
  Wala nang ibang natagpuan ang expedition mo kundi ang napakalawak na kawalan
  ng kalawakan. Walang kahit maliit na asteroid, o radiation, o particle, o
  anupaman na magpapaganda man lang nang kaunti sa expedition na ito.
sys_expe_nothing_9: >-
  Halos wasakin ng reactor malfunction sa command ship ang buong expedition.
  Buti na lang, mahuhusay ang mga technician at napigilan ang pinakamasama.
  Gayunpaman, napakatagal ng repair kaya bumalik ang expedition nang walang
  nakamit.
sys_expe_report: Expedition report
sys_expe_report_msg: 'Expedition report ng fleet ng %s %s sa %s:'
sys_expe_time_fast_1: >-
  Isang hindi inaasahang feedback loop sa mga energy coil ng propulsion system
  ang nagpabilis sa pagbalik ng expedition, kaya mas maaga itong dumating kaysa
  inaasahan. Gayunpaman, ipinapakita ng mga paunang ulat na wala itong ibang
  maiulat.
sys_expe_time_fast_2: >-
  Ginamit ng medyo matapang na bagong commander ang isang hindi matatag na
  wormhole para paikliin ang pagbalik - at nagtagumpay! Gayunpaman, walang
  bagong natuklasan sa expedition mismo.
sys_expe_time_fast_3: >-
  Walang iniulat na anomalya ang expedition mo sa sector na sinaliksik. Pero
  nakasalubong ng fleet ang solar wind sa pagbalik, na lubhang nagpabilis sa
  biyahe. Uuwi na ngayon ang expedition mo nang bahagyang mas maaga kaysa
  inaasahan.
sys_expe_time_slow_1: >-
  Isang malaking pagkakamali ng navigator ang nagdala sa fleet sa maling lugar
  nang tuluyan. Dahil dito, mas natagalan ang pagbalik.
sys_expe_time_slow_2: >-
  Sa mga dahilang hindi pa rin alam, tuluyang nagkamali ang jump ng fleet.
  Halos mapunta sila sa puso ng isang bituin! Buti na lang, napunta sila sa
  kilalang system, pero mas matatagalan ang pagbalik kaysa sa orihinal na
  plano.
sys_expe_time_slow_3: >-
  Mukhang binabagabag pa rin ng ilang bug ang bagong navigation module. Hindi
  lang tuluyang maling direksyon ang tinahak ng expedition fleet, naubos pa
  nito ang lahat ng deuterium! Bigo, pauwi na ngayon ang expedition gamit ang
  reserbang lakas.
sys_expe_time_slow_4: >-
  Pumasok ang expedition mo sa sector na may matitinding particle storm. Na-overload
  nito ang mga energy storage system, kaya pumalya ang mga pangunahing sistema
  ng lahat ng barko. Nagawa ng mga mekaniko mo na pigilan ang pinakamasama,
  pero bibiyahe na ngayon pabalik ang expedition nang may malaking
  pagkaantala.
sys_expe_time_slow_5: >-
  Nabangga ng flagship ng expedition fleet mo ang isang alien na sasakyan na
  biglang lumundag sa fleet nang walang babala. Sumabog ang alien na barko, at
  malaki ang pinsala sa flagship. Kapag natapos na ang pinakamabibigat na
  repair, magsisimula nang bumalik ang mga barko mo, dahil hindi
  maipagpapatuloy ang expedition sa kasalukuyan nitong kondisyon.
sys_expe_time_slow_6: >-
  Binaluktot ng stellar wind ng isang red giant ang jump ng expedition, kaya
  tuluyang nagkamali ang mga navigation system sa pagkalkula ng pagbalik.
  Dahil dito, napunta ang expedition sa napakalawak na kawalan sa pagitan ng mga
  hindi pamilyar na bituin.
