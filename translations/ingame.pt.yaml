Achievement_text:
  '1': Tiveste uma noite inteira só para ti e não acertaste um único tiro.
  '2': Tiveste frotas em movimento sem parar durante 90 dias.
  '3': Perdeste a tua frota com o idioma definido para «Francês».
  '4': Pesquisa Tecnologia de Iões 10.
  '5': Pesquisa Tecnologia de Gravitação 2, só porque podes.
  '6': Um dos teus ataques voltou com apenas 1 de metal, 1 de cristal e 1 de deutério.
  '7': Derrota uma frota de naves piratas ou alienígenas com um total de pelo menos 10 000 naves. O espaço é nosso!
  '8': Aparece no Strammtisch (terças às 20h00 no Discord).
  '9': Constrói a tua primeira Estrela da Morte.
  '10': Destruir a lua de um jogador.
  '11': Joga 14 dias exclusivamente no telemóvel.
  '12': A tua frota foi destruída por um buraco negro na tua primeira expedição.
  '13': Envia a tua frota para longe com menos de 5 segundos para um ataque que se aproxima chegar.
  '14': Perde 10 frotas para buracos negros. O vazio tem fome.
  '15': Falha a criação de uma lua num planeta após 10 tentativas. Melhor sorte para a próxima.
  '16': Mais de 250 dos teus recicladores voltaram vazios.
  '17': Coloca pelo menos 5000 Lançadores de Mísseis numa única ordem de construção.
  '18': Queima 5 milhões de deutério como combustível num único planeta em 24 horas.
  '19': Pesquisa Tecnologia de Blindagem 3.
  '20': Pesquisa Tecnologia de Blindagem 6.
  '21': Pesquisa Tecnologia de Blindagem 9.
  '22': Pesquisa Tecnologia de Blindagem 12.
  '23': Pesquisa Tecnologia de Blindagem 15.
  '24': Pesquisa Tecnologia Laser 12.
  '25': Adere aos Recordes.
  '26': Elimina o planeta que te dá mais pontos (pelo menos 100 000 pontos).
  '27': Pesquisa Rede Intergaláctica de Pesquisas 1.
  '28': Melhora os três armazéns de uma lua para, pelo menos, o nível 3.
  '29': Coletiviza a frota de um jogador com mais pontos com um ACS de 5 jogadores.
  '30': Repele sozinho um ACS de 5 jogadores.
  '31': Manda um jogador para o modo de férias com o teu ataque.
  '32': Ataca 1000 planetas com o tema «SetSail». Arr!
  '33': Volta do modo de férias.
  '34': Sê atacado pela primeira vez. Bem-vindo ao universo.
  '35': Ataca um jogador ativo com menos de 1/10 dos teus pontos.
  '36': "Receber uma mensagem que contenha um dos seguintes blocos:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Sê aniquilado por um ACS de 5 jogadores.
  '38': Ataca membros da tua própria aliança. Fogo amigo, alguém?
  '39': Ataca alguém com exatamente 42 naves.
  '40': Coloniza um planeta a pelo menos meio universo de distância.
  '41': Bloqueia um slot de frota durante uma semana com uma má oferta do mercado.
  '42': Aparece 4 vezes no Battle Hall do lado perdedor.
  '43': Ganha uma batalha com a conta marcada como Inativa, num dos teus planetas onde tenha chegado antes uma frota com mais de 7 dias de voo.
  '44': Produz um recurso num planeta durante mais de 7 dias com menos de 100% de energia.
  '45': Ganha um ataque contra um jogador que esteja no top 5 de defesa.
  '46': Ativa a proteção anti-bash ao disparar mísseis interplanetários.
  '47': Destrói 5 luas.
  '48': Perde 5 Estrelas da Morte a tentar destruir luas. Ai.
  '49': Demole uma colónia pouco depois de a criares.
  '50': Perde todos os teus Satélites Solares num planeta com energia suficiente para pesquisar Tecnologia de Gravitação, sem a teres pesquisado.
  '51': Gasta todo o teu deutério a navegar na vista Galáxia.
  '52': Constrói uma Estrela da Morte sem teres construído antes outras naves de combate (Caça Ligeiro, Caça Pesado, Cruzador, Nave de Batalha, Bombardeiro, Destruidor ou Intercetor).
  '53': Tem o nível mais alto em 5 pesquisas ao mesmo tempo.
  '54': Faz um ataque a um jogador ativo chegar a 01/01 às 00:00:00.
  '55': Conquista especial
