Achievement_text:
  '1': 'Пусть 5 твоих атак прибудут между полуночью и 6 утра за одну ночь, и ни одну из них ты не выиграешь.'
  '2': У тебя 90 дней подряд не прекращалось движение флотов.
  '3': Ты потерял флот, когда в настройках стоял французский язык.
  '4': Исследуй Ионную технологию до 10 уровня.
  '5': Исследуй Гравитационную технологию до 2 уровня — просто потому, что можешь.
  '6': Одна из твоих атак вернулась всего с 1 металлом, 1 кристаллом и 1 дейтерием.
  '7': Победи флот пиратов или чужих общей численностью не менее 10 000 кораблей. Космос наш!
  '8': Приди на Strammtisch (по вторникам в 20:00 в Discord).
  '9': Построй свою первую Звезду смерти.
  '10': Уничтожь луну другого игрока.
  '11': Играй 14 дней подряд только с телефона.
  '12': Твой флот был уничтожен чёрной дырой в первой же экспедиции.
  '13': Отправь флот в полёт, когда до прилёта вражеской атаки остаётся меньше 5 секунд.
  '14': Потеряй 10 флотов в чёрных дырах. Пустота голодна.
  '15': 'Не получи свою первую луну за 10 боёв при максимальном шансе луны.'
  '16': Больше 250 твоих Переработчиков вернулись пустыми.
  '17': Поставь в очередь не менее 5000 Ракетных установок одним заказом.
  '18': Сожги 5 миллионов дейтерия как топливо на одной планете за 24 часа.
  '19': Исследуй Броню космических кораблей до 3 уровня.
  '20': Исследуй Броню космических кораблей до 6 уровня.
  '21': Исследуй Броню космических кораблей до 9 уровня.
  '22': Исследуй Броню космических кораблей до 12 уровня.
  '23': Исследуй Броню космических кораблей до 15 уровня.
  '24': Исследуй Лазерную технологию до 12 уровня.
  '25': Согласись на участие в рекордах.
  '26': Удали планету, которая приносит тебе больше всего очков (не менее 100 000 очков).
  '27': Исследуй Межгалактическую исследовательскую сеть до 1 уровня.
  '28': Улучши все три хранилища на луне минимум до 3 уровня.
  '29': «Коллективизируй» флот игрока с бо́льшим числом очков атакой САБ из 5 игроков.
  '30': Отбей атаку САБ из 5 игроков в одиночку.
  '31': Загони игрока своей атакой в режим отпуска.
  '32': Ограбь 1000 планет с темой «SetSail». Арр!
  '33': Вернись из режима отпуска.
  '34': Тебя впервые атаковали. Добро пожаловать во вселенную.
  '35': Атакуй активного игрока, у которого меньше 1/10 твоих очков.
  '36': "Получи сообщение, содержащее одно из следующих слов:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Тебя разнёс САБ из 5 игроков.
  '38': Атакуй членов своего альянса. Огонь по своим, кто-нибудь?
  '39': Атакуй кого-нибудь ровно 42 кораблями.
  '40': Колонизируй планету, которая находится как минимум на полвселенной от тебя.
  '41': Заблокируй слот флота на неделю неудачным предложением на рынке.
  '42': Попади в Зал боёв 4 раза на стороне проигравших.
  '43': Выиграй бой, пока твой аккаунт помечен как неактивный, на своей планете, куда ранее прибыл флот со временем полёта более 7 дней.
  '44': Добывай ресурс на планете более 7 дней при энергии ниже 100%.
  '45': Выиграй атаку на игрока из топ-5 по обороне.
  '46': Сработай защиту от башинга, запустив межпланетные ракеты.
  '47': Уничтожь 5 лун.
  '48': Потеряй 5 Звёзд смерти при попытках уничтожить луны. Больно.
  '49': Снеси колонию вскоре после её создания.
  '50': Потеряй все Солнечные спутники на планете, где достаточно энергии для исследования Гравитационной технологии, не исследовав её.
  '51': Потрать весь дейтерий на просмотр Галактики.
  '52': Построй Звезду смерти, не построив до этого других боевых кораблей (Лёгкий истребитель, Тяжёлый истребитель, Крейсер, Линкор, Бомбардировщик, Уничтожитель или Линейный крейсер).
  '53': Держи максимальный уровень сразу в 5 исследованиях.
  '54': Рассчитай атаку на активного игрока так, чтобы она прилетела 01.01 в 00:00:00.
  '55': Особое достижение
  '56': 'Достигни 15-го уровня гиперпространственного двигателя.'
  '57': 'Достигни 15-го уровня астрофизики.'
  '58': 'Исследуй каждую технологию (кроме гравитона) хотя бы раз.'
  '59': 'Подними каждое исследование (кроме гравитона) до 10-го уровня.'
  '60': 'Накопи 1 000 000 000 одного ресурса на одной планете или луне.'
  '61': 'Имей одновременно 1000 солнечных спутников на одной планете.'
  '62': 'Застрой каждое поле планеты, имеющей не менее 250 полей.'
  '63': 'Улучши хранилища металла, кристалла и дейтерия до 15-го уровня на одной планете.'
  '64': 'Имей шахту металла 30-го уровня или выше на 9 планетах.'
  '65': 'Запусти один заказ на строительство длительностью более 30 дней.'
  '66': 'Пусть другие игроки купят 50 твоих предложений на рынке.'
  '67': 'Выиграй оборону против атакующих, стоимость которых минимум в 10 раз выше твоего флота и обороны (стоимость атакующих не менее 1 000 000 ресурсов).'
  '68': 'Выиграй атаку, в которой уничтожено не менее 1000 вражеских единиц, а ты не потерял ни одной.'
  '69': 'Сведи бой вничью после максимального числа раундов, при этом каждая сторона теряет не менее 10 000 единиц.'
  '70': 'Подвергнись атаке на планете без кораблей и обороны, так что нападающий ничего не награбит.'
  '71': 'Получи луну после боя, у которого был всего 1 % шанс на луну.'
  '72': 'Уничтожь одной атакой межпланетных ракет не менее 100 единиц обороны.'
  '73': 'Уничтожь за один бой на своей планете не менее 100 вражеских шпионских зондов.'
  '74': 'Награбь в сумме 1 000 000 000 ресурсов.'
  '75': 'Переработай в сумме 1 000 000 000 ресурсов.'
  '76': 'Восстанови в сумме 1000 кораблей из полей обломков.'
  '77': 'Заработай 1000 очков чести.'
  '78': 'Впервые стань изгоем.'
  '79': 'Прими участие в качестве атакующего в 25 выигранных совместных атаках.'
  '80': 'Испытай каждый возможный исход экспедиции хотя бы раз.'
  '81': 'Отправь 1000 экспедиций.'
  '82': 'Выиграй бой в экспедиции против большого флота пришельцев.'
  '83': 'Найди большое количество ресурсов в 50 экспедициях.'
  '84': 'Отправь флот в полёт в одну сторону длительностью более 24 часов.'
  '85': 'Пусть флот прибудет к цели 29 февраля.'
  '86': 'Потеряй весь атакующий флот в пятницу 13-го.'
  '87': 'Пусть две твои атаки (не совместные) прибудут на одну цель в одну и ту же секунду.'
  '88': 'Имей одновременно флоты в пути в каждую галактику вселенной.'
  '89': 'Пройди обучение.'
  '90': 'Имей одновременно действующие договоры с 3 другими альянсами (получают все члены альянса).'
  '91': 'Создай 5 вики-страниц альянса.'
  '92': 'Имей 10 принятых запросов в друзья.'
  '93': 'Будь №1 в рейтинге общих очков 7 дней подряд.'
  '94': 'Имей одновременно 100 Звёзд смерти на одной планете или луне.'
  '95': 'Займи все слоты планет, которые позволяет твоя астрофизика (минимум 9), каждая планета минимум с 200 полями.'
  '96': 'Получи ещё 50 достижений.'
