op_activate_vacation_mode_confirm: Отключить режим отпуска в течение 48 часов не получится. Точно включить?
op_activate_vacation_mode_descrip: Режим отпуска защищает тебя во время долгого отсутствия. Включить его можно, только когда ни один из твоих флотов не в пути. Пока он активен, он защищает тебя от новых атак. Но уже начатые атаки продолжатся, а дружественные флоты, которые держатся на твоих планетах, будут отправлены обратно! Добыча ресурсов, строительство зданий, заказы на верфи и исследования на это время приостанавливаются и потом возобновляются. Выключить режим отпуска в первые 48 часов нельзя!
