abuse_graph_info: 'ผู้เล่นที่เชื่อมกันด้วยการไหลของมูลค่าในช่วง %s วันที่ผ่านมา (ช่วงคงที่): การขนส่ง การยึดกำลัง การโอนยาน (ตามราคาการสร้าง) การค้าในตลาด (ทั้งสองฝั่ง) และของที่ปล้นจากการโจมตี รวมทั้งสองทิศทาง จะเชื่อมเฉพาะคู่ที่มีการเคลื่อนย้ายอย่างน้อย %s หน่วยโลหะ และมีการไหลอย่างน้อย %s ครั้ง แสดงกลุ่มที่เชื่อมกันตั้งแต่สองคนขึ้นไป (สูงสุด %s กลุ่มตามมูลค่า) สุทธิ = มูลค่าของคู่ที่ฝั่งเดียวที่สุดในกลุ่ม (สัดส่วนของมูลค่ารวม) ป้ายการเชื่อมโยงแสดงว่าสมาชิกมี IP อุปกรณ์ หรือกลุ่มมัลติเดียวกับสมาชิกคนอื่นหรือไม่ แถวจะถูกอ่านโดยจำกัดจำนวนต่อแหล่งข้อมูล'
