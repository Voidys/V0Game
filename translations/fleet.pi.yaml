sys_defender_won: Der Verteidiger hat die Schlacht gewonnen!
sys_destroyed: Zerstört
sys_destruc_echec: >-
  Erdbeben erschüttern den Hafen. Doch etwas geht schief: Die schwimmenden
  Inseln explodieren und zerfallen in tausende Einzelteile. <br>Die Druckwelle
  erreicht die komplette Flotte.
sys_destruc_lune: 'Die Wahrscheinlichkeit einer Inselzerstörung beträgt: %d%% '
sys_destruc_mess1: Die schwimmenden Festungen richten ihre gewaltigen Kanonen auf die Insel.
sys_destruc_null: >-
  Die schwimmenden Festungen können ihre volle Leistung nicht aufbauen.<br> Die
  Insel wird nicht zerstört.
sys_destruc_reussi: >-
  Die Kugeln der schwimmenden Festung erreichen die Insel und zerfetzen
  sie.<br>Die gesamte Insel wurde zerstört.
sys_destruc_rip: 'Die Wahrscheinlichkeit der Selbstzerstörung der Flotte beträgt: %d%%'
sys_destruc_stop: Der Verteidiger hat die Inselzerstörung erfolgreich abgeblockt.
sys_destruc_title: Folgende Flotten stehen sich zur Inselzerstörung gegenüber am
sys_expe_attack_1_1_1: >-
  Ein paar anscheinend sehr verzweifelte Piraten haben versucht, unsere
  Expeditionsflotte zu kapern.
sys_expe_attack_1_1_2: >-
  Einige primitive Piraten greifen uns mit Schiffen an, die nicht einmal
  ansatzweise die Bezeichnung Schiff verdient haben. Sollte der Beschuss ernst
  zu nehmende Ausmaße annehmen, sehen wir uns gezwungen das Feuer zu erwidern.
sys_expe_attack_1_1_3: >-
  Wir haben ein paar Signale sehr betrunkener Piraten entschlüsselt. Anscheinend
  sollen wir überfallen werden.
sys_expe_attack_1_1_4: >-
  Wir mussten uns gegen einige Piraten wehren, die zum Glück nicht allzu
  zahlreich waren.
sys_expe_attack_1_1_5: >-
  Unsere Expeditionsflotte meldet, dass ein gewisser Edward Thatch und seine
  wilde Meute die bedingungslose Kapitulation unserer Flotte verlangen. Sollten
  sie Ernst machen, werden sie feststellen müssen, dass sich unsere Schiffe
  durchaus zu wehren wissen.
sys_expe_attack_1_2_1: >-
  Deine Expeditionsflotte hatte ein unschönes Zusammentreffen mit einigen
  Piraten.
sys_expe_attack_1_2_2: >-
  Wir sind in den Hinterhalt einiger Freibeuter geraten! Ein Kampf war leider
  unvermeidlich.
sys_expe_attack_1_2_3: >-
  Der Hilferuf, dem die Expedition folgte, stellte sich als böse Falle einiger
  arglistiger Freibeuter heraus. Ein Gefecht war unvermeidlich.
sys_expe_attack_1_3_1: >-
  Die entdeckten Signale stammten nicht von Einheimischen, sondern von einer
  geheimen Piratenbasis! Die Piraten waren von unserer Anwesenheit in ihrem
  Gebiet nicht besonders begeistert.
sys_expe_attack_1_3_2: >-
  Die Expeditionsflotte meldet schwere Kämpfe mit nicht-identifizierten
  Piratenschiffen!
sys_expe_attack_1_3_3: >-
  Wir haben gerade eine dringende Nachricht vom Expeditionskommandanten
  erhalten: "Sie kommen auf uns zu! Sie sind aus dem Nebel gesegelt, zum Glück
  sind es nur Piraten, wir haben also eine Chance, wir werden kämpfen!"
sys_expe_attack_2_1_1: >-
  Deine Expeditionsflotte hatte einen nicht besonders freundlichen Erstkontakt
  mit  Marineflotte.
sys_expe_attack_2_1_2: >-
  Einige anmutende Marineschiffe haben ohne Vorwarnung die Expeditionsflotte
  angegriffen!
sys_expe_attack_2_1_3: Unsere Expedition wurde von einer kleinen Gruppe mariner Schiffe angegriffen!
sys_expe_attack_2_1_4: >-
  Die Expeditionsflotte meldet Kontakt mit unbekannten Schiffen. Die Signale
  sind nicht entschlüsselbar, jedoch begeben sich die fremden Schiffe auf
  Gefechtsstation.
sys_expe_attack_2_2_1: Die Marine greift unsere Expedition an!
sys_expe_attack_2_2_2: Deine Expeditionsflotte hat anscheinend das Hoheitsgebiet der Marine verletzt.
sys_expe_attack_2_2_3: >-
  Die Nachrichten zu unserer Expeditionsflotte ließen auf sich warten.  Soweit
  wir die letzte Botschaft richtig entschlüsselt haben, steht die Flotte unter
  schwerem Feuer – die Aggressoren hatten wohl Flaggen der Marine gehisst.
sys_expe_attack_2_3_1: >-
  Deine Expedition ist in eine Marine-Flotte geraten und meldet schwere
  Gefechte!
sys_expe_attack_2_3_2: >-
  Ein großer Verband mariner Schiffe unbekannter Herkunft hält direkten
  Kollisionskurs mit unserer Expeditionsflotte. Wir müssen nun wohl vom
  Schlimmsten ausgehen.
sys_expe_attack_2_3_3: >-
  Wir hatten ein wenig Schwierigkeiten, den Dialekt der fremden Marinecrew
  richtig auszusprechen. Unser Diplomat sagte versehentlich "Sohn einer Dirne!"
  statt "Hallo!".
sys_expe_attackname_1: Piraten
sys_expe_attackname_2: Marine
sys_expe_back_home: >-
  Deine Flotte ist von der Expedition bei %3$s wieder nach %1$s %2$s
  zurückgekehrt.
sys_expe_back_home_ress: Sie haben %s %s, %s %s und %s %s mitgebracht.
sys_expe_back_home_ships_flound: 'Es wurden folgende Schiffe gefunden:'
sys_expe_back_home_ships_lost: 'Es gingen folgende Schiffe verloren:'
sys_expe_depleted_max_1: >-
  Logbuch Nachtrag des ersten Maats: Wenn wir uns zu unsicher fühlen, können wir
  uns ja mit all den anderen Expeditionen, die hier herum segeln, zusammen tun.
sys_expe_depleted_max_2: >-
  Eintrag aus dem Logbuch des ersten Maats: Wenn das so weitergeht, werden wir
  Navigationsbojen aufstellen müssen, um den ganzen Verkehr zu bewältigen.
sys_expe_depleted_max_3: >-
  Logbucheintrag des ersten Maats: Vielleicht wäre es sinnvoller, hier eine
  Taverne zu eröffnen, als noch eine weitere Expedition zu schicken.
sys_expe_depleted_med_1: >-
  Logbuch Nachtrag des ersten Maats: Es wurden Anzeichen für die Präsenz anderer
  Expeditionsflotten gefunden.
sys_expe_depleted_med_2: >-
  Eintrag aus dem Logbuch des ersten Maats: Wir haben freundlichen Signalkontakt
  mit einigen anderen Expeditionen in diesem Meer hergestellt.
sys_expe_depleted_med_3: >-
  Eintrag aus dem Logbuch des ersten Maats: Wir haben den Abschluss der
  Expedition mit der Crew einer anderen Expeditionsflotte gefeiert, die im
  gleichen Sektor unterwegs war. Sie haben nichts Neues zu berichten.
sys_expe_depleted_min_1: >-
  Logbuch Nachtrag des ersten Maats: Es scheint so, als ob bereits ein Mensch in
  diesem Bereich der Meere gewesen wäre.
sys_expe_depleted_min_2: >-
  Eintrag aus dem Logbuch des ersten Maats: Wir haben Trümmer von alten Schiffen
  gefunden. Wir sind nicht die ersten hier.
sys_expe_depleted_min_3: >-
  Logbucheintrag des ersten Maats: Wir hätten beinahe eine Kollision mit einer
  anderen Expeditionsflotte gehabt. Ich habe nicht geglaubt, dass es hier noch
  andere geben würde.
sys_expe_depleted_not_1: >-
  Logbuch Nachtrag des ersten Maats: Dieser Bereich des Meeres ist wohl noch
  nicht erkundet worden.
sys_expe_depleted_not_2: >-
  Logbuch Nachtrag des ersten Maats: Es ist ein erhebendes Gefühl, der Erste in
  einem unerforschten Meer zu sein.
sys_expe_feqeuence_few: Mehr als 10 Expeditionen in den letzen 24 Stunden
sys_expe_feqeuence_many: Mehr als 50 Expeditionen in den letzen 24 Stunden
sys_expe_feqeuence_medium: Mehr als 25 Expeditionen in den letzen 24 Stunden
sys_expe_found_goods: Es wurden %s %s abgebaut.
sys_expe_found_ress_1_1: >-
  Deine Expedition hat einen kleinen haufen Treibgut entdeckt, aus dem einige
  Ressourcen gewonnen werden können.
sys_expe_found_ress_1_2: >-
  Auf einer abgelegen Insel wurden einige leicht zugängliche Ressourcenfelder
  gefunden und erfolgreich Rohstoffe gewonnen.
sys_expe_found_ress_1_3: >-
  Deine Expedition stieß auf sehr alte Schiffwracks einer längst vergangenen
  Schlacht. Einzelne Komponenten konnte man bergen und recyceln.
sys_expe_found_ress_1_4: >-
  Die Expedition stieß auf einen versteckten Schatz der von Skeletten verteidigt
  wird. Deine Papageien haben eine Schleichroute über die du dich an den
  Skeletten vorbei schleichen kannst um den Schatz zu bergen
sys_expe_found_ress_2_1: >-
  Deine Expedition fand einen uralten, voll beladenen, aber menschenleeren
  Handelskonvoi. Einige Ressourcen konnten geborgen werden.
sys_expe_found_ress_2_2: >-
  Auf einer kleinen Insel fand deine Expedition große Rohstoffvorkommen. Die
  Crew ist dabei diese natürlichen Schätze zu heben.
sys_expe_found_ress_2_3: >-
  Wir haben einen kleinen Konvoi ziviler Schiffe getroffen, die dringend Nahrung
  und Medikamente benötigten. Im Austausch dafür erhielten wir eine ganze Menge
  nützlicher Ressourcen.
sys_expe_found_ress_3_1: >-
  Deine Expeditionsflotte meldet den Fund eines riesigen Marine-Schiffswracks.
  Mit der Schiff selbst konnten sie zwar nichts anfangen, aber das Schiff ließ
  sich in seine Einzelteile zerlegen und dadurch konnte man wertvolle Rohstoffe
  gewinnen.
sys_expe_found_ress_3_2: >-
  Am Strand einer unbekannten Insel liegen Unmengen an Rohstoffen. Die
  Expeditionsflotte meldet volle Lager!
sys_expe_found_ress_logbook_1: >-
  Logbuch Nachtrag des ersten Maats: Wir haben zwar alle freien Plätze voll
  gestopft, konnten aber trotzdem nicht alle gefundenen Ressourcen unterbringen.
sys_expe_found_ress_logbook_2: >-
  Eintrag aus dem Logbuch des ersten Maats: Wenn wir nur ein paar Frachtschiffe
  mehr hätten! Jetzt müssen wir eine Menge Ressourcen zurücklassen.
sys_expe_found_ress_logbook_3: >-
  Logbuch Nachtrag des ersten Maatss: Wir haben zwar alles nicht unbedingt
  notwendige über Bord geworfen, aber trotzdem nicht genügen Platz für alle
  gefunden Ressourcen machen können.
sys_expe_found_ress_logbook_4: >-
  Eintrag aus dem Logbuch des ersten Maats: Auch nachdem wir die Kombüse und
  alle Aufenthaltsräume in Lagerräume umgewandelt haben, können wir immer noch
  nicht alle Ressourcen transportieren, die wir gefunden haben.
sys_expe_found_ships_1_1: >-
  Wir sind auf die Überreste einer Vorgängerexpedition gestoßen! Unsere
  Schiffsbauer schauen, ob sie einige der Wracks wieder Schwimmfähig bekommen
sys_expe_found_ships_1_2: >-
  Wir haben eine verlassene Piratenbasis gefunden. Im Hangar liegen noch einige
  alte Schiffe. Unsere Schiffsbauer schauen nach, ob einige davon noch zu
  gebrauchen sind.
sys_expe_found_ships_1_3: >-
  Unsere Expedition fand ein Insel, die wohl durch anhaltende Kriege fast
  komplett zerstört wurde. In einer Bucht trieben diverse Schiffswracks. Die
  Schiffsbauer versuchen, einige davon zu reparieren. Vielleicht erhalten wir so
  auch Information darüber, was hier geschehen ist.
sys_expe_found_ships_1_4: >-
  Deine Expedition ist auf eine alte Piratenfestung gestoßen, die wohl seit
  Ewigkeiten verlassen ist. In der Werft der Festung wurden ein paar Schiffe
  gefunden. Die Schiffsbauer schauen, ob sie einige davon wieder flott
  bekommen.
sys_expe_found_ships_2_1: >-
  Wir haben die Reste einer Armada gefunden. Die Schiffsbauer der
  Expeditionsflotte haben sich sofort auf die halbwegs intakten Schiffe begeben
  und versuchen, diese wieder instandzusetzen.
sys_expe_found_ships_2_2: >-
  Unsere Expedition stieß auf eine unbemannte, geheime Schiffswerft. Einige
  Schiffe sind noch in der Produktionsphase, und unsere Schiffsbauer versuchen,
  die Schiffe aus der Werft wiederherzustellen.
sys_expe_found_ships_3_1: >-
  Wir haben einen riesigen Schiffsfriedhof gefunden. Einigen Schiffsbauern der
  Expeditionsflotte ist es gelungen, das eine oder andere Schiff wieder in
  Betrieb zu nehmen.
sys_expe_found_ships_3_2: >-
  Wir haben einen Insel mit Resten einer Zivilisation entdeckt. Aus dem Ferne
  ist noch ein riesiger Hafen zu erkennen, der als einziges Gebäude noch intakt
  ist. Einige unserer Techniker und Matrosen haben sich an Land begeben um
  nachzuschauen, ob ein paar der dort abgestellten Schiffe noch zu gebrauchen
  sind.
sys_expe_found_ships_logbook_1: >-
  Logbuch Nachtrag des ersten Maats: Wenn wir doch nur ein paar Schiffe mehr
  dabei gehabt hätten! Dann wäre es ein leichtes gewesen noch mehr von diesen
  Prachtstücken ab zu schleppen.
sys_expe_found_ships_logbook_2: >-
  Logbuch Nachtrag des ersten Maats: Leider haben wir nicht genug Tonnage um all
  die schönen Schiffe nach Hause zu bringen.
sys_expe_found_ships_logbook_3: >-
  Logbuch Nachtrag des ersten Maats: Wir verfügen leider nicht über genügend
  Tonnage, um alle gefundenen Schiffe zurückzubringen.
sys_expe_found_ships_nothing: '- Es konnten keine Schiffe repariert werden.'
sys_expe_lost_fleet_1: >-
  Von der Expedition ist nur noch folgender Logbucheintrag übrig geblieben: Die
  Strömung treibt uns in einen Strudel! Wir geben unser bestes aus dem Strudel
  zu rudern. Der Fall scheint allerdings hoffnungslos!
sys_expe_lost_fleet_2: >-
  Das Letzte, was von dieser Expedition noch gefunden wurde, waren Wrackteile
  die sich im Ozean verteilten.
sys_expe_lost_fleet_3: >-
  Ein Explosion eines Pulverfasses des Führungsschiffes führte zu einer
  Kettenreaktion, die in einer durchaus spektakulären Explosion die gesamte
  Expedition vernichtete.
sys_expe_lost_fleet_4: Die Expeditionsflotte ist in den Weltmeeren verschwunden!
sys_expe_nothing_1: >-
  Als eure Expeditionsflotte an einer vielversprechenden Insel anlegen wollte,
  wurden eure Schiffe von einer unbekannten Affenart mit Kot beworfen. Die Crew
  war tagelang mit schrubben beschäftigt.
sys_expe_nothing_2: >-
  Deine Expedition hat wunderschöne Bilder eines Gewitters gemacht. Wirklich
  neue Erkenntnisse hat diese Expedition jedoch nicht gebracht. Aber man hat
  gute Chancen auf den Bestes-Bild-Der-Weltmeere-Wettbewerb in diesem Jahr.
sys_expe_nothing_3: >-
  Ein seltsamer Parasit legte kurz nach Verlassen des Hafens die Ruder lahm.
  Dies führte dazu, dass die gesamte Expeditionsflotte die ganze Zeit im Kreis
  segelte. Überflüssig zu sagen, dass die Expedition nicht besonders erfolgreich
  war.
sys_expe_nothing_4: >-
  Eine unbekannte Droge die euch ein seltsamer Einheimischer verkauft hat, hat
  dafür gesorgt, dass sämtliche Expeditionsmitglieder tagelang auf hypnotischen
  Strukturen im Holz starrten. Als endlich die Meisten wieder klar im Kopf
  geworden waren, musste die Expedition aufgrund von akutem Rum-Mangel
  allerdings abgebrochen werden.
sys_expe_nothing_5: >-
  Nun, zumindest weiß man jetzt, dass  Strömungsanomalien der Klasse 5 nicht nur
  chaotische Auswirkungen auf die Schiffsruder haben, sondern auch massive
  Übelkeit bei der Crew auslösen können. Viel mehr hat diese Expedition aber
  nicht gebracht.
sys_expe_nothing_6: >-
  Trotz der ersten, vielversprechenden Erkundungen dieses Meeres kommen wir
  leider mit leeren Händen zurück.
sys_expe_nothing_7: >-
  Vielleicht hätte man den Geburtstag des Captains nicht auf dieser abgelegenen
  Insel feiern sollen. Ein fieses Dschungelfieber hat große Teile der Crew
  gezwungen die Expedition in der Krankenstation zu begleiten. Der akute
  Personalausfall führte dazu, dass die Expedition scheiterte.
sys_expe_nothing_8: >-
  Deine Expedition hat, wortwörtlich, mit der Leere des Meeres Bekanntschaft
  gemacht. Es gab nicht einmal einen kleinen Schatz, oder eine Insel, oder
  irgendetwas, dass diese Expedition aufregend gestaltet hätte.
sys_expe_nothing_9: >-
  Ein unachtsamkeit des Navigators des Führungsschiffes hätte beinahe die
  gesamten Expeditionsschiffe kollidieren lassen. Zum Glück waren die Crews mehr
  als fähig und konnten das Schlimmste verhindern.
sys_expe_report: Expeditionsbericht
sys_expe_report_msg: 'Expeditionsbericht der Flotte von %s %s bei %s:'
sys_expe_time_fast_1: >-
  Eine unvorhergesehene Strömung beschleunigte den Rückweg der Expedition, so
  dass sie nun früher als erwartet zurückkehrt. Ersten Meldungen zufolge hat sie
  jedoch nichts Spannendes zu berichten.
sys_expe_time_fast_2: >-
  Der etwas wagemutige neue Navigator nutzte eine selbstgezeichnete Karte, um
  den Rückweg zu verkürzen – mit Erfolg! Jedoch hat die Expedition selbst keine
  neuen Erkenntnisse gebracht.
sys_expe_time_fast_3: >-
  Deine Expedition meldet keinen Besonderheiten in dem erforschten Gewässer.
  Jedoch geriet die Flotte auf der Rückfahrt an den Rand eines Strudels. Dadurch
  wurde die Flotte ziemlich beschleunigt. Deine Expedition kehrt nun etwas
  früher nach Hause.
sys_expe_time_slow_1: >-
  Ein böser Patzer des Navigators führte zu einer Fehlkalkulation beim festlegen
  des Kurses der Expedition. Nicht nur landete die Flotte an einem völlig
  falschen Ort, auch der Rückweg nahm nun erheblich mehr Zeit in Anspruch.
sys_expe_time_slow_2: >-
  Aus bisher unbekannten Gründen, ging die Route der Expeditionsflotte völlig
  daneben. Beinahe wäre man in Tortuga rausgekommen. Zum Glück war der Navigator
  ein erfahrener Mann, und konnte den Kurs noch ändern. Jedoch wird der Rückweg
  länger dauern als ursprünglich gedacht.
sys_expe_time_slow_3: >-
  Der neumodische Kompass hat wohl doch in die falsche Richtung gezeigt. Dein
  Navigator schwört den Händler zur Rechenschaft zu ziehen sobald ihr wieder an
  Land seid.
sys_expe_time_slow_4: >-
  Deine Expedition geriet in eine See mit ausgeprägten Strömungen. Dadurch
  geriet eure Expeditionsflotte vom Kurs ab und trieb in die falsche Richtung.
  Deine Crew konnte nur hilflos zusehen und nach Entkommen aus der Strömung mit
  verzögerung zurückkehren.
sys_expe_time_slow_5: >-
  Das Führungsschiff deiner Expeditionsflotte kollidierte mit einem fremden
  Schiff, das ohne Vorwarnung direkt in die Flotte segelte. Das fremde Schiff
  explodierte und die Schäden am Führungsschiff waren beachtlich. Sobald die
  gröbsten Reparaturen abgeschlossen sind, werden sich deine Schiffe auf den
  Rückweg machen, da in diesem Zustand die Expedition nicht fortgeführt werden
  kann.
sys_expe_time_slow_6: >-
  Der Westwind verfälschte den Kurs der Expedition dermaßen, dass es einige Zeit
  dauerte, den Rückweg zu berechnen. Davon abgesehen gab es in dem Sektor, in
