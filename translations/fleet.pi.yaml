sys_colo_allisok: >-
  Eine deiner Flotten erreicht die Koordinaten %s. Die Siedler beginnen den
  neuen Hafen zu besiedeln.
sys_colo_badpos: >-
  Eine deiner Flotten erreicht die Koordinaten %s. Hier wurde keine
  Siedlungsmöglichkeit gefunden, enttäuscht kehrten deine Siedler zurück.
sys_colo_maxcolo: >-
  Eine deiner Flotten erreicht die Koordinaten %s. Eine Besiedelung ist nicht
  möglich, da du nicht mehr als %d Häfen haben kannst.
sys_colo_mess_from: Kolonisierungsabteilung
sys_colo_mess_report: Kolonisierungsbericht
sys_colo_notech: >-
  Eine deiner Flotten erreicht die Koordinaten %s. Als sich deine Siedler dem
  Hafen näherten, mussten sie feststellen, dass ihre Ausrüstung noch nicht für
  die dort herrschenden Klimabedingungen geeignet war und zuerst
  weiterentwickelt werden muss. Enttäuscht kehrten die Siedler zurück.
sys_colo_notfree: >-
  Eine deiner Flotten erreicht die Koordinaten %s. Als deine Siedler auf den
  Koordinaten ankamen, mussten sie feststellen das es dort bereits einen Hafen
  gibt. Völlig demoralisiert kehrten sie um.
