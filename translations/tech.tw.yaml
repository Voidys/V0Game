longDescription:
  '1': >-
    金屬礦開採礦石，每一個崛起中和已經稱霸的帝國，都是建立在這之上。
  '2': >-
    晶體是電子電路和某些合金的關鍵原料。
  '3': >-
    重氫是你的太空船的燃料，從深海中提取。它是稀有物質，所以相對昂貴。
  '4': >-
    太陽能發電廠把陽光轉換成能源。每座礦場都需要能源才能運轉。
  '6': >-
    預設每級縮短 8% 的研究時間。
  '12': >-
    核融合發電廠透過融合重氫來產生能源。它比太陽能發電廠產出更多能源，但建造成本更高。產出會隨能源科技和電廠自身等級提升。能源產出公式：<br>
    產出能源 = 30 x 核融合發電廠等級 x (1.05 + (0.01 * 能源科技等級))^核融合發電廠等級
  '14': >-
    機器人工廠提供建築機器人，幫忙蓋你的建築。每一級都會加快建築升級。
  '15': >-
    機器人技術的極致。每一級都讓建築、艦船和防禦的建造時間減半。
  '21': '所有艦船和防禦都在行星的太空船廠裡建造。'
  '22': 提供多餘金屬的儲存空間。
  '23': 提供多餘晶體的儲存空間。
  '24': '提供多餘重氫的儲存空間。'
  '31': >-
    你需要研究實驗室才能研究新科技。實驗室等級決定研究速度，以及你能解鎖哪些科技。研究在你開始研究的那顆行星的實驗室進行，成果則對你所有行星都有效。研究進行中時，任何研究實驗室都不能升級。
  '33': >-
    地形改造器擴大行星的可用面積。每一級給你 5 格額外欄位，偶數等級再多 1 格。地形改造器的每一級自己也佔 1 格。<br>建造它需要能源，但能源不會被消耗：你的行星只要產出足夠的量（1 級需要 1,000，之後每升一級翻倍），就算礦場已經在用也一樣。蓋好之後，地形改造器永遠無法拆除。
  '34': "聯盟倉庫讓你用重氫補給駐守在你行星上的友軍艦隊，延長它們的停留時間。從建築頁面打開它：對每支駐守艦隊，你可以選擇 1 小時到倉庫等級那麼多小時，並從你行星的重氫中支付「小時數乘以艦隊每小時駐守成本」。每小時駐守成本是艦隊中艦船基礎燃料消耗總和的十分之一，無條件進位。艦隊可以一再補給，但剩餘停留時間永遠不會超過 32 小時。只有目前在你行星軌道上的其他玩家艦隊可以補給。"
  '35': >-
    修理船塢可以修復在戰鬥中被摧毀、留下殘骸場的艦船。一次修理最多 12 小時，而且最早也要在殘骸場出現後 30 分鐘才能完成。<br>殘骸場一出現，你有 3 天可以開始修理。修理完成後，你必須自己讓艦船重新服役。如果你沒做，它們會在 3 天後自動回歸服役。
  '41': >-
    月球沒有大氣層，剛形成的月球只有一個建築的空間，所以請從月球基地開始。每一級增加 3 格額外欄位，自己佔 1 格。蓋好之後，月球基地永遠無法拆除。
  '42': >-
    感應陣列讓你監視艦隊動向。等級越高，密集陣射程越大：預設是（密集陣等級）^2 - 1 個星系，所以 1 級只涵蓋月球自己的星系。一次掃描花費 5,000 重氫，必須存放在月球上。要掃描的話，從月球打開銀河系檢視，點射程內的行星即可。月球本身無法被密集陣掃描，因為它們沒有大氣層。<br><br>密集陣會顯示從被掃描行星出發或飛往它的艦隊：抵達時、駐守結束時，以及擁有者的艦隊返航時。部署和飛彈永遠不會顯示，飛往該行星的回收或交易航程也不會。
  '43': >-
    躍遷門是巨大的傳送器，能讓大型艦隊毫無時間損失地穿越宇宙。它們不消耗重氫，但這樣無法傳送資源。兩座門都必須準備就緒：跳躍之後，每座門都需要冷卻，預設 1 級是 60 分鐘，隨等級縮短，15 級起降到 10 分鐘。
  '44': >-
    飛彈發射井用來儲存你的飛彈。預設每一級增加 10 格。攔截飛彈佔 1 格，星際飛彈佔 2 格。
  '106': >-
    這項科技讓你蒐集其他行星和月球的情報。當你派出衛星時，你的間諜科技會和目標的比較：你的等級越高，報告資訊越多，衛星被發現的機率越低。衛星越多，能揭露的細節越多，但被發現的風險也越高。在特定的間諜科技等級，你在總覽畫面上也會得知更多外來艦隊的資訊：<br><br><li>0-1 級時，你只看得到有艦隊正在接近你的行星</li><li>2-3 級時，你看得到有多少艘船正在接近</li><li>4-7 級時，你看得到艦隊中有哪些艦船類型</li><li>8 級以上，你看得到艦隊中每種類型各有多少艘船</li>
  '108': >-
    更好的電腦讓你能指揮更多艦隊。每一級電腦科技讓你的最大艦隊數增加一。
  '109': >-
    武器科技讓武器系統更有效。每一級讓所有單位的武器威力增加基礎值的 10%。
  '110': >-
    護盾科技讓艦船和防禦建築的護盾更有效。每一級讓護盾強度增加基礎值的 10%。
  '111': >-
    特殊合金能強化艦船和防禦建築的裝甲。每一級讓裝甲效能增加 10%。
  '113': >-
    掌握各種不同的能源，是許多新科技的關鍵。每一級能源科技也會提高核融合發電廠的能源產出。
  '114': >-
    整合第四和第五維度之後，你可以研究一種更經濟、更高效的新型引擎。
  '115': >-
    開發這種引擎能讓部分艦船更快，但每一級只增加基礎速度的 10%。受影響的艦船：小型運輸艦、大型運輸艦、輕型戰鬥機、回收船和間諜衛星（小型運輸艦和回收船之後會換成更好的引擎）。
  '117': >-
    脈衝引擎依反作用原理運作。進一步開發它能讓部分艦船更快，但每一級只增加基礎速度的 20%：轟炸機、巡洋艦、重型戰鬥機和殖民船，以及換成這種引擎之後的小型運輸艦和回收船。星際飛彈每升一級也會飛得更遠。
  '118': >-
    超空間引擎會扭曲艦船周圍的空間。開發它能讓部分艦船更快，但每一級只增加基礎速度的 30%：戰鬥巡洋艦、戰列艦、毀滅者、死星、黑月、戰鬥運輸艦、化身和戰鬥回收船，以及換成這種引擎之後的轟炸機和回收船。需要超空間科技（3 級）和研究實驗室（7 級）。
  '120': >-
    聚焦的光線產生一道光束，能傷害任何被它擊中的東西。需要研究實驗室（1 級）和能源科技（2 級）。
  '121': '一道致命的加速離子光束，撞擊時造成巨大傷害。'
  '122': >-
    離子科技的進一步發展，加速由超高溫離子產生的高能電漿。撞擊時有毀滅性的效果。
  '123': >-
    不同行星上的研究人員透過這個網路互相溝通。每一級讓多一間實驗室加入你開始研究的那間實驗室。系統會挑選等級最高的實驗室，而且被連結的實驗室本身必須夠高級，能獨立進行該項研究。它們的等級會加總起來計算研究時間。
  '124': >-
    天體物理學研究解鎖殖民和深太空遠征。下列的殖民上限、停留時間和位置都是預設設定；你的宇宙可能不同。<br><br> <li>殖民上限</li> 1-2 級 = 2 顆行星<br> 3-4 級 = 3 顆行星<br> 5-6 級 = 4 顆行星<br> 7-8 級 = 5 顆行星<br> 9-10 級 = 6 顆行星<br> 11-12 級 = 7 顆行星<br> 13-14 級 = 8 顆行星<br> 15-16 級 = 9 顆行星<br> 17-18 級 = 10 顆行星<br> 19-20 級 = 11 顆行星<br> 21 級以上 = 12 顆行星<br><br> <li>遠征欄位</li> 1-3 級 = 1 個遠征<br> 4-8 級 = 2 個遠征<br> 9-15 級 = 3 個遠征<br> 16-24 級 = 4 個遠征<br>（之後每遇到一個平方等級再多一個：25、36、...）<br><br> <li>遠征停留時間</li> 等級 = 最長停留小時數<br><br> <li>可殖民位置</li> 1-3 級 = 4-12<br> 4-5 級 = 3-13<br> 6-7 級 = 2-14<br> 8 級以上 = 1-15
  '131': >-
    每級增加 2% 金屬產量。
  '132': >-
    每級增加 2% 晶體產量。
  '133': >-
    每級增加 2% 重氫產量。
  '134': >-
    每級減少 2% 飛行成本。
  '199': >-
    發射一束集中的重力子粒子，會製造出人工重力場，能摧毀艦船，甚至月球。需要研究實驗室（12 級）。
  '202': >-
    小型運輸艦是靈活的艦船，能快速把資源運到其他行星。<br>在你的脈衝引擎達到 5 級之前，它使用燃燒引擎飛行。從那之後它會換成脈衝引擎，基礎速度翻倍。
  '203': >-
    這艘貨船的載貨量遠大於小型運輸艦，而且因為改良過的引擎，通常也更快。
  '204': >-
    每位帝王建造的第一艘戰鬥艦艇。輕型戰鬥機很靈活，但單獨作戰很脆弱；數量一多，就是任何帝國的真正威脅。輕型戰鬥機是第一批護送小型和大型運輸艦前往防禦薄弱的敵對行星的艦船。
  '205': '這款戰鬥機的裝甲比輕型戰鬥機更厚，火力也更強。'
  '206': >-
    巡洋艦的裝甲幾乎是重型戰鬥機的三倍，火力也超過兩倍。而且速度也非常快。
  '207': >-
    戰列艦是艦隊的中堅。重砲、高速和大型貨艙，讓它們成為不可小看的對手。
  '208': >-
    這艘裝甲堅固的船能征服新行星，這是崛起中的帝國成長所需要的。在新殖民地，這艘船會被拆解，所有可回收的材料都用於開發新世界。你能殖民多少顆行星，直接取決於天體物理學研究：第一級和之後每隔一級，就能多殖民一顆（預設）。
  '209': >-
    回收船從殘骸場收割原料。它的載貨量是 20,000。起初使用燃燒引擎，在你的脈衝引擎達到 17 級時換成脈衝引擎，超空間引擎達到 15 級時再換成超空間引擎。
  '210': >-
    間諜衛星是小型靈活的無人機，能遠距離傳回艦隊和行星的資料。
  '211': >-
    轟炸機是專門為了摧毀行星防禦而打造的。<br>它使用脈衝引擎飛行，在你的超空間引擎達到 8 級時換成超空間引擎。
  '212': >-
    太陽能衛星是位於高空靜止軌道上、由太陽能電池組成的簡單平台。它們收集陽光，並用雷射傳送到地面站。
  '213': >-
    毀滅者是戰艦之王。對上輕型雷射砲塔時，它有快速射擊：每次命中後，十次裡有九次能再開一槍。
  '214': >-
    死星的破壞力無人能及，而且它能摧毀月球。
  '215': '戰鬥巡洋艦專門攔截敵方艦隊。'
  '216': >-
    廣受歡迎的死星的繼任者：快得多也堅固得多，還有巨大的貨艙，不過火力稍弱一些。
  '217': >-
    大型運輸艦的進化版，載貨量大得多。它使用超空間引擎，所以一開始比大型運輸艦慢，但隨著你的超空間引擎升級，會後來居上。
  '218': '絕對的最壞情況，雖然非常慢。'
  '219': >-
    巨大的貨艙和新引擎，讓它飛得更快，也能從殘骸場收集更多。
  '220': >-
    鋼鐵巨像是太空中真正的堡壘，被堅不可摧的屏障和厚重裝甲保護著。就連最猛烈的攻擊，在它不屈不撓地前進時也會彈開。但這種防禦上的優勢是有代價的：它的武裝幾乎不值一提，笨重的引擎也讓它成了行動緩慢的巨人。這艘船靠的不是閃電突襲或靈活機動，而是純粹的堅韌。任何想攔下它的人，必須要有很強的耐力，或壓倒性的火力。
  '221': >-
    風暴之刃是頂級戰鬥機：快得驚人，武裝毫不留情。對手還沒看清它，它就已經出手了。防禦是次要考量，能直接甩開的攻擊，它不需要硬扛。它唯一的目標是運輸艦和回收船隊，這些都會毫無抵抗地被轟成灰。憑著驚人的速度，它能隨意出擊，並在援軍抵達前消失。被風暴之刃盯上的人，幾乎沒有逃脫的機會。
  '222': >-
    重型巡洋艦是標準巡洋艦的強化進化版。有了改良的護盾和強大的武器，它能對抗笨重的敵人。和鋼鐵巨像、毀滅者以及轟炸機一起部署時表現最出色，它的火力在那裡才真正發光。不過儘管實力強大，它依然很慢，機動性也較差。
  '223': >-
    護盾無人機代表艦隊防禦的新思路，主要著重於保護船員。創新但沉重的護盾技術大幅降低了飛行速度和機動性。雖然速度和敏捷度很差，它在防禦上非常有效。過時的結構被推到極限，只為提供近乎堅不可摧的防禦。
  '224': >-
    臨時突擊運輸艦是一艘未經測試的運輸艇，只配備最低限度的武裝，專門用來騷擾粗心大意、毫無準備的鄰居。這種克難的載具不是為了長期使用，而是為了快速、衝動的攻擊，挑起立即的反應。一旦部署，鄰里糾紛幾乎是必然的。憑著有限的裝備和不可預測的特性，它成了快速升高衝突的危險工具。
  '225': >-
    風暴運輸艦是真正的科技奇蹟，在戰鬥力、速度和運輸量之間取得完美平衡。它能迅速部署部隊和資源，同時為戰場帶來驚人的火力，讓它成為任何強大艦隊不可或缺的一環。不論是快速突擊部隊，還是支援長期行動，風暴運輸艦都是有效作戰的關鍵，也是任何艦隊絕對必備的。
  '226': >-
    巨型戰鬥運輸艦代表工程技術的巔峰。儘管設計稍嫌笨重，導致飛行速度慢，它仍是任何艦隊見過裝甲最重的戰鬥運輸艦。壓倒性的火力讓它成為戰場上勢不可擋的力量。這頭巨獸能輕鬆突破敵方防線，同時為船員提供最大的保護。它象徵著力量與韌性，是任何重武裝艦隊的必備資產。
  '227': >-
    優化回收船是標準回收船的尖端升級版。配備強大的脈衝引擎，它能更快、更省錢地抵達殘骸場，是任何進階艦隊的必備資產。它的優化設計降低了建造成本，同時提高資源回收效率。從遊戲中期開始可用，為任何擴張中的帝國提供戰略優勢。
  '228': >-
    歐米茄回收船代表回收技術的巔峰，但代價高昂。它強大的超空間引擎能讓它以破紀錄的速度抵達殘骸場，比任何其他艦船更快回收資源。不過這種速度是以效率為代價：它的建造和燃料成本龐大，只有後期富有的指揮官才負擔得起。對那些把速度看得比成本重要的人來說，這就是終極回收船。
  '229': >-
    為了打破 Xer 的霸權而研發，毒蛇是對付輕型戰鬥機、重型戰鬥機和巡洋艦的終極武器。憑藉快速射擊的火砲和先進科技，它改變了宇宙中的權力平衡。
  '230': >-
    快速。精準。無法觸碰。攔截機不是為了公平對決而造的，它的設計就是要又快又狠地出擊，在眨眼之間創造壓倒性的優勢。
  '231': >-
    巨獸是數十年重力子研究的成果，被打造成一座冷酷無情的戰鬥平台。和死星不同，它不是為了摧毀行星而設計，而是為了達到最大的戰場效率。捨棄了摧毀月球所需的高耗能系統後，它的設計大幅減重，使引擎更強、更敏捷，火力也更猛。它精巧的重力子砲讓它成為一台移動的毀滅引擎，單槍匹馬就能殲滅龐大的艦隊。
  '232': >-
    虛空泰坦代表現代重力子技術的巔峰。它設計的每個面向都只為一個目的：快速殲滅敵方的月球。傳統的武器砲塔被刻意省略，以減輕重量，並騰出空間給巨大的晶體發電機。它們為已知銀河中打造過的最先進加速線圈供電，賦予這艘船無與倫比的機動力。龐大的晶體需求讓每一艘虛空泰坦都成為一項不朽的工業成就，也是無窮破壞力的象徵。
  '401': >-
    飛彈發射器是簡單但划算的防禦。戰鬥結束後，平均約有 70% 被摧毀的防禦會被重建。
  '402': >-
    輕型雷射是簡單的地面武器。特殊的瞄準系統追蹤敵人，高強度雷射切穿目標的船殼。戰鬥結束後，平均約有 70% 被摧毀的防禦會被重建。
  '403': >-
    重型雷射是輕型雷射實用的改良版。戰鬥結束後，平均約有 70% 被摧毀的防禦會被重建。
  '404': >-
    高斯砲以極高的速度發射高密度金屬彈丸。戰鬥結束後，平均約有 70% 被摧毀的防禦會被重建。
  '405': >-
    離子砲發射離子（帶正電或負電的粒子）光束。戰鬥結束後，平均約有 70% 被摧毀的防禦會被重建。
  '406': >-
    電漿砲塔利用大型核反應爐燃料電池，為電磁加速器供電，發射電漿脈衝（環面體）。戰鬥結束後，平均約有 70% 被摧毀的防禦會被重建。
  '407': >-
    小型護盾罩把整顆行星包覆在一個能吸收驚人能量的力場中。每顆行星只能建造一座。
  '408': >-
    大型護盾罩是進一步的發展，需要多得多的能源來抵禦攻擊。每顆行星只能建造一座。
  '409': >-
    護盾罩技術的進化。它耗能多得多，但比任何其他護盾能承受更多攻擊。每顆行星只能建造一座。
  '410': >-
    經過多年的重力研究，科學家研發出重力子砲，能產生一個小而集中的重力子場，並朝敵人發射。
  '411': >-
    一座無法移動、自身沒有動力的防禦平台，靠重力維持在行星周圍的穩定軌道上。啟動這個過程需要龐大的能源。每顆行星只能建造一座。
  '412': >-
    地堡是一座重兵防守的結構，設計來抵擋最強大的攻擊。它為行星居民和關鍵基礎設施提供無與倫比的保護，是行星防禦的基石。
  '413': >-
    泰坦雷射是一件破壞力無與倫比的巨型武器。
  '414': >-
    誘餌是一套精密的防禦系統，用來誤導並迷惑敵軍。它偽裝成飛彈發射器，嚇阻攻擊。
  '502': >-
    攔截飛彈會摧毀來襲的星際飛彈。每枚星際飛彈需要一枚攔截飛彈。
  '503': >-
    星際飛彈會摧毀對手的防禦，除非被攔截飛彈擊落。以這種方式摧毀的防禦不會重建。預設情況下，它們的射程（以太陽系為單位）取決於你的脈衝引擎等級：<br>射程 = (5 x 脈衝引擎等級) - 1
  '901': >-
    金屬是建築和艦船的主要資源。它是最便宜的資源，卻也是你最需要的，而且和晶體一樣，生產所需能源最少。礦場越大，就往地底挖得越深。
  '902': >-
    晶體是電子電路和某些合金的主要資源。它在地下礦場生產，原料在那裡直接被製成電路。
  '903': >-
    重氫存在於最深的海洋，是宇宙中最稀有的資源之一。你必須深入海底才能取得，這讓它成為最昂貴的資源。
  '911': '生產每一種資源都需要能源。'
secureResources: >-
  每一級倉庫建築，可以保護該資源每日產量的 1% 在攻擊時不被掠奪，最高 10%。
shortDescription:
  '1': >-
    金屬礦開採礦石，每一個崛起中和已經稱霸的帝國，都是建立在這之上。
  '2': >-
    晶體是電子電路和某些合金的關鍵原料。
  '3': >-
    重氫是你的太空船的燃料，從深海中提取。它是稀有物質，所以相對昂貴。
  '4': >-
    太陽能發電廠把陽光轉換成能源。每座礦場都需要能源才能運轉。
  '6': >-
    預設每級縮短 8% 的研究時間。
  '12': 核融合發電廠融合重氫燃料來產生能源。
  '14': >-
    機器人工廠提供建築機器人，幫忙蓋你的建築。每一級都會加快建築升級。
  '15': >-
    機器人技術的極致。每一級都讓建築、艦船和防禦的建造時間減半。
  '21': '所有艦船和防禦都在行星的太空船廠裡建造。'
  '22': 提供多餘金屬的儲存空間。
  '23': 提供多餘晶體的儲存空間。
  '24': '提供多餘重氫的儲存空間。'
  '31': '你需要研究實驗室才能研究新科技。'
  '33': >-
    地形改造器擴大行星的可用面積：每級 5 格額外欄位，偶數等級再多 1 格。每一級自己也佔 1 格。
  '34': "聯盟倉庫讓你用重氫延長駐守在你行星上的友軍艦隊的停留時間：每次補給最多是倉庫等級那麼多小時。"
  '35': '修理船塢從殘骸場修復艦船。'
  '41': >-
    月球沒有大氣層，剛形成的月球只有一個建築的空間，所以請從月球基地開始。
  '42': >-
    感應陣列讓你監視艦隊動向。等級越高，密集陣射程越大。
  '43': >-
    躍遷門是巨大的傳送器，能讓大型艦隊毫無時間損失地穿越宇宙。
  '44': '飛彈發射井用來儲存你的飛彈。'
  '106': >-
    這項科技讓你蒐集其他行星和月球的情報。
  '108': >-
    更好的電腦讓你能指揮更多艦隊。每一級電腦科技讓你的最大艦隊數增加一。
  '109': >-
    武器科技讓武器系統更有效。每一級讓所有單位的武器威力增加基礎值的 10%。
  '110': >-
    護盾科技讓艦船和防禦建築的護盾更有效。每一級讓護盾強度增加基礎值的 10%。
  '111': >-
    特殊合金能強化艦船和防禦建築的裝甲。每一級讓裝甲效能增加 10%。
  '113': >-
    掌握各種不同的能源，是許多新科技的關鍵。
  '114': >-
    整合第四和第五維度之後，你可以研究一種更經濟、更高效的新型引擎。
  '115': >-
    開發這種引擎能讓部分艦船更快，但每一級只增加基礎速度的 10%。
  '117': >-
    脈衝引擎依反作用原理運作。進一步開發它能讓部分艦船更快，但每一級只增加基礎速度的 20%。
  '118': >-
    超空間引擎會扭曲艦船周圍的空間。開發它能讓部分艦船更快，但每一級只增加基礎速度的 30%。
  '120': '聚焦的光線產生一道光束，能傷害任何被它擊中的東西。'
  '121': '一道致命的加速離子光束，撞擊時造成巨大傷害。'
  '122': >-
    離子科技的進一步發展，加速由超高溫離子產生的高能電漿。撞擊時有毀滅性的效果。
  '123': 不同行星上的研究人員透過這個網路互相溝通。
  '124': >-
    解鎖殖民和深太空遠征。奇數等級多一顆行星，平方等級多一個遠征欄位，更長的遠征停留時間，以及星系中更多的行星位置。
  '131': >-
    每級增加 2% 金屬產量。
  '132': >-
    每級增加 2% 晶體產量。
  '133': >-
    每級增加 2% 重氫產量。
  '134': >-
    每級減少 2% 飛行成本。
  '199': >-
    發射一束集中的重力子粒子，會製造出人工重力場，能摧毀艦船，甚至月球。
  '202': >-
    小型運輸艦是靈活的艦船，能快速把資源運到其他行星。
  '203': >-
    這艘貨船的載貨量遠大於小型運輸艦，而且因為改良過的引擎，通常也更快。
  '204': >-
    每位帝王建造的第一艘戰鬥艦艇。輕型戰鬥機很靈活，但單獨作戰很脆弱；數量一多，就是任何帝國的真正威脅。輕型戰鬥機是第一批護送小型和大型運輸艦前往防禦薄弱的敵對行星的艦船。
  '205': '這款戰鬥機的裝甲比輕型戰鬥機更厚，火力也更強。'
  '206': >-
    巡洋艦的裝甲幾乎是重型戰鬥機的三倍，火力也超過兩倍。而且速度也非常快。
  '207': >-
    戰列艦是艦隊的中堅。重砲、高速和大型貨艙，讓它們成為不可小看的對手。
  '208': '空著的行星可以用這艘船來殖民。'
  '209': '回收船從殘骸場收割原料。'
  '210': >-
    間諜衛星是小型靈活的無人機，能遠距離傳回艦隊和行星的資料。
  '211': '轟炸機是專門為了摧毀行星防禦而打造的。'
  '212': >-
    太陽能衛星是位於高空靜止軌道上、由太陽能電池組成的簡單平台。它們收集陽光，並用雷射傳送到地面站。
  '213': '毀滅者是戰艦之王。'
  '214': >-
    死星的破壞力無人能及，而且它能摧毀月球。
  '215': '戰鬥巡洋艦專門攔截敵方艦隊。'
  '216': >-
    廣受歡迎的死星的繼任者：快得多也堅固得多，還有巨大的貨艙，不過火力稍弱一些。
  '217': >-
    大型運輸艦的進化版，載貨量大得多。它使用超空間引擎，所以一開始比大型運輸艦慢，但隨著你的超空間引擎升級，會後來居上。
  '218': '絕對的最壞情況，雖然非常慢。'
  '219': >-
    巨大的貨艙和新引擎，讓它飛得更快，也能從殘骸場收集更多。
  '220': >-
    鋼鐵巨像憑藉巨大的護盾和厚重的裝甲扛得住任何攻擊，但它的武器和引擎就有點差強人意了。
  '221': >-
    風暴之刃是閃電般快速的戰鬥機，全副武裝。防禦？不需要，它的獵物是毫無防備的運輸艦和回收船。
  '222': >-
    一艘緩慢但重武裝的巡洋艦，護盾和攻擊能力都更強。
  '223': >-
    輕型戰鬥機的重新設計，把船員安全放在第一位，代價是飛行性能很差。
  '224': >-
    一艘未經測試、武裝極少的運輸艇，專門用來騷擾粗心的鄰居並引發立即衝突。
  '225': >-
    一艘結合戰鬥力、速度和運輸量的船，是任何強大艦隊不可或缺的。
  '226': >-
    一艘裝甲厚重的戰鬥運輸艦，外型氣勢逼人、稍嫌笨重，壓倒性的火力能擊敗最難纏的對手。
  '227': >-
    經典回收船的改良版，配備脈衝引擎，能以更低的成本進行更有效率的回收任務。
  '228': 一款速度極快但效率不高的回收船升級版，配備超空間引擎。
  '229': >-
    為了打破 Xer 的霸權而研發，毒蛇是對付輕型戰鬥機、重型戰鬥機和巡洋艦的終極武器。憑藉快速射擊的火砲和先進科技，它改變了宇宙中的權力平衡。
  '230': >-
    快速。精準。無法觸碰。攔截機不是為了公平對決而造的，它的設計就是要又快又狠地出擊，在眨眼之間創造壓倒性的優勢。
  '231': >-
    一艘更小、更快、但無法摧毀月球的死星。巨獸對艦隊是致命的。
  '232': >-
    更快、更爆炸性，永遠是個好驚喜。虛空泰坦是月球的惡夢。
  '401': 飛彈發射器是簡單但划算的防禦。
  '402': >-
    輕型雷射是簡單的地面防禦武器。特殊的瞄準系統追蹤敵艦，高強度雷射切穿目標的船殼。
  '403': 重型雷射是輕型雷射的改良版。
  '404': >-
    高斯砲以極高的速度發射高密度金屬彈丸。
  '405': >-
    離子砲發射離子（帶正電或負電的粒子）光束。
  '406': >-
    電漿砲塔利用大型核反應爐燃料電池，為電磁加速器供電，發射電漿脈衝（環面體）。
  '407': >-
    小型護盾罩把整顆行星包覆在一個能吸收驚人能量的力場中。
  '408': >-
    大型護盾罩在攻擊中能吸收多得多的能量。
  '409': >-
    護盾罩技術的進化。它耗能多得多，但比任何其他護盾能承受更多攻擊。
  '410': >-
    經過多年的重力研究，科學家研發出重力子砲，能產生一個小而集中的重力子場，並朝敵人發射。
  '411': >-
    一座無法移動、自身沒有動力的防禦平台，靠重力維持在行星周圍的穩定軌道上。啟動這個過程需要龐大的能源。
  '412': '它會保護你！就像幼稚園塔防裡的樂高積木。'
  '413': '泰坦雷射是一座巨型雷射。'
  '414': >-
    誘餌是一套精密的防禦系統，用來誤導並迷惑敵軍。它偽裝成飛彈發射器，嚇阻攻擊。
  '502': '攔截飛彈會摧毀來襲的星際飛彈。'
  '503': '星際飛彈會摧毀對手的防禦。'
  '901': >-
    金屬是建築和艦船的主要資源。它是最便宜的資源，卻也是你最需要的。
  '902': >-
    晶體是製造電子電路和形成某些合金化合物的主要資源。
  '903': >-
    重氫存在於最深的海洋。它是最昂貴的資源，生產所需的能源也最多。
  '911': '生產每一種資源都需要能源。'
