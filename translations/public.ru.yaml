registerWelcomePMText: 'Добро пожаловать в %s! Сначала построй Солнечную электростанцию: энергия нужна, чтобы производить ресурсы. Открой «Постройки» в левом меню и начни с Солнечной электростанции.<br>Когда появится энергия, можно строить рудники. Оставайся в «Постройках» и построй Рудник металла, а потом Рудник кристалла.<br><br>Чтобы строить корабли, нужна Верфь. В меню «Технологии» слева видно, что для неё требуется.<br>Остались вопросы? Загляни в FAQ, в Wiki или создай тикет в поддержку.<br><br>Команда желает тебе море удовольствия от исследования вселенной!'
