spytechStatsDescription: Nos níveis 0 e 1, você só vê os pontos totais dos outros jogadores. A partir do nível 2, você vê também os pontos de edifícios; a partir do nível 4, os pontos de pesquisa. A partir do nível 6, você vê ainda os pontos de naves e de defesa, além das estatísticas de batalha.
