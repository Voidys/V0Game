  de choc emporte toute la flotte.'
sys_destruc_lune: 'Chance de détruire la lune : %d%%'
sys_destruc_mess1: Les Étoiles de la mort ont déchargé leur formidable énergie sur
  la lune.
sys_destruc_null: Les Étoiles de la mort n'ont pas pu se charger complètement avant
  de tirer.<br> La lune n'a pas été détruite.
sys_destruc_reussi: Les rayons des Étoiles de la mort ont atteint la lune et l'ont
