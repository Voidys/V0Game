sys_destruc_rip: 'Chance que la flotte s''autodétruise : %d%%'
sys_destruc_stop: Le défenseur a réussi à empêcher la destruction de la lune.
sys_destruc_title: 'Les flottes suivantes s''affrontent pour la destruction d''une
  lune :'
sys_expe_attack_1_1_1: Un pirate de l'espace désespéré a tenté de réquisitionner
  ta flotte d'expédition.
sys_expe_attack_1_1_2: Des barbares primitifs nous ont attaqués avec des vaisseaux
  spatiaux. Au moins, leurs engins étaient dans un état lamentable. Si leur puissance
  de feu avait été une vraie menace, nous aurions dû riposter.
sys_expe_attack_1_1_3: Nous avons intercepté quelques messages radio de pirates
  très ivres. Apparemment, nous allons être attaqués.
sys_expe_attack_1_1_4: Nous avons dû nous battre contre des pirates, mais heureusement,
  nous étions plus nombreux.
sys_expe_attack_1_1_5: Ta flotte signale qu'un certain Moa Tikarr et son équipage
  exigent la reddition sans condition de notre flotte. S'ils sont sérieux, ils vont
  découvrir que nous savons très bien nous défendre.
sys_expe_attack_1_2_1: Ta flotte d'expédition a fait une rencontre imprévue avec
  des pirates de l'espace.
sys_expe_attack_1_2_2: Nous sommes tombés dans une embuscade de pirates des étoiles !
  Un combat était malheureusement inévitable.
sys_expe_attack_1_2_3: L'appel à l'aide d'une autre flotte d'expédition s'est révélé
  être le piège de pirates rusés. Une bataille était inévitable.
sys_expe_attack_1_3_1: Les signaux interceptés ne venaient pas d'extraterrestres
  inconnus, mais d'une base pirate secrète ! Les pirates n'ont pas du tout apprécié
  notre présence dans leur secteur.
sys_expe_attack_1_3_2: La flotte d'expédition signale d'intenses combats contre
  des vaisseaux pirates non identifiés !
sys_expe_attack_1_3_3: 'Nous venons de recevoir un message urgent du commandant
  de l''expédition : « Ils nous foncent dessus ! Ils ont surgi de l''hyperespace.
  Heureusement, ce ne sont que des pirates, nous avons donc une chance : nous allons
  nous battre ! »'
sys_expe_attack_2_1_1: Ta flotte d'expédition a eu un premier contact peu accueillant
  avec une espèce inconnue.
sys_expe_attack_2_1_2: Des vaisseaux étranges ont attaqué la flotte d'expédition
  sans prévenir !
sys_expe_attack_2_1_3: Notre expédition a été attaquée par un petit groupe de vaisseaux
  spatiaux non identifiés !
sys_expe_attack_2_1_4: La flotte d'expédition signale un contact avec des vaisseaux
  inconnus. Les messages radio sont indéchiffrables, mais les vaisseaux étrangers
  semblent armer leurs canons.
sys_expe_attack_2_2_1: Une espèce inconnue attaque notre expédition !
sys_expe_attack_2_2_2: Ta flotte d'expédition a apparemment violé le territoire
  d'une race extraterrestre jusque-là inconnue, mais très agressive.
sys_expe_attack_2_2_3: La liaison avec notre flotte d'expédition a été brusquement
  coupée. D'après les derniers échanges, la flotte essuyait de lourds tirs. Les
  assaillants n'ont pas pu être identifiés.
sys_expe_attack_2_3_1: Ton expédition est tombée sur une flotte d'invasion extraterrestre
  et signale d'énormes batailles !
sys_expe_attack_2_3_2: Un grand groupe de vaisseaux cristallins d'origine inconnue
  fonce droit sur notre flotte d'expédition. Il faut se préparer au pire.
sys_expe_attack_2_3_3: Nous avons eu un peu de mal à prononcer correctement le dialecte
  de la race extraterrestre. Notre diplomate a crié « Feu ! » au lieu de « Paix !
  » par erreur.
sys_expe_attackname_1: Pirates
sys_expe_attackname_2: Aliens
sys_expe_back_home: Ta flotte est revenue de l'expédition à %3$s vers %1$s %2$s.
sys_expe_back_home_ress: Elle rapporte %s %s, %s %s et %s %s.
sys_expe_back_home_ships_flound: 'Les vaisseaux suivants ont été trouvés :'
sys_expe_back_home_ships_lost: 'Les vaisseaux suivants ont été perdus :'
sys_expe_depleted_max_1: 'Extrait du journal de bord de l''officier de communication :
  si nous nous sentons un jour en danger, nous pourrons toujours faire équipe avec
  les autres expéditions qui rôdent dans le coin.'
sys_expe_depleted_max_2: 'Extrait du journal de bord de l''officier de communication :
  si ça continue, il faudra installer des balises de navigation pour gérer tout
  ce trafic.'
sys_expe_depleted_max_3: 'Extrait du journal de bord de l''officier de communication :
  ouvrir une boutique de souvenirs ici serait peut-être plus rentable que d''envoyer
  une énième expédition.'
sys_expe_depleted_med_1: 'Extrait du journal de bord de l''officier de communication :
  nous avons trouvé des traces de plusieurs flottes d''expédition dans la région.
  Nous rentrons.'
sys_expe_depleted_med_2: 'Extrait du journal de bord de l''officier de communication :
  nous avons établi un contact radio amical avec d''autres expéditions de ce secteur.'
sys_expe_depleted_med_3: 'Extrait du journal de bord de l''officier de communication :
  nous avons fêté la fin de l''expédition avec l''équipage d''une autre flotte qui
  voyageait dans le même secteur. Eux non plus n''ont rien de nouveau à signaler.'
sys_expe_depleted_min_1: 'Extrait du journal de bord de l''officier de communication :
  il semble que des humains soient déjà venus dans cette partie de la galaxie.'
sys_expe_depleted_min_2: 'Extrait du journal de bord de l''officier de communication :
  nous avons trouvé des débris d''anciens vaisseaux. Nous ne sommes pas les premiers
  ici.'
sys_expe_depleted_min_3: 'Extrait du journal de bord de l''officier de communication :
  nous avons failli percuter une autre flotte d''expédition. Je n''aurais jamais
  cru croiser quelqu''un d''autre par ici.'
sys_expe_depleted_not_1: 'Extrait du journal de bord de l''officier de communication :
  il semble que cette partie de l''univers n''ait pas encore été explorée.'
sys_expe_depleted_not_2: 'Extrait du journal de bord de l''officier de communication :
  c''est formidable d''être les premiers à traverser un secteur inexploré.'
sys_expe_feqeuence_few: Plus de 10 expéditions au cours des dernières 24 heures
sys_expe_feqeuence_many: Plus de 50 expéditions au cours des dernières 24 heures
sys_expe_feqeuence_medium: Plus de 25 expéditions au cours des dernières 24 heures
sys_expe_found_goods: '%s %s ont été extraits.'
sys_expe_found_ress_1_1: Ton expédition a découvert un petit amas d'astéroïdes dont
  on a pu extraire quelques ressources.
sys_expe_found_ress_1_2: Sur un planétoïde isolé, plusieurs gisements facilement
  accessibles ont été découverts et des matières premières ont été extraites avec
  succès.
sys_expe_found_ress_1_3: Ton expédition est tombée sur de très vieilles épaves de
  vaisseaux, vestiges d'une bataille d'il y a longtemps. Quelques pièces ont pu
  être récupérées et recyclées.
sys_expe_found_ress_1_4: L'expédition a découvert une planète contaminée par les
  radiations, à l'atmosphère hautement toxique. Les scans ont toutefois révélé qu'elle
  regorge de matières premières. Des drones automatisés ont tenté d'en extraire
  un maximum.
sys_expe_found_ress_2_1: Ton expédition a trouvé un vieux convoi de cargos entièrement
  chargés, mais désert. Quelques ressources ont pu être récupérées.
sys_expe_found_ress_2_2: Ton expédition a trouvé d'importants gisements de matières
  premières sur une petite lune dotée de sa propre atmosphère. L'équipage est en
  train d'extraire ce trésor.
sys_expe_found_ress_2_3: Nous avons croisé un petit convoi de vaisseaux civils qui
  avait un besoin urgent de nourriture et de médicaments. En échange, nous avons
  reçu une belle quantité de ressources utiles.
sys_expe_found_ress_3_1: Ta flotte d'expédition signale la découverte d'une gigantesque
  épave extraterrestre. Ils n'ont rien pu faire de sa technologie, mais le vaisseau
  a pu être démonté pièce par pièce, ce qui a rapporté de précieuses matières premières.
sys_expe_found_ress_3_2: La ceinture d'astéroïdes autour d'une planète inconnue
  contenait d'énormes quantités de matières premières. La flotte d'expédition a
  rempli ses soutes !
sys_expe_found_ress_logbook_1: 'Extrait du journal de bord du second : nous avons
  utilisé la moindre place libre, mais nous n''avons quand même pas pu emporter
  toutes les ressources trouvées.'
sys_expe_found_ress_logbook_2: 'Extrait du journal de bord du second : si seulement
  nous avions quelques cargos de plus ! Il va falloir abandonner des tonnes de ressources.'
sys_expe_found_ress_logbook_3: 'Extrait du journal de bord du second : nous avons
  déjà jeté tout ce dont nous n''avions plus besoin, mais nous n''arrivons toujours
  pas à faire assez de place pour toutes les ressources trouvées.'
sys_expe_found_ress_logbook_4: 'Extrait du journal de bord du second : même après
  avoir transformé la cafétéria et tous les salons en soutes, nous n''avons pas
  pu transporter toutes les ressources trouvées.'
sys_expe_found_ships_1_1: Nous avons découvert les restes d'une expédition précédente !
  Nos techniciens vérifient s'ils peuvent remettre quelques épaves en état de marche.
sys_expe_found_ships_1_2: Nous avons trouvé une base pirate abandonnée. Quelques
  vieux vaisseaux sont encore dans le hangar. Nos techniciens vérifient si certains
  sont encore utilisables.
sys_expe_found_ships_1_3: Notre expédition a trouvé une planète presque entièrement
  détruite par des guerres. Diverses épaves dérivaient en orbite. Les techniciens
  ont tenté d'en réparer quelques-unes. Nous apprendrons peut-être ce qui s'est
  passé ici.
sys_expe_found_ships_1_4: L'expédition est tombée sur une vieille base stellaire
  qui semble abandonnée depuis une éternité. Quelques vaisseaux dormaient dans le
  hangar de la forteresse. Les techniciens ont réussi à en remettre quelques-uns
  en vol.
sys_expe_found_ships_2_1: Nous avons trouvé les restes d'une armada. Les techniciens
  de l'expédition sont montés aussitôt à bord des vaisseaux en partie intacts et
  ont pu en réparer quelques-uns.
sys_expe_found_ships_2_2: Notre expédition a découvert un vieux chantier spatial
  automatique dont certains vaisseaux étaient encore en cours de production. Une
  fois l'alimentation en énergie du chantier rétablie, nos techniciens se sont mis
  au travail pour achever leur construction.
sys_expe_found_ships_3_1: Nous avons trouvé un gigantesque cimetière de vaisseaux.
  Quelques techniciens de l'expédition ont réussi à remettre un ou deux vaisseaux
  en service.
sys_expe_found_ships_3_2: Nous avons découvert une planète portant les vestiges
  d'une civilisation. Une autre gigantesque station spatiale, encore intacte, a
  été repérée depuis l'espace. Quelques techniciens et pilotes sont descendus à
  la surface pour voir si l'on peut récupérer quelques vaisseaux.
sys_expe_found_ships_logbook_1: 'Extrait du journal de bord du chef mécanicien :
  si nous avions emmené quelques vaisseaux de plus, il aurait été facile de ramener
  quelques-unes de ces beautés !'
sys_expe_found_ships_logbook_2: 'Extrait du journal de bord du chef mécanicien :
  malheureusement, nous n''avions pas la capacité de ramener tous les vaisseaux
  découverts pendant cette mission.'
sys_expe_found_ships_logbook_3: 'Extrait du journal de bord du chef mécanicien :
  nous n''avons malheureusement pas assez de capacité pour ramener tous les vaisseaux
  que nous avons trouvés.'
sys_expe_found_ships_nothing: Aucun vaisseau n'a pu être trouvé.
sys_expe_lost_fleet_1: 'Il ne reste de l''expédition que le message radio suivant :
  Zzzrrt oh mon Dieu !... Krrrzzzzt le zrrrtrzt voit krgzzzz oui de comment Krzzzzzzzztzzzz...'
sys_expe_lost_fleet_2: Les derniers clichés reçus de l'expédition étaient des gros
  plans incroyablement nets d'un trou noir en train de s'ouvrir.
sys_expe_lost_fleet_3: Une fuite nucléaire sur l'un des vaisseaux de commandement
  a déclenché une réaction en chaîne qui a détruit toute l'expédition dans une explosion
  spectaculaire.
sys_expe_lost_fleet_4: La flotte d'expédition n'est pas revenue de son saut hyperespace.
  Nos scientifiques se creusent encore la tête pour comprendre ce qui a pu se passer,
  mais la flotte semble perdue à jamais.
sys_expe_nothing_1: Cette expédition ne rapporte rien de passionnant, à part quelques
  curieuses petites bêtes d'une planète marécageuse inconnue.
sys_expe_nothing_2: Ton expédition a pris de magnifiques photos d'une supernova.
  Elle n'a toutefois rien appris de nouveau, mais elle a de bonnes chances de remporter
  cette année le concours de la plus belle image de l'univers.
sys_expe_nothing_3: 'Un étrange virus informatique a paralysé la navigation peu
  après la sortie du système solaire. Résultat : toute la flotte d''expédition a
  tourné en rond pendant tout le trajet. Inutile de préciser que l''expédition n''a
  pas été un grand succès.'
sys_expe_nothing_4: Une forme de vie d'énergie pure a hypnotisé tous les membres
  de l'expédition, qui ont fixé pendant des jours des symboles sur leurs écrans.
  Quand la plupart ont enfin retrouvé leurs esprits, l'expédition a dû être annulée
  faute de deutérium.
sys_expe_nothing_5: Eh bien, nous savons désormais que les anomalies rouges de classe
  5 n'ont pas seulement des effets chaotiques sur les systèmes du vaisseau, mais
  peuvent aussi provoquer d'énormes hallucinations chez l'équipage. Hélas, rien
  d'autre n'a été découvert lors de cette expédition.
sys_expe_nothing_6: Malgré des scans de ce secteur d'abord prometteurs, nous sommes
  malheureusement revenus les mains vides.
sys_expe_nothing_7: Peut-être n'aurait-on pas dû fêter l'anniversaire du capitaine
  sur cette planète lointaine. Une vilaine fièvre hémorragique a envoyé la moitié
  de l'équipage à l'infirmerie, et le manque criant de personnel a fait échouer
  l'expédition.
sys_expe_nothing_8: Ton expédition n'a rien trouvé d'autre que l'immense vide de
  l'espace. Pas même un petit astéroïde, ni radiations, ni particules, ni rien qui
  aurait pu rendre cette expédition au moins un peu palpitante.
sys_expe_nothing_9: Un dysfonctionnement du réacteur du vaisseau de commandement
  a failli détruire toute l'expédition. Heureusement, les techniciens se sont montrés
  à la hauteur et ont évité le pire. La réparation a toutefois pris tellement de
  temps que l'expédition est rentrée sans rien avoir accompli.
sys_expe_report: Rapport d'expédition
sys_expe_report_msg: 'Rapport d''expédition de la flotte de %s %s à %s :'
sys_expe_time_fast_1: Une boucle de rétroaction imprévue dans les bobines d'énergie
  du système de propulsion a accéléré le retour de l'expédition, qui arrive plus
  tôt que prévu. Les premiers rapports indiquent cependant qu'elle n'a rien d'autre
  à signaler.
sys_expe_time_fast_2: Le nouveau commandant, un peu casse-cou, a emprunté un trou
  de ver instable pour raccourcir le trajet de retour, avec succès ! L'expédition
  elle-même n'a toutefois rien appris de nouveau.
sys_expe_time_fast_3: Ton expédition n'a signalé aucune anomalie dans le secteur
  exploré. En revanche, la flotte a rencontré un vent solaire pendant le vol de
  retour, ce qui a nettement accéléré le trajet. Ton expédition rentrera donc un
  peu plus tôt que prévu.
sys_expe_time_slow_1: Une grave erreur du navigateur a envoyé la flotte au mauvais
  endroit. Le trajet de retour a donc pris beaucoup plus de temps.
sys_expe_time_slow_2: Pour des raisons encore inconnues, le saut de la flotte a
  complètement raté. Elle a failli finir au cœur d'une étoile ! Heureusement, elle
  a atterri dans un système connu, mais le retour sera plus long que prévu.
sys_expe_time_slow_3: Le nouveau module de navigation semble encore truffé de bugs.
  Non seulement la flotte d'expédition est partie dans la mauvaise direction, mais
  elle a aussi consommé tout son deutérium ! Déçue, l'expédition rentre maintenant
  sur les réserves.
sys_expe_time_slow_4: Ton expédition est entrée dans un secteur de tempêtes de particules
  intenses. Les systèmes de stockage d'énergie ont été surchargés et les systèmes
  principaux de tous les vaisseaux sont tombés en panne. Tes mécaniciens ont évité
  le pire, mais l'expédition rentrera avec un retard considérable.
sys_expe_time_slow_5: Le vaisseau amiral de ta flotte d'expédition est entré en
  collision avec un vaisseau extraterrestre qui a surgi sans prévenir au milieu
  de la flotte. Le vaisseau étranger a explosé, et les dégâts sur le vaisseau amiral
  sont considérables. Une fois les réparations les plus urgentes terminées, tes
  vaisseaux entameront leur retour, car l'expédition ne peut pas continuer dans
  cet état.
sys_expe_time_slow_6: Le vent stellaire d'une géante rouge a faussé le saut de l'expédition,
  et les systèmes de navigation se sont complètement trompés dans le calcul du retour.
  L'expédition se retrouve donc dans l'immense vide entre des étoiles inconnues.
