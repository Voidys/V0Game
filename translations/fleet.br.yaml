sys_expe_found_goods: Foram extraídos %s %s.
sys_expe_found_ress_1_1: Sua expedição descobriu um pequeno aglomerado de asteroides de onde foi possível extrair alguns recursos.
sys_expe_found_ress_1_2: Em um planetoide remoto, foram encontrados vários campos de recursos de fácil acesso e as matérias-primas foram extraídas com sucesso.
sys_expe_found_ress_1_3: Sua expedição tropeçou em destroços de naves bem antigas, de uma batalha de muito tempo atrás. Alguns componentes puderam ser recuperados e reciclados.
sys_expe_found_ress_1_4: A expedição descobriu um planeta contaminado por radiação, com uma atmosfera altamente tóxica. Mas os escaneamentos mostraram que o planeta tem muita matéria-prima. Drones automáticos foram usados para tentar extrair o máximo de recursos possível.
sys_expe_found_ress_2_1: 'Sua expedição encontrou um antigo comboio de cargueiros totalmente carregado, mas deserto. Deu para aproveitar alguns recursos. '
sys_expe_found_ress_2_2: Sua expedição encontrou grandes depósitos de matéria-prima em uma luazinha com atmosfera própria. A tripulação está extraindo esse tesouro agora.
sys_expe_found_ress_2_3: Encontramos um pequeno comboio de naves civis que precisava urgentemente de comida e remédios. Em troca, recebemos uma boa quantidade de recursos úteis.
sys_expe_found_ress_3_1: Sua frota de expedição reporta a descoberta de um enorme naufrágio alienígena. Eles não conseguiram fazer nada com a tecnologia, mas a nave pôde ser desmontada em peças, rendendo matéria-prima valiosa.
sys_expe_found_ress_3_2: O cinturão de asteroides em volta de um planeta desconhecido tinha quantidades enormes de matéria-prima. A frota de expedição encheu os porões!
sys_expe_found_ress_logbook_1: 'Entrada do diário de bordo do primeiro oficial: usamos cada pedacinho de espaço livre, mas mesmo assim não deu para levar todos os recursos que encontramos.'
sys_expe_found_ress_logbook_2: 'Entrada do diário de bordo do primeiro oficial: se a gente tivesse mais alguns cargueiros! Agora vamos ter que deixar um monte de recursos para trás.'
sys_expe_found_ress_logbook_3: 'Entrada do diário de bordo do primeiro oficial: já jogamos fora tudo o que não era mais necessário, mas mesmo assim não conseguimos abrir espaço para todos os recursos que encontramos.'
sys_expe_found_ress_logbook_4: 'Entrada do diário de bordo do primeiro oficial: mesmo depois de transformar a cantina e todas as salas de descanso em depósitos, ainda não deu para transportar todos os recursos que encontramos.'
sys_expe_found_ships_1_1: Descobrimos os restos de uma expedição anterior! Nossos técnicos estão verificando se conseguem fazer alguns dos destroços funcionarem de novo.
sys_expe_found_ships_1_2: Encontramos uma base pirata abandonada. Ainda tem algumas naves velhas no hangar. Nossos técnicos estão verificando se alguma delas ainda dá para usar.
sys_expe_found_ships_1_3: Sua expedição encontrou um planeta quase totalmente destruído por guerras. Vários destroços de naves vagavam pela órbita. Os técnicos tentaram consertar alguns. Quem sabe a gente descubre mais sobre o que aconteceu aqui.
sys_expe_found_ships_1_4: A expedição esbarrou numa velha base estelar que parece abandonada há uma eternidade. Algumas naves foram encontradas no hangar da fortaleza. Os técnicos conseguiram fazer algumas delas voarem de novo.
sys_expe_found_ships_2_1: Encontramos os restos de uma armada. Os técnicos da expedição subiram na hora nas naves parcialmente intactas e conseguiram consertar algumas.
sys_expe_found_ships_2_2: Nossa expedição descobriu um velho estaleiro automático com algumas naves ainda em fase de produção. Depois de restabelecer a energia do estaleiro, nossos técnicos trabalharam para terminar a construção delas.
sys_expe_found_ships_3_1: Encontramos um cemitério gigantesco de naves. Alguns técnicos da expedição conseguiram colocar uma ou duas naves em funcionamento de novo.
sys_expe_found_ships_3_2: Descobrimos um planeta com restos de uma civilização. Outra estação gigantesca de naves, ainda intacta, foi avistada do espaço. Alguns dos nossos técnicos e pilotos desceram à superfície para ver se algumas das naves podem ser recuperadas.
sys_expe_found_ships_logbook_1: 'Entrada do diário de bordo do oficial da sala de máquinas: se a gente tivesse trazido mais algumas naves, teria sido fácil levar algumas dessas belezinhas para casa!'
sys_expe_found_ships_logbook_2: 'Entrada do diário de bordo do oficial da sala de máquinas: infelizmente, não tínhamos capacidade para trazer de volta todas as naves que descobrimos nesta missão.'
sys_expe_found_ships_logbook_3: 'Entrada do diário de bordo do oficial da sala de máquinas: infelizmente, não temos capacidade suficiente para trazer de volta todas as naves que encontramos.'
sys_expe_found_ships_nothing: Nenhuma nave foi encontrada.
sys_expe_lost_fleet_1: 'A única coisa que sobrou da expedição é esta mensagem de rádio: Zzzrrt ai meu Deus!...Krrrzzzzt o zrrrtrzt vê krgzzzz sim de como Krzzzzzzzztzzzz...'
sys_expe_lost_fleet_2: A última coisa que recebemos da expedição foram uns closes incrivelmente bons de um buraco negro se abrindo.
sys_expe_lost_fleet_3: Uma falha nuclear em uma das naves de comando causou uma reação em cadeia que destruiu a expedição inteira numa explosão espetacular.
sys_expe_lost_fleet_4: A frota de expedição não voltou do salto pelo hiperespaço. Nossos cientistas ainda quebram a cabeça tentando entender o que pode ter acontecido, mas a frota parece perdida para sempre.
sys_expe_nothing_1: Essa expedição não traz nada de emocionante, só uns bichinhos curiosos de um planeta pantanoso desconhecido.
sys_expe_nothing_2: Sua expedição tirou fotos lindas de uma supernova. Mas a expedição não rendeu nenhuma descoberta nova de verdade. Em compensação, tem boa chance de ganhar o concurso de Melhor Foto do Universo deste ano.
sys_expe_nothing_3: Um estranho vírus de computador prejudicou a navegação logo depois de sair do sistema solar. Por causa disso, a frota de expedição ficou voando em círculos o tempo todo. Nem precisa dizer que a expedição não foi lá muito bem-sucedida.
sys_expe_nothing_4: Uma forma de vida de pura energia fez todos os membros da expedição ficarem encarando símbolos hipnóticos nas telas por vários dias. Quando a maioria finalmente voltou a ficar com a cabeça no lugar, a expedição teve que ser cancelada por falta de deutério.
sys_expe_nothing_5: Bom, pelo menos agora sabemos que anomalias vermelhas de Classe 5 não só têm efeitos caóticos nos sistemas da nave, como também podem provocar alucinações em massa na tripulação. Infelizmente, não se descobriu mais nada nesta expedição.
sys_expe_nothing_6: Apesar dos escaneamentos inicialmente promissores deste setor, voltamos de mãos vazias, infelizmente.
sys_expe_nothing_7: Talvez não devessem ter comemorado o aniversário do capitão neste planeta remoto. Uma febre hemorrágica feia mandou a maior parte da tripulação para a enfermaria, e a falta aguda de pessoal fez a expedição fracassar.
sys_expe_nothing_8: Sua expedição não encontrou nada além do vazio imenso do espaço. Não teve nem um asteroidezinho, nem radiação, nem partículas, nem nada que pudesse deixar essa expedição pelo menos um pouco interessante.
sys_expe_nothing_9: Uma falha no reator da nave de comando quase destruiu a expedição inteira. Por sorte, os técnicos eram mais do que capazes e evitaram o pior. O conserto, porém, levou tanto tempo que a expedição voltou sem ter conseguido nada.
sys_expe_report: Relatório de expedição
sys_expe_report_msg: 'Relatório de expedição da frota de %s %s em %s:'
sys_expe_time_fast_1: Um feedback inesperado nas bobinas de energia do sistema de propulsão acelerou o retorno da expedição, que chegou antes do previsto. Os primeiros relatórios indicam, porém, que não há mais nada a reportar.
sys_expe_time_fast_2: O novo comandante, meio ousado, usou um buraco de minhoca instável para encurtar a viagem de volta, e deu certo! Mas a expedição em si não rendeu nenhuma descoberta nova.
sys_expe_time_fast_3: Sua expedição não reportou nenhuma anomalia no setor explorado. Mas a frota pegou um vento solar no voo de volta, que acelerou bastante a viagem. Sua expedição vai chegar em casa um pouco antes do esperado.
sys_expe_time_slow_1: Um erro grave do navegador deixou a frota num lugar totalmente errado. Por isso, a viagem de volta demorou bem mais.
sys_expe_time_slow_2: Por motivos ainda desconhecidos, o salto da frota deu totalmente errado. Eles quase foram parar no coração de uma estrela! Por sorte, pousaram num sistema conhecido, mas a viagem de volta vai levar mais tempo do que o planejado.
sys_expe_time_slow_3: O novo módulo de navegação ainda parece ter uns bugs. A frota de expedição não só foi para a direção completamente errada, como também gastou todo o deutério! Decepcionada, a expedição agora volta com a energia de reserva.
sys_expe_time_slow_4: Sua expedição entrou num setor com tempestades de partículas intensificadas. Isso sobrecarregou os sistemas de armazenamento de energia e fez os sistemas principais de todas as naves falharem. Seus mecânicos conseguiram evitar o pior, mas a expedição agora volta com um atraso considerável.
sys_expe_time_slow_5: A nave capitânia da sua frota de expedição colidiu com uma nave alienígena que saltou direto para dentro da frota sem aviso. A nave alienígena explodiu e os danos na capitânia foram enormes. Assim que os reparos mais graves terminarem, suas naves vão começar a viagem de volta, já que a expedição não pode continuar nesse estado.
sys_expe_time_slow_6: 'O vento estelar de uma gigante vermelha distorceu o salto da expedição, e os sistemas de navegação calcularam a viagem de volta de forma totalmente errada. Resultado: a expedição está perdida no vazio imenso entre estrelas desconhecidas.'
