sys_destruc_title: 'As seguintes frotas se enfrentam em uma tentativa de destruição de lua:'
sys_expe_attack_1_1_1: Um pirata espacial desesperado tentou tomar a nossa frota de expedição.
sys_expe_attack_1_1_2: Uns bárbaros primitivos nos atacaram com naves espaciais, mas pelo menos as naves deles estavam em péssimo estado. Se o poder de fogo deles fosse uma ameaça séria, teríamos sido obrigados a responder.
sys_expe_attack_1_1_3: Interceptamos algumas mensagens de rádio de uns piratas muito bêbados. Pelo visto, vamos ser atacados.
sys_expe_attack_1_1_4: Tivemos que combater uns piratas, mas, por sorte, éramos mais numerosos.
sys_expe_attack_1_1_5: Nossa frota informa que um tal Moa Tikarr e a tripulação dele exigiram a rendição incondicional da nossa frota. Se estiverem falando sério, vão descobrir que sabemos nos defender muito bem.
sys_expe_attack_1_2_1: Sua frota de expedição teve um encontro inesperado com uns piratas espaciais.
sys_expe_attack_1_2_2: Caímos numa emboscada de uns piratas estelares! Infelizmente, a luta foi inevitável.
sys_expe_attack_1_2_3: O pedido de socorro de outra frota de expedição era uma armadilha de uns piratas espertinhos. A batalha foi inevitável.
sys_expe_attack_1_3_1: Os sinais interceptados não vinham de alienígenas desconhecidos, mas de uma base pirata secreta! Os piratas não gostaram nada da nossa presença no setor deles.
sys_expe_attack_1_3_2: A frota de expedição reportou combates intensos com naves piratas não identificadas!
sys_expe_attack_1_3_3: 'Acabamos de receber uma mensagem urgente do comandante da expedição: "Estão vindo para cima da gente! Saltaram do hiperespaço, mas por sorte são só piratas, então temos chance. Vamos lutar!"'
sys_expe_attack_2_1_1: Sua frota de expedição teve um primeiro contato nada amigável com uma espécie desconhecida.
sys_expe_attack_2_1_2: Umas naves estranhas atacaram a frota de expedição sem aviso!
sys_expe_attack_2_1_3: Nossa expedição foi atacada por um pequeno grupo de espaçonaves não identificadas!
sys_expe_attack_2_1_4: A frota de expedição reporta contato com naves desconhecidas. As mensagens de rádio não podem ser decodificadas, mas as naves estranhas parecem estar ligando as armas.
sys_expe_attack_2_2_1: Uma espécie desconhecida está atacando a nossa expedição!
sys_expe_attack_2_2_2: Sua frota de expedição aparentemente invadiu o território de uma raça alienígena até então desconhecida, mas muito agressiva.
sys_expe_attack_2_2_3: A conexão com a nossa frota de expedição foi cortada de repente. A última coisa que ouvimos foi que a frota estava sob fogo pesado. Não deu para identificar os atacantes.
sys_expe_attack_2_3_1: Sua expedição deu de cara com uma frota de invasão alienígena e reporta batalhas gigantescas!
sys_expe_attack_2_3_2: Um grande grupo de naves cristalinas de origem desconhecida está em rota de colisão direta com a nossa frota de expedição. Temos que nos preparar para o pior.
sys_expe_attack_2_3_3: Tivemos um pouco de dificuldade para pronunciar direito o dialeto da raça alienígena. Nosso diplomata gritou "Fogo!" em vez de "Paz!" sem querer.
