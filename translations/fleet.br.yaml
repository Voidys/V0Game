sys_expe_depleted_max_1: 'Entrada do diário de bordo do oficial de comunicações: se algum dia nos sentirmos inseguros, sempre podemos juntar forças com as outras expedições que andam por aqui.'
sys_expe_depleted_max_2: 'Entrada do diário de bordo do oficial de comunicações: se continuar assim, vamos ter que instalar boias de navegação para dar conta de todo esse tráfego.'
sys_expe_depleted_max_3: 'Entrada do diário de bordo do oficial de comunicações: talvez fosse mais útil abrir uma loja de souvenirs aqui do que mandar mais uma expedição.'
sys_expe_depleted_med_1: 'Entrada do diário de bordo do oficial de comunicações: encontramos sinais de várias frotas de expedição na região. Estamos voltando para casa.'
sys_expe_depleted_med_2: 'Entrada do diário de bordo do oficial de comunicações: estabelecemos contato de rádio amigável com algumas outras expedições neste setor.'
sys_expe_depleted_med_3: 'Entrada do diário de bordo do oficial de comunicações: comemoramos o fim da expedição com a tripulação de outra frota de expedição que viajava no mesmo setor. Eles também não têm nada de novo para contar.'
sys_expe_depleted_min_1: 'Entrada do diário de bordo do oficial de comunicações: parece que já tiveram humanos nessa parte da galáxia.'
sys_expe_depleted_min_2: 'Entrada do diário de bordo do oficial de comunicações: encontramos destroços de espaçonaves antigas. Não somos os primeiros a chegar aqui.'
sys_expe_depleted_min_3: 'Entrada do diário de bordo do oficial de comunicações: quase batemos em outra frota de expedição. Nunca imaginei que ia ter mais alguém aqui fora.'
sys_expe_depleted_not_1: 'Entrada do diário de bordo do oficial de comunicações: parece que essa parte do universo ainda não foi explorada.'
sys_expe_depleted_not_2: 'Entrada do diário de bordo do oficial de comunicações: é incrível ser o primeiro a atravessar um setor inexplorado.'
