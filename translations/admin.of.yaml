se_pow_adaptive_info: 'An: auffällische IP-Adressen un Netze (/24 bzw. /64) kriege ei deutlich schwerere Aufgab (viele Anfragen, Fehlversuch oder Registrierunge in kurzer Zeid). Aus: alle Besucher kriege die einfache Aufgab, es werde keine Zähler ausgewertet.'
