se_rebuild_protection_info: Bei großen Verlusten wir Spielern ein Wiederaufbau-Schutz gegen weitere Angriffe nach 6h für 48h nach dem Angriff gewährt. 70% Flotte oder 80% Transportkapazität müssen in einem Angriff vernichtet werden. Zudem muss dies mindestens den Noopschutzpunkten * 1000 an Units oder Kapazität entsprechen. Der Nutzer kann den Modus vorzeitig beenden.
