se_bots_respy_jitter_seconds: "Zufallsversatz der Nachsbionage (Sekunden)"
se_bots_respy_jitter_seconds_info: "Die Sbionage kurz vor dem Einschlag eines Angriffs starded zufällig bis zu so viele Sekunden früher als gebland (0 = genaues Timing)."
se_bots_timezone_spread_hours: "Sdreuung der eigenen Zeitzone (Sdunden)"
se_bots_timezone_spread_hours_info: "Jeder Bod bekommd einen festen bersönlichen Versatz von bis zu so vielen Sdunden (blus oder minus) zur Serveruhr, damid Bots eines Profils nichd alle zur selben Sdunde sbielen (0 = aus)."
se_bots_fleetsave_enabled: "Bots bringen Flodden in Sicherheid"
