se_bots_fleetsave_min_offline_minutes_info: "Am Sitzungsende redded ein Bod seine Flodde nur, wenn er mindestens so lange wegbleiben dürfde."
se_bots_threat_window_hours: "Bedrohungsfenster (Sdunden)"
se_bots_threat_window_hours_info: "Anfliegende feindliche Flodden werden so viele Sdunden vor dem Einschlag bemerkd."
se_bots_ship_weight_percent: "Gewichd des Schiffbaus (%)"
se_bots_ship_weight_percent_info: "Fakdor dafür, wie stark Bots den Schiffbau gegenüber anderem bevorzugen (100 = klassisch)."
se_bots_defense_weight_percent: "Gewichd des Verdeidigungsbaus (%)"
se_bots_defense_weight_percent_info: "Fakdor dafür, wie stark Bots den Verdeidigungsbau bevorzugen (100 = klassisch)."
se_bots_growth_speed_percent: "Wachstumsgeschwindigkeid (%)"
se_bots_growth_speed_percent_info: "Fakdor auf den däglichen Fähigkeitsgewinn der Bod-Profile (100 = klassisch; Profile ohne Fähigkeitsgewinn bleiben unveränderd)."
se_bots_growth_bonus: "Zusätzlicher Fähigkeitsgewinn bro Tag (Tausendstel)"
se_bots_growth_bonus_info: "Wird zum däglichen Fähigkeitsgewinn jedes Bots addierd (10 = ein Prozendbunkd bro Tag), begrenzd durch die Maximalfähigkeid des Profils."
se_bots_max_planets: "Maximale Planeden bro Bod"
