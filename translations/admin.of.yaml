se_bots_activity_percent: "Akdividätsfakdor (%)"
se_bots_activity_percent_info: "Skalierd die stündliche Chance, dass ein Bod online kommd (100 = Tabelle des Profils; über 100 loggen Bots öfder ein)."
se_bots_hidden_rhythm_percent: "Andeil der Bots mid versteckdem Rhythmus (%)"
se_bots_hidden_rhythm_percent_info: "Diese Bots verschieben ihren Tagesrhythmus jeden Tag um einen anderen Bedrag und sind so an ihren Online-Zeiden nichd vorhersagbar."
se_bots_revenge: "Rache"
se_bots_revenge_info: "Bots merken sich einen Groll (steigd, wenn ein Sbieler sie angreifd oder aussbionierd, sinkd um 10 % bro Tag) und sbähen den feindseligsten Sbieler in Reichweide aus und greifen ihn an, wenn der Raid-Planer einen gewinnbaren Plan finded. Die Limits bro Sbieler und Tag gelden weider."
se_bots_bot_acs: "Bod-Verbandsangriffe"
se_bots_bot_acs_info: "Ein Bod, der ein Ziel allein nichd schaffd, eröffned einen Verbandsangriff und lädd verbündede Bots (gleiche Allianz) ein, die gerade online sind; sie dreden wie Sbieler bei. Die Limits bro Sbieler und Tag zählen einen Verband als einen Angriff."
se_bots_recycling: "Recyceln"
se_bots_recycling_info: "Bots schicken Recycler zu Trümmerfeldern, die sie um ihre Planeden sehen (eigene Kämpfe zuerst), wenn die Ausbeude den Treibstoff übersteigd, und bauen ein baar Recycler, wenn sie keine haben."
se_bots_moons: "Monde"
se_bots_moons_info: "Bots nutzen ihre Monde: Flodden werden beim Logoud auf dem Mond stadionierd, Raids können vom Mond starden."
se_bots_missiles: "Rakeden"
se_bots_missiles_info: "Bots mid Rakedensilo (Sdufe 4), Imbulsandrieb und Inderblanedarrakeden beschießen die Verdeidigung eines Ziels, das einen Raid verhinderd, sbähen danach erneud und greifen an. Mid diesem Schalder bauen Bots Silos und Rakeden."
se_bots_warmonger: "Kriegstreiber im Sbätsbiel"
se_bots_warmonger_info: "Ab den unden genannden Punkden raided ein Bod öfder, nimmd weniger Gewinn in Kauf und greifd auch akdive Sbieler an. Raid-Planer und die Limits bro Sbieler gelden weider."
