spytechStatsDescription: >-
  Ai livelli 0 e 1 puoi vedere solo i punti totali degli altri giocatori. Dal
  livello 2 vedi anche i loro punti costruzioni; dal livello 4, i loro punti
  ricerca. Dal livello 6 vedi anche i loro punti navi e difesa, oltre alle loro
  statistiche di battaglia.
