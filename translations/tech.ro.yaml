  La nivelurile 0 și 1 poți vedea doar punctele totale ale celorlalți jucători.
  De la nivelul 2 vezi și punctele lor de clădiri; de la nivelul 4, punctele lor
  de cercetare. De la nivelul 6 vezi și punctele lor de nave și apărare, precum
  și statisticile lor de luptă.
