sys_destruc_title: '以下艦隊為了摧毀月球而對決：'
sys_expe_attack_1_1_1: 一名走投無路的太空海盜企圖劫持我們的遠征艦隊。
sys_expe_attack_1_1_2: >-
  一群原始野蠻人駕著太空船攻擊了我們。至少他們的船破爛得嚇人。如果他們的火力真的有威脅，我們就得認真還擊了。
sys_expe_attack_1_1_3: >-
  我們截獲了幾段醉醺醺的海盜的無線電通訊。看來我們就要被攻擊了。
sys_expe_attack_1_1_4: >-
  我們得跟一些海盜打一場，幸好我們人數比他們多。
sys_expe_attack_1_1_5: >-
  艦隊回報，一位叫莫亞·提卡爾的人和他的船員要求我們的艦隊無條件投降。如果他們是認真的，就會發現我們很會自衛。
sys_expe_attack_1_2_1: 你的遠征艦隊意外遭遇了一群太空海盜。
sys_expe_attack_1_2_2: >-
  我們飛進了一群星際海盜的埋伏！可惜，這場仗躲不掉。
sys_expe_attack_1_2_3: >-
  另一支遠征艦隊的求救訊號，原來是一群狡猾海盜設下的陷阱。一場戰鬥無法避免。
sys_expe_attack_1_3_1: >-
  截獲的訊號不是來自未知的外星人，而是一座秘密海盜基地！海盜們對我們闖進他們的星區很不高興。
sys_expe_attack_1_3_2: 遠征艦隊回報，與身分不明的海盜船展開激烈戰鬥！
sys_expe_attack_1_3_3: >-
  我們剛收到遠征指揮官的緊急訊息：「他們衝著我們來了！他們從超空間跳出來，幸好只是海盜，我們還有機會，打吧！」
sys_expe_attack_2_1_1: 你的遠征艦隊和一個未知種族有了不太友善的第一次接觸。
sys_expe_attack_2_1_2: 一些奇怪的船艦不經警告就攻擊了遠征艦隊！
sys_expe_attack_2_1_3: 我們的遠征隊被一小群身分不明的太空船攻擊了！
sys_expe_attack_2_1_4: >-
  遠征艦隊回報與未知船艦接觸。無線電訊息無法解碼，但那些奇怪的船似乎正在為武器充能。
sys_expe_attack_2_2_1: 一個未知種族正在攻擊我們的遠征隊！
sys_expe_attack_2_2_2: >-
  你的遠征艦隊顯然闖入了一個先前未知、但極具攻擊性的外星種族的領地。
sys_expe_attack_2_2_3: >-
  我們和遠征艦隊的聯繫突然中斷。最後得知的消息是，艦隊正遭受猛烈砲火。攻擊者的身分無法確認。
sys_expe_attack_2_3_1: >-
  你的遠征隊撞上了一支外星入侵艦隊，並回報發生大規模戰鬥！
sys_expe_attack_2_3_2: >-
  一大群來歷不明的晶體船艦，正與我們的遠征艦隊直接對撞。我們得做好最壞的打算。
sys_expe_attack_2_3_3: >-
  我們在正確念出外星種族的方言時遇到了一點困難。我們的外交官不小心喊成了「開火！」而不是「和平！」
sys_expe_attackname_1: 海盜
