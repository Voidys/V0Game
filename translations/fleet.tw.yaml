sys_expe_depleted_max_1: >-
  通訊官的航行日誌：如果哪天覺得不安全，我們隨時可以和附近飛來飛去的其他遠征隊合流。
sys_expe_depleted_max_2: >-
  通訊官的航行日誌：照這樣下去，我們得設置導航浮標來應付這麼多的交通了。
sys_expe_depleted_max_3: >-
  通訊官的航行日誌：也許在這裡開一間紀念品店，比再派一支遠征隊更有用。
sys_expe_depleted_med_1: >-
  通訊官的航行日誌：我們在這一帶發現好幾支遠征艦隊的痕跡。我們準備回家了。
sys_expe_depleted_med_2: >-
  通訊官的航行日誌：我們和這個星區的幾支其他遠征隊建立了友好的無線電聯繫。
sys_expe_depleted_med_3: >-
  通訊官的航行日誌：我們和同星區另一支遠征艦隊的船員一起慶祝遠征結束。他們也沒有什麼新發現可以報告。
sys_expe_depleted_min_1: >-
  通訊官的航行日誌：看來人類以前就來過銀河系的這一帶了。
sys_expe_depleted_min_2: >-
  通訊官的航行日誌：我們發現了舊太空船的殘骸。我們不是第一批來這裡的人。
sys_expe_depleted_min_3: >-
  通訊官的航行日誌：我們差點和另一支遠征艦隊撞上。我從沒想過這種鳥不生蛋的地方還有別人。
sys_expe_depleted_not_1: >-
  通訊官的航行日誌：看來宇宙的這一塊還沒有人探索過。
sys_expe_depleted_not_2: >-
  通訊官的航行日誌：成為第一批穿越未探索星區的人，感覺太棒了。
sys_expe_feqeuence_few: 過去 24 小時內超過 10 次遠征
sys_expe_feqeuence_many: 過去 24 小時內超過 50 次遠征
sys_expe_feqeuence_medium: 過去 24 小時內超過 25 次遠征
sys_expe_found_goods: '開採到 %s %s。'
sys_expe_found_ress_1_1: >-
  你的遠征隊發現了一小片小行星群，從中開採到了一些資源。
sys_expe_found_ress_1_2: >-
  在一顆偏遠的小行星上，發現了幾處容易開採的資源田，並成功提煉出原料。
sys_expe_found_ress_1_3: >-
  你的遠征隊撞見了很久以前一場戰鬥留下的老舊太空船殘骸。部分零件被回收再利用了。
sys_expe_found_ress_1_4: >-
  遠征隊發現了一顆被輻射污染、大氣劇毒的行星。不過掃描顯示這顆行星蘊藏大量原料。他們派出自動無人機，盡可能多地開採資源。
sys_expe_found_ress_2_1: >-
  你的遠征隊發現了一支古老的貨運船隊，貨物裝得滿滿的，卻空無一人。取得了一些資源。
sys_expe_found_ress_2_2: >-
  你的遠征隊在一顆自帶大氣層的小衛星上發現了豐富的原料礦藏。船員們正在開採這筆寶藏。
sys_expe_found_ress_2_3: >-
  我們遇到一小隊民用船隻，他們急需食物和藥品。作為交換，我們拿到了相當可觀的實用資源。
sys_expe_found_ress_3_1: >-
  你的遠征艦隊回報發現了一艘巨大的外星船骸。雖然他們拿那些科技沒轍，但整艘船可以拆成零件，換到珍貴的原料。
sys_expe_found_ress_3_2: >-
  一顆未知行星周圍的小行星帶蘊藏著大量原料。遠征艦隊把儲藏室都塞滿了！
sys_expe_found_ress_logbook_1: >-
  大副的航行日誌：我們把每一寸空間都用上了，還是帶不走所有發現的資源。
sys_expe_found_ress_logbook_2: >-
  大副的航行日誌：要是再多幾艘貨船就好了！現在我們得丟下一堆資源。
sys_expe_found_ress_logbook_3: >-
  大副的航行日誌：我們已經把不需要的東西全丟了，還是騰不出足夠的空間來裝所有發現的資源。
sys_expe_found_ress_logbook_4: >-
  大副的航行日誌：連餐廳和所有休息室都改成儲藏室了，我們還是運不走所有發現的資源。
sys_expe_found_ships_1_1: >-
  我們發現了前一支遠征隊的殘骸！我們的技術人員正在檢查，看能不能讓其中一些殘骸重新運作。
sys_expe_found_ships_1_2: >-
  我們發現了一座廢棄的海盜基地。機庫裡還停著一些舊船。我們的技術人員正在檢查哪些船還能用。
sys_expe_found_ships_1_3: >-
  我們的遠征隊發現一顆幾乎被戰爭徹底摧毀的行星。軌道上漂浮著各種船骸。技術人員嘗試修復其中幾艘。也許我們能更了解這裡到底發生過什麼事。
sys_expe_found_ships_1_4: >-
  遠征隊偶然發現一座似乎已被遺棄了一輩子的古老星際基地。堡壘的機庫裡找到幾艘船。技術人員成功讓其中幾艘重新飛起來。
sys_expe_found_ships_2_1: >-
  我們發現了一支艦隊的殘骸。遠征隊的技術人員立刻登上那些部分完好的船，並修好了其中幾艘。
sys_expe_found_ships_2_2: >-
  我們的遠征隊發現了一座古老的自動化船廠，裡面還有幾艘船處於生產階段。恢復船廠的能源供應之後，我們的技術人員著手完成它們的建造。
sys_expe_found_ships_3_1: >-
  我們發現了一座巨大的船艦墳場。遠征隊的幾名技術人員成功讓一兩艘船重新運作了。
sys_expe_found_ships_3_2: >-
  我們發現了一顆留有文明遺跡的行星。從外太空還看到另一座依然完好的巨型艦船基地。我們的一些技術人員和飛行員已經登陸地表，確認能不能取回幾艘船。
sys_expe_found_ships_logbook_1: >-
  輪機長的航行日誌：如果多帶幾艘船來，要把那些美人帶回家就輕而易舉了！
sys_expe_found_ships_logbook_2: >-
  輪機長的航行日誌：可惜我們沒有足夠的容量，把這趟任務發現的所有船都帶回去。
sys_expe_found_ships_logbook_3: >-
  輪機長的航行日誌：可惜我們沒有足夠的容量，把發現的所有船都帶回去。
sys_expe_found_ships_nothing: 沒有發現任何艦船。
sys_expe_lost_fleet_1: >-
  遠征隊只留下了這段無線電訊息：滋滋嗶 天啊！...喀嗞嗞嗞那個滋嗶嗶看到嗞嗞嗞 對 從怎麼 喀嗞嗞嗞嗞嗞嗞...
sys_expe_lost_fleet_2: >-
  我們最後收到的遠征隊資料，是一組好得不可思議的黑洞張開的特寫。
sys_expe_lost_fleet_3: >-
  其中一艘指揮艦上的核反應爐破裂，引發連鎖反應，在一場壯觀的爆炸中摧毀了整支遠征隊。
sys_expe_lost_fleet_4: >-
  遠征艦隊在超空間跳躍後沒有回來。我們的科學家還在苦思究竟發生了什麼事，但艦隊看來是永遠失蹤了。
sys_expe_nothing_1: >-
  這次遠征沒帶回什麼令人興奮的東西，只有幾隻來自未知沼澤行星的好奇小動物。
sys_expe_nothing_2: >-
  你的遠征隊拍到了超新星的美麗照片。不過這趟遠征並沒有帶來什麼新發現。但它很有機會拿下今年的宇宙最佳照片大賽。
sys_expe_nothing_3: >-
  一個奇怪的電腦病毒在離開太陽系不久後讓導航失靈。結果整支遠征艦隊一路都在繞圈圈。不用說，這次遠征沒什麼成果。
sys_expe_nothing_4: >-
  一種純能量生命體讓所有遠征成員盯著螢幕上催眠般的符號好幾天。等大部分人終於清醒時，遠征隊已經因重氫不足而被迫取消。
sys_expe_nothing_5: >-
  嗯，至少我們現在知道，第五級紅色異常不只會對船艦系統造成混亂，還會讓船員大規模產生幻覺。可惜這趟遠征沒有其他發現。
sys_expe_nothing_6: >-
  儘管一開始對這個星區的掃描看起來很有希望，我們還是空手而歸。
sys_expe_nothing_7: >-
  也許不該在這顆偏遠行星上幫船長慶生。一場可怕的出血熱把大部分船員送進醫務室，人手嚴重不足，導致遠征失敗。
sys_expe_nothing_8: >-
  你的遠征隊除了廣闊的太空虛無，什麼也沒發現。連一顆小行星、輻射、粒子，或任何能讓這趟遠征稍微有趣一點的東西都沒有。
sys_expe_nothing_9: >-
  指揮艦的反應爐故障，差點毀掉整支遠征隊。幸好技術人員能力超群，阻止了最糟的情況。不過修理花了太多時間，遠征隊什麼成果都沒有就回來了。
sys_expe_report: 遠征報告
sys_expe_report_msg: '%s %s 的艦隊在 %s 的遠征報告：'
sys_expe_time_fast_1: >-
  推進系統能量線圈出現了一個未預期的回饋迴路，加速了遠征隊的返航，比預期更早抵達。不過初步報告指出，他們沒有其他可以報告的東西。
sys_expe_time_fast_2: >-
  有點大膽的新任指揮官利用一個不穩定的蟲洞縮短返航路程，而且成功了！不過遠征本身沒有帶來新的發現。
sys_expe_time_fast_3: >-
  你的遠征隊回報在探索的星區沒有發現異常。不過艦隊在返航途中遇到太陽風，大幅加快了航程。你的遠征隊會比預期早一點回到家。
sys_expe_time_slow_1: >-
  領航員的嚴重失誤，讓艦隊完全降落在錯誤的地方。結果返航花了長得多的時間。
sys_expe_time_slow_2: >-
  不明原因讓艦隊的跳躍完全出錯。他們差點掉進一顆恆星的核心！還好降落在一個已知的星系，但返航會比原本計畫的更久。
sys_expe_time_slow_3: >-
  新的導航模組似乎還有一些臭蟲。遠征艦隊不只飛到完全錯誤的方向，還把重氫全部耗光了！遠征隊只好失望地靠備用電力返航。
sys_expe_time_slow_4: >-
  你的遠征隊進入了粒子風暴增強的星區。這讓儲能系統過載，導致所有船艦的主系統失靈。你的技師們成功阻止了最糟的狀況，但遠征隊會嚴重延遲才能返航。
sys_expe_time_slow_5: >-
  你的遠征艦隊旗艦和一艘毫無預警直接跳進艦隊的外星船撞上了。那艘外星船爆炸，旗艦受損嚴重。等最嚴重的損傷修好之後，你的艦船就會開始返航，因為遠征隊在現在的狀態下無法繼續。
sys_expe_time_slow_6: >-
  一顆紅巨星的恆星風扭曲了遠征隊的跳躍，讓導航系統把返航路程完全算錯。結果遠征隊發現自己身處陌生恆星之間的茫茫虛空。
