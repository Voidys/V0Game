Achievement_text:
  '1': 'Cho 5 đòn tấn công của bạn đáp xuống giữa nửa đêm và 6 giờ sáng trong cùng một đêm mà không thắng đòn nào.'
  '2': Bạn có hạm đội bay liên tục suốt 90 ngày.
  '3': Bạn mất hạm đội khi ngôn ngữ đang đặt là "Tiếng Pháp".
  '4': Nghiên cứu Công nghệ ion cấp 10.
  '5': Nghiên cứu Nghiên cứu graviton cấp 2, chỉ vì bạn làm được.
  '6': Một cuộc tấn công của bạn trở về chỉ với 1 kim loại, 1 tinh thể và 1 deuterium.
  '7': Đánh bại một hạm đội hải tặc hoặc người ngoài hành tinh tổng cộng ít nhất 10.000 tàu. Không gian là của chúng ta!
  '8': Có mặt tại buổi Strammtisch (thứ Ba lúc 8 giờ tối trên Discord).
  '9': Xây Tử Tinh đầu tiên của bạn.
  '10': Phá hủy mặt trăng của một người chơi.
  '11': Chơi 14 ngày chỉ trên điện thoại.
  '12': Hạm đội của bạn bị hố đen phá hủy trong chuyến thám hiểm đầu tiên.
  '13': Gửi hạm đội đi khi chỉ còn chưa đến 5 giây trước khi cuộc tấn công đang tới đổ bộ.
  '14': Mất 10 hạm đội vào hố đen. Hư vô đang đói.
  '15': 'Không nhận được mặt trăng đầu tiên sau 10 trận chiến với tỉ lệ mặt trăng tối đa.'
  '16': Hơn 250 tàu tái chế của bạn trở về tay trắng.
  '17': Xếp ít nhất 5000 Bệ phóng tên lửa vào một lệnh xây duy nhất.
  '18': Đốt 5 triệu deuterium làm nhiên liệu trên một hành tinh trong vòng 24 giờ.
  '19': Nghiên cứu Công nghệ giáp cấp 3.
  '20': Nghiên cứu Công nghệ giáp cấp 6.
  '21': Nghiên cứu Công nghệ giáp cấp 9.
  '22': Nghiên cứu Công nghệ giáp cấp 12.
  '23': Nghiên cứu Công nghệ giáp cấp 15.
  '24': Nghiên cứu Công nghệ laser cấp 12.
  '25': Tham gia Kỷ lục.
  '26': Xóa hành tinh mang lại cho bạn nhiều điểm nhất (ít nhất 100.000 điểm).
  '27': Nghiên cứu Mạng nghiên cứu liên thiên hà cấp 1.
  '28': Nâng cả ba kho trên một mặt trăng lên ít nhất cấp 3.
  '29': Tập thể hóa hạm đội của một người điểm cao hơn bằng ACS 5 người.
  '30': Một mình đẩy lùi ACS 5 người.
  '31': Khiến một người chơi vào chế độ nghỉ phép bằng cuộc tấn công của bạn.
  '32': Cướp 1000 hành tinh khi dùng giao diện "SetSail". Arr!
  '33': Trở lại từ chế độ nghỉ phép.
  '34': Bị tấn công lần đầu tiên. Chào mừng đến với vũ trụ.
  '35': Tấn công một người chơi đang hoạt động có điểm dưới 1/10 điểm của bạn.
  '36': 'Nhận một tin nhắn chứa một trong các cụm sau: "Hurensohn", "gleichstarke Ziele", "gegen Schwächere", "ehrenlos"'
  '37': Bị ACS 5 người xóa sổ.
  '38': Tấn công thành viên liên minh của chính bạn. Bắn nhầm đồng đội, có ai không?
  '39': Tấn công ai đó với đúng 42 tàu.
  '40': Thực dân hóa một hành tinh cách ít nhất nửa vũ trụ.
  '41': Chặn một ô hạm đội suốt một tuần bằng một lời chào bán tệ ở chợ.
  '42': Vào Sảnh chiến đấu 4 lần ở phía thua cuộc.
  '43': Thắng một trận khi tài khoản của bạn bị đánh dấu Không hoạt động, trên một hành tinh của bạn từng có hạm đội đến với thời gian bay hơn 7 ngày.
  '44': Sản xuất một tài nguyên trên hành tinh hơn 7 ngày khi năng lượng dưới 100%.
  '45': Thắng một cuộc tấn công vào người chơi nằm trong top 5 về phòng thủ.
  '46': Kích hoạt bảo vệ chống bash bằng cách bắn tên lửa liên hành tinh.
  '47': Phá hủy 5 mặt trăng.
  '48': Mất 5 Tử Tinh khi cố phá hủy mặt trăng. Đau thật.
  '49': Phá bỏ một thuộc địa ngay sau khi tạo.
  '50': Mất toàn bộ vệ tinh mặt trời trên một hành tinh có đủ năng lượng để nghiên cứu Công nghệ graviton, mà chưa nghiên cứu Công nghệ graviton.
  '51': Dùng hết sạch deuterium khi lướt bản đồ thiên hà.
  '52': Xây Tử Tinh mà chưa từng xây tàu chiến nào khác (Chiến đấu cơ nhẹ, Chiến đấu cơ nặng, Tàu tuần dương, Thiết giáp hạm, Máy bay ném bom, Tàu hủy diệt hoặc Tuần dương chiến đấu) trước đó.
  '53': Giữ cấp cao nhất ở 5 nghiên cứu cùng lúc.
  '54': Canh giờ một cuộc tấn công vào người chơi đang hoạt động để đổ bộ lúc 01/01 00:00:00.
  '55': Thành tựu đặc biệt
  '56': 'Đạt cấp 15 động cơ siêu không gian.'
  '57': 'Đạt cấp 15 thiên văn vật lý.'
  '58': 'Nghiên cứu mọi công nghệ (trừ graviton) ít nhất một lần.'
  '59': 'Đưa mọi nghiên cứu (trừ graviton) lên cấp 10.'
  '60': 'Sở hữu 1.000.000.000 của một tài nguyên trên một hành tinh hoặc mặt trăng.'
  '61': 'Có 1000 vệ tinh mặt trời cùng lúc trên một hành tinh.'
  '62': 'Xây kín mọi ô của một hành tinh có ít nhất 250 ô.'
  '63': 'Nâng kho kim loại, tinh thể và deuterium lên cấp 15 trên một hành tinh.'
  '64': 'Có mỏ kim loại cấp 30 trở lên trên 9 hành tinh.'
  '65': 'Bắt đầu một lệnh xây dựng kéo dài hơn 30 ngày.'
  '66': 'Để người chơi khác mua 50 lời chào bán của bạn trên chợ.'
  '67': 'Thắng một trận phòng thủ trước kẻ tấn công có giá trị ít nhất gấp 10 lần hạm đội và phòng thủ của bạn (kẻ tấn công có giá trị ít nhất 1.000.000 tài nguyên).'
  '68': 'Thắng một trận tấn công tiêu diệt ít nhất 1000 đơn vị địch mà không mất đơn vị nào.'
  '69': 'Kết thúc một trận hòa sau số hiệp tối đa, mỗi bên mất ít nhất 10.000 đơn vị.'
  '70': 'Bị tấn công trên một hành tinh không có tàu và phòng thủ, nên kẻ tấn công không cướp được gì.'
  '71': 'Nhận một mặt trăng từ trận đánh chỉ có 1 % cơ hội ra mặt trăng.'
  '72': 'Tiêu diệt ít nhất 100 đơn vị phòng thủ bằng một đòn tên lửa liên hành tinh.'
  '73': 'Tiêu diệt ít nhất 100 tàu do thám địch trong một trận đánh trên hành tinh của bạn.'
  '74': 'Cướp tổng cộng 1.000.000.000 tài nguyên.'
  '75': 'Tái chế tổng cộng 1.000.000.000 tài nguyên.'
  '76': 'Sửa chữa tổng cộng 1000 tàu từ bãi đổ nát.'
  '77': 'Kiếm 1000 điểm danh dự.'
  '78': 'Lần đầu tiên trở thành kẻ ngoài vòng pháp luật.'
  '79': 'Tham gia với tư cách người tấn công trong 25 đòn tấn công liên hợp thắng lợi.'
  '80': 'Trải qua mọi kết quả viễn chinh có thể có ít nhất một lần.'
  '81': 'Gửi 1000 chuyến viễn chinh.'
  '82': 'Thắng một trận viễn chinh trước hạm đội người ngoài hành tinh lớn.'
  '83': 'Tìm thấy lượng tài nguyên lớn trong 50 chuyến viễn chinh.'
  '84': 'Gửi một hạm đội bay một chiều hơn 24 giờ.'
  '85': 'Cho một hạm đội đến đích vào ngày 29 tháng 2.'
  '86': 'Mất toàn bộ hạm đội tấn công vào Thứ Sáu ngày 13.'
  '87': 'Cho hai đòn tấn công của bạn (không phải liên hợp) đáp xuống cùng một mục tiêu trong cùng một giây.'
  '88': 'Có cùng lúc các hạm đội đang bay tới mọi thiên hà của vũ trụ.'
  '89': 'Hoàn thành hướng dẫn.'
  '90': 'Có cùng lúc hiệp ước đang hiệu lực với 3 liên minh khác (mọi thành viên liên minh đều nhận được).'
  '91': 'Tạo 5 trang wiki của liên minh.'
  '92': 'Có 10 lời mời kết bạn được chấp nhận.'
  '93': 'Đứng số 1 bảng xếp hạng tổng điểm trong 7 ngày liên tiếp.'
  '94': 'Có cùng lúc 100 Tử tinh trên một hành tinh hoặc mặt trăng.'
  '95': 'Chiếm mọi vị trí hành tinh mà thiên văn vật lý của bạn cho phép (ít nhất 9), mỗi hành tinh có ít nhất 200 ô.'
  '96': 'Sở hữu thêm 50 thành tựu khác.'
