ins_feat_alliance_goals: '聯盟目標'
ins_feat_alliance_goals_info: '聯盟首領為成員設定每週目標；完成後可獲得徽章。'
ins_feat_returning: '歡迎回來'
ins_feat_returning_info: '長時間離開後回歸的玩家可以查看期間發生的事，並獲得短暫保護。'
ins_feat_seasons: '賽季'
ins_feat_seasons_info: '每月排行榜（掠奪者、戰士、守衛者、探索者、回收者），沒有任何重置；獲勝者可獲得徽章。'
ins_feat_cosmetics: '徽章與頭銜'
ins_feat_cosmetics_info: '在玩家卡片和聊天中顯示已獲得的徽章、頭銜與名稱顏色。'
ins_feat_bounties: '賞金'
ins_feat_bounties_info: '玩家在其他玩家身上懸賞資源；摧毀其足夠艦隊的人即可領取。'
ins_feat_alliance_wars: '聯盟戰爭積分'
ins_feat_alliance_wars_info: '為聯盟外交中宣布的戰爭提供即時積分板。'
ins_feat_battle_feed: '戰鬥動態'
ins_feat_battle_feed_info: '大型戰鬥會在全域聊天中公告（需要聊天功能）。'
ins_feat_derelicts: '殘骸區域'
ins_feat_derelicts_info: '回收區域會在星系中出現一段時間；率先抵達的回收者可以收取。'
ins_feat_mothership: '海盜母艦'
ins_feat_mothership_info: '罕見的世界首領，只能在 ACS 中擊敗；戰利品依傷害分配。'
ins_feat_expedition_stories: '遠征故事'
ins_feat_expedition_stories_info: '稀有訊號會引導玩家完成一段簡短的遠征任務，獲得更豐厚的獎勵。'
ins_feat_relics: '遺物'
ins_feat_relics_info: '遠征可能找到遺物（普通到史詩，帶套裝加成），玩家可將其裝備在星球上獲得小幅加成。'
