ins_step_legal: Aspetos legais
ins_legal_desc: Escolhe onde o jogo fica alojado e como começam as páginas legais e o fórum da comunidade. Podes alterar tudo isto mais tarde na área de administração (Definições, Páginas).
ins_group_privacy: Região de alojamento
ins_privacy_info: A região determina a política de privacidade usada por predefinição.
ins_privacy_eu: UE / EEE - política de privacidade RGPD
ins_privacy_eu_info: Escolhe esta opção se o jogo estiver alojado na União Europeia ou no Espaço Económico Europeu, ou se for dirigido a jogadores de lá.
ins_privacy_other: Fora da UE - política de privacidade geral
ins_privacy_other_info: Uma política de privacidade em linguagem simples, sem referências ao RGPD.
ins_group_rules: Regras
ins_rules_default: Importar as regras predefinidas
ins_rules_default_info: A página de regras começa com as regras padrão do jogo, que podes editar depois.
ins_rules_blank: Começar em branco
ins_rules_blank_info: A página de regras fica vazia até escreveres as tuas próprias regras na área de administração.
ins_group_community: Comunidade
ins_cookie_consent: Mostrar aviso de consentimento de cookies (RGPD)
ins_cookie_consent_info: Mostra aos visitantes um aviso sobre os cookies usados pelo jogo. Recomendado a operadores que servem a UE. Pode ser alterado mais tarde nas definições.
ins_board: Ativar o fórum da comunidade
ins_board_info: Um fórum para os teus jogadores. Quando desligado, todas as ligações para o fórum ficam ocultas e as páginas do fórum não estão disponíveis.
ins_legal_note: Os textos gerados são apenas modelos. Como operador, és responsável pelos textos legais do teu jogo e deves revê-los.
ins_legal_region_invalid: Escolhe uma região de alojamento válida.
ins_legal_rules_invalid: Escolhe como devem começar as regras.
