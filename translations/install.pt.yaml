ins_done_cron_info: 'Sem ele nada avança no jogo (frotas, filas de construção, estatísticas). Adicione esta linha ao crontab do utilizador do servidor web (crontab -e) ou crie um cronjob com ela no painel do alojamento:'
ins_done_cron_help: "Como configurar o cronjob (também num painel de alojamento)"
ins_done_locked: A ferramenta de instalação está agora bloqueada.
ins_done_locked_info: Ninguém pode voltar a executar o assistente. Para atualizar mais tarde, siga a secção de atualização da documentação.
ins_done_https: Use HTTPS.
ins_done_https_info: 'Está em HTTP simples: as palavras-passe viajam sem cifragem. Configure um certificado (por exemplo Let''s Encrypt) antes de convidar jogadores.'
ins_done_https_ok: Esta página foi servida por HTTPS - ótimo.
ins_done_settings: Altere as definições mais tarde.
ins_done_settings_info: 'Admin - Definições: nome do jogo, velocidade, registo, e-mail (SMTP), bots e muito mais.'
