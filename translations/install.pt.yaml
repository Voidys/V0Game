install_desc: "Para ativar a ferramenta de instalação, crie o arquivo \"var/ENABLE_INSTALL_TOOL\"<br> O nome do arquivo diferencia maiúsculas de minúsculas e não tem final de tipo de arquivo.<br> O arquivo pode estar vazio. \nEle será excluído automaticamente após a conclusão da instalação ou se tiver mais de uma hora."
