ins_db_help: O V0Game guarda tudo numa base de dados MySQL ou MariaDB. Obtém os valores abaixo no painel do seu alojamento (procure "Bases de dados" ou "MySQL") ou de quem configurou o seu servidor. Se instalou o MySQL você mesmo, as predefinições costumam funcionar.
ins_db_host: Servidor de base de dados
ins_db_host_info: Quase sempre "localhost". Alguns alojamentos dão um nome como "db1.example.com".
ins_db_name_info: O nome da base de dados do jogo. Crie-a primeiro no painel do alojamento ou deixe o instalador criá-la (veja a caixa abaixo).
ins_db_advanced: Avançado (porta, prefixo das tabelas, palavra-passe de migração) - normalmente desnecessário
ins_db_prefix_info: Adicionado antes de cada nome de tabela. Altere apenas se partilhar uma base de dados com outro software.
ins_db_migrationpw_info: Protege a página de atualização (install/?mode=upgrade) para futuras atualizações do jogo. Se deixar vazio, o instalador gera uma forte e mostra-a uma vez na última página.
ins_db_migrationpw_placeholder: gerada automaticamente
ins_migrationpw_invalid: A palavra-passe de migração não pode conter aspas, barras invertidas, $ nem quebras de linha.
ins_err_technical: detalhes técnicos
ins_err_access_denied: O servidor de base de dados recusou o nome de utilizador ou a palavra-passe. Verifique ambos no painel do alojamento (maiúsculas e minúsculas contam).
ins_err_unknown_db: Esta base de dados não existe no servidor. Verifique o nome ou marque "Criar a base de dados" abaixo.
ins_err_no_privilege: Este utilizador da base de dados não tem permissão para usar essa base de dados. Dê-lhe todos os privilégios sobre ela no painel do alojamento.
ins_err_no_create: Este utilizador não tem permissão para criar bases de dados. Crie uma base de dados vazia no painel do alojamento e desmarque "Criar a base de dados".
ins_err_socket: O socket do servidor de base de dados não foi encontrado. Experimente o anfitrião "127.0.0.1" em vez de "localhost".
ins_err_unreachable: Não é possível contactar o servidor de base de dados "%s". Verifique o nome do anfitrião e a porta, e se o servidor de base de dados está em execução. Muitos alojamentos só permitem ligações dos seus próprios servidores web, por isso "localhost" costuma ser o correto.
ins_game_desc: Dê um nome ao seu jogo e escolha como ele funciona. Tudo aqui pode ser alterado mais tarde na administração (Admin - Definições).
ins_group_general: Geral
ins_uni_name: Nome do universo
ins_uni_name_info: Mostrado aos jogadores quando escolhem um universo. Vazio = "Universo 1".
ins_uni_name_invalid: O nome do universo pode ter no máximo 60 caracteres.
ins_language: Idioma predefinido
ins_language_info: Idioma para novos visitantes e para a sua conta de administrador.
ins_language_invalid: Idioma desconhecido.
ins_timezone: Fuso horário
ins_timezone_info: Pré-selecionado a partir do seu servidor. Usado para a hora do servidor apresentada.
ins_timezone_invalid: Fuso horário desconhecido.
ins_group_speed: Velocidade do jogo
ins_speed_info: A rapidez com que avançam edifícios, pesquisa, naves, frotas e produção. Clássico é o ritmo original; as predefinições mais rápidas servem comunidades pequenas e rondas curtas.
ins_speed_classic: Clássico
ins_speed_classic_info: o ritmo original, as rondas duram meses
ins_speed_fast: Rápido
ins_speed_fast_info: cerca de três vezes mais rápido, as rondas duram semanas
ins_speed_blitz: Blitz
ins_speed_blitz_info: até dez vezes mais rápido, as rondas duram dias
ins_speed_detail: Construção/pesquisa %bx, frotas %fx, recursos %rx
ins_speed_invalid: Predefinição de velocidade desconhecida.
ins_group_players: Jogadores
ins_registration: Registo
ins_registration_open: Aberto - qualquer pessoa pode registar-se
ins_registration_closed: Fechado - só você pode criar contas
ins_registration_info: Escolha "fechado" enquanto ainda estiver a configurar. Pode abri-lo mais tarde em Admin - Definições.
ins_registration_invalid: Definição de registo desconhecida.
ins_bots: Jogadores do computador (bots)
ins_bots_info: De 0 a 50. Os bots jogam como jogadores reais com hábitos diferentes, para que um universo novo não fique vazio. 0 = sem bots.
ins_bots_invalid: O número de bots tem de estar entre 0 e 50.
ins_mail: Enviar e-mails (registo, reposição de palavra-passe)
ins_mail_info: Desativado por predefinição. Ative apenas quando o seu servidor puder enviar correio; pode configurar o SMTP mais tarde em Admin - Definições.
ins_admin_mail_info: Usado para repor palavras-passe e como endereço de contacto.
ins_admin_mail_invalid: Introduza um endereço de e-mail válido.
ins_admin_pass_confirm: Repetir palavra-passe
ins_admin_pass_rules: A palavra-passe precisa de pelo menos %d caracteres (no máximo 64). Uma frase com algumas palavras é fácil de lembrar e difícil de adivinhar.
ins_admin_pass_short: A palavra-passe precisa de pelo menos %d caracteres.
ins_admin_pass_long: A palavra-passe pode ter no máximo 64 caracteres.
ins_admin_pass_mismatch: As duas palavras-passe não coincidem.
ins_done_checklist: A sua lista de verificação
ins_done_login: Inicie sessão na administração.
