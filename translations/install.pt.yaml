ins_db_help: O V0Game guarda tudo numa base de dados MySQL ou MariaDB. Obténs os valores abaixo no painel do teu alojamento (procura "Bases de dados" ou "MySQL") ou de quem configurou o teu servidor. Se instalaste o MySQL tu mesmo, as predefinições costumam funcionar.
ins_db_host: Servidor de base de dados
ins_db_host_info: Quase sempre "localhost". Alguns alojamentos dão um nome como "db1.example.com".
ins_db_name_info: O nome da base de dados do jogo. Cria-a primeiro no painel do alojamento ou deixa o instalador criá-la (vê a caixa abaixo).
ins_db_advanced: Avançado (porta, prefixo das tabelas, palavra-passe de migração) - normalmente desnecessário
ins_db_prefix_info: Acrescentado antes do nome de cada tabela. Só o alteres se partilhares a base de dados com outro software.
ins_db_migrationpw_info: Protege a página de atualização (install/?mode=upgrade) em futuras atualizações do jogo. Se deixares vazio, o instalador gera uma palavra-passe forte e mostra-a uma vez na última página.
ins_db_migrationpw_placeholder: gerada automaticamente
ins_migrationpw_invalid: A palavra-passe de migração não pode conter aspas, barras invertidas, $ nem quebras de linha.
ins_err_technical: detalhes técnicos
ins_err_access_denied: O servidor de base de dados recusou o nome de utilizador ou a palavra-passe. Verifica ambos no painel do alojamento (maiúsculas e minúsculas contam).
ins_err_unknown_db: Esta base de dados não existe no servidor. Verifica o nome ou marca "Criar a base de dados" abaixo.
ins_err_no_privilege: Este utilizador da base de dados não tem permissão para usar essa base de dados. Dá-lhe todos os privilégios sobre ela no painel do alojamento.
ins_err_no_create: Este utilizador não tem permissão para criar bases de dados. Cria uma base de dados vazia no painel do alojamento e desmarque "Criar a base de dados".
ins_err_socket: Não foi encontrado o socket do servidor de base de dados. Experimenta o anfitrião "127.0.0.1" em vez de "localhost".
ins_err_unreachable: Não é possível contactar o servidor de base de dados "%s". Verifica o nome do anfitrião e a porta, e se o servidor de base de dados está em execução. Muitos alojamentos só permitem ligações dos seus próprios servidores web, por isso "localhost" costuma ser o correto.
ins_game_desc: Dá um nome ao teu jogo e escolhe como funciona. Tudo isto pode ser alterado mais tarde na administração (Admin - Definições).
ins_group_general: Geral
ins_uni_name: Nome do universo
ins_uni_name_info: Mostrado aos jogadores quando escolhem um universo. Vazio = "Universo 1".
ins_uni_name_invalid: O nome do universo pode ter no máximo 60 carateres.
ins_language: Idioma predefinido
ins_language_info: Idioma para novos visitantes e para a tua conta de administrador.
ins_language_invalid: Idioma desconhecido.
ins_timezone: Fuso horário
ins_timezone_info: Pré-selecionado a partir do teu servidor. Usado para mostrar a hora do servidor.
ins_timezone_invalid: Fuso horário desconhecido.
ins_group_speed: Velocidade do jogo
ins_speed_info: A rapidez com que avançam edifícios, pesquisa, naves, frotas e produção. Clássico é o ritmo original; as predefinições mais rápidas servem comunidades pequenas e rondas curtas.
ins_speed_classic: Clássico
ins_speed_classic_info: o ritmo original, as rondas duram meses
ins_speed_fast: Rápido
ins_speed_fast_info: cerca de três vezes mais rápido, as rondas duram semanas
ins_speed_blitz: Blitz
ins_speed_blitz_info: até dez vezes mais rápido, as rondas duram dias
ins_speed_detail: Construção/pesquisa %bx, frotas %fx, recursos %rx
ins_speed_invalid: Predefinição de velocidade desconhecida.
ins_group_players: Jogadores
ins_registration: Registo
ins_registration_open: Aberto - qualquer pessoa pode registar-se
ins_registration_closed: Fechado - só tu podes criar contas
ins_registration_info: Escolhe "fechado" enquanto ainda estiveres a configurar. Podes abri-lo mais tarde em Admin - Definições.
ins_registration_invalid: Definição de registo desconhecida.
ins_bots: Jogadores do computador (bots)
ins_bots_info: De 0 a 50. Os bots jogam como jogadores reais com hábitos diferentes, para que um universo novo não fique vazio. 0 = sem bots.
ins_bots_invalid: O número de bots tem de estar entre 0 e 50.
ins_mail: Enviar e-mails (registo, reposição de palavra-passe)
ins_mail_info: Desativado por predefinição. Ativa só quando o teu servidor conseguir enviar correio; podes configurar o SMTP mais tarde em Admin - Definições.
ins_admin_mail_info: Usado para repor palavras-passe e como endereço de contacto.
ins_admin_mail_invalid: Introduz um endereço de e-mail válido.
ins_admin_pass_confirm: Repetir palavra-passe
ins_admin_pass_rules: A palavra-passe precisa de pelo menos %d carateres (no máximo 64). Uma frase com algumas palavras é fácil de lembrar e difícil de adivinhar.
ins_admin_pass_short: A palavra-passe precisa de pelo menos %d carateres.
ins_admin_pass_long: A palavra-passe pode ter no máximo 64 carateres.
ins_admin_pass_mismatch: As duas palavras-passe não coincidem.
ins_done_checklist: A tua lista de verificação
ins_done_login: Inicia sessão na administração.
ins_done_login_info: 'Já iniciaste sessão como "%s". Da próxima vez usa:'
ins_done_cron: Configura o cronjob (obrigatório).
ins_done_cron_info: 'Sem ele nada avança no jogo (frotas, filas de construção, estatísticas). Acrescenta esta linha ao crontab do utilizador do servidor web (crontab -e) ou cria um cronjob com ela no painel do alojamento:'
ins_done_cron_help: Como configurar o cronjob (também num painel de alojamento)
ins_done_locked: A ferramenta de instalação está agora bloqueada.
ins_done_locked_info: Ninguém pode voltar a executar o assistente. Para atualizar mais tarde, segue a secção de atualização da documentação.
ins_done_https: Usa HTTPS.
ins_done_https_info: 'Estás em HTTP simples: as palavras-passe viajam sem cifra. Configura um certificado (por exemplo Let''s Encrypt) antes de convidares jogadores.'
ins_done_https_ok: Esta página foi servida por HTTPS - ótimo.
ins_done_settings: Altera as definições mais tarde.
ins_done_settings_info: 'Admin - Definições: nome do jogo, velocidade, registo, e-mail (SMTP), bots e muito mais.'
ins_done_bots: Bots.
ins_done_bots_info: Foram criados %d bots. Entram em ação quando o cronjob corre. Gere-os na administração.
ins_done_bots_failed: O administrador foi criado, mas não foi possível criar os bots. Podes adicioná-los mais tarde na administração.
ins_done_migrationpw: Anota a tua palavra-passe de migração (só é mostrada uma vez).
ins_done_migrationpw_info: Vais precisar dela nas atualizações do jogo. Também fica guardada em config/game.php.
ins_done_docs: 'Documentação:'
