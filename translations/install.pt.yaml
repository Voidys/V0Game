ins_credits_head: Aos ombros de gigantes
ins_credits_text: 'O V0Game continua uma longa linhagem de jogos de navegador de código aberto. Respeito por todos os que o construíram e o mantiveram vivo antes de nós:'
ins_credits_thanks: Obrigado a todos os programadores e mantenedores que criaram este jogo e o mantiveram vivo ao longo dos anos, do 2Moons e SteemNova ao pr0game.
