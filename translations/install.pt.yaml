# engagement features (step 5)
ins_group_features: 'Funcionalidades opcionais do jogo'
ins_features_desc: 'Todas desativadas por predefinição. Cada uma pode ser ativada, desativada e ajustada mais tarde na administração (definições do universo).'
ins_feat_events: 'Eventos do universo'
ins_feat_events_info: 'Eventos agendados no painel de administração: tempestades iónicas, feiras comerciais, máximos solares, vagas de piratas, fins de semana de velocidade.'
ins_feat_catchup: 'Impulso de recuperação'
ins_feat_catchup_info: 'Contas novas muito abaixo da média recebem um bónus de minas que diminui ao longo de alguns dias.'
ins_feat_contracts: 'Contratos semanais'
ins_feat_contracts_info: 'Três objetivos rotativos por jogador e por semana, com uma recompensa cosmética ou pequena de recursos.'
ins_feat_alliance_goals: 'Objetivos da aliança'
ins_feat_alliance_goals_info: 'O líder da aliança define um objetivo semanal para os membros; ao cumpri-lo ganham distintivos.'
ins_feat_returning: 'Bem-vindo de volta'
ins_feat_returning_info: 'Os jogadores que regressam após uma longa pausa veem o que aconteceu e podem obter uma proteção curta.'
ins_feat_seasons: 'Temporadas'
ins_feat_seasons_info: 'Um ranking mensal (atacante, guerreiro, defensor, explorador, reciclador) sem qualquer reinício; os vencedores ganham distintivos.'
ins_feat_cosmetics: 'Distintivos e títulos'
ins_feat_cosmetics_info: 'Mostra os distintivos, títulos e cores de nome conquistados no cartão do jogador e no chat.'
ins_feat_bounties: 'Recompensas'
ins_feat_bounties_info: 'Os jogadores colocam recursos sobre outro jogador; quem destruir frota suficiente dele recolhe-os.'
ins_feat_alliance_wars: 'Pontuação de guerra da aliança'
ins_feat_alliance_wars_info: 'Um quadro de pontuações em tempo real para as guerras declaradas na diplomacia da aliança.'
ins_feat_battle_feed: 'Feed de batalhas'
ins_feat_battle_feed_info: 'As batalhas grandes são anunciadas no chat global (requer o chat).'
ins_feat_derelicts: 'Campos de destroços'
ins_feat_derelicts_info: 'Campos de recuperação aparecem na galáxia durante algum tempo; os primeiros recicladores a chegar os recolhem.'
ins_feat_mothership: 'Nave-mãe pirata'
ins_feat_mothership_info: 'Um chefe mundial raro que só pode ser derrotado num ACS; o saque é repartido pelo dano causado.'
ins_feat_expedition_stories: 'Histórias de expedição'
ins_feat_expedition_stories_info: 'Sinais raros levam um jogador por uma breve missão de expedição com uma recompensa maior.'
ins_feat_relics: 'Relíquias'
ins_feat_relics_info: 'As expedições podem encontrar relíquias (de comum a épica, com bónus de conjunto) que os jogadores colocam nos planetas para pequenos impulsos.'
