install_desc: |-
  Para ativares a ferramenta de instalação, cria o ficheiro "var/ENABLE_INSTALL_TOOL".<br> O nome do ficheiro distingue maiúsculas de minúsculas e não tem extensão.<br> O ficheiro pode estar vazio.
  É apagado automaticamente quando a instalação terminar ou se tiver mais de uma hora.
