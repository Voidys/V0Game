intro_text: 'O V0Game é um jogo de estratégia espacial de código aberto, no navegador: faz crescer os teus planetas, pesquisa, envia frotas e mede forças com centenas de jogadores ao mesmo tempo.<br><br>Este assistente monta uma instalação nova passo a passo: verifica o teu servidor, liga-se à base de dados e cria-a, constrói as tabelas, deixa-te dar um nome ao jogo e cria o administrador.'
intro_upgrade_head: V0Game já instalado?
intro_upgrade_text: <p>Já instalaste o V0Game e queres atualizar sem complicações?</p><p>Aqui atualizas a base de dados antiga com apenas alguns cliques!</p>
