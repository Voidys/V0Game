Achievement_text:
  '1': 'Magpalapag ng 5 sa mga atake mo sa pagitan ng hatinggabi at 6 ng umaga sa iisang gabi nang walang napapanalunan.'
  '2': Walang tigil na may mga fleet kang gumagalaw sa loob ng 90 araw.
  '3': Nawala ang fleet mo habang naka-set sa "French" ang wika mo.
  '4': I-research ang Ion Technology 10.
  '5': I-research ang Graviton Research 2, dahil lang kaya mo.
  '6': Bumalik ang isa sa mga atake mo na 1 metal, 1 crystal at 1 deuterium lang ang dala.
  '7': Talunin ang fleet ng mga barkong pirata o alien na may kabuuang hindi bababa sa 10,000 barko. Atin ang kalawakan!
  '8': Sumipot sa Strammtisch (Martes, alas-8 ng gabi sa Discord).
  '9': Itayo ang una mong Death Star.
  '10': Wasakin ang buwan ng isang manlalaro.
  '11': Maglaro nang 14 na araw sa mobile lang.
  '12': Nawasak ng black hole ang fleet mo sa una mong expedition.
  '13': Paalisin ang fleet mo na wala pang 5 segundo ang natitira bago tumama ang paparating na atake.
  '14': Mawalan ng 10 fleet sa mga black hole. Gutom ang kawalan.
  '15': 'Mabigong makuha ang iyong unang buwan sa 10 laban na may pinakamataas na tsansa ng buwan.'
  '16': Mahigit 250 sa mga recycler mo ang bumalik na walang laman.
  '17': Mag-queue ng hindi bababa sa 5000 Missile Launcher sa iisang build order.
  '18': Sunugin ang 5 milyong deuterium bilang fuel sa iisang planeta sa loob ng 24 oras.
  '19': I-research ang Armour Technology 3.
  '20': I-research ang Armour Technology 6.
  '21': I-research ang Armour Technology 9.
  '22': I-research ang Armour Technology 12.
  '23': I-research ang Armour Technology 15.
  '24': I-research ang Laser Technology 12.
  '25': Mag-opt in sa Records.
  '26': Burahin ang planetang nagbibigay sa iyo ng pinakamaraming puntos (hindi bababa sa 100,000 puntos).
  '27': I-research ang Intergalactic Research Network 1.
  '28': I-upgrade ang tatlong storage sa buwan sa hindi bababa sa level 3.
  '29': Kolektibisahin ang fleet ng manlalarong mas mataas ang score gamit ang 5-player ACS.
  '30': Pigilan nang mag-isa ang isang 5-player ACS.
  '31': Ipadala ang isang manlalaro sa vacation mode gamit ang atake mo.
  '32': Sumalakay sa 1000 planeta habang gamit ang "SetSail" theme. Arr!
  '33': Bumalik mula sa vacation mode.
  '34': Maatake sa unang pagkakataon. Welcome sa universe.
  '35': Umatake sa aktibong manlalarong wala pang 1/10 ng puntos mo.
  '36': "Makatanggap ng mensaheng may isa sa mga sumusunod na bloke:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Mapulbos ng isang 5-player ACS.
  '38': Umatake sa mga miyembro ng sarili mong alliance. Friendly fire, sino?
  '39': Umatake sa isang tao gamit ang eksaktong 42 barko.
  '40': Mag-colonize ng planeta na hindi bababa sa kalahating universe ang layo.
  '41': Harangan ang isang fleet slot nang isang linggo dahil sa masamang offer sa marketplace.
  '42': Sumali sa Battlehall nang 4 na beses sa panig ng talo.
  '43': "Manalo sa laban habang naka-flag na Inactive ang account mo,\r\n            sa isa sa mga planeta mo kung saan dati nang dumating ang fleet na may oras ng biyaheng mahigit 7 araw."
  '44': Gumawa ng resource sa isang planeta nang mahigit 7 araw habang mas mababa sa 100% ang energy.
  '45': Manalo sa atake laban sa manlalarong nasa top 5 sa depensa.
  '46': Mag-trigger ng bash protection sa pagpapaputok ng mga interplanetary missile.
  '47': Wasakin ang 5 buwan.
  '48': Mawalan ng 5 Death Star sa pagtatangkang wasakin ang mga buwan. Aray.
  '49': Gibain ang kolonya hindi pa katagalan matapos itong gawin.
  '50': "Mawala ang lahat ng solar satellite mo sa isang planetang may sapat na\r\n            energy para mag-research ng Graviton technology, nang hindi pa nare-research ang Graviton technology."
  '51': Ubusin ang lahat ng deuterium mo sa pag-browse ng galaxy view.
  '52': Magtayo ng Death Star nang hindi muna nakapagtayo ng ibang combat ship (Light Fighter, Heavy Fighter, Cruiser, Battleship, Bomber, Destroyer o Battle Cruiser).
  '53': Hawakan ang pinakamataas na level sa 5 research nang sabay-sabay.
  '54': I-time ang atake sa aktibong manlalaro para tumama sa 01/01 00:00:00.
  '55': Espesyal na Achievement
  '56': 'Abutin ang level 15 ng hyperspace drive.'
  '57': 'Abutin ang level 15 ng astrophysics.'
  '58': 'Saliksikin ang bawat teknolohiya (maliban sa graviton) kahit isang beses.'
  '59': 'Dalhin ang bawat saliksik (maliban sa graviton) sa level 10.'
  '60': 'Magkaroon ng 1,000,000,000 ng iisang resource sa isang planeta o buwan.'
  '61': 'Magkaroon ng 1000 solar satellite nang sabay sa isang planeta.'
  '62': 'Tayuan ang bawat field ng isang planetang may hindi bababa sa 250 field.'
  '63': 'I-upgrade ang imbakan ng metal, crystal at deuterium sa level 15 sa isang planeta.'
  '64': 'Magkaroon ng metal mine na level 30 o higit pa sa 9 na planeta.'
  '65': 'Magsimula ng iisang utos sa pagtatayo na tumatagal nang mahigit 30 araw.'
  '66': 'Mabili ng ibang manlalaro ang 50 sa mga alok mo sa palengke.'
  '67': 'Manalo sa depensa laban sa mga umaatake na may halagang hindi bababa sa 10 beses ng armada at depensa mo (halaga ng umaatake na hindi bababa sa 1,000,000 resources).'
  '68': 'Manalo sa isang atake na nagwasak ng hindi bababa sa 1000 yunit ng kaaway nang walang nawawalang yunit sa iyo.'
  '69': 'Magtapos sa tabla ang laban pagkatapos ng pinakamaraming round, at bawat panig ay nawalan ng hindi bababa sa 10,000 yunit.'
  '70': 'Maatake sa planetang walang barko at depensa, kaya walang nakukuhang loot ang umaatake.'
  '71': 'Magkaroon ng buwan mula sa laban na 1 % lang ang tsansa ng buwan.'
  '72': 'Wasakin ang hindi bababa sa 100 yunit ng depensa gamit ang isang interplanetary missile strike.'
  '73': 'Wasakin ang hindi bababa sa 100 espiyang probe ng kaaway sa isang laban sa planeta mo.'
  '74': 'Mag-raid ng kabuuang 1,000,000,000 resources.'
  '75': 'Mag-recycle ng kabuuang 1,000,000,000 resources.'
  '76': 'Kumpunihin ang kabuuang 1000 barko mula sa mga wreck field.'
  '77': 'Makakuha ng 1000 honour points.'
  '78': 'Maging outlaw sa unang pagkakataon.'
  '79': 'Sumali bilang umaatake sa 25 napanalunang ACS na atake.'
  '80': 'Maranasan ang bawat posibleng kalalabasan ng ekspedisyon kahit isang beses.'
  '81': 'Magpadala ng 1000 ekspedisyon.'
  '82': 'Manalo sa laban sa ekspedisyon laban sa malaking armada ng alien.'
  '83': 'Makahanap ng malaking dami ng resources sa 50 ekspedisyon.'
  '84': 'Magpadala ng armada sa isang one-way na biyaheng mahigit 24 oras.'
  '85': 'Makarating ang isang armada sa target nito sa 29 Pebrero.'
  '86': 'Mawala ang buong umaatakeng armada sa isang Biyernes 13.'
  '87': 'Magpalapag ng dalawa sa mga atake mo (hindi ACS) sa iisang target sa iisang segundo.'
  '88': 'Magkaroon ng mga armadang patungo sa bawat galaxy ng uniberso nang sabay.'
  '89': 'Tapusin ang tutorial.'
  '90': 'Magkaroon ng aktibong pakto sa 3 ibang alyansa nang sabay (lahat ng miyembro ng alyansa ay makakakuha).'
  '91': 'Gumawa ng 5 wiki page ng alyansa.'
  '92': 'Magkaroon ng 10 tinanggap na friend request.'
  '93': 'Maging numero 1 sa kabuuang ranking ng puntos sa 7 magkakasunod na araw.'
  '94': 'Magkaroon ng 100 Death Star nang sabay sa isang planeta o buwan.'
  '95': 'Okupahan ang bawat planet slot na pinapayagan ng astrophysics mo (hindi bababa sa 9), bawat planeta ay may hindi bababa sa 200 field.'
  '96': 'Magkaroon ng 50 pang achievement.'
