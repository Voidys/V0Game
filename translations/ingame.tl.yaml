kontakt: Hi!<br>Ipinapakita ng page na ito ang mga taong nagpapatakbo, nagmo-moderate at nagde-develop ng proyektong ito.<br>May mga tanong o problema? Makipag-ugnayan sa amin.<br><br><!--discord_url-->Para sa mas magandang palitan namin at ng ibang manlalaro, nagpapatakbo kami ng Discord server. Makikita mo ito <a href="{discord_url}">dito</a> o sa menu.<br>Doon mo makikita ang pinakabagong balita at ang pinakamagagandang meme mula sa mga alliance ng universe.<br>Magtanong tungkol sa game mechanics at ibahagi ang mga ideya mo para sa hinaharap ng laro.<br><br><!--/discord_url-->Siyempre, sinasagot din namin ang mga tanong mo sa laro.<br>Pakitandaan na libangan lang namin ang paglalaro, kaya maaaring abutin ng ilang araw ang mga sagot.<br>
