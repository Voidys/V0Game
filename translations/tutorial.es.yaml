tutorial_text:
  step0: "¡Bienvenido a {game_name}!<br><br>\r\nEste breve tutorial te explica lo básico.<br>\r\nEnlazamos mucho a nuestra wiki, porque no todo cabe en un tutorial. Puedes abrirla en cualquier momento desde el menú de la izquierda.<br>\r\nPuedes saltarte el tutorial cuando quieras, pero luego no podrás reiniciarlo.<br><br>\r\n¡Buena suerte, Emperador!"
  step1: "Tu objetivo: conseguir tantos puntos como puedas. Ganas un punto por cada 1.000 recursos que gastas, y la mejor fuente de recursos son tus propias minas.<br>\r\nEmpieza por lo básico: necesitas metal y cristal de sus minas, y energía de la planta de energía solar para que sigan funcionando. Si falta energía, tus minas producen por debajo del 100%.<br>\r\nMejora estos edificios en el menú <b>Edificios</b>. Pulsa el nombre de un edificio para ver qué te da el siguiente nivel y cuánta energía consumirá.<br><br>\r\n¿Quieres saber más? Echa un vistazo a la <b>wiki</b>: \r\n<a href=\"{wiki_url}/wiki/En/Rohstoffe\" target=\"_blank\">Recursos</a>"
  step2: "Jugar es más divertido en compañía. La mayoría de los jugadores se reúne en nuestro Discord, donde puedes resolver dudas y encontrar gente con quien jugar.<br>\r\n¿Sigues atascado? También puedes abrir un ticket de soporte aquí."
  step3: "Saquear los planetas de otros jugadores es otra forma de conseguir recursos, y también te puede pasar a ti. ¡Construye tu primera defensa!<br>\r\nIncluso una defensa pequeña protege tu producción durante la noche.<br><br>\r\nNo solo importan los números: también cuenta la composición de la flota atacante.<br>\r\nLos atacantes tienen que superar tu defensa antes de poder saquear, y cada nave que tienen que enviar recorta su beneficio y puede costarles más naves.<br>\r\nConstruye defensas en el <b>Hangar</b>, en la pestaña <b>Defensa</b>. Necesitas un hangar (que a su vez requiere una fábrica de robots) y algo de deuterio.<br><br>\r\nAquí tienes el artículo correspondiente de la wiki: \r\n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">Instalaciones de defensa</a>"
  step4: "¡Mantén tus suministros fluyendo ampliando tus minas!<br>\r\nLos edificios, las naves, las defensas y las investigaciones se encarecen con el tiempo, así que tu producción tiene que crecer con ellos. Abre Edificios y mejora tus minas cada vez que tengas recursos."
  step5: "¡Construye una nave pequeña de carga!<br>\r\nLas naves pequeñas de carga son transportes rápidos y manejables.<br>\r\nCon el motor de impulso son más rápidas que las naves grandes de carga en distancias largas.<br>\r\nÚsalas para mover recursos entre tus planetas, comerciar con otros jugadores o saquearlos.<br><br>\r\nMás en la wiki: \r\n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Naves</a>"
  step6: "Ponle un nombre a tu planeta para no perderte. En la Vista general, pulsa el nombre del planeta en la cabecera del recuadro de puntos. Venga, pruébalo ahora.<br><br>\r\nTambién puedes enviar solicitudes de amistad a otros jugadores. Cuando las acepten, podréis chatear más fácilmente y ver el estado de conexión del otro. No hace falta compartir alianza. Los amigos también pueden mantener flotas en los planetas del otro, así que podéis defenderos fuera de una alianza.<br><br>\r\nO únete a una alianza y juega en equipo. Ya no necesitas solicitudes de amistad aparte para mantener flotas. Dentro de la alianza puedes enviar mensajes globales y ver el estado de conexión y los puntos de otros miembros, según tu rango en la alianza."
  step7: "Para saber qué recursos, edificios, investigaciones, naves y defensas tiene otro jugador, tienes que espiarlo. Envía una sonda de espionaje desde el menú Flotas o desde la vista de galaxia.<br>\r\n¡Ten en cuenta que los demás también pueden espiarte a ti!"
  step8: "Una expedición puede traer recursos, naves, sucesos especiales o pérdidas. Para probar una, coge una nave, elige la posición de planeta 16 como destino y la misión «Expedición» en el menú Flotas.<br>\nCada tipo de nave aporta al tamaño de tu flota de expedición, hasta un límite en el que se alcanza el tamaño máximo del suceso.<br><br>\nLa wiki explica qué puedes cambiar para sacar el máximo beneficio: \n<a href=\"{wiki_url}/wiki/En/Expoanleitung\" target=\"_blank\">Expediciones</a>"
  step9: "Cuantos más planetas colonices, más rápido crecerás: podrás producir recursos y construir naves en varios planetas a la vez. Ten en cuenta que solo puedes colonizar el borde interior o exterior de un sistema si tu nivel de astrofísica es lo bastante alto. El colonizador se puede construir sin astrofísica, ¡pero tu primera colonia sí la necesita!<br><br>\r\nColonizar en tu propio sistema o justo al lado mantiene cortas las rutas de transporte. La contrapartida: más adelante, otros jugadores pueden poner una colonia en tu sistema no por sus minas, sino como base de flota temporal: una colonia de saqueo.<br><br>\r\nMás en la wiki: \r\n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Astrofísica</a>"
  step10: "¿Quieres recursos más rápido? Ataca a otros jugadores. Sopesa coste y beneficio para que tu ataque salga rentable, y usa los informes de espionaje y el simulador de combate para planificarlo.<br><br>\r\n¡Cuidado! Otros jugadores pueden seguir muchas misiones de flota de varias maneras.<br>\r\nNo perder la flota que tanto te ha costado es una de las partes más importantes del juego.<br><br>\r\nAsí que lee estos temas de la wiki: \r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Saveo de flotas</a> - \r\n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Sensor Phalanx</a>"
  step10_u6: '¿Quieres recursos más rápido? Ataca a otros jugadores. Sopesa coste y beneficio para que tu ataque salga rentable, y usa los informes de espionaje y el simulador de combate para planificarlo.<br><br>
  
    ¡Cuidado! Otros jugadores pueden seguir muchas misiones de flota de varias maneras.<br>
  
    No perder la flota que tanto te ha costado es una de las partes más importantes del juego.<br><br>
  
    Así que lee estos temas de la wiki:
  
    <a href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden" target="_blank">Saveo de flotas</a>'
  step11: "Cuando se destruyen flotas, dejan un campo de escombros que puedes recoger. Para ello necesitas recicladores, con una capacidad de carga de 20.000 cada uno. Aniquilar una flota grande puede ser una fuente de recursos muy lucrativa.<br><br>\r\nTambién puedes enviar recicladores directamente desde la vista de galaxia pulsando un campo de escombros, en lugar de usar el menú Flotas."
  step12: "¡Enhorabuena, has completado el tutorial!<br><br>\r\nEl juego tiene mucho más que ofrecer.<br>\r\nPor ejemplo, hay más o menos tres estilos de juego, que también se diferencian en el tiempo que exigen:<br>\r\n<ul>\r\n<li>Minero: amplía minas en muchas colonias y vuela sobre todo con transportes</li>\r\n<li>Fleeter: pone la mayoría de sus puntos en naves de guerra, apenas tiene producción propia y vive de saquear a otros jugadores</li>\r\n<li>Comber: una mezcla de ambos</li>\r\n</ul>\r\nLas lunas cobran importancia más adelante, y a estas alturas ya deberías haber conocido el Sensor Phalanx.<br><br>\r\n¿Sigues con dudas? Lee la wiki o pregunta a la comunidad en Discord."
  step12_u6: '¡Enhorabuena, has completado el tutorial!<br><br>
  
    El juego tiene mucho más que ofrecer.<br>
  
    Por ejemplo, hay más o menos tres estilos de juego, que también se diferencian en el tiempo que exigen:<br>
  
    <ul>
  
    <li>Minero: amplía minas en muchas colonias y vuela sobre todo con transportes</li>
  
    <li>Fleeter: pone la mayoría de sus puntos en naves de guerra, apenas tiene producción propia y vive de saquear a otros jugadores</li>
  
    <li>Comber: una mezcla de ambos</li>
  
    </ul>
  
    ¿Sigues con dudas? Lee la wiki o pregunta a la comunidad en Discord.'
