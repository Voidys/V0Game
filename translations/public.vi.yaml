home_meme_alt_deep_space_transit: 'Truyện tranh: hai học viên trên tàu con thoi – một người gục xuống khi thấy bãi thiên thạch, người kia cười toe trước một tinh vân rực sáng. “Tuần tra khu vực tiêu chuẩn vs. tìm thấy tinh vân giàu tài nguyên chưa ai khám phá.”'
home_meme_alt_deuterium_joyride: 'Truyện tranh: một chỉ huy mệt mỏi trên đài quan sát nhìn hai tân binh bay lơ lửng bên ngoài – “Nhìn các tân binh đốt sạch Deuterium để đi dạo bên ngoài trong khi tôi chờ 12 tiếng để nâng cấp mỏ.”'
home_meme_alt_enemy_fleet: 'Truyện tranh: một học viên ôm đầu hoảng loạn khi còi báo động nhấp nháy – “1000 tàu hủy diệt địch đang tới?! Tôi tưởng khu vực này an toàn mà?!”'
home_meme_alt_fleet_decimated: 'Truyện tranh: một người lính choáng váng nhìn thẳng khi tàu nổ tung bên ngoài mái vòm vỡ nát – “Khi bạn cày tài nguyên 20 tiếng chỉ để hạm đội của một người top 3 nhảy tới và tháo tung mọi thứ trong 3 giây.”'
home_meme_alt_solo_scouting: 'Truyện tranh: Chỉ huy Kamioka cười toe và đặt bàn tay robot lên vai một học viên – “Đừng lo, học viên. Bộ Chỉ huy Tối cao có niềm tin ‘tuyệt đối’ vào nhiệm vụ do thám một mình của cậu ngoài Không gian.”'
home_meme_alt_this_is_fine: 'Truyện tranh: một chú chó mặc đồ phi hành gia ngồi điềm tĩnh giữa trung tâm chỉ huy đang cháy và nói “Ổn cả mà” – “Đừng lo. Hạm đội của tôi mới về trễ có 4 tiếng thôi.”'
