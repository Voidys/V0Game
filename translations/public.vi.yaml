registerWelcomePMText: Chào mừng đến với %s! Trước tiên hãy xây một Nhà máy điện mặt trời, vì cần có năng lượng để sản xuất tài nguyên. Mở Công trình ở menu bên trái và bắt đầu với Nhà máy điện mặt trời.<br>Khi đã có năng lượng, bạn có thể xây mỏ. Vẫn ở mục Công trình, hãy xây một Mỏ kim loại, rồi một Mỏ tinh thể.<br><br>Để đóng tàu, bạn cần một Xưởng đóng tàu. Menu Công nghệ bên trái cho biết cần gì để mở khóa nó.<br>Nếu còn thắc mắc, hãy xem FAQ, wiki, hoặc mở một yêu cầu hỗ trợ.<br><br>Cả đội chúc bạn khám phá vũ trụ thật vui!
