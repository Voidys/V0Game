tutorial_text:
  step0: |-
    Ласкаво просимо до {game_name}!<br><br>
    Це коротке навчання проведе тебе крізь основи.<br>
    Ми часто посилаємося на вікі, бо в навчання вміщається не все. Відкрити її можна будь-коли з меню ліворуч.<br>
    Навчання можна пропустити будь-коли, але розпочати його знову пізніше не вийде.<br><br>
    Удачі, імператоре!
  step1: "Твоя мета — набрати якомога більше очок. Ти отримуєш одне очко за кожні 1000 витрачених ресурсів, а найкраще джерело ресурсів — твої власні шахти.<br>\nПочни з базових запасів: тобі потрібні метал і кристал із шахт, а також енергія від сонячної електростанції, щоб вони працювали. Якщо енергії бракує, шахти виробляють менше 100%.<br>\nПокращуй ці споруди в меню <b>«Споруди»</b>. Клацни на назву споруди, щоб побачити, що дасть наступний рівень і скільки енергії він споживатиме.<br><br>\nХочеш дізнатися більше? Зазирни до <b>вікі</b>: \n<a href=\"{wiki_url}/wiki/En/Rohstoffe\" target=\"_blank\">Ресурси</a>"
  step2: |-
    Грати разом веселіше. Більшість гравців збирається в нашому Discord, де можна отримати відповіді й знайти компанію для гри.<br>
    Все ще не виходить? Тут також можна створити запит до підтримки.
  step3: "Грабувати планети інших гравців — ще один спосіб здобути ресурси, і те саме можуть зробити з тобою. Тож збудуй свою першу оборону!<br>\nНавіть невелика оборона захищає твоє виробництво вночі.<br><br>\nУ бою вирішують не самі лише числа; важливий і склад атакувального флоту.<br>\nАтакувальникам доводиться прорватися крізь твою оборону, перш ніж грабувати, а кожен корабель, який їм потрібно для цього відправити, зменшує їхній прибуток і може коштувати їм ще кількох кораблів.<br>\nОборону будують на <b>верфі</b>, на вкладці <b>«Оборона»</b>. Тобі потрібні верф (якій своєю чергою потрібна фабрика роботів) і трохи дейтерію.<br><br>\nОсь відповідна стаття у вікі: \n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">Оборонні споруди</a>"
  step4: |-
    Підтримуй потік запасів, розширюючи свої шахти!<br>
    Споруди, кораблі, оборона й дослідження з часом дорожчають, тож твоє виробництво має зростати разом із ними. Відкрий «Споруди» просто зараз і покращуй шахти, щойно вистачає ресурсів.
  step5: "Збудуй собі малий транспорт!<br>\nМалі транспорти — швидкі, зручні вантажівки.<br>\nІз імпульсним двигуном вони швидші за великий транспорт на більших відстанях.<br>\nВикористовуй їх, щоб переміщати ресурси між своїми планетами, торгувати з іншими гравцями або грабувати їх.<br><br>\nБільше у вікі: \n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Кораблі</a>"
  step6: |-
    Дай своїй планеті назву, щоб не плутатися. В огляді клацни на назву планети в заголовку блоку очок. Давай, спробуй просто зараз.<br><br>
    Можна також надсилати іншим гравцям запити в друзі. Щойно вони приймуть, вам буде зручніше спілкуватися, а ще ви бачитимете статус одне одного в мережі. Для цього не обов'язково бути в одному альянсі. Друзі також можуть утримувати флоти на планетах одне одного, тож ви зможете захищатися разом і поза альянсом.<br><br>
    Або вступи до альянсу й грай командою. Окремі запити в друзі для утримання флотів тобі вже не потрібні. Усередині альянсу можна надсилати масові повідомлення й бачити статус у мережі та очки інших учасників залежно від рангу в альянсі.
  step7: |-
    Щоб дізнатися, які ресурси, споруди, дослідження, кораблі й оборона є в іншого гравця, треба його вишпигувати. Надішли шпигунський зонд гравцю з меню «Флот» або з огляду галактики.<br>
    Пам'ятай: інші гравці можуть шпигувати й за тобою!
  step8: "Експедиція може принести ресурси, кораблі, особливі події або втрати. Щоб спробувати, візьми корабель, обери ціллю позицію планети 16 і місію «Експедиція» в меню «Флот».<br>\nКожен тип кораблів додає розміру твоєму експедиційному флоту до межі, на якій досягається максимальний розмір події.<br><br>\nУ вікі пояснюється, що можна змінити, щоб отримати максимум прибутку: \n<a href=\"{wiki_url}/wiki/En/Expoanleitung\" target=\"_blank\">Експедиції</a>"
  step9: "Чим більше планет ти колонізуєш, тим швидше зростаєш: можна виробляти ресурси й будувати кораблі одразу на кількох планетах. Зауваж, що заселити внутрішній чи зовнішній край системи можна лише за достатньо високого рівня астрофізики. Сам колонізатор будується без астрофізики, але для першої колонії вона потрібна!<br><br>\nКолонізація у власній системі або по сусідству скорочує транспортні маршрути. Мінус: пізніше в грі гравці можуть поставити колонію у твоїй системі не заради шахт, а як тимчасову базу для флоту — так звану рейд-колонію.<br><br>\nБільше у вікі: \n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Астрофізика</a>"
  step10: "Хочеш ресурсів швидше? Атакуй інших гравців. Зважуй витрати та вигоду, щоб атака окупилася, а для планування користуйся шпигунськими звітами й бойовим симулятором.<br><br>\nОбережно! Інші гравці можуть по-різному відстежувати багато флотових місій.<br>\nНе втратити свій тяжко зароблений флот — одна з найважливіших частин гри.<br><br>\nТому обов'язково прочитай ці теми у вікі: \n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Сейв флоту</a> - \n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Сенсорна фаланга</a>"
  step10_u6: |-
    Хочеш ресурсів швидше? Атакуй інших гравців. Зважуй витрати та вигоду, щоб атака окупилася, а для планування користуйся шпигунськими звітами й бойовим симулятором.<br><br>
    Обережно! Інші гравці можуть по-різному відстежувати багато флотових місій.<br>
    Не втратити свій тяжко зароблений флот — одна з найважливіших частин гри.<br><br>
    Тому обов'язково прочитай ці теми у вікі:
    <a href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden" target="_blank">Сейв флоту</a>
  step11: |-
    Коли флоти знищуються, вони залишають поле уламків, яке можна зібрати. Для цього потрібні переробники з вантажомісткістю 20 000 кожен. Знищення великого флоту може стати вигідним джерелом ресурсів.<br><br>
    Переробників також можна відправити просто з огляду галактики, клацнувши на поле уламків, замість меню «Флот».
  step12: |-
    Вітаємо, навчання пройдено!<br><br>
    У грі ще багато цікавого.<br>
    Наприклад, є приблизно три стилі гри, які також різняться за витраченим часом:<br>
    <ul>
    <li>Майнер: розбудовує шахти на багатьох колоніях і переважно літає транспортами</li>
    <li>Флітер: вкладає більшість очок у бойові кораблі, майже не має власного виробництва й живе за рахунок рейдів на інших гравців</li>
    <li>Комбер: суміш обох</li>
    </ul>
    Місяці стають важливими пізніше в грі, а сенсорна фаланга має бути тобі вже знайома.<br><br>
    Ще є запитання? Читай вікі або запитай спільноту в Discord.
  step12_u6: |-
    Вітаємо, навчання пройдено!<br><br>
    У грі ще багато цікавого.<br>
    Наприклад, є приблизно три стилі гри, які також різняться за витраченим часом:<br>
    <ul>
    <li>Майнер: розбудовує шахти на багатьох колоніях і переважно літає транспортами</li>
    <li>Флітер: вкладає більшість очок у бойові кораблі, майже не має власного виробництва й живе за рахунок рейдів на інших гравців</li>
    <li>Комбер: суміш обох</li>
    </ul>
    Ще є запитання? Читай вікі або запитай спільноту в Discord.
tutorial_title:
  step0: Вітаємо, імператоре!
  step1: Час братися до видобутку!
  step2: Приходь знайомитися!
  step3: Не залишай планету без захисту!
  step4: Думай наперед!
  step5: Кораблі, нам потрібні кораблі!
  step6: Назви планету й знайди друзів!
  step7: Дізнайся, що мають інші!
  step8: У невідомість!
  step9: Однієї планети ніколи не досить!
  step10: Набридло чекати на шахти?
  step11: Час винести сміття!
  step12: Вийшло!
