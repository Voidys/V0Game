sys_expe_attack_1_1_1: Egy kétségbeesett űrkalóz megpróbálta elfoglalni az expedíciós flottánkat.
sys_expe_attack_1_1_2: >-
  Néhány primitív barbár megtámadott minket űrhajókkal. Legalább a hajóik
  rettenetes állapotban voltak. Ha a tűzerejük komoly veszélyt jelentett volna,
  kénytelenek lettünk volna a sajátunkkal válaszolni.
sys_expe_attack_1_1_3: >-
  Elfogtunk néhány rádióüzenetet néhány nagyon részeg kalóztól. Úgy tűnik,
  megtámadnak minket.
sys_expe_attack_1_1_4: >-
  Meg kellett küzdenünk néhány kalózzal, de szerencsére mi voltunk többen.
sys_expe_attack_1_1_5: >-
  A flottánk jelenti, hogy egy bizonyos Moa Tikarr és legénysége a flottánk
  feltétel nélküli megadását követelte. Ha komolyan gondolják, rájönnek, hogy
  nagyon jól meg tudjuk védeni magunkat.
sys_expe_attack_1_2_1: Az expedíciós flottád váratlanul összefutott néhány űrkalózzal.
sys_expe_attack_1_2_2: >-
  Belerepültünk néhány csillagkalóz lesébe! Sajnos a harc elkerülhetetlen volt.
sys_expe_attack_1_2_3: >-
  Egy másik expedíciós flotta segélykiáltása néhány ravasz kalóz csapdájának
  bizonyult. A csata elkerülhetetlen volt.
sys_expe_attack_1_3_1: >-
  Az elfogott jelek nem ismeretlen idegenektől jöttek, hanem egy titkos
  kalózbázisról! A kalózok nem örültek túlzottan, hogy a szektorukban vagyunk.
sys_expe_attack_1_3_2: Az expedíciós flotta heves harcokról számolt be azonosítatlan kalózhajókkal!
sys_expe_attack_1_3_3: >-
  Épp most kaptunk sürgős üzenetet az expedíció parancsnokától: „Ránk törnek!
  Kiugrottak a hipertérből, szerencsére csak kalózok, szóval van esélyünk,
  harcolunk!”
sys_expe_attack_2_1_1: Az expedíciós flottád barátságtalan első kapcsolatba került egy ismeretlen fajjal.
sys_expe_attack_2_1_2: Néhány furcsa hajó figyelmeztetés nélkül megtámadta az expedíciós flottát!
sys_expe_attack_2_1_3: Az expedíciónkat megtámadta egy kis csoport azonosítatlan űrhajó!
sys_expe_attack_2_1_4: >-
  Az expedíciós flotta ismeretlen hajókkal való kapcsolatfelvételt jelent. A
  rádióüzeneteket nem lehet megfejteni, de a furcsa hajók úgy tűnik, élesítik a
  fegyvereiket.
sys_expe_attack_2_2_1: Egy ismeretlen faj megtámadja az expedíciónkat!
sys_expe_attack_2_2_2: >-
  Az expedíciós flottád láthatóan megsértette egy eddig ismeretlen, de rendkívül
  agresszív idegen faj területét.
sys_expe_attack_2_2_3: >-
  A kapcsolat az expedíciós flottánkkal hirtelen megszakadt. Az utolsó hír
  szerint a flotta erős tűz alá került. A támadókat nem sikerült azonosítani.
sys_expe_attack_2_3_1: >-
  Az expedíciód egy idegen inváziós flottába ütközött, és hatalmas csatákról
  számol be!
sys_expe_attack_2_3_2: >-
  Ismeretlen eredetű kristályhajók nagy csoportja halad egyenesen ütközési
  pályán az expedíciós flottánkkal. A legrosszabbra kell felkészülnünk.
sys_expe_attack_2_3_3: >-
  Egy kis nehézségünk akadt az idegen faj nyelvjárásának helyes kiejtésével. A
  diplomatánk véletlenül azt kiáltotta: „Tűz!” a „Béke!” helyett.
sys_expe_attackname_1: Kalózok
sys_expe_attackname_2: Idegenek
sys_expe_back_home: A flottád visszatért ide (%1$s %2$s) a(z) %3$s expedícióból.
sys_expe_back_home_ress: Hoz magával %s %s, %s %s és %s %s mennyiséget.
