sys_expe_back_home_ships_lost: 'A következő hajókat elvesztették:'
sys_expe_depleted_max_1: >-
  Bejegyzés a híradós tiszt naplójából: Ha bármikor veszélyben éreznénk
  magunkat, mindig összefoghatunk a többi erre repkedő expedícióval.
sys_expe_depleted_max_2: >-
  Bejegyzés a híradós tiszt naplójából: Ha ez így megy tovább, navigációs
  bójákat kell kitennünk, hogy kezeljük ezt a sok forgalmat.
sys_expe_depleted_max_3: >-
  Bejegyzés a híradós tiszt naplójából: Talán többet érne itt egy
  szuvenírbolt nyitása, mint újabb expedíciót küldeni.
sys_expe_depleted_med_1: >-
  Bejegyzés a híradós tiszt naplójából: Több expedíciós flotta nyomait találtuk
  a környéken. Hazafelé tartunk.
sys_expe_depleted_med_2: >-
  Bejegyzés a híradós tiszt naplójából: Baráti rádiókapcsolatot létesítettünk
  néhány másik expedícióval ebben a szektorban.
sys_expe_depleted_med_3: >-
  Bejegyzés a híradós tiszt naplójából: Megünnepeltük az expedíció végét egy
  másik, ugyanebben a szektorban utazó expedíciós flotta legénységével. Nekik
  sincs semmi újdonság.
sys_expe_depleted_min_1: >-
  Bejegyzés a híradós tiszt naplójából: Úgy tűnik, emberek már jártak a galaxis
  ezen részén.
sys_expe_depleted_min_2: >-
  Bejegyzés a híradós tiszt naplójából: Régi űrhajók roncsait találtuk. Nem mi
  vagyunk az elsők itt.
sys_expe_depleted_min_3: >-
  Bejegyzés a híradós tiszt naplójából: Majdnem összeütköztünk egy másik
  expedíciós flottával. Sosem gondoltam volna, hogy itt kint más is van.
sys_expe_depleted_not_1: >-
  Bejegyzés a híradós tiszt naplójából: Úgy tűnik, az univerzum ezt a részét még
  nem fedezték fel.
sys_expe_depleted_not_2: >-
  Bejegyzés a híradós tiszt naplójából: Fantasztikus érzés elsőként utazni egy
  felfedezetlen szektoron át.
sys_expe_feqeuence_few: Több mint 10 expedíció az elmúlt 24 órában
sys_expe_feqeuence_many: Több mint 50 expedíció az elmúlt 24 órában
sys_expe_feqeuence_medium: Több mint 25 expedíció az elmúlt 24 órában
sys_expe_found_goods: '%s %s kibányászva.'
sys_expe_found_ress_1_1: >-
  Az expedíciód felfedezett egy kis aszteroidacsoportot, amelyből némi
  nyersanyagot ki lehetett nyerni.
sys_expe_found_ress_1_2: >-
  Egy távoli kisbolygón több könnyen hozzáférhető nyersanyagmezőt találtak, és
  sikeresen kitermelték a nyersanyagokat.
sys_expe_found_ress_1_3: >-
  Az expedíciód egy régmúlt csata nagyon öreg űrhajóroncsaira bukkant. Egyes
  alkatrészeket sikerült megmenteni és újrahasznosítani.
sys_expe_found_ress_1_4: >-
  Az expedíció egy sugárzással szennyezett bolygót fedezett fel rendkívül
  mérgező légkörrel. A letapogatások azonban kimutatták, hogy ez a bolygó sok
  nyersanyagot tartalmaz. Automata drónokkal próbáltak minél több nyersanyagot
  kinyerni.
sys_expe_found_ress_2_1: >-
  Az expedíciód egy ősi teherhajókaravánra bukkant, amely teljesen megrakott, de
  elhagyatott. Némi nyersanyagot sikerült szerezni. 
sys_expe_found_ress_2_2: >-
  Az expedíciód hatalmas nyersanyaglelőhelyeket talált egy saját légkörrel
  rendelkező kis holdon. A legénység éppen ezt a kincset termeli ki.
sys_expe_found_ress_2_3: >-
  Találkoztunk civil hajók egy kis konvojával, amelynek sürgősen élelemre és
  gyógyszerre volt szüksége. Cserébe jelentős mennyiségű hasznos nyersanyagot
  kaptunk.
sys_expe_found_ress_3_1: >-
  Az expedíciós flotta egy hatalmas idegen hajóroncs felfedezéséről számol be.
  Bár a technológiával nem tudtak mit kezdeni, a hajót szét lehetett szedni
  alkatrészeire, értékes nyersanyagot nyerve ki belőle.
sys_expe_found_ress_3_2: >-
  Egy ismeretlen bolygó körüli aszteroidaövben hatalmas mennyiségű nyersanyag
  volt. Az expedíciós flotta teletöltötte a raktereit!
sys_expe_found_ress_logbook_1: >-
  Bejegyzés az első tiszt naplójából: Minden szabad helyet felhasználtunk, de
  még így sem tudtuk elvinni az összes talált nyersanyagot.
sys_expe_found_ress_logbook_2: >-
  Bejegyzés az első tiszt naplójából: Ha lett volna még néhány teherhajónk! Így
  rengeteg nyersanyagot kell hátrahagynunk.
sys_expe_found_ress_logbook_3: >-
  Bejegyzés az első tiszt naplójából: Már kidobtunk mindent, amire nincs
  szükségünk, de még így sem tudunk elég helyet csinálni az összes talált
  nyersanyagnak.
sys_expe_found_ress_logbook_4: >-
  Bejegyzés az első tiszt naplójából: Még akkor sem tudtuk elszállítani az
  összes talált nyersanyagot, amikor a büfét és az összes társalgót
  raktárhelyiséggé alakítottuk.
sys_expe_found_ships_1_1: >-
  Egy elődexpedíció maradványaira bukkantunk! A technikusaink ellenőrzik, hogy
  vissza tudnak-e állítani működésbe néhányat a roncsokból.
sys_expe_found_ships_1_2: >-
  Egy elhagyatott kalózbázist találtunk. Néhány régi hajó még a hangárban áll. A
  technikusaink ellenőrzik, hogy használhatók-e még a hajók közül.
sys_expe_found_ships_1_3: >-
  Az expedíciónk egy háborúk által szinte teljesen elpusztított bolygóra
  bukkant. Különféle hajóroncsok sodródtak a pályán. A technikusok megpróbáltak
  megjavítani néhányat. Talán többet megtudhatunk arról, mi történt itt.
sys_expe_found_ships_1_4: >-
  Az expedíció egy régi csillagbázisra bukkant, amely úgy tűnik, egy örökkévalóság
  óta elhagyatott. Az erőd hangárjában néhány hajót találtak. A technikusoknak
  sikerült néhányat újra repülésre bírniuk.
sys_expe_found_ships_2_1: >-
  Egy armada maradványait találtuk meg. Az expedíció technikusai azonnal
  felmentek a részben ép hajókra, és néhányat meg is tudtak javítani.
sys_expe_found_ships_2_2: >-
  Az expedíciónk egy régi automata hajógyárat fedezett fel, amelyben néhány hajó
  még gyártási fázisban volt. A hajógyár energiaellátásának helyreállítása
  után a technikusaink azon dolgoztak, hogy befejezzék az építésüket.
sys_expe_found_ships_3_1: >-
  Egy gigantikus hajótemetőt találtunk. Az expedíció néhány technikusának
  sikerült egy-két hajót újra üzembe helyeznie.
sys_expe_found_ships_3_2: >-
  Egy olyan bolygót fedeztünk fel, amelyen egy civilizáció maradványai vannak.
  A világűrből egy másik, még ép gigantikus hajóállomást is észrevettünk.
  Néhány technikusunk és pilótánk a felszínre ment, hogy megállapítsák, kimenthető-e
  néhány hajó.
sys_expe_found_ships_logbook_1: >-
  Bejegyzés a gépházi tiszt naplójából: Ha hoztunk volna magunkkal még néhány
  hajót, könnyű lett volna hazavinni néhányat ezekből a szépségekből!
sys_expe_found_ships_logbook_2: >-
  Bejegyzés a gépházi tiszt naplójából: Sajnos nem volt kapacitásunk
  visszahozni az összes hajót, amit ezen a küldetésen felfedeztünk.
sys_expe_found_ships_logbook_3: >-
  Bejegyzés a gépházi tiszt naplójából: Sajnos nincs elég kapacitásunk, hogy
  az összes talált hajót magunkkal vigyük.
sys_expe_found_ships_nothing: Nem sikerült hajókat találni.
sys_expe_lost_fleet_1: >-
  Az expedícióból csak a következő rádióüzenet maradt: Zzzrrt
  jaj Istenem!...Krrrzzzzt a zrrrtrzt látja krgzzzz igen honnan Krzzzzzzzztzzzz...
sys_expe_lost_fleet_2: >-
  Az expedíciótól utoljára néhány hihetetlenül jó közelképet kaptunk egy
  kinyíló fekete lyukról.
sys_expe_lost_fleet_3: >-
  Az egyik parancsnoki hajó atomi balesete láncreakcióhoz vezetett, amely egy
  látványos robbanásban megsemmisítette az egész expedíciót.
sys_expe_lost_fleet_4: >-
  Az expedíciós flotta nem tért vissza a hipertérugrásból. A tudósaink még
  mindig törik a fejüket, mi történhetett, de a flotta úgy tűnik, örökre elveszett.
sys_expe_nothing_1: >-
  Ez az expedíció semmi izgalmasat nem hoz haza, csak néhány különös kis állatot
  egy ismeretlen mocsárbolygóról.
sys_expe_nothing_2: >-
  Az expedíciód gyönyörű képeket készített egy szupernóváról. Új felismerést
  azonban nem igazán hozott ez az expedíció. De jó esélye van megnyerni az idei
  Az Univerzum Legjobb Képe versenyt.
sys_expe_nothing_3: >-
  Egy furcsa számítógépes vírus megbénította a navigációt nem sokkal a
  naprendszer elhagyása után. Ezért az egész expedíciós flotta végig körökben
  repült. Mondanunk sem kell, az expedíció nem volt különösebben sikeres.
sys_expe_nothing_4: >-
  Egy tiszta energiából álló életforma több napig hipnotikus szimbólumokra
  bámultatta az expedíció összes tagját a képernyőjükön. Mire a legtöbben végre
  kitisztult a fejük, az expedíciót deutériumhiány miatt le kellett fújni.
sys_expe_nothing_5: >-
  Nos, legalább most már tudjuk, hogy az 5. osztályú vörös anomáliák nem csak
  kaotikus hatással vannak a hajó rendszereire, hanem tömeges hallucinációkat is
  kiválthatnak a legénységben. Sajnos ezen az expedíción semmi más nem derült ki.
sys_expe_nothing_6: >-
  Az ebben a szektorban végzett kezdetben ígéretes letapogatások ellenére
  sajnos üres kézzel jöttünk vissza.
sys_expe_nothing_7: >-
  Talán nem kellett volna a kapitány születésnapját ezen a távoli bolygón
  megünnepelni. Egy csúnya vérzéses láz a legénység nagy részét a
  betegszobára küldte, és az akut létszámhiány miatt az expedíció kudarcot
  vallott.
sys_expe_nothing_8: >-
  Az expedíciód nem talált mást, csak az űr végtelen ürességét. Még egy kis
  aszteroida, sugárzás, részecske vagy bármi más sem volt, ami legalább egy
  kicsit izgalmassá tehette volna ezt az expedíciót.
sys_expe_nothing_9: >-
  A parancsnoki hajó reaktorhibája majdnem az egész expedíciót
  megsemmisítette. Szerencsére a technikusok többnyire hozzáértők voltak, és
  megakadályozták a legrosszabbat. A javítás azonban annyi időt vett igénybe,
  hogy az expedíció eredmény nélkül tért haza.
sys_expe_report: Expedíciós jelentés
sys_expe_report_msg: '%s %s flottájának expedíciós jelentése, helyszín: %s:'
sys_expe_time_fast_1: >-
  A hajtómű-energiatekercsekben egy előre nem látott visszacsatolási hurok
  felgyorsította az expedíció hazatérését, így a vártnál korábban érkezik. Az
  első jelentések szerint azonban nincs más jelenteni valója.
sys_expe_time_fast_2: >-
  Az újonnan kinevezett, kissé vakmerő parancsnok egy instabil féregjáratot
  használt a visszaút lerövidítésére - sikerrel! Magáról az expedícióról
  azonban nem derültek ki új felismerések.
sys_expe_time_fast_3: >-
  Az expedíciód nem jelzett anomáliát a felfedezett szektorban. A flotta azonban
  napszéllel találkozott a visszaúton, ami jelentősen felgyorsította az utat. Az
  expedíciód így a vártnál valamivel korábban ér haza.
sys_expe_time_slow_1: >-
  A navigátor súlyos baklövése miatt a flotta teljesen rossz helyre jutott. A
  visszaút ezért jóval tovább tartott.
sys_expe_time_slow_2: >-
  Egyelőre ismeretlen okból a flotta ugrása teljesen félresikerült. Majdnem egy
  csillag szívében kötöttek ki! Szerencsére egy ismert rendszerben értek földet,
  de a visszaút hosszabb lesz az eredetileg tervezettnél.
sys_expe_time_slow_3: >-
  Az új navigációs modult úgy tűnik, még mindig hibák gyötrik. Az expedíciós
  flotta nemcsak teljesen rossz irányba ment, hanem az összes deutériumát is
  elfogyasztotta! Az expedíció csalódottan tér vissza tartalék energiával.
sys_expe_time_slow_4: >-
  Az expedíciód egy felerősödött részecskeviharos szektorba lépett. Ez
  túlterhelte az energiatároló rendszereket, így az összes hajó főrendszerei
  leálltak. A szerelőid megakadályozták a legrosszabbat, de az expedíció most
  jelentős késéssel tér vissza.
sys_expe_time_slow_5: >-
  Az expedíciós flottád zászlóshajója ütközött egy idegen járművel, amely
  figyelmeztetés nélkül a flotta közepébe ugrott. Az idegen hajó felrobbant, és
  a zászlóshajó kára jelentős. Ha a legsúlyosabb javításokkal végeztek, a
  hajóid megkezdik a visszautat, mert az expedíció a jelenlegi állapotában nem
  folytatható.
sys_expe_time_slow_6: >-
  Egy vörös óriás csillagszele eltorzította az expedíció ugrását, ezért a
  navigációs rendszerek teljesen elszámolták a visszautat. Emiatt az expedíció
  az ismeretlen csillagok közötti hatalmas ürességben találja magát.
