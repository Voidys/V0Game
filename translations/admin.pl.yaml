se_rebuild_protection: Odbudowa ochrony
se_rebuild_protection_info: W przypadku poważnych strat gracze otrzymują ochronę przed kolejnymi atakami po 6 godzinach przez 48 godzin od ataku. Podczas jednego ataku musi zostać zniszczone 70% floty lub 80% zdolności transportowych. Ponadto musi to odpowiadać co najmniej punktom ochrony Noop * 1000 w jednostkach lub pojemności. Użytkownik może zakończyć tryb przedwcześnie.
