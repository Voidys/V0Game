se_donate_url_info: Link do darowizn (https://...), wyświetlany w menu. Puste = ukryty.
se_userscripts_url: URL userscriptów
se_userscripts_url_info: Strona z userscriptami do Twojej gry (https://...), linkowana w ustawieniach. Puste = ukryty.
se_bots_alliances_enabled: Boty tworzą sojusze
se_bots_alliances_enabled_info: 'Boty zakładają własne sojusze i czasem dołączają do innych. Wyłączone: boty działają w pojedynkę, nigdzie nie aplikują i opuszczają sojusze, do których należą (sojusze założone przez boty pozostają).'
se_bots_join_human_alliances: Boty mogą dołączać do sojuszy graczy
se_bots_join_human_alliances_info: 'Boty mogą też aplikować do sojuszy założonych przez ludzkich graczy. Wyłączone: boty dołączają tylko do sojuszy założonych przez boty i opuszczają sojusze graczy.'
se_bot_reply_delay_hours: Opóźnienie odpowiedzi (godziny)
se_bot_reply_delay_hours_info: Ile godzin najstarsza nieodpowiedziana wiadomość prywatna gracza czeka, zanim bot odpowie na wszystkie oczekujące wiadomości tego gracza jednym zbiorczym listem. To też minimalny odstęp między dwiema wiadomościami zainicjowanymi przez boty (reakcje na atak, zaczepki przy najeździe) do tego samego gracza. 0 = bez opóźnienia.
se_bot_chatter: Boty rozmawiają
se_bot_chatter_info: 'Włączone: boty odpowiadają na wiadomości prywatne. Wyłączone: wiadomości są nadal czytane i liczone, ale wysyłane są tylko reakcje bojowe (po ataku lub najeździe na gracza, który do nich napisał). Boty nigdy nie piszą pierwsze.'
