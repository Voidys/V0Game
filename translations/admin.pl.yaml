adm_dash_unprotected_push: Ochrona przed wypychaniem transportem, wstrzymaniem i transferem jest wyłączona (transport_push_check / transport_push_limit).
adm_dash_unprotected_honor: Limit walk honorowych na parę wynosi 0 (nieograniczony honor między tymi samymi dwoma graczami).
adm_dash_unprotected_bash: Ogłoszone wojny znoszą limit bash (bash_war_exempt).
adm_dash_unprotected_depot: Magazyny wstrzymań kosztują tanie bazowe zużycie (depot_cost_real_consumption wyłączone).
adm_dash_unprotected_market: Tolerancja wypychania na rynku przekracza 10 % (market_push_tolerance).
