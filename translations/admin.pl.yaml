se_pow_sensitivity: Ochrona przed botami - czułość wykrywania ryzyka
se_pow_sensitivity_info: Procent domyślnych progów (podwyższone od 5 żądań/10 min, 3 błędów/godz. lub 2 rejestracji/24 h na IP; wysokie od 20 / 10 / 5; sieci trzykrotnie więcej). 200 = potrzeba dwa razy więcej zdarzeń, 50 = połowa.
se_pow_max_number: Ochrona przed botami - trudność (maksymalna liczba)
