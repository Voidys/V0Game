adm_nav_social: "Logowanie społecznościowe"
se_social: "Logowanie społecznościowe"
se_social_info: "Pozwala graczom logować się lub rejestrować istniejącym kontem Discord, Facebook, GitHub lub Google (OAuth2). Wszyscy dostawcy są domyślnie wyłączeni. Utwórz aplikację u dostawcy, zarejestruj tam podany poniżej adres callback i wpisz tutaj identyfikator klienta oraz sekret."
se_social_site_url_missing: "Bazowy adres URL gry (DEFAULT_URI w .env.local) nie jest ustawiony, więc nie można zbudować adresu callback, a dostawcy pozostają nieużywalni."
se_social_incomplete: "Włączone, ale brakuje identyfikatora lub sekretu klienta: przycisk logowania pozostaje ukryty."
se_social_enabled: "Włączone"
se_social_enabled_info: "Pokazuje przycisk logowania na stronie głównej i stronie rejestracji."
se_social_client_id: "Identyfikator klienta"
se_social_client_id_info: "Identyfikator aplikacji (klienta) u dostawcy."
se_social_client_secret: "Sekret klienta"
se_social_client_secret_info: "Nigdy więcej nie jest wyświetlany. Zostaw puste, aby zachować zapisany sekret."
se_social_callback: "Adres callback"
se_social_callback_info: "Zarejestruj dokładnie ten adres jako adres przekierowania / callback u dostawcy."
se_social_create_app: "Utwórz aplikację"
se_social_discord_help: "Discord Developer Portal: New Application, następnie OAuth2: dodaj przekierowanie, skopiuj identyfikator i sekret klienta."
se_social_facebook_help: "Meta for Developers: utwórz aplikację z zastosowaniem Facebook Login i dodaj adres w prawidłowych identyfikatorach URI przekierowania OAuth. E-mail z Facebooka nigdy nie jest traktowany jako zweryfikowany: nowi gracze nie mogą się nim rejestrować, a istniejące konta nie są dopasowywane po e-mailu; łączenie w ustawieniach konta działa."
se_social_github_help: "GitHub Settings, Developer settings, OAuth Apps: New OAuth App, wpisz adres callback jako Authorization callback URL."
se_social_google_help: "Google Cloud Console, Interfejsy API i usługi, Dane logowania: utwórz identyfikator klienta OAuth typu Aplikacja internetowa i dodaj adres callback w autoryzowanych identyfikatorach URI przekierowania."
se_social_scopes: "Żądane zakresy: %s"
se_del_user_automatic_on: "Auto-delete inactive players"
se_del_user_automatic_on_info: "Switch for the automatic deletion of normal inactive players (not in vacation mode, not banned) after the number of days set above. Off: inactive players are never deleted automatically."
se_del_user_vacation_on: "Auto-delete players in vacation mode"
se_del_user_vacation_on_info: "Switch for the automatic deletion of players who are in vacation mode and have not logged in for the number of days below. Off: players in vacation mode are never deleted automatically."
se_del_user_vacation: "Delete players in vacation mode after"
se_del_user_vacation_info: "Days without a login after which a player in vacation mode is deleted. 0 = same number of days as for inactive players."
se_del_user_banned_on: "Auto-delete banned players"
se_del_user_banned_on_info: "Switch for the automatic deletion of banned players who have not logged in for the number of days below. Off: banned players are never deleted automatically (their ban stays)."
se_del_user_banned: "Delete banned players after"
se_del_user_banned_info: "Days without a login after which a banned player is deleted. 0 = same number of days as for inactive players."
se_vmode_allow_incoming: "Vacation mode with hostile fleets inbound"
se_vmode_allow_incoming_info: "On: players may enter vacation mode while foreign fleets are on their way to them (the attack bounces). Off: vacation mode is refused while foreign fleets with an attack, ACS attack, missile, destroy or spy mission are heading to one of the player's planets or moons."
rp_fleets_error: "There are still fleets of or to players in flight!"
