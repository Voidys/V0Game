abuse_link_subnet: ta sama podsieć (słabiej)
abuse_thresholds: 'Progi: para transferów jest pokazywana od %s jednostek metalu w jedną stronę przy co najwyżej %s wracających; pary rynkowe od %s transakcji, oznaczane powyżej różnicy %s. Brak wierszy oznacza, że nic nie przekroczyło tych progów (lub logi są puste), a nie że nic się nie działo.'
abuse_transfers: Jednostronne transporty i wstrzymania
abuse_transfers_info: Transporty, wstrzymania i transfery statków (niecofnięte; statki liczone po koszcie budowy) między dwoma graczami, których ładunek był wart co najmniej %s jednostek metalu w jedną stronę, a co najwyżej %s tej wartości wróciło. Sortowane wg wartości netto; wagi to zapisane kursy rynkowe.
abuse_trades: Powtarzane transakcje rynkowe
abuse_trades_info: Wymiany surowców między tymi samymi dwoma graczami, co najmniej %s razy. Stosunek = wartość oddana przez stronę, która dała więcej, podzielona przez wartość drugiej strony (1.00 = według wartości referencyjnej rynku); powyżej różnicy %s para jest oznaczana.
abuse_giver: Dał więcej
abuse_receiver: Otrzymał więcej
abuse_ratio: Stosunek
abuse_outlier: odstająca
abuse_protections: Nadane ochrony odbudowy
abuse_protections_info: Gracze, którzy w tym oknie otrzymali ochronę odbudowy. Przeciwnicy to druga strona raportu walki z tej bitwy; łup to wartość, jaką zyskały ich floty (gruzowisko i zniszczona wartość nie są zapisywane).
