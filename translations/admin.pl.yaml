abuse_mission_9: Zniszczenie
abuse_missiles_skipped: 'Wystrzały rakiet a zawartość silosów nie są częścią tego raportu: tabele nie przechowują historii silosów do porównania.'
abuse_link_device: to samo urządzenie
abuse_graph: Klastry przepływu wartości
abuse_graph_info: 'Gracze powiązani przepływem wartości w ostatnich %s dniach (stałe okno): transporty, wstrzymania, transfery statków (wg kosztu budowy), transakcje rynkowe (obie strony) i łup z ataków, zsumowane w obu kierunkach. Łączone są tylko pary, między którymi przeniesiono co najmniej %s jednostek metalu i %s przepływów; wypisywane są grupy połączone z co najmniej dwoma członkami (top %s wg wartości). Netto = wartość najbardziej jednostronnej pary w klastrze (udział w jego łącznej wartości). Flagi powiązań pokazują, czy członkowie dzielą IP, urządzenie lub grupę multi z innym członkiem. Wiersze są odczytywane z limitem na źródło.'
abuse_members: Członkowie
abuse_value: Łączna wartość
abuse_flows: Przepływy
abuse_top_edge: Najbardziej jednostronna para
abuse_activity: Aktywność wysyłania flot (24 h)
abuse_activity_info: Konta z największą liczbą wysłanych flot w ostatnich 24 godzinach; szczyt = wysyłki w najbardziej obciążonej godzinie zegarowej. Stale wysokie szczyty mogą wskazywać na grę skryptową.
abuse_player: Gracz
abuse_launches: Wysyłki
abuse_peak: Szczyt / godzinę
