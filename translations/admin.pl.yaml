se_pow_adaptive_info: 'Włączone: podejrzane adresy IP i sieci (/24 lub /64) dostają znacznie trudniejsze zadanie (dużo żądań, błędów lub rejestracji w krótkim czasie). Wyłączone: każdy odwiedzający dostaje podstawowe zadanie i żadne liczniki nie są odczytywane.'
