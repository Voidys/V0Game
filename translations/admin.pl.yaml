se_discord_url_info: Link zaproszenia na Twój serwer Discord (https://...). Wyświetlany w menu, na stronie logowania, w e-mailach i tekstach. Puste = ukryty.
se_discord_widget_guild: ID serwera Discord (widżet online)
se_discord_widget_guild_info: ID Twojego serwera Discord (17-20 cyfr; w Ustawieniach serwera → Widżet musi być włączone „Włącz widżet serwera”). Wyświetla na stronie startowej ramkę z liczbą osób online, odświeżaną co 5 minut. Puste pole ukrywa ją.
se_wiki_url: URL wiki
se_wiki_url_info: Bazowy URL zewnętrznej wiki, bez ukośnika na końcu (https://...). Linki do wiki w FAQ, samouczku i regułach powstają z niego. Puste = ukryte.
