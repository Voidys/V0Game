se_market_push_tolerance_info: Dopuszczalna różnica wartości transakcji rynkowej w procentach (0-90), zanim zostanie uznana za wypychanie. Domyślnie 30.
se_transport_push_check: Ochrona przed wypychaniem transportami
se_transport_push_check_info: Odrzuca transporty, wstrzymania i transfery (surowce i statki) do innego gracza, gdy w ciągu ostatnich 7 dni wartość wysłana do niego przekracza wartość odesłaną mu o więcej niż poniższy limit.
se_transport_push_limit: Limit wypychania transportem
se_transport_push_limit_info: Wartość ładunku w jednostkach deuteru (wg kursów rynkowych), powyżej której działa ochrona. 0 = ochrona wyłączona.
se_depot_cost_real_consumption: Koszt magazynu wg rzeczywistego zużycia
se_depot_cost_real_consumption_info: Magazyn sojuszu pobiera rzeczywiste zużycie paliwa floty (z napędami i technologiami paliwa właściciela) / 10 za godzinę zamiast bazowego zużycia / 10.
se_hours: Godziny
se_remember_me_days: '„Pozostań zalogowany” obowiązuje przez'
se_remember_me_days_info: 'Dni, przez które logowanie z zaznaczonym polem „Pozostań zalogowany” przetrwa restart przeglądarki i wygasłe sesje. Zmiana hasła je kończy. 0 wyłącza tę opcję.'
se_session_lifetime: Sesja wygasa po bezczynności trwającej
se_session_lifetime_info: 'Godziny bez żadnego żądania, po których gracz zostaje wylogowany („sesja wygasła”).'
