intro_text: V0Game - один из лучших клонов OGame.<br>V0Game является самым стабильным и развивающимся движком из всех подобных XNova на данный момент. Мы надеемся, что V0Game будет лучше, чем Вы ожидаете.<br><br>Если у Вас будут вопросы, консультируйтесь с нами.<br><br>V0Game является проектом с открытым кодом и распространяется под лицензией GNU GPL v3, ознакомиться с которой Вы можете в разделе Лицензия.<br><br>Перед установкой будет запущен небольшой тест на соответствие минимальным требованиям.
