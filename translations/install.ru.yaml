ins_db_host_info: Почти всегда «localhost». Некоторые хостинги выдают имя вроде «db1.example.com».
ins_db_name_info: Имя базы данных для игры. Сначала создайте её в панели хостинга или позвольте установщику создать её (см. блок ниже).
