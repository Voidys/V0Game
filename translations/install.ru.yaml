ins_db_prefix_info: Добавляется перед именем каждой таблицы. Меняйте, только если делите базу данных с другим ПО.
ins_db_migrationpw_info: Защищает страницу обновления (install/?mode=upgrade) для будущих обновлений игры. Оставьте пустым, и установщик создаст надёжный пароль и покажет его один раз на последней странице.
ins_db_migrationpw_placeholder: генерируется автоматически
