ins_db_help: V0Game хранит всё в базе данных MySQL или MariaDB. Значения ниже вы найдёте в панели хостинга (ищите «Базы данных» или «MySQL») или узнаете у того, кто настраивал ваш сервер. Если вы установили MySQL сами, обычно подходят значения по умолчанию.
