ins_err_technical: технические подробности
ins_err_access_denied: Сервер базы данных отклонил имя пользователя или пароль. Проверьте оба значения в панели хостинга на опечатки (регистр важен).
ins_err_unknown_db: Эта база данных не существует на сервере. Проверьте имя или отметьте ниже «Создать базу данных».
ins_err_no_privilege: У этого пользователя базы данных нет прав на использование этой базы. Дайте ему все привилегии на неё в панели хостинга.
ins_err_no_create: У этого пользователя нет прав на создание баз данных. Создайте пустую базу в панели хостинга и снимите отметку «Создать базу данных».
ins_err_socket: Сокет сервера базы данных не найден. Попробуйте хост «127.0.0.1» вместо «localhost».
