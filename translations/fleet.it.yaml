  La tua flotta è arrivata alle coordinate %s. I coloni hanno iniziato a
  colonizzare il nuovo pianeta.
sys_colo_badpos: >-
  La tua flotta è arrivata alle coordinate %s. Lì non è possibile insediarsi,
  quindi i coloni sono tornati a casa delusi.
sys_colo_maxcolo: >-
  La tua flotta è arrivata alle coordinate %s. Insediarsi non è possibile: puoi
  avere al massimo %d pianeti.
sys_colo_mess_from: Colonizzazione
sys_colo_mess_report: Rapporto di colonizzazione
