  La tua flotta è arrivata alle coordinate %s. I coloni hanno scoperto che il
  loro equipaggiamento non era adatto al clima e va migliorato. Delusi, sono
  tornati a casa.
sys_colo_notfree: >-
  La tua flotta è arrivata alle coordinate %s. Purtroppo i coloni hanno scoperto
  che il pianeta è già abitato! Completamente demoralizzati, sono tornati a
  casa.
