Achievement_text:
  '1': 'Fă ca 5 atacuri ale tale să aterizeze între miezul nopții și ora 6 dimineața în aceeași noapte, fără să câștigi vreunul.'
  '2': Ai avut flote în mișcare non-stop timp de 90 de zile.
  '3': 'Ți-ai pierdut flota în timp ce limba ta era setată pe „franceză”.'
  '4': Cercetează Tehnologia ionică nivelul 10.
  '5': Cercetează Cercetarea de graviton nivelul 2, doar pentru că poți.
  '6': Unul dintre atacurile tale s-a întors cu doar 1 metal, 1 cristal și 1 deuteriu.
  '7': 'Învinge o flotă de nave pirat sau extraterestre de cel puțin 10.000 de nave. Spațiul e al nostru!'
  '8': Vino la Strammtisch (marțea la 20:00 pe Discord).
  '9': Construiește-ți prima Stea a morții.
  '10': Distruge luna unui jucător.
  '11': Joacă 14 zile exclusiv pe mobil.
  '12': Flota ta a fost distrusă de o gaură neagră în prima ta expediție.
  '13': Trimite-ți flota în altă parte cu mai puțin de 5 secunde înainte să lovească un atac care sosește.
  '14': Pierde 10 flote în găuri negre. Vidul îi e foame.
  '15': 'Nu obține prima ta lună în 10 lupte cu șansa maximă de lună.'
  '16': Mai mult de 250 dintre reciclatoarele tale s-au întors goale.
  '17': Pune în coadă cel puțin 5000 de Lansatoare de rachete într-o singură comandă de construcție.
  '18': Arde 5 milioane de deuteriu drept combustibil pe o singură planetă în 24 de ore.
  '19': Cercetează Tehnologia blindajului nivelul 3.
  '20': Cercetează Tehnologia blindajului nivelul 6.
  '21': Cercetează Tehnologia blindajului nivelul 9.
  '22': Cercetează Tehnologia blindajului nivelul 12.
  '23': Cercetează Tehnologia blindajului nivelul 15.
  '24': Cercetează Tehnologia laser nivelul 12.
  '25': Alătură-te Recordurilor.
  '26': Șterge planeta care îți aduce cele mai multe puncte (cel puțin 100.000 de puncte).
  '27': Cercetează Rețeaua intergalactică de cercetare nivelul 1.
  '28': Îmbunătățește toate cele trei depozite de pe o lună la cel puțin nivelul 3.
  '29': Colectivizează flota unui jucător cu scor mai mare printr-un ACS de 5 jucători.
  '30': Respinge singur un ACS de 5 jucători.
  '31': Trimite un jucător în modul vacanță cu atacul tău.
  '32': 'Jefuiește 1000 de planete folosind tema „SetSail”. Arr!'
  '33': Întoarce-te din modul vacanță.
  '34': Fii atacat pentru prima dată. Bun venit în univers.
  '35': Atacă un jucător activ care are mai puțin de 1/10 din punctele tale.
  '36': "Primește un mesaj care conține unul dintre următoarele blocuri:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Fii șters de un ACS de 5 jucători.
  '38': 'Atacă membri ai propriei alianțe. Foc prietenesc, cineva?'
  '39': Atacă pe cineva cu exact 42 de nave.
  '40': Colonizează o planetă la cel puțin jumătate de univers distanță.
  '41': Blochează un slot de flotă o săptămână cu o ofertă proastă pe piață.
  '42': Intră de 4 ori în Sala bătăliilor de partea învinsă.
  '43': "Câștigă o bătălie în timp ce contul tău este marcat ca Inactiv,\r\n            pe una dintre planetele tale unde a ajuns înainte o flotă cu un timp de zbor de peste 7 zile."
  '44': 'Produce o resursă pe o planetă mai mult de 7 zile în timp ce rulezi la mai puțin de 100% energie.'
  '45': Câștigă un atac împotriva unui jucător aflat în top 5 la apărare.
  '46': Declanșează protecția de bash tragând rachete interplanetare.
  '47': Distruge 5 luni.
  '48': Pierde 5 Stele ale morții încercând să distrugi luni. Au.
  '49': Demolează o colonie la scurt timp după creare.
  '50': "Pierde toți sateliții solari de pe o planetă cu destulă\r\n            energie ca să cercetezi tehnologia Graviton, fără să fi cercetat tehnologia Graviton."
  '51': Consumă tot deuteriul tău răsfoind vizualizarea galaxiei.
  '52': >-
    Construiește o Stea a morții fără să fi construit mai întâi alte nave de
    luptă (Vânător ușor, Vânător greu, Crucișător, Navă de luptă, Bombardier,
    Distrugător sau Crucișător de luptă).
  '53': Ține nivelul maxim la 5 cercetări în același timp.
  '54': 'Sincronizează un atac asupra unui jucător activ ca să lovească pe 01.01 00:00:00.'
  '55': Realizare specială
  '56': 'Atinge nivelul 15 la propulsia hiperspațială.'
  '57': 'Atinge nivelul 15 la astrofizică.'
  '58': 'Cercetează fiecare tehnologie (în afară de graviton) cel puțin o dată.'
  '59': 'Adu fiecare cercetare (în afară de graviton) la nivelul 10.'
  '60': 'Deține 1.000.000.000 dintr-o singură resursă pe o planetă sau o lună.'
  '61': 'Ai 1000 de sateliți solari în același timp pe o planetă.'
  '62': 'Construiește pe fiecare câmp al unei planete cu cel puțin 250 de câmpuri.'
  '63': 'Adu depozitele de metal, cristal și deuteriu la nivelul 15 pe o planetă.'
  '64': 'Ai o mină de metal de nivel 30 sau mai mare pe 9 planete.'
  '65': 'Pornește o singură comandă de construcție care durează mai mult de 30 de zile.'
  '66': 'Fă ca alți jucători să cumpere 50 dintre ofertele tale de pe piață.'
  '67': 'Câștigă o apărare împotriva atacatorilor care valorează cel puțin de 10 ori flota și apărarea ta (atacatori de cel puțin 1.000.000 de resurse).'
  '68': 'Câștigă un atac în care distrugi cel puțin 1000 de unități inamice fără să pierzi nicio unitate.'
  '69': 'Încheie o luptă la egalitate după numărul maxim de runde, fiecare parte pierzând cel puțin 10.000 de unități.'
  '70': 'Fii atacat pe o planetă fără nave și fără apărare, astfel încât atacatorul să nu jefuiască nimic.'
  '71': 'Primește o lună dintr-o luptă care avea doar 1 % șansă de lună.'
  '72': 'Distruge cel puțin 100 de unități de apărare cu un singur atac cu rachete interplanetare.'
  '73': 'Distruge cel puțin 100 de sonde de spionaj inamice într-o luptă pe planeta ta.'
  '74': 'Jefuiește în total 1.000.000.000 de resurse.'
  '75': 'Reciclează în total 1.000.000.000 de resurse.'
  '76': 'Repară în total 1000 de nave din câmpuri de epave.'
  '77': 'Câștigă 1000 de puncte de onoare.'
  '78': 'Devino proscris pentru prima dată.'
  '79': 'Participă ca atacator la 25 de atacuri comune câștigate.'
  '80': 'Trăiește fiecare rezultat posibil al unei expediții cel puțin o dată.'
  '81': 'Trimite 1000 de expediții.'
  '82': 'Câștigă o luptă de expediție împotriva unei flote extraterestre mari.'
  '83': 'Găsește cantități mari de resurse în 50 de expediții.'
  '84': 'Trimite o flotă într-un zbor dus de peste 24 de ore.'
  '85': 'Fă ca o flotă să ajungă la țintă pe 29 februarie.'
  '86': 'Pierde o flotă de atac întreagă într-o vineri 13.'
  '87': 'Fă ca două dintre atacurile tale (fără atac comun) să aterizeze pe aceeași țintă în aceeași secundă.'
  '88': 'Ai simultan flote în drum spre fiecare galaxie a universului.'
  '89': 'Termină tutorialul.'
  '90': 'Ai simultan pacte active cu alte 3 alianțe (toți membrii alianței îl primesc).'
  '91': 'Creează 5 pagini wiki ale alianței.'
  '92': 'Ai 10 cereri de prietenie acceptate.'
  '93': 'Fii numărul 1 în clasamentul punctelor totale 7 zile la rând.'
  '94': 'Ai simultan 100 de Stele ale Morții pe o planetă sau o lună.'
  '95': 'Ocupă fiecare slot de planetă permis de astrofizica ta (cel puțin 9), fiecare planetă cu cel puțin 200 de câmpuri.'
  '96': 'Deține alte 50 de realizări.'
