install_desc: 'Để bật công cụ cài đặt, hãy tạo tệp "var/ENABLE_INSTALL_TOOL".<br> Tên tệp phân biệt chữ hoa chữ thường và không có phần mở rộng.<br> Tệp có thể để trống.

