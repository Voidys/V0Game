ins_group_imprint: 'Thông tin pháp lý (tùy chọn)'
ins_imprint_info: 'Thông tin liên hệ cho trang thông tin pháp lý. Cả hai có thể để trống và đổi sau trong Admin - Cài đặt.'
ins_imprint_eu_hint: 'Nhà vận hành tại EU thường cần trang thông tin pháp lý có email liên hệ. Bạn có thể bỏ qua bây giờ nhưng hãy điền trước khi công khai.'
