intro_text: 'V0Game là trò chơi chiến lược không gian mã nguồn mở chạy trên trình duyệt: xây dựng hành tinh, nghiên cứu, điều hạm đội và giao chiến với hàng trăm người chơi cùng lúc.<br><br>Trình hướng dẫn này thiết lập một bản cài đặt mới theo từng bước: kiểm tra máy chủ, kết nối và tạo cơ sở dữ liệu, tạo các bảng, đặt tên cho trò chơi và tạo tài khoản quản trị viên.'
