ins_default_theme: Giao diện mặc định
ins_default_theme_info: Giao diện cho tài khoản mới và khách; người chơi có thể đổi trong cài đặt.
ins_game_name_invalid: Nhập tên trò chơi từ 1 đến 64 ký tự.
ins_theme_invalid: Giao diện không tồn tại.
ins_to_start: Đến trang chủ
ins_credits_head: Đứng trên vai những người khổng lồ
ins_credits_text: 'V0Game tiếp nối một dòng dài các trò chơi trình duyệt mã nguồn mở. Xin tri ân tất cả những ai đã xây dựng và giữ cho chúng sống trước chúng tôi:'
ins_credits_thanks: 'Cảm ơn tất cả các lập trình viên và người duy trì đã xây dựng và giữ cho trò chơi này tồn tại qua nhiều năm, từ 2Moons, SteemNova đến pr0game.'
ins_licence_note: Phần mềm tự do theo GNU AGPL v3
ins_task_images: Tối ưu hình ảnh (WebP)
ins_db_help: V0Game lưu toàn bộ dữ liệu trong cơ sở dữ liệu MySQL hoặc MariaDB. Bạn lấy các giá trị bên dưới từ bảng điều khiển hosting (tìm "Databases" hoặc "MySQL") hoặc từ người thiết lập máy chủ. Nếu tự cài MySQL, giá trị mặc định thường dùng được.
ins_db_host: Máy chủ cơ sở dữ liệu
ins_db_host_info: Hầu như luôn là "localhost". Một số hosting cho tên dạng "db1.example.com".
ins_db_name_info: Tên cơ sở dữ liệu của trò chơi. Hãy tạo trước trong bảng điều khiển hosting, hoặc để trình cài đặt tạo (xem khung bên dưới).
ins_db_advanced: Nâng cao (cổng, tiền tố bảng, mật khẩu migration) - thường không cần
ins_db_prefix_info: Được thêm vào trước mọi tên bảng. Chỉ đổi khi dùng chung cơ sở dữ liệu với phần mềm khác.
ins_db_migrationpw_info: Bảo vệ trang cập nhật (install/?mode=upgrade) cho các bản cập nhật trò chơi sau này. Để trống thì trình cài đặt sẽ tạo mật khẩu mạnh và hiển thị một lần ở trang cuối.
ins_db_migrationpw_placeholder: được tạo tự động
ins_migrationpw_invalid: Mật khẩu migration không được chứa dấu nháy, dấu gạch chéo ngược, $ hoặc ký tự xuống dòng.
ins_err_technical: chi tiết kỹ thuật
ins_err_access_denied: Máy chủ cơ sở dữ liệu từ chối tên người dùng hoặc mật khẩu. Hãy kiểm tra lại cả hai trong bảng điều khiển hosting (có phân biệt chữ hoa chữ thường).
ins_err_unknown_db: Cơ sở dữ liệu này không tồn tại trên máy chủ. Hãy kiểm tra tên, hoặc đánh dấu "Tạo cơ sở dữ liệu" bên dưới.
ins_err_no_privilege: Người dùng cơ sở dữ liệu này không có quyền sử dụng cơ sở dữ liệu đó. Hãy cấp toàn bộ quyền cho người dùng trong bảng điều khiển hosting.
ins_err_no_create: Người dùng này không có quyền tạo cơ sở dữ liệu. Hãy tạo một cơ sở dữ liệu trống trong bảng điều khiển hosting và bỏ đánh dấu "Tạo cơ sở dữ liệu".
ins_err_socket: Không tìm thấy socket của máy chủ cơ sở dữ liệu. Hãy thử máy chủ "127.0.0.1" thay vì "localhost".
ins_err_unreachable: Không thể kết nối tới máy chủ cơ sở dữ liệu "%s". Hãy kiểm tra tên máy chủ, cổng và xem máy chủ cơ sở dữ liệu có đang chạy không. Nhiều hosting chỉ cho phép kết nối từ chính máy chủ web của họ, nên "localhost" thường là đúng.
ins_game_desc: Đặt tên cho trò chơi và chọn cách vận hành. Mọi thứ ở đây đều có thể đổi sau này trong trang quản trị (Admin - Cài đặt).
ins_group_general: Chung
ins_uni_name: Tên vũ trụ
ins_uni_name_info: Hiển thị cho người chơi khi họ chọn vũ trụ. Để trống = "Vũ trụ 1".
ins_uni_name_invalid: Tên vũ trụ chỉ được tối đa 60 ký tự.
ins_language: Ngôn ngữ mặc định
ins_language_info: Ngôn ngữ cho khách mới và tài khoản quản trị viên của bạn.
ins_language_invalid: Ngôn ngữ không tồn tại.
ins_timezone: Múi giờ
ins_timezone_info: Được chọn sẵn theo máy chủ. Dùng để hiển thị giờ máy chủ.
ins_timezone_invalid: Múi giờ không tồn tại.
ins_group_speed: Tốc độ trò chơi
ins_speed_info: Tốc độ xây dựng, nghiên cứu, đóng tàu, hạm đội và sản xuất. Cổ điển là nhịp độ gốc; các mức nhanh hơn phù hợp với cộng đồng nhỏ và ván ngắn.
ins_speed_classic: Cổ điển
ins_speed_classic_info: nhịp độ gốc, một ván kéo dài nhiều tháng
ins_speed_fast: Nhanh
ins_speed_fast_info: nhanh gấp khoảng ba lần, một ván kéo dài vài tuần
ins_speed_blitz: Chớp nhoáng
ins_speed_blitz_info: nhanh gấp tối đa mười lần, một ván kéo dài vài ngày
ins_speed_detail: Xây dựng/nghiên cứu %bx, hạm đội %fx, tài nguyên %rx
ins_speed_invalid: Mức tốc độ không tồn tại.
ins_group_players: Người chơi
ins_registration: Đăng ký
ins_registration_open: Mở - bất kỳ ai cũng có thể đăng ký
ins_registration_closed: Đóng - chỉ bạn có thể tạo tài khoản
ins_registration_info: Chọn "đóng" trong lúc bạn còn đang thiết lập. Bạn có thể mở lại sau trong Admin - Cài đặt.
ins_registration_invalid: Cài đặt đăng ký không tồn tại.
ins_bots: Người chơi máy (bot)
ins_bots_info: Từ 0 đến 50. Bot chơi như người thật với thói quen khác nhau, nên vũ trụ mới không bị trống. 0 = không có bot.
ins_bots_invalid: Số lượng bot phải từ 0 đến 50.
ins_mail: Gửi email (đăng ký, đặt lại mật khẩu)
ins_mail_info: Mặc định tắt. Chỉ bật khi máy chủ có thể gửi thư; bạn có thể cấu hình SMTP sau trong Admin - Cài đặt.
ins_admin_mail_info: Dùng để đặt lại mật khẩu và làm địa chỉ liên hệ.
ins_admin_mail_invalid: Nhập một địa chỉ email hợp lệ.
ins_admin_pass_confirm: Nhập lại mật khẩu
ins_admin_pass_rules: Mật khẩu cần ít nhất %d ký tự (tối đa 64). Một câu ngắn vài từ vừa dễ nhớ vừa khó đoán.
ins_admin_pass_short: Mật khẩu cần ít nhất %d ký tự.
ins_admin_pass_long: Mật khẩu chỉ được tối đa 64 ký tự.
ins_admin_pass_mismatch: Hai mật khẩu không khớp.
ins_done_checklist: Danh sách kiểm tra của bạn
ins_done_login: Đăng nhập vào trang quản trị.
ins_done_login_info: 'Bạn đã đăng nhập với tên "%s". Lần sau hãy dùng:'
ins_done_cron: Thiết lập cron job (bắt buộc).
ins_done_cron_info: 'Không có nó, mọi thứ trong trò chơi sẽ không tiến triển (hạm đội, hàng đợi công trình, thống kê). Thêm dòng này vào crontab của người dùng máy chủ web (crontab -e) hoặc tạo cron job với nó trong bảng điều khiển hosting:'
ins_done_cron_help: "Cách thiết lập cron job (cả trong bảng điều khiển hosting)"
ins_done_locked: Công cụ cài đặt hiện đã bị khóa.
ins_done_locked_info: Không ai có thể chạy lại trình hướng dẫn. Để cập nhật sau này, hãy làm theo phần nâng cấp trong tài liệu.
ins_done_https: Hãy dùng HTTPS.
ins_done_https_info: 'Bạn đang dùng HTTP thường: mật khẩu sẽ được truyền không mã hóa. Hãy cài chứng chỉ (ví dụ Let''s Encrypt) trước khi mời người chơi.'
ins_done_https_ok: Trang này được phục vụ qua HTTPS - tốt.
ins_done_settings: Đổi cài đặt sau.
ins_done_settings_info: 'Admin - Cài đặt: tên trò chơi, tốc độ, đăng ký, email (SMTP), bot và nhiều mục khác.'
ins_done_bots: Bot.
ins_done_bots_info: Đã tạo %d bot. Chúng hoạt động khi cron job chạy. Quản lý chúng trong trang quản trị.
ins_done_bots_failed: Đã tạo quản trị viên, nhưng không tạo được bot. Bạn có thể thêm sau trong trang quản trị.
ins_done_migrationpw: Hãy ghi lại mật khẩu migration (chỉ hiển thị một lần).
ins_done_migrationpw_info: Bạn cần nó để cập nhật trò chơi. Mật khẩu cũng được lưu trong config/game.php.
ins_done_docs: 'Tài liệu:'
ins_done_to_admin: Đến trang quản trị
ins_step_legal: Pháp lý
ins_legal_desc: Chọn nơi máy chủ đặt và cách các trang pháp lý cùng bảng cộng đồng bắt đầu. Bạn có thể đổi tất cả sau trong khu quản trị (Cài đặt, Trang).
ins_group_privacy: Khu vực đặt máy chủ
ins_privacy_info: Khu vực này quyết định chính sách bảo mật nào được dùng mặc định.
ins_privacy_eu: EU / EEA - chính sách bảo mật theo GDPR
ins_privacy_eu_info: Chọn khi máy chủ được đặt tại Liên minh châu Âu hoặc Khu vực kinh tế châu Âu, hoặc nhắm tới người chơi ở đó.
ins_privacy_other: Ngoài EU - chính sách bảo mật chung
ins_privacy_other_info: Chính sách bảo mật viết bằng ngôn ngữ dễ hiểu, không dẫn chiếu GDPR.
ins_group_rules: Quy định
ins_rules_default: Nhập quy định mặc định
ins_rules_default_info: Trang quy định bắt đầu với luật chơi chuẩn, bạn có thể sửa sau.
ins_rules_blank: Bắt đầu trống
ins_rules_blank_info: Trang quy định để trống cho đến khi bạn viết quy định riêng trong khu quản trị.
ins_group_community: Cộng đồng
ins_cookie_consent: "Hiển thị thông báo đồng ý cookie (GDPR)"
ins_cookie_consent_info: "Hiển thị cho khách truy cập thông báo về cookie mà trò chơi sử dụng. Khuyến nghị cho nhà vận hành phục vụ EU. Có thể thay đổi sau trong phần cài đặt."
ins_board: Bật bảng cộng đồng
ins_board_info: Diễn đàn cho người chơi. Khi tắt, mọi liên kết tới bảng sẽ bị ẩn và các trang bảng không khả dụng.
ins_legal_note: Các văn bản được tạo ra chỉ là mẫu. Là người vận hành, bạn chịu trách nhiệm về văn bản pháp lý của trò chơi và nên xem lại.
ins_legal_region_invalid: Hãy chọn khu vực đặt máy chủ hợp lệ.
ins_legal_rules_invalid: Hãy chọn cách quy định sẽ bắt đầu.
