ins_update_check: 'Kiểm tra cập nhật'
ins_update_check_info: 'Bảng điều khiển admin hỏi máy chủ cập nhật (GitHub) về bản phát hành mới nhất.'
ins_discord_url: 'Liên kết mời Discord'
ins_discord_url_info: 'Tùy chọn, ví dụ https://discord.gg/maychucuaban.'
ins_discord_url_invalid: 'Vui lòng nhập liên kết Discord hợp lệ bắt đầu bằng http:// hoặc https://.'
ins_mail_user_valid: 'Yêu cầu kích hoạt qua email'
ins_mail_user_valid_info: 'Tài khoản mới phải xác nhận địa chỉ qua email trước khi chơi. Chỉ khả dụng khi bật email.'
# engagement features (step 5)
ins_group_features: 'Tính năng trò chơi tùy chọn'
ins_features_desc: 'Tất cả đều tắt mặc định. Mỗi tính năng có thể bật, tắt và điều chỉnh sau này trong phần quản trị (cài đặt vũ trụ).'
ins_feat_events: 'Sự kiện vũ trụ'
ins_feat_events_info: 'Các sự kiện theo thời gian bạn lên lịch trong bảng quản trị: bão ion, hội chợ thương mại, cực đại mặt trời, làn sóng cướp biển, cuối tuần tốc độ.'
ins_feat_catchup: 'Tăng tốc đuổi kịp'
ins_feat_catchup_info: 'Tài khoản mới ở xa mức trung bình sẽ nhận thưởng khai thác mỏ, giảm dần trong vài ngày.'
ins_feat_contracts: 'Hợp đồng hàng tuần'
ins_feat_contracts_info: 'Ba mục tiêu luân phiên cho mỗi người chơi mỗi tuần, với phần thưởng trang trí hoặc một ít tài nguyên.'
ins_feat_alliance_goals: 'Mục tiêu liên minh'
ins_feat_alliance_goals_info: 'Trưởng liên minh đặt mục tiêu hàng tuần cho thành viên; hoàn thành sẽ nhận huy hiệu.'
ins_feat_returning: 'Chào mừng trở lại'
ins_feat_returning_info: 'Người chơi quay lại sau thời gian dài nghỉ sẽ thấy những gì đã xảy ra và có thể nhận bảo vệ ngắn hạn.'
ins_feat_seasons: 'Mùa giải'
ins_feat_seasons_info: 'Bảng xếp hạng hàng tháng (kẻ đột kích, chiến binh, người phòng thủ, người thám hiểm, người tái chế) không reset; người thắng nhận huy hiệu.'
ins_feat_cosmetics: 'Huy hiệu và danh hiệu'
ins_feat_cosmetics_info: 'Hiển thị huy hiệu, danh hiệu và màu tên đã đạt được trên thẻ người chơi và trong chat.'
ins_feat_bounties: 'Truy nã'
ins_feat_bounties_info: 'Người chơi đặt tài nguyên lên người chơi khác; ai phá đủ hạm đội của người đó sẽ thu lấy số tài nguyên.'
ins_feat_alliance_wars: 'Điểm chiến tranh liên minh'
ins_feat_alliance_wars_info: 'Bảng điểm trực tiếp cho các cuộc chiến được tuyên bố trong ngoại giao liên minh.'
ins_feat_battle_feed: 'Nguồn tin chiến đấu'
ins_feat_battle_feed_info: 'Các trận đánh lớn được thông báo trên chat toàn cục (cần chat).'
ins_feat_derelicts: 'Khu vực mảnh vỡ'
ins_feat_derelicts_info: 'Khu vực thu hồi xuất hiện trong thiên hà một thời gian; những người tái chế đến đầu tiên sẽ thu gom.'
ins_feat_mothership: 'Mẫu hạm cướp biển'
ins_feat_mothership_info: 'Trùm thế giới hiếm, chỉ đánh bại được trong ACS; chiến lợi phẩm chia theo sát thương.'
ins_feat_expedition_stories: 'Câu chuyện thám hiểm'
ins_feat_expedition_stories_info: 'Tín hiệu hiếm dẫn người chơi qua một nhiệm vụ thám hiểm ngắn với phần thưởng lớn hơn.'
ins_feat_relics: 'Di vật'
ins_feat_relics_info: 'Thám hiểm có thể tìm thấy di vật (từ thường đến sử thi, có thưởng bộ) mà người chơi gắn lên hành tinh để nhận tăng cường nhỏ.'
