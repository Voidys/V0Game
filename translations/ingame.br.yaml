Achievement_text:
  '1': 'Faça 5 ataques seus pousarem entre meia-noite e 6 da manhã na mesma noite sem vencer nenhum.'
  '2': Você manteve frotas em movimento sem parar por 90 dias.
  '3': Você perdeu a sua frota com o idioma configurado como "Francês".
  '4': Pesquise Tecnologia de Íons 10.
  '5': Pesquise Tecnologia de Gravitação 2, só porque você pode.
  '6': Um dos seus ataques voltou com apenas 1 de metal, 1 de cristal e 1 de deutério.
  '7': Derrote uma frota de naves piratas ou alienígenas com pelo menos 10.000 naves no total. O espaço é nosso!
  '8': Apareça no Strammtisch (terças às 20h no Discord).
  '9': Construa a sua primeira Estrela da Morte.
  '10': Destrua a lua de um jogador.
  '11': Jogue 14 dias exclusivamente no celular.
  '12': Sua frota foi destruída por um buraco negro na sua primeira expedição.
  '13': Mande a sua frota embora com menos de 5 segundos antes de um ataque chegar.
  '14': Perca 10 frotas para buracos negros. O vazio está com fome.
  '15': 'Não consiga a sua primeira lua em 10 batalhas com a chance máxima de lua.'
  '16': Mais de 250 dos seus recicladores voltaram vazios.
  '17': Coloque pelo menos 5.000 Lançadores de Mísseis em uma única ordem de construção.
  '18': Queime 5 milhões de deutério como combustível em um único planeta em 24 horas.
  '19': Pesquise Tecnologia de Blindagem 3.
  '20': Pesquise Tecnologia de Blindagem 6.
  '21': Pesquise Tecnologia de Blindagem 9.
  '22': Pesquise Tecnologia de Blindagem 12.
  '23': Pesquise Tecnologia de Blindagem 15.
  '24': Pesquise Tecnologia Laser 12.
  '25': Participe dos Recordes.
  '26': Exclua o planeta que mais lhe dá pontos (pelo menos 100.000 pontos).
  '27': Pesquise Rede Intergaláctica de Pesquisas 1.
  '28': Melhore os três depósitos de uma lua para pelo menos o nível 3.
  '29': Coletivize a frota de um jogador com pontuação maior usando um ACS de 5 jogadores.
  '30': Repila sozinho um ACS de 5 jogadores.
  '31': Mande um jogador para o modo de férias com o seu ataque.
  '32': Saqueie 1.000 planetas usando o tema "SetSail". Arrr!
  '33': Volte do modo de férias.
  '34': Seja atacado pela primeira vez. Bem-vindo ao universo.
  '35': Ataque um jogador ativo que tenha menos de 1/10 dos seus pontos.
  '36': |-
    Receba uma mensagem que contenha um dos seguintes trechos:
                            "Hurensohn", "gleichstarke Ziele", "gegen Schwächere", "ehrenlos"
  '37': Seja aniquilado por um ACS de 5 jogadores.
  '38': Ataque membros da sua própria aliança. Fogo amigo, alguém?
  '39': Ataque alguém com exatamente 42 naves.
  '40': Colonize um planeta a pelo menos meio universo de distância.
  '41': Bloqueie um slot de frota por uma semana com uma oferta ruim no mercado.
  '42': Entre no Battle Hall 4 vezes pelo lado perdedor.
  '43': Vença uma batalha com a sua conta marcada como Inativa, em um dos seus planetas onde antes chegou uma frota com tempo de voo de mais de 7 dias.
  '44': Produz um recurso em um planeta por mais de 7 dias com menos de 100% de energia.
  '45': Vença um ataque contra um jogador que esteja no top 5 de defesa.
  '46': Ative a proteção anti-bash disparando mísseis interplanetários.
  '47': Destrua 5 luas.
  '48': Perca 5 Estrelas da Morte tentando destruir luas. Ai.
  '49': Demole uma colônia logo depois de criá-la.
  '50': Perca todos os seus Satélites Solares em um planeta com energia suficiente para pesquisar Tecnologia de Gravitação, sem ter pesquisado Tecnologia de Gravitação.
  '51': Gaste todo o seu deutério enquanto navega pela visão de Galáxia.
  '52': Construa uma Estrela da Morte sem ter construído antes outras naves de combate (Caça Ligeiro, Caça Pesado, Cruzador, Nave de Batalha, Bombardeiro, Destruidor ou Cruzador de Batalha).
  '53': Tenha o nível mais alto em 5 pesquisas ao mesmo tempo.
  '54': Programe um ataque a um jogador ativo para chegar em 01/01 às 00:00:00.
  '55': Conquista especial
  '56': 'Alcance o nível 15 do motor de hiperespaço.'
  '57': 'Alcance o nível 15 de astrofísica.'
  '58': 'Pesquise toda tecnologia (exceto graviton) pelo menos uma vez.'
  '59': 'Leve toda pesquisa (exceto graviton) ao nível 10.'
  '60': 'Tenha 1.000.000.000 de um único recurso em um planeta ou lua.'
  '61': 'Tenha 1000 satélites solares ao mesmo tempo em um planeta.'
  '62': 'Construa em todos os campos de um planeta com pelo menos 250 campos.'
  '63': 'Leve os armazéns de metal, cristal e deutério ao nível 15 em um planeta.'
  '64': 'Tenha uma mina de metal de nível 30 ou mais em 9 planetas.'
  '65': 'Inicie uma única ordem de construção que leve mais de 30 dias.'
  '66': 'Faça outros jogadores comprarem 50 das suas ofertas do mercado.'
  '67': 'Vença uma defesa contra atacantes que valem pelo menos 10 vezes sua frota e defesa (atacantes de pelo menos 1.000.000 de recursos).'
  '68': 'Vença um ataque que destrua pelo menos 1000 unidades inimigas sem perder nenhuma unidade.'
  '69': 'Termine uma batalha em empate após o número máximo de rodadas, com cada lado perdendo pelo menos 10.000 unidades.'
  '70': 'Seja atacado em um planeta sem naves e sem defesa, de modo que o atacante não saqueie nada.'
  '71': 'Ganhe uma lua em uma batalha que tinha apenas 1 % de chance de lua.'
  '72': 'Destrua pelo menos 100 unidades de defesa com um único ataque de mísseis interplanetários.'
  '73': 'Destrua pelo menos 100 sondas de espionagem inimigas em uma batalha no seu planeta.'
  '74': 'Saqueie 1.000.000.000 de recursos no total.'
  '75': 'Recicle 1.000.000.000 de recursos no total.'
  '76': 'Repare 1000 naves de campos de destroços no total.'
  '77': 'Ganhe 1000 pontos de honra.'
  '78': 'Torne-se um fora da lei pela primeira vez.'
  '79': 'Participe como atacante de 25 ataques de frota combinada vencidos.'
  '80': 'Viva cada possível resultado de expedição pelo menos uma vez.'
  '81': 'Envie 1000 expedições.'
  '82': 'Vença uma batalha de expedição contra uma grande frota alienígena.'
  '83': 'Encontre grandes quantidades de recursos em 50 expedições.'
  '84': 'Envie uma frota em um voo de ida de mais de 24 horas.'
  '85': 'Faça uma frota chegar ao destino em 29 de fevereiro.'
  '86': 'Perca uma frota de ataque inteira em uma sexta-feira 13.'
  '87': 'Faça dois dos seus ataques (sem frota combinada) pousarem no mesmo alvo no mesmo segundo.'
  '88': 'Tenha ao mesmo tempo frotas a caminho de todas as galáxias do universo.'
  '89': 'Conclua o tutorial.'
  '90': 'Tenha ao mesmo tempo pactos ativos com 3 outras alianças (todos os membros da aliança recebem).'
  '91': 'Crie 5 páginas wiki da aliança.'
  '92': 'Tenha 10 pedidos de amizade aceitos.'
  '93': 'Seja o número 1 no ranking de pontos totais por 7 dias seguidos.'
  '94': 'Tenha 100 Estrelas da Morte ao mesmo tempo em um planeta ou lua.'
  '95': 'Ocupe todos os slots de planeta que sua astrofísica permite (pelo menos 9), cada planeta com pelo menos 200 campos.'
  '96': 'Tenha outras 50 conquistas.'
