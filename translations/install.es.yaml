ins_group_features: 'Funciones opcionales del juego'
ins_features_desc: 'Todas desactivadas por defecto. Cada una se puede activar, desactivar y ajustar más tarde en la administración (ajustes del universo).'
ins_feat_events: 'Eventos del universo'
ins_feat_events_info: 'Eventos programados que defines en el panel de administración: tormentas iónicas, ferias comerciales, máximos solares, oleadas piratas, fines de semana de velocidad.'
ins_feat_catchup: 'Impulso de recuperación'
ins_feat_catchup_info: 'Las cuentas nuevas muy por debajo de la media reciben un bonus de minas que se reduce a lo largo de unos días.'
ins_feat_contracts: 'Contratos semanales'
ins_feat_contracts_info: 'Tres objetivos rotativos por jugador y semana, con una recompensa cosmética o un pequeño premio de recursos.'
ins_feat_alliance_goals: 'Objetivos de alianza'
ins_feat_alliance_goals_info: 'El líder de la alianza fija un objetivo semanal para los miembros; al completarlo se obtienen insignias.'
ins_feat_returning: 'Bienvenido de nuevo'
ins_feat_returning_info: 'Los jugadores que vuelven tras una larga pausa ven lo que ha pasado y pueden obtener una breve protección.'
ins_feat_seasons: 'Temporadas'
ins_feat_seasons_info: 'Una clasificación mensual (saqueador, guerrero, defensor, explorador, reciclador) sin ningún reinicio; los ganadores obtienen insignias.'
ins_feat_cosmetics: 'Insignias y títulos'
ins_feat_cosmetics_info: 'Muestra las insignias, títulos y colores de nombre obtenidos en la ficha del jugador y en el chat.'
ins_feat_bounties: 'Recompensas por cabeza'
ins_feat_bounties_info: 'Los jugadores ponen recursos sobre otro jugador; quien destruya suficiente de su flota los recoge.'
ins_feat_alliance_wars: 'Marcador de guerra de alianza'
ins_feat_alliance_wars_info: 'Un marcador en vivo para las guerras declaradas en la diplomacia de la alianza.'
ins_feat_battle_feed: 'Feed de batallas'
ins_feat_battle_feed_info: 'Las batallas grandes se anuncian en el chat global (requiere el chat).'
ins_feat_derelicts: 'Campos de restos'
ins_feat_derelicts_info: 'Los campos de recuperación aparecen en la galaxia durante un tiempo; los primeros recicladores que lleguen los recogen.'
ins_feat_mothership: 'Nave nodriza pirata'
ins_feat_mothership_info: 'Un jefe mundial raro que solo puede derrotarse en un ACS; el botín se reparte según el daño.'
ins_feat_expedition_stories: 'Historias de expedición'
ins_feat_expedition_stories_info: 'Señales raras llevan a un jugador por una breve misión de expedición con una recompensa mayor.'
ins_feat_relics: 'Reliquias'
ins_feat_relics_info: 'Las expediciones pueden encontrar reliquias (de común a épica, con bonus de conjunto) que los jugadores colocan en sus planetas para pequeños impulsos.'
