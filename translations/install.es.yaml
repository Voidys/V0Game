ins_db_help: V0Game guarda todo en una base de datos MySQL o MariaDB. Obtienes los valores siguientes en el panel de tu hosting (busca "Bases de datos" o "MySQL") o de quien configuró tu servidor. Si instalaste MySQL tú mismo, normalmente sirven los valores predeterminados.
ins_db_host: Servidor de base de datos
ins_db_host_info: Casi siempre "localhost". Algunos hostings dan un nombre como "db1.example.com".
ins_db_name_info: El nombre de la base de datos del juego. Créala primero en el panel de tu hosting o deja que el instalador la cree (consulta el recuadro de abajo).
ins_db_advanced: Avanzado (puerto, prefijo de tablas, contraseña de migración) - normalmente no hace falta
ins_db_prefix_info: Se añade delante de cada nombre de tabla. Cámbialo solo si compartes una base de datos con otro software.
ins_db_migrationpw_info: Protege la página de actualización (install/?mode=upgrade) para futuras actualizaciones del juego. Si lo dejas vacío, el instalador genera una contraseña segura y la muestra una vez en la última página.
ins_db_migrationpw_placeholder: generada automáticamente
ins_migrationpw_invalid: La contraseña de migración no puede contener comillas, barras invertidas, $ ni saltos de línea.
ins_err_technical: detalles técnicos
ins_err_access_denied: El servidor de base de datos rechazó el usuario o la contraseña. Comprueba ambos en el panel de tu hosting por si hay errores (importan las mayúsculas y minúsculas).
ins_err_unknown_db: Esta base de datos no existe en el servidor. Comprueba el nombre o marca "Crear la base de datos" abajo.
ins_err_no_privilege: Este usuario de base de datos no tiene permiso para usar esa base de datos. Dale todos los privilegios sobre ella en el panel de tu hosting.
ins_err_no_create: Este usuario no tiene permiso para crear bases de datos. Crea una base de datos vacía en el panel de tu hosting y desmarca "Crear la base de datos".
ins_err_socket: No se encontró el socket del servidor de base de datos. Prueba con el host "127.0.0.1" en lugar de "localhost".
ins_err_unreachable: No se puede acceder al servidor de base de datos "%s". Comprueba el nombre del host y el puerto, y que el servidor de base de datos esté en marcha. Muchos hostings solo permiten conexiones desde sus propios servidores web, por lo que "localhost" suele ser lo correcto.
