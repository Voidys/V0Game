intro_text: V0Game es uno de los mejores clones de OGame. <br> V0Game es la última y más estable versión de un servidor basado en Xnova que ah sido desarrollada. Los puntos clave de V0Game son su facilidad, estabilidad, flexibilidad, dinamismo y calidad. En V0Game siempre esperamos a ser más que sus expectativas. <br> El sistema de instalación le guiará a través de la instalación o la actualización de una versión previa a la última. <br>  Si tiene preguntas o problemas, por favor, no dude en comunicarse en nuestro foro de desarrollo y soporte. <br> V0Game es un proyecto de código abierto y está bajo licencia GNU GPL v3. Para conocer la licencia, por favor haga click en la opción del menú correspondiente. <br> Antes de comenzar la instalación se lleva a cabo una prueba para saber si el servidor cumple los requisitos mínimos.
