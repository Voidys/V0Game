sys_expe_found_goods: 开采到了 %s %s。
sys_expe_found_ress_1_1: 你的远征队发现了一小片小行星群，从中开采到了一些资源。
sys_expe_found_ress_1_2: 在一颗偏远的小行星上，发现了几处容易开采的资源点，并成功提取了原材料。
sys_expe_found_ress_1_3: 你的远征队偶然发现了很久以前一场战斗遗留下来的古老飞船残骸。部分零件被打捞出来并回收利用。
sys_expe_found_ress_1_4: 远征队发现了一颗被辐射污染、大气剧毒的星球。不过扫描显示，这颗星球蕴藏着大量原材料。他们派出自动无人机，尽可能多地提取资源。
sys_expe_found_ress_2_1: 你的远征队发现了一支古老的货船队，货物满载却空无一人。我们获得了一些资源。
sys_expe_found_ress_2_2: 你的远征队在一颗拥有自己大气层的小月球上发现了大量原材料储藏。船员们正在开采这些宝藏。
sys_expe_found_ress_2_3: 我们遇到一小队民用飞船，他们急需食物和药品。作为交换，我们获得了相当可观的有用资源。
sys_expe_found_ress_3_1: 你的远征舰队报告发现了一艘巨大的外星飞船残骸。虽然他们无法利用其中的技术，但飞船可以拆解成单个部件，获得有价值的原材料。
sys_expe_found_ress_3_2: 一颗未知星球周围的小行星带蕴藏着海量原材料。远征舰队把货仓装得满满当当！
sys_expe_found_ress_logbook_1: 大副日志记录：我们把每一寸空间都用上了，但还是带不走发现的所有资源。
sys_expe_found_ress_logbook_2: 大副日志记录：要是再多几艘运输舰就好了！现在我们只能丢下一大堆资源。
sys_expe_found_ress_logbook_3: 大副日志记录：我们已经把不再需要的东西全扔了，可还是腾不出足够的空间来装下发现的所有资源。
sys_expe_found_ress_logbook_4: 大副日志记录：就连把食堂和所有休息室都改成仓库，我们还是运不完发现的所有资源。
sys_expe_found_ships_1_1: 我们发现了一支前辈远征队的残骸！我们的技术人员正在检查能否让其中一些残骸重新运转。
sys_expe_found_ships_1_2: 我们发现了一座废弃的海盗基地。机库里还停着一些旧飞船。我们的技术人员正在检查其中有没有还能用的。
sys_expe_found_ships_1_3: 我们的远征队发现了一颗几乎被战争彻底摧毁的星球。轨道上漂浮着各种飞船残骸。技术人员尝试修复其中一些。也许我们能进一步了解这里发生过什么。
sys_expe_found_ships_1_4: 远征队偶然发现了一座似乎已被遗弃了无数岁月的旧星际基地。要塞的机库里有几艘飞船。技术人员设法让其中一些重新飞了起来。
sys_expe_found_ships_2_1: 我们发现了一支无敌舰队的残骸。远征队的技术人员立刻登上了部分完好的飞船，并成功修复了其中几艘。
sys_expe_found_ships_2_2: 我们的远征队发现了一座古老的自动船厂，有些飞船还停在生产阶段。恢复船厂的能源供应后，我们的技术人员着手完成了它们的建造。
sys_expe_found_ships_3_1: 我们发现了一座巨大的飞船墓地。远征队的几名技术人员成功让一两艘飞船重新投入使用。
sys_expe_found_ships_3_2: 我们发现了一颗留有文明遗迹的星球。从外太空还发现了另一座依然完好的巨型飞船基地。我们的一些技术人员和飞行员已前往地表，查看能否找回其中几艘飞船。
sys_expe_found_ships_logbook_1: 轮机长日志记录：要是多带几艘船来，把这些宝贝带回家就轻而易举了！
sys_expe_found_ships_logbook_2: 轮机长日志记录：很遗憾，我们没有足够的运力把这次任务中发现的所有飞船都带回去。
sys_expe_found_ships_logbook_3: 轮机长日志记录：很遗憾，我们没有足够的运力把发现的所有飞船都带回去。
sys_expe_found_ships_nothing: 没有发现任何飞船。
sys_expe_lost_fleet_1: 远征队留下的只有这条无线电信息：滋滋——天哪！……咔咔滋滋滋，那个滋滋看到咔哩滋滋，是的，从怎么样咔滋滋滋滋滋……
sys_expe_lost_fleet_2: 我们收到的远征队最后的东西，是一张张拍得令人难以置信的黑洞张开的特写。
sys_expe_lost_fleet_3: 一艘指挥舰上的核泄漏引发了连锁反应，在一场壮观的大爆炸中摧毁了整支远征队。
sys_expe_lost_fleet_4: 远征舰队没有从超空间跳跃中返回。我们的科学家仍在苦苦思索究竟发生了什么，但舰队似乎已永远消失了。
sys_expe_nothing_1: 这次远征没有带回什么激动人心的东西，只带回了几只来自某颗未知沼泽星球的奇特小动物。
sys_expe_nothing_2: 你的远征队拍下了超新星的美丽照片。不过，这次远征并没有真正带来新的发现。但它很有希望拿下今年的“宇宙最佳照片”大奖。
sys_expe_nothing_3: 一种奇怪的电脑病毒在离开星系后不久就瘫痪了导航。这导致整支远征舰队一路都在绕圈飞行。不用说，这次远征不太成功。
sys_expe_nothing_4: 一种纯能量生命体让所有远征队员盯着屏幕上的催眠符号看了好几天。等大多数人终于清醒过来时，远征因重氢短缺而不得不取消。
sys_expe_nothing_5: 好吧，至少我们现在知道，5 级红色异常不仅会对飞船系统造成混乱影响，还会引发船员的大规模幻觉。可惜，这次远征没有发现别的东西。
sys_expe_nothing_6: 尽管一开始对这个星区的扫描结果很有希望，但很遗憾，我们空手而归。
sys_expe_nothing_7: 也许不该在这颗偏远的星球上庆祝船长的生日。一场恶性出血热让大部分船员住进了医务室，人手严重短缺导致远征失败。
sys_expe_nothing_8: 你的远征队除了浩瀚空旷的太空，什么也没找到。连一块小小的小行星、辐射、粒子，或者任何能让这次远征稍微有点意思的东西都没有。
sys_expe_nothing_9: 指挥舰上的一次反应堆故障险些毁掉整支远征队。幸运的是，技术人员能力十足，避免了最坏的结果。但修复花了太多时间，远征队最终一无所获地返航了。
sys_expe_report: 远征报告
sys_expe_report_msg: '%s %s 的舰队在 %s 的远征报告：'
sys_expe_time_fast_1: 推进系统能量线圈中一次意外的反馈回路加速了远征队的返航，使其比预期更早抵达。不过初步报告显示，他们没有其他可汇报的内容。
sys_expe_time_fast_2: 有些大胆的新指挥官利用一个不稳定的虫洞缩短了返程——而且成功了！不过，远征本身没有带来新的发现。
sys_expe_time_fast_3: 你的远征队报告称，在探索的星区没有发现任何异常。不过，舰队在返航途中遇上了太阳风，大幅加快了行程。你的远征队将比预期稍早返回。
sys_expe_time_slow_1: 领航员的一次严重失误让舰队彻底落在了错误的地点。返程因此耗时长了许多。
sys_expe_time_slow_2: 由于至今不明的原因，舰队的跳跃完全出了错。他们差点掉进一颗恒星的核心！幸运的是，他们降落在一个已知星系，但返程会比原计划更久。
sys_expe_time_slow_3: 新的导航模块似乎仍然问题不断。远征舰队不仅完全飞错了方向，还耗光了所有重氢！远征队失望地靠备用动力返航。
sys_expe_time_slow_4: 你的远征队进入了粒子风暴增强的星区。这使储能系统过载，导致所有舰船的主系统失灵。你的机械师设法避免了最坏的情况，但远征队现在要大幅延误后才能返回。
sys_expe_time_slow_5: 你的远征舰队旗舰与一艘毫无预警直接跳入舰队的外星飞船相撞。外星飞船爆炸，旗舰受损严重。待最严重的损坏修复完成后，你的舰船将开始返程，因为远征队在目前的状态下无法继续。
sys_expe_time_slow_6: 一颗红巨星的星风扭曲了远征队的跳跃，导致导航系统彻底算错了返程。结果，远征队发现自己身处陌生恒星之间的浩瀚空洞中。
