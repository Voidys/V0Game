sys_expe_depleted_max_1: 通讯官日志记录：如果哪天我们觉得不安全，随时可以和在这里飞来飞去的其他远征队联手。
sys_expe_depleted_max_2: 通讯官日志记录：再这样下去，我们得设置导航浮标来应付这么多的交通了。
sys_expe_depleted_max_3: 通讯官日志记录：与其再派一支远征队，在这里开一家纪念品商店可能更有用。
sys_expe_depleted_med_1: 通讯官日志记录：我们在这一带发现了多支远征舰队的踪迹。我们正在返航。
sys_expe_depleted_med_2: 通讯官日志记录：我们与这个星区的其他几支远征队建立了友好的无线电联系。
sys_expe_depleted_med_3: 通讯官日志记录：我们与同一星区航行的另一支远征舰队的船员一起庆祝了远征结束。他们也没有什么新发现要汇报。
sys_expe_depleted_min_1: 通讯官日志记录：看来人类以前来过银河系的这个角落。
sys_expe_depleted_min_2: 通讯官日志记录：我们发现了旧飞船的残骸。我们不是第一批来到这里的人。
sys_expe_depleted_min_3: 通讯官日志记录：我们差点和另一支远征舰队撞上。我从没想过这里还会有别人。
sys_expe_depleted_not_1: 通讯官日志记录：宇宙的这一角看来还没有被探索过。
sys_expe_depleted_not_2: 通讯官日志记录：成为第一批穿越未探索星区的人，感觉棒极了。
