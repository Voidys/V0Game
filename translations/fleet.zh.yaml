sys_destruc_title: 以下舰队在此交战，企图摧毁月球：
sys_expe_attack_1_1_1: 一名绝望的太空海盗试图劫持我们的远征舰队。
sys_expe_attack_1_1_2: 一群原始野蛮人驾驶飞船攻击了我们。至少他们的飞船破烂不堪。如果他们的火力真的构成威胁，我们就不得不用自己的火力回击了。
sys_expe_attack_1_1_3: 我们截获了几条醉醺醺的海盗发出的无线电。看来我们要被攻击了。
sys_expe_attack_1_1_4: 我们不得不和一些海盗交手，不过幸好我们人多势众。
sys_expe_attack_1_1_5: 舰队报告称，一个名叫莫阿·提卡尔的家伙和他的船员要求我们的舰队无条件投降。如果他们是认真的，就会发现我们完全有能力自卫。
sys_expe_attack_1_2_1: 你的远征舰队意外遭遇了一伙太空海盗。
sys_expe_attack_1_2_2: 我们撞进了星际海盗的埋伏！很遗憾，战斗无法避免。
sys_expe_attack_1_2_3: 另一支远征舰队的求救信号原来是一伙狡猾海盗设下的陷阱。战斗无法避免。
sys_expe_attack_1_3_1: 截获的信号并非来自未知外星人，而是来自一个秘密的海盗基地！海盗们对我们闯入他们的星区很不高兴。
sys_expe_attack_1_3_2: 远征舰队报告与身份不明的海盗船发生了激烈战斗！
sys_expe_attack_1_3_3: 我们刚刚收到远征指挥官的紧急消息：“他们冲过来了！他们从超空间跳出来，好在只是海盗，我们还有机会，开战！”
sys_expe_attack_2_1_1: 你的远征舰队与一个未知物种进行了一次不太友好的初次接触。
sys_expe_attack_2_1_2: 一些奇怪的飞船毫无预警地攻击了远征舰队！
sys_expe_attack_2_1_3: 我们的远征队遭到一小群身份不明的飞船攻击！
sys_expe_attack_2_1_4: 远征舰队报告与未知飞船接触。无线电信息无法破译，但这些奇怪的飞船似乎正在给武器充能。
sys_expe_attack_2_2_1: 一个未知物种正在攻击我们的远征队！
sys_expe_attack_2_2_2: 你的远征舰队显然闯入了一个此前未知、但极具攻击性的外星种族的领地。
sys_expe_attack_2_2_3: 与远征舰队的联系被突然切断。我们最后听到的是舰队正遭受猛烈炮火。攻击者身份不明。
sys_expe_attack_2_3_1: 你的远征队遇上了一支外星入侵舰队，并报告发生了大规模战斗！
sys_expe_attack_2_3_2: 一大群来历不明的晶体状飞船正朝我们的远征舰队直直撞来。我们必须做好最坏的打算。
sys_expe_attack_2_3_3: 我们没能把外星种族的方言发音说准。我们的外交官不小心喊出了“开火！”而不是“和平！”
sys_expe_attackname_1: 海盗
