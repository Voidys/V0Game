Achievement_text:
  '1': 'Landoljon 5 támadásod éjfél és hajnali 6 között ugyanazon az éjszakán úgy, hogy egyiket sem nyered meg.'
  '2': 90 napig megállás nélkül mozgásban voltak a flottáid.
  '3': 'Elvesztetted a flottádat, miközben a nyelved „francia” volt.'
  '4': Kutasd ki az Ionizációs technikát a 10. szintre.
  '5': Kutasd ki a Gravitonkutatást a 2. szintre, csak mert megteheted.
  '6': Az egyik támadásod mindössze 1 fémmel, 1 kristállyal és 1 deutériummal tért vissza.
  '7': 'Győzz le legalább 10 000 hajóból álló kalóz- vagy idegen flottát. Az űr a miénk!'
  '8': Jelenj meg a Stammtischen (keddenként este 8-kor a Discordon).
  '9': Építsd meg az első Halálcsillagodat.
  '10': Pusztítsd el egy játékos Holdját.
  '11': Játssz 14 napig kizárólag mobilon.
  '12': Az első expedíciód során egy fekete lyuk megsemmisítette a flottádat.
  '13': Küldd el a flottádat, amikor 5 másodpercnél kevesebb van hátra egy beérkező támadásig.
  '14': Veszíts el 10 flottát fekete lyukakban. Az űr éhes.
  '15': 'Ne szerezd meg az első Holdadat 10 csatában a maximális Hold esély mellett.'
  '16': Több mint 250 Szemetesed tért vissza üresen.
  '17': Állíts sorba legalább 5000 Rakétakilövőt egyetlen építési megbízásban.
  '18': Égess el 5 millió deutériumot üzemanyagként egyetlen bolygón 24 órán belül.
  '19': Kutasd ki a Páncélozást a 3. szintre.
  '20': Kutasd ki a Páncélozást a 6. szintre.
  '21': Kutasd ki a Páncélozást a 9. szintre.
  '22': Kutasd ki a Páncélozást a 12. szintre.
  '23': Kutasd ki a Páncélozást a 15. szintre.
  '24': Kutasd ki a Lézertechnikát a 12. szintre.
  '25': Jelentkezz be a Rekordokba.
  '26': Töröld a bolygót, amelyik a legtöbb pontot adja neked (legalább 100 000 pont).
  '27': Kutasd ki az Intergalaktikus kutatóhálózatot az 1. szintre.
  '28': Fejleszd egy Holdon mind a három raktárat legalább a 3. szintre.
  '29': Kollektivizáld egy magasabb pontszámú játékos flottáját egy 5 játékos részvételű ACS-sel.
  '30': Verj vissza egyedül egy 5 játékos részvételű ACS-t.
  '31': Küldj egy játékost nyaralás módba a támadásoddal.
  '32': 'Fosztogass 1000 bolygót a „SetSail” témával. Arr!'
  '33': Térj vissza a nyaralás módból.
  '34': Támadjanak meg először. Üdv az univerzumban.
  '35': Támadj meg egy aktív játékost, akinek kevesebb mint a pontjaid 1/10-e van.
  '36': "Kapj egy üzenetet, amely a következő blokkok egyikét tartalmazza:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Töröljön el egy 5 játékos részvételű ACS.
  '38': 'Támadd meg a saját szövetséged tagjait. Baráti tűz, valaki?'
  '39': Támadj meg valakit pontosan 42 hajóval.
  '40': Gyarmatosíts egy bolygót legalább fél univerzumnyira.
  '41': Blokkolj egy flottahelyet egy hétig egy rossz piactéri ajánlattal.
  '42': Kerülj be 4-szer a Csatacsarnokba a vesztes oldalon.
  '43': "Nyerj egy csatát, miközben a fiókod Inaktívként van megjelölve,\r\n            az egyik olyan bolygódon, ahová korábban megérkezett egy flotta, amelynek repülési ideje több mint 7 nap volt."
  '44': 'Termelj egy nyersanyagot egy bolygón több mint 7 napig 100%-nál kisebb energiával.'
  '45': Nyerj egy támadást egy olyan játékos ellen, aki a védelem top 5-jében van.
  '46': Aktiváld a bash-védelmet bolygóközi rakéták kilövésével.
  '47': Pusztíts el 5 holdat.
  '48': Veszíts el 5 Halálcsillagot holdak elpusztítására tett kísérletben. Au.
  '49': Bontsd le a kolóniát röviddel a létrehozása után.
  '50': "Veszítsd el egy bolygón az összes napműholdadat, miközben elég\r\n            energiád van a Gravitonkutatás kutatásához, anélkül hogy kikutattad volna a Gravitonkutatást."
  '51': Használd el az összes deutériumodat a galaxisnézet böngészése közben.
  '52': >-
    Építs Halálcsillagot úgy, hogy előtte nem építettél más harci hajót
    (Könnyű harcos, Nehéz harcos, Cirkáló, Csatahajó, Bombázó, Romboló vagy
    Csatacirkáló).
  '53': Tartsd a csúcsszintet 5 kutatásban egyszerre.
  '54': 'Időzíts egy támadást egy aktív játékosra úgy, hogy 01/01 00:00:00-kor érkezzen.'
  '55': Különleges teljesítmény
  '56': 'Érd el a hipertér-hajtómű 15. szintjét.'
  '57': 'Érd el az asztrofizika 15. szintjét.'
  '58': 'Kutass ki minden technológiát (a graviton kivételével) legalább egyszer.'
  '59': 'Vidd minden kutatást (a graviton kivételével) a 10. szintre.'
  '60': 'Birtokolj 1 000 000 000 egyetlen nyersanyagból egy bolygón vagy holdon.'
  '61': 'Legyen egyszerre 1000 napenergia-műholdad egy bolygón.'
  '62': 'Építs be egy legalább 250 mezős bolygó minden mezőjét.'
  '63': 'Fejleszd a fém-, kristály- és deutériumraktárt 15. szintre egy bolygón.'
  '64': 'Legyen 9 bolygón 30. vagy magasabb szintű fémbányád.'
  '65': 'Indíts egyetlen, 30 napnál tovább tartó építési megbízást.'
  '66': 'Vegyék meg más játékosok 50 piaci ajánlatodat.'
  '67': 'Nyerj védekezést olyan támadók ellen, akik legalább 10-szer annyit érnek, mint a flottád és védelmed (legalább 1 000 000 nyersanyag értékű támadók).'
  '68': 'Nyerj meg egy támadást, amelyben legalább 1000 ellenséges egységet semmisítesz meg, és egyet sem veszítesz.'
  '69': 'Végezz döntetlennel egy csatát a maximális körszám után úgy, hogy mindkét oldal legalább 10 000 egységet veszít.'
  '70': 'Támadjanak meg egy hajók és védelem nélküli bolygódon, így a támadó semmit sem fosztogat.'
  '71': 'Szerezz holdat egy olyan csatából, amelynek csak 1 % esélye volt holdra.'
  '72': 'Semmisíts meg legalább 100 védelmi egységet egyetlen bolygóközi rakétatámadással.'
  '73': 'Semmisíts meg legalább 100 ellenséges kémszondát egy csatában a bolygódon.'
  '74': 'Fosztogass összesen 1 000 000 000 nyersanyagot.'
  '75': 'Hasznosíts újra összesen 1 000 000 000 nyersanyagot.'
  '76': 'Javíts meg összesen 1000 hajót rommezőkből.'
  '77': 'Szerezz 1000 becsületpontot.'
  '78': 'Válj először törvényen kívülivé.'
  '79': 'Vegyél részt támadóként 25 megnyert szövetséges támadásban.'
  '80': 'Éld át az összes lehetséges expedíciós kimenetelt legalább egyszer.'
  '81': 'Indíts 1000 expedíciót.'
  '82': 'Nyerj meg egy expedíciós csatát egy nagy idegen flotta ellen.'
  '83': 'Találj nagy mennyiségű nyersanyagot 50 expedíción.'
  '84': 'Küldj egy flottát több mint 24 órás odaútra.'
  '85': 'Érjen célba egy flottád február 29-én.'
  '86': 'Veszítsd el egy teljes támadó flottádat péntek 13-án.'
  '87': 'Landoljon két támadásod (szövetséges támadás nélkül) ugyanazon a célponton ugyanabban a másodpercben.'
  '88': 'Legyen egyszerre flottád úton az univerzum minden galaxisába.'
  '89': 'Fejezd be a bevezetőt.'
  '90': 'Legyen egyszerre aktív szerződésed 3 másik szövetséggel (a szövetség minden tagja megkapja).'
  '91': 'Hozz létre 5 szövetségi wikioldalt.'
  '92': 'Legyen 10 elfogadott barátkérelmed.'
  '93': 'Légy 7 egymást követő napon az első az összpontszám-ranglistán.'
  '94': 'Legyen egyszerre 100 Halálcsillagod egy bolygón vagy holdon.'
  '95': 'Foglald el minden bolygóhelyet, amit az asztrofizikád megenged (legalább 9), mindegyiket legalább 200 mezős bolygóval.'
  '96': 'Birtokolj 50 másik teljesítményt.'
