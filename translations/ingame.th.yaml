Achievement_text:
  '1': 'ให้การโจมตี 5 ครั้งของคุณถึงเป้าหมายระหว่างเที่ยงคืนถึงตี 6 ในคืนเดียวกัน โดยไม่ชนะสักครั้ง'
  '2': คุณมีกองเรือเคลื่อนที่ไม่หยุดติดต่อกัน 90 วัน
  '3': คุณเสียกองเรือขณะที่ภาษาของคุณตั้งเป็น "ฝรั่งเศส"
  '4': วิจัยเทคโนโลยีไอออนถึงเลเวล 10
  '5': วิจัยกราวิตอนถึงเลเวล 2 เพียงเพราะคุณทำได้
  '6': การโจมตีครั้งหนึ่งของคุณกลับมาพร้อมโลหะ 1 คริสตัล 1 และดิวทีเรียม 1 เท่านั้น
  '7': ปราบกองเรือโจรสลัดหรือเอเลี่ยนรวมอย่างน้อย 10,000 ลำ อวกาศเป็นของเรา!
  '8': มาร่วมงาน Strammtisch (ทุกวันอังคาร 2 ทุ่มบน Discord)
  '9': สร้างดาวมรณะลำแรกของคุณ
  '10': ทำลายดวงจันทร์ของผู้เล่นคนหนึ่ง
  '11': เล่นบนมือถืออย่างเดียว 14 วัน
  '12': กองเรือของคุณถูกหลุมดำทำลายในการสำรวจครั้งแรก
  '13': ส่งกองเรือหนีโดยเหลือเวลาไม่ถึง 5 วินาทีก่อนการโจมตีที่กำลังมาถึงจะลงมือ
  '14': เสียกองเรือให้หลุมดำ 10 กอง ความว่างเปล่าหิวโหย
  '15': 'ไม่ได้ดวงจันทร์ดวงแรกใน 10 การรบที่มีโอกาสเกิดดวงจันทร์สูงสุด'
  '16': ยานรีไซเคิลของคุณกลับมามือเปล่ามากกว่า 250 ลำ
  '17': เข้าคิวเครื่องยิงจรวดอย่างน้อย 5000 เครื่องในคำสั่งสร้างเดียว
  '18': เผาดิวทีเรียม 5 ล้านเป็นเชื้อเพลิงบนดาวเคราะห์ดวงเดียวภายใน 24 ชั่วโมง
  '19': วิจัยเทคโนโลยีเกราะถึงเลเวล 3
  '20': วิจัยเทคโนโลยีเกราะถึงเลเวล 6
  '21': วิจัยเทคโนโลยีเกราะถึงเลเวล 9
  '22': วิจัยเทคโนโลยีเกราะถึงเลเวล 12
  '23': วิจัยเทคโนโลยีเกราะถึงเลเวล 15
  '24': วิจัยเทคโนโลยีเลเซอร์ถึงเลเวล 12
  '25': เข้าร่วมระบบบันทึกสถิติ (Records)
  '26': ลบดาวเคราะห์ที่ให้คะแนนคุณมากที่สุด (อย่างน้อย 100,000 คะแนน)
  '27': วิจัยเครือข่ายวิจัยข้ามกาแล็กซีถึงเลเวล 1
  '28': อัปเกรดคลังทั้งสามแห่งบนดวงจันทร์ให้ถึงเลเวล 3 ขึ้นไป
  '29': รวบกองเรือของผู้เล่นที่คะแนนสูงกว่าด้วย ACS 5 ผู้เล่น
  '30': ต้านทาน ACS 5 ผู้เล่นด้วยตัวคนเดียว
  '31': ส่งผู้เล่นเข้าโหมดพักร้อนด้วยการโจมตีของคุณ
  '32': ปล้นดาวเคราะห์ 1000 ดวงขณะใช้ธีม "SetSail" อาร์!
  '33': กลับมาจากโหมดพักร้อน
  '34': ถูกโจมตีเป็นครั้งแรก ยินดีต้อนรับสู่จักรวาล
  '35': โจมตีผู้เล่นที่ยังใช้งานอยู่ซึ่งมีคะแนนน้อยกว่า 1/10 ของคุณ
  '36': 'ได้รับข้อความที่มีคำใดคำหนึ่งต่อไปนี้:

    "Hurensohn", "gleichstarke Ziele", "gegen Schwächere", "ehrenlos"'
  '37': ถูก ACS 5 ผู้เล่นกวาดล้าง
  '38': โจมตีสมาชิกพันธมิตรของคุณเอง ยิงพวกเดียวกันใครเอาบ้าง?
  '39': โจมตีใครสักคนด้วยยานจำนวน 42 ลำพอดี
  '40': ตั้งอาณานิคมบนดาวเคราะห์ที่อยู่ไกลอย่างน้อยครึ่งจักรวาล
  '41': บล็อกช่องกองเรือหนึ่งสัปดาห์ด้วยข้อเสนอตลาดที่แย่
  '42': เข้าหอรบ 4 ครั้งในฝ่ายที่แพ้
  '43': 'ชนะการรบขณะที่บัญชีของคุณถูกตั้งเป็นไม่ใช้งาน

    บนดาวเคราะห์ของคุณที่เคยมีกองเรือมาถึงซึ่งมีเวลาบินมากกว่า 7 วัน'
  '44': ผลิตทรัพยากรบนดาวเคราะห์เกิน 7 วันขณะที่พลังงานต่ำกว่า 100%
  '45': ชนะการโจมตีผู้เล่นที่อยู่ใน 5 อันดับแรกด้านการป้องกัน
  '46': ทริกเกอร์การป้องกันการรุม (bash protection) ด้วยการยิงขีปนาวุธข้ามดาว
  '47': ทำลายดวงจันทร์ 5 ดวง
  '48': เสียดาวมรณะ 5 ลำขณะพยายามทำลายดวงจันทร์ โอ๊ย
  '49': รื้ออาณานิคมหลังสร้างได้ไม่นาน
  '50': 'เสียดาวเทียมสุริยะทั้งหมดบนดาวเคราะห์ที่มีพลังงานพอจะวิจัยกราวิตอน

    โดยที่ยังไม่ได้วิจัยกราวิตอน'
  '51': ใช้ดิวทีเรียมหมดขณะส่องหน้ากาแล็กซี
  '52': สร้างดาวมรณะโดยไม่เคยสร้างยานรบอื่นมาก่อน (ยานขับไล่เบา ยานขับไล่หนัก เรือลาดตระเวน เรือรบ ยานทิ้งระเบิด เรือพิฆาต หรือเรือลาดตระเวนรบ)
  '53': ครองเลเวลสูงสุดใน 5 งานวิจัยพร้อมกัน
  '54': จับเวลาการโจมตีผู้เล่นที่ยังใช้งานอยู่ให้ลงมือตอน 01/01 00:00:00
  '55': ความสำเร็จพิเศษ
