Achievement_text:
  '1': 'Laat 5 aanvallen van jou in één nacht tussen middernacht en 6 uur ''s ochtends landen zonder er één te winnen.'
  '2': Je had 90 dagen lang non-stop vloten onderweg.
  '3': Je verloor je vloot terwijl je taal op "Frans" stond.
  '4': Onderzoek Iontechniek 10.
  '5': Onderzoek Gravitononderzoek 2, gewoon omdat het kan.
  '6': Een van je aanvallen kwam terug met slechts 1 metaal, 1 kristal en 1 deuterium.
  '7': Versla een vloot piraten- of alienschepen van minstens 10.000 schepen. De ruimte is van ons!
  '8': Kom naar de Strammtisch (dinsdag om 20:00 uur op Discord).
  '9': Bouw je eerste Ster des Doods.
  '10': Vernietig de maan van een speler.
  '11': Speel 14 dagen uitsluitend op mobiel.
  '12': Je vloot werd tijdens je eerste expeditie door een zwart gat vernietigd.
  '13': Stuur je vloot weg met minder dan 5 seconden voordat een binnenkomende aanval aankomt.
  '14': Verlies 10 vloten aan zwarte gaten. De leegte heeft honger.
  '15': 'Krijg je eerste maan niet in 10 gevechten met de maximale maankans.'
  '16': Meer dan 250 van je recyclers kwamen leeg terug.
  '17': Zet minstens 5000 raketwerpers in één bouwopdracht in de wachtrij.
  '18': Verstook 5 miljoen deuterium als brandstof op één planeet binnen 24 uur.
  '19': Onderzoek Pantsertechniek 3.
  '20': Onderzoek Pantsertechniek 6.
  '21': Onderzoek Pantsertechniek 9.
  '22': Onderzoek Pantsertechniek 12.
  '23': Onderzoek Pantsertechniek 15.
  '24': Onderzoek Lasertechniek 12.
  '25': Doe mee aan de Records.
  '26': Verwijder de planeet die je de meeste punten oplevert (minstens 100.000 punten).
  '27': Onderzoek Intergalactisch onderzoeksnetwerk 1.
  '28': Upgrade alle drie de opslagen op een maan naar minstens niveau 3.
  '29': Collectiviseer de vloot van een speler met een hogere score met een ACS van 5 spelers.
  '30': Sla in je eentje een ACS van 5 spelers af.
  '31': Stuur een speler met je aanval in vakantiemodus.
  '32': Raid 1000 planeten met het thema "SetSail". Arr!
  '33': Kom terug uit de vakantiemodus.
  '34': Word voor het eerst aangevallen. Welkom in het universum.
  '35': Val een actieve speler aan die minder dan 1/10 van jouw punten heeft.
  '36': "Ontvang een bericht dat een van de volgende blokken bevat:\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Word weggevaagd door een ACS van 5 spelers.
  '38': Val leden van je eigen alliantie aan. Friendly fire, iemand?
  '39': Val iemand aan met precies 42 schepen.
  '40': Koloniseer een planeet minstens een half universum verderop.
  '41': Blokkeer een week lang een vlootslot met een slecht marktaanbod.
  '42': Sluit je 4 keer aan bij de Gevechtshal aan de verliezende kant.
  '43': "Win een gevecht terwijl je account als inactief staat gemarkeerd,\n            op een van je planeten waar eerder een vloot is aangekomen met een vliegtijd van meer dan 7 dagen."
  '44': Produceer meer dan 7 dagen lang een grondstof op een planeet terwijl je energie onder de 100% zit.
  '45': Win een aanval tegen een speler die in de top 5 voor verdediging staat.
  '46': Activeer bashbescherming door interplanetaire raketten af te vuren.
  '47': Vernietig 5 manen.
  '48': Verlies 5 Sterren des Doods bij pogingen manen te vernietigen. Au.
  '49': Sloop een kolonie kort na het aanmaken.
  '50': "Verlies al je zonne-energiesatellieten op een planeet met genoeg\n            energie om Gravitononderzoek te doen, zonder Gravitononderzoek te hebben onderzocht."
  '51': Gebruik al je deuterium op tijdens het browsen in het melkwegoverzicht.
  '52': Bouw een Ster des Doods zonder eerst andere gevechtsschepen te hebben gebouwd (licht gevechtsschip, zwaar gevechtsschip, kruiser, slagschip, bommenwerper, vernietiger of slagkruiser).
  '53': Houd tegelijk het hoogste niveau in 5 onderzoeken.
  '54': Time een aanval op een actieve speler zo dat hij op 01/01 00:00:00 aankomt.
  '55': Speciale prestatie
  '56': 'Bereik hyperruimteaandrijving niveau 15.'
  '57': 'Bereik astrofysica niveau 15.'
  '58': 'Onderzoek elke technologie (behalve graviton) minstens één keer.'
  '59': 'Breng elk onderzoek (behalve graviton) naar niveau 10.'
  '60': 'Bezit 1.000.000.000 van één grondstof op één planeet of maan.'
  '61': 'Heb 1000 zonne-energiesatellieten tegelijk op één planeet.'
  '62': 'Bebouw elk veld van een planeet met minstens 250 velden.'
  '63': 'Breng de metaal-, kristal- en deuteriumopslag naar niveau 15 op één planeet.'
  '64': 'Heb op 9 planeten een metaalmijn van niveau 30 of hoger.'
  '65': 'Start één bouwopdracht die langer dan 30 dagen duurt.'
  '66': 'Laat 50 van je marktaanbiedingen door andere spelers kopen.'
  '67': 'Win een verdediging tegen aanvallers die minstens 10 keer je vloot en verdediging waard zijn (aanvallers van minstens 1.000.000 grondstoffen).'
  '68': 'Win een aanval waarbij minstens 1000 vijandelijke eenheden worden vernietigd zonder zelf één eenheid te verliezen.'
  '69': 'Speel gelijk na het maximale aantal rondes, waarbij elke kant minstens 10.000 eenheden verliest.'
  '70': 'Word aangevallen op een planeet zonder schepen en verdediging, zodat de aanvaller niets buit maakt.'
  '71': 'Krijg een maan uit een gevecht met slechts 1 % maankans.'
  '72': 'Vernietig met één interplanetaire raketaanval minstens 100 verdedigingseenheden.'
  '73': 'Vernietig in één gevecht op je planeet minstens 100 vijandelijke spionagesondes.'
  '74': 'Buit in totaal 1.000.000.000 grondstoffen.'
  '75': 'Recycle in totaal 1.000.000.000 grondstoffen.'
  '76': 'Repareer in totaal 1000 schepen uit puinvelden.'
  '77': 'Verdien 1000 eerepunten.'
  '78': 'Word voor het eerst een vogelvrije.'
  '79': 'Neem als aanvaller deel aan 25 gewonnen gezamenlijke aanvallen.'
  '80': 'Beleef elke mogelijke expeditie-uitkomst minstens één keer.'
  '81': 'Stuur 1000 expedities.'
  '82': 'Win een expeditiegevecht tegen een grote alienvloot.'
  '83': 'Vind bij 50 expedities grote hoeveelheden grondstoffen.'
  '84': 'Stuur een vloot op een enkele reis van meer dan 24 uur.'
  '85': 'Laat een vloot op 29 februari zijn doel bereiken.'
  '86': 'Verlies op een vrijdag de 13e een complete aanvalsvloot.'
  '87': 'Laat twee van je aanvallen (zonder gezamenlijke aanval) in dezelfde seconde op hetzelfde doel landen.'
  '88': 'Heb tegelijkertijd vloten onderweg naar elke galaxy van het universum.'
  '89': 'Voltooi de tutorial.'
  '90': 'Heb tegelijkertijd actieve verdragen met 3 andere allianties (alle alliantieleden krijgen het).'
  '91': 'Maak 5 wikipagina''s van je alliantie.'
  '92': 'Heb 10 geaccepteerde vriendschapsverzoeken.'
  '93': 'Sta 7 dagen achter elkaar op nummer 1 van de totaalranglijst.'
  '94': 'Heb tegelijkertijd 100 Death Stars op één planeet of maan.'
  '95': 'Bezet elk planeetslot dat je astrofysica toestaat (minstens 9), elke planeet met minstens 200 velden.'
  '96': 'Bezit 50 andere prestaties.'
