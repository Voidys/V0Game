abuse_granted: Accordée
abuse_opponents: Adversaires
abuse_loot: Butin de l'adversaire
abuse_report: Rapport
abuse_recalls: Rappels à l'arrivée ou après
abuse_recalls_info: Flottes d'attaque, ACS et destruction rappelées alors que l'heure d'arrivée était déjà atteinte (schéma de rappel après arrivée).
abuse_mission: Mission
abuse_arrival: Arrivée
abuse_recalled: Rappelée
abuse_late: Après l'arrivée
abuse_fought: combattu
abuse_mission_1: Attaque
abuse_mission_2: Attaque ACS
abuse_mission_9: Destruction
abuse_missiles_skipped: 'Les lancements de missiles par rapport au contenu des silos ne font pas partie de ce rapport : les tables ne contiennent pas d''historique des silos pour comparer.'
abuse_link_device: même appareil
abuse_graph: Groupes de flux de valeur
abuse_graph_info: 'Joueurs liés par des flux de valeur sur les %s derniers jours (fenêtre fixe) : transports, stationnements, transferts de vaisseaux (au coût de construction), échanges sur le marché (les deux sens) et butin d''attaques, additionnés dans les deux directions. Seules les paires ayant déplacé au moins %s unités de métal et %s flux sont reliées ; les groupes connectés d''au moins deux joueurs sont listés (top %s par valeur). Net = valeur de la paire la plus unilatérale du groupe (part de sa valeur totale). Les indicateurs de lien montrent si des membres partagent une IP, un appareil ou un groupe multi avec un autre membre. Les lignes sont lues avec une limite par source.'
