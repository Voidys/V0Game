se_bash_war_exempt: Les guerres lèvent la limite bash
se_bash_war_exempt_info: 'Les attaques entre alliances en guerre (acceptées, de plus d''un jour) ne comptent pas pour les limites bash. Désactivé : les attaques de guerre comptent comme les autres.'
se_honor_pair_cap: Combats honorables par paire (24 h)
se_honor_pair_cap_info: Nombre de combats honorables entre les deux mêmes joueurs (dans un sens ou dans l'autre) qui rapportent de l'honneur sur 24 heures. Les combats suivants comptent comme neutres. 0 = illimité.
se_market_push_tolerance: Tolérance de pression sur le marché
se_market_push_tolerance_info: 'Écart de valeur accepté pour un échange sur le marché, en pourcentage (0 à 90), avant qu''il soit compté comme une pression. Par défaut : 30.'
se_transport_push_check: Garde anti-pression par transport
se_transport_push_check_info: Refuse les transports, stationnements et transferts (ressources et vaisseaux) vers un autre joueur lorsque, sur les 7 derniers jours, la valeur envoyée à ce joueur dépasse de plus de la limite ci-dessous la valeur qu'il a renvoyée.
se_transport_push_limit: Limite de pression par transport
se_transport_push_limit_info: Valeur de la cargaison en unités de deutérium (ratios du marché) au-delà de laquelle la garde s'applique. 0 = garde désactivée.
se_depot_cost_real_consumption: Coût du dépôt selon la consommation réelle
se_depot_cost_real_consumption_info: Le dépôt d'alliance facture la consommation réelle de carburant de la flotte (avec les technologies de propulsion et de carburant du propriétaire) / 10 par heure, au lieu de la consommation de base / 10.
se_hours: Heures
se_remember_me_days: '«Rester connecté» dure'
se_remember_me_days_info: 'Jours pendant lesquels une connexion avec la case «Rester connecté» cochée survit aux redémarrages du navigateur et aux sessions expirées. Un changement de mot de passe y met fin. 0 désactive l’option.'
se_session_lifetime: La session expire après une inactivité de
se_session_lifetime_info: 'Heures sans aucune requête au-delà desquelles un joueur est déconnecté («session expirée»).'
