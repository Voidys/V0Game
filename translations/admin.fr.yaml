se_social_info: "Permet aux joueurs de se connecter ou de s'inscrire avec un compte Discord, Facebook, GitHub ou Google existant (OAuth2). Tous les fournisseurs sont désactivés par défaut. Crée une application chez le fournisseur, enregistres-y l'URL de callback affichée ci-dessous et saisis ici l'ID client et le secret."
