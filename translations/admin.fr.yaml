se_pow_sensitivity_info: Pourcentage des seuils par défaut (accru à partir de 5 requêtes/10 min, 3 échecs/heure ou 2 inscriptions/24 h par IP ; élevé à partir de 20 / 10 / 5 ; pour les réseaux, trois fois plus). 200 = deux fois plus d'événements nécessaires, 50 = moitié moins.
se_pow_max_number: Protection anti-bots - difficulté (nombre maximum)
se_pow_max_number_info: Le navigateur essaie des hachages jusqu'à ce nombre, la moitié en moyenne. 100000 prend environ une demi-seconde à une seconde. Plus la valeur est élevée, plus le travail demandé aux bots est important.
