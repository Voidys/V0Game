se_rebuild_protection: Reconstruire la protection
se_rebuild_protection_info: En cas de pertes importantes, les joueurs bénéficient d'une protection de reconstruction contre d'autres attaques après 6 heures et pendant 48 heures après l'attaque. 70 % de la flotte ou 80 % de la capacité de transport doivent être détruits en une seule attaque. En outre, cela doit correspondre au moins aux points de protection Noop * 1000 en unités ou en capacité. L'utilisateur peut mettre fin au mode prématurément.
