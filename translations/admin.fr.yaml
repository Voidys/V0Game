se_community_links: Liens communautaires
se_discord_url: URL d'invitation Discord
se_discord_url_info: Lien d'invitation de votre serveur Discord (https://...). Affiché dans le menu, la page de connexion, les e-mails et les textes. Vide = masqué.
se_discord_widget_guild: ID du serveur Discord (widget en ligne)
se_discord_widget_guild_info: 'ID de ton serveur Discord (17 à 20 chiffres ; dans Paramètres du serveur → Widget, « Activer le widget du serveur » doit être activé). Affiche un encadré avec le nombre de connectés sur la page d''accueil, actualisé toutes les 5 minutes. Vide : masqué.'
se_wiki_url: URL du wiki
se_wiki_url_info: URL de base d'un wiki externe, sans barre oblique finale (https://...). Les liens wiki de la FAQ, du tutoriel et des règles en sont déduits. Vide = masqués.
se_donate_url: URL de don
se_donate_url_info: Lien pour les dons (https://...), affiché dans le menu. Vide = masqué.
se_userscripts_url: URL des userscripts
se_userscripts_url_info: Page présentant des userscripts pour votre jeu (https://...), liée dans les paramètres. Vide = masqué.
se_bots_alliances_enabled: Les bots forment des alliances
se_bots_alliances_enabled_info: 'Les bots fondent leurs propres alliances et en rejoignent parfois d''autres. Désactivé : les bots restent des loups solitaires, ne postulent nulle part et quittent les alliances dont ils sont membres (les alliances fondées par un bot restent).'
se_bots_join_human_alliances: Les bots peuvent rejoindre les alliances de joueurs
se_bots_join_human_alliances_info: 'Les bots peuvent aussi postuler dans les alliances fondées par des joueurs humains. Désactivé : les bots ne rejoignent que des alliances fondées par des bots et quittent les alliances de joueurs.'
se_bot_reply_delay_hours: Délai de réponse (heures)
se_bot_reply_delay_hours_info: Nombre d'heures pendant lesquelles le plus ancien message privé sans réponse d'un joueur attend avant qu'un bot réponde à tous les messages en attente de ce joueur dans une seule réponse. C'est aussi l'écart minimum entre deux messages initiés par les bots (réactions à une attaque, provocations lors d'un pillage) envoyés au même joueur. 0 = pas de délai.
se_bot_chatter: Les bots discutent
se_bot_chatter_info: 'Activé : les bots répondent aux messages privés. Désactivé : les messages sont toujours lus et comptés, mais seules les réactions de combat (après avoir été attaqué ou pillé par un joueur qui leur avait écrit) sont envoyées. Les bots n''écrivent jamais en premier aux joueurs.'
