abuse_top_edge: Paire la plus unilatérale
abuse_activity: Activité de lancement de flottes (24 h)
abuse_activity_info: Comptes ayant le plus de lancements de flottes sur les 24 dernières heures ; pic = lancements pendant l'heure la plus chargée. Des pics élevés et constants peuvent indiquer un jeu scripté.
