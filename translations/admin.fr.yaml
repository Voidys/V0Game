abuse_link_ip: même IP
abuse_link_multi: groupe multi
abuse_link_multi_known: groupe multi (connu)
abuse_link_subnet: même sous-réseau (plus faible)
abuse_thresholds: 'Seuils : une paire de transferts apparaît lorsqu''un sens dépasse %s unités de métal et qu''au plus %s reviennent ; les paires de marché sont listées à partir de %s échanges, signalées au-delà d''un écart de %s. Aucune ligne signifie que rien n''a atteint ces seuils (ou que les journaux sont vides), pas qu''il ne s''est rien passé.'
abuse_transfers: Transports et stationnements à sens unique
abuse_transfers_info: Transports, stationnements et transferts de vaisseaux (non rappelés ; vaisseaux comptés au coût de construction) entre deux joueurs dont la cargaison valait au moins %s unités de métal dans un sens, alors qu'au plus %s de cette valeur est revenue. Trié par valeur nette ; les poids sont les ratios de marché enregistrés.
abuse_trades: Échanges répétés sur le marché
abuse_trades_info: Échanges de ressources entre les deux mêmes joueurs, au moins %s fois. Ratio = valeur donnée par le camp qui a le plus donné, divisée par celle de l'autre camp (1,00 = référence du marché) ; au-delà d'un écart de %s, la paire est signalée.
abuse_giver: A le plus donné
abuse_receiver: A le plus reçu
abuse_ratio: Ratio
abuse_outlier: aberrant
abuse_protections: Protections de reconstruction accordées
abuse_protections_info: Joueurs ayant reçu une protection de reconstruction sur la période. Les adversaires sont l'autre partie du rapport de combat de cet affrontement ; le butin est la valeur que leurs flottes y ont gagnée (les débris et la valeur détruite ne sont pas enregistrés).
