tutorial_rewards_header: 'Récompenses :'
tutorial_text:
  step0: "Bienvenue sur {game_name} !<br><br>\r\nCe court tutoriel te présente les\
    \ bases du jeu.<br>\r\nOn renvoie souvent vers notre wiki, car tout ne tient pas\
    \ dans un tutoriel. Tu peux l’ouvrir à tout moment depuis le menu de gauche.<br>\r\
    \nTu peux sauter le tutoriel quand tu veux, mais tu ne pourras pas le relancer\
    \ ensuite.<br><br>\r\nBonne chance, Empereur !"
  step1: "Ton objectif : marquer un maximum de points. Tu gagnes un point pour chaque\
    \ tranche de 1 000 ressources dépensées, et la meilleure source de ressources,\
    \ ce sont tes propres mines.<br>\r\nCommence par ton approvisionnement de base :\
    \ il te faut du métal et du cristal, produits par leurs mines, ainsi que de l’énergie\
    \ fournie par la centrale solaire pour les faire tourner. Si l’énergie vient à\
    \ manquer, tes mines produisent à moins de 100 %.<br>\r\nAméliore ces bâtiments\
    \ dans le menu <b>Bâtiments</b>. Clique sur le nom d’un bâtiment pour voir ce\
    \ que t’apportera le niveau suivant et combien d’énergie il consommera.<br><br>\r\
    \nEnvie d’en savoir plus ? Jette un œil au <b>wiki</b> : \r\n<a href=\"{wiki_url}/wiki/En/Rohstoffe\"\
    \ target=\"_blank\">Ressources</a>"
  step2: "Jouer à plusieurs, c’est bien plus fun. La plupart des joueurs se retrouvent\
    \ sur notre Discord, où tu peux obtenir des réponses et trouver des gens avec\
    \ qui jouer.<br>\r\nToujours bloqué ? Tu peux aussi ouvrir un ticket de support\
    \ ici."
  step3: "Piller les planètes des autres joueurs est une autre façon d’obtenir des\
    \ ressources, et ça peut aussi t’arriver. Construis donc ta première défense !<br>\r\
    \nMême une petite défense protège ta production pendant la nuit.<br><br>\r\nLe\
    \ nombre ne fait pas tout : la composition de la flotte attaquante compte aussi.<br>\r\
    \nLes attaquants doivent franchir ta défense avant de piller, et chaque vaisseau\
    \ qu’ils doivent envoyer réduit leur profit et peut leur coûter d’autres vaisseaux.<br>\r\
    \nLes défenses se construisent dans le <b>Chantier spatial</b>, onglet <b>Défense</b>. Il te faut un chantier\
    \ spatial (qui exige lui-même une usine de robots) et un peu de deutérium.<br><br>\r\
    \nVoici l’article correspondant du wiki : \r\n<a href=\"{wiki_url}/wiki/En/Verteidigung\"\
    \ target=\"_blank\">Installations de défense</a>"
  step4: "Garde tes ressources en flux continu en développant tes mines !<br>\r\n\
    Les bâtiments, vaisseaux, défenses et recherches coûtent de plus en plus cher :\
    \ ta production doit donc grandir avec eux. Ouvre dès maintenant Bâtiments et\
    \ améliore tes mines dès que tu as les ressources."
  step5: "Construis-toi un petit transporteur !<br>\r\nLes petits transporteurs sont\
    \ des vaisseaux de transport rapides et pratiques.<br>\r\nAvec le réacteur à impulsion,\
    \ ils sont plus rapides que les grands transporteurs sur les longues distances.<br>\r\
    \nUtilise-les pour déplacer des ressources entre tes planètes, commercer avec\
    \ d’autres joueurs ou les piller.<br><br>\r\nPlus d’infos dans le wiki : \r\n\
    <a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Vaisseaux</a>"
  step6: "Donne un nom à ta planète pour t’y retrouver. Dans la vue d’ensemble, clique\
    \ sur le nom de la planète dans l’en-tête de l’affichage des points. Vas-y, essaie\
    \ maintenant.<br><br>\r\nTu peux aussi envoyer des demandes d’ami à d’autres joueurs.\
    \ Une fois acceptées, vous pouvez discuter plus facilement et voir votre statut\
    \ en ligne mutuel. Pas besoin d’être dans la même alliance pour ça. Les amis peuvent\
    \ aussi stationner leurs flottes sur les planètes les uns des autres : vous pouvez\
    \ ainsi vous défendre ensemble sans alliance.<br><br>\r\nOu rejoins une alliance\
    \ et joue en équipe. Plus besoin de demandes d’ami séparées pour stationner des\
    \ flottes. Au sein de l’alliance, tu peux envoyer des messages globaux et voir\
    \ le statut en ligne et les points des autres membres, selon ton rang dans l’alliance."
  step7: "Pour savoir quelles ressources, quels bâtiments, recherches, vaisseaux et\
    \ défenses un autre joueur possède, tu dois l’espionner. Envoie-lui une sonde\
    \ d’espionnage depuis le menu Flotte ou la vue Galaxie.<br>\r\nGarde en tête que\
    \ les autres joueurs peuvent aussi t’espionner !"
  step8: "Une expédition peut rapporter des ressources, des vaisseaux, des événements\
    \ spéciaux ou des pertes. Pour en tenter une, prends un vaisseau, choisis la position\
    \ de planète 16 comme destination et la mission « Expédition » dans le menu Flotte.<br>\r\
    \nChaque type de vaisseau augmente la taille de ta flotte d’expédition, jusqu’à\
    \ la limite où la taille maximale de l’événement est atteinte.<br><br>\r\nLe wiki\
    \ explique comment maximiser tes gains : \r\n<a href=\"{wiki_url}/wiki/En/Expoanleitung\"\
    \ target=\"_blank\">Expéditions</a>"
  step9: "Plus tu colonises de planètes, plus tu progresses vite : tu peux produire\
    \ des ressources et construire des vaisseaux sur plusieurs planètes à la fois.\
    \ Attention, tu ne peux coloniser le bord intérieur ou extérieur d’un système\
    \ que si ton niveau d’astrophysique est assez élevé. Le vaisseau de colonisation\
    \ peut être construit sans astrophysique, mais ta première colonie l’exige !<br><br>\r\
    \nColoniser dans ton propre système ou juste à côté raccourcit les trajets de\
    \ transport. Revers de la médaille : plus tard dans la partie, des joueurs peuvent\
    \ s’installer dans ton système non pour ses mines, mais comme base de flotte temporaire,\
    \ ce qu’on appelle une colonie de raid.<br><br>\r\nPlus d’infos dans le wiki :\
    \ \r\n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Astrophysique</a>"
  step10: "Envie de ressources plus vite ? Attaque d’autres joueurs. Mets le coût\
    \ en balance avec le bénéfice pour que ton attaque soit rentable, et prépare-la\
    \ avec les rapports d’espionnage et le simulateur de combat.<br><br>\r\nAttention !\
    \ Les autres joueurs peuvent suivre de nombreuses missions de flotte de différentes\
    \ façons.<br>\r\nNe pas perdre la flotte que tu as durement gagnée est l’un des\
    \ aspects les plus importants du jeu.<br><br>\r\nLis donc ces articles du wiki :\
    \ \r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\"\
    \ target=\"_blank\">Fleetsave</a> - \r\n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\"\
    \ target=\"_blank\">Phalange de capteurs</a>"
  step10_u6: "Envie de ressources plus vite ? Attaque d’autres joueurs. Mets le coût\
    \ en balance avec le bénéfice pour que ton attaque soit rentable, et prépare-la\
    \ avec les rapports d’espionnage et le simulateur de combat.<br><br>\r\nAttention !\
    \ Les autres joueurs peuvent suivre de nombreuses missions de flotte de différentes\
    \ façons.<br>\r\nNe pas perdre la flotte que tu as durement gagnée est l’un des\
    \ aspects les plus importants du jeu.<br><br>\r\nLis donc ces articles du wiki :\r\
    \n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"\
    _blank\">Fleetsave</a>"
  step11: "Quand des flottes sont détruites, elles laissent un champ de débris que\
    \ tu peux récolter. Il te faut pour cela des recycleurs, d’une capacité de 20\
    \ 000 chacun. Anéantir une grande flotte peut être une source de ressources très\
    \ lucrative.<br><br>\r\nTu peux aussi envoyer des recycleurs directement depuis\
    \ la vue Galaxie en cliquant sur un champ de débris, sans passer par le menu Flotte."
  step12: "Félicitations, tu as terminé le tutoriel !<br><br>\r\nLe jeu a encore bien\
    \ d’autres choses à offrir.<br>\r\nIl existe par exemple trois styles de jeu,\
    \ qui demandent aussi plus ou moins de temps :<br>\r\n<ul>\r\n<li>Mineur : développe\
    \ ses mines sur de nombreuses colonies et vole surtout avec des transporteurs</li>\r\
    \n<li>Fleeter : investit l’essentiel de ses points dans des vaisseaux de combat,\
    \ produit très peu lui-même et vit des raids sur d’autres joueurs</li>\r\n<li>Mixte :\
    \ un mélange des deux</li>\r\n</ul>\r\nLes lunes deviennent importantes plus tard\
    \ dans la partie, et tu devrais déjà avoir croisé la phalange de capteurs.<br><br>\r\
    \nDes questions ? Consulte le wiki ou demande à la communauté sur Discord."
  step12_u6: "Félicitations, tu as terminé le tutoriel !<br><br>\r\nLe jeu a encore\
    \ bien d’autres choses à offrir.<br>\r\nIl existe par exemple trois styles de\
    \ jeu, qui demandent aussi plus ou moins de temps :<br>\r\n<ul>\r\n<li>Mineur :\
    \ développe ses mines sur de nombreuses colonies et vole surtout avec des transporteurs</li>\r\
    \n<li>Fleeter : investit l’essentiel de ses points dans des vaisseaux de combat,\
    \ produit très peu lui-même et vit des raids sur d’autres joueurs</li>\r\n<li>Mixte :\
    \ un mélange des deux</li>\r\n</ul>\r\nDes questions ? Consulte le wiki ou demande\
    \ à la communauté sur Discord."
tutorial_title:
  step0: Bienvenue, Empereur !
  step1: C’est l’heure de miner !
  step2: Viens rencontrer du monde !
  step3: Ne laisse pas ta planète sans défense !
  step4: Pense à long terme !
  step5: Des vaisseaux, il nous faut des vaisseaux !
  step6: Nomme ta planète et trouve des amis !
  step7: Regarde ce que les autres ont !
  step8: Cap sur l’inconnu !
  step9: Une seule planète, ça ne suffit jamais !
  step10: Marre d’attendre tes mines ?
  step11: C’est l’heure de sortir les poubelles !
  step12: Tu as réussi !
