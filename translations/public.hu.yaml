home_meme_alt: 'Képregény-mém a(z) {game_name} parancsnoki hídjáról'
home_meme_alt_deep_space_transit: "Képregény: két kadét egy siklóban – az egyik összeroskad egy aszteroidamező láttán, a másik vigyorog egy izzó ködön. „Szokásos szektorjárőrözés vs. egy felfedezetlen, nyersanyagban gazdag köd megtalálása.”"
home_meme_alt_deuterium_joyride: "Képregény: egy fáradt parancsnok a megfigyelőfedélzeten nézi, ahogy két újonc lebeg odakint – „Nézem, ahogy az újoncok az összes Deutériumukat elpazarolják a kinti hancúrozásra, miközben én 12 órát várok a bányafejlesztésemre.”"
home_meme_alt_enemy_fleet: "Képregény: egy kadét kétségbeesetten kapja a fejéhez a kezét, miközben villognak a riasztók – „1000 ellenséges rombolóval kell számolni?! Azt hittem, ez a szektor biztonságos!?”"
home_meme_alt_fleet_decimated: "Képregény: egy sokkot kapott katona mered maga elé, míg odakint hajók robbannak egy összetört kupola mögött – „Amikor 20 órát farmolsz nyersanyagot, aztán egy top 3-as játékos flottája beugrik, és 3 másodperc alatt szétszed mindent.”"
home_meme_alt_solo_scouting: "Képregény: Kamioka parancsnok vigyorogva teszi robotkezét egy kadét vállára – „Ne aggódj, kadét. A Főparancsnokság »teljes« bizalmat szavaz a magányos felderítő küldetésedben az Űrbe.”"
home_meme_alt_this_is_fine: "Képregény: egy űrruhás kutya nyugodtan ül egy lángoló parancsnoki központban, és azt mondja: „Ez így jó” – „Nyugi. A flottám csak 4 órát késik a visszatéréssel.”"
