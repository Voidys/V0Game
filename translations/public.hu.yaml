registerWelcomePMText: >-
  Üdv a(z) %s világában! Először építs egy Naperőművet, mert a nyersanyagok
  termeléséhez energia kell. Nyisd meg az Épületeket a bal oldali menüben, és
  kezdd a Naperőművel.<br>Ha már van energiád, építhetsz bányákat. Maradj az
  Épületeknél, és építs egy Fémbányát, majd egy Kristálybányát.<br><br>Hajók
  építéséhez Hajógyár kell. A bal oldali Technológiák menüben láthatod, mi kell
  a feloldásához.<br>Ha további kérdésed van, nézd meg a GYIK-et, a wikit, vagy
  nyiss egy támogatási jegyet.<br><br>A csapat sok szórakozást kíván az
  univerzum felfedezéséhez!
