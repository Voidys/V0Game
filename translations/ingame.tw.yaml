Achievement_text:
  '1': '在同一個夜晚，讓你的 5 次攻擊在午夜到早上 6 點之間抵達，並且一次都沒有獲勝。'
  '2': 你的艦隊連續 90 天一直在飛行中。
  '3': '你在語言設成「法文」的時候，損失了你的艦隊。'
  '4': 研究離子科技 10 級。
  '5': 研究重力子研究 2 級，只因為你辦得到。
  '6': 你的其中一次攻擊只帶回 1 金屬、1 晶體和 1 重氫。
  '7': '擊敗總數至少 10,000 艘的海盜或外星艦隊。太空是我們的！'
  '8': 出席 Strammtisch 固定聚會（每週二晚上 8 點，在 Discord 上）。
  '9': 建造你的第一艘死星。
  '10': 摧毀一位玩家的月球。
  '11': 連續 14 天只用手機玩。
  '12': 你的艦隊在你第一次遠征時被黑洞摧毀了。
  '13': 在來襲攻擊抵達前不到 5 秒，把你的艦隊送走。
  '14': 損失 10 支艦隊給黑洞。虛空很餓。
  '15': '在最高月球機率下進行 10 場戰鬥，仍未獲得第一顆月球。'
  '16': 超過 250 艘你的回收船空手而回。
  '17': 在單一建造訂單中排入至少 5000 座飛彈發射器。
  '18': 在 24 小時內，於單一行星上燒掉 500 萬重氫當燃料。
  '19': 研究裝甲科技 3 級。
  '20': 研究裝甲科技 6 級。
  '21': 研究裝甲科技 9 級。
  '22': 研究裝甲科技 12 級。
  '23': 研究裝甲科技 15 級。
  '24': 研究雷射科技 12 級。
  '25': 選擇加入紀錄榜。
  '26': 刪除帶給你最多分數的行星（至少 100,000 分）。
  '27': 研究星際研究網路 1 級。
  '28': 把月球上的三種倉庫都升到至少 3 級。
  '29': 用 5 人聯盟戰把分數比你高的玩家的艦隊共產化。
  '30': 獨自一人擋下 5 人聯盟戰。
  '31': 用你的攻擊把一位玩家送進假期模式。
  '32': '使用「SetSail」主題掠奪 1000 顆行星。啊哈！'
  '33': 從假期模式回來。
  '34': 第一次被攻擊。歡迎來到宇宙。
  '35': 攻擊一位分數不到你 1/10 的活躍玩家。
  '36': "收到一則包含以下任一字詞的訊息：\r\n                        \"Hurensohn\"、\"gleichstarke Ziele\"、\"gegen Schwächere\"、\"ehrenlos\""
  '37': 被 5 人聯盟戰團滅。
  '38': '攻擊你自己聯盟的成員。友軍誤傷，有人要嗎？'
  '39': 用剛好 42 艘船攻擊某人。
  '40': 殖民一顆距離至少半個宇宙遠的行星。
  '41': 用一個爛市集掛單把一個艦隊欄位卡住一週。
  '42': 以戰敗方身分登上戰鬥大廳 4 次。
  '43': "在你的帳號被標記為不活躍的情況下，於你其中一顆行星上贏得一場戰鬥，而該行星之前有一支飛行時間超過 7 天的艦隊抵達過。"
  '44': '在能源低於 100% 的情況下，在一顆行星上生產某種資源超過 7 天。'
  '45': 贏得對一位防禦排名前 5 的玩家的攻擊。
  '46': 發射星際飛彈觸發洗點保護。
  '47': 摧毀 5 顆月球。
  '48': 嘗試摧毀月球時損失 5 艘死星。好痛。
  '49': 在殖民地剛建立不久後就拆掉它。
  '50': "在一顆能源足夠研究重力子科技的行星上，沒研究過重力子科技卻損失了所有太陽能衛星。"
  '51': 在逛銀河系檢視時把重氫用光。
  '52': >-
    在沒有先建造其他戰鬥艦船（輕型戰鬥機、重型戰鬥機、巡洋艦、戰列艦、轟炸機、毀滅者或戰鬥巡洋艦）的情況下，建造一艘死星。
  '53': 同時擁有 5 項研究的最高等級。
  '54': '把對一位活躍玩家的攻擊抓準在 01/01 00:00:00 抵達。'
  '55': 特別成就
  '56': '將超空間引擎升到 15 級。'
  '57': '將天體物理學升到 15 級。'
  '58': '研究每一項科技（引力子除外）至少一次。'
  '59': '將每一項研究（引力子除外）提升到 10 級。'
  '60': '在一顆行星或月球上擁有 1,000,000,000 單一資源。'
  '61': '在一顆行星上同時擁有 1000 顆太陽能衛星。'
  '62': '蓋滿一顆至少有 250 個格子的行星的所有格子。'
  '63': '在一顆行星上將金屬、晶體和重氫倉庫升到 15 級。'
  '64': '在 9 顆行星上擁有 30 級或以上的金屬礦。'
  '65': '下達一個耗時超過 30 天的建造訂單。'
  '66': '讓其他玩家購買你的 50 個市場報價。'
  '67': '在防禦中戰勝價值至少為你的艦隊與防禦 10 倍的攻擊者（攻擊者價值至少 1,000,000 資源）。'
  '68': '贏得一場摧毀至少 1000 個敵方單位且自己不損失任何單位的攻擊。'
  '69': '戰鬥在最大回合數後以平手結束，且雙方各損失至少 10,000 個單位。'
  '70': '在沒有艦船和防禦的行星上被攻擊，使攻擊者什麼也搶不到。'
  '71': '從一場只有 1 % 月球機率的戰鬥中獲得月球。'
  '72': '用一次星際飛彈攻擊摧毀至少 100 個防禦單位。'
  '73': '在你行星上的一場戰鬥中摧毀至少 100 個敵方間諜探測器。'
  '74': '累計掠奪 1,000,000,000 資源。'
  '75': '累計回收 1,000,000,000 資源。'
  '76': '累計從殘骸場修復 1000 艘艦船。'
  '77': '獲得 1000 榮譽點。'
  '78': '第一次成為法外之徒。'
  '79': '作為攻擊方參與 25 次獲勝的聯合攻擊。'
  '80': '至少一次體驗每一種可能的遠征結果。'
  '81': '派出 1000 次遠征。'
  '82': '在遠征中戰勝一支大型外星艦隊。'
  '83': '在 50 次遠征中發現大量資源。'
  '84': '派出一支單程飛行超過 24 小時的艦隊。'
  '85': '讓一支艦隊在 2 月 29 日抵達目標。'
  '86': '在 13 號星期五損失整支攻擊艦隊。'
  '87': '讓你的兩次攻擊（非聯合攻擊）在同一秒抵達同一目標。'
  '88': '同時有艦隊飛往宇宙中的每一個星系。'
  '89': '完成教學。'
  '90': '同時與另外 3 個聯盟保持有效條約（所有聯盟成員都會獲得）。'
  '91': '建立 5 個聯盟百科頁面。'
  '92': '有 10 個被接受的好友請求。'
  '93': '連續 7 天位居總積分排名第一。'
  '94': '在一顆行星或月球上同時擁有 100 顆死星。'
  '95': '佔滿你的天體物理學允許的所有行星位置（至少 9 個），每顆行星至少有 200 個格子。'
  '96': '擁有另外 50 個成就。'
