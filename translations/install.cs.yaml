install_desc: >-
  Pro zapnutí instalačního nástroje vytvoř soubor
  „var/ENABLE_INSTALL_TOOL“.<br> V názvu souboru záleží na velikosti písmen a
  nemá žádnou příponu.<br> Soubor může být prázdný.

  Po dokončení instalace se smaže automaticky, stejně jako když je starší než
  jedna hodina.
install_title: Instalační nástroj je zamčený
intro_install: Instalovat
intro_lang: Jazyk
intro_text: 'V0Game je open-source vesmírná strategická hra v prohlížeči: rozvíjej své planety, zkoumej, posílej flotily a měř síly se stovkami hráčů najednou.<br><br>Tento průvodce nastaví novou instalaci krok za krokem: zkontroluje tvůj server, připojí se k databázi a vytvoří ji, postaví tabulky, nechá tě pojmenovat hru a vytvoří administrátora.'
intro_upgrade_head: Už máš V0Game nainstalovaný?
