ins_feat_contracts_info: 'Tři rotující cíle na hráče a týden, s kosmetickou nebo malou surovinovou odměnou.'
ins_feat_alliance_goals: 'Cíle aliance'
ins_feat_alliance_goals_info: 'Vedoucí aliance nastaví členům týdenní cíl; po jeho splnění získají odznaky.'
ins_feat_returning: 'Vítej zpět'
ins_feat_returning_info: 'Hráči, kteří se vrátí po dlouhé pauze, uvidí, co se stalo, a mohou získat krátkou ochranu.'
ins_feat_seasons: 'Sezóny'
ins_feat_seasons_info: 'Měsíční žebříček (nájezdník, bojovník, obránce, průzkumník, recyklátor) bez resetu; vítězové získají odznaky.'
ins_feat_cosmetics: 'Odznaky a tituly'
ins_feat_cosmetics_info: 'Zobrazuje získané odznaky, tituly a barvy jmen na kartě hráče a v chatu.'
ins_feat_bounties: 'Odměny za hlavu'
ins_feat_bounties_info: 'Hráči vkládají suroviny na jiného hráče; kdo zničí dost jeho flotily, ty si vezme.'
ins_feat_alliance_wars: 'Skóre války aliance'
ins_feat_alliance_wars_info: 'Živá tabulka skóre pro války vyhlášené v diplomacii aliance.'
ins_feat_battle_feed: 'Přehled bitev'
ins_feat_battle_feed_info: 'Velké bitvy jsou oznamovány v globálním chatu (vyžaduje chat).'
ins_feat_derelicts: 'Pole vraků'
ins_feat_derelicts_info: 'Sběrná pole se v galaxii na čas objeví; první recyklátoři, kteří tam dorazí, je sesbírají.'
ins_feat_mothership: 'Pirátská mateřská loď'
ins_feat_mothership_info: 'Vzácný world boss, kterého lze porazit jen v ACS; kořist se dělí podle způsobené škody.'
ins_feat_expedition_stories: 'Příběhy expedic'
ins_feat_expedition_stories_info: 'Vzácné signály vedou hráče krátkou expedičním úkolem s větší odměnou.'
ins_feat_relics: 'Relikvie'
ins_feat_relics_info: 'Expedice mohou najít relikvie (běžné až epické, se setovými bonusy), které hráči připojí k planetám pro malé bonusy.'
