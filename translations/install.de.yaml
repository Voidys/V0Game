install_desc: >-
  Um das Installationstool zu aktivieren, erstellen Sie die Datei
  "var/ENABLE_INSTALL_TOOL".<br> Der Dateiname unterscheidet zwischen Groß-
  und Kleinschreibung und hat keine Dateityp-Endung.<br> Die Datei kann leer
  sein. 

  Es wird automatisch gelöscht, wenn die Installation abgeschlossen ist oder
  wenn es älter als eine Stunde ist.
install_title: Das Install Tool ist gesperrt
intro_install: Zur Installation
intro_lang: Sprache
intro_text: 'V0Game ist ein Open-Source-Weltraum-Strategiespiel im Browser: Planeten ausbauen, forschen, Flotten losschicken und sich mit hunderten Spielern gleichzeitig messen.<br><br>Dieser Assistent richtet eine neue Installation Schritt für Schritt ein: Er prüft deinen Server, verbindet sich mit der Datenbank und legt sie an, baut die Tabellen auf, lässt dich dein Spiel benennen und erstellt den Administrator.'
intro_upgrade_head: V0Game schon installiert?
intro_upgrade_text: >-
  <p>Du hast V0Game bereits installiert und möchtest einfach
  updaten?</p><p>Hier kann du deine alte Datenbank mit wenigen klicks
  aktualisieren!</p>
