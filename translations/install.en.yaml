install_desc: >-
  To enable the installation tool, create the file
  "var/ENABLE_INSTALL_TOOL".<br> The filename is case-sensitive and has
  no file extension.<br> The file may be empty.

  It is deleted automatically once installation is complete, or if it is more
  than one hour old.
