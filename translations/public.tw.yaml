home_meme_alt: '來自 {game_name} 指揮甲板的迷因漫畫'
home_meme_alt_deep_space_transit: "漫畫：兩名學員坐在穿梭機裡，一個看到小行星帶就癱軟，另一個看著閃閃發光的星雲咧嘴笑。「例行星區巡邏 vs. 發現一片沒人探索過、資源豐富的星雲。」"
home_meme_alt_deuterium_joyride: "漫畫：一位疲憊的指揮官在觀測甲板上看著兩名新兵在外面飄來飄去，「看著新兵把重氫都浪費在外面兜風，而我還在等 12 小時的礦場升級。」"
home_meme_alt_enemy_fleet: "漫畫：警報狂閃，一名學員抱頭驚慌，「1000 艘敵方驅逐艦逼近？！我還以為這個星區很安全！？」"
home_meme_alt_fleet_decimated: "漫畫：一名驚魂未定的士兵直盯著前方，破碎的穹頂外艦船接連爆炸，「花了 20 小時刷資源，結果前三名玩家的艦隊跳進來，3 秒就全部拆光的時候。」"
home_meme_alt_solo_scouting: "漫畫：上岡指揮官咧嘴笑，把機械手放在學員肩上，「別擔心，學員。最高指揮部對你單獨前往太空偵察的任務『完全』有信心。」"
home_meme_alt_this_is_fine: "漫畫：一隻穿太空衣的狗平靜地坐在燃燒的指揮中樞裡說「沒事啦」，「別擔心，我的艦隊只是晚了 4 小時才回來而已。」"
