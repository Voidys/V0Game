home_meme_alt: 'Meme-comic de pe puntea de comandă {game_name}'
home_meme_alt_deep_space_transit: "Comic: doi cadeți într-o navetă – unul se prăbușește la vederea unui câmp de asteroizi, celălalt zâmbește larg la o nebuloasă strălucitoare. „Patrulele standard de sector vs. descoperirea unei nebuloase neexplorate bogate în resurse.”"
home_meme_alt_deuterium_joyride: "Comic: un comandant istovit privește de pe puntea de observație cum doi recruți plutesc afară – „Mă uit cum noii recruți își irosesc tot Deuteriul plimbându-se pe afară, în timp ce eu aștept 12 ore pentru upgrade-urile minelor mele.”"
home_meme_alt_enemy_fleet: "Comic: un cadet își apucă capul panicat în timp ce alarmele clipesc – „1000 de distrugătoare inamice se apropie?! Credeam că sectorul ăsta e sigur?!”"
home_meme_alt_fleet_decimated: "Comic: un soldat în stare de șoc se uită în gol în timp ce nave explodează în afara unei cupole sparte – „Când îți petreci 20 de ore strângând resurse, iar flota unui jucător din top 3 intră și desface totul în 3 secunde.”"
home_meme_alt_solo_scouting: "Comic: Comandantul Kamioka zâmbește larg și își sprijină o mână robotică pe umărul unui cadet – „Nu-ți face griji, cadetule. Înaltul Comandament are încredere «totală» în misiunea ta solo de recunoaștere în Spațiu.”"
home_meme_alt_this_is_fine: "Comic: un câine în costum spațial stă liniștit într-un centru de comandă în flăcări și zice „Totul e bine” – „Nu-ți face griji. Flota mea întârzie doar 4 ore la întoarcere.”"
