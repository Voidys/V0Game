registerWelcomePMText: >-
  Bun venit la %s! Mai întâi construiește o Centrală solară, pentru că ai
  nevoie de energie ca să produci resurse. Deschide Clădiri din meniul din
  stânga și începe cu Centrala solară.<br>Când ai energie, poți construi mine.
  Rămâi la Clădiri și construiește o Mină de metal, apoi o Mină de cristal.<br><br>Ca să
  construiești nave ai nevoie de un Șantier naval. Meniul Tehnologii din
  stânga îți arată ce e necesar ca să îl deblochezi.<br>Dacă mai ai întrebări,
  uită-te în FAQ, în wiki sau deschide un tichet de suport.<br><br>Echipa îți
  urează multă distracție în explorarea universului!
