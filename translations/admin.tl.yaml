se_bots_max_count_info: Pinakamataas na limitasyon para sa mga nagawang bot sa universe na ito.
se_bots_ticks_per_run: Mga bot bawat cron run
se_bots_ticks_per_run_info: Pinakamaraming bot na pinoproseso sa isang cron run.
se_bots_raids_enabled: Mag-raid ng ibang manlalaro ang mga bot
se_bots_raids_enabled_info: Pinapayagan ang mga bot na mag-scout, mag-espiya at umatake ng mga malapit na manlalaro at ibang bot, sa parehong patakaran ng mga manlalaro (bash limit, protection, bakasyon). Naka-off bilang default.
