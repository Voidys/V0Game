se_pow_adaptive: Bot protection - adaptive na hirap
se_pow_adaptive_info: 'Naka-on: ang mga kahina-hinalang IP address at network (/24 o /64) ay makakatanggap ng mas mahirap na palaisipan (maraming kahilingan, pagkabigo o pagpaparehistro sa maikling panahon). Naka-off: lahat ng bisita ay makakakuha ng pangunahing palaisipan at walang binibilang na counter.'
se_pow_elevated_factor: Bot protection - factor sa nakataas na panganib
se_pow_elevated_factor_info: Nagiging ganito kabeses na mas mahirap ang palaisipan (default 20).
se_pow_high_factor: Bot protection - factor sa mataas na panganib
se_pow_high_factor_info: Nagiging ganito kabeses na mas mahirap ang palaisipan (default 100).
se_pow_max_cap: Bot protection - limitasyon ng hirap
se_pow_max_cap_info: Pinakamataas na numero pagkatapos ilapat ang mga factor. Ang 1500000 ay humigit-kumulang 25 segundo sa mabagal na smartphone.
se_pow_sensitivity: Bot protection - sensitivity ng pagtukoy sa panganib
se_pow_sensitivity_info: Porsyento ng default na threshold (nakataas mula 5 kahilingan/10 min, 3 pagkabigo/oras o 2 pagpaparehistro/24 oras kada IP; mataas mula 20 / 10 / 5; ang network ay tatlong beses). 200 = dalawang beses na mas maraming pangyayari ang kailangan, 50 = kalahati.
se_pow_max_number: Bot protection - hirap (pinakamataas na numero)
se_pow_max_number_info: Sinusubukan ng browser ang mga hash hanggang sa numerong ito, kalahati nito sa karaniwan. Humigit-kumulang kalahating segundo hanggang isang segundo ang 100000. Mas maraming trabaho para sa bots ang mas mataas na halaga.
se_pow_min_seconds: Bot protection - pinakamababang oras bago magsumite (segundo)
se_pow_min_seconds_info: Tinatanggihan ang mga form na naisumite nang mas mabilis kaysa rito pagkatapos mag-load. Ang 0 ay nagdi-disable ng check.
se_proofofwork: Bot protection
se_proofofwork_info: Protektado ang registration at lost password ng maliit na kalkulasyon na sarili nang nilulutas ng browser, nang walang third party.
se_rebuild_protection: Rebuild protection
se_rebuild_protection_info: Pagkatapos ng malaking pagkalugi, makakakuha ang manlalaro ng rebuild protection laban sa karagdagang atake pagkalipas ng 6 na oras, tatagal ng 48 oras mula sa atake. Dapat masira ang 70% ng fleet o 80% ng transport capacity sa isang atake, at ang pagkalugi ay dapat hindi bababa sa noob-protection points × 1,000 sa unit o capacity. Puwedeng tapusin nang maaga ng manlalaro ang mode.
