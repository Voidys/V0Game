se_community_links: Mga link ng komunidad
se_discord_url: URL ng Discord invite
se_discord_url_info: Invite link ng Discord server mo (https://...). Ipinapakita sa menu, login page, mail at teksto. Kapag walang laman, nakatago ito.
se_discord_widget_guild: ID ng Discord server (online widget)
se_discord_widget_guild_info: ID ng Discord server mo (17-20 digit; Server Settings → Widget, dapat naka-on ang "Enable Server Widget"). Nagpapakita ng kahon na may bilang ng online sa start page, nire-refresh kada 5 minuto. Kapag walang laman, nakatago ito.
se_wiki_url: Wiki URL
se_wiki_url_info: Base URL ng external na wiki, walang trailing slash (https://...). Gawa mula rito ang mga wiki link sa FAQ, tutorial at tuntunin. Kapag walang laman, nakatago ang mga ito.
se_donate_url: URL ng donasyon
se_donate_url_info: Link para sa donasyon (https://...), ipinapakita sa menu. Kapag walang laman, nakatago ito.
se_userscripts_url: URL ng userscripts
se_userscripts_url_info: Page na naglalarawan ng mga userscript para sa laro mo (https://...), naka-link sa mga setting. Kapag walang laman, nakatago ito.
se_bots_alliances_enabled: Bumubuo ng alliance ang mga bot
se_bots_alliances_enabled_info: 'Nagtatatag ng sarili nilang alliance ang mga bot at paminsan-minsang sumasali sa iba. Naka-off: nananatiling lone wolf ang mga bot, hindi nag-a-apply kahit saan at umaalis sa mga alliance na kinabibilangan nila (nananatili ang mga alliance na itinatag ng bot).'
se_bots_join_human_alliances: Puwedeng sumali ang mga bot sa alliance ng manlalaro
se_bots_join_human_alliances_info: 'Puwede ring mag-apply ang mga bot sa mga alliance na itinatag ng mga manlalarong tao. Naka-off: sa mga alliance na itinatag ng bot lang sumasali ang mga bot at umaalis sila sa mga alliance ng manlalaro.'
se_bot_reply_delay_hours: Pagkaantala ng sagot (oras)
se_bot_reply_delay_hours_info: Oras na hihintayin ng pinakalumang hindi nasagot na pribadong mensahe ng manlalaro bago sagutin ng bot ang lahat ng nakabinbing mensahe ng manlalarong iyon sa isang sagot. Ito rin ang pinakamababang agwat sa pagitan ng dalawang mensaheng sinimulan ng bot (reaksyon sa atake, pang-aasar sa raid) papunta sa parehong manlalaro. 0 = walang pagkaantala.
se_bot_chatter: Nakikipag-chat ang mga bot
se_bot_chatter_info: 'Naka-on: sinasagot ng mga bot ang pribadong mensahe. Naka-off: binabasa at binibilang pa rin ang mga mensahe, pero reaksyon sa labanan lang ang ipinapadala (pagkatapos ma-atake o ma-raid ang manlalarong sumulat sa kanila). Hindi kailanman unang sumusulat ang mga bot sa manlalaro.'
