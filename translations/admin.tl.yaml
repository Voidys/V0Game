hof_cleared: Nabura ang data ng hall of fame.
hof_error_nofile: Walang wastong file na na-upload.
hof_error_invalid: 'Tinanggihan ang import:'
se_bash_war_exempt: Inaalis ng digmaan ang bash limit
se_bash_war_exempt_info: 'Hindi binibilang sa bash limit ang mga atake sa pagitan ng mga alliance na nasa digmaan (tinanggap, mahigit isang araw na ang edad). Naka-off: binibilang ang mga atake sa digmaan gaya ng iba.'
se_honor_pair_cap: Mga marangal na laban bawat pares (24 oras)
se_honor_pair_cap_info: Ilang marangal na laban sa pagitan ng parehong dalawang manlalaro (alinmang direksyon) ang nagbibigay ng honor sa loob ng 24 oras. Ang mga susunod pang laban ay ituturing na neutral. 0 = walang limitasyon.
se_market_push_tolerance: Toleransya sa market push
se_market_push_tolerance_info: Tinatanggap na pagkakaiba ng halaga ng market trade sa porsyento (0-90) bago ito ituring na push. Default 30.
se_transport_push_check: Guard sa transport push
se_transport_push_check_info: Tinatanggihan ang mga transport, hold at transfer (cargo at barko) papunta sa ibang manlalaro kapag, sa huling 7 araw, lumampas ang halagang ipinadala sa kanila sa halagang ibinalik nila ng higit sa limit sa ibaba.
se_transport_push_limit: Limit ng transport push
se_transport_push_limit_info: Halaga ng cargo sa deuterium unit (market ratio) kung saan nagsisimulang umepekto ang guard. 0 = naka-off ang guard.
se_depot_cost_real_consumption: Gastos ng depot ayon sa aktuwal na konsumo
se_depot_cost_real_consumption_info: Sinisingil ng alliance depot ang aktuwal na fuel consumption ng fleet (kasama ang drive at fuel tech ng may-ari) / 10 kada oras, sa halip na base consumption / 10.
se_hours: Oras
se_remember_me_days: '"Manatiling naka-login" ay tumatagal ng'
se_remember_me_days_info: 'Mga araw na nananatili ang login na may tsek sa "Manatiling naka-login" kahit mag-restart ang browser o mag-expire ang session. Natatapos ito kapag nagpalit ng password. 0 ang nagpapatay sa opsyon.'
se_session_lifetime: Nage-expire ang session pagkatapos ng kawalan ng aktibidad na
se_session_lifetime_info: 'Mga oras na walang kahit anong request, pagkatapos nito ay mala-log out ang manlalaro ("nag-expire ang session").'
abuse_menu: Ulat ng abuse
abuse_days: Araw
abuse_apply: Ilapat
abuse_weights: 'Timbang ng halaga metal : crystal : deuterium'
abuse_none: Walang nakitang anuman sa window na ito.
abuse_from: Mula
abuse_to: Hanggang
abuse_count: Bilang
abuse_sent: Ipinadala
abuse_back: Ibinalik
abuse_net: Net na halaga
abuse_linked: Naka-link
abuse_last: Huli
abuse_link_ip: parehong IP
abuse_link_multi: multi group
abuse_link_multi_known: multi group (kilala)
abuse_link_subnet: parehong subnet (mas mahina)
abuse_thresholds: 'Mga threshold: nakalista ang pares ng transfer kapag mula %s metal unit sa isang direksyon na may pinakamarami %s ang pabalik; ang market pair ay mula %s trade, may flag kapag lumampas sa %s ang pagkakaiba. Ang walang row ay nangangahulugang walang umabot sa mga limit na ito (o walang laman ang mga log), hindi na walang nangyari.'
abuse_transfers: Mga transport at hold na isang direksyon
abuse_transfers_info: Mga transport, hold at paglilipat ng barko (hindi na-recall; binibilang ang barko sa build cost) sa pagitan ng dalawang manlalaro na ang cargo ay nagkakahalagang hindi bababa sa %s metal unit sa isang direksyon habang hanggang %s ng halagang iyon ang bumalik. Ayos ayon sa net value; ang timbang ay ang naka-save na market ratio.
abuse_trades: Paulit-ulit na market trade
abuse_trades_info: Mga resource trade sa pagitan ng parehong dalawang manlalaro, kahit man lang %s beses. Ratio = halagang ibinigay ng panig na mas maraming ibinigay, hinati sa kabilang panig (1.00 = nasa market reference); kapag lumampas sa %s ang pagkakaiba, may flag ang pares.
abuse_giver: Mas maraming ibinigay
abuse_receiver: Mas maraming natanggap
abuse_ratio: Ratio
abuse_outlier: outlier
abuse_protections: Mga ibinigay na rebuild protection
abuse_protections_info: Mga manlalarong nakatanggap ng rebuild protection sa window. Ang mga kalaban ay ang kabilang panig ng combat report ng laban na iyon; ang loot ay ang halagang nakuha ng kanilang fleet doon (hindi naka-save ang debris at halaga ng nawasak).
abuse_protected: Manlalarong may protection
abuse_granted: Ibinigay
abuse_opponents: Mga kalaban
abuse_loot: Loot ng kalaban
abuse_report: Report
abuse_recalls: Mga recall sa o pagkatapos ng pagdating
abuse_recalls_info: Mga attack, ACS at destroy fleet na na-recall nang naabot na ang oras ng pagdating (recall-after-arrival pattern).
abuse_mission: Mission
abuse_arrival: Pagdating
abuse_recalled: Na-recall
abuse_late: Pagkatapos ng pagdating
abuse_fought: lumaban
abuse_mission_1: Atake
abuse_mission_2: ACS attack
abuse_mission_9: Sirain
abuse_missiles_skipped: 'Hindi bahagi ng ulat na ito ang mga paglulunsad ng missile laban sa laman ng silo: walang kasaysayan ng silo sa mga table na pagkukumparahan.'
abuse_link_device: parehong device
abuse_graph: Mga cluster ng value flow
abuse_graph_info: 'Mga manlalarong naka-link sa pamamagitan ng value flow sa huling %s araw (fixed window): mga transport, hold, paglilipat ng barko (sa build cost), market trade (magkabilang panig) at attack loot, pinagsama sa parehong direksyon. Tanging mga pares na nakagalaw ng hindi bababa sa %s metal unit at %s flow ang nakakonekta; nakalista ang mga konektadong grupo ng dalawa o higit pa (top %s ayon sa halaga). Net = halaga ng pinaka-isang-panig na pares sa cluster (bahagi ng kabuuang halaga nito). Ipinapakita ng link flag kung may kapareho ang mga miyembro sa IP, device o multi group sa ibang miyembro. Binabasa ang mga row na may limit kada pinagmulan.'
abuse_members: Mga miyembro
abuse_value: Kabuuang halaga
abuse_flows: Mga flow
abuse_top_edge: Pinaka-isang-panig na pares
abuse_activity: Aktibidad ng pag-launch ng fleet (24 oras)
abuse_activity_info: Mga account na may pinakamaraming pag-launch ng fleet sa huling 24 na oras; peak = mga launch sa pinakaabalang oras. Ang palagiang mataas na peak ay puwedeng senyales ng scripted na paglalaro.
abuse_player: Manlalaro
abuse_launches: Mga launch
abuse_peak: Peak / oras
adm_dash_unprotected: 'Naka-off ang anti-abuse protection sa universe na ito:'
adm_dash_unprotected_push: Naka-off ang push guard para sa transport, hold at transfer (transport_push_check / transport_push_limit).
adm_dash_unprotected_honor: 0 ang honor pair cap (walang limitasyong honor sa pagitan ng parehong dalawang manlalaro).
adm_dash_unprotected_bash: Inaalis ng mga idineklarang digmaan ang bash limit (bash_war_exempt).
adm_dash_unprotected_depot: Ang depot hold ay sinisingil ng murang base consumption (depot_cost_real_consumption naka-off).
adm_dash_unprotected_market: Lampas sa 10 % ang market push tolerance (market_push_tolerance).
