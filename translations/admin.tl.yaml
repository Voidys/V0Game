adm_info_chk_ext_required: Mga kinakailangang PHP extension
adm_info_chk_ext_required_hint: I-install ang mga nawawalang extension; hindi gagana ang laro kung wala ang mga ito.
adm_info_chk_ext_optional: Mga opsyonal na PHP extension
adm_info_chk_ext_optional_hint: Hindi kinakailangan, pero nagbibigay ang mga ito ng mas mabilis o dagdag na feature (tingnan ang listahan ng extension).
adm_info_chk_opcache: OPcache
adm_info_chk_opcache_hint: Naka-off ang OPcache. I-enable ito sa production, malaki ang naitutulong nito sa bilis ng PHP.
adm_info_chk_environment: Environment (APP_ENV / debug)
adm_info_chk_environment_hint: Patakbuhin gamit ang APP_ENV=prod at naka-off ang debug sa public server.
adm_info_chk_display_errors: display_errors
adm_info_chk_display_errors_hint: Puwedeng mailantad ng error output sa mga page ang mga internal. Itakda ang display_errors=Off sa mga public server.
adm_info_chk_writable: Mga directory na puwedeng sulatan
adm_info_chk_writable_hint: Dapat makasulat sa mga directory na ito ang user ng web server (cache, log, session, upload).
adm_info_chk_install_tool: Install tool
adm_info_chk_install_tool_hint: Umiiral ang var/ENABLE_INSTALL_TOOL. Burahin ito kapag hindi ka nagi-install.
adm_info_chk_migrations: Mga migration ng database
adm_info_chk_migrations_hint: May nakabinbing migration. Ia-apply ang mga ito sa susunod na request sa laro; tingnan ang log kung nananatiling nakabinbin.
adm_info_chk_battle_engine: Battle engine
adm_info_chk_battle_engine_hint: Hindi magamit ang Rust engine (bin/battlerust, bin/libbattlerust.so, proc_open). Sa mas mabagal na PHP engine tatakbo ang mga laban.
adm_info_chk_cron: Mga cron job
adm_info_chk_cron_hint: Mukhang natigil o hindi tumatakbo ang cron. Tiyaking tumatakbo ang bin/console app:cron:run kada minuto at i-unlock ang mga natigil na job sa ilalim ng Cronjobs.
adm_info_chk_https: HTTPS
adm_info_chk_https_hint: Hindi gumamit ng HTTPS ang request na ito. Walang encryption ang mga password at session na ipinapadala.
adm_info_chk_mail: Pagpapadala ng mail
adm_info_chk_mail_hint: Naka-disable o kulang ang mail (hindi darating ang mga activation mail at password reset). Tingnan ang mga setting.
adm_info_chk_session: Session handler
adm_info_chk_session_hint: Tingnan ang session storage.
