se_bots_enabled_info: Pinapayagan ang mga server-side na bot na maglaro sa universe na ito. Pinoproseso sila ng cron job isang beses bawat minuto.
se_bots_llm_daily_limit: Mga LLM call bawat bot at araw
se_bots_llm_daily_limit_info: Pinakamaraming LLM call na puwedeng gawin ng isang bot kada araw. Pagkatapos nito, local fallback ang ginagamit.
se_bots_llm_enabled: Gamitin ang LLM para sa mga pangalan at chat
se_bots_llm_enabled_info: Ina-enable ang mga nickname, persona, pangalan ng planeta at chat na gawa ng LLM (mga mensahe, alliance, buddy) gamit ang aktibong provider. Lokal palagi ang mga desisyon sa laro.
