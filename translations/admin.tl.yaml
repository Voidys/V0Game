se_bots_raids: "Mga bot: mga raid at target"
se_bots_defense: "Mga bot: pagtakas ng fleet at mga banta"
se_bots_growth: "Mga bot: paglago at aktibidad"
se_bots_features: "Mga bot: mga switch ng pag-uugali"
se_bots_preset: "Preset ng hirap"
se_bots_preset_info: "Ang pagpili ng preset at pag-save ay pupunuin ang mga halaga ng bot sa ibaba (ang raid on/off at ang mga setting ng kapasidad ay hindi gagalawin); kapag may binago pagkatapos, ang preset ay magiging custom. Pinananatili ng bawat preset ang mga limitasyong nagpoprotekta sa mga manlalaro: mga atake bawat target bawat araw, cooldown bawat target, hindi kailanman mga manlalarong may proteksyon ng baguhan o nasa bakasyon. Maaaring i-override ng bawat bot ang preset sa listahan ng mga bot."
se_bots_preset_custom: "Custom"
se_bots_preset_relaxed: "Relaks"
se_bots_preset_normal: "Normal"
se_bots_preset_hard: "Mahirap"
se_bots_preset_brutal: "Brutal"
se_bots_max_fleets: "Pinakamaraming raid fleet ng bot na lumilipad"
se_bots_max_fleets_info: "Pinakamataas na limitasyon ng mga spy at attack fleet ng bot na sabay na lumilipad sa uniberso na ito (0 = walang limitasyon)."
se_bots_aggression: "Pagiging agresibo (0-100)"
se_bots_aggression_info: "50 = ang klasikong pag-uugali. Mas mataas: mas madalas mag-raid ang mga bot kada session at tumatanggap ng mga raid na mas maliit ang kita kada gastos; mas mababa: kabaligtaran."
se_bots_attack_actives: "Atakihin ang mga aktibong manlalaro"
se_bots_attack_actives_info: "Off: ang mga bot ay umaatake lamang sa mga manlalarong hindi aktibo sa nakaraang oras (mga hindi aktibong manlalaro at iba pang bot)."
se_bots_raids_per_target_day: "Mga raid bawat target bawat araw"
se_bots_raids_per_target_day_info: "Pinakamaraming atake ng isang bot sa iisang manlalaro sa loob ng 24 oras. 0 = ang halaga mula sa profile ng bot (2-4). Palaging nalalapat bukod pa rito ang bash limit ng laro."
se_bots_target_cooldown_hours: "Cooldown bawat target (oras)"
se_bots_target_cooldown_hours_info: "Gaano katagal pinababayaan ang isang target pagkatapos ng hindi kumikitang pagsilip, tinanggihang lipad o pagbawi."
se_bots_min_target_points: "Pinakamababang puntos ng target"
se_bots_min_target_points_info: "Hindi pinapansin ng mga bot ang mga manlalarong mas kaunti ang puntos (0 = off)."
se_bots_min_target_ratio_percent: "Pinakamaliit na laki ng target bilang porsiyento ng bot"
se_bots_min_target_ratio_percent_info: "Hindi pinapansin ng mga bot ang mga manlalarong ang puntos ay mas mababa sa porsiyentong ito ng sarili nilang puntos (0 = off)."
se_bots_probes_per_target_day: "Mga lipad ng probe bawat target bawat araw"
se_bots_probes_per_target_day_info: "Pinakamaraming spy flight ng isang bot sa iisang planeta sa loob ng 24 oras (0 = ang spy cooldown lamang ang naglilimita)."
se_bots_probes_wanted: "Mga probe na itinatago sa bahay ng raiding bot"
se_bots_probes_wanted_info: "Ang bot na magre-raid ay gumagawa ng mga probe hanggang sa magkaroon ng ganito karami."
se_bots_min_loot: "Pinakamababang nakaw (halaga)"
se_bots_min_loot_info: "Dapat nangangako ang isang atake ng kahit ganito kalaking nakaw (metal + 1.5 kristal + 2 deuterium)."
se_bots_escort_shares: "Bahagi ng escort sa porsiyento"
se_bots_escort_shares_info: "Mga bahagi ng mga sasakyang pandigma ng planeta na sinusubukan bilang escort, pinakamaliit muna, pinaghihiwalay ng kuwit (hal. 0, 15, 30, 50, 75, 100)."
se_bots_simulation_runs: "Mga simulate na laban bawat fleet"
se_bots_simulation_runs_info: "Ipinapadala lamang ang isang fleet kapag nanalo ito sa bawat simulate na laban (1-5)."
se_bots_spy_cooldown_minutes: "Spy cooldown (minuto)"
se_bots_spy_cooldown_minutes_info: "Mga minuto bago muling mag-espiya ang bot sa parehong planeta (nakakatanggap ang target ng mensahe ng counter-espionage sa bawat pagkakataon)."
se_bots_spy_cooldown_streak_minutes: "Spy cooldown sa raid streak (minuto)"
se_bots_spy_cooldown_streak_minutes_info: "Pareho habang nasa raid streak, kung saan mahalaga ang mga sariwang ulat."
se_bots_recall_loot_percent: "Bawiin sa ibaba ng bahaging ito ng pinakamababang nakaw (%)"
se_bots_recall_loot_percent_info: "Binabawi ng muling pag-espiya bago ang tama ang isang fleet kapag ang inaasahang nakaw ay bumaba sa ilalim ng porsiyentong ito ng pinakamababang nakaw."
se_bots_recall_ratio_percent: "Bawiin sa ibaba ng bahaging ito ng kinakailangang ratio ng kita (%)"
se_bots_recall_ratio_percent_info: "Pareho para sa ratio ng nakaw sa gasolina at mga pagkalugi."
se_bots_streak_loot_percent: "Raid streak pagkatapos ng tamang nagkakahalaga ng (% ng pinakamababang nakaw)"
se_bots_streak_loot_percent_info: "Ang tamang nagbigay ng kahit ganitong bahagi ng pinakamababang nakaw ay nagsisimula ng raid streak."
se_bots_raids_per_human_day: "Mga raid bawat manlalaro bawat araw (lahat ng bot nang magkakasama)"
se_bots_raids_per_human_day_info: "Pinakamaraming atake ng bot sa iisang taong manlalaro sa loob ng 24 oras, binibilang sa lahat ng bot ng uniberso (limitasyong laban sa pagkabigo, laging naka-on)."
se_bots_human_cooldown_hours: "Pahinga bawat manlalaro sa pagitan ng mga atake ng bot (oras)"
se_bots_human_cooldown_hours_info: "Matapos atakihin ng isang bot ang isang tao, walang bot na aatake sa kanya sa loob ng ganito katagal, at hindi kailanman habang may isa pang atake ng bot sa kanya na papunta pa."
se_bots_probes_per_human_day: "Mga lipad ng probe bawat manlalaro bawat araw (lahat ng bot nang magkakasama)"
se_bots_probes_per_human_day_info: "Pinakamaraming spy flight ng bot sa iisang taong manlalaro sa loob ng 24 oras, binibilang sa lahat ng bot ng uniberso."
se_bots_scout_range_max: "Pinakamalayong saklaw ng pag-scout (mga sistema)"
se_bots_scout_range_max_info: "Hindi kailanman tumitingin ang mga bot nang mas malayo kaysa sa ganito karaming sistema sa paligid ng kanilang mga planeta, anuman ang sabihin ng profile: halos kung ano ang binubuklat ng manlalaro sa galaxy view."
se_bots_respy_jitter_seconds: "Random na paglihis ng muling pag-espiya (segundo)"
se_bots_respy_jitter_seconds_info: "Ang pag-espiya bago tumama ang raid ay random na ipinapadala nang hanggang ganito karaming segundo na mas maaga kaysa sa plano (0 = eksaktong oras)."
se_bots_timezone_spread_hours: "Pagkalat ng personal na time zone (oras)"
se_bots_timezone_spread_hours_info: "Bawat bot ay nakakakuha ng matatag na personal na offset na hanggang ganito karaming oras (plus o minus) laban sa orasan ng server, para hindi sabay-sabay maglaro sa iisang oras ang mga bot ng iisang profile (0 = off)."
se_bots_fleetsave_enabled: "Inililigtas ng mga bot ang fleet"
se_bots_fleetsave_enabled_info: "Off: hindi kailanman inililigtas ng mga bot ang fleet, ni sa katapusan ng session ni kapag may paparating na atake."
se_bots_fleetsave_keep_percent: "Mga resources na iniiwan sa bahay ng pagtakas ng fleet (%)"
se_bots_fleetsave_keep_percent_info: "Bahagi ng bawat imbak na nananatili sa planeta para magpatuloy ang pagtatayo."
se_bots_fleetsave_min_offline_minutes: "Pinakamaikling offline na oras na sulit sa pagtakas ng fleet (minuto)"
se_bots_fleetsave_min_offline_minutes_info: "Sa katapusan ng session, inililigtas ng bot ang fleet nito kung inaasahan lamang nitong mawawala nang kahit ganito katagal."
se_bots_threat_window_hours: "Bintana ng banta (oras)"
se_bots_threat_window_hours_info: "Napapansin ang mga paparating na kaaway na fleet nang ganito karaming oras bago tumama."
se_bots_ship_weight_percent: "Bigat ng paggawa ng barko (%)"
se_bots_ship_weight_percent_info: "Multiplier kung gaano mas pinipili ng mga bot ang paggawa ng barko kaysa sa iba (100 = klasiko)."
se_bots_defense_weight_percent: "Bigat ng paggawa ng depensa (%)"
se_bots_defense_weight_percent_info: "Multiplier kung gaano pinipili ng mga bot ang paggawa ng depensa (100 = klasiko)."
se_bots_growth_speed_percent: "Bilis ng paglago (%)"
se_bots_growth_speed_percent_info: "Multiplier sa pang-araw-araw na dagdag na kasanayan ng mga profile ng bot (100 = klasiko; ang mga profile na walang dagdag na kasanayan ay nananatili)."
se_bots_growth_bonus: "Dagdag na kasanayan bawat araw (sanlibo)"
se_bots_growth_bonus_info: "Idinaragdag sa pang-araw-araw na dagdag na kasanayan ng bawat bot (10 = isang porsiyentong punto bawat araw), nililimitahan ng pinakamataas na kasanayan ng profile."
se_bots_max_planets: "Pinakamaraming planeta bawat bot"
se_bots_max_planets_info: "Humihinto ang mga bot sa pag-kolonisa sa ganito karaming planeta (0 = limitasyon lamang ng laro ang nalalapat)."
se_bots_activity_percent: "Multiplier ng aktibidad (%)"
se_bots_activity_percent_info: "Sinusukat ang oras-oras na tsansang mag-online ang isang bot (100 = ang talahanayan ng profile; higit sa 100 ay mas madalas mag-log in ang mga bot)."
se_bots_hidden_rhythm_percent: "Bahagi ng mga bot na may nakatagong ritmo (%)"
se_bots_hidden_rhythm_percent_info: "Inililipat ng mga bot na ito ang kanilang pang-araw-araw na ritmo ng iba-ibang halaga bawat araw, kaya hindi sila mahuhulaan sa kanilang mga oras ng online."
se_bots_revenge: "Paghihiganti"
se_bots_revenge_info: "Nagtatanim ng sama ng loob ang mga bot (tumataas kapag inatake o ini-spy sila ng manlalaro, bumababa ng 10 % bawat araw) at nag-i-scout at gumaganti sa pinakamapaghinalang manlalaro sa saklaw kapag nakahanap ang kanilang raid planner ng planong mananalo. Nalalapat pa rin ang mga limitasyon bawat manlalaro at bawat araw."
se_bots_bot_acs: "ACS ng bot"
se_bots_bot_acs_info: "Ang bot na hindi kayang talunin ang target nang mag-isa ay nagbubukas ng ACS group at nag-iimbita ng mga alyadong bot (parehong alyansa) na online; sumasali sila tulad ng mga manlalaro. Itinuturing ng mga limitasyon bawat manlalaro at bawat araw ang isang grupo bilang isang atake."
se_bots_recycling: "Pag-recycle"
se_bots_recycling_info: "Nagpapadala ang mga bot ng mga recycler sa mga debris field na nakikita nila sa paligid ng kanilang mga planeta (una ang sarili nilang laban) kapag mas malaki ang ani kaysa gasolina, at gumagawa ng ilang recycler kapag wala silang mayroon."
se_bots_moons: "Mga buwan"
se_bots_moons_info: "Ginagamit ng mga bot ang kanilang mga buwan: ang mga fleet ay inilalagay sa buwan sa pag-logout at maaaring magsimula ang mga raid mula sa buwan."
se_bots_missiles: "Mga missile"
se_bots_missiles_info: "Ang mga bot na may missile silo (antas 4), impulse drive at interplanetary missile ay bumabaril sa depensa ng target na humaharang sa raid, saka muling nag-eespiya at umaatake. Kapag naka-on ang switch na ito, gumagawa ang mga bot ng silo at missile."
se_bots_warmonger: "Warmonger sa huling bahagi ng laro"
se_bots_warmonger_info: "Mula sa mga puntos sa ibaba, mas madalas mag-raid ang bot, tumatanggap ng mas manipis na kita at tinatarget din ang mga aktibong manlalaro. Nalalapat pa rin ang raid planner at ang mga limitasyon bawat manlalaro."
se_bots_warmonger_points: "Threshold ng puntos ng warmonger"
se_bots_warmonger_points_info: "Mga puntos kung saan maaaring maging warmonger ang isang bot."
bot_difficulty: "Hirap"
bot_override_preset: "Preset ng bot na ito"
bot_override_universe: "Gaya ng uniberso"
bot_override_aggression: "Pagiging agresibo"
bot_override_save: "I-save"
bot_override_reset: "I-reset"
bot_override_saved: "Na-save ang hirap ng bot."
# engagement: map content (derelicts, mothership, stories)
se_derelicts: "Mga larangan ng sirang barko"
se_derelicts_enabled: "Mga larangan ng sirang barko"
se_derelicts_enabled_info: "Lumalabas sa mga random na bakanteng slot ang mga larangan ng sirang barko na may metal at kristal sa limitadong panahon; mga recycler lang ang makakakuha nito. Naka-off bilang default."
se_derelicts_per_galaxy: "Mga larangan kada galaxy at spawn"
se_derelicts_per_galaxy_info: "Ilang larangan ng sirang barko ang lumalabas sa bawat galaxy kada spawn run."
se_derelicts_interval_hours: "Agwat ng spawn"
se_derelicts_interval_hours_info: "Hindi lalagpas sa isang spawn run sa loob ng panahong ito."
se_derelicts_min: "Pinakamababang debris (metal + kristal bawat isa)"
se_derelicts_min_info: "Bawat larangan ay may random na halaga ng metal at kristal na nasa pagitan ng minimum at maximum."
se_derelicts_max: "Pinakamataas na debris (metal + kristal bawat isa)"
se_derelicts_max_info: "Itaas na hangganan ng random na halaga kada resource."
se_derelicts_lifetime_hours: "Haba ng buhay ng larangan"
se_derelicts_lifetime_hours_info: "Pagkatapos ng panahong ito, mawawala ang larangan kasama ang natitira rito."
se_mothership: "Pirate mothership"
se_mothership_enabled: "Pirate mothership"
se_mothership_enabled_info: "Isang world boss na maaari lamang atakihin ng combat group ng alyansa (ACS) ng ilang manlalaro; hinahati ang nakaw ayon sa naibigay na pinsala. Naka-off bilang default."
se_mothership_interval_days: "Agwat ng spawn"
