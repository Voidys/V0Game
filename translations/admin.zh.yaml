abuse_missiles_skipped: 导弹发射与发射井存量的对比不在本报告范围内：数据表中没有可供比较的发射井历史记录。
abuse_link_device: 相同设备
abuse_graph: 价值流动集群
abuse_graph_info: 过去 %s 天（固定时间段）内通过价值流动相互关联的玩家：运输、驻守、舰船转移（按建造成本）、市场交易（双方）以及攻击战利品，按双向合计。只有转移金属单位至少 %s 且流动次数至少 %s 的配对才会相连；列出两人及以上的关联组（按价值前 %s）。净值 = 该集群中最单向的配对的价值（占其总价值的比例）。关联标记显示成员之间是否与其他成员共享 IP、设备或多重账号组。每个来源的读取记录数有上限。
abuse_members: 成员
abuse_value: 总价值
abuse_flows: 流动
abuse_top_edge: 最单向的配对
abuse_activity: 舰队出发活跃度（24 小时）
abuse_activity_info: 过去 24 小时内舰队出发次数最多的账号；峰值 = 最繁忙整点时段内的出发次数。持续的高峰可能表示脚本化游戏。
abuse_player: 玩家
abuse_launches: 出发
abuse_peak: 峰值 / 小时
