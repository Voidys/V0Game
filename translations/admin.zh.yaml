abuse_thresholds: 阈值：转移配对需单向转出至少 %s 金属单位，且回送不超过 %s；市场配对需至少 %s 次交易，差异超过 %s 即标记。没有行表示没有达到这些限制（或日志中没有内容），并不代表什么都没有发生。
abuse_transfers: 单向运输与驻守
abuse_transfers_info: 两名玩家之间的运输、驻守和舰船转移（未召回；舰船按建造成本计算），其中一方的货物价值至少为 %s 金属单位，而回送价值不超过其中的 %s。按净价值排序；权重为存储的市场比率。
abuse_trades: 重复的市场交易
abuse_trades_info: 同一两名玩家之间的资源交易，至少 %s 次。比率 = 付出较多一方的价值除以另一方（1.00 = 市场参考值）；差异超过 %s 的配对将被标记。
abuse_giver: 付出更多
abuse_receiver: 获得更多
abuse_ratio: 比率
abuse_outlier: 异常
abuse_protections: 重建保护授予记录
abuse_protections_info: 在该时间段内获得重建保护的玩家。对手为该战斗报告中的另一方；战利品为其舰队在该战斗中获得的价值（残骸和被摧毁的价值不予存储）。
abuse_protected: 受保护的玩家
abuse_granted: 授予时间
abuse_opponents: 对手
abuse_loot: 对手战利品
abuse_report: 报告
abuse_recalls: 抵达时或之后的召回
abuse_recalls_info: 在抵达时间已到之后才被召回的攻击、ACS 和摧毁舰队（抵达后召回模式）。
