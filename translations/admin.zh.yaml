se_bash_war_exempt: 战争可解除围攻限制
se_bash_war_exempt_info: 处于交战状态的联盟之间的攻击（已接受、超过一天）不计入围攻限制。关闭：战争攻击与其他攻击一样计入。
se_honor_pair_cap: 每对玩家的荣誉战斗次数（24 小时）
se_honor_pair_cap_info: 同一两名玩家（任一方向）在 24 小时内有多少次荣誉战斗会获得荣誉。超出的战斗视为中立。0 = 不限。
se_market_push_tolerance: 市场推送容差
se_market_push_tolerance_info: 市场交易允许的价值差异百分比（0-90），超过此值才会被视为推送。默认 30。
se_transport_push_check: 运输推送防护
se_transport_push_check_info: 当过去 7 天内发送给某玩家的价值超过其回送价值并超出下方的限制时，拒绝向该玩家的运输、驻守和转移（货物与舰船）。
se_transport_push_limit: 运输推送限制
se_transport_push_limit_info: 以重氢单位（市场比率）计的货物价值，超过此值时启用防护。0 = 关闭防护。
se_depot_cost_real_consumption: 按实际消耗计算仓库费用
se_depot_cost_real_consumption_info: 联盟仓库按舰队的实际燃料消耗（含所有者的推进与燃料科技）/ 10 每小时收费，而非基础消耗 / 10。
se_hours: 小时
se_remember_me_days: '“保持登录”的有效期为'
se_remember_me_days_info: '勾选“保持登录”登录后，在浏览器重启和会话过期后仍保持有效的天数。修改密码会使其失效。0 表示禁用该选项。'
se_session_lifetime: 会话在无活动达到以下时长后过期
se_session_lifetime_info: '玩家在此时长内没有任何请求，将被登出（“会话已过期”）。'
