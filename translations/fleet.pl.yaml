sys_attack_title: 'Doszło do starcia następujących flot: '
sys_attacker_lostunits: "Straty agresora:"
sys_attacker_won: "Agresor wygrał bitwę! Jego statki lądują w stolicy, a dowódca przyjmuje upokarzającą przegranego defiladę zwycięskich wojsk."
sys_both_won: "Bitwa kończy się remisem! Zmęczone floty wracają do baz, żeby dokonać niezbędnych napraw."
sys_colo_allisok: "Jedna z twoich flot dotarła na współrzędne %s. Kolonizatorzy zaczęli zasiedlać nową planetę. To kolejny krok do ostatecznego triumfu naszego wspaniałego Imperium."
sys_colo_badpos: "Jedna z twoich flot dotarła na współrzędne %s. Kolonizacja jest tam niemożliwa, więc kolonizatorzy wracają do domu rozczarowani."
sys_colo_maxcolo: "Jedna z twoich flot dotarła na współrzędne %s. Kolonizacja jest niemożliwa: możesz mieć tylko %d planet, bo twoja znajomość astrofizyki jest zbyt niska."
sys_colo_mess_from: Kolonizacja
sys_colo_mess_report: Raport kolonizacji
sys_colo_notech: "Jedna z twoich flot dotarła na współrzędne %s. Okazało się, że nie możemy zasiedlić tej planety: nasza znajomość Astrofizyki jest zbyt niska, żeby przetrwać w tak niesprzyjających warunkach. Rozczarowani kolonizatorzy wracają do domu."
sys_colo_notfree: "Jedna z twoich flot dotarła na współrzędne %s. Niestety, kolonizatorzy odkryli, że planeta jest już zamieszkana! Kompletnie zdemoralizowani, wracają do domu."
sys_debris: "Pole zniszczeń"
sys_def_rebuild: "Część obrony udało się naprawić:"
sys_defender_lostunits: "Straty obrońcy:"
sys_defender_won: "Obrońca wygrał bitwę! Gubernator ogłasza dzień wolny od pracy, a mieszkańcy świętują, oglądają pokazy fajerwerków i upijają się do nieprzytomności."
sys_destroyed: "Zniszczone"
sys_destruc_echec: "Trzęsienia ziemi przetaczają się po planecie, lecz coś idzie nie tak: Gwiazdy Śmierci implodują, rozpadając się na tysiące kawałków. Fala uderzeniowa niszczy całą flotę."
sys_destruc_lune: "Szansa na zniszczenie księżyca: %d%%"
sys_destruc_mess1: "Gwiazdy Śmierci skierowały swoją ogromną energię na księżyc."
sys_destruc_null: "Gwiazdy Śmierci nie zdążyły się w pełni naładować przed strzałem.<br> Księżyc nie został zniszczony."
sys_destruc_reussi: "Wiązki Gwiazd Śmierci dosięgnęły księżyca i rozerwały go na strzępy. <br>Księżyc został zniszczony!"
sys_destruc_rip: "Szansa na samozniszczenie floty: %d%%"
sys_destruc_stop: "Obrońca skutecznie zablokował zniszczenie księżyca."
sys_destruc_title: "Następujące floty stają naprzeciw siebie przy próbie zniszczenia księżyca:"
sys_expe_attack_1_1_1: "Zdesperowany kosmiczny pirat próbował przejąć naszą flotę ekspedycyjną."
sys_expe_attack_1_1_2: "Jacyś prymitywni barbarzyńcy zaatakowali nas czymś, czego nie powinno się nazywać statkami kosmicznymi. Ich okręty były w opłakanym stanie. Gdyby ich siła ognia była poważnym zagrożeniem, musielibyśmy odpowiedzieć ogniem."
sys_expe_attack_1_1_3: "Przechwyciliśmy kilka komunikatów radiowych bardzo pijanych piratów. Najwyraźniej zostaniemy zaatakowani."
sys_expe_attack_1_1_4: "Musieliśmy stoczyć walkę z piratami, ale na szczęście byliśmy liczniejsi."
sys_expe_attack_1_1_5: "Nasza flota donosi, że niejaki Moa Tikarr i jego załoga zażądali bezwarunkowej kapitulacji. Nasze Imperium nigdy się nie poddaje! Jeśli mówią poważnie, przekonają się, że doskonale umiemy się bronić."
sys_expe_attack_1_2_1: "Twoja flota ekspedycyjna natknęła się nieoczekiwanie na kosmicznych piratów. Niestety nie chcieli się poddać, więc bitwa stała się nieunikniona."
sys_expe_attack_1_2_2: "Wlecieliśmy prosto w zasadzkę gwiezdnych piratów! Nie poddamy się jednak bez walki. Będziesz z nas dumny, Imperatorze!"
sys_expe_attack_1_2_3: "Odebraliśmy sygnał SOS od innej floty ekspedycyjnej, więc zgodnie z procedurami przerwaliśmy ekspedycję, żeby pomóc. Na miejscu okazało się, że wezwanie było pułapką przebiegłych piratów. Bitwa była nieunikniona."
sys_expe_attack_1_3_1: "Przechwycone sygnały nie pochodziły od nieznanych obcych, tylko z tajnej bazy piratów! Piraci nie byli zachwyceni naszą obecnością w ich sektorze. Nie było negocjacji – od razu otworzyliśmy ogień z okrzykiem: na pohybel pirackim szumowinom!"
sys_expe_attack_1_3_2: "Wracając z obiecujących odczytów z pobliskiego pasa asteroid, wpadliśmy na piratów, którzy nagle wypadli na nas z nadprzestrzeni. Jeśli dopisze nam szczęście, szybko ich rozgonimy i może jeszcze uda się zebrać trochę surowców."
sys_expe_attack_1_3_3: "Właśnie dostaliśmy pilną wiadomość od dowódcy ekspedycji: „Lecą na nas! Wyskoczyli z nadprzestrzeni. Na szczęście to tylko piraci, więc mamy szansę. Będziemy walczyć!”"
sys_expe_attack_2_1_1: "Twoja flota ekspedycyjna miała niezbyt gościnny pierwszy kontakt z nieznanym gatunkiem. Niestety zaczął się od pocisków wystrzelonych w nasze okręty..."
sys_expe_attack_2_1_2: "Panie! Badaliśmy właśnie niezwykle interesującą anomalię związaną z Ciemną Materią, gdy z nadprzestrzeni wyłoniły się okręty, jakich jeszcze nie widzieliśmy. Bez ostrzeżenia otworzyły ogień. Będziemy mieli szczęście, jeśli ktokolwiek to przeżyje..."
sys_expe_attack_2_1_3: "Nasza ekspedycja napotkała niewielką grupę nieznanych okrętów. Próbowaliśmy się z nimi skontaktować przez radio i sygnałami świetlnymi – bez żadnej reakcji. Gdy postanowiliśmy odlecieć i badać dalsze obszary galaktyki, obca flota zaatakowała. Ta mała grupa okazała się zabójczo silna..."
sys_expe_attack_2_1_4: "Flota ekspedycyjna zgłasza kontakt z nieznanymi okrętami. Nie udało się rozszyfrować ich komunikatów, ale wygląda na to, że uzbrajają działa."
sys_expe_attack_2_2_1: "Napotkaliśmy nieznaną rasę obcych, początkowo nastawioną pokojowo. Przybyli na nasz okręt dowodzenia, wymieniliśmy się darami i zaprosiliśmy ich na uroczysty obiad. Niestety, podanie ośmiorniczek kosmitom wyglądającym jak wielkie ośmiornice nie było najlepszym pomysłem. Gdy delegacja zobaczyła potrawy, z oburzeniem coś zabulgotała i teleportowała się na swoje okręty. Nie zdążyliśmy nawet dokończyć posiłku – kosmici otworzyli ogień."
sys_expe_attack_2_2_2: "Twoja flota ekspedycyjna najwyraźniej naruszyła terytorium nieznanej wcześniej, ale wyjątkowo agresywnej rasy obcych. Nie chcieli słuchać wyjaśnień. Musieliśmy podjąć walkę."
sys_expe_attack_2_2_3: "Połączenie z naszą flotą ekspedycyjną zostało nagle zerwane. Ostatnie, co usłyszeliśmy, to że flota jest pod ciężkim ostrzałem. Nie udało się zidentyfikować napastników."
sys_expe_attack_2_3_1: "Imperatorze! Twoja ekspedycja natknęła się na obcą flotę inwazyjną i zgłasza zażarte bitwy! Musimy się przygotować na stratę całej floty."
sys_expe_attack_2_3_2: "Duża grupa krystalicznych statków nieznanego pochodzenia jest na kursie kolizyjnym z naszą flotą ekspedycyjną. Kapitanowie zrobią, co w ich mocy, ale musimy przygotować się na najgorsze."
sys_expe_attack_2_3_3: "Mamy drobne problemy z poprawną wymową dialektu obcych. Nasz dyplomata przypadkowo zawołał „Ognia!” zamiast „Pokój!”"
sys_expe_attackname_1: Piraci
sys_expe_attackname_2: Obcy
sys_expe_back_home: "Twoja flota wróciła do %1$s %2$s z ekspedycji na %3$s."
sys_expe_back_home_ress: Flota dostarczyła %s %s, %s %s i %s %s.
sys_expe_back_home_ships_flound: "Znaleziono następujące statki:"
sys_expe_back_home_ships_lost: 'Stracono następujące statki:'
sys_expe_depleted_max_1: "Wpis z dziennika oficera łączności: Gdybyśmy kiedyś poczuli się zagrożeni, zawsze możemy połączyć siły ze wszystkimi innymi ekspedycjami latającymi w tej okolicy."
sys_expe_depleted_max_2: "Wpis z dziennika oficera łączności: Jeśli tak dalej pójdzie, będziemy musieli ustawić boje nawigacyjne, żeby ogarnąć cały ten ruch."
sys_expe_depleted_max_3: "Wpis z dziennika oficera łączności: Może bardziej przydałby się tu sklep z pamiątkami niż kolejna ekspedycja."
sys_expe_depleted_med_1: "Wpis z dziennika oficera łączności: Znaleźliśmy ślady kilku flot ekspedycyjnych w okolicy. Wracamy do domu."
sys_expe_depleted_med_2: >-
  Wpis z dziennika oficera łączności: Nawiązaliśmy przyjazny kontakt radiowy z
  kilkoma innymi ekspedycjami w tym sektorze.
sys_expe_depleted_med_3: "Wpis z dziennika oficera łączności: Uczciliśmy koniec ekspedycji razem z załogą innej floty ekspedycyjnej z tego samego sektora. Oni też nie mają nic nowego do zgłoszenia."
sys_expe_depleted_min_1: >-
  Wpis z dziennika oficera łączności: Wygląda na to, że ludzie byli już
  wcześniej w tej części galaktyki.
sys_expe_depleted_min_2: "Wpis z dziennika oficera łączności: Znaleźliśmy szczątki starych statków kosmicznych. Nie jesteśmy tu pierwsi."
sys_expe_depleted_min_3: "Wpis z dziennika oficera łączności: O mało nie zderzyliśmy się z inną flotą ekspedycyjną. Nigdy nie sądziłem, że ktoś jeszcze się tu zapuści."
sys_expe_depleted_not_1: >-
  Wpis z dziennika oficera łączności: Wygląda na to, że ta część wszechświata
  nie została jeszcze zbadana.
sys_expe_depleted_not_2: >-
  Wpis z dziennika oficera łączności: To wspaniałe uczucie być pierwszymi
  podróżującymi przez niezbadany sektor.
sys_expe_feqeuence_few: Ponad 10 wypraw w ciągu ostatnich 24 godzin
sys_expe_feqeuence_many: Ponad 50 wypraw w ciągu ostatnich 24 godzin
sys_expe_feqeuence_medium: Ponad 25 wypraw w ciągu ostatnich 24 godzin
sys_expe_found_goods: "Wydobyto: %s %s."
sys_expe_found_ress_1_1: "Twoja ekspedycja natrafiła na niewielkie skupisko asteroid, z którego udało się wydobyć trochę surowców."
sys_expe_found_ress_1_2: "Na odległej planetoidzie znaleziono kilka łatwo dostępnych złóż i z powodzeniem wydobyto surowce."
sys_expe_found_ress_1_3: "W czasie ekspedycji nasza flota musiała awaryjnie lądować na planecie, której nie ma na mapach. Trudno w to uwierzyć, ale odpady, które wyrzuciliśmy, tak zachwyciły mieszkające tu istoty, że w podzięce podarowały nam cenne surowce. Właśnie taką niewidzialną rękę rynku lubimy."
sys_expe_found_ress_1_4: "Ekspedycja odkryła skażoną promieniowaniem planetę z silnie trującą atmosferą. Skany wykazały jednak, że jest tam mnóstwo surowców. Automatyczne drony wydobyły z niej, ile się dało."
sys_expe_found_ress_2_1: "Ekspedycja znalazła starożytny konwój frachtowców, w pełni załadowany, ale opuszczony. Udało się odzyskać część surowców."
sys_expe_found_ress_2_2: "Twoja ekspedycja odkryła ogromne złoża surowców na małym księżycu z własną atmosferą. Załoga właśnie wydobywa ten skarb."
sys_expe_found_ress_2_3: "Spotkaliśmy mały konwój cywilnych statków, które pilnie potrzebowały żywności i leków. W zamian dostaliśmy sporą ilość przydatnych surowców i wdzięczność. Czasem lepiej okazać miłosierdzie, niż od razu otwierać ogień."
sys_expe_found_ress_3_1: "Twoja flota ekspedycyjna zgłasza odkrycie gigantycznego wraku okrętu obcych. Naukowcy nie mają pojęcia, jak uruchomić ten cud technologii, więc dowództwo floty zdecydowało się pociąć go na części i odzyskać cenne surowce."
sys_expe_found_ress_3_2: "Pas asteroid wokół nieznanej planety kryje ogromne ilości surowców, tak potrzebnych naszemu Imperium. Flota ekspedycyjna wraca z pełnymi magazynami!"
sys_expe_found_ress_logbook_1: "Wpis z dziennika pierwszego oficera: Wykorzystaliśmy każdy skrawek wolnego miejsca, a i tak nie zabraliśmy wszystkich znalezionych surowców."
sys_expe_found_ress_logbook_2: "Wpis z dziennika pierwszego oficera: Gdybyśmy tylko mieli kilka frachtowców więcej! Teraz musimy zostawić mnóstwo surowców."
sys_expe_found_ress_logbook_3: "Wpis z dziennika pierwszego oficera: Wyrzuciliśmy już wszystko, czego już nie potrzebujemy, a i tak nie da się zrobić dość miejsca na wszystkie znalezione surowce."
sys_expe_found_ress_logbook_4: "Wpis z dziennika pierwszego oficera: Nawet po przerobieniu stołówki i wszystkich salonów na ładownie nie zabierzemy wszystkich znalezionych surowców."
sys_expe_found_ships_1_1: "Ekspedycja natrafiła na wraki poprzedniej ekspedycji! Nasi technicy sprawdzają, czy dałoby się przywrócić część z nich do działania."
sys_expe_found_ships_1_2: "Znaleźliśmy opuszczoną bazę piratów. W hangarze nadal stoi kilka starych statków. Technicy sprawdzają, czy któryś nadaje się jeszcze do użytku."
sys_expe_found_ships_1_3: "Nasza ekspedycja trafiła na planetę niemal całkowicie zniszczoną przez wojny. Na orbicie dryfują wraki. Technicy próbują część z nich naprawić, a pokładowy historyk stara się dociec, co się tu właściwie wydarzyło."
sys_expe_found_ships_1_4: "Ekspedycja natknęła się na starą stację kosmiczną, opuszczoną chyba od wieków. W hangarach fortecy znaleziono kilka statków. Technikom udało się przywrócić część z nich do lotu."
sys_expe_found_ships_2_1: "Znaleźliśmy szczątki armady. Technicy ekspedycji od razu weszli na częściowo ocalałe statki i zdołali naprawić niektóre z nich."
sys_expe_found_ships_2_2: "Ekspedycja odkryła starą automatyczną stocznię, w której część statków wciąż była w produkcji. Po przywróceniu zasilania nasi technicy dokończyli ich budowę."
sys_expe_found_ships_3_1: "Znaleźliśmy gigantyczny cmentarz statków. Technikom ekspedycji udało się przywrócić do działania jeden czy dwa z nich."
sys_expe_found_ships_3_2: "Odkryliśmy planetę z pozostałościami cywilizacji. Z kosmosu dostrzegliśmy też gigantyczną, wciąż nienaruszoną stację statków. Część techników i pilotów zeszła na powierzchnię, żeby sprawdzić, czy da się odzyskać kilka statków."
sys_expe_found_ships_logbook_1: "Wpis z dziennika oficera maszynowni: Gdybyśmy zabrali ze sobą trochę więcej statków, łatwo moglibyśmy zabrać do domu kilka z tych piękności!"
sys_expe_found_ships_logbook_2: "Wpis z dziennika oficera maszynowni: Niestety nie mieliśmy możliwości sprowadzić z powrotem wszystkich statków odkrytych podczas tej misji."
sys_expe_found_ships_logbook_3: "Wpis z dziennika oficera maszynowni: Niestety nie mamy dość ładowności, żeby zabrać ze sobą wszystkie znalezione statki."
sys_expe_found_ships_nothing: "Nie znaleziono żadnych statków."
sys_expe_lost_fleet_1: "Z ekspedycji została tylko ta wiadomość radiowa: Zzzrt, Boże!... Krrrzzzt, to zzzrt widzi krgzzzz tak, jak Krzzzzzzzztzzzz..."
sys_expe_lost_fleet_2: "Ostatnie, co dostaliśmy z ekspedycji, to wyjątkowo dobre zbliżenia otwierającej się czarnej dziury."
sys_expe_lost_fleet_3: "Awaria jądrowa na jednym z okrętów dowodzenia wywołała reakcję łańcuchową, która zniszczyła całą ekspedycję w spektakularnym wybuchu."
sys_expe_lost_fleet_4: "Flota ekspedycyjna nie wróciła ze skoku w nadprzestrzeń. Naukowcy wciąż łamią sobie głowy, co się stało, ale wygląda na to, że flota przepadła na zawsze."
sys_expe_nothing_1: "Ta ekspedycja nie przywozi nic ekscytującego, poza kilkoma ciekawskimi zwierzątkami z nieznanej, bagnistej planety. Z wyglądu przypominają niezdarne kury. Przynajmniej są dość smaczne."
sys_expe_nothing_2: "Twoja ekspedycja zrobiła piękne zdjęcia supernowej, ale poza tym nie przyniosła żadnych nowych odkryć. Za to zdjęcie ma spore szanse w tegorocznym konkursie na Najlepsze Zdjęcie we Wszechświecie."
sys_expe_nothing_3: "Dziwny wirus komputerowy sparaliżował nawigację zaraz po opuszczeniu układu słonecznego. Przez to cała flota ekspedycyjna latała w kółko. Nie trzeba dodawać, że ekspedycja nie była specjalnie udana."
sys_expe_nothing_4: "Forma życia z czystej energii sprawiła, że wszyscy członkowie ekspedycji przez kilka dni wpatrywali się w hipnotyczne symbole na ekranach. Gdy większość w końcu odzyskała jasność umysłu, ekspedycję trzeba było przerwać z powodu braku deuterium."
sys_expe_nothing_5: "Cóż, przynajmniej już wiemy, że czerwone anomalie klasy 5 nie tylko chaotycznie wpływają na systemy statku, ale potrafią też wywołać masowe halucynacje u załogi. Niestety, nic więcej w tej ekspedycji nie odkryto."
sys_expe_nothing_6: "Mimo obiecujących wstępnych skanów tego sektora, wróciliśmy niestety z pustymi rękami."
sys_expe_nothing_7: "Może jednak nie warto było świętować urodzin kapitana na tej odległej planecie. Paskudna gorączka krwotoczna zwaliła z nóg większość załogi, a dotkliwe braki kadrowe pokrzyżowały ekspedycję."
sys_expe_nothing_8: "Twoja ekspedycja nie znalazła nic poza bezkresną pustką kosmosu. Nie było nawet maleńkiej asteroidy, promieniowania czy cząstek – niczego, co choć trochę uatrakcyjniłoby wyprawę."
sys_expe_nothing_9: "Awaria reaktora na okręcie dowodzenia o mało nie zniszczyła całej ekspedycji. Na szczęście technicy stanęli na wysokości zadania i zapobiegli najgorszemu. Naprawa zajęła jednak tyle czasu, że ekspedycja wróciła, niczego nie osiągnąwszy."
sys_expe_report: Raport ekspedycji
sys_expe_report_msg: "Raport z ekspedycji floty %s %s na %s:"
sys_expe_time_fast_1: "Nieprzewidziane sprzężenie zwrotne w cewkach energetycznych napędu przyspieszyło powrót ekspedycji, więc wróci wcześniej, niż zakładano. Wstępne raporty mówią jednak, że nie ma nic więcej do zgłoszenia."
sys_expe_time_fast_2: "Nieco zbyt śmiały nowy dowódca użył niestabilnego tunelu czasoprzestrzennego, żeby skrócić drogę powrotną – i się udało! Sama ekspedycja nie przyniosła jednak żadnych nowych odkryć."
sys_expe_time_fast_3: "Twoja ekspedycja nie zgłosiła żadnych anomalii w badanym sektorze. Podczas lotu powrotnego flota wpadła jednak w wiatr słoneczny, który znacznie przyspieszył podróż. Ekspedycja wróci do domu nieco wcześniej, niż się spodziewano."
sys_expe_time_slow_1: "Poważny błąd nawigatora wysłał flotę w zupełnie złe miejsce. Droga powrotna trwa przez to znacznie dłużej."
sys_expe_time_slow_2: "Z nieznanych dotąd przyczyn skok floty poszedł zupełnie nie tak. O mało nie wylądowała w sercu gwiazdy! Na szczęście trafiła do znanego układu, ale droga powrotna potrwa dłużej, niż planowano."
sys_expe_time_slow_3: "Nowy moduł nawigacji wciąż wydaje się nękany błędami. Flota ekspedycyjna nie tylko poleciała w zupełnie złą stronę, ale też zużyła całe deuterium! Rozczarowana, wraca teraz na zasilaniu awaryjnym."
sys_expe_time_slow_4: "Twoja ekspedycja wleciała w sektor ze wzmożonymi burzami cząstek. Przeciążyło to magazyny energii i główne systemy wszystkich statków przestały działać. Mechanicy zapobiegli najgorszemu, ale ekspedycja wróci teraz ze sporym opóźnieniem."
sys_expe_time_slow_5: "Okręt flagowy twojej floty ekspedycyjnej zderzył się z obcym statkiem, który bez ostrzeżenia wyskoczył prosto w środek floty. Obcy statek eksplodował, a szkody na okręcie flagowym są poważne. Gdy najpoważniejsze naprawy zostaną ukończone, twoje statki ruszą w drogę powrotną, bo w obecnym stanie ekspedycja nie może być kontynuowana."
sys_expe_time_slow_6: "Wiatr gwiazdowy czerwonego olbrzyma zakłócił skok ekspedycji, przez co systemy nawigacyjne całkowicie źle obliczyły drogę powrotną. W rezultacie ekspedycja znalazła się w bezkresnej pustce między nieznanymi gwiazdami."
