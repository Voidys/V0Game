abuse_link_device: одно устройство
abuse_graph: Кластеры потоков ценности
abuse_graph_info: 'Игроки, связанные потоками ценности за последние %s дн. (фиксированный период): транспорты, удержания, передачи кораблей (по стоимости постройки), рыночные сделки (обе стороны) и добыча в атаках, суммированные в обоих направлениях. Учитываются только пары, между которыми перемещено не менее %s единиц металла и %s потоков; выводятся группы из двух и более связанных игроков (топ %s по стоимости). Чистая = стоимость самой односторонней пары кластера (доля в его общей стоимости). Флаги связей показывают, есть ли у участников общий IP, устройство или мультигруппа с другим участником. Строки читаются с ограничением на источник.'
