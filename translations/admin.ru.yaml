hof_cleared: Данные Зала славы удалены.
hof_error_nofile: Не загружен подходящий файл.
hof_error_invalid: 'Импорт отклонён:'
se_bash_war_exempt: Войны снимают лимит бэша
se_bash_war_exempt_info: 'Атаки между альянсами в состоянии войны (принятые, старше одного дня) не учитываются в лимитах бэша. Выкл.: атаки во время войны учитываются как все остальные.'
se_honor_pair_cap: Честные бои на пару (24 ч)
se_honor_pair_cap_info: Сколько честных боёв между одними и теми же двумя игроками (в любом направлении) приносят честь за 24 часа. Дальнейшие бои нейтральны. 0 = без ограничений.
se_market_push_tolerance: Допуск на проталкивание через рынок
se_market_push_tolerance_info: Допустимая разница стоимости сделки на рынке в процентах (0-90), после которой сделка считается проталкиванием. По умолчанию 30.
se_transport_push_check: Защита от проталкивания транспортами
se_transport_push_check_info: Отклоняет транспорты, удержания и передачи (ресурсы и корабли) другому игроку, если за последние 7 дней отправленная ему стоимость превышает возвращённую более чем на лимит ниже.
se_transport_push_limit: Лимит проталкивания транспортом
se_transport_push_limit_info: Стоимость груза в единицах дейтерия (по рыночным курсам), выше которой действует защита. 0 = защита выключена.
se_depot_cost_real_consumption: Стоимость склада по реальному расходу
se_depot_cost_real_consumption_info: Склад альянса берёт фактический расход топлива флота (с учётом двигателей и технологий топлива владельца) / 10 в час вместо базового расхода / 10.
se_hours: Часы
se_remember_me_days: '«Оставаться в системе» действует'
se_remember_me_days_info: 'Дни, в течение которых вход с отмеченной галочкой «Оставаться в системе» сохраняется после перезапуска браузера и истёкших сеансов. Смена пароля его завершает. 0 отключает эту опцию.'
se_session_lifetime: Сеанс истекает после бездействия длиной
se_session_lifetime_info: 'Часы без каких-либо запросов, после которых игрок выходит из системы («сеанс истёк»).'
