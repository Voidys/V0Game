se_community_links: Ссылки сообщества
se_discord_url: URL приглашения в Discord
se_discord_url_info: Ссылка-приглашение на ваш Discord-сервер (https://...). Показывается в меню, на странице входа, в письмах и текстах. Пусто — скрыто.
se_discord_widget_guild: ID сервера Discord (виджет онлайна)
se_discord_widget_guild_info: ID твоего сервера Discord (17-20 цифр; в Настройках сервера → Виджет должен быть включён пункт «Включить виджет сервера»). Показывает на стартовой странице блок с числом онлайн, обновляется каждые 5 минут. Пустое значение скрывает блок.
se_wiki_url: URL вики
se_wiki_url_info: Базовый URL внешней вики без завершающего слэша (https://...). Ссылки на вики в FAQ, обучении и правилах строятся из него. Пусто — скрыты.
se_donate_url: URL для пожертвований
se_donate_url_info: Ссылка для пожертвований (https://...), показывается в меню. Пусто — скрыта.
se_userscripts_url: URL userscripts
se_userscripts_url_info: Страница с userscripts для вашей игры (https://...), ссылка в настройках. Пусто — скрыта.
se_bots_alliances_enabled: Боты создают альянсы
se_bots_alliances_enabled_info: 'Боты основывают собственные альянсы и иногда вступают в другие. Выкл.: боты остаются одиночками, никуда не подают заявки и покидают альянсы, в которых состоят (альянсы, основанные ботом, остаются).'
se_bots_join_human_alliances: Боты могут вступать в альянсы игроков
se_bots_join_human_alliances_info: 'Боты могут подавать заявки и в альянсы, основанные живыми игроками. Выкл.: боты вступают только в альянсы ботов и покидают альянсы игроков.'
se_bot_reply_delay_hours: Задержка ответа (часы)
se_bot_reply_delay_hours_info: Сколько часов самое старое неотвеченное личное сообщение игрока ждёт, прежде чем бот ответит на все ожидающие сообщения этого игрока одним ответом. Это также минимальный промежуток между двумя сообщениями, которые бот пишет сам (реакции на атаку, подколки при рейде), одному и тому же игроку. 0 = без задержки.
se_bot_chatter: Боты общаются
se_bot_chatter_info: 'Вкл.: боты отвечают на личные сообщения. Выкл.: сообщения всё равно читаются и учитываются, но отправляются только реакции в бою (после атаки или рейда на игрока, который писал боту). Боты никогда не пишут первыми.'
