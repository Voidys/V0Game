abuse_thresholds: 'Пороги: пара переводов попадает в список от %s единиц металла в одну сторону при не более чем %s в ответ; рыночные пары — от %s сделок, помечаются при разнице выше %s. Пустой список означает, что ничего не достигло этих порогов (или в логах пусто), а не что ничего не происходило.'
abuse_transfers: Односторонние транспорты и удержания
abuse_transfers_info: Транспорты, удержания и передачи кораблей (не отозванные; корабли считаются по стоимости постройки) между двумя игроками, груз которых стоил не менее %s единиц металла в одну сторону, а в ответ вернулось не более %s этой стоимости. Сортировка по чистой стоимости; веса — сохранённые рыночные курсы.
abuse_trades: Повторяющиеся сделки на рынке
abuse_trades_info: Обмены ресурсами между одними и теми же двумя игроками, не менее %s раз. Соотношение = стоимость, отданная стороной, которая отдала больше, делённая на стоимость другой стороны (1.00 = по рыночному эталону); при разнице выше %s пара помечается.
