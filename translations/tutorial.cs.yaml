tutorial_goal:
  mission:
    '1': Zaútoč na jiného hráče
    '6': Pošli špionážní sondu k jinému hráči
    '7': Kolonizuj novou planetu
    '8': Recykluj pole trosek
    '15': Pošli expediční flotilu
  step6:
    '1': Přejmenuj svou planetu
    '2': Pošli jinému hráči žádost o přátelství
