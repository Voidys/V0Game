tutorial_text:
  step0: |-
    ยินดีต้อนรับสู่ {game_name}!<br><br>
    บทเรียนสั้นๆ นี้จะพาคุณรู้จักพื้นฐานของเกม<br>
    เราลิงก์ไปยังวิกิของเราบ่อยๆ เพราะบางเรื่องใส่ในบทเรียนไม่หมด คุณเปิดวิกิได้ทุกเมื่อจากเมนูทางซ้าย<br>
    คุณจะข้ามบทเรียนเมื่อไรก็ได้ แต่เริ่มใหม่ภายหลังไม่ได้<br><br>
    ขอให้โชคดี จักรพรรดิ!
  step1: "เป้าหมายของคุณคือทำคะแนนให้ได้มากที่สุด คุณได้ 1 คะแนนทุกครั้งที่ใช้ทรัพยากรครบ 1,000 หน่วย และแหล่งทรัพยากรที่ดีที่สุดคือเหมืองของคุณเอง<br>\nเริ่มจากเสบียงพื้นฐาน: คุณต้องมีโลหะและคริสตัลจากเหมือง รวมถึงพลังงานจากโรงไฟฟ้าพลังงานแสงอาทิตย์เพื่อให้เหมืองทำงาน ถ้าพลังงานไม่พอ เหมืองจะผลิตได้ต่ำกว่า 100%<br>\nอัปเกรดอาคารเหล่านี้ได้ในเมนู <b>อาคาร</b> คลิกชื่ออาคารเพื่อดูว่าเลเวลถัดไปให้อะไร และจะใช้พลังงานเท่าไร<br><br>\nอยากรู้เพิ่ม? ลองดู <b>วิกิ</b>: \n<a href=\"{wiki_url}/wiki/En/Rohstoffe\" target=\"_blank\">ทรัพยากร</a>"
  step2: |-
    เล่นด้วยกันสนุกกว่า ผู้เล่นส่วนใหญ่รวมตัวกันใน Discord ของเรา ที่นั่นคุณจะได้คำตอบและหาเพื่อนเล่นได้<br>
    ยังติดปัญหาอยู่? คุณเปิดทิกเก็ตขอความช่วยเหลือที่นี่ได้เหมือนกัน
  step3: "การปล้นดาวเคราะห์ของผู้เล่นคนอื่นเป็นอีกทางที่ได้ทรัพยากร และคุณก็อาจโดนเหมือนกัน ดังนั้นสร้างการป้องกันชุดแรกของคุณเลย!<br>\nแค่การป้องกันเล็กๆ ก็ช่วยปกป้องการผลิตของคุณตอนข้ามคืนได้<br><br>\nจำนวนอย่างเดียวไม่ตัดสินการต่อสู้ องค์ประกอบของกองเรือผู้โจมตีก็สำคัญด้วย<br>\nผู้โจมตีต้องฝ่าการป้องกันของคุณก่อนจึงจะปล้นได้ และทุกลำที่ต้องส่งมาจะลดกำไรของเขาและอาจทำให้เสียยานมากขึ้น<br>\nสร้างการป้องกันได้ใน<b>อู่ต่อยานอวกาศ</b> แท็บ <b>การป้องกัน</b> คุณต้องมีอู่ต่อยานอวกาศ (ซึ่งต้องมีโรงงานหุ่นยนต์ก่อน) และดิวทีเรียมบ้าง<br><br>\nนี่คือบทความที่เกี่ยวข้องในวิกิ: \n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">สิ่งป้องกัน</a>"
  step4: |-
    ทำให้เสบียงไหลเข้าอย่างต่อเนื่องด้วยการขยายเหมือง!<br>
    อาคาร ยาน การป้องกัน และงานวิจัยจะแพงขึ้นเรื่อยๆ ดังนั้นการผลิตของคุณต้องโตตามไปด้วย เปิดหน้าอาคารเลย แล้วอัปเกรดเหมืองทุกครั้งที่มีทรัพยากรพอ
  step5: "สร้างยานขนส่งเล็กสักลำสิ!<br>\nยานขนส่งเล็กเป็นยานขนส่งที่เร็วและคล่องตัว<br>\nเมื่อมีเครื่องยนต์อิมพัลส์ มันจะเร็วกว่ายานขนส่งใหญ่ในระยะทางไกล<br>\nใช้มันย้ายทรัพยากรระหว่างดาวเคราะห์ของคุณ ค้าขายกับผู้เล่นอื่น หรือไปปล้นพวกเขา<br><br>\nอ่านเพิ่มในวิกิ: \n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">ยานอวกาศ</a>"
  step6: |-
    ตั้งชื่อดาวเคราะห์ของคุณเพื่อให้จำง่าย ในหน้าภาพรวม คลิกชื่อดาวเคราะห์ที่ส่วนหัวของกล่องคะแนน ลองทำเลย<br><br>
    คุณยังส่งคำขอเป็นเพื่อนถึงผู้เล่นคนอื่นได้ เมื่อเขากดรับ คุณจะแชตกันได้สะดวกขึ้นและเห็นสถานะออนไลน์ของกันและกัน ไม่จำเป็นต้องอยู่พันธมิตรเดียวกัน เพื่อนยังตรึงกองเรือที่ดาวเคราะห์ของกันและกันได้ จึงช่วยกันป้องกันได้แม้อยู่นอกพันธมิตร<br><br>
    หรือเข้าพันธมิตรแล้วเล่นเป็นทีม คุณไม่ต้องส่งคำขอเป็นเพื่อนแยกเพื่อตรึงกองเรืออีกต่อไป ในพันธมิตรคุณส่งข้อความหมู่ และดูสถานะออนไลน์กับคะแนนของสมาชิกคนอื่นได้ ขึ้นอยู่กับยศในพันธมิตรของคุณ
  step7: |-
    หากอยากรู้ว่าผู้เล่นคนอื่นมีทรัพยากร อาคาร งานวิจัย ยาน และการป้องกันอะไรบ้าง คุณต้องสอดแนมเขา ส่งหุ่นสอดแนมไปหาผู้เล่นจากเมนูกองเรือ หรือจากหน้ากาแล็กซี<br>
    อย่าลืมว่าผู้เล่นคนอื่นก็สอดแนมคุณได้เหมือนกัน!
  step8: "การสำรวจอาจให้ทรัพยากร ยาน เหตุการณ์พิเศษ หรือความสูญเสีย หากอยากลอง ให้เอายานหนึ่งลำ เลือกตำแหน่งดาวเคราะห์ที่ 16 เป็นเป้าหมาย และเลือกภารกิจ \"สำรวจ\" ในเมนูกองเรือ<br>\nยานทุกประเภทเพิ่มขนาดกองเรือสำรวจของคุณ จนถึงขีดจำกัดที่ขนาดเหตุการณ์สูงสุดถูกใช้ครบ<br><br>\nวิกิอธิบายว่าคุณปรับอะไรได้บ้างเพื่อให้ได้กำไรสูงสุด: \n<a href=\"{wiki_url}/wiki/En/Expoanleitung\" target=\"_blank\">การสำรวจ</a>"
  step9: "ยิ่งตั้งอาณานิคมมาก คุณก็ยิ่งโตเร็ว เพราะผลิตทรัพยากรและสร้างยานได้พร้อมกันหลายดาว โปรดทราบว่าคุณจะตั้งถิ่นฐานที่ขอบในหรือขอบนอกของระบบได้ก็ต่อเมื่อเลเวลวิจัยฟิสิกส์ดาราศาสตร์สูงพอ ตัวยานอาณานิคมสร้างได้โดยไม่ต้องมีฟิสิกส์ดาราศาสตร์ แต่อาณานิคมแรกของคุณต้องใช้!<br><br>\nการตั้งอาณานิคมในระบบของคุณเองหรือถัดไปทันทีทำให้เส้นทางขนส่งสั้น ข้อเสียคือ ในช่วงท้ายเกม ผู้เล่นอาจวางอาณานิคมในระบบของคุณ ไม่ใช่เพื่อเหมือง แต่เพื่อเป็นฐานกองเรือชั่วคราว ซึ่งเรียกว่าอาณานิคมสำหรับปล้น (raid colony)<br><br>\nอ่านเพิ่มในวิกิ: \n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">ฟิสิกส์ดาราศาสตร์</a>"
  step10: "อยากได้ทรัพยากรเร็วขึ้น? โจมตีผู้เล่นคนอื่นสิ ชั่งต้นทุนกับผลตอบแทนให้การโจมตีคุ้มค่า และใช้รายงานสอดแนมกับเครื่องจำลองการรบช่วยวางแผน<br><br>\nระวังไว้! ผู้เล่นคนอื่นติดตามภารกิจของกองเรือได้หลายวิธี<br>\nการไม่เสียกองเรือที่ได้มาอย่างยากลำบากคือหนึ่งในส่วนสำคัญที่สุดของเกม<br><br>\nอย่าลืมอ่านหัวข้อวิกิเหล่านี้: \n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">การเซฟกองเรือ</a> - \n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">เซนเซอร์ฟาแลนซ์</a>"
  step10_u6: |-
    อยากได้ทรัพยากรเร็วขึ้น? โจมตีผู้เล่นคนอื่นสิ ชั่งต้นทุนกับผลตอบแทนให้การโจมตีคุ้มค่า และใช้รายงานสอดแนมกับเครื่องจำลองการรบช่วยวางแผน<br><br>
    ระวังไว้! ผู้เล่นคนอื่นติดตามภารกิจของกองเรือได้หลายวิธี<br>
    การไม่เสียกองเรือที่ได้มาอย่างยากลำบากคือหนึ่งในส่วนสำคัญที่สุดของเกม<br><br>
    อย่าลืมอ่านหัวข้อวิกิเหล่านี้:
    <a href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden" target="_blank">การเซฟกองเรือ</a>
  step11: |-
    เมื่อกองเรือถูกทำลาย จะทิ้งทุ่งเศษซากที่คุณเก็บเกี่ยวได้ สำหรับงานนี้คุณต้องมียานรีไซเคิล ซึ่งบรรทุกได้ลำละ 20,000 การกวาดล้างกองเรือใหญ่อาจเป็นแหล่งทรัพยากรชั้นดี<br><br>
    คุณยังส่งยานรีไซเคิลได้ตรงจากหน้ากาแล็กซีโดยคลิกที่ทุ่งเศษซาก แทนการใช้เมนูกองเรือ
  step12: |-
    ยินดีด้วย คุณเรียนจบบทเรียนแล้ว!<br><br>
    เกมนี้ยังมีอะไรให้เล่นอีกมาก<br>
    ตัวอย่างเช่น มีสไตล์การเล่นหลักๆ สามแบบ ซึ่งใช้เวลาต่างกันด้วย:<br>
    <ul>
    <li>ไมเนอร์ (Miner): ขยายเหมืองในอาณานิคมหลายแห่ง และบินยานขนส่งเป็นหลัก</li>
    <li>ฟลีตเตอร์ (Fleeter): ลงคะแนนส่วนใหญ่ในยานรบ แทบไม่มีการผลิตของตัวเอง และอยู่ได้ด้วยการปล้นผู้เล่นคนอื่น</li>
    <li>คอมเบอร์ (Comber): ผสมทั้งสองแบบ</li>
    </ul>
    ดวงจันทร์จะสำคัญในช่วงท้ายเกม และตอนนี้คุณน่าจะรู้จักเซนเซอร์ฟาแลนซ์แล้ว<br><br>
    ยังมีคำถาม? อ่านวิกิหรือถามชุมชนใน Discord
  step12_u6: |-
    ยินดีด้วย คุณเรียนจบบทเรียนแล้ว!<br><br>
    เกมนี้ยังมีอะไรให้เล่นอีกมาก<br>
    ตัวอย่างเช่น มีสไตล์การเล่นหลักๆ สามแบบ ซึ่งใช้เวลาต่างกันด้วย:<br>
    <ul>
    <li>ไมเนอร์ (Miner): ขยายเหมืองในอาณานิคมหลายแห่ง และบินยานขนส่งเป็นหลัก</li>
    <li>ฟลีตเตอร์ (Fleeter): ลงคะแนนส่วนใหญ่ในยานรบ แทบไม่มีการผลิตของตัวเอง และอยู่ได้ด้วยการปล้นผู้เล่นคนอื่น</li>
    <li>คอมเบอร์ (Comber): ผสมทั้งสองแบบ</li>
    </ul>
    ยังมีคำถาม? อ่านวิกิหรือถามชุมชนใน Discord
tutorial_title:
  step0: "ยินดีต้อนรับ จักรพรรดิ!"
  step1: "ได้เวลาขุดแล้ว!"
  step2: "มาทำความรู้จักผู้คนกัน!"
  step3: "อย่าทิ้งดาวเคราะห์ไว้โดยไม่มีการป้องกัน!"
  step4: "คิดล่วงหน้าไว้!"
  step5: "ยาน เราต้องการยาน!"
  step6: "ตั้งชื่อดาวเคราะห์และหาเพื่อน!"
  step7: "ดูซิว่าคนอื่นมีอะไร!"
  step8: "สู่ดินแดนที่ไม่รู้จัก!"
  step9: "ดาวดวงเดียวไม่เคยพอ!"
  step10: "เบื่อรอเหมืองแล้วหรือยัง?"
  step11: "ได้เวลาเก็บขยะ!"
  step12: "คุณทำได้แล้ว!"
