  '231': >-
    Menší, rychlejší Hvězda smrti, která neumí ničit měsíce. Behemot je
    smrtící proti flotilám.
  '232': >-
    Rychlejší, výbušnější, vždycky dobré překvapení.
    Titán prázdnoty je postrachem měsíců.
