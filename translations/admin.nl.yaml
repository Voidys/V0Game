se_bots_timezone_spread_hours: "Spreiding van de persoonlijke tijdzone (uren)"
se_bots_timezone_spread_hours_info: "Elke bot krijgt een vaste persoonlijke afwijking van maximaal dit aantal uren (plus of min) ten opzichte van de serverklok, zodat bots van één profiel niet allemaal op hetzelfde uur spelen (0 = uit)."
se_bots_fleetsave_enabled: "Bots brengen vloten in veiligheid"
se_bots_fleetsave_enabled_info: "Uit: bots brengen hun vloot nooit in veiligheid, niet aan het einde van een sessie en niet bij een naderende aanval."
se_bots_fleetsave_keep_percent: "Grondstoffen die een vlootvlucht thuis laat (%)"
