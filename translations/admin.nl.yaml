se_bots_defense_weight_percent: "Gewicht van verdedigingsbouw (%)"
se_bots_defense_weight_percent_info: "Vermenigvuldiger voor hoezeer bots verdedigingsbouw verkiezen (100 = klassiek)."
se_bots_growth_speed_percent: "Groeisnelheid (%)"
se_bots_growth_speed_percent_info: "Vermenigvuldiger voor de dagelijkse vaardigheidswinst van de botprofielen (100 = klassiek; profielen zonder vaardigheidswinst blijven ongewijzigd)."
se_bots_growth_bonus: "Extra vaardigheidswinst per dag (duizendsten)"
se_bots_growth_bonus_info: "Opgeteld bij de dagelijkse vaardigheidswinst van elke bot (10 = één procentpunt per dag), begrensd door de maximale vaardigheid van het profiel."
se_bots_max_planets: "Maximaal aantal planeten per bot"
se_bots_max_planets_info: "Bots stoppen met koloniseren bij dit aantal planeten (0 = alleen de limiet van het spel geldt)."
se_bots_activity_percent: "Activiteitsvermenigvuldiger (%)"
se_bots_activity_percent_info: "Schaalt de kans per uur dat een bot online komt (100 = de tabel van het profiel; boven 100 loggen bots vaker in)."
se_bots_hidden_rhythm_percent: "Aandeel bots met een verborgen ritme (%)"
se_bots_hidden_rhythm_percent_info: "Deze bots verschuiven hun dagritme elke dag met een ander bedrag en zijn dus niet te voorspellen aan hun online-tijden."
se_bots_revenge: "Wraak"
se_bots_revenge_info: "Bots koesteren wrok (stijgt als een speler hen aanvalt of bespioneert, daalt 10 % per dag) en verkennen en counteren de meest vijandige speler binnen bereik als hun raidplanner een winbaar plan vindt. De limieten per speler en dag blijven gelden."
se_bots_bot_acs: "Bot-ACS"
se_bots_bot_acs_info: "Een bot die een doel niet alleen aankan, opent een ACS-groep en nodigt bondgenootbots (zelfde alliantie) uit die online zijn; ze sluiten zich aan zoals spelers. De limieten per speler en dag tellen een groep als één aanval."
se_bots_recycling: "Recyclen"
se_bots_recycling_info: "Bots sturen recyclers naar puinvelden die ze rond hun planeten zien (eigen gevechten eerst) als de oogst de brandstof overtreft, en bouwen een paar recyclers als ze er geen hebben."
se_bots_moons: "Manen"
se_bots_moons_info: "Bots gebruiken hun manen: vloten worden bij het uitloggen op de maan gestationeerd en raids kunnen vanaf een maan starten."
se_bots_missiles: "Raketten"
se_bots_missiles_info: "Bots met een raketsilo (niveau 4), impulsaandrijving en interplanetaire raketten schieten op de verdediging van een doel dat een raid blokkeert, spioneren opnieuw en vallen aan. Met deze schakelaar aan bouwen bots silo’s en raketten."
se_bots_warmonger: "Oorlogsstoker in het eindspel"
se_bots_warmonger_info: "Vanaf de onderstaande punten raidt een bot vaker, accepteert minder winst en neemt ook actieve spelers als doel. Raidplanner en de limieten per speler blijven gelden."
