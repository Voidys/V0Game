se_social_client_secret: "Client secret"
se_social_client_secret_info: "Wordt nooit meer getoond. Laat leeg om het opgeslagen secret te behouden."
se_social_callback: "Callback-URL"
se_social_callback_info: "Registreer precies dit adres als redirect-/callback-URL bij de aanbieder."
se_social_create_app: "App aanmaken"
se_social_discord_help: "Discord Developer Portal: New Application, daarna OAuth2: voeg de redirect toe, kopieer client-ID en client secret."
se_social_facebook_help: "Meta for Developers: maak een app met de use case Facebook Login en voeg de URL toe bij geldige OAuth-redirect-URI's. Het e-mailadres van Facebook geldt nooit als geverifieerd: nieuwe spelers kunnen zich er niet mee registreren en bestaande accounts worden niet via e-mail gekoppeld; koppelen via de accountinstellingen werkt wel."
se_social_github_help: "GitHub Settings, Developer settings, OAuth Apps: New OAuth App, vul de callback-URL in als Authorization callback URL."
se_social_google_help: "Google Cloud Console, API's en services, Inloggegevens: maak een OAuth-client-ID van het type Webapplicatie en voeg de callback-URL toe bij geautoriseerde redirect-URI's."
se_social_scopes: "Gevraagde scopes: %s"
se_del_user_automatic_on: "Auto-delete inactive players"
se_del_user_automatic_on_info: "Switch for the automatic deletion of normal inactive players (not in vacation mode, not banned) after the number of days set above. Off: inactive players are never deleted automatically."
