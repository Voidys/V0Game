se_discord_url: Discord-uitnodigingslink
se_discord_url_info: Uitnodigingslink van je Discord-server (https://...). Wordt getoond in het menu, de loginpagina, e-mails en teksten. Leeg verbergt hem.
se_discord_widget_guild: Discord-server-ID (online-widget)
se_discord_widget_guild_info: ID van je Discord-server (17-20 cijfers; Serverinstellingen → Widget, "Serverwidget inschakelen" moet aanstaan). Toont een vak met het aantal online leden op de startpagina, elke 5 minuten bijgewerkt. Leeg verbergt het.
se_wiki_url: Wiki-URL
se_wiki_url_info: Basis-URL van een externe wiki, zonder slash aan het eind (https://...). Wikilinks in de FAQ, tutorial en regels worden hiermee opgebouwd. Leeg verbergt ze.
se_donate_url: Donatie-URL
se_donate_url_info: Link voor donaties (https://...), getoond in het menu. Leeg verbergt hem.
se_userscripts_url: Userscripts-URL
se_userscripts_url_info: Pagina met uitleg over userscripts voor je spel (https://...), gelinkt in de instellingen. Leeg verbergt hem.
se_bots_alliances_enabled: Bots vormen allianties
se_bots_alliances_enabled_info: 'Bots richten hun eigen allianties op en treden af en toe bij andere toe. Uit: bots blijven alleen, solliciteren nergens en verlaten allianties waar ze lid van zijn (allianties die een bot heeft opgericht blijven bestaan).'
se_bots_join_human_alliances: Bots mogen spelersallianties joinen
se_bots_join_human_alliances_info: 'Bots mogen ook solliciteren bij allianties die door menselijke spelers zijn opgericht. Uit: bots treden alleen toe tot allianties van bots en verlaten spelersallianties.'
se_bot_reply_delay_hours: Antwoordvertraging (uren)
se_bot_reply_delay_hours_info: Uren die het oudste onbeantwoorde privébericht van een speler wacht voordat een bot alle openstaande berichten van die speler in één antwoord beantwoordt. Ook de minimale tussenpoos tussen twee door bots gestarte berichten (reacties op aanvallen, uitdagingen bij overvallen) aan dezelfde speler. 0 = geen vertraging.
se_bot_chatter: Bots chatten
se_bot_chatter_info: 'Aan: bots antwoorden op privéberichten. Uit: berichten worden nog wel gelezen en geteld, maar er worden alleen gevechtsreacties verstuurd (na een aanval of overval op een speler die hen heeft geschreven). Bots schrijven nooit als eerste.'
