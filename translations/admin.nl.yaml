se_honor_pair_cap: Eervolle gevechten per paar (24 u)
se_honor_pair_cap_info: Hoeveel eervolle gevechten tussen dezelfde twee spelers (in beide richtingen) binnen 24 uur eer opleveren. Verdere gevechten tellen neutraal. 0 = onbeperkt.
se_market_push_tolerance: Tolerantie marktduw
se_market_push_tolerance_info: Geaccepteerd waardeverschil van een handel op de markt in procent (0-90) voordat die als duwen geldt. Standaard 30.
se_transport_push_check: Bescherming tegen transportduw
se_transport_push_check_info: Weigert transporten, vasthoudacties en overdrachten (lading en schepen) naar een andere speler wanneer de waarde die naar hen is gestuurd in de afgelopen 7 dagen de waarde die zij terugstuurden met meer dan onderstaande limiet overschrijdt.
se_transport_push_limit: Limiet transportduw
se_transport_push_limit_info: Ladingwaarde in deuteriumeenheden (marktverhoudingen) waarboven de bescherming geldt. 0 = bescherming uit.
se_depot_cost_real_consumption: Depotkosten op basis van werkelijk verbruik
se_depot_cost_real_consumption_info: Het alliantiedepot rekent het werkelijke brandstofverbruik van de vloot (met de aandrijf- en brandstoftechnieken van de eigenaar) / 10 per uur, in plaats van het basisverbruik / 10.
