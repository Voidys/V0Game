se_bots_recall_ratio_percent: "Terugroepen onder dit aandeel van de vereiste winstverhouding (%)"
se_bots_recall_ratio_percent_info: "Hetzelfde voor de verhouding van buit tot brandstof en verliezen."
se_bots_streak_loot_percent: "Raidreeks na een treffer ter waarde van (% van de minimale buit)"
