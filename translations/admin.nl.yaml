se_bots_escort_shares: "Escorte-aandelen in procent"
se_bots_escort_shares_info: "Aandelen van de oorlogsschepen van de planeet die als escorte worden geprobeerd, kleinste eerst, door komma’s gescheiden (bijv. 0, 15, 30, 50, 75, 100)."
