se_bots_raids_per_human_day_info: "Maximaal aantal botaanvallen op dezelfde menselijke speler binnen 24 uur, geteld over alle bots van het universum (anti-frustratielimiet, altijd actief)."
se_bots_human_cooldown_hours: "Pauze per speler tussen botaanvallen (uren)"
se_bots_human_cooldown_hours_info: "Na een botaanval op een mens valt hem zo lang geen enkele bot aan, en nooit zolang een andere botaanval op hem onderweg is."
se_bots_probes_per_human_day: "Sondevluchten per speler en dag (alle bots samen)"
se_bots_probes_per_human_day_info: "Maximaal aantal spionagevluchten van bots naar dezelfde menselijke speler binnen 24 uur, geteld over alle bots van het universum."
se_bots_scout_range_max: "Grootste verkenningsbereik (systemen)"
se_bots_scout_range_max_info: "Bots kijken nooit verder dan dit aantal systemen rond hun planeten, wat hun profiel ook zegt: ongeveer wat een speler in de galaxieweergave doorbladert."
se_bots_respy_jitter_seconds: "Willekeurige afwijking van de herspionage (seconden)"
