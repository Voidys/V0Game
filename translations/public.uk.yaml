registerWelcomePMText: Ласкаво просимо до %s! Спершу збудуй сонячну електростанцію, адже для виробництва ресурсів потрібна енергія. Відкрий «Споруди» в меню ліворуч і почни з сонячної електростанції.<br>Щойно з'явиться енергія, можна будувати шахти. Залишайся в «Спорудах» і збудуй шахту металу, а потім шахту кристалу.<br><br>Щоб будувати кораблі, потрібна верф. У меню «Технології» ліворуч видно, що потрібно, щоб її розблокувати.<br>Якщо виникнуть запитання, зазирни до FAQ, вікі або створи запит до підтримки.<br><br>Команда бажає тобі багато задоволення від вивчення всесвіту!
