Achievement_text:
  '1': Tuviste toda la noche para ti y no acertaste ni un solo disparo.
  '2': Tuviste flotas en movimiento sin parar durante 90 días.
  '3': Perdiste tu flota con el idioma configurado en «francés».
  '4': Investiga la tecnología iónica 10.
  '5': Investiga la tecnología de gravitón 2, solo porque puedes.
  '6': Uno de tus ataques volvió con solo 1 de metal, 1 de cristal y 1 de deuterio.
  '7': Derrota a una flota pirata o alienígena de al menos 10.000 naves en total. ¡El espacio es nuestro!
  '8': Pásate por la tertulia (los martes a las 20:00 en Discord).
  '9': Construye tu primera Estrella de la muerte.
  '10': Destruye la luna de un jugador.
  '11': Juega 14 días exclusivamente desde el móvil.
  '12': Un agujero negro destruyó tu flota en tu primera expedición.
  '13': Aleja tu flota cuando falten menos de 5 segundos para que llegue un ataque.
  '14': Pierde 10 flotas en agujeros negros. El vacío tiene hambre.
  '15': No consigas crear una luna en un planeta tras 10 intentos. A la próxima habrá más suerte.
  '16': Más de 250 de tus recicladores han vuelto vacíos.
  '17': Pon en cola al menos 5000 lanzamisiles en una sola orden de construcción.
  '18': Quema 5 millones de deuterio como combustible en un solo planeta en 24 horas.
  '19': Investiga la tecnología de blindaje 3.
  '20': Investiga la tecnología de blindaje 6.
  '21': Investiga la tecnología de blindaje 9.
  '22': Investiga la tecnología de blindaje 12.
  '23': Investiga la tecnología de blindaje 15.
  '24': Investiga la tecnología láser 12.
  '25': Participa en los récords.
  '26': Elimina el planeta que más puntos te da (al menos 100.000 puntos).
  '27': Investiga la red de investigación intergaláctica 1.
  '28': Mejora los tres almacenes de una luna al menos hasta el nivel 3.
  '29': Colectiviza la flota de un jugador con más puntos con un SAC de 5 jugadores.
  '30': Repele tú solo un SAC de 5 jugadores.
  '31': Manda a un jugador al modo vacaciones con tu ataque.
  '32': Saquea 1000 planetas con el tema «SetSail» activado. ¡Arr!
  '33': Vuelve del modo vacaciones.
  '34': Te atacan por primera vez. Bienvenido al universo.
  '35': Ataca a un jugador activo que tenga menos de 1/10 de tus puntos.
  '36': "Recibe un mensaje que contenga alguna de estas palabras:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Que te aniquile un SAC de 5 jugadores.
  '38': Ataca a miembros de tu propia alianza. ¿Fuego amigo, alguien?
  '39': Ataca a alguien con exactamente 42 naves.
  '40': Coloniza un planeta al menos a medio universo de distancia.
  '41': Bloquea un slot de flota durante una semana con una mala oferta del mercado.
  '42': Aparece 4 veces en el Salón de la Fama del lado perdedor.
  '43': "Gana una batalla mientras tu cuenta está marcada como inactiva,\r\n            en uno de tus planetas al que antes haya llegado una flota con un tiempo de vuelo de más de 7 días."
  '44': Produce un recurso en un planeta durante más de 7 días con la energía por debajo del 100%.
  '45': Gana un ataque contra un jugador que esté en el top 5 de defensa.
  '46': Activa la protección anti-bashing disparando misiles interplanetarios.
  '47': Destruye 5 lunas.
  '48': Pierde 5 Estrellas de la muerte intentando destruir lunas. Ay.
  '49': Derriba una colonia poco después de crearla.
  '50': "Pierde todos tus satélites solares en un planeta con energía suficiente\r\n            para investigar la tecnología de gravitón, sin haberla investigado."
  '51': Gasta todo tu deuterio mientras navegas por la vista de galaxia.
  '52': Construye una Estrella de la muerte sin haber construido antes otras naves de combate (cazador ligero, cazador pesado, crucero, nave de batalla, bombardero, destructor o acorazado).
  '53': Ten el nivel máximo en 5 investigaciones al mismo tiempo.
  '54': Sincroniza un ataque a un jugador activo para que llegue el 01/01 a las 00:00:00.
  '55': Logro especial
