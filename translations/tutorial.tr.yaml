tutorial_text:
  step0: '{game_name}''e hoş geldin!<br><br>
  
    Bu kısa eğitim sana oyunun temellerini gösterecek.<br>
  
    Wiki''ye sık sık bağlantı veriyoruz, çünkü her şey eğitime sığmıyor. Wiki''ye istediğin zaman soldaki menüden ulaşabilirsin.<br>
  
    Eğitimi istediğin zaman atlayabilirsin ama sonradan yeniden başlatamazsın.<br><br>
  
    Bol şans, İmparator!'
  step1: "Hedefin: olabildiğince çok puan toplamak. Harcadığın her 1.000 kaynak için bir puan kazanırsın ve en iyi kaynak, kendi madenlerindir.<br>\nTemel kaynaklarla başla: Metal ve Kristal'i madenlerden alırsın, madenlerin çalışması için de Solar Enerji Santrali'nden Enerji gerekir. Enerji yetmezse madenlerin %100'ün altında üretir.<br>\nBu binaları <b>Binalar</b> menüsünden yükselt. Bir binanın adına tıklarsan bir sonraki seviyenin ne kazandırdığını ve ne kadar Enerji harcayacağını görürsün.<br><br>\nDaha fazlasını öğrenmek ister misin? <b>Wiki</b>'ye göz at: \n<a href=\"{wiki_url}/wiki/En/Rohstoffe\" target=\"_blank\">Kaynaklar</a>"
  step2: 'Birlikte oynamak daha eğlenceli. Çoğu oyuncu Discord sunucumuzda takılıyor; orada sorularına cevap bulabilir ve birlikte oynayacak insanlar tanıyabilirsin.<br>
  
    Hâlâ takıldın mı? Buradan destek bileti de açabilirsin.'
  step3: "Başka oyuncuların gezegenlerini yağmalamak kaynak kazanmanın bir yolu daha - ve aynısı sana da yapılabilir. O yüzden ilk savunmanı kur!<br>\nKüçük bir savunma bile üretimini gece boyunca korur.<br><br>\nSavaşı yalnızca sayılar belirlemez; saldıran filonun bileşimi de önemlidir.<br>\nSaldırganlar yağmalamadan önce savunmanı aşmak zorundadır; göndermek zorunda kaldıkları her gemi kazançlarını azaltır ve daha fazla gemi kaybetmelerine yol açabilir.<br>\nSavunma yapılarını <b>Tersane</b>'de <b>Savunma</b> sekmesinden kurarsın. Bunun için bir Tersane (o da Robot Fabrikası ister) ve biraz Deuterium gerekir.<br><br>\nWiki'deki ilgili makale: \n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">Savunma yapıları</a>"
  step4: 'Madenlerini geliştirerek kaynak akışını canlı tut!<br>
  
    Binalar, gemiler, savunmalar ve araştırmalar zamanla pahalılaşır; bu yüzden üretiminin de onlarla birlikte büyümesi gerekir. Şimdi Binalar menüsünü aç ve kaynakların yettiği her an madenlerini yükselt.'
  step5: "Kendine bir Küçük Nakliye yap!<br>\nKüçük Nakliyeler hızlı ve kullanışlı taşıyıcılardır.<br>\nİmpuls Motoru ile uzun mesafelerde Büyük Nakliye'den bile hızlıdırlar.<br>\nKaynakları gezegenlerin arasında taşımak, diğer oyuncularla ticaret yapmak ya da onları yağmalamak için kullan.<br><br>\nWiki'de daha fazlası: \n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Gemiler</a>"
  step6: 'Gezegenine bir isim ver, karışmasın. Genel Bakış''ta puan göstergesinin başlığındaki gezegen adına tıkla. Hadi, şimdi dene.<br><br>
  
    Diğer oyunculara arkadaşlık isteği de gönderebilirsin. Kabul ederlerse onlarla daha kolay sohbet edebilir ve çevrim içi durumlarını görebilirsin. Bunun için aynı ittifakta olmanız gerekmez. Arkadaşlar birbirlerinin gezegenlerinde filo da bekletebilir; böylece ittifak olmadan da birlikte savunma yapabilirsiniz.<br><br>
  
    Ya da bir ittifaka katıl ve takım olarak oyna. Filo bekletmek için artık ayrı arkadaşlık isteklerine gerek kalmaz. İttifak içinde toplu mesaj gönderebilir, ittifak rütbene göre diğer üyelerin çevrim içi durumunu ve puanını görebilirsin.'
  step7: 'Başka bir oyuncunun hangi kaynaklara, binalara, araştırmalara, gemilere ve savunmalara sahip olduğunu öğrenmek için onu casuslaman gerekir. Filo menüsünden ya da Galaksi görünümünden bir oyuncuya Casus Sondası gönder.<br>
  
    Unutma: diğer oyuncular da seni casuslayabilir!'
  step8: "Bir keşif seferi kaynak, gemi, özel olaylar ya da kayıp getirebilir. Denemek için bir gemi al, Filo menüsünde hedef olarak gezegen konumu 16'yı, görev olarak da \"Keşif\"i seç.<br>\nHer gemi türü keşif filonun büyüklüğüne katkı yapar; en büyük olay boyutuna ulaşılınca bu katkı sınırlanır.<br><br>\nWiki, kazancını artırmak için nelerin değiştirilebileceğini anlatıyor: \n<a href=\"{wiki_url}/wiki/En/Expoanleitung\" target=\"_blank\">Keşifler</a>"
  step9: "Ne kadar çok gezegen kolonileştirirsen o kadar hızlı büyürsün: aynı anda birden fazla gezegende kaynak üretebilir ve gemi inşa edebilirsin. Bir sistemin iç ya da dış kenarına yerleşebilmek için Astrofizik seviyenin yeterince yüksek olması gerekir. Koloni Gemisi Astrofizik olmadan da yapılabilir ama ilk kolonin Astrofizik ister!<br><br>\nKendi sisteminde ya da hemen yanındaki sistemde kolonileşmek taşıma yollarını kısa tutar. Bedeli şu: oyunun ilerleyen aşamalarında oyuncular senin sistemine madenleri için değil, geçici bir filo üssü olarak koloni kurabilir - buna baskın kolonisi denir.<br><br>\nWiki'de daha fazlası: \n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Astrofizik</a>"
  step10: "Kaynaklara daha hızlı mı ulaşmak istiyorsun? Diğer oyunculara saldır. Saldırının karşılığını vermesi için maliyet ve kazancı tart; planlarken casus raporlarından ve savaş simülatöründen yararlan.<br><br>\nDikkat! Diğer oyuncular birçok filo görevini çeşitli yollarla takip edebilir.<br>\nEmek verip kurduğun filoyu kaybetmemek oyunun en önemli parçalarından biridir.<br><br>\nBu yüzden şu wiki konularını mutlaka oku: \n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Filo kurtarma</a> - \n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Radar İstasyonu</a>"
  step10_u6: 'Kaynaklara daha hızlı mı ulaşmak istiyorsun? Diğer oyunculara saldır. Saldırının karşılığını vermesi için maliyet ve kazancı tart; planlarken casus raporlarından ve savaş simülatöründen yararlan.<br><br>
  
    Dikkat! Diğer oyuncular birçok filo görevini çeşitli yollarla takip edebilir.<br>
  
    Emek verip kurduğun filoyu kaybetmemek oyunun en önemli parçalarından biridir.<br><br>
  
    Bu yüzden şu wiki konularını mutlaka oku:
  
    <a href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden" target="_blank">Filo kurtarma</a>'
  step11: 'Filolar yok edildiğinde geride toplayabileceğin bir enkaz alanı bırakır. Bunun için her biri 20.000 yük kapasiteli Geri Dönüşümcüler gerekir. Büyük bir filoyu yok etmek kârlı bir kaynak olabilir.<br><br>
  
    Filo menüsü yerine Galaksi görünümünde enkaz alanına tıklayarak Geri Dönüşümcüleri doğrudan da gönderebilirsin.'
  step12: 'Tebrikler, eğitimi tamamladın!<br><br>
  
    Oyunda daha çok şey seni bekliyor.<br>
  
    Örneğin kabaca üç oyun tarzı var ve bunlar harcadıkları zamanda da farklılaşıyor:<br>
  
    <ul>
  
    <li>Madenci: birçok kolonide madenlerini geliştirir ve çoğunlukla nakliye uçurur</li>
  
    <li>Filocu: puanlarının çoğunu savaş gemilerine yatırır, neredeyse hiç kendi üretimi yoktur ve diğer oyuncuları yağmalayarak yaşar</li>
  
    <li>Karma: ikisinin karışımı</li>
  
    </ul>
  
    Aylar oyunun ilerleyen aşamalarında önem kazanır ve şimdiye kadar Radar İstasyonu ile tanışmış olmalısın.<br><br>
  
    Hâlâ sorun mu var? Wiki''yi oku ya da topluluğa Discord''da sor.'
  step12_u6: 'Tebrikler, eğitimi tamamladın!<br><br>
  
    Oyunda daha çok şey seni bekliyor.<br>
  
    Örneğin kabaca üç oyun tarzı var ve bunlar harcadıkları zamanda da farklılaşıyor:<br>
  
    <ul>
  
    <li>Madenci: birçok kolonide madenlerini geliştirir ve çoğunlukla nakliye uçurur</li>
  
    <li>Filocu: puanlarının çoğunu savaş gemilerine yatırır, neredeyse hiç kendi üretimi yoktur ve diğer oyuncuları yağmalayarak yaşar</li>
  
    <li>Karma: ikisinin karışımı</li>
  
    </ul>
  
    Hâlâ sorun mu var? Wiki''yi oku ya da topluluğa Discord''da sor.'
tutorial_title:
  step0: Hoş geldin, İmparator!
  step1: Madenciliğe başlama vakti!
  step2: Gel, insanlarla tanış!
  step3: Gezegenini savunmasız bırakma!
  step4: İleriyi düşün!
  step5: Gemi lazım, gemi!
  step6: Gezegenine isim ver, arkadaş edin!
  step7: Diğerlerinde neler var, gör!
  step8: Bilinmeyene doğru!
  step9: Tek gezegen asla yetmez!
  step10: Madenlerini beklemekten bıktın mı?
  step11: Çöpleri toplama vakti!
  step12: Başardın!
