Achievement_text:
  '1': 'Lass 5 Angriffe zwischen Mitternacht und 6 Uhr in einer Nacht landen, ohne einen einzigen zu gewinnen.'
  '2': Du hattest die letzten 90 Tage permanent laufende Flottenbewegungen.
  '3': Du hast deine Flotte verloren, während deine Spracheinstellungen auf "Französisch" eingestellt waren.
  '4': Erforsche Schießpulvertechnik 10.
  '5': Erforsche Festungsforschung 2.
  '6': Einer deiner Angriffe kam mit 1 Holz, 1 Gold, 1 Rum zurück.
  '7': Besiege eine Flotte Piraten- oder Alienschiffe mit einer Gesamtmenge von mindestens 10.000 Schiffen.
  '8': Nehme am Strammtisch teil (Dienstags ab 20 Uhr auf Discord).
  '9': Baue deine erste Schwimmende Festung.
  '10': Zerstöre die Insel eines Spielers.
  '11': Spiele 14 Tage ausschließlich am Handy.
  '12': Deine Flotte wurde in deiner ersten Expedition durch ein schwarzes Loch zerstört.
  '13': Sende deine Flotte weg, während ein einfliegender Angriff weniger als 5 Sekunden Restzeit hat.
  '14': Du hast 10 Flotten an schwarze Löcher verloren.
  '15': 'Kriech in 10 Gefechten mit maximaler Mondchance kein''n ersten Mond, arrr.'
  '16': Mehr als 250 deiner Wracktaucher sind ohne Ladung zurückgekehrt
  '17': Gebe mit einem Bauauftrag mindestens 5000 12-Pfünder in Produktion.
  '18': Ver(b)rauche innerhalb von 24h 5 Millionen Rum in einem Hafen in Form von Treibstoffkosten.
  '19': Erforsche Schiffsbauwesen 3.
  '20': Erforsche Schiffsbauwesen 6.
  '21': Erforsche Schiffsbauwesen 9.
  '22': Erforsche Schiffsbauwesen 12.
  '23': Erforsche Schiffsbauwesen 15.
  '24': Erforsche Brandmunition 12.
  '25': Du hast dem Opt-In in die Rekorde zugestimmt
  '26': Lösche den Hafen, der dir am meisten Punkte bringt. (Mindestens 100.000 Punkte)
  '27': Erforsche Inselübergreifendes Wissenschaftsnetzwerk 1.
  '28': Baue alle drei Ressourcenlager auf einer Insel auf mindestens Stufe 3 aus.
  '29': Kollektiviere die Flotte eines punkstärkeren Spielers mit einem 5-Mann AKS
  '30': Wehre einen 5 Mann AKS alleine ab
  '31': Du hast einen Spieler durch deinen Angriff in den Urlaubsmodus befördert.
  '32': Raide 1000 Häfen während dem das Theme "SetSail" aktiviert ist.
  '33': Komme aus dem U-Mode zurück.
  '34': Werde einmal angegriffen.
  '35': Greife einen aktiven Spieler an, der weniger als 1/10 deiner Punkte hat
  '36': "Erhalte eine Nachricht die eine der folgenden Bausteine enthält:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Deine Flotte wurde von einem AKS mit 5 Beteiligten zerstört.
  '38': Greife deine eigenen Allianzmitglieder an.
  '39': Greife jemanden mit genau 42 Schiffen an.
  '40': Kolonisiere einen Hafen, der mindestens ein halbes Universum entfernt ist.
  '41': Blockiere einen Flottenslot für eine Woche mit einem schlechten Marktplatzangebot.
  '42': Tritt 4 Mal in der Battlehall als Verlierer auf.
  '43': "Gewinne einen Kampf während dem dein Account als Inaktiv geflagged ist,\r\n                        in einem deiner Häfen an dem vorher eine Flotten angekommen, ist die eine Flugzeit von mehr als 7 Tagen hatte."
  '44': Produziere in einem Hafen für mehr als 7 Tage eine Ressource mit weniger als 100% Energienutzen.
  '45': Gewinne einen Angriff auf einen Spieler, der in den Top 5 der Verteidigung steht.
  '46': Triggere den Bash-Schutz durch Verschießen von Brandbomben.
  '47': Zerstöre 5 Inseln.
  '48': Verliere 5 Schwimmende Festungen beim Versuch Inseln zu zerstören.
  '49': Reiße einen Hafen kurz nach der Entstehung ab.
  '50': "Verliere alle deine Fischerboote in einem Hafen mit ausreichend\r\n                        Energie um Festungsforschung zu forschen, ohne dass du Festungsforschung geforscht hast."
  '51': Verbrauche all deinen Rum in der Galaansicht.
  '52': Baue eine Schwimmende Festung ohne vorher andere Kampfschiffe (Leichter Jäger, Schwerer Jäger, Kreuzer, Schlachtschiff, Bomber, Zerstörer & Schlachtkreuzer) gebaut zu haben.
  '53': Habe in 5 Forschungen gleichzeitig die höchste Stufe.
  '54': Time einen Angriff auf einen aktiven Spieler auf den 01.01. 00:00:00
  '55': Sonderachievement
  '56': 'Erreiche Hyperraumantrieb Stufe 15.'
  '57': 'Erreiche Astrophysik Stufe 15.'
  '58': 'Erforsche jede Technologie (außer Festung) mindestens einmal.'
  '59': 'Bringe jede Forschung (außer Festung) auf Stufe 10.'
  '60': 'Besitze 1.000.000.000 eines einzelnen Rohstoffs auf einem Planeten oder Insel.'
  '61': 'Habe 1000 Solarsatelliten gleichzeitig auf einem Planeten.'
  '62': 'Bebaue jedes Feld eines Planeten mit mindestens 250 Feldern.'
  '63': 'Baue Holz-, Gold- und Rumspeicher auf einem Planeten auf Stufe 15 aus.'
  '64': 'Habe auf 9 Planeten eine Holzmine ab Stufe 30.'
  '65': 'Starte einen einzelnen Bauauftrag, der länger als 30 Tage dauert.'
  '66': 'Lass 50 deiner Marktangebote von anderen Spielern kaufen.'
  '67': 'Gewinne eine Verteidigung gegen Angreifer, die mindestens das Zehnfache deiner Flotte und Verteidigung wert sind (Angreifer ab 1.000.000 Ressourcen Wert).'
  '68': 'Gewinne einen Angriff, bei dem mindestens 1000 gegnerische Einheiten zerstört werden und du keine einzige Einheit verlierst.'
  '69': 'Kämpfe ein Unentschieden nach der maximalen Rundenzahl, wobei jede Seite mindestens 10.000 Einheiten verliert.'
  '70': 'Werde auf einem Planeten ohne Schiffe und Verteidigung angegriffen, sodass der Angreifer nichts plündert.'
  '71': 'Erhalte einen Insel aus einem Kampf, der nur 1 % Inselchance hatte.'
  '72': 'Zerstöre mit einem einzigen Interplanetarraketen-Angriff mindestens 100 Verteidigungseinheiten.'
  '73': 'Zerstöre in einem Kampf auf deinem Planeten mindestens 100 gegnerische Spähpapageien.'
  '74': 'Erbeute insgesamt 1.000.000.000 Ressourcen.'
  '75': 'Recycle insgesamt 1.000.000.000 Ressourcen.'
  '76': 'Repariere insgesamt 1000 Schiffe aus Treibgutfeldern.'
  '77': 'Verdiene 1000 Ehrenpunkte.'
  '78': 'Werde zum ersten Mal zum Gesetzlosen.'
  '79': 'Nimm als Angreifer an 25 gewonnenen Verbandsangriffen teil.'
  '80': 'Erlebe jeden möglichen Expeditionsausgang mindestens einmal.'
  '81': 'Schicke 1000 Expeditionen los.'
  '82': 'Gewinne einen Expeditionskampf gegen eine große Alienflotte.'
  '83': 'Finde bei 50 Expeditionen große Mengen an Rohstoffen.'
  '84': 'Schicke eine Flotte auf einen Hinflug von mehr als 24 Stunden.'
  '85': 'Lass eine Flotte am 29. Februar ihr Ziel erreichen.'
  '86': 'Verliere an einem Freitag, dem 13., eine ganze Angriffsflotte.'
  '87': 'Lass zwei deiner Angriffe (ohne Verband) in derselben Sekunde auf demselben Ziel landen.'
  '88': 'Habe gleichzeitig Flotten zu jeder Galaxie des Universums unterwegs.'
  '89': 'Schließe das Tutorial ab.'
  '90': 'Habe gleichzeitig aktive Bündnisse mit 3 anderen Allianzen (alle Allianzmitglieder erhalten es).'
  '91': 'Erstelle 5 Wiki-Seiten deiner Allianz.'
  '92': 'Habe 10 angenommene Freundschaftsanfragen.'
  '93': 'Sei an 7 aufeinanderfolgenden Tagen Platz 1 in der Gesamtwertung.'
  '94': 'Habe gleichzeitig 100 Schwimmende Festungen auf einem Planeten oder Insel.'
  '95': 'Besetze jeden Planetenplatz, den deine Astrophysik erlaubt (mindestens 9), jeden Planeten mit mindestens 200 Feldern.'
  '96': 'Besitze 50 andere Achievements.'
