registerWelcomePMText: >-
  Benvenuto su %s! Come prima cosa costruisci una Centrale solare, perché
  serve energia per produrre risorse. Apri Costruzioni nel menu a sinistra e
  parti dalla Centrale solare.<br>Quando hai l'energia, puoi costruire le
  miniere. Resta in Costruzioni e costruisci una Miniera di metallo, poi una
  Miniera di cristallo.<br><br>Per costruire navi ti serve un Cantiere
  spaziale. Il menu Tecnologie a sinistra ti mostra cosa serve per sbloccarlo.
  <br>Se hai altre domande, dai un'occhiata alle FAQ, al wiki, o apri un
  ticket di supporto.<br><br>Il team ti augura un sacco di divertimento
  nell'esplorare l'universo!
