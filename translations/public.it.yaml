home_team: Team
home_meme_alt: 'Meme a fumetti dal ponte di comando di {game_name}'
home_meme_alt_deep_space_transit: "Fumetto: due cadetti su una navetta, uno si accascia alla vista di un campo di asteroidi, l'altro sogghigna davanti a una nebulosa luminosa. “Pattuglie di settore standard vs. scoprire una nebulosa inesplorata ricca di risorse.”"
home_meme_alt_deuterium_joyride: "Fumetto: un comandante stanco sul ponte di osservazione guarda due reclute fluttuare là fuori – “Guardare le nuove reclute sprecare tutto il Deuterio facendo giretti all'esterno mentre io aspetto 12 ore per i potenziamenti delle miniere.”"
home_meme_alt_enemy_fleet: "Fumetto: un cadetto si prende la testa tra le mani in preda al panico mentre lampeggiano gli allarmi – “1000 cacciatorpediniere nemici in arrivo?! Non era un settore sicuro?!”"
home_meme_alt_fleet_decimated: "Fumetto: un soldato sotto shock fissa il vuoto mentre fuori dalla cupola in frantumi esplodono delle navi – “Quando passi 20 ore a farmare risorse e poi la flotta di un giocatore top 3 salta dentro e smantella tutto in 3 secondi.”"
home_meme_alt_solo_scouting: "Fumetto: il comandante Kamioka sogghigna e appoggia una mano robotica sulla spalla di un cadetto – “Non preoccuparti, cadetto. L'Alto Comando ha una fiducia ‘totale’ nella tua missione di ricognizione in solitaria nello Spazio.”"
home_meme_alt_this_is_fine: "Fumetto: un cane in tuta spaziale siede tranquillo in un centro di comando in fiamme e dice “Va tutto bene” – “Tranquillo. La mia flotta è in ritardo di sole 4 ore.”"
