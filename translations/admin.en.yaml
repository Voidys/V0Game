se_pow_adaptive: Bot protection - adaptive difficulty
se_pow_adaptive_info: >-
  On: suspicious IP addresses and networks (/24 or /64) get a much harder
  puzzle (many requests, failures or registrations in a short time). Off: every
  visitor gets the basic puzzle and no counters are read.
se_pow_elevated_factor: Bot protection - factor at elevated risk
se_pow_elevated_factor_info: The puzzle becomes this many times harder (default 20).
se_pow_high_factor: Bot protection - factor at high risk
se_pow_high_factor_info: The puzzle becomes this many times harder (default 100).
se_pow_max_cap: Bot protection - difficulty cap
se_pow_max_cap_info: >-
  Highest number after the factors are applied. 1500000 takes roughly 25
  seconds on a slow smartphone.
se_pow_sensitivity: Bot protection - risk detection sensitivity
se_pow_sensitivity_info: >-
  Percent of the default thresholds (elevated from 5 requests/10 min, 3
  failures/hour or 2 registrations/24 h per IP; high from 20 / 10 / 5;
  networks three times as many). 200 = twice as many events needed, 50 = half.
se_pow_max_number: Bot protection - difficulty (maximum number)
se_pow_max_number_info: >-
  The browser tries hashes up to this number, half of them on average. 25000
  takes well under a second. Higher means more work for bots.
se_pow_min_seconds: Bot protection - minimum time before submitting (seconds)
se_pow_min_seconds_info: >-
  Forms submitted faster than this after loading are refused. 0 disables the
  check.
se_proofofwork: Bot protection
se_proofofwork_info: >-
  Registration and lost password are protected by a small computation that the
  browser solves on its own, without any third party.
se_rebuild_protection: Rebuild protection
se_rebuild_protection_info: >-
  After heavy losses, players get rebuild protection against further attacks
  after 6 hours, lasting 48 hours from the attack. 70% of the fleet or 80% of
  transport capacity must be destroyed in one attack, and that loss must be at
  least noob-protection points × 1,000 in units or capacity. The player can end
  the mode early.
