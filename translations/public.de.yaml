registerWelcomePMText: >-
  Willkommen bei %s! Baue zuerst ein Solarkraftwerk, denn ohne Energie
  produzieren deine Minen nichts. Öffne links im Menü „Gebäude“ und starte mit
  dem Solarkraftwerk.<br>Sobald du Energie hast, kannst du Minen bauen. Bleib
  dafür bei „Gebäude“ und baue eine Metallmine, danach eine Kristallmine.<br><br>Für
  Schiffe brauchst du eine Raumschiffwerft. Was dafür nötig ist, zeigt dir das
  Menü „Technologie“ links.<br>Wenn du weitere Fragen hast, wirf einen Blick in
  die FAQ oder ins Wiki, oder eröffne ein Support-Ticket.<br><br>Das Team
  wünscht dir viel Spaß beim Erkunden des Universums!
