home_meme_alt: 'Comic-Meme vom {game_name}-Kommandodeck'
home_meme_alt_deep_space_transit: "Comic: Zwei Kadetten in einem Shuttle – der eine sackt beim Anblick eines Asteroidenfelds zusammen, der andere strahlt einen leuchtenden Nebel an. „Normale Sektorpatrouille vs. einen unerforschten, rohstoffreichen Nebel finden.“"
home_meme_alt_deuterium_joyride: "Comic: Ein müder Kommandant auf dem Beobachtungsdeck sieht zwei Rekruten draußen herumschweben – „Zusehen, wie die neuen Rekruten ihr ganzes Deuterium bei Spritztouren verbraten, während ich 12 Stunden auf meine Minen-Upgrades warte.“"
home_meme_alt_enemy_fleet: "Comic: Ein Kadett greift sich panisch an den Kopf, während die Alarme blinken – „1000 feindliche Zerstörer im Anflug?! Ich dachte, dieser Sektor wäre sicher?!“"
home_meme_alt_fleet_decimated: "Comic: Ein geschockter Soldat starrt ins Leere, während draußen hinter der zerborstenen Kuppel Schiffe explodieren – „Wenn du 20 Stunden Rohstoffe farmst und dann die Flotte eines Top-3-Spielers auftaucht und in 3 Sekunden alles zerlegt.“"
home_meme_alt_solo_scouting: "Comic: Commander Kamioka grinst und legt einem Kadetten die Roboterhand auf die Schulter – „Keine Sorge, Kadett. Das Oberkommando hat ‚vollstes‘ Vertrauen in deine Solo-Aufklärungsmission ins All.“"
home_meme_alt_this_is_fine: "Comic: Ein Hund im Raumanzug sitzt seelenruhig in der brennenden Kommandozentrale und sagt „This is fine“ – „Keine Sorge. Meine Flotte kommt nur 4 Stunden zu spät zurück.“"
