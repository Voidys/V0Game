tutorial_text:
  step0: "Witaj w {game_name}!<br><br>\r\nTen krótki samouczek wprowadzi cię w podstawy gry.<br>\r\nCzęsto odsyłamy do naszej wiki, bo nie wszystko zmieści się w samouczku. Możesz ją otworzyć w każdej chwili z menu po lewej.<br>\r\nSamouczek możesz pominąć, kiedy tylko chcesz, ale później nie da się go uruchomić ponownie.<br><br>\r\nPowodzenia, Imperatorze!"
  step1: "Twój cel: zdobyć jak najwięcej punktów. Dostajesz jeden punkt za każde 1000 wydanych surowców, a najlepszym ich źródłem są twoje własne kopalnie.<br>\r\nZacznij od podstaw: potrzebujesz Metalu i Kryształu z kopalń oraz Energii z Elektrowni Słonecznej, żeby je zasilać. Gdy zabraknie Energii, kopalnie produkują poniżej 100%.<br>\r\nRozbudowuj te budynki w menu <b>Budynki</b>. Kliknij nazwę budynku, żeby zobaczyć, co da kolejny poziom i ile Energii będzie zużywał.<br><br>\r\nChcesz wiedzieć więcej? Zajrzyj do <b>Wiki</b>: \r\n<a href=\"{wiki_url}/wiki/En/Rohstoffe\" target=\"_blank\">Surowce</a>"
  step2: "Razem gra się lepiej. Większość graczy spotyka się na naszym Discordzie, gdzie dostaniesz odpowiedzi na pytania i znajdziesz ludzi do wspólnej gry.<br>\r\nNadal nie możesz sobie poradzić? Możesz też otworzyć tutaj zgłoszenie do supportu."
  step3: "Napadanie na planety innych graczy to kolejny sposób zdobywania surowców – i to samo może spotkać ciebie. Zbuduj więc swoją pierwszą obronę!<br>\r\nNawet niewielka obrona ochroni twoją produkcję przez noc.<br><br>\r\nO wyniku walki nie decyduje sama liczba jednostek, liczy się też skład floty atakującej.<br>\r\nZanim napastnik cię ograbi, musi przebić się przez twoją obronę, a każdy statek, który musi wysłać, zmniejsza jego zysk i może go kosztować kolejne statki.<br>\r\nObronę budujesz w <b>Stoczni</b>, na karcie <b>Obrona</b>. Potrzebujesz Stoczni (a ta wymaga Fabryki Robotów) oraz trochę Deuterium.<br><br>\r\nPasujący artykuł w wiki: \r\n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">Instalacje obronne</a>"
  step4: "Dbaj o stały dopływ surowców, rozbudowując kopalnie!<br>\r\nBudynki, statki, obrona i badania z czasem drożeją, więc twoja produkcja musi rosnąć razem z nimi. Otwórz teraz Budynki i rozbudowuj kopalnie, gdy tylko masz surowce."
  step5: "Zbuduj sobie Mały Transporter!<br>\r\nMałe Transportery to szybkie, poręczne jednostki transportowe.<br>\r\nZ Napędem Impulsowym na dłuższych dystansach są szybsze od Dużych Transporterów.<br>\r\nPrzewozisz nimi surowce między swoimi planetami, handlujesz z innymi graczami albo ich napadasz.<br><br>\r\nWięcej w wiki: \r\n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Statki</a>"
  step6: "Nadaj planecie nazwę, żeby łatwiej ją rozpoznać. W Przeglądzie kliknij nazwę planety w nagłówku wyświetlacza punktów. No dalej, spróbuj teraz.<br><br>\r\nMożesz też wysyłać zaproszenia do znajomych innym graczom. Gdy je przyjmą, łatwiej się komunikować i widzicie nawzajem swój status online. Nie musicie do tego należeć do jednego sojuszu. Znajomi mogą też stacjonować flotami na swoich planetach, więc możecie wspólnie się bronić także poza sojuszem.<br><br>\r\nAlbo dołącz do sojuszu i graj drużynowo. Nie potrzebujesz już osobnych zaproszeń, żeby stacjonować flotami. W sojuszu możesz wysyłać wiadomości zbiorcze oraz, zależnie od rangi, widzieć status online i punkty pozostałych członków."
  step7: "Żeby sprawdzić, jakie surowce, budynki, badania, statki i obronę ma inny gracz, musisz go szpiegować. Wyślij Sondę Szpiegowską do gracza z menu Flota albo z widoku Galaktyki.<br>\r\nPamiętaj, że inni gracze mogą szpiegować także ciebie!"
  step8: "Ekspedycja może przynieść surowce, statki, specjalne wydarzenia albo straty. Żeby spróbować, weź statek, wybierz jako cel pozycję planety 16 i misję „Ekspedycja” w menu Flota.<br>\nKażdy typ statku zwiększa wielkość floty ekspedycyjnej, aż do limitu, przy którym osiągnięty zostaje maksymalny rozmiar wydarzenia.<br><br>\nW wiki znajdziesz, co zmienić, żeby zmaksymalizować zysk: \n<a href=\"{wiki_url}/wiki/En/Expoanleitung\" target=\"_blank\">Ekspedycje</a>"
  step9: "Im więcej planet skolonizujesz, tym szybciej rośniesz: możesz produkować surowce i budować statki na kilku planetach naraz. Zwróć uwagę, że wewnętrzne i zewnętrzne krańce układu możesz zasiedlić dopiero przy odpowiednio wysokim poziomie Astrofizyki. Sam Statek Kolonizacyjny da się zbudować bez Astrofizyki, ale twoja pierwsza kolonia jej wymaga!<br><br>\r\nKolonizacja we własnym układzie lub tuż obok skraca trasy transportowe. Minusem jest to, że w późniejszej fazie gry gracze mogą założyć kolonię w twoim układzie nie dla kopalń, lecz jako tymczasową bazę dla floty – tzw. raidkolo.<br><br>\r\nWięcej w wiki: \r\n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Astrofizyka</a>"
  step10: "Chcesz mieć surowce szybciej? Atakuj innych graczy. Zestaw koszty z zyskami, żeby atak się opłacał, a do planowania użyj raportów szpiegowskich i symulatora walk.<br><br>\r\nUważaj! Inni gracze mogą na różne sposoby śledzić wiele misji flot.<br>\r\nNieutracenie ciężko zdobytej floty to jedna z najważniejszych części gry.<br><br>\r\nPrzeczytaj koniecznie te tematy w wiki: \r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Saven floty</a> - \r\n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Falanga</a>"
  step10_u6: "Chcesz mieć surowce szybciej? Atakuj innych graczy. Zestaw koszty z zyskami, żeby atak się opłacał, a do planowania użyj raportów szpiegowskich i symulatora walk.<br><br>\nUważaj! Inni gracze mogą na różne sposoby śledzić wiele misji flot.<br>\nNieutracenie ciężko zdobytej floty to jedna z najważniejszych części gry.<br><br>\nPrzeczytaj koniecznie te tematy w wiki:\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Saven floty</a>"
  step11: "Zniszczone floty zostawiają po sobie pole zniszczeń, które możesz zebrać. Potrzebujesz do tego Recyklerów, każdy o ładowności 20 000. Zmiecenie dużej floty może być dochodowym źródłem surowców.<br><br>\r\nRecyklery możesz też wysłać prosto z widoku Galaktyki, klikając pole zniszczeń, zamiast korzystać z menu Flota."
  step12: "Gratulacje, samouczek ukończony!<br><br>\r\nGra ma do zaoferowania jeszcze mnóstwo rzeczy.<br>\r\nNa przykład istnieją mniej więcej trzy style gry, które różnią się też zaangażowanym czasem:<br>\r\n<ul>\r\n<li>Górnik: rozbudowuje kopalnie na wielu koloniach i głównie lata transporterami</li>\r\n<li>Flociarz: większość punktów wkłada w okręty wojenne, prawie nie ma własnej produkcji i żyje z napadania na innych graczy</li>\r\n<li>Mieszany: połączenie obu stylów</li>\r\n</ul>\r\nW dalszej części gry ważne stają się księżyce, a Falangę powinieneś już znać.<br><br>\r\nMasz jeszcze pytania? Zajrzyj do wiki albo zapytaj społeczność na Discordzie."
  step12_u6: "Gratulacje, samouczek ukończony!<br><br>\nGra ma do zaoferowania jeszcze mnóstwo rzeczy.<br>\nNa przykład istnieją mniej więcej trzy style gry, które różnią się też zaangażowanym czasem:<br>\n<ul>\n<li>Górnik: rozbudowuje kopalnie na wielu koloniach i głównie lata transporterami</li>\n<li>Flociarz: większość punktów wkłada w okręty wojenne, prawie nie ma własnej produkcji i żyje z napadania na innych graczy</li>\n<li>Mieszany: połączenie obu stylów</li>\n</ul>\nMasz jeszcze pytania? Zajrzyj do wiki albo zapytaj społeczność na Discordzie."
