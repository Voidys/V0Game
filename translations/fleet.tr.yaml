sys_expe_found_ress_1_1: Keşif filon küçük bir asteroit kümesi buldu; buradan bir miktar kaynak çıkarılabildi.
sys_expe_found_ress_1_2: Uzak bir gezegencikte kolay ulaşılabilen birkaç kaynak sahası bulundu ve hammadde başarıyla çıkarıldı.
sys_expe_found_ress_1_3: Keşif filon, çoktan bitmiş bir savaştan kalma çok eski uzay gemisi enkazlarına rastladı. Bazı parçalar kurtarılıp geri dönüştürülebildi.
sys_expe_found_ress_1_4: Keşif filon radyasyonla kirlenmiş, atmosferi çok zehirli bir gezegen keşfetti. Ancak taramalar bu gezegenin bol hammadde içerdiğini gösterdi. Otomatik dronlarla mümkün olduğunca çok kaynak çıkarmaya çalışıldı.
sys_expe_found_ress_2_1: Keşif filon, tamamen dolu ama terk edilmiş eski bir yük gemisi konvoyu buldu. Bir miktar kaynak elde edilebildi.
sys_expe_found_ress_2_2: Keşif filon, kendi atmosferi olan küçük bir ayda büyük hammadde yatakları buldu. Mürettebat şu anda bu hazineyi çıkarıyor.
sys_expe_found_ress_2_3: Acilen yiyecek ve ilaca ihtiyacı olan küçük bir sivil gemi konvoyuyla karşılaştık. Karşılığında epey faydalı kaynak aldık.
sys_expe_found_ress_3_1: Keşif filon devasa bir uzaylı gemisi enkazı buldu. Teknolojisinden bir şey anlaşılamadı ama gemi parçalarına ayrılarak değerli hammadde elde edildi.
sys_expe_found_ress_3_2: Bilinmeyen bir gezegenin çevresindeki asteroit kuşağı çok miktarda hammadde barındırıyordu. Keşif filosu depolarını doldurdu!
sys_expe_found_ress_logbook_1: 'Birinci subayın seyir defterinden: Boş kalan her köşeyi kullandık ama bulduğumuz kaynakların hepsini yine de alamadık.'
sys_expe_found_ress_logbook_2: 'Birinci subayın seyir defterinden: Keşke birkaç nakliye gemimiz daha olsaydı! Şimdi bir sürü kaynağı geride bırakmak zorundayız.'
sys_expe_found_ress_logbook_3: 'Birinci subayın seyir defterinden: Artık ihtiyacımız olmayan her şeyi zaten dışarı attık ama bulduğumuz kaynaklara yine de yeterince yer açamıyoruz.'
sys_expe_found_ress_logbook_4: 'Birinci subayın seyir defterinden: Kafeteryayı ve tüm dinlenme salonlarını depoya çevirdik, yine de bulduğumuz kaynakların hepsini taşıyamadık.'
sys_expe_found_ships_1_1: Önceki bir keşif filosunun kalıntılarını bulduk! Teknisyenlerimiz enkazlardan bazılarını yeniden çalıştırıp çalıştıramayacaklarını kontrol ediyor.
sys_expe_found_ships_1_2: Terk edilmiş bir korsan üssü bulduk. Hangarda hâlâ birkaç eski gemi duruyor. Teknisyenlerimiz bazılarının kullanılabilir olup olmadığını kontrol ediyor.
sys_expe_found_ships_1_3: Keşif filon, savaşlarla neredeyse tamamen harap olmuş bir gezegen buldu. Yörüngede çeşitli gemi enkazları sürükleniyordu. Teknisyenler bazılarını onarmaya çalıştı. Belki burada ne olduğunu daha iyi anlarız.
sys_expe_found_ships_1_4: Keşif filon, sonsuzluktur terk edilmiş gibi görünen eski bir yıldız üssüne rastladı. Kalenin hangarında birkaç gemi vardı. Teknisyenler bazılarını yeniden uçurmayı başardı.
sys_expe_found_ships_2_1: Bir armadanın kalıntılarını bulduk. Keşif filosunun teknisyenleri hemen kısmen sağlam gemilere geçti ve bazılarını onarmayı başardı.
sys_expe_found_ships_2_2: Keşif filon, bazı gemilerin hâlâ üretim aşamasında olduğu eski bir otomatik tersane buldu. Tersanenin enerji kaynağı yeniden çalıştırıldıktan sonra teknisyenler gemilerin yapımını tamamladı.
sys_expe_found_ships_3_1: Devasa bir gemi mezarlığı bulduk. Keşif filosunun bazı teknisyenleri bir iki gemiyi yeniden çalıştırmayı başardı.
sys_expe_found_ships_3_2: Bir medeniyetin kalıntılarını taşıyan bir gezegen keşfettik. Dışarıdan, hâlâ sağlam duran devasa bir gemi istasyonu daha görüldü. Teknisyenlerimizden ve pilotlarımızdan bir kısmı, birkaç geminin kurtarılıp kurtarılamayacağını belirlemek için yüzeye indi.
sys_expe_found_ships_logbook_1: 'Makine dairesi subayının seyir defterinden: Yanımızda birkaç gemi daha getirmiş olsaydık, bu güzellerden bazılarını eve götürmek çok kolay olurdu!'
sys_expe_found_ships_logbook_2: 'Makine dairesi subayının seyir defterinden: Ne yazık ki bu seferde keşfettiğimiz gemilerin hepsini geri getirecek kapasitemiz yoktu.'
sys_expe_found_ships_logbook_3: 'Makine dairesi subayının seyir defterinden: Ne yazık ki bulduğumuz gemilerin hepsini geri getirecek kapasitemiz yok.'
sys_expe_found_ships_nothing: Hiç gemi bulunamadı.
sys_expe_lost_fleet_1: 'Keşif filosundan geriye kalan tek şey şu telsiz mesajı: Zzzrrt aman Tanrım!...Krrrzzzzt şu zrrrtrzt görüyor krgzzzz evet nasıl da Krzzzzzzzztzzzz...'
sys_expe_lost_fleet_2: Keşif filosundan aldığımız son şey, açılmakta olan bir kara deliğin inanılmaz güzel yakın çekimleri oldu.
sys_expe_lost_fleet_3: Komuta gemilerinden birindeki nükleer sızıntı bir zincir reaksiyona yol açtı ve tüm keşif filosunu görkemli bir patlamayla yok etti.
sys_expe_lost_fleet_4: Keşif filosu hiperuzay atlayışından geri dönmedi. Bilim insanlarımız ne olduğunu hâlâ çözmeye çalışıyor ama filo sonsuza dek kaybolmuş görünüyor.
sys_expe_nothing_1: Bu keşif, bilinmeyen bir bataklık gezegenden getirilen birkaç tuhaf küçük hayvan dışında heyecan verici hiçbir şey getirmedi.
sys_expe_nothing_2: Keşif filon bir süpernovanın harika fotoğraflarını çekti. Ancak sefer gerçekten yeni bir bilgi kazandırmadı. Yine de bu yılın Evrenin En İyi Fotoğrafı yarışmasını kazanma şansı yüksek.
sys_expe_nothing_3: Garip bir bilgisayar virüsü, güneş sisteminden ayrıldıktan kısa süre sonra navigasyonu çökertti. Bu yüzden tüm keşif filosu boyunca daireler çizerek uçtu. Seferin pek başarılı olmadığını söylemeye gerek yok.
sys_expe_nothing_4: Saf enerjiden bir yaşam formu, tüm keşif ekibini günlerce ekranlarındaki hipnotik sembollere baktırdı. Çoğunun kafası sonunda toparlandığında, deuterium yetersizliği yüzünden sefer iptal edilmek zorunda kaldı.
sys_expe_nothing_5: Peki, en azından artık 5. sınıf kırmızı anomalilerin gemi sistemleri üzerinde yalnızca kaotik etkiler yaratmadığını, mürettebatta kitlesel halüsinasyonları da tetikleyebildiğini biliyoruz. Ne yazık ki bu seferde başka hiçbir şey keşfedilmedi.
sys_expe_nothing_6: Bu sektörün ilk taramaları umut verici görünse de ne yazık ki eli boş döndük.
sys_expe_nothing_7: Belki kaptanın doğum günü bu ücra gezegende kutlanmamalıydı. Kötü bir kanamalı ateş mürettebatın çoğunu revire yolladı ve ani personel sıkıntısı seferin başarısız olmasına yol açtı.
sys_expe_nothing_8: Keşif filon uzayın uçsuz bucaksız boşluğundan başka hiçbir şey bulamadı. Seferi biraz olsun heyecanlı yapacak küçük bir asteroit, radyasyon ya da parçacık bile yoktu.
sys_expe_nothing_9: Komuta gemisindeki bir reaktör arızası tüm keşif filosunu neredeyse yok ediyordu. Neyse ki teknisyenler işinin ehliydi ve en kötüsünü önledi. Ancak onarım o kadar uzun sürdü ki sefer hiçbir şey elde etmeden döndü.
sys_expe_report: Keşif raporu
sys_expe_report_msg: '%s %s filosunun %s konumundaki keşif raporu:'
sys_expe_time_fast_1: Tahrik sistemi enerji bobinlerindeki öngörülemeyen bir geri besleme döngüsü seferin dönüşünü hızlandırdı ve filo beklenenden erken geldi. İlk raporlara göre bildirilecek başka bir şey yok.
sys_expe_time_fast_2: Biraz gözü pek yeni komutan, dönüş yolunu kısaltmak için kararsız bir solucan deliği kullandı - ve başardı! Ancak seferin kendisi yeni bir bilgi kazandırmadı.
sys_expe_time_fast_3: Keşif filon, taranan sektörde hiçbir anormallik bildirmedi. Ancak filo dönüş uçuşunda bir güneş rüzgârına yakalandı ve yolculuk epey hızlandı. Keşif filon beklenenden biraz erken eve dönecek.
sys_expe_time_slow_1: Navigatörün ciddi bir hatası filoyu tamamen yanlış bir yere indirdi. Bu yüzden dönüş yolculuğu hayli uzun sürdü.
sys_expe_time_slow_2: Hâlâ bilinmeyen nedenlerle filonun atlayışı tamamen ters gitti. Neredeyse bir yıldızın tam kalbine düşüyorlardı! Neyse ki bilinen bir sisteme indiler ama dönüş yolculuğu ilk planlanandan uzun sürecek.
sys_expe_time_slow_3: Yeni navigasyon modülü hâlâ bazı hatalarla boğuşuyor gibi. Keşif filosu yalnızca tamamen yanlış yöne gitmekle kalmadı, tüm deuteriumunu da tüketti! Hayal kırıklığına uğrayan filo şimdi yedek güçle dönüyor.
sys_expe_time_slow_4: Keşif filon yoğun parçacık fırtınalı bir sektöre girdi. Bu, enerji depolama sistemlerini aşırı yükledi ve tüm gemilerin ana sistemleri devre dışı kaldı. Teknisyenler en kötüsünü önlemeyi başardı ama keşif filon şimdi epey gecikmeyle dönecek.
sys_expe_time_slow_5: Keşif filosunun amiral gemisi, uyarı vermeden doğrudan filonun içine atlayan bir uzaylı aracıyla çarpıştı. Uzaylı gemisi patladı ve amiral gemisinin hasarı ağır oldu. En ciddi onarımlar bitince gemilerin dönüş yolculuğuna başlayacak, çünkü sefer bu durumda devam edemez.
sys_expe_time_slow_6: Bir kırmızı devin yıldız rüzgârı filonun atlayışını bozdu ve navigasyon sistemleri dönüş yolunu tamamen yanlış hesapladı. Sonuç olarak keşif filosu, tanımadığı yıldızlar arasındaki uçsuz bucaksız boşlukta kendini buldu.
