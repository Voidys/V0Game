sys_expe_attack_1_1_1: Umutsuz bir uzay korsanı keşif filomuza el koymaya çalıştı.
sys_expe_attack_1_1_2: İlkel barbarlar uzay gemileriyle bize saldırdı. En azından gemileri berbat durumdaydı. Silahları ciddi bir tehdit olsaydı, biz de karşılık vermek zorunda kalırdık.
sys_expe_attack_1_1_3: Çok sarhoş bazı korsanların telsiz mesajlarını yakaladık. Anlaşılan bize saldıracaklar.
sys_expe_attack_1_1_4: Bir grup korsanla dövüşmek zorunda kaldık ama neyse ki sayıca üstündük.
sys_expe_attack_1_1_5: Filomuz, Moa Tikarr adlı birinin ve ekibinin filomuzun koşulsuz teslim olmasını istediğini bildiriyor. Ciddilerse, kendimizi gayet iyi savunabildiğimizi görecekler.
sys_expe_attack_1_2_1: Keşif filon, uzay korsanlarıyla beklenmedik bir karşılaşma yaşadı.
sys_expe_attack_1_2_2: Yıldız korsanlarının pususuna düştük! Ne yazık ki çatışma kaçınılmazdı.
sys_expe_attack_1_2_3: Başka bir keşif filosundan gelen yardım çağrısı, sinsi korsanların tuzağı çıktı. Savaş kaçınılmazdı.
sys_expe_attack_1_3_1: Yakaladığımız sinyaller bilinmeyen uzaylılardan değil, gizli bir korsan üssünden geliyormuş! Korsanlar bölgelerinde bizi görmekten pek memnun olmadı.
sys_expe_attack_1_3_2: Keşif filosu, kimliği belirsiz korsan gemileriyle şiddetli çatışmalar bildiriyor!
sys_expe_attack_1_3_3: 'Keşif komutanından az önce acil bir mesaj aldık: “Üstümüze geliyorlar! Hiperuzaydan fırlayıp çıktılar. Neyse ki sadece korsanlar, yani şansımız var, savaşacağız!”'
sys_expe_attack_2_1_1: Keşif filon, bilinmeyen bir türle pek hoş olmayan bir ilk temas yaşadı.
sys_expe_attack_2_1_2: Bazı garip gemiler keşif filosuna uyarı vermeden saldırdı!
sys_expe_attack_2_1_3: Keşif filomuz, kimliği belirsiz küçük bir uzay aracı grubunun saldırısına uğradı!
sys_expe_attack_2_1_4: Keşif filosu bilinmeyen gemilerle temas bildiriyor. Telsiz mesajları çözülemiyor ama garip gemiler silahlarını hazırlıyor gibi görünüyor.
sys_expe_attack_2_2_1: Bilinmeyen bir tür keşif filomuza saldırıyor!
sys_expe_attack_2_2_2: Keşif filon, daha önce bilinmeyen ama son derece saldırgan bir uzaylı ırkının topraklarına girmiş gibi görünüyor.
sys_expe_attack_2_2_3: Keşif filomuzla bağlantı aniden koptu. Son duyduğumuza göre filo ağır ateş altındaydı. Saldıranlar tespit edilemedi.
sys_expe_attack_2_3_1: Keşif filon bir uzaylı istila filosuyla karşılaştı ve büyük çatışmalar bildiriyor!
sys_expe_attack_2_3_2: Kökeni bilinmeyen büyük bir kristal gemi grubu, keşif filomuzla doğrudan çarpışma rotasında. En kötüsüne hazırlanmalıyız.
sys_expe_attack_2_3_3: Uzaylı ırkının lehçesini doğru telaffuz etmekte biraz zorlandık. Diplomatımız yanlışlıkla “Barış!” yerine “Ateş!” diye bağırdı.
