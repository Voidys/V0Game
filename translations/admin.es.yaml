se_bots_raids: "Bots: incursiones y objetivos"
se_bots_defense: "Bots: huida de flota y amenazas"
se_bots_growth: "Bots: crecimiento y actividad"
se_bots_features: "Bots: opciones de comportamiento"
se_bots_preset: "Preajuste de dificultad"
se_bots_preset_info: "Elegir un preajuste y guardar rellena los valores de los bots de abajo (incursiones activadas/desactivadas y los ajustes de capacidad no se tocan); si después se edita un valor, el preajuste pasa a personalizado. Cada preajuste mantiene los límites que protegen a los jugadores: ataques por objetivo y día, enfriamiento por objetivo, nunca jugadores con protección de novato o en vacaciones. Cada bot puede sustituir el preajuste en la lista de bots."
se_bots_preset_custom: "Personalizado"
se_bots_preset_relaxed: "Relajado"
se_bots_preset_normal: "Normal"
se_bots_preset_hard: "Difícil"
se_bots_preset_brutal: "Brutal"
se_bots_max_fleets: "Máx. de flotas de incursión de bots en vuelo"
se_bots_max_fleets_info: "Límite de flotas de espionaje y ataque de bots que vuelan a la vez en este universo (0 = sin límite)."
se_bots_aggression: "Agresividad (0-100)"
se_bots_aggression_info: "50 = comportamiento clásico. Más alto: los bots hacen más incursiones por sesión y aceptan las que prometen menos beneficio por coste; más bajo: lo contrario."
se_bots_attack_actives: "Atacar a jugadores activos"
se_bots_attack_actives_info: "Desactivado: los bots solo atacan a jugadores que no estuvieron activos en la última hora (jugadores inactivos y otros bots)."
se_bots_raids_per_target_day: "Incursiones por objetivo y día"
se_bots_raids_per_target_day_info: "Máximo de ataques de un bot al mismo jugador en 24 horas. 0 = el valor del perfil del bot (2-4). El límite de bash del juego se aplica siempre además."
se_bots_target_cooldown_hours: "Enfriamiento por objetivo (horas)"
se_bots_target_cooldown_hours_info: "Cuánto tiempo se deja en paz a un objetivo tras una mirada poco rentable, un vuelo rechazado o una retirada."
se_bots_min_target_points: "Puntos mínimos del objetivo"
se_bots_min_target_points_info: "Los bots ignoran a los jugadores con menos puntos (0 = desactivado)."
se_bots_min_target_ratio_percent: "Tamaño mínimo del objetivo en porcentaje del bot"
se_bots_min_target_ratio_percent_info: "Los bots ignoran a los jugadores cuyos puntos están por debajo de este porcentaje de los suyos (0 = desactivado)."
se_bots_probes_per_target_day: "Vuelos de sondas por objetivo y día"
se_bots_probes_per_target_day_info: "Máximo de vuelos de espionaje de un bot al mismo planeta en 24 horas (0 = solo los limita el enfriamiento de espionaje)."
se_bots_probes_wanted: "Sondas que un bot de incursiones mantiene en casa"
se_bots_probes_wanted_info: "Un bot que sale de incursión construye sondas hasta tener tantas."
se_bots_min_loot: "Botín mínimo (valor)"
se_bots_min_loot_info: "Un ataque debe prometer al menos este botín (metal + 1,5 cristal + 2 deuterio)."
se_bots_escort_shares: "Porcentajes de escolta"
se_bots_escort_shares_info: "Porcentajes de las naves de guerra del planeta que se prueban como escolta, de menor a mayor, separados por comas (p. ej. 0, 15, 30, 50, 75, 100)."
se_bots_simulation_runs: "Combates simulados por flota"
se_bots_simulation_runs_info: "Una flota solo se envía si gana todos los combates simulados (1-5)."
se_bots_spy_cooldown_minutes: "Enfriamiento de espionaje (minutos)"
se_bots_spy_cooldown_minutes_info: "Minutos antes de que un bot vuelva a espiar el mismo planeta (el objetivo recibe cada vez un mensaje de contraespionaje)."
se_bots_spy_cooldown_streak_minutes: "Enfriamiento de espionaje en una racha de incursiones (minutos)"
se_bots_spy_cooldown_streak_minutes_info: "Lo mismo durante una racha de incursiones, donde importan los informes recientes."
se_bots_recall_loot_percent: "Retirada por debajo de este porcentaje del botín mínimo (%)"
se_bots_recall_loot_percent_info: "El nuevo espionaje antes del impacto retira una flota cuando el botín esperado cae por debajo de este porcentaje del botín mínimo."
se_bots_recall_ratio_percent: "Retirada por debajo de este porcentaje de la relación de beneficio exigida (%)"
se_bots_recall_ratio_percent_info: "Lo mismo para la relación entre botín y combustible y pérdidas."
se_bots_streak_loot_percent: "Racha de incursiones tras un golpe que valga (% del botín mínimo)"
se_bots_streak_loot_percent_info: "Un golpe que aportó al menos este porcentaje del botín mínimo inicia una racha de incursiones."
se_bots_raids_per_human_day: "Incursiones por jugador y día (todos los bots juntos)"
se_bots_raids_per_human_day_info: "Máximo de ataques de bots al mismo jugador humano en 24 horas, contados entre todos los bots del universo (límite antifrustración, siempre activo)."
se_bots_human_cooldown_hours: "Pausa por jugador entre ataques de bots (horas)"
se_bots_human_cooldown_hours_info: "Tras un ataque de un bot a un humano, ningún bot lo ataca durante este tiempo, y nunca mientras otro ataque de bot contra él esté en camino."
se_bots_probes_per_human_day: "Vuelos de sondas por jugador y día (todos los bots juntos)"
se_bots_probes_per_human_day_info: "Máximo de vuelos de espionaje de bots al mismo jugador humano en 24 horas, contados entre todos los bots del universo."
se_bots_scout_range_max: "Mayor alcance de exploración (sistemas)"
se_bots_scout_range_max_info: "Los bots nunca miran más allá de este número de sistemas alrededor de sus planetas, diga lo que diga su perfil: aproximadamente lo que un jugador recorre en la vista de galaxia."
se_bots_respy_jitter_seconds: "Desfase aleatorio del reespionaje (segundos)"
se_bots_respy_jitter_seconds_info: "El espionaje justo antes del impacto de una incursión se envía al azar hasta este número de segundos antes de lo previsto (0 = tiempo exacto)."
se_bots_timezone_spread_hours: "Dispersión de zona horaria personal (horas)"
se_bots_timezone_spread_hours_info: "Cada bot recibe un desfase personal estable de hasta este número de horas (más o menos) respecto al reloj del servidor, para que los bots de un perfil no jueguen todos a la misma hora (0 = desactivado)."
se_bots_fleetsave_enabled: "Los bots ponen la flota a salvo"
se_bots_fleetsave_enabled_info: "Desactivado: los bots nunca ponen su flota a salvo, ni al final de una sesión ni ante un ataque entrante."
se_bots_fleetsave_keep_percent: "Recursos que deja en casa una huida de flota (%)"
se_bots_fleetsave_keep_percent_info: "Porcentaje de cada reserva que se queda en el planeta para que la construcción siga funcionando."
se_bots_fleetsave_min_offline_minutes: "Tiempo sin conexión mínimo para una huida de flota (minutos)"
se_bots_fleetsave_min_offline_minutes_info: "Al final de una sesión, un bot solo pone la flota a salvo si espera estar ausente al menos este tiempo."
se_bots_threat_window_hours: "Ventana de amenaza (horas)"
se_bots_threat_window_hours_info: "Las flotas hostiles entrantes se detectan este número de horas antes del impacto."
se_bots_ship_weight_percent: "Peso de la construcción de naves (%)"
se_bots_ship_weight_percent_info: "Multiplicador de cuánto prefieren los bots construir naves frente a otras cosas (100 = clásico)."
se_bots_defense_weight_percent: "Peso de la construcción de defensas (%)"
se_bots_defense_weight_percent_info: "Multiplicador de cuánto prefieren los bots construir defensas (100 = clásico)."
se_bots_growth_speed_percent: "Velocidad de crecimiento (%)"
se_bots_growth_speed_percent_info: "Multiplicador de la ganancia diaria de habilidad de los perfiles de bots (100 = clásico; los perfiles sin ganancia de habilidad no cambian)."
se_bots_growth_bonus: "Ganancia de habilidad extra por día (milésimas)"
se_bots_growth_bonus_info: "Se suma a la ganancia diaria de habilidad de cada bot (10 = un punto porcentual por día), limitada por la habilidad máxima del perfil."
se_bots_max_planets: "Máximo de planetas por bot"
se_bots_max_planets_info: "Los bots dejan de colonizar con este número de planetas (0 = solo se aplica el límite del juego)."
se_bots_activity_percent: "Multiplicador de actividad (%)"
se_bots_activity_percent_info: "Escala la probabilidad horaria de que un bot se conecte (100 = tabla del perfil; por encima de 100 los bots se conectan más a menudo)."
se_bots_hidden_rhythm_percent: "Porcentaje de bots con ritmo oculto (%)"
se_bots_hidden_rhythm_percent_info: "Estos bots desplazan su ritmo diario una cantidad distinta cada día, así que no se pueden predecir por sus horas de conexión."
se_bots_revenge: "Venganza"
se_bots_revenge_info: "Los bots guardan rencor (sube cuando un jugador los ataca o espía, y baja un 10 % al día) y exploran y contraatacan al jugador más hostil a su alcance cuando su planificador de incursiones encuentra un plan ganable. Los límites por jugador y día siguen vigentes."
se_bots_bot_acs: "Ataques de grupo de bots"
se_bots_bot_acs_info: "Un bot que no puede vencer a un objetivo solo abre un ataque de grupo e invita a bots aliados (misma alianza) conectados; se unen como los jugadores. Los límites por jugador y día cuentan un grupo como un solo ataque."
se_bots_recycling: "Reciclaje"
se_bots_recycling_info: "Los bots envían recicladores a los campos de escombros que ven alrededor de sus planetas (primero los de sus propios combates) cuando la cosecha supera el combustible, y construyen unos pocos recicladores si no tienen."
se_bots_moons: "Lunas"
se_bots_moons_info: "Los bots usan sus lunas: las flotas se estacionan en la luna al desconectarse y las incursiones pueden salir de una luna."
se_bots_missiles: "Misiles"
se_bots_missiles_info: "Los bots con silo de misiles (nivel 4), propulsor de impulso y misiles interplanetarios disparan contra la defensa de un objetivo que bloquea una incursión, vuelven a espiar y atacan. Con este interruptor activado los bots construyen silos y misiles."
se_bots_warmonger: "Belicista de final de partida"
se_bots_warmonger_info: "A partir de los puntos indicados abajo, un bot hace más incursiones, acepta menos beneficio y también toma como objetivo a jugadores activos. El planificador de incursiones y los límites por jugador siguen vigentes."
se_bots_warmonger_points: "Umbral de puntos del belicista"
se_bots_warmonger_points_info: "Puntos a partir de los cuales un bot puede volverse belicista."
bot_difficulty: "Dificultad"
bot_override_preset: "Preajuste de este bot"
bot_override_universe: "Como el universo"
bot_override_aggression: "Agresividad"
bot_override_save: "Guardar"
bot_override_reset: "Restablecer"
bot_override_saved: "Dificultad del bot guardada."
# engagement: contenido del mapa (restos, nave nodriza, historias)
se_derelicts: "Campos de restos"
se_derelicts_enabled: "Campos de restos"
se_derelicts_enabled_info: "Campos de rescate con metal y cristal aparecen en huecos libres al azar durante un tiempo limitado; solo los recicladores pueden recogerlos. Desactivado por defecto."
se_derelicts_per_galaxy: "Campos por galaxia y aparición"
se_derelicts_per_galaxy_info: "Cuántos campos de restos aparecen en cada galaxia por ciclo de aparición."
se_derelicts_interval_hours: "Intervalo de aparición"
se_derelicts_interval_hours_info: "Como máximo un ciclo de aparición en este tiempo."
se_derelicts_min: "Restos mínimos (metal + cristal cada uno)"
se_derelicts_min_info: "Cada campo contiene una cantidad aleatoria entre el mínimo y el máximo de metal y de cristal."
se_derelicts_max: "Restos máximos (metal + cristal cada uno)"
se_derelicts_max_info: "Límite superior de la cantidad aleatoria por recurso."
se_derelicts_lifetime_hours: "Duración de un campo"
se_derelicts_lifetime_hours_info: "Pasado este tiempo, el campo desaparece con lo que le quede."
se_mothership: "Nave nodriza pirata"
se_mothership_enabled: "Nave nodriza pirata"
se_mothership_enabled_info: "Un jefe mundial que solo puede ser atacado por un grupo de combate de alianza (ACS) de varios jugadores; el botín se reparte según el daño causado. Desactivado por defecto."
se_mothership_interval_days: "Intervalo de aparición"
se_mothership_interval_days_info: "Días entre dos naves nodrizas (una nueva solo aparece mientras no haya ninguna viva)."
se_mothership_strength_percent: "Fuerza"
se_mothership_strength_percent_info: "Valor de flota de la nave nodriza en porcentaje del valor medio de flota de los 10 mejores jugadores (bots excluidos)."
se_mothership_loot_hours: "Botín: horas de producción"
se_mothership_loot_hours_info: "El botín equivale a esta cantidad de horas de la producción media de los 10 mejores jugadores."
se_mothership_lifetime_hours: "Duración"
se_mothership_lifetime_hours_info: "La nave nodriza se marcha pasado este tiempo, sin pagar botín."
se_mothership_min_players: "Jugadores necesarios para atacar"
se_mothership_min_players_info: "El grupo de combate debe contener flotas de al menos esta cantidad de jugadores distintos; si no, las flotas dan media vuelta sin daño."
se_expedition_stories: "Historias de expedición"
se_expedition_stories_enabled: "Historias de expedición"
se_expedition_stories_enabled_info: "Cadenas de historias poco frecuentes: una expedición capta una señal que lleva a nuevas posiciones de expedición y a una recompensa final. Desactivado por defecto."
se_story_chance_permille: "Probabilidad por expedición (por mil)"
se_story_chance_permille_info: "Probabilidad de que una expedición sin historia activa inicie una. 5 significa 0,5 por ciento."
se_story_range_systems: "Alcance de la señal (sistemas)"
