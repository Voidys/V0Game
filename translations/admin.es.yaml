abuse_reviews_title: "Anti-multi / push-trade review queue"
abuse_reviews_info: "Pairs are scored 0-100 from shared IP (30), shared device (30), multi group not marked known (20), same subnet (10), one-sided transfers (10-30), repeated skewed trades (10-20) and trade-graph cluster membership (15), refreshed hourly. Pairs from %s points are queued; a dismissed pair re-opens only when its score rises by 20 or more."
