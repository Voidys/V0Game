se_discord_url: URL de invitación de Discord
se_discord_url_info: Enlace de invitación de tu servidor de Discord (https://...). Se muestra en el menú, la página de acceso, los correos y los textos. Vacío = oculto.
se_discord_widget_guild: ID del servidor de Discord (widget en línea)
se_discord_widget_guild_info: ID de tu servidor de Discord (17-20 dígitos; en Ajustes del servidor → Widget, «Habilitar widget del servidor» debe estar activado). Muestra un recuadro con el número de conectados en la página de inicio, actualizado cada 5 minutos. Vacío lo oculta.
se_wiki_url: URL de la wiki
se_wiki_url_info: URL base de una wiki externa, sin barra final (https://...). Los enlaces a la wiki en FAQ, tutorial y reglas se forman con ella. Vacío = ocultos.
se_donate_url: URL de donaciones
se_donate_url_info: Enlace para donaciones (https://...), mostrado en el menú. Vacío = oculto.
se_userscripts_url: URL de userscripts
se_userscripts_url_info: Página con userscripts para tu juego (https://...), enlazada en los ajustes. Vacío = oculto.
se_bots_alliances_enabled: Los bots forman alianzas
se_bots_alliances_enabled_info: 'Los bots fundan sus propias alianzas y a veces se unen a otras. Desactivado: los bots van por libre, no envían solicitudes y abandonan las alianzas de las que son miembros (las alianzas fundadas por un bot se mantienen).'
se_bots_join_human_alliances: Los bots pueden unirse a alianzas de jugadores
se_bots_join_human_alliances_info: 'Los bots también pueden solicitar entrar en alianzas fundadas por jugadores humanos. Desactivado: los bots solo se unen a alianzas fundadas por bots y abandonan las alianzas de jugadores.'
se_bot_reply_delay_hours: Retraso de respuesta (horas)
se_bot_reply_delay_hours_info: Horas que espera el mensaje privado sin responder más antiguo de un jugador antes de que un bot responda a todos los mensajes pendientes de ese jugador en una sola respuesta. También es la separación mínima entre dos mensajes iniciados por bots (reacciones a ataques, provocaciones de asalto) al mismo jugador. 0 = sin retraso.
se_bot_chatter: Los bots conversan
se_bot_chatter_info: 'Activado: los bots responden a los mensajes privados. Desactivado: los mensajes se siguen leyendo y contando, pero solo se envían las reacciones de combate (tras ser atacado o tras asaltar a un jugador que les escribió). Los bots nunca escriben primero a los jugadores.'
