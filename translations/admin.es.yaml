se_bash_war_exempt: Las guerras levantan el límite bash
se_bash_war_exempt_info: 'Los ataques entre alianzas en guerra (aceptados, con más de un día) no cuentan para los límites bash. Desactivado: los ataques de guerra cuentan como todos los demás.'
se_honor_pair_cap: Combates honorables por pareja (24 h)
se_honor_pair_cap_info: Cuántos combates honorables entre los mismos dos jugadores (en cualquier dirección) dan honor en 24 horas. Los siguientes cuentan como neutrales. 0 = ilimitado.
se_market_push_tolerance: Tolerancia de presión en el mercado
se_market_push_tolerance_info: Diferencia de valor aceptada en un intercambio del mercado, en porcentaje (0-90), antes de que cuente como presión. Por defecto 30.
se_transport_push_check: Protección contra presión por transporte
se_transport_push_check_info: Rechaza transportes, retenciones y transferencias (recursos y naves) a otro jugador cuando, en los últimos 7 días, el valor enviado a él supera en más del límite de abajo al valor que él envió de vuelta.
se_transport_push_limit: Límite de presión por transporte
se_transport_push_limit_info: Valor de la carga en unidades de deuterio (proporciones del mercado) a partir del cual se aplica la protección. 0 = protección desactivada.
se_depot_cost_real_consumption: Coste del depósito por consumo real
se_depot_cost_real_consumption_info: El depósito de alianza cobra el consumo real de combustible de la flota (con las tecnologías de propulsión y combustible del propietario) / 10 por hora, en lugar del consumo base / 10.
se_hours: Horas
se_remember_me_days: '«Mantener sesión iniciada» dura'
se_remember_me_days_info: 'Días que un inicio de sesión con la casilla «Mantener sesión iniciada» marcada sobrevive a los reinicios del navegador y a las sesiones caducadas. Un cambio de contraseña lo termina. 0 desactiva la opción.'
se_session_lifetime: La sesión caduca tras un periodo de inactividad de
se_session_lifetime_info: 'Horas sin ninguna petición tras las cuales se cierra la sesión de un jugador («sesión caducada»).'
