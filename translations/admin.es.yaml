adm_nav_social: "Inicio de sesión social"
se_social: "Inicio de sesión social"
se_social_info: "Permite que los jugadores inicien sesión o se registren con una cuenta existente de Discord, Facebook, GitHub o Google (OAuth2). Todos los proveedores están desactivados por defecto. Crea una aplicación en el proveedor, registra allí la URL de callback que se muestra abajo e introduce aquí el ID de cliente y el secreto."
se_social_site_url_missing: "La URL base del juego (DEFAULT_URI en .env.local) no está definida, por lo que no se puede crear la URL de callback y los proveedores siguen inutilizables."
se_social_incomplete: "Activado, pero falta el ID de cliente o el secreto: el botón de inicio de sesión permanece oculto."
se_social_enabled: "Activado"
se_social_enabled_info: "Muestra el botón de inicio de sesión en la página de inicio y en la de registro."
se_social_client_id: "ID de cliente"
se_social_client_id_info: "ID de aplicación (cliente) de la app en el proveedor."
se_social_client_secret: "Secreto de cliente"
se_social_client_secret_info: "No se vuelve a mostrar. Déjalo vacío para conservar el secreto guardado."
se_social_callback: "URL de callback"
se_social_callback_info: "Registra exactamente esta dirección como URL de redirección / callback en el proveedor."
se_social_create_app: "Crear la aplicación"
se_social_discord_help: "Discord Developer Portal: New Application, luego OAuth2: añade la redirección y copia el ID de cliente y el secreto."
se_social_facebook_help: "Meta for Developers: crea una app con el caso de uso Inicio de sesión con Facebook y añade la URL en URI de redireccionamiento de OAuth válidos. El correo de Facebook nunca se considera verificado: los jugadores nuevos no pueden registrarse con él y las cuentas existentes no se asocian por correo; conectar desde los ajustes de la cuenta sí funciona."
se_social_github_help: "GitHub Settings, Developer settings, OAuth Apps: New OAuth App, introduce la URL de callback como Authorization callback URL."
se_social_google_help: "Google Cloud Console, APIs y servicios, Credenciales: crea un ID de cliente OAuth de tipo Aplicación web y añade la URL de callback en URI de redireccionamiento autorizados."
se_social_scopes: "Scopes solicitados: %s"
se_del_user_automatic_on: "Auto-delete inactive players"
se_del_user_automatic_on_info: "Switch for the automatic deletion of normal inactive players (not in vacation mode, not banned) after the number of days set above. Off: inactive players are never deleted automatically."
se_del_user_vacation_on: "Auto-delete players in vacation mode"
se_del_user_vacation_on_info: "Switch for the automatic deletion of players who are in vacation mode and have not logged in for the number of days below. Off: players in vacation mode are never deleted automatically."
se_del_user_vacation: "Delete players in vacation mode after"
se_del_user_vacation_info: "Days without a login after which a player in vacation mode is deleted. 0 = same number of days as for inactive players."
se_del_user_banned_on: "Auto-delete banned players"
se_del_user_banned_on_info: "Switch for the automatic deletion of banned players who have not logged in for the number of days below. Off: banned players are never deleted automatically (their ban stays)."
se_del_user_banned: "Delete banned players after"
se_del_user_banned_info: "Days without a login after which a banned player is deleted. 0 = same number of days as for inactive players."
se_vmode_allow_incoming: "Vacation mode with hostile fleets inbound"
se_vmode_allow_incoming_info: "On: players may enter vacation mode while foreign fleets are on their way to them (the attack bounces). Off: vacation mode is refused while foreign fleets with an attack, ACS attack, missile, destroy or spy mission are heading to one of the player's planets or moons."
rp_fleets_error: "There are still fleets of or to players in flight!"
