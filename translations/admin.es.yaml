abuse_flows: Flujos
abuse_top_edge: Par más unilateral
abuse_activity: Actividad de lanzamiento de flotas (24 h)
abuse_activity_info: Cuentas con más lanzamientos de flotas en las últimas 24 horas; pico = lanzamientos en la hora más cargada. Picos altos y constantes pueden indicar juego automatizado.
abuse_player: Jugador
abuse_launches: Lanzamientos
abuse_peak: Pico / hora
