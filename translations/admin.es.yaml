abuse_link_subnet: misma subred (más débil)
abuse_thresholds: 'Umbrales: un par de transferencias aparece si una dirección supera %s unidades de metal y la vuelta es de como máximo %s; los pares de mercado, desde %s intercambios, se marcan si la diferencia supera %s. Sin filas significa que nada alcanzó estos límites (o que los registros están vacíos), no que no haya pasado nada.'
abuse_transfers: Transportes y retenciones unidireccionales
abuse_transfers_info: Transportes, retenciones y transferencias de naves (no retiradas; las naves contadas por coste de construcción) entre dos jugadores cuya carga valía al menos %s unidades de metal en una dirección mientras que como máximo %s de ese valor volvió. Ordenado por valor neto; los pesos son las proporciones de mercado guardadas.
abuse_trades: Intercambios repetidos en el mercado
abuse_trades_info: Intercambios de recursos entre los mismos dos jugadores, al menos %s veces. Proporción = valor entregado por el lado que dio más dividido entre el otro lado (1,00 = referencia del mercado); por encima de %s de diferencia el par se marca.
abuse_giver: Dio más
abuse_receiver: Recibió más
abuse_ratio: Proporción
abuse_outlier: atípico
abuse_protections: Concesiones de protección de reconstrucción
abuse_protections_info: Jugadores que recibieron protección de reconstrucción en el periodo. Los oponentes son la otra parte del informe de combate de ese enfrentamiento; el botín es el valor que sus flotas ganaron en él (los escombros y el valor destruido no se guardan).
abuse_protected: Jugador protegido
abuse_granted: Concedida
abuse_opponents: Oponentes
abuse_loot: Botín del oponente
abuse_report: Informe
abuse_recalls: Retiradas al llegar o después
abuse_recalls_info: Flotas de ataque, ACS y destrucción que fueron retiradas cuando ya se había alcanzado la hora de llegada (patrón de retirada tras llegar).
abuse_mission: Misión
abuse_arrival: Llegada
abuse_recalled: Retirada
abuse_late: Tras la llegada
abuse_fought: combatió
abuse_mission_1: Ataque
abuse_mission_2: Ataque ACS
abuse_mission_9: Destrucción
abuse_missiles_skipped: 'Los lanzamientos de misiles frente al contenido de los silos no forman parte de este informe: las tablas no guardan historial de silos con el que comparar.'
abuse_link_device: mismo dispositivo
abuse_graph: Grupos por flujo de valor
abuse_graph_info: 'Jugadores vinculados por flujo de valor en los últimos %s días (periodo fijo): transportes, retenciones, transferencias de naves (a coste de construcción), intercambios del mercado (ambos lados) y botín de ataques, sumados en ambas direcciones. Solo se conectan pares con al menos %s unidades de metal movidas y %s flujos; se listan los grupos conectados de dos o más (top %s por valor). Neto = valor del par más unilateral del grupo (proporción de su valor total). Las marcas de vínculo indican si los miembros comparten IP, dispositivo o grupo multi con otro miembro. Las filas se leen con un límite por origen.'
abuse_members: Miembros
