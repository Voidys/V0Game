se_rebuild_protection: Reconstruir la protección
se_rebuild_protection_info: En caso de pérdidas importantes, se concede a los jugadores una protección de reconstrucción contra nuevos ataques después de 6 horas durante 48 horas tras el ataque. El 70% de la flota o el 80% de la capacidad de transporte deben ser destruidos en un solo ataque. Además, esto debe corresponder al menos a los puntos de protección Noop * 1000 en unidades o capacidad. El usuario puede finalizar el modo antes de tiempo.
