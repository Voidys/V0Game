install_desc: >-
  Ca să activezi instrumentul de instalare, creează fișierul
  „var/ENABLE_INSTALL_TOOL”.<br> Numele fișierului ține cont de majuscule și
  nu are extensie.<br> Fișierul poate fi gol.

  Se șterge automat după ce instalarea s-a terminat sau dacă are mai mult de o
  oră.
install_title: Instrumentul de instalare este blocat
intro_install: Instalează
intro_lang: Limbă
intro_text: 'V0Game este un joc open-source de strategie spațială în browser: dezvoltă-ți planetele, fă cercetări, trimite flote și luptă-te cu sute de jucători în același timp.<br><br>Acest asistent configurează o instalare nouă pas cu pas: îți verifică serverul, se conectează la baza de date și o creează, construiește tabelele, te lasă să-ți dai un nume jocului și creează administratorul.'
intro_upgrade_head: Ai instalat deja V0Game?
