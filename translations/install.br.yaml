intro_text: 'O V0Game é um jogo de estratégia espacial open source no navegador: desenvolva seus planetas, pesquise, envie frotas e dispute com centenas de jogadores ao mesmo tempo.<br><br>Este assistente monta uma instalação nova passo a passo: ele confere o seu servidor, conecta e cria o banco de dados, monta as tabelas, deixa você batizar o seu jogo e cria o administrador.'
intro_upgrade_head: Já instalou o V0Game?
intro_upgrade_text: <p>Já instalou o V0Game e só quer atualizar?</p><p>Você pode atualizar o seu banco de dados existente aqui em poucos cliques!</p>
