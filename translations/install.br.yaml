ins_db_help: O V0Game guarda tudo em um banco de dados MySQL ou MariaDB. Você consegue os valores abaixo no painel da sua hospedagem (procure por "Bancos de dados" ou "MySQL") ou com quem configurou o seu servidor. Se você mesmo instalou o MySQL, os padrões costumam funcionar.
ins_db_host: Servidor de banco de dados
ins_db_host_info: Quase sempre "localhost". Algumas hospedagens dão um nome como "db1.example.com".
ins_db_name_info: O nome do banco de dados do jogo. Crie-o antes no painel da hospedagem, ou deixe o instalador criar (veja a caixa abaixo).
ins_db_advanced: Avançado (porta, prefixo das tabelas, senha de migração) - normalmente não é necessário
ins_db_prefix_info: Adicionado antes do nome de cada tabela. Mude só se você divide um banco de dados com outros programas.
ins_db_migrationpw_info: Protege a página de atualização (install/?mode=upgrade) para futuras atualizações do jogo. Se deixar vazio, o instalador gera uma senha forte e mostra uma vez na última página.
ins_db_migrationpw_placeholder: gerada automaticamente
ins_migrationpw_invalid: A senha de migração não pode ter aspas, barras invertidas, $ ou quebras de linha.
ins_err_technical: detalhes técnicos
ins_err_access_denied: O servidor de banco de dados recusou o usuário ou a senha. Confira os dois no painel da hospedagem, procurando erros de digitação (maiúsculas e minúsculas contam).
ins_err_unknown_db: Este banco de dados não existe no servidor. Confira o nome ou marque "Criar o banco de dados" abaixo.
ins_err_no_privilege: Este usuário do banco de dados não tem permissão para usar esse banco. Dê a ele todos os privilégios sobre o banco no painel da hospedagem.
ins_err_no_create: Este usuário não tem permissão para criar bancos de dados. Crie um banco vazio no painel da hospedagem e desmarque "Criar o banco de dados".
ins_err_socket: O socket do servidor de banco de dados não foi encontrado. Tente o host "127.0.0.1" em vez de "localhost".
ins_err_unreachable: Não foi possível alcançar o servidor de banco de dados "%s". Confira o nome do host e a porta, e se o servidor de banco de dados está rodando. Muitas hospedagens só aceitam conexões dos próprios servidores web, então "localhost" costuma ser o certo.
ins_game_desc: Dê um nome ao seu jogo e escolha como ele funciona. Tudo aqui pode ser mudado depois na administração (Admin - Configurações).
ins_group_general: Geral
ins_uni_name: Nome do universo
ins_uni_name_info: Aparece para os jogadores quando eles escolhem um universo. Vazio = "Universo 1".
ins_uni_name_invalid: O nome do universo pode ter no máximo 60 caracteres.
ins_language: Idioma padrão
ins_language_info: Idioma para novos visitantes e para a sua conta de administrador.
ins_language_invalid: Idioma desconhecido.
ins_timezone: Fuso horário
ins_timezone_info: Pré-selecionado a partir do seu servidor. Usado para o horário do servidor exibido.
ins_timezone_invalid: Fuso horário desconhecido.
ins_group_speed: Velocidade do jogo
ins_speed_info: Quão rápido andam edifícios, pesquisas, naves, frotas e produção. Clássico é o ritmo original; as predefinições mais rápidas servem para comunidades pequenas e rodadas curtas.
ins_speed_classic: Clássico
ins_speed_classic_info: o ritmo original, rodadas de meses
ins_speed_fast: Rápido
ins_speed_fast_info: cerca de três vezes mais rápido, rodadas de semanas
ins_speed_blitz: Blitz
ins_speed_blitz_info: até dez vezes mais rápido, rodadas de dias
ins_speed_detail: Construção/pesquisa %bx, frotas %fx, recursos %rx
ins_speed_invalid: Predefinição de velocidade desconhecida.
ins_group_players: Jogadores
ins_registration: Cadastro
ins_registration_open: 'Aberto: qualquer um pode se cadastrar'
ins_registration_closed: 'Fechado: só você pode criar contas'
ins_registration_info: Escolha "fechado" enquanto ainda estiver configurando tudo. Você pode abrir depois em Admin - Configurações.
ins_registration_invalid: Configuração de cadastro desconhecida.
ins_bots: Jogadores de computador (bots)
ins_bots_info: De 0 a 50. Os bots jogam como jogadores de verdade, com hábitos diferentes, para um universo novo não ficar vazio. 0 = sem bots.
ins_bots_invalid: O número de bots precisa estar entre 0 e 50.
ins_mail: Enviar e-mails (cadastro, redefinição de senha)
ins_mail_info: Desligado por padrão. Ligue só quando o seu servidor conseguir enviar e-mails; dá para configurar o SMTP depois em Admin - Configurações.
ins_admin_mail_info: Usado para redefinir senhas e como endereço de contato.
ins_admin_mail_invalid: Digite um e-mail válido.
ins_admin_pass_confirm: Repetir a senha
ins_admin_pass_rules: A senha precisa ter pelo menos %d caracteres (no máximo 64). Uma frase com algumas palavras é fácil de lembrar e difícil de adivinhar.
ins_admin_pass_short: A senha precisa ter pelo menos %d caracteres.
ins_admin_pass_long: A senha pode ter no máximo 64 caracteres.
ins_admin_pass_mismatch: As duas senhas não são iguais.
