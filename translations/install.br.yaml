install_desc: |-
  Para ativar a ferramenta de instalação, crie o arquivo "var/ENABLE_INSTALL_TOOL".<br> O nome do arquivo diferencia maiúsculas de minúsculas e não tem extensão.<br> O arquivo pode estar vazio.
  Ele é excluído automaticamente quando a instalação termina, ou se tiver mais de uma hora.
