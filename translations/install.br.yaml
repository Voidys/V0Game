ins_credits_head: Nos ombros de gigantes
ins_credits_text: 'O V0Game continua uma longa linhagem de jogos de navegador open source. Respeito a todo mundo que construiu e manteve isso vivo antes de nós:'
ins_credits_thanks: Valeu a todos os programadores e mantenedores que construíram este jogo e o mantiveram vivo ao longo dos anos, do 2Moons e do SteemNova ao pr0game.
