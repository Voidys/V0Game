ins_board: Ativar o fórum da comunidade
ins_board_info: Um fórum para os seus jogadores. Quando desligado, todos os links do fórum ficam ocultos e as páginas do fórum ficam indisponíveis.
ins_legal_note: Os textos gerados são só modelos. Como operador, você é responsável pelos textos jurídicos do seu jogo e deve revisá-los.
