ins_done_cron_info: 'Sem ele nada no jogo avança (frotas, filas de construção, estatísticas). Adicione esta linha ao crontab do usuário do servidor web (crontab -e) ou crie um cron job com ela no painel da sua hospedagem:'
ins_done_cron_help: Como configurar o cron job (também em um painel de hospedagem)
ins_done_locked: A ferramenta de instalação agora está bloqueada.
ins_done_locked_info: Ninguém consegue rodar o assistente de novo. Para atualizar depois, siga a seção de atualização da documentação.
ins_done_https: Use HTTPS.
ins_done_https_info: 'Você está em HTTP puro: as senhas trafegam sem criptografia. Configure um certificado (por exemplo, Let''s Encrypt) antes de convidar jogadores.'
ins_done_https_ok: 'Esta página foi servida por HTTPS: ótimo.'
ins_done_settings: Mude as configurações depois.
ins_done_settings_info: 'Admin - Configurações: nome do jogo, velocidade, cadastro, e-mail (SMTP), bots e muito mais.'
ins_done_bots: Bots.
ins_done_bots_info: '%d bots foram criados. Eles agem quando o cron job roda. Gerencie-os na administração.'
ins_done_bots_failed: O administrador foi criado, mas não foi possível criar os bots. Você pode adicioná-los depois na administração.
ins_done_migrationpw: Anote a sua senha de migração (mostrada só uma vez).
ins_done_migrationpw_info: Você vai precisar dela para as atualizações do jogo. Ela também fica guardada em config/game.php.
