# engagement features (step 5)
ins_group_features: 'Recursos opcionais do jogo'
ins_features_desc: 'Todos desativados por padrão. Cada um pode ser ativado, desativado e ajustado depois na administração (configurações do universo).'
ins_feat_events: 'Eventos do universo'
ins_feat_events_info: 'Eventos com horário marcado que você agenda no painel de administração: tempestades de íons, feiras comerciais, máximos solares, surtos de piratas, fins de semana de velocidade.'
ins_feat_catchup: 'Impulso de recuperação'
ins_feat_catchup_info: 'Contas novas bem abaixo da média recebem um bônus de mineração que diminui ao longo de alguns dias.'
ins_feat_contracts: 'Contratos semanais'
ins_feat_contracts_info: 'Três objetivos rotativos por jogador e por semana, com uma recompensa cosmética ou pequena de recursos.'
ins_feat_alliance_goals: 'Objetivos da aliança'
ins_feat_alliance_goals_info: 'O líder da aliança define um objetivo semanal para os membros; ao concluí-lo, eles ganham distintivos.'
ins_feat_returning: 'Bem-vindo de volta'
ins_feat_returning_info: 'Jogadores que retornam após uma longa pausa veem o que aconteceu e podem ganhar uma proteção curta.'
ins_feat_seasons: 'Temporadas'
ins_feat_seasons_info: 'Uma classificação mensal (atacante, guerreiro, defensor, explorador, reciclador) sem nenhum reset; os vencedores ganham distintivos.'
ins_feat_cosmetics: 'Distintivos e títulos'
ins_feat_cosmetics_info: 'Mostra os distintivos, títulos e cores de nome conquistados no cartão do jogador e no chat.'
ins_feat_bounties: 'Recompensas'
ins_feat_bounties_info: 'Jogadores colocam recursos sobre outro jogador; quem destruir frota suficiente dele os recebe.'
ins_feat_alliance_wars: 'Placar de guerra da aliança'
ins_feat_alliance_wars_info: 'Um placar ao vivo para as guerras declaradas na diplomacia da aliança.'
ins_feat_battle_feed: 'Feed de batalhas'
ins_feat_battle_feed_info: 'Batalhas grandes são anunciadas no chat global (requer o chat).'
ins_feat_derelicts: 'Campos de destroços'
ins_feat_derelicts_info: 'Campos de resgate aparecem na galáxia por um tempo; os primeiros recicladores que chegarem coletam.'
ins_feat_mothership: 'Nave-mãe pirata'
ins_feat_mothership_info: 'Um chefe mundial raro que só pode ser derrotado em um ACS; o saque é dividido pelo dano causado.'
ins_feat_expedition_stories: 'Histórias de expedição'
ins_feat_expedition_stories_info: 'Sinais raros levam o jogador por uma missão curta de expedição com uma recompensa maior.'
ins_feat_relics: 'Relíquias'
ins_feat_relics_info: 'Expedições podem encontrar relíquias (de comum a épica, com bônus de conjunto) que os jogadores encaixam em seus planetas para pequenos impulsos.'
