adm_nav_social: "Login social"
se_social: "Login social"
se_social_info: "Permette ai giocatori di accedere o registrarsi con un account Discord, Facebook, GitHub o Google esistente (OAuth2). Tutti i provider sono disattivati di default. Crea un'app presso il provider, registra lì l'URL di callback mostrato qui sotto e inserisci qui ID client e segreto."
se_social_site_url_missing: "L'URL di base del gioco (DEFAULT_URI in .env.local) non è impostato, quindi non si può costruire nessun URL di callback e i provider restano inutilizzabili."
se_social_incomplete: "Attivato, ma mancano l'ID client o il segreto client: il pulsante di login resta nascosto."
se_social_enabled: "Attivato"
se_social_enabled_info: "Mostra il pulsante di login nella pagina iniziale e nella pagina di registrazione."
se_social_client_id: "ID client"
se_social_client_id_info: "ID dell'applicazione (client) dell'app presso il provider."
se_social_client_secret: "Segreto client"
se_social_client_secret_info: "Non viene più mostrato. Lascia vuoto per mantenere il segreto salvato."
se_social_callback: "URL di callback"
se_social_callback_info: "Registra esattamente questo indirizzo come URL di redirect / callback presso il provider."
se_social_create_app: "Crea l'app"
se_social_discord_help: "Discord Developer Portal: New Application, poi OAuth2: aggiungi il redirect, copia l'ID client e il segreto client."
se_social_facebook_help: "Meta for Developers: crea un'app con il caso d'uso Facebook Login e aggiungi l'URL tra gli URI di redirect OAuth validi. L'indirizzo e-mail di Facebook non viene mai considerato verificato: i nuovi giocatori non possono registrarsi tramite esso e gli account esistenti non vengono abbinati tramite e-mail; il collegamento dalle impostazioni dell'account funziona."
se_social_github_help: "GitHub Settings, Developer settings, OAuth Apps: New OAuth App, inserisci l'URL di callback come authorization callback URL."
se_social_google_help: "Google Cloud Console, APIs and Services, Credentials: crea un OAuth client ID di tipo Web application e aggiungi l'URL di callback tra gli authorized redirect URI."
se_social_scopes: "Scope richiesti: %s"
se_del_user_automatic_on: "Elimina automaticamente i giocatori inattivi"
se_del_user_automatic_on_info: "Interruttore per l'eliminazione automatica dei normali giocatori inattivi (non in modalità vacanza, non bannati) dopo il numero di giorni impostato sopra. Disattivato: i giocatori inattivi non vengono mai eliminati automaticamente."
se_del_user_vacation_on: "Elimina automaticamente i giocatori in modalità vacanza"
se_del_user_vacation_on_info: "Interruttore per l'eliminazione automatica dei giocatori in modalità vacanza che non accedono da un numero di giorni pari a quello indicato sotto. Disattivato: i giocatori in modalità vacanza non vengono mai eliminati automaticamente."
se_del_user_vacation: "Elimina i giocatori in modalità vacanza dopo"
se_del_user_vacation_info: "Giorni senza accesso dopo i quali un giocatore in modalità vacanza viene eliminato. 0 = lo stesso numero di giorni dei giocatori inattivi."
se_del_user_banned_on: "Elimina automaticamente i giocatori bannati"
se_del_user_banned_on_info: "Interruttore per l'eliminazione automatica dei giocatori bannati che non accedono da un numero di giorni pari a quello indicato sotto. Disattivato: i giocatori bannati non vengono mai eliminati automaticamente (il loro ban resta)."
se_del_user_banned: "Elimina i giocatori bannati dopo"
se_del_user_banned_info: "Giorni senza accesso dopo i quali un giocatore bannato viene eliminato. 0 = lo stesso numero di giorni dei giocatori inattivi."
se_vmode_allow_incoming: "Modalità vacanza con flotte ostili in arrivo"
se_vmode_allow_incoming_info: "Attivo: i giocatori possono entrare in modalità vacanza mentre flotte straniere sono in viaggio verso di loro (l'attacco rimbalza). Disattivo: la modalità vacanza viene rifiutata mentre flotte straniere con una missione di attacco, attacco ACS, missile, distruzione o spionaggio sono dirette a uno dei pianeti o delle lune del giocatore."
rp_fleets_error: "Ci sono ancora flotte di giocatori, o dirette a giocatori, in volo!"
abuse_reviews_menu: "Review queue"
abuse_reviews_title: "Anti-multi / push-trade review queue"
abuse_reviews_info: "Pairs are scored 0-100 from shared IP (30), shared device (30), multi group not marked known (20), same subnet (10), one-sided transfers (10-30), repeated skewed trades (10-20) and trade-graph cluster membership (15), refreshed hourly. Pairs from %s points are queued; a dismissed pair re-opens only when its score rises by 20 or more."
