se_planet_creation: Posizionamento del pianeta madre
se_planet_creation_info: >-
  I nuovi pianeti madre possono essere piazzati in modo iterativo tra sistemi e
  galassie, a caso, a blocchi, oppure 50% a caso e 50% a blocchi.<br>Il
  posizionamento casuale riempie galassie e sistemi in modo uniforme in
  posizioni casuali.<br>Il posizionamento a blocchi sceglie un sistema che ha
  già uno o due pianeti. Se un sistema simile non esiste o ci sono meno di 50
  giocatori, il posizionamento è casuale.
