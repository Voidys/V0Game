se_transport_push_check_info: "Rifiuta trasporti, mantenimenti e trasferimenti (carico e navi) verso un altro giocatore quando, negli ultimi 7 giorni, il valore inviatogli supera il valore che lui ha rimandato di oltre il limite indicato qui sotto."
