se_pow_adaptive: Protezione anti-bot - difficoltà adattiva
se_pow_adaptive_info: >-
  Attivo: gli indirizzi IP e le reti sospette (/24 o /64) ricevono un
  rompicapo molto più difficile (molte richieste, errori o registrazioni in
  poco tempo). Disattivo: ogni visitatore riceve il rompicapo base e non viene
  letto nessun contatore.
se_pow_elevated_factor: Protezione anti-bot - fattore a rischio elevato
se_pow_elevated_factor_info: Il rompicapo diventa tante volte più difficile (predefinito 20).
se_pow_high_factor: Protezione anti-bot - fattore a rischio alto
se_pow_high_factor_info: Il rompicapo diventa tante volte più difficile (predefinito 100).
se_pow_max_cap: Protezione anti-bot - limite di difficoltà
se_pow_max_cap_info: >-
  Il numero più alto dopo l'applicazione dei fattori. 1500000 richiede circa 25
  secondi su uno smartphone lento.
se_pow_sensitivity: Protezione anti-bot - sensibilità del rilevamento del rischio
se_pow_sensitivity_info: >-
  Percentuale delle soglie predefinite (elevato da 5 richieste/10 min, 3
  errori/ora o 2 registrazioni/24 h per IP; alto da 20 / 10 / 5; le reti il
  triplo). 200 = servono il doppio degli eventi, 50 = la metà.
se_pow_max_number: Protezione anti-bot - difficoltà (numero massimo)
se_pow_max_number_info: >-
  Il browser prova gli hash fino a questo numero, in media la metà. 25000
  richiede ben meno di un secondo. Più alto significa più lavoro per i bot.
se_pow_min_seconds: Protezione anti-bot - tempo minimo prima dell'invio (secondi)
se_pow_min_seconds_info: >-
  I moduli inviati più in fretta di così dopo il caricamento vengono rifiutati.
  0 disattiva il controllo.
se_proofofwork: Protezione anti-bot
se_proofofwork_info: >-
  Registrazione e password dimenticata sono protette da un piccolo calcolo che
  il browser risolve da solo, senza nessuna terza parte.
se_rebuild_protection: Protezione di ricostruzione
se_rebuild_protection_info: >-
  Dopo perdite pesanti, i giocatori ottengono la protezione di ricostruzione
  contro ulteriori attacchi dopo 6 ore, della durata di 48 ore dall'attacco. Va
  distrutto il 70% della flotta o l'80% della capacità di
  trasporto in un solo attacco, e quella perdita deve essere almeno punti
  della protezione principianti × 1.000 in unità o capacità. Il giocatore può
  terminare la modalità in anticipo.
se_redis_connection_url: URL di connessione a Redis
se_redis_connection_url_info: redis[s]://[[username][:password]@][host][:port][/db-number]
se_ref: Link di invito
se_ref_active: Attiva i link di invito
se_ref_active_info: I link di invito permettono ai giocatori di invitare amici. I giocatori reclutati danno un bonus.
se_ref_bonus: Bonus per gli inviti
se_ref_bonus_info: Materia oscura che il giocatore invitante riceve per ogni giocatore reclutato.
se_ref_max_referals: Inviti massimi
se_ref_max_referals_info: Numero massimo di giocatori che un utente può reclutare.
se_ref_minpoints: Punti minimi per il bonus
