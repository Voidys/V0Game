se_bots_alliances_enabled: "I bot formano alleanze"
se_bots_alliances_enabled_info: "I bot fondano proprie alleanze e ogni tanto si uniscono ad altre. Disattivato: i bot restano lupi solitari, non si candidano da nessuna parte e lasciano le alleanze di cui sono membri (le alleanze fondate da un bot restano)."
se_bots_join_human_alliances: "I bot possono unirsi alle alleanze dei giocatori"
se_bots_join_human_alliances_info: "I bot possono candidarsi anche alle alleanze fondate da giocatori umani. Disattivato: i bot si uniscono solo alle alleanze fondate da bot e lasciano le alleanze dei giocatori."
se_bot_reply_delay_hours: "Ritardo di risposta (ore)"
se_bot_reply_delay_hours_info: "Ore che il messaggio privato senza risposta più vecchio di un giocatore aspetta prima che un bot risponda con un'unica risposta a tutti i messaggi in sospeso di quel giocatore. È anche l'intervallo minimo tra due messaggi avviati da un bot (reazioni agli attacchi, sfottò dei raid) allo stesso giocatore. 0 = nessun ritardo."
se_bot_chatter: "I bot chiacchierano"
se_bot_chatter_info: "Attivo: i bot rispondono ai messaggi privati. Disattivo: i messaggi vengono comunque letti e contati, ma vengono inviate solo le reazioni di combattimento (dopo essere stati attaccati o aver razziato un giocatore che ha scritto loro). I bot non scrivono mai ai giocatori per primi."
