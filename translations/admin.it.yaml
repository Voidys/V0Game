se_noob_protection: Protezione principianti
se_noob_protection_multi: Fattore di protezione principianti
se_noob_protection_multi_info: >-
  Puoi attaccare solo i giocatori i cui punti sono entro i tuoi punti × questo
  fattore. Esempio con 18: se hai 1.000 punti puoi attaccare i giocatori con
  meno di 18.000 punti. Un giocatore con 20.000 punti può attaccare chiunque
  fino a 360.000 punti, quindi un giocatore da 50.000 punti rientra ancora nel
  suo raggio.
se_noob_protection_outlaw: Sistema dei fuorilegge
se_noob_protection_outlaw_info: >-
  Permette ai giocatori più deboli di attaccare quelli più forti. L'attaccante
  diventa un fuorilegge per 7 giorni e perde la protezione principianti.
