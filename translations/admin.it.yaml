se_bots_raids: "Bot: raid e obiettivi"
se_bots_defense: "Bot: fuga della flotta e minacce"
se_bots_growth: "Bot: crescita e attività"
se_bots_features: "Bot: opzioni di comportamento"
se_bots_preset: "Preset di difficoltà"
se_bots_preset_info: "Scegliere un preset e salvare riempie i valori dei bot qui sotto (raid on/off e impostazioni di capacità restano invariati); modificare poi un valore riporta il preset su personalizzato. Ogni preset mantiene i limiti che proteggono i giocatori: attacchi per obiettivo e giorno, pausa per obiettivo, mai giocatori protetti (principianti) o in vacanza. I singoli bot possono sostituire il preset nell’elenco dei bot."
se_bots_preset_custom: "Personalizzato"
se_bots_preset_relaxed: "Rilassato"
se_bots_preset_normal: "Normale"
se_bots_preset_hard: "Difficile"
se_bots_preset_brutal: "Brutale"
se_bots_max_fleets: "Max. flotte di raid dei bot in volo"
se_bots_max_fleets_info: "Limite delle flotte di spionaggio e attacco dei bot in volo contemporaneamente in questo universo (0 = illimitato)."
se_bots_aggression: "Aggressività (0-100)"
se_bots_aggression_info: "50 = comportamento classico. Più alto: i bot fanno più raid per sessione e accettano raid con meno profitto per costo; più basso: il contrario."
se_bots_attack_actives: "Attacca i giocatori attivi"
se_bots_attack_actives_info: "Disattivato: i bot attaccano solo giocatori non attivi nell’ultima ora (giocatori inattivi e altri bot)."
se_bots_raids_per_target_day: "Raid per obiettivo e giorno"
se_bots_raids_per_target_day_info: "Massimo di attacchi di un bot allo stesso giocatore in 24 ore. 0 = valore del profilo del bot (2-4). Il limite di bash del gioco vale sempre in aggiunta."
se_bots_target_cooldown_hours: "Pausa per obiettivo (ore)"
se_bots_target_cooldown_hours_info: "Per quanto tempo un obiettivo viene lasciato in pace dopo uno sguardo non redditizio, un volo rifiutato o un richiamo."
se_bots_min_target_points: "Punti minimi dell’obiettivo"
se_bots_min_target_points_info: "I bot ignorano i giocatori con meno punti (0 = disattivato)."
se_bots_min_target_ratio_percent: "Dimensione minima dell’obiettivo in percentuale del bot"
se_bots_min_target_ratio_percent_info: "I bot ignorano i giocatori i cui punti sono sotto questa percentuale dei propri (0 = disattivato)."
se_bots_probes_per_target_day: "Voli di sonde per obiettivo e giorno"
se_bots_probes_per_target_day_info: "Massimo di voli di spionaggio di un bot verso lo stesso pianeta in 24 ore (0 = li limita solo la pausa di spionaggio)."
se_bots_probes_wanted: "Sonde che un bot da raid tiene a casa"
se_bots_probes_wanted_info: "Un bot che va in raid costruisce sonde finché ne ha altrettante."
se_bots_min_loot: "Bottino minimo (valore)"
se_bots_min_loot_info: "Un attacco deve promettere almeno questo bottino (metallo + 1,5 cristallo + 2 deuterio)."
se_bots_escort_shares: "Quote di scorta in percentuale"
se_bots_escort_shares_info: "Quote delle navi da guerra del pianeta provate come scorta, dalla più piccola, separate da virgole (es. 0, 15, 30, 50, 75, 100)."
se_bots_simulation_runs: "Battaglie simulate per flotta"
se_bots_simulation_runs_info: "Una flotta viene inviata solo se vince ogni battaglia simulata (1-5)."
se_bots_spy_cooldown_minutes: "Pausa di spionaggio (minuti)"
se_bots_spy_cooldown_minutes_info: "Minuti prima che un bot spii di nuovo lo stesso pianeta (il bersaglio riceve ogni volta un messaggio di controspionaggio)."
se_bots_spy_cooldown_streak_minutes: "Pausa di spionaggio in una serie di raid (minuti)"
se_bots_spy_cooldown_streak_minutes_info: "Lo stesso durante una serie di raid, dove contano i rapporti recenti."
se_bots_recall_loot_percent: "Richiamo sotto questa quota del bottino minimo (%)"
se_bots_recall_loot_percent_info: "Il nuovo spionaggio prima dell’impatto richiama una flotta quando il bottino atteso scende sotto questa percentuale del bottino minimo."
se_bots_recall_ratio_percent: "Richiamo sotto questa quota del rapporto di profitto richiesto (%)"
se_bots_recall_ratio_percent_info: "Lo stesso per il rapporto tra bottino e carburante e perdite."
se_bots_streak_loot_percent: "Serie di raid dopo un colpo del valore di (% del bottino minimo)"
se_bots_streak_loot_percent_info: "Un colpo che ha reso almeno questa quota del bottino minimo avvia una serie di raid."
se_bots_raids_per_human_day: "Raid per giocatore e giorno (tutti i bot insieme)"
se_bots_raids_per_human_day_info: "Massimo di attacchi dei bot allo stesso giocatore umano in 24 ore, contati su tutti i bot dell’universo (limite anti-frustrazione, sempre attivo)."
se_bots_human_cooldown_hours: "Pausa per giocatore tra attacchi dei bot (ore)"
se_bots_human_cooldown_hours_info: "Dopo l’attacco di un bot a un umano, nessun bot lo attacca per questo tempo, e mai finché un altro attacco di bot contro di lui è in arrivo."
se_bots_probes_per_human_day: "Voli di sonde per giocatore e giorno (tutti i bot insieme)"
se_bots_probes_per_human_day_info: "Massimo di voli di spionaggio dei bot verso lo stesso giocatore umano in 24 ore, contati su tutti i bot dell’universo."
se_bots_scout_range_max: "Massima portata di esplorazione (sistemi)"
se_bots_scout_range_max_info: "I bot non guardano mai oltre questo numero di sistemi attorno ai loro pianeti, qualunque cosa dica il profilo: circa ciò che un giocatore sfoglia nella vista galassia."
se_bots_respy_jitter_seconds: "Variazione casuale del nuovo spionaggio (secondi)"
se_bots_respy_jitter_seconds_info: "Lo spionaggio poco prima dell’impatto di un raid parte a caso fino a questo numero di secondi prima del previsto (0 = tempi esatti)."
se_bots_timezone_spread_hours: "Dispersione del fuso orario personale (ore)"
se_bots_timezone_spread_hours_info: "Ogni bot riceve uno scarto personale stabile fino a questo numero di ore (più o meno) rispetto all’orologio del server, così i bot di un profilo non giocano tutti alla stessa ora (0 = disattivato)."
se_bots_fleetsave_enabled: "I bot mettono in salvo la flotta"
se_bots_fleetsave_enabled_info: "Disattivato: i bot non mettono mai in salvo la flotta, né a fine sessione né con un attacco in arrivo."
se_bots_fleetsave_keep_percent: "Risorse che una fuga di flotta lascia a casa (%)"
se_bots_fleetsave_keep_percent_info: "Quota di ogni scorta che resta sul pianeta perché la costruzione continui."
se_bots_fleetsave_min_offline_minutes: "Tempo offline minimo per una fuga di flotta (minuti)"
se_bots_fleetsave_min_offline_minutes_info: "A fine sessione un bot mette in salvo la flotta solo se prevede di restare assente almeno così a lungo."
se_bots_threat_window_hours: "Finestra di minaccia (ore)"
se_bots_threat_window_hours_info: "Le flotte ostili in arrivo vengono notate questo numero di ore prima dell’impatto."
se_bots_ship_weight_percent: "Peso della costruzione di navi (%)"
se_bots_ship_weight_percent_info: "Moltiplicatore di quanto i bot preferiscono costruire navi rispetto ad altro (100 = classico)."
se_bots_defense_weight_percent: "Peso della costruzione di difese (%)"
se_bots_defense_weight_percent_info: "Moltiplicatore di quanto i bot preferiscono costruire difese (100 = classico)."
se_bots_growth_speed_percent: "Velocità di crescita (%)"
se_bots_growth_speed_percent_info: "Moltiplicatore del guadagno giornaliero di abilità dei profili dei bot (100 = classico; i profili senza guadagno di abilità restano invariati)."
se_bots_growth_bonus: "Guadagno di abilità extra al giorno (millesimi)"
se_bots_growth_bonus_info: "Aggiunto al guadagno giornaliero di abilità di ogni bot (10 = un punto percentuale al giorno), limitato dall’abilità massima del profilo."
se_bots_max_planets: "Pianeti massimi per bot"
se_bots_max_planets_info: "I bot smettono di colonizzare a questo numero di pianeti (0 = vale solo il limite del gioco)."
se_bots_activity_percent: "Moltiplicatore di attività (%)"
se_bots_activity_percent_info: "Scala la probabilità oraria che un bot si colleghi (100 = tabella del profilo; sopra 100 i bot si collegano più spesso)."
se_bots_hidden_rhythm_percent: "Quota di bot con ritmo nascosto (%)"
se_bots_hidden_rhythm_percent_info: "Questi bot spostano ogni giorno il proprio ritmo giornaliero di una quantità diversa, quindi non sono prevedibili dai loro orari online."
se_bots_revenge: "Vendetta"
se_bots_revenge_info: "I bot serbano rancore (sale quando un giocatore li attacca o li spia, scende del 10 % al giorno) e spiano e contrattaccano il giocatore più ostile nel raggio se il pianificatore di raid trova un piano vincibile. I limiti per giocatore e giorno restano validi."
se_bots_bot_acs: "Attacchi di gruppo dei bot"
se_bots_bot_acs_info: "Un bot che non riesce a battere un obiettivo da solo apre un attacco di gruppo e invita i bot alleati (stessa alleanza) online; si uniscono come i giocatori. I limiti per giocatore e giorno contano un gruppo come un solo attacco."
se_bots_recycling: "Riciclaggio"
se_bots_recycling_info: "I bot inviano riciclatori ai campi di detriti che vedono attorno ai loro pianeti (prima quelli dei propri scontri) quando il raccolto supera il carburante, e costruiscono qualche riciclatore se non ne hanno."
se_bots_moons: "Lune"
se_bots_moons_info: "I bot usano le loro lune: le flotte vengono stazionate sulla luna al logout e i raid possono partire da una luna."
se_bots_missiles: "Missili"
se_bots_missiles_info: "I bot con silo missilistico (livello 4), propulsore a impulso e missili interplanetari sparano alle difese di un obiettivo che blocca un raid, poi spiano di nuovo e attaccano. Con questo interruttore attivo i bot costruiscono silo e missili."
se_bots_warmonger: "Guerrafondaio a fine partita"
se_bots_warmonger_info: "Dai punti indicati sotto, un bot fa più raid, accetta un profitto più sottile e prende di mira anche i giocatori attivi. Il pianificatore di raid e i limiti per giocatore restano validi."
se_bots_warmonger_points: "Soglia di punti del guerrafondaio"
se_bots_warmonger_points_info: "Punti a partire dai quali un bot può diventare guerrafondaio."
bot_difficulty: "Difficoltà"
bot_override_preset: "Preset di questo bot"
bot_override_universe: "Come l’universo"
bot_override_aggression: "Aggressività"
bot_override_save: "Salva"
bot_override_reset: "Reimposta"
bot_override_saved: "Difficoltà del bot salvata."
