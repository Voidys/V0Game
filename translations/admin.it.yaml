se_discord_widget_guild_info: "ID del tuo server Discord (17-20 cifre; Impostazioni server → Widget, \"Abilita il widget del server\" deve essere attivo). Mostra un riquadro con il numero di utenti online nella pagina iniziale, aggiornato ogni 5 minuti. Se vuoto, viene nascosto."
