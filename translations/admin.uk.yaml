hof_file: JSON-файл
hof_import_help: 'Формат: hall-of-fame, версія 1 (макс. 1 МБ). Замінює наявні дані цього всесвіту.'
hof_confirm_import: Замінити наявні дані залу слави цього всесвіту?
hof_imported: Зал слави імпортовано.
hof_cleared: Дані залу слави видалено.
hof_error_nofile: Не завантажено коректний файл.
hof_error_invalid: 'Імпорт відхилено:'
se_bash_war_exempt: Війни знімають ліміт bash
se_bash_war_exempt_info: 'Атаки між альянсами у війні (прийняті, старші за один день) не враховуються в лімітах bash. Вимкнено: атаки під час війни враховуються як і всі інші.'
se_honor_pair_cap: Чесні бої між парою (24 год)
se_honor_pair_cap_info: Скільки чесних боїв між двома гравцями (в будь-якому напрямку) нараховують честь протягом 24 годин. Наступні бої враховуються як нейтральні. 0 = без обмежень.
se_market_push_tolerance: Допустима різниця на ринку (push)
se_market_push_tolerance_info: Допустима різниця вартості торгівлі на ринку у відсотках (0–90), після якої вона вважається push-торгівлею. За замовчуванням 30.
se_transport_push_check: Захист від push-передач
se_transport_push_check_info: Відхиляє транспорти, утримання і передачі (вантаж і кораблі) іншому гравцеві, якщо за останні 7 днів вартість надісланого йому перевищує вартість повернутого на більше, ніж вказаний нижче ліміт.
se_transport_push_limit: Ліміт push-передач
se_transport_push_limit_info: Вартість вантажу в одиницях дейтерію (ринкові співвідношення), вище якої діє захист. 0 = захист вимкнено.
se_depot_cost_real_consumption: Вартість депо за реальним споживанням
se_depot_cost_real_consumption_info: Депо альянсу бере реальну витрату палива флоту (з урахуванням двигунів і технологій палива власника) / 10 на годину замість базової витрати / 10.
se_hours: Години
se_remember_me_days: '«Залишатися в системі» діє'
se_remember_me_days_info: 'Дні, протягом яких вхід із позначкою «Залишатися в системі» зберігається після перезапуску браузера та завершених сеансів. Зміна пароля його завершує. 0 вимикає цю опцію.'
