se_proofofwork_info: Реєстрація і відновлення пароля захищені невеликим обчисленням, яке браузер виконує сам, без участі третіх сторін.
se_rebuild_protection: Захист відбудови
se_rebuild_protection_info: Після великих втрат гравці отримують захист відбудови від подальших атак через 6 годин, який діє 48 годин від атаки. За одну атаку має бути знищено 70% флоту або 80% місткості транспортів, і ці втрати мають становити щонайменше захист новачків (очки × 1 000) в одиницях або місткості. Гравець може завершити режим достроково.
