abuse_graph: Кластери потоку вартості
abuse_graph_info: 'Гравці, пов''язані потоком вартості за останні %s днів (фіксоване вікно): транспорти, утримання, передачі кораблів (за вартістю будівництва), ринкові торгівлі (обидві сторони) і здобич з атак, сумовані в обидва напрямки. Враховуються лише пари, між якими переміщено щонайменше %s одиниць металу і %s потоків; показуються зв''язані групи з двох і більше (топ %s за вартістю). Чиста вартість = вартість найбільш однобічної пари кластера (частка від його загальної вартості). Позначки зв''язків показують, чи мають учасники спільний IP, пристрій або мульти-групу з іншим учасником. Рядки читаються з обмеженням на джерело.'
