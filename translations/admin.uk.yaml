adm_info_chk_https_hint: Цей запит виконано не через HTTPS. Паролі та сесії передаються без шифрування.
adm_info_chk_mail: Доставка пошти
adm_info_chk_mail_hint: Пошта вимкнена або неповна (листи активації та скидання пароля не прийдуть). Див. налаштування.
