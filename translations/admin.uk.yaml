abuse_thresholds: 'Пороги: пара передач виводиться від %s одиниць металу в один бік, якщо назад повернуто не більше ніж %s; ринкові пари — від %s торгівель, позначаються при різниці понад %s. Порожні рядки означають, що нічого не досягло цих порогів (або в журналах нічого немає), а не що нічого не відбувалося.'
abuse_transfers: Односторонні транспорти і утримання
abuse_transfers_info: Транспорти, утримання і передачі кораблів (не відкликані; кораблі враховуються за вартістю будівництва) між двома гравцями, вантаж яких мав вартість щонайменше %s одиниць металу в один бік, а назад поверталося не більше %s цієї вартості. Сортовано за чистою вартістю; ваги — збережені ринкові співвідношення.
abuse_trades: Повторювані торгівлі на ринку
abuse_trades_info: Обміни ресурсами між тими самими двома гравцями, щонайменше %s разів. Співвідношення = вартість, віддана стороною, що віддала більше, поділена на вартість іншої сторони (1,00 = ринкова еталонна величина); понад %s різниці пара позначається.
