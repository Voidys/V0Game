abuse_protections: Надані захисти відбудови
abuse_protections_info: Гравці, які отримали захист відбудови у вікні. Суперники — інша сторона бойового звіту цього бою; здобич — вартість, яку їхні флоти отримали в ньому (уламки і знищена вартість не зберігаються).
