se_bots_attack_actives: "Атакувати активних гравців"
se_bots_attack_actives_info: "Викл.: боти атакують лише гравців, які не були активні за останню годину (неактивні гравці та інші боти)."
se_bots_raids_per_target_day: "Рейдів на ціль за добу"
se_bots_raids_per_target_day_info: "Максимум атак одного бота на одного гравця за 24 години. 0 = значення з профілю бота (2-4). Ліміт башингу гри завжди діє додатково."
se_bots_target_cooldown_hours: "Пауза на ціль (години)"
se_bots_target_cooldown_hours_info: "Як довго ціль залишають у спокої після невигідного огляду, відмовленого польоту або відкликання."
se_bots_min_target_points: "Мінімум очок цілі"
se_bots_min_target_points_info: "Боти ігнорують гравців з меншою кількістю очок (0 = викл.)."
se_bots_min_target_ratio_percent: "Мінімальний розмір цілі у відсотках від бота"
se_bots_min_target_ratio_percent_info: "Боти ігнорують гравців, чиї очки нижчі за цей відсоток їхніх власних очок (0 = викл.)."
se_bots_probes_per_target_day: "Польотів зондів на ціль за добу"
se_bots_probes_per_target_day_info: "Максимум шпигунських польотів одного бота на одну планету за 24 години (0 = обмежує лише пауза шпигунства)."
se_bots_probes_wanted: "Зонди, які рейдовий бот тримає вдома"
se_bots_probes_wanted_info: "Бот, що йде в рейд, будує зонди, доки їх не стане стільки."
se_bots_min_loot: "Мінімальна здобич (цінність)"
se_bots_min_loot_info: "Атака має обіцяти щонайменше таку здобич (метал + 1,5 кристала + 2 дейтерію)."
se_bots_escort_shares: "Частки ескорту у відсотках"
se_bots_escort_shares_info: "Частки бойових кораблів планети, що пробуються як ескорт, від найменшої, через кому (напр. 0, 15, 30, 50, 75, 100)."
se_bots_simulation_runs: "Симульованих боїв на флот"
se_bots_simulation_runs_info: "Флот надсилається, лише якщо виграє кожен симульований бій (1-5)."
se_bots_spy_cooldown_minutes: "Пауза шпигунства (хвилини)"
se_bots_spy_cooldown_minutes_info: "Хвилини до того, як бот знову шпигуватиме за тією ж планетою (ціль щоразу отримує повідомлення про контррозвідку)."
se_bots_spy_cooldown_streak_minutes: "Пауза шпигунства в серії рейдів (хвилини)"
se_bots_spy_cooldown_streak_minutes_info: "Те саме під час серії рейдів, де важливі свіжі звіти."
se_bots_recall_loot_percent: "Відкликання нижче цієї частки мінімальної здобичі (%)"
se_bots_recall_loot_percent_info: "Повторне шпигунство перед ударом відкликає флот, якщо очікувана здобич впала нижче цього відсотка мінімальної здобичі."
se_bots_recall_ratio_percent: "Відкликання нижче цієї частки потрібного співвідношення прибутку (%)"
se_bots_recall_ratio_percent_info: "Те саме для співвідношення здобичі до пального й втрат."
se_bots_streak_loot_percent: "Серія рейдів після вдачі вартістю (% мінімальної здобичі)"
se_bots_streak_loot_percent_info: "Вдача, що принесла щонайменше цю частку мінімальної здобичі, починає серію рейдів."
se_bots_raids_per_human_day: "Рейдів на гравця за добу (усі боти разом)"
se_bots_raids_per_human_day_info: "Максимум атак ботів на одного живого гравця за 24 години, рахуючи за всіма ботами всесвіту (захист від фрустрації, завжди ввімкнений)."
se_bots_human_cooldown_hours: "Пауза на гравця між атаками ботів (години)"
se_bots_human_cooldown_hours_info: "Після атаки бота на людину її стільки часу не атакує жоден бот, і ніколи, поки в дорозі інша атака бота на неї."
se_bots_probes_per_human_day: "Польотів зондів на гравця за добу (усі боти разом)"
se_bots_probes_per_human_day_info: "Максимум шпигунських польотів ботів до одного живого гравця за 24 години, рахуючи за всіма ботами всесвіту."
se_bots_scout_range_max: "Найбільша дальність розвідки (системи)"
se_bots_scout_range_max_info: "Боти ніколи не дивляться далі за цю кількість систем навколо своїх планет, що б не казав профіль: приблизно те, що гравець гортає в огляді галактики."
se_bots_respy_jitter_seconds: "Випадковий зсув повторного шпигунства (секунди)"
se_bots_respy_jitter_seconds_info: "Шпигунство незадовго до удару рейду надсилається випадково на стільки секунд раніше запланованого (0 = точний час)."
se_bots_timezone_spread_hours: "Розкид власного часового поясу (години)"
se_bots_timezone_spread_hours_info: "Кожен бот отримує сталий особистий зсув до цієї кількості годин (плюс або мінус) відносно годинника сервера, щоб боти одного профілю не грали всі в одну годину (0 = викл.)."
se_bots_fleetsave_enabled: "Боти рятують флот"
se_bots_fleetsave_enabled_info: "Викл.: боти ніколи не рятують флот, ні наприкінці сесії, ні при наближенні атаки."
se_bots_fleetsave_keep_percent: "Ресурси, що лишаються вдома при втечі флоту (%)"
se_bots_fleetsave_keep_percent_info: "Частка кожного запасу, що лишається на планеті, щоб будівництво тривало."
se_bots_fleetsave_min_offline_minutes: "Найкоротший офлайн для втечі флоту (хвилини)"
se_bots_fleetsave_min_offline_minutes_info: "Наприкінці сесії бот рятує флот, лише якщо очікує бути відсутнім щонайменше стільки."
se_bots_threat_window_hours: "Вікно загрози (години)"
se_bots_threat_window_hours_info: "Наближення ворожих флотів помічається за стільки годин до удару."
se_bots_ship_weight_percent: "Вага будівництва кораблів (%)"
se_bots_ship_weight_percent_info: "Множник того, наскільки боти віддають перевагу будівництву кораблів перед іншим (100 = класика)."
se_bots_defense_weight_percent: "Вага будівництва оборони (%)"
se_bots_defense_weight_percent_info: "Множник того, наскільки боти віддають перевагу будівництву оборони (100 = класика)."
se_bots_growth_speed_percent: "Швидкість зростання (%)"
se_bots_growth_speed_percent_info: "Множник щоденного приросту навичок профілів ботів (100 = класика; профілі без приросту навичок лишаються як є)."
se_bots_growth_bonus: "Додатковий приріст навичок за добу (тисячні)"
se_bots_growth_bonus_info: "Додається до щоденного приросту навичок кожного бота (10 = один відсотковий пункт за добу), обмежений максимальною навичкою профілю."
se_bots_max_planets: "Максимум планет на бота"
se_bots_max_planets_info: "Боти припиняють колонізацію при такій кількості планет (0 = діє лише ліміт гри)."
se_bots_activity_percent: "Множник активності (%)"
se_bots_activity_percent_info: "Масштабує погодинний шанс виходу бота в мережу (100 = таблиця профілю; понад 100 боти заходять частіше)."
se_bots_hidden_rhythm_percent: "Частка ботів із прихованим ритмом (%)"
se_bots_hidden_rhythm_percent_info: "Ці боти щодня зсувають свій добовий ритм на різну величину, тому їх не можна передбачити за часом онлайн."
se_bots_revenge: "Помста"
se_bots_revenge_info: "Боти накопичують образу (зростає, коли гравець атакує їх або шпигує, спадає на 10 % за добу) і розвідують та контратакують найворожішого гравця в зоні досяжності, якщо планувальник рейдів знаходить виграшний план. Ліміти на гравця й добу продовжують діяти."
se_bots_bot_acs: "Групові атаки ботів"
se_bots_bot_acs_info: "Бот, що не може подолати ціль сам, відкриває групову атаку й запрошує союзних ботів (той самий альянс), які онлайн; вони приєднуються як гравці. Ліміти на гравця й добу рахують групу як одну атаку."
se_bots_recycling: "Переробка"
se_bots_recycling_info: "Боти надсилають переробники до полів уламків, які бачать навколо своїх планет (спершу від власних боїв), коли здобич перевищує пальне, і будують кілька переробників, якщо їх немає."
se_bots_moons: "Місяці"
se_bots_moons_info: "Боти використовують свої місяці: флоти розміщуються на місяці при виході, а рейди можуть стартувати з місяця."
se_bots_missiles: "Ракети"
se_bots_missiles_info: "Боти з ракетною шахтою (рівень 4), імпульсним двигуном і міжпланетними ракетами обстрілюють оборону цілі, що блокує рейд, знову шпигують і атакують. При ввімкненому перемикачі боти будують шахти й ракети."
se_bots_warmonger: "Пізній палій війни"
se_bots_warmonger_info: "Починаючи з указаних нижче очок, бот частіше ходить у рейди, погоджується на менший прибуток і бере ціллю також активних гравців. Планувальник рейдів і ліміти на гравця продовжують діяти."
se_bots_warmonger_points: "Поріг очок палія війни"
se_bots_warmonger_points_info: "Очки, з яких бот може стати палієм війни."
bot_difficulty: "Складність"
bot_override_preset: "Пресет цього бота"
bot_override_universe: "Як у всесвіті"
bot_override_aggression: "Агресивність"
bot_override_save: "Зберегти"
bot_override_reset: "Скинути"
bot_override_saved: "Складність бота збережено."
