se_community_links: Посилання спільноти
se_discord_url: URL запрошення в Discord
se_discord_url_info: Посилання-запрошення на твій сервер Discord (https://...). Показується в меню, на сторінці входу, в листах і текстах. Порожньо — приховано.
se_discord_widget_guild: ID сервера Discord (віджет онлайну)
se_discord_widget_guild_info: ID твого сервера Discord (17–20 цифр; у налаштуваннях сервера → Widget має бути увімкнено «Enable Server Widget»). Показує блок із кількістю онлайну на стартовій сторінці, оновлюється кожні 5 хвилин. Порожньо — приховано.
se_wiki_url: URL вікі
se_wiki_url_info: Базова адреса зовнішньої вікі без кінцевого слеша (https://...). Посилання на вікі у FAQ, навчанні та правилах формуються з неї. Порожньо — приховано.
se_donate_url: URL пожертв
se_donate_url_info: Посилання для пожертв (https://...), показується в меню. Порожньо — приховано.
se_userscripts_url: URL юзерскриптів
se_userscripts_url_info: Сторінка з описом юзерскриптів для твоєї гри (https://...), посилання в налаштуваннях. Порожньо — приховано.
se_bots_alliances_enabled: Боти створюють альянси
se_bots_alliances_enabled_info: 'Боти засновують власні альянси і час від часу вступають в інші. Вимкнено: боти лишаються одинаками, нікуди не подають заявки і виходять з альянсів, де є учасниками (альянси, засновані ботом, залишаються).'
se_bots_join_human_alliances: Боти можуть вступати в альянси гравців
se_bots_join_human_alliances_info: 'Боти також можуть подавати заявки до альянсів, заснованих живими гравцями. Вимкнено: боти вступають лише в альянси ботів і виходять з альянсів гравців.'
se_bot_reply_delay_hours: Затримка відповіді (години)
se_bot_reply_delay_hours_info: Скільки годин найстаріше без відповіді приватне повідомлення гравця чекає, перш ніж бот відповість одним листом на всі очікувані повідомлення цього гравця. Також це мінімальний проміжок між двома повідомленнями, які бот ініціює сам (реакції на атаку, глум під час рейду), для одного гравця. 0 = без затримки.
se_bot_chatter: Боти розмовляють
se_bot_chatter_info: 'Увімкнено: боти відповідають на приватні повідомлення. Вимкнено: повідомлення все одно читаються і враховуються, але надсилаються лише реакції в бою (після атаки або рейду на гравця, який писав їм). Боти ніколи не пишуть гравцям першими.'
