adm_info_chk_php: Версія PHP (8.4 або новіша)
adm_info_chk_php_hint: Для гри потрібен PHP 8.4 або новіший.
adm_info_chk_ext_required: Обов'язкові розширення PHP
adm_info_chk_ext_required_hint: Встанови відсутні розширення, без них гра не працюватиме.
adm_info_chk_ext_optional: Необов'язкові розширення PHP
adm_info_chk_ext_optional_hint: Не обов'язкові, але вмикають швидші або додаткові функції (див. список розширень).
adm_info_chk_opcache: OPcache
adm_info_chk_opcache_hint: OPcache вимкнено. Увімкни його на продакшені, він значно прискорює PHP.
adm_info_chk_environment: Середовище (APP_ENV / налагодження)
adm_info_chk_environment_hint: На публічному сервері запускай з APP_ENV=prod і вимкненим налагодженням.
adm_info_chk_display_errors: display_errors
adm_info_chk_display_errors_hint: Виведення помилок на сторінках може розкрити внутрішні деталі. На публічних серверах постав display_errors=Off.
adm_info_chk_writable: Каталоги з правом запису
adm_info_chk_writable_hint: Користувач веб-сервера має мати право запису в ці каталоги (кеші, журнали, сесії, завантаження).
adm_info_chk_install_tool: Інструмент встановлення
adm_info_chk_install_tool_hint: Існує var/ENABLE_INSTALL_TOOL. Видали його, коли не встановлюєш гру.
adm_info_chk_migrations: Міграції бази даних
adm_info_chk_migrations_hint: Міграції очікують виконання. Вони застосуються під час наступного запиту до гри; якщо вони залишаються в очікуванні, перевір журнал.
adm_info_chk_battle_engine: Бойовий рушій
adm_info_chk_battle_engine_hint: Рушій Rust недоступний (bin/battlerust, bin/libbattlerust.so, proc_open). Бої йдуть на повільнішому рушії PHP.
adm_info_chk_cron: Cron-завдання
adm_info_chk_cron_hint: Cron, схоже, завис або не працює. Перевір, що bin/console app:cron:run запускається щохвилини, і розблокуй завислі завдання в розділі Cron-завдання.
