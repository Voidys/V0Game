se_pow_max_cap: Захист від ботів — обмеження складності
se_pow_max_cap_info: Найбільше число після застосування коефіцієнтів. 1500000 займає приблизно 25 секунд на повільному смартфоні.
se_pow_sensitivity: Захист від ботів — чутливість виявлення ризику
se_pow_sensitivity_info: Відсоток від стандартних порогів (підвищений ризик від 5 запитів/10 хв, 3 помилок/год або 2 реєстрацій/24 год на IP; високий від 20 / 10 / 5; для мереж утричі більше). 200 = потрібно вдвічі більше подій, 50 = удвічі менше.
se_pow_max_number: Захист від ботів — складність (максимальне число)
se_pow_max_number_info: Браузер перебирає хеші до цього числа, у середньому половину з них. 100000 займає приблизно від половини секунди до секунди. Більше означає більше роботи для ботів.
se_pow_min_seconds: Захист від ботів — мінімальний час до надсилання (секунди)
se_pow_min_seconds_info: Форми, надіслані раніше, ніж за цей час після завантаження, відхиляються. 0 вимикає перевірку.
