se_bots_enabled: Увімкнути ботів
se_bots_enabled_info: Дозволяє ботам на сервері грати в цьому всесвіті. Cron-завдання обробляє їх раз на хвилину.
se_bots_llm_daily_limit: Викликів LLM на бота за день
se_bots_llm_daily_limit_info: Максимальна кількість викликів LLM, які може зробити один бот за день. Далі використовуються локальні запасні варіанти.
se_bots_llm_enabled: Використовувати LLM для імен і чату
se_bots_llm_enabled_info: Вмикає нікнейми, персони, назви планет і чат (повідомлення, альянси, друзі), згенеровані LLM через активного провайдера. Ігрові рішення завжди залишаються локальними.
se_bots_max_count: Максимальна кількість ботів
se_bots_max_count_info: Верхня межа створених ботів у цьому всесвіті.
se_bots_ticks_per_run: Ботів за один запуск cron
se_bots_ticks_per_run_info: Максимальна кількість ботів, яких обробляють за один запуск cron.
se_bots_raids_enabled: Боти нападають на гравців
se_bots_raids_enabled_info: Дозволяє ботам розвідувати, шпигувати і атакувати гравців та інших ботів поблизу за тими ж правилами, що й гравців (ліміт bash, захист, відпустка). Вимкнено за замовчуванням.
