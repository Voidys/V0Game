ins_db_help: V0Game speichert alles in ei MySQL- odder MariaDB-Datenbank. Die Werte unne kriesd du in deim Hosting-Panel (Bereich "Datenbanke" odder "MySQL") odder von der Person, die deinen Server eingerischt had. Had du MySQL selbst installiert, passe die Vorgabe meischtens.
