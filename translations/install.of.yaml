ins_group_features: 'Optionale Spielfunktionen'
ins_features_desc: 'Alle standardmäßig aus. Jede Funktion kannst später in der Administration (Universumseinstellungen) ein- und ausschalten und einstellen, gell.'
ins_feat_events: 'Universumsereignisse'
ins_feat_events_info: 'Zeitgesteuerte Ereignisse, die du im Adminbereich planst: Ionenstürme, Handelsmessen, Sonnenmaxima, Piratenwellen, Speed-Wochenenden.'
ins_feat_catchup: 'Aufholbonus'
ins_feat_catchup_info: 'Junge Accounts, die weit unter dem Schnitt liegen, kriegen einen Minenbonus, der über ein paar Tage weniger wird.'
ins_feat_contracts: 'Wöchentliche Verträge'
ins_feat_contracts_info: 'Drei wechselnde Ziele pro Spieler und Woche, mit einer kosmetischen oder kleinen Rohstoffbelohnung.'
ins_feat_alliance_goals: 'Allianzziele'
ins_feat_alliance_goals_info: 'Der Allianzchef setzt den Mitgliedern ein wöchentliches Ziel; wer''s schafft, kriegt Abzeichen.'
ins_feat_returning: 'Willkommen zurück'
ins_feat_returning_info: 'Spieler, die nach langer Pause wiederkommen, sehen, was passiert is, und kriegen evtl. einen kurzen Schutz.'
ins_feat_seasons: 'Saisons'
ins_feat_seasons_info: 'Eine monatliche Rangliste (Raider, Krieger, Verteidiger, Entdecker, Recycler) ohne Reset; die Gewinner kriegen Abzeichen.'
ins_feat_cosmetics: 'Abzeichen und Titel'
ins_feat_cosmetics_info: 'Zeigt die erreichten Abzeichen, Titel und Namensfarben auf der Spielerkarte und im Chat.'
ins_feat_bounties: 'Kopfgelder'
ins_feat_bounties_info: 'Spieler setzen Rohstoffe auf einen anderen Spieler aus; wer genug von seiner Flotte zerstört, kassiert sie.'
ins_feat_alliance_wars: 'Allianz-Kriegsstand'
ins_feat_alliance_wars_info: 'Eine Live-Anzeige für die Kriege, die in der Allianzdiplomatie erklärt wurden.'
ins_feat_battle_feed: 'Kampfticker'
ins_feat_battle_feed_info: 'Große Kämpfe werden im globalen Chat angekündigt (Chat nötig).'
ins_feat_derelicts: 'Trümmerfelder'
ins_feat_derelicts_info: 'Bergungsfelder tauchen eine Weile in der Galaxie auf; die ersten Recycler, die hinkommen, sammeln sie ein.'
ins_feat_mothership: 'Piraten-Mutterschiff'
ins_feat_mothership_info: 'Ein seltener Weltboss, der nur in einem ACS besiegt werden kann; die Beute wird nach Schaden verteilt.'
ins_feat_expedition_stories: 'Expeditionsgeschichten'
ins_feat_expedition_stories_info: 'Seltene Signale führen einen Spieler durch eine kurze Expeditionsquest mit größerer Belohnung.'
ins_feat_relics: 'Relikte'
ins_feat_relics_info: 'Expeditionen können Relikte finden (gewöhnlich bis episch, mit Set-Boni), die Spieler auf ihren Planeten für kleine Boni einsetzen.'
