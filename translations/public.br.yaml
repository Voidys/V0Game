home_meme_alt: Meme em quadrinhos do deck de comando do {game_name}
home_meme_alt_deep_space_transit: 'Quadrinho: dois cadetes em um ônibus espacial: um desaba ao ver um campo de asteroides, o outro sorri para uma nebulosa brilhante. "Patrulha de setor padrão vs. encontrar uma nebulosa inexplorada rica em recursos."'
home_meme_alt_deuterium_joyride: 'Quadrinho: um comandante cansado no deck de observação vê dois recrutas flutuando lá fora: "Vendo os recrutas novos gastarem todo o Deutério passeando lá fora enquanto eu espero 12 horas pela minha melhoria de mina."'
home_meme_alt_enemy_fleet: 'Quadrinho: um cadete segura a cabeça em pânico enquanto os alarmes piscam: "1000 destruidores inimigos a caminho?! Eu achava que esse setor era seguro?!"'
home_meme_alt_fleet_decimated: 'Quadrinho: um soldado em choque encara o vazio enquanto naves explodem do lado de fora de uma cúpula estilhaçada: "Quando você passa 20 horas farmando recursos só para a frota de um top 3 aparecer e desmontar tudo em 3 segundos."'
home_meme_alt_solo_scouting: 'Quadrinho: o Comandante Kamioka sorri e apoia uma mão robótica no ombro de um cadete: "Relaxa, cadete. O Alto Comando tem confiança ''total'' na sua missão solo de reconhecimento no Espaço."'
home_meme_alt_this_is_fine: 'Quadrinho: um cachorro de traje espacial senta calmamente em uma central de comando em chamas e diz "Isso é normal": "Relaxa. Minha frota só está 4 horas atrasada para voltar."'
