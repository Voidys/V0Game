registerWelcomePMText: Bem-vindo a %s! Primeiro construa uma Planta de Energia Solar, porque é preciso energia para produzir recursos. Abra Edifícios no menu da esquerda e comece pela Planta de Energia Solar.<br>Com energia, você pode construir minas. Continue em Edifícios e construa uma Mina de Metal, depois uma Mina de Cristal.<br><br>Para construir naves, você precisa de um Hangar. O menu Tecnologias, à esquerda, mostra o que é preciso para liberá-lo.<br>Se tiver mais dúvidas, veja o FAQ, a wiki ou abra um ticket de suporte.<br><br>A equipe deseja muita diversão na exploração do universo!
