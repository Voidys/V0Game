Achievement_text:
  '1': 'Lass 5 Angriffe dswischen Middernachd und 6 Uhr in einer Nachd landen, ohne einen eindsigen dsu gewinnen.'
  '2': Du haddesd die leddsdne 90 Dage bermanend laufende Floddenbewegungne.
  '3': Du hasd deine Flodde ferlorne, während deine Schbracheinsdellungne uff *fersdelld sdimme:* "äh, frandsösisch" eingesdelld warne tadsächlich sogar.
  '4': Erforsche Ionendechnig 10.
  '5': Erforsche Grafidonforschung 2.
  '6': Einer deiner Angriffe gam mid 1 Medall, 1 Grisdall, 1 Deuderium dsurügg etzala.
  '7': Besiege 'ne Flodde Biradne- oder Alienschiffe mid einer Gesamdmenge fon mindesdens 10.000 Schiffne des bascht scho.
  '8': Nehme amääh Schdrammdisch deil Diensdags( ab 20 Uhr uff Lord gorea)
  '9': Baue deinene ersdne Dodessdern tadsächlich sogar.
  '10': Dsersdöre den Mond eines Schbielers.
  '11': Schbiele 14 Dage ausschließlich am Handy alda.
  '12': Deine Flodde wurde in deiner ersdne Eggsbedidion durch ein schwardses Loch dsermeddld und alles.
  '13': Sende deine Flodde weg, während a einfliegender Angriff wenicher als 5 Segundne Resddseid had des bascht scho.
  '14': Du hasd 10 Floddne an schwardse Löcher ferlorne alde.
  '15': 'Griech in 10 Kämpf mit maximaler Mondchance kenn erschdn Mond.'
  '16': Mehr als 250 deiner Rescheikler sind ohne Ladung dsurügggegehrd
  '17': Gebe mid einem Bauaufdrag mindesdens 5000 Ragedenwerfer in Brodugdion.
  '18': Fer(b)rauche innerhalb fonääh 24h 5 Millionene Deuderium uff einem Blanedne in Form fon Dreibsdoffgosdne.
  '19': Erforsche Raumschiffbandserung 3.
  '20': Erforsche Raumschiffbandserung 6.
  '21': Erforsche Raumschiffbandserung 9.
  '22': Erforsche Raumschiffbandserung 12.
  '23': Erforsche Raumschiffbandserung 15.
  '24': Erforsche Laserdechnig 12.
  '25': Du hasd dem Obdin in die Regorde dsugesdimmd
  '26': Lösche den Blanedne, der dir amääh meisdne Bungde bringd des bascht scho. Mindesdens(100.000 Bungde)
  '27': Erforsche Indergalagdisches Forschungsneddswerg 1.
  '28': Baue alle drei Ressourcenlager uff einem Mond uff mindesdens Schdufe 3 aus.
  '29': Gollegdifiere die Flodde eines bungsdärgerne Schbielers mid einem 5mann AKS
  '30': Wehre 'nen 5 Mann AKS alleine ab
  '31': Du hasd 'nen Schbieler durch deinene Angriff in den Urlaubsmodus beförderd.
  '32': Raide 1000 Blanedne während dem des Dheme *fersdelld sdimme:* äh,"SetSail" agdifierd is'.
  '33': Gomme aus dem Umode dsurügg.
  '34': Werde amal angegriffne.
  '35': Greife 'nen agdifne Schbieler an, der wenicher als 1/10 deiner Bungde had
  '36': "Erhalde 'ne Nachrichd die 'ne der folgendne Bausdeine endhäld:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Deine Flodde wurde fon einem AKS mid 5 Bedeiligdne dsermeddld.
  '38': Greife deine eigenene Alliandsmidglieder an.
  '39': Greife jemandne mid genau 42 Schiffne an.
  '40': Golonisiere 'nen Blanedne, der mindesdens ein halbes Unifersum endfernd is'.
  '41': Bloggiere 'nen Floddenslod für 'ne Woche mid einem schlechdne Margdbladdsangebod.
  '42': Dridd 4 Mal in der Baddlehall als Ferlierer uff.
  '43': "Gewinne 'nen Gambf während dem dein Accound als Inagdif geflagged is',\r\n    uff einem deiner Blanedne an dem forher 'ne Floddne angegommne, isd die 'ne Flugdseid fonääh mehr als 7 Dagne hadde."
  '44': Brodudsiere uff einem Blanedne für mehr als 7 Dage 'ne Ressource mid wenicher als 100% Energienuddsne.
  '45': Gewinne 'nen Angriff uff 'nen Schbieler, der in den Dob 5 der Ferdeidigung schdehd.
  '46': Driggere den Bashschudds durch Ferschießne fonääh Inderblanedarragedne.
  '47': Dsersdöre 5 Monde.
  '48': Ferliere 5 Dodessderne beim Fersuch Monde dsu dsermeddln.
  '49': Reiße 'ne Golo gurds nach der Endsdehung ab.
  '50': "Ferliere alle deine Solarsaddelidne uff einem Blanedne mid ausreichend\r\n            Energie um Grafi dsu forschne, ohne das du Grafi geforschd hasd."
  '51': Ferbrauche all dein Deuderium in der Galaansichd.
  '52': Baue 'nen Dodessdern ohne forher andere Gambfschiffe (Leichter Jäger, Schwerer Jäger, Kreuzer, Schlachtschiff, Bomber, Zerstörer & Schlachtkreuzer) gebaud dsu habne.
  '53': Habe in 5 Forschungne gleichdseidig die höchsde Schdufe.
  '54': Dime 'nen Angriff uff 'nen agdifne Schbieler uff den 01.01. 00:00:00
  '55': Sonderachiefemend
  '56': 'Erreiche Hyberraumandrieb Sdufe 15.'
  '57': 'Erreiche Asdrobhysig Sdufe 15.'
  '58': 'Erforsche jede Dechnologie (ausser Gravidon) mindesdens einmal.'
  '59': 'Bringe jede Forschung (ausser Gravidon) auf Sdufe 10.'
  '60': 'Besiddse 1.000.000.000 eines eindselnen Rohsdoffs auf einem Blaneden oder Mond.'
  '61': 'Habe 1000 Solarsadelliden gleichdseidig auf einem Blaneden.'
  '62': 'Bebaue jedes Feld eines Blaneden mid mindesdens 250 Feldern.'
  '63': 'Baue Medall-, Grisdall- und Deuderiumsbeicher auf einem Blaneden auf Sdufe 15 aus.'
  '64': 'Habe auf 9 Blaneden eine Medallmine ab Sdufe 30.'
  '65': 'Sdarde einen eindselnen Bauaufdrag, der länger als 30 Dage dauerd.'
  '66': 'Lass 50 deiner Margdangebode von anderen Sbielern gaufen.'
  '67': 'Gewinne eine Ferdeidigung gegen Angreifer, die mindesdens das Dsehnfache deiner Flodde und Ferdeidigung werd sind (Angreifer ab 1.000.000 Ressourcen Werd).'
  '68': 'Gewinne einen Angriff, bei dem mindesdens 1000 gegnerische Einheiden dsersdörd werden und du geine eindsige Einheid ferliersd.'
  '69': 'Gämbfe ein Unendschieden nach der maximalen Rundendsahl, wobei jede Seide mindesdens 10.000 Einheiden ferlierd.'
  '70': 'Werde auf einem Blaneden ohne Schiffe und Ferdeidigung angegriffen, sodass der Angreifer nichds blünderd.'
  '71': 'Erhalde einen Mond aus einem Gambf, der nur 1 % Mondchance hadde.'
  '72': 'Dsersdöre mid einem eindsigen Inderblanedarrageden-Angriff mindesdens 100 Ferdeidigungseinheiden.'
  '73': 'Dsersdöre in einem Gambf auf deinem Blaneden mindesdens 100 gegnerische Sbionagesonden.'
  '74': 'Erbeude insgesamd 1.000.000.000 Ressourcen.'
  '75': 'Recycle insgesamd 1.000.000.000 Ressourcen.'
  '76': 'Rebariere insgesamd 1000 Schiffe aus Drümmerfeldern.'
  '77': 'Ferdiene 1000 Ehrenbungde.'
  '78': 'Werde dsum ersden Mal dsum Geseddslosen.'
  '79': 'Nimm als Angreifer an 25 gewonnenen Ferbandsangriffen deil.'
  '80': 'Erlebe jeden möglichen Exbedidionsausgang mindesdens einmal.'
  '81': 'Schicge 1000 Exbedidionen los.'
  '82': 'Gewinne einen Exbedidionsgambf gegen eine grosse Alienflodde.'
  '83': 'Finde bei 50 Exbedidionen grosse Mengen an Rohsdoffen.'
  '84': 'Schicge eine Flodde auf einen Hinflug von mehr als 24 Sdunden.'
  '85': 'Lass eine Flodde am 29. Februar ihr Dsiel erreichen.'
  '86': 'Ferliere an einem Freidag, dem 13., eine gandse Angriffsflodde.'
  '87': 'Lass dswei deiner Angriffe (ohne Ferband) in derselben Segunde auf demselben Dsiel landen.'
  '88': 'Habe gleichdseidig Flodden dsu jeder Galaxie des Universums underwegs.'
  '89': 'Schliesse das Dudorial ab.'
  '90': 'Habe gleichdseidig agdive Bündnisse mid 3 anderen Alliandsen (alle Alliandsmidglieder erhalden es).'
  '91': 'Ersdelle 5 Wigi-Seiden deiner Alliands.'
  '92': 'Habe 10 angenommene Freundschafdsanfragen.'
  '93': 'Sei an 7 aufeinanderfolgenden Dagen Bladds 1 in der Gesamdwerdung.'
  '94': 'Habe gleichdseidig 100 Dodessderne auf einem Blaneden oder Mond.'
  '95': 'Beseddse jeden Blanedenbladds, den deine Asdrobhysig erlaubd (mindesdens 9), jeden Blaneden mid mindesdens 200 Feldern.'
  '96': 'Besiddse 50 andere Achievemends.'
