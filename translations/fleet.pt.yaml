sys_expe_found_goods: Foram extraídos %s %s.
sys_expe_found_ress_1_1: A tua expedição descobriu um pequeno aglomerado de asteroides de onde foi possível extrair alguns recursos.
sys_expe_found_ress_1_2: Num planetoide remoto, foram encontrados vários campos de recursos de fácil acesso e as matérias-primas foram extraídas com sucesso.
sys_expe_found_ress_1_3: A tua expedição tropeçou em destroços de naves muito antigas de uma batalha de há muito tempo. Alguns componentes puderam ser recuperados e reciclados.
sys_expe_found_ress_1_4: A expedição descobriu um planeta contaminado por radiação, com uma atmosfera altamente tóxica. No entanto, as leituras mostraram que o planeta contém muitas matérias-primas. Drones automáticos tentaram extrair o máximo de recursos possível.
sys_expe_found_ress_2_1: A tua expedição encontrou um antigo comboio de cargueiros totalmente carregado, mas deserto. Foi possível recuperar alguns recursos.
sys_expe_found_ress_2_2: A tua expedição encontrou grandes depósitos de matérias-primas numa pequena lua com atmosfera própria. A tripulação está a extrair esse tesouro.
sys_expe_found_ress_2_3: Cruzámo-nos com um pequeno comboio de naves civis que precisavam urgentemente de comida e medicamentos. Em troca, recebemos uma boa quantidade de recursos úteis.
sys_expe_found_ress_3_1: A tua frota de expedição reporta a descoberta de um enorme destroço de nave alienígena. Não conseguimos aproveitar a tecnologia, mas a nave pôde ser desmontada em peças, rendendo matérias-primas valiosas.
sys_expe_found_ress_3_2: A cintura de asteroides à volta de um planeta desconhecido continha enormes quantidades de matérias-primas. A frota de expedição encheu os porões!
sys_expe_found_ress_logbook_1: 'Entrada do diário de bordo do primeiro oficial: aproveitámos cada centímetro livre, mas mesmo assim não conseguimos levar todos os recursos que encontrámos.'
sys_expe_found_ress_logbook_2: 'Entrada do diário de bordo do primeiro oficial: se ao menos tivéssemos mais alguns cargueiros! Agora vamos ter de deixar montes de recursos para trás.'
sys_expe_found_ress_logbook_3: 'Entrada do diário de bordo do primeiro oficial: já deitámos fora tudo o que já não precisamos, mas mesmo assim não conseguimos arranjar espaço para todos os recursos que encontrámos.'
sys_expe_found_ress_logbook_4: 'Entrada do diário de bordo do primeiro oficial: mesmo depois de transformarmos a cafetaria e todas as salas de convívio em armazéns, não conseguimos transportar todos os recursos que encontrámos.'
sys_expe_found_ships_1_1: Descobrimos os restos de uma expedição anterior! Os nossos técnicos estão a verificar se conseguem pôr alguns dos destroços a funcionar outra vez.
sys_expe_found_ships_1_2: Encontrámos uma base pirata abandonada. Ainda há algumas naves velhas no hangar. Os nossos técnicos estão a verificar se alguma ainda pode ser usada.
sys_expe_found_ships_1_3: A nossa expedição encontrou um planeta quase totalmente destruído por guerras. Havia vários destroços de naves a flutuar em órbita. Os técnicos tentaram reparar algumas. Talvez possamos descobrir mais sobre o que aqui aconteceu.
sys_expe_found_ships_1_4: A expedição deu com uma velha base estelar que parece estar abandonada há uma eternidade. No hangar da fortaleza havia algumas naves. Os técnicos conseguiram fazer voar algumas delas outra vez.
sys_expe_found_ships_2_1: Encontrámos os restos de uma armada. Os técnicos da expedição foram logo para as naves parcialmente intactas e conseguiram reparar algumas.
sys_expe_found_ships_2_2: A nossa expedição descobriu um antigo estaleiro automático com algumas naves ainda em fase de produção. Depois de restabelecerem a energia do estaleiro, os nossos técnicos trabalharam para as terminar.
sys_expe_found_ships_3_1: Encontrámos um gigantesco cemitério de naves. Alguns técnicos da expedição conseguiram pôr uma ou duas naves a funcionar outra vez.
sys_expe_found_ships_3_2: Descobrimos um planeta com restos de uma civilização. Do espaço, avistámos outra enorme estação de naves ainda intacta. Alguns dos nossos técnicos e pilotos desceram à superfície para ver se é possível recuperar algumas naves.
sys_expe_found_ships_logbook_1: 'Entrada do diário de bordo do oficial de máquinas: se tivéssemos trazido mais algumas naves, teria sido fácil levar para casa algumas destas beldades!'
sys_expe_found_ships_logbook_2: 'Entrada do diário de bordo do oficial de máquinas: infelizmente, não tínhamos capacidade para trazer de volta todas as naves que descobrimos nesta missão.'
sys_expe_found_ships_logbook_3: 'Entrada do diário de bordo do oficial de máquinas: infelizmente, não temos capacidade suficiente para trazer connosco todas as naves que encontrámos.'
sys_expe_found_ships_nothing: Não foi possível encontrar naves.
sys_expe_lost_fleet_1: 'A única coisa que resta da expedição é a seguinte mensagem de rádio: Zzzrrt oh meu Deus!...Krrrzzzzt o zrrrtrzt vê krgzzzz sim de como Krzzzzzzzztzzzz...'
sys_expe_lost_fleet_2: A última coisa que recebemos da expedição foram uns grandes planos incrivelmente nítidos de um buraco negro a abrir-se.
sys_expe_lost_fleet_3: Uma falha nuclear numa das naves de comando provocou uma reação em cadeia que destruiu toda a expedição numa explosão espetacular.
sys_expe_lost_fleet_4: A frota de expedição não regressou do salto hiperespacial. Os nossos cientistas ainda tentam perceber o que pode ter acontecido, mas a frota parece estar perdida para sempre.
sys_expe_nothing_1: Esta expedição não traz nada de emocionante, a não ser alguns animaizinhos curiosos de um planeta pantanoso desconhecido.
sys_expe_nothing_2: A tua expedição tirou fotografias lindíssimas de uma supernova. No entanto, não trouxe novas descobertas. Mas tem boas hipóteses de ganhar este ano o concurso de Melhor Fotografia do Universo.
sys_expe_nothing_3: Um estranho vírus informático danificou a navegação pouco depois de saírem do sistema solar. Por causa disso, a frota de expedição andou sempre em círculos. Escusado será dizer que a expedição não foi particularmente bem-sucedida.
sys_expe_nothing_4: Uma forma de vida de pura energia fez com que todos os membros da expedição ficassem vários dias a olhar para símbolos hipnóticos nos ecrãs. Quando a maioria recuperou a lucidez, a expedição teve de ser cancelada por falta de deutério.
sys_expe_nothing_5: Bem, pelo menos ficámos a saber que as anomalias vermelhas de classe 5 não só têm efeitos caóticos nos sistemas das naves, como também podem provocar alucinações em massa na tripulação. Infelizmente, não se descobriu mais nada nesta expedição.
sys_expe_nothing_6: Apesar das leituras inicialmente promissoras deste setor, infelizmente voltámos de mãos a abanar.
sys_expe_nothing_7: Talvez não se devesse ter celebrado o aniversário do capitão neste planeta remoto. Uma febre hemorrágica terrível mandou grande parte da tripulação para a enfermaria, e a grave falta de pessoal fez a expedição falhar.
sys_expe_nothing_8: A tua expedição não encontrou nada além do vasto vazio do espaço. Não havia sequer um asteroidezinho, nem radiação, nem partículas, nem nada que tornasse esta expedição pelo menos um bocadinho emocionante.
sys_expe_nothing_9: Uma avaria no reator da nave de comando quase destruiu a expedição inteira. Felizmente, os técnicos estiveram à altura e evitaram o pior. A reparação, porém, demorou tanto que a expedição voltou sem ter conseguido nada.
sys_expe_report: Relatório de expedição
sys_expe_report_msg: 'Relatório de expedição da frota de %s %s em %s:'
sys_expe_time_fast_1: Um ciclo de feedback imprevisto nas bobines de energia do sistema de propulsão acelerou o regresso da expedição, que chega mais cedo do que o esperado. Os primeiros relatórios indicam, porém, que não há mais nada a reportar.
sys_expe_time_fast_2: O novo comandante, algo ousado, usou um buraco de minhoca instável para encurtar a viagem de regresso – e conseguiu! No entanto, a expedição em si não trouxe novas descobertas.
sys_expe_time_fast_3: A tua expedição não reportou anomalias no setor explorado. Contudo, a frota apanhou um vento solar durante o voo de regresso, que acelerou bastante a viagem. A tua expedição vai regressar a casa um pouco mais cedo do que o previsto.
sys_expe_time_slow_1: Um erro grave do navegador deixou a frota num lugar completamente errado. Por isso, a viagem de regresso demorou bastante mais.
sys_expe_time_slow_2: Por razões ainda desconhecidas, o salto da frota correu completamente mal. Quase foram parar ao coração de uma estrela! Felizmente, aterraram num sistema conhecido, mas a viagem de regresso vai demorar mais do que o previsto.
sys_expe_time_slow_3: O novo módulo de navegação parece continuar cheio de bugs. A frota de expedição não só seguiu na direção completamente errada, como ainda gastou todo o deutério! Desiludida, a expedição regressa agora com a energia de reserva.
sys_expe_time_slow_4: A tua expedição entrou num setor com tempestades de partículas intensas. Isso sobrecarregou os sistemas de armazenamento de energia e os sistemas principais de todas as naves falharam. Os teus mecânicos conseguiram evitar o pior, mas a expedição vai regressar com um atraso considerável.
sys_expe_time_slow_5: A nave-almirante da tua frota de expedição colidiu com uma nave alienígena que saltou para o meio da frota sem aviso. A nave alienígena explodiu e os danos na nave-almirante foram consideráveis. Assim que as reparações mais graves estiverem concluídas, as tuas naves iniciam a viagem de regresso, porque a expedição não pode continuar neste estado.
sys_expe_time_slow_6: O vento estelar de uma gigante vermelha distorceu o salto da expedição, fazendo com que os sistemas de navegação calculassem completamente mal a viagem de regresso. Por isso, a expedição está agora no vasto vazio entre estrelas desconhecidas.
