sys_expe_depleted_max_1: 'Entrada do diário de bordo do oficial de comunicações: se alguma vez nos sentirmos inseguros, podemos sempre juntar forças com as outras expedições que andam por aqui.'
sys_expe_depleted_max_2: 'Entrada do diário de bordo do oficial de comunicações: se isto continua assim, vamos ter de montar boias de navegação para gerir todo este tráfego.'
sys_expe_depleted_max_3: 'Entrada do diário de bordo do oficial de comunicações: talvez fosse mais útil abrir aqui uma loja de recordações do que enviar mais uma expedição.'
sys_expe_depleted_med_1: 'Entrada do diário de bordo do oficial de comunicações: encontrámos sinais de várias frotas de expedição na zona. Estamos a regressar a casa.'
sys_expe_depleted_med_2: 'Entrada do diário de bordo do oficial de comunicações: estabelecemos contacto rádio amigável com algumas outras expedições neste setor.'
sys_expe_depleted_med_3: 'Entrada do diário de bordo do oficial de comunicações: celebrámos o fim da expedição com a tripulação de outra frota de expedição que viajava no mesmo setor. Eles também não têm nada de novo para contar.'
sys_expe_depleted_min_1: 'Entrada do diário de bordo do oficial de comunicações: parece que já houve humanos nesta parte da galáxia.'
sys_expe_depleted_min_2: 'Entrada do diário de bordo do oficial de comunicações: encontrámos destroços de naves antigas. Não somos os primeiros a chegar aqui.'
sys_expe_depleted_min_3: 'Entrada do diário de bordo do oficial de comunicações: quase colidimos com outra frota de expedição. Nunca pensei que houvesse mais alguém por aqui.'
sys_expe_depleted_not_1: 'Entrada do diário de bordo do oficial de comunicações: parece que esta parte do universo ainda não foi explorada.'
sys_expe_depleted_not_2: 'Entrada do diário de bordo do oficial de comunicações: é fantástico sermos os primeiros a atravessar um setor inexplorado.'
