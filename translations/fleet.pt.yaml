sys_destruc_title: 'As seguintes frotas defrontam-se numa tentativa de destruição de lua:'
sys_expe_attack_1_1_1: Um pirata espacial desesperado tentou tomar a nossa frota de expedição.
sys_expe_attack_1_1_2: Uns bárbaros primitivos atacaram-nos com naves espaciais, mas pelo menos as naves deles estavam em péssimo estado. Se o poder de fogo deles fosse uma ameaça séria, teríamos sido obrigados a responder.
sys_expe_attack_1_1_3: Intercetámos algumas mensagens de rádio de uns piratas muito bêbados. Pelos vistos, vamos ser atacados.
sys_expe_attack_1_1_4: Tivemos de combater uns piratas, mas felizmente eram menos do que nós.
sys_expe_attack_1_1_5: A frota informa que um tal Moa Tikarr e a sua tripulação exigiram a rendição incondicional da nossa frota. Se estiverem a falar a sério, vão descobrir que nos sabemos defender muito bem.
sys_expe_attack_1_2_1: A tua frota de expedição teve um encontro inesperado com uns piratas espaciais.
sys_expe_attack_1_2_2: Caímos numa emboscada de uns piratas estelares! Infelizmente, o combate foi inevitável.
sys_expe_attack_1_2_3: O pedido de socorro de outra frota de expedição era uma armadilha de uns piratas manhosos. O combate foi inevitável.
sys_expe_attack_1_3_1: Os sinais intercetados não vinham de alienígenas desconhecidos, mas de uma base pirata secreta! Os piratas não ficaram nada satisfeitos com a nossa presença no setor deles.
sys_expe_attack_1_3_2: A frota de expedição reportou combates violentos com naves piratas não identificadas!
sys_expe_attack_1_3_3: 'Acabámos de receber uma mensagem urgente do comandante da expedição: «Vêm aí! Saltaram do hiperespaço, mas felizmente são só piratas, por isso temos hipóteses. Vamos lutar!»'
sys_expe_attack_2_1_1: A tua frota de expedição teve um primeiro contacto pouco amigável com uma espécie desconhecida.
sys_expe_attack_2_1_2: Umas naves estranhas atacaram a frota de expedição sem aviso!
sys_expe_attack_2_1_3: A nossa expedição foi atacada por um pequeno grupo de naves não identificadas!
sys_expe_attack_2_1_4: A frota de expedição reporta contacto com naves desconhecidas. As mensagens de rádio não se conseguem descodificar, mas as naves estranhas parecem estar a ligar as armas.
sys_expe_attack_2_2_1: Uma espécie desconhecida está a atacar a nossa expedição!
sys_expe_attack_2_2_2: A tua frota de expedição violou, ao que parece, o território de uma raça alienígena até agora desconhecida, mas muito agressiva.
sys_expe_attack_2_2_3: A ligação à nossa frota de expedição foi cortada de repente. A última coisa que ouvimos foi que a frota estava debaixo de fogo pesado. Os atacantes não puderam ser identificados.
sys_expe_attack_2_3_1: A tua expedição deu de caras com uma frota de invasão alienígena e reporta combates massivos!
sys_expe_attack_2_3_2: Um grande grupo de naves cristalinas de origem desconhecida está em rota de colisão com a nossa frota de expedição. Temos de nos preparar para o pior.
sys_expe_attack_2_3_3: Tivemos alguma dificuldade em pronunciar corretamente o dialeto da raça alienígena. O nosso diplomata gritou «Fogo!» em vez de «Paz!» por engano.
