sys_expe_attack_2_1_2: "ยานแปลกๆ ลำหนึ่งโจมตีกองเรือสำรวจโดยไม่เตือน!"
sys_expe_attack_2_1_3: "การสำรวจของเราถูกโจมตีโดยยานอวกาศไม่ทราบฝ่ายกลุ่มเล็กๆ!"
sys_expe_attack_2_1_4: "กองเรือสำรวจรายงานว่าพบยานที่ไม่รู้จัก ถอดรหัสข้อความวิทยุไม่ได้ แต่ยานแปลกๆ เหล่านั้นดูเหมือนกำลังเปิดระบบอาวุธ"
sys_expe_attack_2_2_1: "เผ่าพันธุ์ที่ไม่รู้จักโจมตีการสำรวจของเรา!"
sys_expe_attack_2_2_2: กองเรือสำรวจของคุณดูเหมือนจะล่วงล้ำอาณาเขตของเผ่าพันธุ์เอเลี่ยนที่ไม่เคยรู้จักแต่ก้าวร้าวมาก
sys_expe_attack_2_2_3: "การเชื่อมต่อกับกองเรือสำรวจของเราขาดหายไปอย่างกะทันหัน ครั้งสุดท้ายที่ได้ยิน กองเรือกำลังถูกระดมยิงอย่างหนัก ไม่สามารถระบุตัวผู้โจมตีได้"
sys_expe_attack_2_3_1: "การสำรวจของคุณพบกองเรือบุกของเอเลี่ยนและรายงานการรบครั้งใหญ่!"
sys_expe_attack_2_3_2: "ยานผลึกกลุ่มใหญ่ที่ไม่ทราบที่มากำลังพุ่งชนกองเรือสำรวจของเราโดยตรง เราต้องเตรียมรับสถานการณ์เลวร้ายที่สุด"
sys_expe_attack_2_3_3: "เรามีปัญหาเล็กน้อยในการออกเสียงสำเนียงของเผ่าพันธุ์เอเลี่ยนให้ถูกต้อง นักการทูตของเราเผลอตะโกนว่า \"ยิง!\" แทนที่จะเป็น \"สันติภาพ!\""
