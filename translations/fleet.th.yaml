sys_expe_time_slow_5: "เรือธงของกองเรือสำรวจชนกับยานเอเลี่ยนที่กระโดดเข้ามากลางกองเรือโดยไม่มีการเตือน ยานเอเลี่ยนระเบิด และเรือธงเสียหายอย่างหนัก เมื่อซ่อมส่วนที่ร้ายแรงที่สุดเสร็จ ยานของคุณจะเริ่มเดินทางกลับ เพราะการสำรวจต่อไปในสภาพปัจจุบันไม่ได้"
sys_expe_time_slow_6: "ลมดาวฤกษ์ของดาวยักษ์แดงบิดเบือนการกระโดดของการสำรวจ ทำให้ระบบนำทางคำนวณการเดินทางกลับผิดพลาดโดยสิ้นเชิง ผลคือการสำรวจไปอยู่ในความว่างเปล่ากว้างใหญ่ระหว่างดวงดาวที่ไม่คุ้นเคย"
