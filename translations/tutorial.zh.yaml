tutorial_text:
  step0: '欢迎来到 {game_name}！<br><br>

    这个简短的教程会带你了解基础知识。<br>

    我们会频繁链接到维基，因为有些内容教程里装不下。你随时可以从左侧菜单打开维基。<br>

    你可以随时跳过教程，但之后无法重新开始。<br><br>

    祝你好运，统帅！'
  step1: '你的目标：尽可能多地获得积分。每花费 1,000 资源就能获得 1 积分，而最好的资源来源就是你自己的矿场。<br>

    先从基础物资开始：你需要金属矿和晶体矿产出金属和晶体，还要靠太阳能电站提供能量让它们运转。能量不足时，矿场的产量会低于 100%。<br>

    在<b>建筑</b>菜单中升级这些建筑。点击建筑名称，可以查看下一级能带来什么，以及会消耗多少能量。<br><br>

    想了解更多？看看<b>维基</b>：

    <a href="{wiki_url}/wiki/En/Rohstoffe" target="_blank">资源</a>'
  step2: '和朋友一起玩更有趣。大多数玩家都聚集在我们的 Discord 上，在那里你可以得到解答，也能找到一起玩的人。<br>

    还是卡住了？你也可以在这里提交客服工单。'
  step3: '掠夺其他玩家的星球是另一种获取资源的方式——你也可能被掠夺。所以，建造你的第一批防御吧！<br>

    哪怕是少量防御，也能在夜里保护你的产出。<br><br>

    胜负不只取决于数量，进攻舰队的构成同样重要。<br>

    进攻者必须先突破你的防御才能掠夺，而他们每多派一艘舰船，利润就会减少，还可能损失更多舰船。<br>

    在<b>造船厂</b>的<b>防御</b>标签页中建造防御设施。你需要造船厂（它又需要机器人工厂）和一些重氢。<br><br>

    维基中的相关文章：

    <a href="{wiki_url}/wiki/En/Verteidigung" target="_blank">防御设施</a>'
  step4: '扩建矿场，让物资源源不断！<br>

    建筑、舰船、防御设施和研究的花费会越来越高，所以你的产量也必须跟上。现在就打开建筑页面，有资源时就升级矿场吧。'
  step5: '给自己造一艘小型运输舰吧！<br>

    小型运输舰是快速又好用的运输船。<br>

    装上脉冲引擎后，远距离飞行时它比大型运输舰更快。<br>

    用它在你的星球之间转运资源、与其他玩家交易，或者去掠夺他们。<br><br>

    维基中有更多内容：

    <a href="{wiki_url}/wiki/En/Schiffe" target="_blank">舰船</a>'
  step6: '给你的星球起个名字，方便辨认。在总览页面，点击积分显示栏标题中的星球名称。来，现在就试试。<br><br>

    你也可以向其他玩家发送好友请求。对方接受后，你们可以更方便地聊天，也能看到彼此的在线状态。这不需要加入同一个联盟。好友还可以把舰队停驻在彼此的星球上，这样即使不在同一个联盟，也能并肩防守。<br><br>

    或者加入联盟，组队作战。这样就不再需要单独的好友请求来停驻舰队。在联盟内部，你可以发送群发消息，并根据你的联盟职位查看其他成员的在线状态和积分。'
  step7: '想知道另一名玩家有哪些资源、建筑、研究、舰船和防御设施，你就得去侦查他。在舰队菜单或星系视图中向玩家派出间谍探测器即可。<br>

    别忘了，其他玩家也可以侦查你！'
  step8: '远征可能带来资源、舰船、特殊事件，也可能带来损失。想试试的话，选一艘舰船，在舰队菜单中把星球位置 16 作为目标，并选择任务“远征”。<br>

    每种舰船类型都会增加远征舰队的规模，直到达到最大事件规模的上限。<br><br>

    维基里讲解了怎样调整才能获得最大收益：

    <a href="{wiki_url}/wiki/En/Expoanleitung" target="_blank">远征</a>'
  step9: '殖民的星球越多，你成长得越快：你可以同时在多颗星球上生产资源、建造舰船。注意，只有天体物理学等级足够高，才能殖民星系的内侧或外侧位置。殖民船本身不需要天体物理学就能建造，但你的第一块殖民地需要它！<br><br>

    在自己的星系或紧邻的星系殖民，可以缩短运输路线。缺点是：游戏后期，别的玩家可能在你的星系里建一块殖民地，目的不是为了矿场，而是当作临时的舰队基地——也就是所谓的突袭殖民地。<br><br>

    维基中有更多内容：

    <a href="{wiki_url}/wiki/En/Astrophysik" target="_blank">天体物理学</a>'
  step10: "想更快获得资源？去攻击其他玩家吧。权衡成本和收益，让你的攻击有利可图，并用间谍报告和战斗模拟器来制定计划。<br><br>\n小心！其他玩家可以通过多种方式追踪许多舰队任务。<br>\n不要丢掉辛苦积攒的舰队，这是游戏中最重要的部分之一。<br><br>\n所以一定要读读这些维基主题：\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">舰队保全</a> - \n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">感应阵</a>"
  step10_u6: '想更快获得资源？去攻击其他玩家吧。权衡成本和收益，让你的攻击有利可图，并用间谍报告和战斗模拟器来制定计划。<br><br>

    小心！其他玩家可以通过多种方式追踪许多舰队任务。<br>

    不要丢掉辛苦积攒的舰队，这是游戏中最重要的部分之一。<br><br>

    所以一定要读读这些维基主题：

    <a href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden" target="_blank">舰队保全</a>'
  step11: '舰队被摧毁后会留下残骸场，你可以去回收。这需要回收船，每艘载货量为 20,000。歼灭一支大舰队，可能是一笔丰厚的资源来源。<br><br>

    你也可以不通过舰队菜单，直接在星系视图中点击残骸场来派出回收船。'
  step12: '恭喜，你已完成教程！<br><br>

    游戏里还有很多内容等你探索。<br>

    比如，大致有三种玩法，它们花费的时间也各不相同：<br>

    <ul>

    <li>矿工：在众多殖民地上扩建矿场，主要驾驶运输舰</li>

    <li>舰队流：把大部分积分投入战舰，自己几乎没有产出，靠掠夺其他玩家为生</li>

    <li>混合流：两者兼顾</li>

    </ul>

    月球在游戏后期会变得很重要，到现在你应该已经认识感应阵了。<br><br>

    还有疑问？看看维基，或者到 Discord 向社区求助。'
  step12_u6: '恭喜，你已完成教程！<br><br>

    游戏里还有很多内容等你探索。<br>

    比如，大致有三种玩法，它们花费的时间也各不相同：<br>

    <ul>

    <li>矿工：在众多殖民地上扩建矿场，主要驾驶运输舰</li>

    <li>舰队流：把大部分积分投入战舰，自己几乎没有产出，靠掠夺其他玩家为生</li>

    <li>混合流：两者兼顾</li>

    </ul>

    还有疑问？看看维基，或者到 Discord 向社区求助。'
tutorial_title:
  step0: 欢迎，统帅！
  step1: 开始挖矿吧！
  step2: 来认识新朋友！
  step3: 别让你的星球毫无防备！
  step4: 要有长远打算！
  step5: 舰船，我们需要舰船！
  step6: 给星球起名，结交朋友！
  step7: 看看别人有什么！
  step8: 驶向未知！
  step9: 一颗星球永远不够！
  step10: 等矿场等得不耐烦了？
  step11: 该清理垃圾了！
  step12: 你做到了！
