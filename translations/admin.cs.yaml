  umístění rovnoměrně zaplňuje galaxie a systémy na náhodných pozicích.<br>Blokové
  umístění vybere systém, který už má jednu nebo dvě planety. Pokud takový
  systém neexistuje nebo je hráčů méně než 50, umístění je náhodné.
