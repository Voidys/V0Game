se_bots_join_human_alliances: "Boti smějí vstupovat do aliancí hráčů"
se_bots_join_human_alliances_info: "Boti se smějí hlásit i do aliancí založených lidskými hráči. Vypnuto: boti vstupují jen do aliancí založených boty a opouštějí aliance hráčů."
