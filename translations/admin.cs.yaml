se_bot_chatter: "Boti si povídají"
se_bot_chatter_info: "Zapnuto: boti odpovídají na soukromé zprávy. Vypnuto: zprávy se stále čtou a počítají, ale odesílají se jen bojové reakce (po napadení nebo při nájezdu na hráče, který jim napsal). Boti nikdy nepíšou hráčům první."
