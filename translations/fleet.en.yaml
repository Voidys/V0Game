sys_expe_attack_1_1_1: A space pirate in despair tried to commandeer our expedition fleet.
sys_expe_attack_1_1_2: >-
  Some primitive barbarians attacked us with spaceships. At least their ships
  were in horrible condition. If their firepower was a serious threat, we would
  have been forced to reply with our own.
sys_expe_attack_1_1_3: >-
  We have intercepted a couple of radio messages of some very drunk pirates. We
  apparently will be attacked.
sys_expe_attack_1_1_4: >-
  We had to fight some pirates, but luckily we outnumbered them.
sys_expe_attack_1_1_5: >-
  Our fleet reports that a certain Moa Tikarr and his crew requested the
  unconditional surrender of our fleet. If they are serious, they will
  find out that we can defend ourselves very well.
sys_expe_attack_1_2_1: Your expedition fleet had an unforeseen encounter with some space pirates.
sys_expe_attack_1_2_2: >-
  We flew into an ambush of some star pirates! Unfortunately, a fight was unavoidable.
sys_expe_attack_1_2_3: >-
  The call for help of another expedition fleet turned out to be a trap of some
  cunning pirates. A battle was unavoidable.
sys_expe_attack_1_3_1: >-
  The intercepted signals did not come from unknown aliens, but from a secret
  pirate base! The pirates were not very happy about our presence in their sector.
sys_expe_attack_1_3_2: The expedition fleet reported intense fights with unidentified pirate ships!
sys_expe_attack_1_3_3: >-
  We have just received an urgent message from the expedition commander:
  "They're coming at us! They jumped out of hyperspace, fortunately they're just
  pirates, so we have a chance, we'll fight!"
sys_expe_attack_2_1_1: Your expedition fleet had an unwelcoming first contact with an unknown species.
sys_expe_attack_2_1_2: Some strange ships have attacked the expedition fleet without warning!
sys_expe_attack_2_1_3: Our expedition was attacked by a small group of unidentified spacecraft!
sys_expe_attack_2_1_4: >-
  The expedition fleet reports contact with unknown ships. The radio messages
  cannot be decoded, but the strange ships seem to be powering up their
  weapons.
sys_expe_attack_2_2_1: An unknown species attacks our expedition!
sys_expe_attack_2_2_2: >-
  Your expedition fleet has apparently violated the territory of a previously
  unknown but highly aggressive alien race.
sys_expe_attack_2_2_3: >-
  The connection to our expedition fleet was cut off abruptly. The last we
  heard, the fleet was taking heavy fire. The attackers could not be
  identified.
sys_expe_attack_2_3_1: >-
  Your expedition has come across an alien invasion fleet and reports massive battles!
sys_expe_attack_2_3_2: >-
  A large group of crystalline ships of unknown origin is on a direct collision
  course with our expedition fleet. We must prepare ourselves for the worst.
sys_expe_attack_2_3_3: >-
  We had a bit of difficulty pronouncing the dialect of the alien race
  correctly. Our diplomat accidentally called 'Fire!' instead of 'Peace!'
sys_expe_attackname_1: Pirates
sys_expe_attackname_2: Aliens
sys_expe_back_home: Your fleet has returned to %1$s %2$s from the expedition at %3$s.
sys_expe_back_home_ress: It delivers %s %s, %s %s, and %s %s.
sys_expe_back_home_ships_flound: 'The following ships were found:'
sys_expe_back_home_ships_lost: 'The following ships were lost:'
sys_expe_depleted_max_1: >-
  Entry from the communications officer's logbook: If we ever feel unsafe, we
  can always join forces with the other expeditions flying around here.
sys_expe_depleted_max_2: >-
  Entry from the communications officer's logbook: If this goes on, we will
  have to set up navigation buoys to handle all this traffic.
sys_expe_depleted_max_3: >-
  Entry from the communications officer's logbook: Maybe it would be more
  useful to open a souvenir shop here than to send yet another expedition.
sys_expe_depleted_med_1: >-
  Entry from the communications officer's logbook: We found signs of several
  expedition fleets in the area. We are heading home.
sys_expe_depleted_med_2: >-
  Entry from the communications officer's logbook: We established friendly radio
  contact with some other expeditions in this sector.
sys_expe_depleted_med_3: >-
  Entry from the communications officer's logbook: We celebrated the end of
  the expedition with the crew of another expedition fleet traveling in the
  same sector. They have nothing new to report either.
sys_expe_depleted_min_1: >-
  Entry from the communications officer's logbook: It seems that humans have been
  in this part of the galaxy before.
sys_expe_depleted_min_2: >-
  Entry from the communications officer's logbook: We found debris from old
  spaceships. We are not the first ones here.
sys_expe_depleted_min_3: >-
  Entry from the communications officer's logbook: We nearly collided with
  another expedition fleet. I never thought there would be anyone else out
  here.
sys_expe_depleted_not_1: >-
  Entry from the communications officer's logbook: It seems that this part of the
  universe has not been explored yet.
sys_expe_depleted_not_2: >-
  Entry from the communications officer's logbook: It feels great to be the first
  ones traveling through an unexplored sector.
sys_expe_feqeuence_few: More than 10 expeditions in the last 24 hours
sys_expe_feqeuence_many: More than 50 expeditions in the last 24 hours
sys_expe_feqeuence_medium: More than 25 expeditions in the last 24 hours
sys_expe_found_goods: '%s %s were mined.'
sys_expe_found_ress_1_1: >-
  Your expedition has discovered a small asteroid cluster from which some
  resources could be extracted.
sys_expe_found_ress_1_2: >-
  On a remote planetoid, several easily accessible resource fields were found
  and raw materials were successfully extracted.
sys_expe_found_ress_1_3: >-
  Your expedition stumbled upon very old spaceship wrecks from a long-past battle.
  Individual components could be salvaged and recycled.
sys_expe_found_ress_1_4: >-
  The expedition discovered a planet contaminated by radiation with a
  highly poisonous atmosphere. However, scans showed that this planet contains
  a lot of raw material. Automated drones were used to try to extract
  as many resources as possible.
sys_expe_found_ress_2_1: >-
  Your expedition found an ancient freighter convoy which is fully loaded but
  deserted. Some resources could be yielded. 
sys_expe_found_ress_2_2: >-
  Your expedition found great raw material deposits on a little moon with an
  atmosphere of its own. The crew are currently extracting this treasure.
sys_expe_found_ress_2_3: >-
  We have met a small convoy of civilian ships which urgently needed food and
  medicine. In exchange, we received a considerable amount of useful resources.
sys_expe_found_ress_3_1: >-
  Your expedition fleet reports the discovery of a massive alien shipwreck.
  While they couldn't do anything with the technology, the ship could be
  dismantled into its individual parts, yielding valuable raw materials.
sys_expe_found_ress_3_2: >-
  The asteroid belt around an unknown planet contained vast amounts of raw
  materials. The expedition fleet filled its storage rooms!
sys_expe_found_ress_logbook_1: >-
  Entry from the first officer's logbook: We used up every bit of free space,
  but we still could not take all the resources we found.
sys_expe_found_ress_logbook_2: >-
  Entry from the first officer's logbook: If only we had a few more cargo
  ships! Now we have to leave loads of resources behind.
sys_expe_found_ress_logbook_3: >-
  Entry from the first officer's logbook: We have already thrown out
  everything we no longer need, but we still cannot make enough room for all
  the resources we found.
sys_expe_found_ress_logbook_4: >-
  Entry from the first officer's logbook: Even when we transformed the cafeteria
  and all the lounges into storage rooms, we still could not transport all
  the resources we found.
sys_expe_found_ships_1_1: >-
  We have discovered the remains of a predecessor expedition! Our technicians
  are checking whether they can get some of the wrecks working again.
sys_expe_found_ships_1_2: >-
  We have found a deserted pirate base. Some old ships are still located in the
  hangar. Our technicians are checking whether some of the ships are still usable.
sys_expe_found_ships_1_3: >-
  Our expedition found a planet which was almost completely destroyed by wars.
  Various shipwrecks drifted in orbit. The technicians tried to repair some of
  these. Perhaps we can learn more of what happened here.
sys_expe_found_ships_1_4: >-
  The expedition stumbled upon an old starbase which seems to have been abandoned for
  an eternity. A couple of ships were found in the hangar of the fortress. The
  technicians managed to get some of them flying again.
sys_expe_found_ships_2_1: >-
  We have found the remains of an armada. The technicians of the expedition have
  immediately gone onto the partly intact ships and were able to repair some of
  them.
sys_expe_found_ships_2_2: >-
  Our expedition discovered an old automatic shipyard with some of the ships still in
  the production phase. After restoring the energy supply of the shipyard, our technicians
  worked to complete their construction.
sys_expe_found_ships_3_1: >-
  We have found a gigantic ship cemetery. Some technicians of the expedition
  have managed to get one or two ships into operation again.
sys_expe_found_ships_3_2: >-
  We have discovered a planet with remains of a civilization. Another gigantic
  ship station which is still intact has been spotted from outer space. Some of
  our technicians and pilots have gone onto the surface to determine whether a
  couple of the ships can be retrieved.
sys_expe_found_ships_logbook_1: >-
  Entry from the engine room officer's logbook: If we had brought a few more
  ships with us, it would have been easy to take some of those beauties home!
sys_expe_found_ships_logbook_2: >-
  Entry from the engine room officer's logbook: Unfortunately, we did not have
  the capacity to bring back all the ships we discovered on this mission.
sys_expe_found_ships_logbook_3: >-
  Entry from the engine room officer's logbook: Unfortunately, we do not have
  enough capacity to bring all the ships we found back with us.
sys_expe_found_ships_nothing: No ships could be found.
sys_expe_lost_fleet_1: >-
  The only thing left of the expedition is the following radio message: Zzzrrt
  oh God!...Krrrzzzzt the zrrrtrzt sees krgzzzz yes from how Krzzzzzzzztzzzz...
sys_expe_lost_fleet_2: >-
  The last thing we received of the expedition were some unbelievable good
  close-ups of an opening black hole.
sys_expe_lost_fleet_3: >-
  A nuclear breach on one of the commanding ships led to a chain reaction which
  destroyed the entire expedition in a spectacular explosion.
sys_expe_lost_fleet_4: >-
  The expedition fleet has not returned from their hyperspace jump. Our scientists
  are still puzzling over what might have happened, but the fleet appears to be lost forever.
sys_expe_nothing_1: >-
  This expedition brings back nothing exciting except a few curious little
  animals from an unknown marsh planet.
sys_expe_nothing_2: >-
  Your expedition took some beautiful pictures of a supernova. However, this expedition
  did not really yield any new insights. But it has a good chance of winning this year's
  Best Picture in the Universe competition.
sys_expe_nothing_3: >-
  A strange computer virus crippled navigation shortly after leaving the solar system.
  This caused the entire expedition fleet to fly in circles the whole time.
  Needless to say, the expedition was not particularly successful.
sys_expe_nothing_4: >-
  A life form of pure energy has made all expedition members stare at hypnotic
  symbols on their screens for several days. When most were finally clear in the
  head again, the expedition had to be canceled due to a deuterium shortage.
sys_expe_nothing_5: >-
  Well, at least we now know that Class 5 red anomalies not only have chaotic effects
  on the ship's systems, but can also trigger massive hallucinations in the crew.
  Unfortunately, nothing else has been discovered on this expedition.
sys_expe_nothing_6: >-
  Despite the initially promising scans of this sector, we unfortunately
  came back empty-handed.
sys_expe_nothing_7: >-
  Perhaps the captain's birthday shouldn't have been celebrated on this remote
  planet. A nasty hemorrhagic fever sent most of the crew to the sickbay, and
  the acute staff shortage caused the expedition to fail.
sys_expe_nothing_8: >-
  Your expedition has found nothing but the vast emptiness of space. There
  was not even a little asteroid, or radiation, or particles, or anything else that
  could make this expedition at least a bit exciting.
sys_expe_nothing_9: >-
  A reactor malfunction on the command ship almost destroyed the entire
  expedition. Fortunately, the technicians were more than capable and could
  prevent the worst. The repair, however, took so much time that the expedition
  returned without achieving anything.
sys_expe_report: Expedition report
sys_expe_report_msg: 'Expedition report of the fleet of %s %s at %s:'
sys_expe_time_fast_1: >-
  An unforeseen feedback loop in the propulsion system energy coils accelerated
  the expeditions return, causing it to arrive earlier than expected.
  Initial reports indicate, however, that it has nothing else to report.
sys_expe_time_fast_2: >-
  The somewhat daring new commander used an unstable wormhole to shorten the
  return journey - successfully! However, the expedition itself yielded no new insights.
sys_expe_time_fast_3: >-
  Your expedition reported no anomalies in the explored sector. However, the fleet
  encountered a solar wind during the return flight, which significantly accelerated
  the trip. Your expedition will now return home somewhat earlier than expected.
sys_expe_time_slow_1: >-
  A serious blunder by the navigator landed the fleet at the wrong place entirely.
  The return journey consequently took considerably longer.
sys_expe_time_slow_2: >-
  For reasons still unknown, the fleet's jump went completely wrong. They
  almost ended up in the heart of a star! Luckily, they landed in a known
  system, but the return trip will take longer than originally planned.
sys_expe_time_slow_3: >-
  The new navigation module still seems to be plagued by some bugs. Not only did the
  expedition fleet go in completely the wrong direction, but it also consumed all of
  its deuterium! Disappointed, the expedition is now returning on reserve power.
sys_expe_time_slow_4: >-
  Your expedition entered a sector with intensified particle storms. This overloaded
  the energy storage systems, causing the main systems of all ships to fail.
  Your mechanics managed to prevent the worst, but the expedition will now return
  with a considerable delay.
sys_expe_time_slow_5: >-
  The flagship of your expedition fleet collided with an alien vessel that jumped
  directly into the fleet without warning. The alien ship exploded, and the damage
  to the flagship was considerable. Once the most serious repairs are completed,
  your ships will begin their return journey, as the expedition cannot continue
  in its current condition.
sys_expe_time_slow_6: >-
  The stellar wind of a red giant distorted the jump of the expedition, causing
  the navigation systems to completely miscalculate the return journey.
  As a result, the expedition finds itself in the vast emptiness between unfamiliar stars.
