sys_expe_depleted_max_2: 'Ghi chép từ nhật ký của sĩ quan liên lạc: Cứ thế này, ta sẽ phải đặt phao dẫn đường để xử lý hết lưu lượng này.'
sys_expe_depleted_max_3: 'Ghi chép từ nhật ký của sĩ quan liên lạc: Có lẽ mở một cửa hàng lưu niệm ở đây còn có ích hơn là gửi thêm một cuộc thám hiểm nữa.'
sys_expe_depleted_med_1: 'Ghi chép từ nhật ký của sĩ quan liên lạc: Chúng tôi thấy dấu hiệu của nhiều hạm đội thám hiểm trong khu vực. Chúng tôi đang quay về nhà.'
sys_expe_depleted_med_2: 'Ghi chép từ nhật ký của sĩ quan liên lạc: Chúng tôi đã liên lạc vô tuyến thân thiện với vài đoàn thám hiểm khác trong khu vực này.'
sys_expe_depleted_med_3: 'Ghi chép từ nhật ký của sĩ quan liên lạc: Chúng tôi đã ăn mừng kết thúc chuyến thám hiểm cùng thủy thủ đoàn của một hạm đội thám hiểm khác trong cùng khu vực. Họ cũng chẳng có gì mới để báo cáo.'
sys_expe_depleted_min_1: 'Ghi chép từ nhật ký của sĩ quan liên lạc: Có vẻ con người đã từng đến vùng này của thiên hà.'
sys_expe_depleted_min_2: 'Ghi chép từ nhật ký của sĩ quan liên lạc: Chúng tôi tìm thấy mảnh vỡ của những con tàu cũ. Chúng ta không phải những người đầu tiên đến đây.'
sys_expe_depleted_min_3: 'Ghi chép từ nhật ký của sĩ quan liên lạc: Chúng tôi suýt va chạm với một hạm đội thám hiểm khác. Tôi chưa từng nghĩ sẽ có ai khác ở ngoài này.'
sys_expe_depleted_not_1: 'Ghi chép từ nhật ký của sĩ quan liên lạc: Có vẻ vùng này của vũ trụ chưa từng được khám phá.'
sys_expe_depleted_not_2: 'Ghi chép từ nhật ký của sĩ quan liên lạc: Thật tuyệt khi là những người đầu tiên đi qua một khu vực chưa được khám phá.'
