sys_destruc_title: 'Các hạm đội sau đối đầu nhau để phá hủy mặt trăng:'
sys_expe_attack_1_1_1: Một tên hải tặc không gian trong cơn tuyệt vọng đã cố cướp hạm đội thám hiểm của chúng ta.
sys_expe_attack_1_1_2: Vài kẻ man rợ nguyên thủy tấn công chúng ta bằng tàu vũ trụ. Ít ra tàu của chúng cũng trong tình trạng tồi tệ. Nếu hỏa lực của chúng là mối đe dọa thực sự, chúng ta đã buộc phải đáp trả bằng của mình.
sys_expe_attack_1_1_3: Chúng ta đã chặn được vài tin nhắn vô tuyến của một nhóm hải tặc say khướt. Có vẻ chúng ta sắp bị tấn công.
sys_expe_attack_1_1_4: Chúng ta phải đánh nhau với vài tên hải tặc, nhưng may là chúng ta đông hơn.
sys_expe_attack_1_1_5: Hạm đội báo cáo rằng một gã tên Moa Tikarr cùng thủy thủ đoàn yêu cầu hạm đội của chúng ta đầu hàng vô điều kiện. Nếu chúng nghiêm túc, chúng sẽ biết chúng ta tự vệ rất giỏi.
sys_expe_attack_1_2_1: Hạm đội thám hiểm của bạn đã có cuộc chạm trán bất ngờ với vài tên hải tặc không gian.
sys_expe_attack_1_2_2: Chúng ta bay vào ổ phục kích của bọn hải tặc sao! Thật không may, không thể tránh khỏi một trận đánh.
sys_expe_attack_1_2_3: Lời kêu cứu của một hạm đội thám hiểm khác hóa ra là cái bẫy của vài tên hải tặc xảo quyệt. Một trận chiến là không thể tránh.
sys_expe_attack_1_3_1: Những tín hiệu bị chặn không đến từ người ngoài hành tinh lạ, mà từ một căn cứ hải tặc bí mật! Bọn hải tặc không vui chút nào khi thấy chúng ta có mặt trong khu vực của chúng.
sys_expe_attack_1_3_2: Hạm đội thám hiểm báo cáo những trận giao tranh ác liệt với các tàu hải tặc không rõ danh tính!
sys_expe_attack_1_3_3: 'Chúng ta vừa nhận được tin khẩn từ chỉ huy thám hiểm: "Chúng đang lao vào chúng ta! Chúng nhảy ra từ siêu không gian, may là chỉ là hải tặc, nên ta có cơ hội, ta sẽ chiến đấu!"'
sys_expe_attack_2_1_1: Hạm đội thám hiểm của bạn đã có lần tiếp xúc đầu tiên không mấy thân thiện với một chủng loài lạ.
sys_expe_attack_2_1_2: Vài con tàu lạ đã tấn công hạm đội thám hiểm không báo trước!
sys_expe_attack_2_1_3: Đoàn thám hiểm của chúng ta bị một nhóm nhỏ tàu vũ trụ không rõ danh tính tấn công!
sys_expe_attack_2_1_4: Hạm đội thám hiểm báo cáo đã tiếp xúc với những con tàu lạ. Không giải mã được tin nhắn vô tuyến, nhưng những con tàu lạ có vẻ đang khởi động vũ khí.
sys_expe_attack_2_2_1: Một chủng loài lạ đang tấn công đoàn thám hiểm của chúng ta!
sys_expe_attack_2_2_2: Hạm đội thám hiểm của bạn dường như đã xâm phạm lãnh thổ của một chủng tộc ngoài hành tinh chưa từng biết nhưng cực kỳ hiếu chiến.
sys_expe_attack_2_2_3: Liên lạc với hạm đội thám hiểm của chúng ta bị cắt đột ngột. Lần cuối nghe tin, hạm đội đang hứng hỏa lực dữ dội. Không xác định được kẻ tấn công.
sys_expe_attack_2_3_1: Đoàn thám hiểm của bạn đã chạm trán một hạm đội xâm lược của người ngoài hành tinh và báo cáo những trận chiến quy mô lớn!
sys_expe_attack_2_3_2: Một nhóm lớn tàu pha lê không rõ nguồn gốc đang lao thẳng vào hạm đội thám hiểm của chúng ta. Phải chuẩn bị cho điều tồi tệ nhất.
sys_expe_attack_2_3_3: Chúng ta gặp chút khó khăn khi phát âm đúng phương ngữ của chủng tộc ngoài hành tinh. Nhà ngoại giao của chúng ta vô tình hô 'Bắn!' thay vì 'Hòa bình!'
