sys_expe_found_ress_1_1: Đoàn thám hiểm của bạn phát hiện một cụm tiểu hành tinh nhỏ có thể khai thác được một ít tài nguyên.
sys_expe_found_ress_1_2: Trên một tiểu hành tinh hẻo lánh, tìm thấy vài mỏ tài nguyên dễ khai thác và đã thu được nguyên liệu thành công.
sys_expe_found_ress_1_3: Đoàn thám hiểm của bạn tình cờ gặp xác những con tàu rất cũ từ một trận chiến đã xa. Có thể thu hồi và tái chế từng bộ phận.
sys_expe_found_ress_1_4: Đoàn thám hiểm phát hiện một hành tinh nhiễm phóng xạ với khí quyển cực độc. Tuy nhiên, quét cho thấy hành tinh này chứa rất nhiều nguyên liệu. Các drone tự động được dùng để cố khai thác càng nhiều tài nguyên càng tốt.
sys_expe_found_ress_2_1: 'Đoàn thám hiểm của bạn tìm thấy một đoàn tàu chở hàng cổ, chất đầy hàng nhưng không một bóng người. Có thể thu được một ít tài nguyên. '
sys_expe_found_ress_2_2: Đoàn thám hiểm của bạn tìm thấy những mỏ nguyên liệu lớn trên một mặt trăng nhỏ có khí quyển riêng. Thủy thủ đoàn đang khai thác kho báu này.
sys_expe_found_ress_2_3: Chúng ta đã gặp một đoàn tàu dân sự nhỏ đang rất cần lương thực và thuốc men. Đổi lại, chúng ta nhận được một lượng tài nguyên hữu ích đáng kể.
sys_expe_found_ress_3_1: Hạm đội thám hiểm báo cáo phát hiện một xác tàu ngoài hành tinh khổng lồ. Dù không làm được gì với công nghệ của nó, con tàu có thể được tháo thành từng bộ phận, cho ra những nguyên liệu quý giá.
sys_expe_found_ress_3_2: Vành đai tiểu hành tinh quanh một hành tinh chưa biết chứa lượng nguyên liệu khổng lồ. Hạm đội thám hiểm đã lấp đầy các khoang chứa!
sys_expe_found_ress_logbook_1: 'Ghi chép từ nhật ký của sĩ quan thứ nhất: Chúng tôi đã dùng hết từng chút chỗ trống mà vẫn không chở hết số tài nguyên tìm được.'
sys_expe_found_ress_logbook_2: 'Ghi chép từ nhật ký của sĩ quan thứ nhất: Giá mà có thêm vài tàu vận tải! Giờ chúng ta phải bỏ lại cả đống tài nguyên.'
sys_expe_found_ress_logbook_3: 'Ghi chép từ nhật ký của sĩ quan thứ nhất: Chúng tôi đã vứt hết mọi thứ không cần nữa, nhưng vẫn không đủ chỗ cho số tài nguyên tìm được.'
sys_expe_found_ress_logbook_4: 'Ghi chép từ nhật ký của sĩ quan thứ nhất: Ngay cả khi biến căng-tin và mọi phòng sinh hoạt thành kho chứa, chúng tôi vẫn không chở hết số tài nguyên tìm được.'
sys_expe_found_ships_1_1: Chúng ta đã phát hiện tàn tích của một đoàn thám hiểm tiền nhiệm! Các kỹ thuật viên đang kiểm tra xem có thể làm một số xác tàu hoạt động lại không.
sys_expe_found_ships_1_2: Chúng ta đã tìm thấy một căn cứ hải tặc bị bỏ hoang. Vài con tàu cũ vẫn còn trong nhà chứa. Các kỹ thuật viên đang kiểm tra xem một số tàu còn dùng được không.
sys_expe_found_ships_1_3: Đoàn thám hiểm của chúng ta tìm thấy một hành tinh gần như bị chiến tranh tàn phá hoàn toàn. Nhiều xác tàu trôi trên quỹ đạo. Các kỹ thuật viên đã thử sửa một số chiếc. Có lẽ chúng ta sẽ biết thêm chuyện gì đã xảy ra ở đây.
sys_expe_found_ships_1_4: Đoàn thám hiểm tình cờ gặp một trạm không gian cũ có vẻ đã bị bỏ hoang từ rất lâu. Vài con tàu được tìm thấy trong nhà chứa của pháo đài. Các kỹ thuật viên đã làm một số chiếc bay lại được.
sys_expe_found_ships_2_1: Chúng ta đã tìm thấy tàn tích của một hạm đội. Các kỹ thuật viên của đoàn thám hiểm lập tức lên những con tàu còn nguyên một phần và sửa được một số chiếc.
sys_expe_found_ships_2_2: Đoàn thám hiểm của chúng ta phát hiện một xưởng đóng tàu tự động cũ với vài con tàu vẫn đang trong giai đoạn sản xuất. Sau khi khôi phục nguồn điện cho xưởng, các kỹ thuật viên đã làm việc để hoàn thiện chúng.
sys_expe_found_ships_3_1: Chúng ta đã tìm thấy một nghĩa địa tàu khổng lồ. Một số kỹ thuật viên của đoàn thám hiểm đã đưa được một hai con tàu hoạt động lại.
sys_expe_found_ships_3_2: Chúng ta đã phát hiện một hành tinh còn dấu tích của một nền văn minh. Từ ngoài không gian cũng thấy một trạm tàu khổng lồ khác vẫn còn nguyên vẹn. Một số kỹ thuật viên và phi công đã xuống bề mặt để xác định xem có thể thu hồi vài chiếc tàu không.
sys_expe_found_ships_logbook_1: 'Ghi chép từ nhật ký của sĩ quan phòng máy: Nếu mang thêm vài con tàu, đã dễ dàng đưa vài người đẹp này về nhà rồi!'
sys_expe_found_ships_logbook_2: 'Ghi chép từ nhật ký của sĩ quan phòng máy: Đáng tiếc, chúng tôi không đủ sức chở để mang về tất cả số tàu phát hiện được trong nhiệm vụ này.'
sys_expe_found_ships_logbook_3: 'Ghi chép từ nhật ký của sĩ quan phòng máy: Đáng tiếc, chúng tôi không đủ sức chở để mang về tất cả số tàu tìm thấy.'
sys_expe_found_ships_nothing: Không tìm thấy tàu nào.
sys_expe_lost_fleet_1: 'Thứ duy nhất còn lại của đoàn thám hiểm là tin nhắn vô tuyến sau: Zzzrrt ôi trời ơi!...Krrrzzzzt cái zrrrtrzt nhìn thấy krgzzzz vâng từ cách Krzzzzzzzztzzzz...'
sys_expe_lost_fleet_2: Thứ cuối cùng chúng ta nhận được từ đoàn thám hiểm là vài bức ảnh cận cảnh đẹp không tưởng về một hố đen đang mở ra.
sys_expe_lost_fleet_3: Một vụ rò rỉ hạt nhân trên một tàu chỉ huy gây ra phản ứng dây chuyền, phá hủy toàn bộ đoàn thám hiểm trong một vụ nổ ngoạn mục.
sys_expe_lost_fleet_4: Hạm đội thám hiểm đã không trở về sau cú nhảy siêu không gian. Các nhà khoa học vẫn đang vắt óc tìm hiểu chuyện gì có thể đã xảy ra, nhưng hạm đội dường như đã mất vĩnh viễn.
sys_expe_nothing_1: Chuyến thám hiểm này không mang về gì thú vị ngoài vài con vật nhỏ kỳ lạ từ một hành tinh đầm lầy chưa biết.
sys_expe_nothing_2: Đoàn thám hiểm của bạn đã chụp được những bức ảnh tuyệt đẹp về một siêu tân tinh. Tuy nhiên, chuyến đi này thực sự không mang lại hiểu biết mới nào. Nhưng nó có cơ hội tốt giành giải Ảnh đẹp nhất Vũ trụ năm nay.
sys_expe_nothing_3: Một loại virus máy tính lạ đã làm tê liệt hệ thống dẫn đường ngay sau khi rời hệ mặt trời. Khiến cả hạm đội thám hiểm bay vòng vòng suốt chặng đường. Không cần nói, chuyến thám hiểm không thành công mấy.
sys_expe_nothing_4: Một dạng sống thuần năng lượng đã khiến mọi thành viên đoàn thám hiểm nhìn chằm chằm vào những ký hiệu thôi miên trên màn hình suốt nhiều ngày. Khi hầu hết cuối cùng tỉnh táo lại, chuyến thám hiểm phải hủy vì thiếu deuterium.
sys_expe_nothing_5: Chà, ít ra giờ chúng ta biết dị thường đỏ cấp 5 không chỉ gây hỗn loạn cho hệ thống tàu mà còn có thể gây ảo giác hàng loạt cho thủy thủ đoàn. Đáng tiếc, chuyến thám hiểm này không phát hiện thêm gì khác.
sys_expe_nothing_6: Dù các lần quét ban đầu của khu vực này đầy hứa hẹn, đáng tiếc chúng tôi trở về tay trắng.
sys_expe_nothing_7: Có lẽ không nên tổ chức sinh nhật thuyền trưởng trên hành tinh hẻo lánh này. Một cơn sốt xuất huyết quái ác khiến hầu hết thủy thủ đoàn phải vào bệnh xá, và tình trạng thiếu người nghiêm trọng khiến chuyến thám hiểm thất bại.
sys_expe_nothing_8: Đoàn thám hiểm của bạn không tìm thấy gì ngoài khoảng không mênh mông. Thậm chí không có một tiểu hành tinh nhỏ, bức xạ, hạt hay bất cứ thứ gì có thể khiến chuyến thám hiểm này thú vị hơn một chút.
sys_expe_nothing_9: Sự cố lò phản ứng trên tàu chỉ huy suýt phá hủy cả đoàn thám hiểm. May mắn là các kỹ thuật viên rất giỏi và ngăn được điều tồi tệ nhất. Tuy nhiên, việc sửa chữa tốn quá nhiều thời gian nên đoàn thám hiểm trở về mà chẳng đạt được gì.
sys_expe_report: Báo cáo thám hiểm
sys_expe_report_msg: 'Báo cáo thám hiểm của hạm đội %s %s tại %s:'
sys_expe_time_fast_1: Một vòng phản hồi bất ngờ trong các cuộn năng lượng của hệ thống đẩy đã đẩy nhanh chuyến về của đoàn thám hiểm, khiến nó đến sớm hơn dự kiến. Tuy nhiên, các báo cáo ban đầu cho thấy nó không có gì khác để báo cáo.
sys_expe_time_fast_2: Vị chỉ huy mới hơi liều đã dùng một lỗ sâu không ổn định để rút ngắn chuyến về - và thành công! Tuy nhiên, bản thân chuyến thám hiểm không mang lại hiểu biết mới nào.
sys_expe_time_fast_3: Đoàn thám hiểm của bạn báo cáo không có dị thường nào trong khu vực đã khám phá. Tuy nhiên, hạm đội gặp một luồng gió mặt trời trong chuyến bay về, đẩy nhanh đáng kể chuyến đi. Đoàn thám hiểm của bạn sẽ về nhà sớm hơn dự kiến.
sys_expe_time_slow_1: Một sai sót nghiêm trọng của hoa tiêu đã đưa hạm đội đến hoàn toàn sai chỗ. Do đó chuyến về mất nhiều thời gian hơn hẳn.
sys_expe_time_slow_2: Vì những lý do vẫn chưa rõ, cú nhảy của hạm đội đã hỏng hoàn toàn. Họ suýt rơi vào lõi một ngôi sao! May mắn là họ đáp xuống một hệ đã biết, nhưng chuyến về sẽ lâu hơn dự kiến ban đầu.
sys_expe_time_slow_3: Mô-đun dẫn đường mới dường như vẫn còn nhiều lỗi. Không chỉ hạm đội thám hiểm đi hoàn toàn sai hướng, mà còn tiêu hết sạch deuterium! Thất vọng, đoàn thám hiểm đang quay về bằng năng lượng dự phòng.
sys_expe_time_slow_4: Đoàn thám hiểm của bạn đã vào một khu vực có bão hạt dữ dội. Điều này làm quá tải hệ thống tích trữ năng lượng, khiến các hệ thống chính của mọi tàu hỏng. Các thợ máy của bạn ngăn được điều tồi tệ nhất, nhưng đoàn thám hiểm giờ sẽ về muộn đáng kể.
sys_expe_time_slow_5: Soái hạm của hạm đội thám hiểm đã va chạm với một con tàu ngoài hành tinh nhảy thẳng vào hạm đội không báo trước. Tàu ngoài hành tinh phát nổ, và hư hại của soái hạm rất lớn. Khi những sửa chữa nghiêm trọng nhất hoàn tất, các tàu của bạn sẽ bắt đầu chuyến về, vì đoàn thám hiểm không thể tiếp tục trong tình trạng hiện tại.
sys_expe_time_slow_6: Gió sao của một sao khổng lồ đỏ làm lệch cú nhảy của đoàn thám hiểm, khiến hệ thống dẫn đường tính sai hoàn toàn chuyến về. Kết quả là đoàn thám hiểm đang ở giữa khoảng không mênh mông giữa những ngôi sao lạ.
