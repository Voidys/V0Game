tutorial_rewards_header: "Награды:"
tutorial_text:
  step0: "Добро пожаловать в {game_name}!<br><br>\r\nЭто короткое обучение покажет основы игры.<br>\r\nМы часто ссылаемся на нашу Wiki: не всё умещается в обучение. Открыть её можно в любой момент через меню слева.<br>\r\nОбучение можно пропустить когда угодно, но заново запустить его не получится.<br><br>\r\nУдачи, Император!"
  step1: "Твоя цель — набрать как можно больше очков. Ты получаешь одно очко за каждые 1000 потраченных ресурсов, а лучший источник ресурсов — твои собственные рудники.<br>\r\nНачни с базовых запасов: тебе нужны металл и кристалл из рудников, а также энергия с Солнечной электростанции, чтобы они работали. Если энергии не хватает, рудники выдают меньше 100% продукции.<br>\r\nУлучшай эти постройки в меню <b>Постройки</b>. Нажми на название постройки, чтобы увидеть, что даст следующий уровень и сколько энергии он потребует.<br><br>\r\nХочешь узнать больше? Загляни в <b>Wiki</b>: \r\n<a href=\"{wiki_url}/wiki/En/Rohstoffe\" target=\"_blank\">Ресурсы</a>"
  step2: "Вместе играть веселее. Большинство игроков сидит в нашем Discord: там можно получить ответы на вопросы и найти компанию для игры.<br>\r\nВсё ещё не разобрался? Можно также создать тикет в поддержку."
  step3: "Грабить чужие планеты — ещё один способ добыть ресурсы, и это может случиться и с тобой. Поэтому построй первую оборону!<br>\r\nДаже небольшая оборона убережёт твою добычу на ночь.<br><br>\r\nБой решают не только цифры: важен и состав атакующего флота.<br>\r\nПрежде чем грабить, нападающему придётся пробить твою оборону, а каждый лишний корабль снижает его прибыль и может стоить ему новых потерь.<br>\r\nОборону строят на <b>Верфи</b>, во вкладке <b>Оборона</b>. Нужны Верфь (а для неё — Фабрика роботов) и немного дейтерия.<br><br>\r\nВот подходящая статья в Wiki: \r\n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">Оборонительные сооружения</a>"
  step4: "Держи поставки ресурсов на ходу — развивай рудники!<br>\r\nПостройки, корабли, оборона и исследования со временем дорожают, поэтому твоя добыча должна расти вместе с ними. Открой «Постройки» и улучшай рудники, как только хватает ресурсов."
  step5: "Построй себе Малый транспорт!<br>\r\nМалые транспорты — быстрые и удобные грузовые корабли.<br>\r\nС Импульсным двигателем на больших расстояниях они быстрее Больших транспортов.<br>\r\nС их помощью можно перевозить ресурсы между своими планетами, торговать с другими игроками или грабить их.<br><br>\r\nПодробнее в Wiki: \r\n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Корабли</a>"
  step6: "Дай планете имя, чтобы не путаться. В «Обзоре» нажми на название планеты в шапке блока с очками. Давай, попробуй прямо сейчас.<br><br>\r\nЕщё можно отправлять другим игрокам запросы в друзья. Когда они согласятся, вам будет проще общаться, и вы будете видеть статус друг друга в сети. Для этого не нужно состоять в одном альянсе. Друзья также могут держать флоты на планетах друг друга, так что защищаться вместе можно и вне альянса.<br><br>\r\nИли вступи в альянс и играй командой. Отдельные запросы в друзья для удержания флотов тебе тогда не нужны. Внутри альянса можно рассылать общие сообщения и видеть статус в сети и очки других участников, в зависимости от твоего ранга в альянсе."
  step7: "Чтобы узнать, какие ресурсы, постройки, исследования, корабли и оборона есть у другого игрока, за ним нужно пошпионить. Отправь Шпионский зонд игроку из меню «Флот» или из Галактики.<br>\r\nПомни: другие игроки тоже могут шпионить за тобой!"
  step8: "Экспедиция может принести ресурсы, корабли, особые события или потери. Чтобы попробовать, возьми корабль, выбери целью позицию планеты 16 и задание «Экспедиция» в меню «Флот».<br>\r\nКаждый тип кораблей увеличивает размер экспедиционного флота — до предела, где достигается максимальный размер события.<br><br>\r\nВ Wiki объясняется, что можно изменить, чтобы выжать из экспедиции максимум: \r\n<a href=\"{wiki_url}/wiki/En/Expoanleitung\" target=\"_blank\">Экспедиции</a>"
  step9: "Чем больше планет ты колонизируешь, тем быстрее растёшь: ресурсы и корабли можно производить сразу на нескольких планетах. Учти, что заселять внутренние и внешние позиции системы можно только при достаточном уровне Астрофизики. Сам Колонизатор строится и без Астрофизики, а вот для первой колонии она нужна!<br><br>\r\nКолонии в твоей системе или в соседней сохраняют короткие маршруты для транспортов. Минус: позже в игре другие игроки могут поставить колонию в твоей системе не ради рудников, а как временную базу для флота — так называемую рейд-колонию.<br><br>\r\nПодробнее в Wiki: \r\n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Астрофизика</a>"
  step10: "Хочешь получать ресурсы быстрее? Атакуй других игроков. Взвешивай затраты и выгоду, чтобы атака окупилась, а для планирования используй шпионские доклады и боевой симулятор.<br><br>\r\nОсторожно! Другие игроки могут по-разному отслеживать многие задания флота.<br>\r\nНе потерять с трудом нажитый флот — одна из важнейших частей игры.<br><br>\r\nПоэтому обязательно прочти эти статьи Wiki: \r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Сейв флота</a> - \r\n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Сенсорная фаланга</a>"
  step10_u6: "Хочешь получать ресурсы быстрее? Атакуй других игроков. Взвешивай затраты и выгоду, чтобы атака окупилась, а для планирования используй шпионские доклады и боевой симулятор.<br><br>\r\nОсторожно! Другие игроки могут по-разному отслеживать многие задания флота.<br>\r\nНе потерять с трудом нажитый флот — одна из важнейших частей игры.<br><br>\r\nПоэтому обязательно прочти эту статью Wiki: \r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Сейв флота</a>"
  step11: "Когда флоты уничтожены, остаётся поле обломков, которое можно собрать. Для этого нужны Переработчики с грузоподъёмностью по 20 000 каждый. Уничтожение большого флота может стать выгодным источником ресурсов.<br><br>\r\nОтправить Переработчики можно и прямо из Галактики, нажав на поле обломков, — не обязательно идти через меню «Флот»."
  step12: "Поздравляем, ты прошёл обучение!<br><br>\r\nВ игре тебя ждёт ещё много всего.<br>\r\nНапример, есть примерно три стиля игры, которые отличаются и тем, сколько времени они требуют:<br>\r\n<ul>\r\n<li>Шахтёр: развивает рудники на множестве колоний и в основном летает транспортами</li>\r\n<li>Флитовод: вкладывает большую часть очков в боевые корабли, почти не имеет собственной добычи и живёт за счёт грабежа других игроков</li>\r\n<li>Комбер: смесь того и другого</li>\r\n</ul>\r\nПозже в игре важными становятся луны, а с Сенсорной фалангой ты к этому моменту уже должен был познакомиться.<br><br>\r\nОстались вопросы? Читай Wiki или спроси сообщество в Discord."
  step12_u6: "Поздравляем, ты прошёл обучение!<br><br>\r\nВ игре тебя ждёт ещё много всего.<br>\r\nНапример, есть примерно три стиля игры, которые отличаются и тем, сколько времени они требуют:<br>\r\n<ul>\r\n<li>Шахтёр: развивает рудники на множестве колоний и в основном летает транспортами</li>\r\n<li>Флитовод: вкладывает большую часть очков в боевые корабли, почти не имеет собственной добычи и живёт за счёт грабежа других игроков</li>\r\n<li>Комбер: смесь того и другого</li>\r\n</ul>\r\nОстались вопросы? Читай Wiki или спроси сообщество в Discord."
tutorial_title:
  step0: Добро пожаловать, Император!
  step1: Пора добывать ресурсы!
  step2: Знакомься с другими!
  step3: Не оставляй планету без защиты!
  step4: Думай наперёд!
  step5: Кораблей! Нам нужно больше кораблей!
  step6: Назови планету и найди друзей!
  step7: Узнай, что есть у других!
  step8: В неизвестность!
  step9: Одной планеты мало!
  step10: Надоело ждать рудники?
  step11: Пора вынести мусор!
  step12: Ты справился!
