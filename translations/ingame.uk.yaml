op_activate_vacation_mode_descrip: Режим відпустки захищає тебе під час тривалої відсутності. Його можна ввімкнути, лише коли жоден із твоїх флотів не в русі. Після ввімкнення він захищає від нових атак. Проте атаки, що вже розпочалися, тривають, а дружні флоти, що утримують позицію, буде відправлено назад! Виробництво ресурсів, будівництво споруд, замовлення на верфі та дослідження на цей час призупиняються й потім відновлюються. Режим відпустки не можна вимкнути протягом перших 48 годин!
