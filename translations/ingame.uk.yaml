stb_activ: Докладні шпигунські звіти (Scavengers Toolbox) увімкнено
stb_big_ress: Багато ресурсів (менше ніж)
stb_big_ress_tooltip: Якщо на планеті менше ресурсів, ніж це значення, шпигунський звіт позначається світло-зеленим (добре). Звіти з більшою кількістю ресурсів показуються світло-блакитним (оптимально).
stb_big_time: Багато ресурсів за секунду (менше ніж)
stb_big_time_tooltip: Найкращий можливий видобуток ресурсів за секунду, округлений до двох знаків після коми. Співвідношення нижче цього значення вважається добрим (світло-зелений), вище — оптимальним (світло-блакитний).
stb_low_ress: Мало ресурсів (менше ніж)
stb_low_ress_tooltip: Якщо на планеті менше ресурсів, ніж це значення, шпигунський звіт позначається яскраво-червоним (погано).
stb_med_time: Помірна кількість ресурсів за секунду (менше ніж)
stb_med_time_tooltip: Найкращий можливий видобуток ресурсів за секунду, округлений до двох знаків після коми. Співвідношення нижче цього значення вважається середнім (світло-оранжевий).
stb_mid_ress: Помірна кількість ресурсів (менше ніж)
stb_mid_ress_tooltip: Якщо на планеті менше ресурсів, ніж це значення, шпигунський звіт позначається світло-оранжевим (середньо).
stb_small_time: Мало ресурсів за секунду (менше ніж)
stb_small_time_tooltip: Найкращий можливий видобуток ресурсів за секунду, округлений до двох знаків після коми. Співвідношення нижче цього значення вважається поганим (світло-червоний).
