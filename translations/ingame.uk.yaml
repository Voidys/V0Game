Achievement_text:
  '1': 'Нехай 5 твоїх атак прибудуть між північчю та 6 ранку за одну ніч, і жодну з них ти не виграєш.'
  '2': Твої флоти були в русі безперервно 90 днів.
  '3': Ти втратив флот, коли мову було встановлено на «французьку».
  '4': Дослідити іонну технологію 10.
  '5': Дослідити гравітонні дослідження 2, просто бо можеш.
  '6': Одна з твоїх атак повернулася лише з 1 металом, 1 кристалом і 1 дейтерієм.
  '7': Переможи флот піратів або прибульців щонайменше з 10 000 кораблів. Космос наш!
  '8': З'явитися на Штаммтіш (вівторок о 20:00 у Discord).
  '9': Збудувати першу Зірку смерті.
  '10': Знищити Місяць гравця.
  '11': Грати 14 днів виключно з мобільного.
  '12': Твій флот знищила чорна діра під час першої експедиції.
  '13': Відправити флот геть, коли до влучання атаки лишається менше 5 секунд.
  '14': Втратити 10 флотів у чорних дірах. Порожнеча голодна.
  '15': 'Не отримай свій перший Місяць за 10 боїв при максимальному шансі на Місяць.'
  '16': Понад 250 твоїх переробників повернулися порожніми.
  '17': Поставити в чергу щонайменше 5000 ракетних установок в одному замовленні.
  '18': Спалити 5 мільйонів дейтерію як палива на одній планеті за 24 години.
  '19': Дослідити технологію броні 3.
  '20': Дослідити технологію броні 6.
  '21': Дослідити технологію броні 9.
  '22': Дослідити технологію броні 12.
  '23': Дослідити технологію броні 15.
  '24': Дослідити лазерну технологію 12.
  '25': Погодитися на ведення рекордів.
  '26': Видалити планету, яка дає тобі найбільше очок (щонайменше 100 000 очок).
  '27': Дослідити міжгалактичну дослідницьку мережу 1.
  '28': Покращити всі три сховища на Місяці щонайменше до 3-го рівня.
  '29': Колективізувати флот гравця з більшою кількістю очок за допомогою об'єднаної атаки з 5 гравців.
  '30': Відбити об'єднану атаку з 5 гравців самотужки.
  '31': Відправити гравця в режим відпустки своєю атакою.
  '32': Пограбувати 1000 планет, граючи з темою «SetSail». Арр!
  '33': Повернутися з режиму відпустки.
  '34': Потрапити під атаку вперше. Ласкаво просимо до всесвіту.
  '35': Атакувати активного гравця, у якого менше 1/10 твоїх очок.
  '36': 'Отримати повідомлення, що містить один із таких фрагментів:

    "Hurensohn", "gleichstarke Ziele", "gegen Schwächere", "ehrenlos"'
  '37': Бути знищеним об'єднаною атакою з 5 гравців.
  '38': Атакувати учасників власного альянсу. Дружній вогонь, хтось?
  '39': Атакувати когось рівно 42 кораблями.
  '40': Колонізувати планету щонайменше за піввсесвіту від себе.
  '41': Заблокувати флотовий слот на тиждень поганою пропозицією на ринку.
  '42': Потрапити до Зали битв 4 рази на боці переможених.
  '43': 'Виграти бій, коли твій обліковий запис позначено як неактивний,

    на одній із твоїх планет, куди раніше прибув флот із часом польоту понад 7 днів.'
  '44': Виробляти ресурс на планеті понад 7 днів, працюючи з енергією менше 100%.
  '45': Виграти атаку проти гравця з топ-5 за обороною.
  '46': Спрацювати захист від башингу, запустивши міжпланетні ракети.
  '47': Знищити 5 Місяців.
  '48': Втратити 5 Зірок смерті, намагаючись знищити Місяці. Ой.
  '49': Знести колонію невдовзі після створення.
  '50': Втратити всі сонячні супутники на планеті з достатньою енергією для дослідження гравітонної технології, не досліджуючи гравітонної технології.
  '51': Витратити весь дейтерій, гортаючи огляд галактики.
  '52': Збудувати Зірку смерті, не збудувавши спершу інших бойових кораблів (легкий винищувач, важкий винищувач, крейсер, лінкор, бомбардувальник, знищувач чи лінійний крейсер).
  '53': Утримувати максимальний рівень у 5 дослідженнях одночасно.
  '54': Розрахувати атаку на активного гравця так, щоб вона влучила 01.01 о 00:00:00.
  '55': Особливе досягнення
