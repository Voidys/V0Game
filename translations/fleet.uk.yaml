sys_expe_attack_1_1_1: Космічний пірат у розпачі спробував захопити наш експедиційний флот.
sys_expe_attack_1_1_2: Якісь примітивні варвари напали на нас на космічних кораблях. Принаймні їхні кораблі були в жахливому стані. Якби їхня вогнева міць була серйозною загрозою, нам довелося б відповісти своєю.
sys_expe_attack_1_1_3: Ми перехопили кілька радіоповідомлень дуже п'яних піратів. Схоже, нас збираються атакувати.
sys_expe_attack_1_1_4: Нам довелося битися з піратами, але, на щастя, нас було більше.
sys_expe_attack_1_1_5: Наш флот повідомляє, що якийсь Моа Тікарр і його команда вимагали беззастережної капітуляції нашого флоту. Якщо вони серйозно, вони дізнаються, що ми дуже добре вміємо захищатися.
sys_expe_attack_1_2_1: Твій експедиційний флот несподівано зіткнувся з космічними піратами.
sys_expe_attack_1_2_2: Ми влетіли в засідку зоряних піратів! На жаль, бою було не уникнути.
sys_expe_attack_1_2_3: Заклик про допомогу від іншого експедиційного флоту виявився пасткою хитрих піратів. Бою було не уникнути.
sys_expe_attack_1_3_1: Перехоплені сигнали надходили не від невідомих прибульців, а з таємної піратської бази! Пірати не дуже зраділи нашій присутності у своєму секторі.
sys_expe_attack_1_3_2: Експедиційний флот повідомив про запеклі бої з невпізнаними піратськими кораблями!
sys_expe_attack_1_3_3: 'Ми щойно отримали термінове повідомлення від командира експедиції: «Вони атакують! Вискочили з гіперпростору, на щастя, це лише пірати, тож шанс у нас є, ми будемо битися!»'
sys_expe_attack_2_1_1: Твій експедиційний флот мав недоброзичливий перший контакт з невідомим видом.
sys_expe_attack_2_1_2: Якісь дивні кораблі без попередження атакували експедиційний флот!
sys_expe_attack_2_1_3: Нашу експедицію атакувала невелика група невпізнаних космічних апаратів!
sys_expe_attack_2_1_4: Експедиційний флот повідомляє про контакт із невідомими кораблями. Радіоповідомлення розшифрувати не вдається, але дивні кораблі, схоже, активують свою зброю.
sys_expe_attack_2_2_1: Невідомий вид атакує нашу експедицію!
sys_expe_attack_2_2_2: Твій експедиційний флот, схоже, порушив територію досі невідомої, але вкрай агресивної раси прибульців.
sys_expe_attack_2_2_3: Зв'язок із нашим експедиційним флотом раптово обірвався. Останнє, що ми почули, — флот потрапив під щільний вогонь. Нападників ідентифікувати не вдалося.
sys_expe_attack_2_3_1: Твоя експедиція натрапила на флот вторгнення прибульців і повідомляє про масштабні битви!
sys_expe_attack_2_3_2: Велика група кристалічних кораблів невідомого походження летить прямісінько на зіткнення з нашим експедиційним флотом. Треба готуватися до найгіршого.
sys_expe_attack_2_3_3: Нам було трохи важко правильно вимовити діалект раси прибульців. Наш дипломат випадково гукнув «Вогонь!» замість «Мир!»
