sys_expe_depleted_max_2: 'Запис із журналу комунікаційного офіцера: якщо так піде й далі, доведеться розставляти навігаційні буї, щоб упоратися з усім цим рухом.'
sys_expe_depleted_max_3: 'Запис із журналу комунікаційного офіцера: можливо, корисніше було б відкрити тут сувенірну крамницю, ніж відправляти ще одну експедицію.'
sys_expe_depleted_med_1: 'Запис із журналу комунікаційного офіцера: ми знайшли сліди кількох експедиційних флотів у цій зоні. Вирушаємо додому.'
sys_expe_depleted_med_2: 'Запис із журналу комунікаційного офіцера: ми встановили дружній радіозв''язок із кількома іншими експедиціями в цьому секторі.'
sys_expe_depleted_med_3: 'Запис із журналу комунікаційного офіцера: ми відсвяткували завершення експедиції разом з екіпажем іншого експедиційного флоту, що летів тим самим сектором. Їм теж нема чого розповісти.'
sys_expe_depleted_min_1: 'Запис із журналу комунікаційного офіцера: схоже, люди вже бували в цій частині галактики.'
sys_expe_depleted_min_2: 'Запис із журналу комунікаційного офіцера: ми знайшли уламки старих космічних кораблів. Ми тут не перші.'
sys_expe_depleted_min_3: 'Запис із журналу комунікаційного офіцера: ми ледь не зіткнулися з іншим експедиційним флотом. Ніколи не думав, що тут буде хтось іще.'
sys_expe_depleted_not_1: 'Запис із журналу комунікаційного офіцера: схоже, цю частину всесвіту ще не досліджували.'
sys_expe_depleted_not_2: 'Запис із журналу комунікаційного офіцера: приємно бути першими, хто подорожує недослідженим сектором.'
