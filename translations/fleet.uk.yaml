sys_expe_found_ress_1_1: Твоя експедиція виявила невелике скупчення астероїдів, з якого вдалося видобути трохи ресурсів.
sys_expe_found_ress_1_2: На віддаленому планетоїді знайшли кілька легкодоступних ресурсних полів і успішно видобули сировину.
sys_expe_found_ress_1_3: Твоя експедиція натрапила на дуже старі уламки космічних кораблів із давно минулої битви. Окремі компоненти вдалося врятувати й переробити.
sys_expe_found_ress_1_4: Експедиція виявила планету, забруднену радіацією, з надзвичайно отруйною атмосферою. Однак скани показали, що на цій планеті багато сировини. Автоматичні дрони намагалися видобути якомога більше ресурсів.
sys_expe_found_ress_2_1: 'Твоя експедиція знайшла давній конвой вантажівців, повністю навантажений, але покинутий. Частину ресурсів вдалося здобути. '
sys_expe_found_ress_2_2: Твоя експедиція знайшла великі поклади сировини на невеликому місяці з власною атмосферою. Екіпаж зараз добуває цей скарб.
sys_expe_found_ress_2_3: Ми зустріли невеликий конвой цивільних кораблів, яким терміново були потрібні їжа та ліки. В обмін ми отримали чималу кількість корисних ресурсів.
sys_expe_found_ress_3_1: Твій експедиційний флот повідомляє про відкриття величезного уламка корабля прибульців. Хоч із технологією нічого вдіяти не вдалося, корабель розібрали на окремі частини й отримали цінну сировину.
sys_expe_found_ress_3_2: Пояс астероїдів навколо невідомої планети містив величезну кількість сировини. Експедиційний флот набив свої склади по зав'язку!
sys_expe_found_ress_logbook_1: 'Запис із журналу першого помічника: ми використали кожен клаптик вільного місця, але все одно не змогли забрати всі знайдені ресурси.'
sys_expe_found_ress_logbook_2: 'Запис із журналу першого помічника: якби ж ми мали ще кілька вантажних кораблів! Тепер доводиться залишати купу ресурсів.'
sys_expe_found_ress_logbook_3: 'Запис із журналу першого помічника: ми вже викинули все непотрібне, але все одно не можемо звільнити достатньо місця для всіх знайдених ресурсів.'
sys_expe_found_ress_logbook_4: 'Запис із журналу першого помічника: навіть коли ми перетворили їдальню й усі кают-компанії на склади, ми все одно не змогли перевезти всі знайдені ресурси.'
sys_expe_found_ships_1_1: Ми виявили рештки попередньої експедиції! Наші техніки перевіряють, чи вдасться запустити когось із уламків.
sys_expe_found_ships_1_2: Ми знайшли покинуту піратську базу. У ангарі ще стоять кілька старих кораблів. Наші техніки перевіряють, чи придатні деякі з них.
sys_expe_found_ships_1_3: Наша експедиція знайшла планету, майже повністю знищену війнами. На орбіті дрейфували різні уламки кораблів. Техніки спробували відремонтувати деякі з них. Можливо, ми дізнаємося більше про те, що тут сталося.
sys_expe_found_ships_1_4: Експедиція натрапила на стару зоряну базу, яку, схоже, покинули цілу вічність тому. В ангарі фортеці знайшли кілька кораблів. Техніки зуміли знову підняти в повітря декого з них.
sys_expe_found_ships_2_1: Ми знайшли рештки армади. Техніки експедиції одразу перебралися на частково вцілілі кораблі й зуміли відремонтувати деякі з них.
sys_expe_found_ships_2_2: Наша експедиція виявила стару автоматичну верф, де кілька кораблів ще були на стадії виробництва. Після відновлення енергопостачання верфі наші техніки взялися добудовувати їх.
sys_expe_found_ships_3_1: Ми знайшли гігантський корабельний цвинтар. Кільком технікам експедиції вдалося повернути в стрій один-два кораблі.
sys_expe_found_ships_3_2: Ми відкрили планету із залишками цивілізації. З космосу також помітили ще одну гігантську корабельну станцію, що збереглася. Деякі наші техніки й пілоти спустилися на поверхню, щоб з'ясувати, чи вдасться повернути кілька кораблів.
sys_expe_found_ships_logbook_1: 'Запис із журналу механіка машинного відділення: якби ми взяли з собою ще кілька кораблів, було б легко відвести додому деяких із цих красенів!'
sys_expe_found_ships_logbook_2: 'Запис із журналу механіка машинного відділення: на жаль, у нас не вистачило місткості, щоб привезти назад усі кораблі, які ми знайшли під час цієї місії.'
sys_expe_found_ships_logbook_3: 'Запис із журналу механіка машинного відділення: на жаль, у нас недостатньо місткості, щоб забрати з собою всі знайдені кораблі.'
sys_expe_found_ships_nothing: Жодного корабля не знайдено.
sys_expe_lost_fleet_1: 'Від експедиції залишилося лише таке радіоповідомлення: Зззррт, о Боже!...Кррррззззт, зррртрзт бачить кргзззз так, як з Крззззззззтзззз...'
sys_expe_lost_fleet_2: Останнє, що ми отримали від експедиції, — неймовірно чіткі знімки чорної діри, що розкривається.
sys_expe_lost_fleet_3: Ядерний пробій на одному з командних кораблів призвів до ланцюгової реакції, яка знищила всю експедицію в ефектному вибуху.
sys_expe_lost_fleet_4: Експедиційний флот не повернувся зі свого гіперпросторового стрибка. Наші вчені досі ламають голови над тим, що могло статися, але флот, схоже, втрачено назавжди.
sys_expe_nothing_1: Ця експедиція не привезла нічого цікавого, окрім кількох кумедних звірят із невідомої болотяної планети.
sys_expe_nothing_2: Твоя експедиція зробила прекрасні знімки наднової. Утім, нових знань ця експедиція не принесла. Зате в неї хороші шанси виграти цьогорічний конкурс «Найкраще фото у всесвіті».
sys_expe_nothing_3: Дивний комп'ютерний вірус вивів з ладу навігацію одразу після виходу із сонячної системи. Через це весь експедиційний флот увесь час літав колами. Годі й казати, що експедиція вийшла не надто вдалою.
sys_expe_nothing_4: Форма життя з чистої енергії змусила всіх учасників експедиції кілька днів витріщатися на гіпнотичні символи на екранах. Коли більшість нарешті отямилася, експедицію довелося скасувати через брак дейтерію.
sys_expe_nothing_5: Ну, принаймні тепер ми знаємо, що червоні аномалії 5-го класу не лише хаотично впливають на системи корабля, а й можуть викликати в екіпажу масові галюцинації. На жаль, більше нічого під час цієї експедиції не виявлено.
sys_expe_nothing_6: Попри спочатку багатообіцяючі скани цього сектора, ми, на жаль, повернулися з порожніми руками.
sys_expe_nothing_7: Можливо, не варто було святкувати день народження капітана на цій віддаленій планеті. Злісна геморагічна лихоманка поклала більшість екіпажу в лазарет, а гострий брак персоналу зірвав експедицію.
sys_expe_nothing_8: Твоя експедиція не знайшла нічого, крім безмежної порожнечі космосу. Не було навіть маленького астероїда, радіації, частинок чи чогось іншого, що зробило б експедицію бодай трохи цікавою.
sys_expe_nothing_9: Збій реактора на командному кораблі ледь не знищив усю експедицію. На щастя, техніки виявилися на висоті й запобігли найгіршому. Проте ремонт забрав стільки часу, що експедиція повернулася ні з чим.
sys_expe_report: Звіт про експедицію
sys_expe_report_msg: 'Звіт про експедицію флоту з %s %s на %s:'
sys_expe_time_fast_1: Непередбачений зворотний зв'язок в енергетичних котушках рушійної системи прискорив повернення експедиції, і вона прибула раніше, ніж очікувалося. Перші звіти, втім, свідчать, що розповідати більше нема про що.
sys_expe_time_fast_2: Дещо відчайдушний новий командир скористався нестабільною червоточиною, щоб скоротити зворотний шлях, — і вдало! Проте сама експедиція не принесла нових знань.
sys_expe_time_fast_3: Твоя експедиція не виявила аномалій у дослідженому секторі. Проте під час повернення флот потрапив у сонячний вітер, який помітно прискорив політ. Тепер твоя експедиція повернеться додому дещо раніше, ніж очікувалося.
sys_expe_time_slow_1: Серйозна помилка штурмана закинула флот зовсім не туди. Зворотна дорога через це тривала значно довше.
sys_expe_time_slow_2: З досі невідомих причин стрибок флоту пішов цілком не так. Вони ледь не опинилися в серці зорі! На щастя, приземлилися в знайомій системі, але зворотний шлях триватиме довше, ніж планувалося.
sys_expe_time_slow_3: Новий навігаційний модуль, схоже, досі мучать баги. Експедиційний флот не лише полетів зовсім не в той бік, а ще й спалив увесь дейтерій! Розчарована експедиція тепер повертається на резервній потужності.
sys_expe_time_slow_4: Твоя експедиція увійшла в сектор із посиленими бурями частинок. Це перевантажило накопичувачі енергії, і головні системи всіх кораблів вийшли з ладу. Твоїм механікам вдалося запобігти найгіршому, але експедиція тепер повернеться зі значним запізненням.
sys_expe_time_slow_5: Флагман твого експедиційного флоту зіткнувся з кораблем прибульців, який без попередження вистрибнув прямо у флот. Корабель прибульців вибухнув, а флагман дуже постраждав. Коли завершаться найсерйозніші ремонти, твої кораблі розпочнуть зворотний шлях, адже в нинішньому стані експедиція продовжуватися не може.
sys_expe_time_slow_6: Зоряний вітер червоного гіганта спотворив стрибок експедиції, через що навігаційні системи цілком помилилися в розрахунку зворотного шляху. У результаті експедиція опинилася в безкрайній порожнечі між незнайомими зорями.
