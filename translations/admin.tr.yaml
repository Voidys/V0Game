se_userscripts_url_info: Oyununuz için userscript'leri anlatan sayfa (https://...), ayarlarda bağlanır. Boş = gizli.
se_bots_alliances_enabled: Botlar ittifak kurar
se_bots_alliances_enabled_info: 'Botlar kendi ittifaklarını kurar ve ara sıra başkalarına katılır. Kapalı: botlar yalnız kurt olarak kalır, hiçbir yere başvurmaz ve üye oldukları ittifaklardan ayrılır (bir botun kurduğu ittifaklar kalır).'
