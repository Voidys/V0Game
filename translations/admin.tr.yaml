se_bot_reply_delay_hours: Yanıt gecikmesi (saat)
se_bot_reply_delay_hours_info: Bir oyuncunun yanıtsız en eski özel mesajı, botların o oyuncunun bekleyen tüm mesajlarına tek yanıtta cevap vermeden önce kaç saat bekleyeceği. Aynı zamanda aynı oyuncuya bot tarafından başlatılan iki mesaj (saldırı tepkileri, baskın alaylarında) arasındaki en kısa aralıktır. 0 = gecikme yok.
se_bot_chatter: Botlar sohbet etsin
se_bot_chatter_info: 'Açık: botlar özel mesajlara yanıt verir. Kapalı: mesajlar yine okunur ve sayılır, ama yalnızca savaş tepkileri (kendilerine yazan bir oyuncuya saldırıldığında veya baskın yapıldığında) gönderilir. Botlar asla ilk yazmaz.'
