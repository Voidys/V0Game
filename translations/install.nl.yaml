ins_credits_head: Staan op de schouders van reuzen
ins_credits_text: 'V0Game zet een lange traditie van open-source browserspellen voort. Respect voor iedereen die dit eerder heeft gebouwd en in leven heeft gehouden:'
ins_credits_thanks: 'Dank aan alle programmeurs en beheerders die dit spel door de jaren heen hebben gebouwd en in leven gehouden, van 2Moons en SteemNova tot pr0game.'
ins_licence_note: Vrije software onder de GNU AGPL v3
ins_task_images: Afbeeldingen optimaliseren (WebP)
ins_db_help: V0Game slaat alles op in een MySQL- of MariaDB-database. Je vindt de onderstaande waarden in je hostingpaneel (zoek naar "Databases" of "MySQL") of bij degene die je server heeft ingericht. Als je MySQL zelf hebt geïnstalleerd, werken de standaardwaarden meestal.
ins_db_host: Databaseserver
ins_db_host_info: Bijna altijd "localhost". Sommige hosts geven een naam als "db1.example.com".
ins_db_name_info: De naam van de database voor het spel. Maak hem eerst aan in je hostingpaneel, of laat het installatieprogramma hem aanmaken (zie het vak hieronder).
ins_db_advanced: Geavanceerd (poort, tabelprefix, migratiewachtwoord) - meestal niet nodig
ins_db_prefix_info: Wordt voor elke tabelnaam geplaatst. Wijzig dit alleen als je één database deelt met andere software.
ins_db_migrationpw_info: Beschermt de updatepagina (install/?mode=upgrade) voor latere spelupdates. Laat leeg, dan maakt het installatieprogramma een sterk wachtwoord aan en toont het één keer op de laatste pagina.
ins_db_migrationpw_placeholder: wordt automatisch gegenereerd
ins_migrationpw_invalid: Het migratiewachtwoord mag geen aanhalingstekens, backslashes, $ of regeleindes bevatten.
ins_err_technical: technische details
ins_err_access_denied: De databaseserver heeft de gebruikersnaam of het wachtwoord geweigerd. Controleer beide op typefouten (hoofdletters tellen mee) in je hostingpaneel.
ins_err_unknown_db: Deze database bestaat niet op de server. Controleer de naam, of vink hieronder "De database aanmaken" aan.
ins_err_no_privilege: Deze databasegebruiker mag die database niet gebruiken. Geef de gebruiker in je hostingpaneel alle rechten erop.
ins_err_no_create: Deze gebruiker mag geen databases aanmaken. Maak in je hostingpaneel een lege database aan en vink "De database aanmaken" uit.
ins_err_socket: De socket van de databaseserver is niet gevonden. Probeer de host "127.0.0.1" in plaats van "localhost".
ins_err_unreachable: De databaseserver "%s" is niet bereikbaar. Controleer de hostnaam en poort, en of de databaseserver draait. Veel hosts staan alleen verbindingen toe vanaf hun eigen webservers, dus "localhost" is meestal goed.
ins_game_desc: Geef je spel een naam en kies hoe het speelt. Alles hier kun je later wijzigen in het beheer (Admin - Instellingen).
