install_desc: 'Om de installatietool in te schakelen, maak je het bestand "var/ENABLE_INSTALL_TOOL" aan.<br> De bestandsnaam is hoofdlettergevoelig en heeft geen bestandsextensie.<br> Het bestand mag leeg zijn.

