intro_text: 'V0Game is een open-source ruimtestrategiespel in de browser: bouw je planeten uit, doe onderzoek, stuur vloten en vecht tegelijk met honderden spelers.<br><br>Deze wizard zet stap voor stap een nieuwe installatie op: hij controleert je server, maakt verbinding met de database en maakt die aan, bouwt de tabellen, laat je je spel een naam geven en maakt de beheerder aan.'
intro_upgrade_head: V0Game al geïnstalleerd?
intro_upgrade_text: <p>V0Game is al geïnstalleerd en je wilt alleen bijwerken?</p><p>Je kunt je bestaande database hier in een paar klikken bijwerken!</p>
