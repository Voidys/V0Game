ins_registration_invalid: Onbekende registratie-instelling.
ins_bots: Computerspelers (bots)
ins_bots_info: 0 tot 50. Bots spelen als echte spelers met verschillende gewoontes, zodat een nieuw universum niet leeg is. 0 = geen bots.
ins_bots_invalid: Het aantal bots moet tussen 0 en 50 liggen.
ins_mail: E-mails versturen (registratie, wachtwoord resetten)
ins_mail_info: Standaard uit. Zet dit alleen aan als je server e-mail kan versturen; je kunt SMTP later instellen in Admin - Instellingen.
