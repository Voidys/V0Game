home_meme_alt: '{game_name} komuta güvertesinden çizgi roman memi'
home_meme_alt_deep_space_transit: 'Çizgi roman: bir mekikte iki öğrenci asker - biri asteroit alanını görünce çöküyor, diğeri parlayan bir bulutsuya sırıtıyor. “Sıradan sektör devriyeleri vs. keşfedilmemiş, kaynak dolu bir bulutsu bulmak.”'
home_meme_alt_deuterium_joyride: 'Çizgi roman: gözlem güvertesindeki yorgun bir komutan, dışarıda süzülen iki acemiyi izliyor - “Ben maden yükseltmelerim için 12 saat beklerken yeni acemilerin bütün Deuteriumlarını dışarıda gezintiye harcamasını izlemek.”'
home_meme_alt_enemy_fleet: 'Çizgi roman: alarmlar yanıp sönerken bir öğrenci asker panikle başını tutuyor - “1000 düşman muhribi geliyor mu?! Bu sektör güvenli sanıyordum!”'
home_meme_alt_fleet_decimated: 'Çizgi roman: şok geçirmiş bir asker, paramparça olmuş kubbenin dışında gemiler patlarken boş boş bakıyor - “20 saat kaynak topladıktan sonra ilk 3''teki bir oyuncunun filosu gelip her şeyi 3 saniyede dağıttığında.”'
home_meme_alt_solo_scouting: 'Çizgi roman: Komutan Kamioka sırıtıyor ve robot elini bir öğrencinin omzuna koyuyor - “Merak etme, öğrenci. Yüksek Komuta, uzaya yapacağın tek kişilik keşif görevine ‘tamamen’ güveniyor.”'
home_meme_alt_this_is_fine: 'Çizgi roman: uzay giysili bir köpek yanan komuta merkezinde sakince oturuyor ve “Bu iyi” diyor - “Merak etme. Filom sadece 4 saat geç dönüyor.”'
