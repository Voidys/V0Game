Achievement_text:
  '1': 你独自拥有整整一夜，却一发炮弹也没打中。
  '2': 你的舰队连续 90 天不间断地在飞行。
  '3': 你在语言设置为“法语”时损失了舰队。
  '4': 研究离子技术 10 级。
  '5': 研究引力子研究 2 级，只因为你可以。
  '6': 你的一次攻击只带回了 1 金属、1 晶体和 1 重氢。
  '7': 击败总计至少 10,000 艘的海盗或外星舰队。太空属于我们！
  '8': 参加 Stammtisch（每周二晚 8 点，在 Discord 上）。
  '9': 建造你的第一颗死星。
  '10': 摧毁一名玩家的月球。
  '11': 连续 14 天只用手机玩。
  '12': 你的舰队在首次远征中被黑洞吞没。
  '13': 在来袭的攻击落地前不到 5 秒时把舰队送走。
  '14': 有 10 支舰队被黑洞吞噬。虚空是饥饿的。
  '15': 在一颗星球上尝试 10 次仍没能造出月球。下次好运。
  '16': 你有超过 250 艘回收船空手而归。
  '17': 在一次建造中排入至少 5000 个导弹发射器。
  '18': 在 24 小时内，在同一颗星球上把 500 万重氢当燃料烧掉。
  '19': 研究装甲技术 3 级。
  '20': 研究装甲技术 6 级。
  '21': 研究装甲技术 9 级。
  '22': 研究装甲技术 12 级。
  '23': 研究装甲技术 15 级。
  '24': 研究激光技术 12 级。
  '25': 选择加入纪录。
  '26': 删除给你带来最多积分的那颗星球（至少 100,000 积分）。
  '27': 研究星际研究网络 1 级。
  '28': 把月球上的三个仓库都升到至少 3 级。
  '29': 用 5 人联合攻击“集体化”一名积分更高的玩家的舰队。
  '30': 独自击退一次 5 人联合攻击。
  '31': 用你的攻击把一名玩家送进假期模式。
  '32': 使用“扬帆起航”主题掠夺 1000 颗星球。啊哈！
  '33': 从假期模式回归。
  '34': 第一次被攻击。欢迎来到宇宙。
  '35': 攻击一名积分不足你 1/10 的活跃玩家。
  '36': '收到一条包含以下任一词语的消息：

    "Hurensohn"、"gleichstarke Ziele"、"gegen Schwächere"、"ehrenlos"'
  '37': 被一次 5 人联合攻击打得片甲不留。
  '38': 攻击你自己联盟的成员。有人想打友军吗？
  '39': 用恰好 42 艘舰船攻击某人。
  '40': 殖民一颗距离至少半个宇宙远的星球。
  '41': 因为一个糟糕的市场报价，让一个舰队栏位被占用一周。
  '42': 有 4 次以失败方身份进入战斗大厅。
  '43': 在你的账号被标记为不活跃时赢得一场战斗，战场是你的一颗星球，且此前曾有一支飞行时间超过 7 天的舰队抵达过那里。
  '44': 在一颗星球上，在能量低于 100% 的情况下持续生产某种资源超过 7 天。
  '45': 赢得一场对防御榜前 5 名玩家的攻击。
  '46': 通过发射星际导弹触发攻击限制保护。
  '47': 摧毁 5 个月球。
  '48': 在尝试摧毁月球时损失 5 颗死星。好痛。
  '49': 在殖民地建立后不久就把它拆掉。
  '50': 在拥有足够能量研究引力子技术的星球上，没有研究过引力子技术，却损失了该星球上所有的太阳能卫星。
  '51': 在浏览星系视图时耗光你所有的重氢。
  '52': 在没有先建造其他战斗舰船（轻型战斗机、重型战斗机、巡洋舰、战列舰、轰炸机、毁灭者或战列巡洋舰）的情况下建造死星。
  '53': 同时在 5 项研究中保持最高等级。
  '54': 掐准时间，让对一名活跃玩家的攻击在 1 月 1 日 00:00:00 落地。
  '55': 特殊成就
