sys_destruc_title: 'De volgende vloten staan tegenover elkaar voor een maanvernietiging:'
sys_expe_attack_1_1_1: Een wanhopige ruimtepiraat probeerde onze expeditievloot te kapen.
sys_expe_attack_1_1_2: Een paar primitieve barbaren vielen ons aan met ruimteschepen. Hun schepen waren in elk geval in een verschrikkelijke staat. Als hun vuurkracht een serieuze bedreiging was geweest, hadden we met onze eigen moeten antwoorden.
sys_expe_attack_1_1_3: We hebben een paar radioberichten van behoorlijk dronken piraten onderschept. We worden blijkbaar aangevallen.
sys_expe_attack_1_1_4: We moesten vechten tegen een paar piraten, maar gelukkig waren we ze in aantal de baas.
sys_expe_attack_1_1_5: Onze vloot meldt dat ene Moa Tikarr en zijn bemanning de onvoorwaardelijke overgave van onze vloot eisten. Als ze het menen, zullen ze merken dat we ons uitstekend kunnen verdedigen.
sys_expe_attack_1_2_1: Je expeditievloot had een onverwachte ontmoeting met een paar ruimtepiraten.
sys_expe_attack_1_2_2: We vlogen in een hinderlaag van een stel sterpiraten! Helaas was een gevecht onvermijdelijk.
sys_expe_attack_1_2_3: De noodoproep van een andere expeditievloot bleek een valstrik van sluwe piraten. Een gevecht was onvermijdelijk.
sys_expe_attack_1_3_1: De onderschepte signalen kwamen niet van onbekende aliens, maar van een geheime piratenbasis! De piraten waren niet erg blij met onze aanwezigheid in hun sector.
sys_expe_attack_1_3_2: De expeditievloot meldde hevige gevechten met niet-geïdentificeerde piratenschepen!
sys_expe_attack_1_3_3: 'We hebben zojuist een dringend bericht van de expeditiecommandant ontvangen: "Ze komen op ons af! Ze sprongen uit de hyperruimte, gelukkig zijn het maar piraten, dus we maken een kans, we vechten!"'
sys_expe_attack_2_1_1: Je expeditievloot had een onvriendelijk eerste contact met een onbekende soort.
sys_expe_attack_2_1_2: Een paar vreemde schepen hebben de expeditievloot zonder waarschuwing aangevallen!
sys_expe_attack_2_1_3: Onze expeditie werd aangevallen door een kleine groep niet-geïdentificeerde ruimtevaartuigen!
sys_expe_attack_2_1_4: De expeditievloot meldt contact met onbekende schepen. De radioberichten kunnen niet worden ontcijferd, maar de vreemde schepen lijken hun wapens op te laden.
sys_expe_attack_2_2_1: Een onbekende soort valt onze expeditie aan!
sys_expe_attack_2_2_2: Je expeditievloot heeft blijkbaar het grondgebied geschonden van een tot nu toe onbekend maar zeer agressief buitenaards ras.
sys_expe_attack_2_2_3: De verbinding met onze expeditievloot werd abrupt verbroken. Het laatste wat we hoorden, was dat de vloot zwaar onder vuur lag. De aanvallers konden niet worden geïdentificeerd.
sys_expe_attack_2_3_1: Je expeditie is een buitenaardse invasievloot tegengekomen en meldt massale gevechten!
sys_expe_attack_2_3_2: Een grote groep kristallijnen schepen van onbekende oorsprong zit op directe botsingskoers met onze expeditievloot. We moeten ons op het ergste voorbereiden.
sys_expe_attack_2_3_3: We hadden wat moeite om het dialect van het buitenaardse ras goed uit te spreken. Onze diplomaat riep per ongeluk 'Vuur!' in plaats van 'Vrede!'
sys_expe_attackname_1: Piraten
sys_expe_attackname_2: Aliens
