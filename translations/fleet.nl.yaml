sys_destruc_echec: 'Aardbevingen deden de planeet schudden, maar er ging iets mis: de Sterren des Doods ontploften en vielen uiteen in duizend stukken, en de schokgolven namen de hele vloot mee.'
sys_destruc_lune: 'Kans om de maan te vernietigen: %d%%'
sys_destruc_mess1: De Sterren des Doods vuurden hun enorme energie af op de maan.
sys_destruc_null: De Sterren des Doods konden niet volledig opladen voordat ze vuurden.<br> De maan is niet vernietigd.
sys_destruc_reussi: De stralen van de Sterren des Doods bereikten de maan en scheurden hem aan stukken. <br>De hele maan is vernietigd!
