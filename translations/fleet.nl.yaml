sys_expe_back_home_ress: Hij levert %s %s, %s %s en %s %s af.
sys_expe_back_home_ships_flound: 'De volgende schepen werden gevonden:'
sys_expe_back_home_ships_lost: 'De volgende schepen gingen verloren:'
sys_expe_depleted_max_1: 'Aantekening uit het logboek van de communicatieofficier: Als we ons ooit onveilig voelen, kunnen we altijd de krachten bundelen met de andere expedities die hier rondvliegen.'
sys_expe_depleted_max_2: 'Aantekening uit het logboek van de communicatieofficier: Als dit zo doorgaat, moeten we navigatieboeien plaatsen om al dit verkeer aan te kunnen.'
sys_expe_depleted_max_3: 'Aantekening uit het logboek van de communicatieofficier: Misschien is het nuttiger om hier een souvenirwinkel te openen dan weer een expeditie te sturen.'
sys_expe_depleted_med_1: 'Aantekening uit het logboek van de communicatieofficier: We vonden sporen van meerdere expeditievloten in de buurt. We keren terug naar huis.'
sys_expe_depleted_med_2: 'Aantekening uit het logboek van de communicatieofficier: We hebben vriendelijk radiocontact gelegd met een paar andere expedities in deze sector.'
sys_expe_depleted_med_3: 'Aantekening uit het logboek van de communicatieofficier: We hebben het einde van de expeditie gevierd met de bemanning van een andere expeditievloot in dezelfde sector. Zij hebben ook niets nieuws te melden.'
sys_expe_depleted_min_1: 'Aantekening uit het logboek van de communicatieofficier: Het lijkt erop dat mensen al eens in dit deel van de melkweg zijn geweest.'
sys_expe_depleted_min_2: 'Aantekening uit het logboek van de communicatieofficier: We vonden brokstukken van oude ruimteschepen. We zijn niet de eersten hier.'
sys_expe_depleted_min_3: 'Aantekening uit het logboek van de communicatieofficier: We zijn bijna in botsing gekomen met een andere expeditievloot. Ik had nooit gedacht dat er hier nog iemand zou zijn.'
sys_expe_depleted_not_1: 'Aantekening uit het logboek van de communicatieofficier: Dit deel van het universum lijkt nog niet verkend te zijn.'
sys_expe_depleted_not_2: 'Aantekening uit het logboek van de communicatieofficier: Wat een geweldig gevoel om als eersten door een onontdekte sector te reizen.'
sys_expe_feqeuence_few: Meer dan 10 expedities in de afgelopen 24 uur
sys_expe_feqeuence_many: Meer dan 50 expedities in de afgelopen 24 uur
sys_expe_feqeuence_medium: Meer dan 25 expedities in de afgelopen 24 uur
sys_expe_found_goods: '%s %s zijn gewonnen.'
sys_expe_found_ress_1_1: Je expeditie heeft een kleine asteroïdecluster ontdekt waaruit wat grondstoffen konden worden gewonnen.
sys_expe_found_ress_1_2: Op een afgelegen planetoïde werden meerdere makkelijk bereikbare grondstofvelden gevonden en er werden met succes grondstoffen gewonnen.
sys_expe_found_ress_1_3: Je expeditie stuitte op zeer oude wrakken van ruimteschepen uit een lang vervlogen gevecht. Afzonderlijke onderdelen konden worden geborgen en gerecycled.
sys_expe_found_ress_1_4: De expeditie ontdekte een door straling verontreinigde planeet met een zeer giftige atmosfeer. Scans toonden echter aan dat deze planeet veel grondstoffen bevat. Geautomatiseerde drones werden ingezet om zoveel mogelijk grondstoffen te winnen.
sys_expe_found_ress_2_1: 'Je expeditie vond een eeuwenoud vrachtschipconvooi dat volledig geladen maar verlaten was. Er konden wat grondstoffen worden buitgemaakt. '
sys_expe_found_ress_2_2: Je expeditie vond grote grondstofafzettingen op een kleine maan met een eigen atmosfeer. De bemanning is momenteel bezig deze schat te winnen.
sys_expe_found_ress_2_3: We zijn een klein convooi van burgerschepen tegengekomen dat dringend voedsel en medicijnen nodig had. In ruil daarvoor kregen we een flinke hoeveelheid nuttige grondstoffen.
sys_expe_found_ress_3_1: Je expeditievloot meldt de ontdekking van een enorm buitenaards scheepswrak. Hoewel ze niets met de technologie konden beginnen, kon het schip worden gesloopt tot afzonderlijke onderdelen, wat waardevolle grondstoffen opleverde.
sys_expe_found_ress_3_2: De asteroïdengordel rond een onbekende planeet bevatte enorme hoeveelheden grondstoffen. De expeditievloot vulde zijn opslagruimtes!
sys_expe_found_ress_logbook_1: 'Aantekening uit het logboek van de eerste officier: We hebben elk beetje vrije ruimte gebruikt, maar we konden toch niet alle gevonden grondstoffen meenemen.'
sys_expe_found_ress_logbook_2: 'Aantekening uit het logboek van de eerste officier: Hadden we maar een paar vrachtschepen meer! Nu moeten we een hoop grondstoffen achterlaten.'
sys_expe_found_ress_logbook_3: 'Aantekening uit het logboek van de eerste officier: We hebben alles overboord gegooid wat we niet meer nodig hebben, maar we kunnen nog steeds niet genoeg ruimte maken voor alle gevonden grondstoffen.'
sys_expe_found_ress_logbook_4: 'Aantekening uit het logboek van de eerste officier: Zelfs toen we de kantine en alle lounges tot opslagruimtes ombouwden, konden we nog steeds niet alle gevonden grondstoffen vervoeren.'
sys_expe_found_ships_1_1: We hebben de resten van een eerdere expeditie ontdekt! Onze technici controleren of ze een paar van de wrakken weer aan de praat kunnen krijgen.
sys_expe_found_ships_1_2: We hebben een verlaten piratenbasis gevonden. Een paar oude schepen staan nog in de hangar. Onze technici controleren of sommige schepen nog bruikbaar zijn.
sys_expe_found_ships_1_3: Onze expeditie vond een planeet die bijna volledig door oorlogen verwoest was. In de baan dreven verschillende scheepswrakken. De technici probeerden er een paar te repareren. Misschien komen we meer te weten over wat hier is gebeurd.
sys_expe_found_ships_1_4: De expeditie stuitte op een oude sterbasis die al een eeuwigheid verlaten lijkt. In de hangar van het fort stonden een paar schepen. De technici kregen er een paar weer aan het vliegen.
sys_expe_found_ships_2_1: We hebben de resten van een armada gevonden. De technici van de expeditie zijn meteen aan boord gegaan van de deels intacte schepen en konden er een aantal repareren.
sys_expe_found_ships_2_2: Onze expeditie ontdekte een oude automatische scheepswerf waar nog een paar schepen in de productiefase stonden. Nadat de energievoorziening van de werf was hersteld, werkten onze technici aan de voltooiing ervan.
sys_expe_found_ships_3_1: We hebben een gigantisch scheepskerkhof gevonden. Een paar technici van de expeditie hebben een of twee schepen weer in gebruik kunnen nemen.
sys_expe_found_ships_3_2: We hebben een planeet ontdekt met resten van een beschaving. Vanuit de ruimte is nog een gigantisch, intact scheepsstation gespot. Een paar van onze technici en piloten zijn naar het oppervlak gegaan om vast te stellen of een paar van de schepen kunnen worden teruggehaald.
sys_expe_found_ships_logbook_1: 'Aantekening uit het logboek van de machinekamerofficier: Als we een paar schepen meer hadden meegenomen, hadden we makkelijk een paar van die schoonheden mee naar huis kunnen nemen!'
sys_expe_found_ships_logbook_2: 'Aantekening uit het logboek van de machinekamerofficier: Helaas hadden we niet de capaciteit om alle schepen die we tijdens deze missie ontdekten mee terug te nemen.'
sys_expe_found_ships_logbook_3: 'Aantekening uit het logboek van de machinekamerofficier: Helaas hebben we niet genoeg capaciteit om alle gevonden schepen mee terug te nemen.'
sys_expe_found_ships_nothing: Er konden geen schepen worden gevonden.
sys_expe_lost_fleet_1: 'Het enige wat van de expeditie rest, is het volgende radiobericht: Zzzrrt o God!...Krrrzzzzt de zrrrtrzt ziet krgzzzz ja van hoe Krzzzzzzzztzzzz...'
sys_expe_lost_fleet_2: Het laatste wat we van de expeditie ontvingen, waren een paar ongelooflijk goede close-ups van een opengaand zwart gat.
sys_expe_lost_fleet_3: Een kernlek op een van de commandoschepen leidde tot een kettingreactie die de hele expeditie in een spectaculaire explosie vernietigde.
sys_expe_lost_fleet_4: De expeditievloot is niet teruggekeerd van hun hyperruimtesprong. Onze wetenschappers breken zich nog het hoofd over wat er gebeurd kan zijn, maar de vloot lijkt voorgoed verloren.
sys_expe_nothing_1: Deze expeditie brengt niets spannends mee, behalve een paar nieuwsgierige diertjes van een onbekende moerasplaneet.
sys_expe_nothing_2: Je expeditie maakte prachtige foto's van een supernova. Echt nieuwe inzichten leverde deze expeditie echter niet op. Maar de kans is groot dat hij dit jaar de wedstrijd om Beste Foto van het Universum wint.
sys_expe_nothing_3: Een vreemd computervirus legde de navigatie lam kort nadat het zonnestelsel was verlaten. Daardoor vloog de hele expeditievloot de hele tijd rondjes. Onnodig te zeggen dat de expeditie niet bijzonder succesvol was.
sys_expe_nothing_4: Een levensvorm van pure energie liet alle expeditieleden dagenlang naar hypnotiserende symbolen op hun schermen staren. Toen de meesten eindelijk weer helder waren, moest de expeditie worden afgebroken vanwege een tekort aan deuterium.
sys_expe_nothing_5: Nou, we weten nu in elk geval dat rode anomalieën van klasse 5 niet alleen chaotische effecten hebben op de systemen van het schip, maar ook massale hallucinaties bij de bemanning kunnen veroorzaken. Helaas is er op deze expeditie verder niets ontdekt.
sys_expe_nothing_6: Ondanks de aanvankelijk veelbelovende scans van deze sector kwamen we helaas met lege handen terug.
sys_expe_nothing_7: Misschien had de verjaardag van de kapitein niet op deze afgelegen planeet gevierd moeten worden. Een nare bloedingskoorts stuurde het grootste deel van de bemanning naar de ziekenboeg, en het acute personeelstekort deed de expeditie mislukken.
sys_expe_nothing_8: Je expeditie heeft niets gevonden dan de uitgestrekte leegte van de ruimte. Er was zelfs geen asteroïdje, straling of deeltjes, of wat dan ook waardoor deze expeditie een beetje spannend had kunnen zijn.
sys_expe_nothing_9: Een reactorstoring op het commandoschip heeft bijna de hele expeditie vernietigd. Gelukkig waren de technici meer dan bekwaam en konden ze het ergste voorkomen. De reparatie kostte echter zoveel tijd dat de expeditie terugkeerde zonder iets te hebben bereikt.
sys_expe_report: Expeditierapport
sys_expe_report_msg: 'Expeditierapport van de vloot van %s %s bij %s:'
sys_expe_time_fast_1: Een onverwachte terugkoppelingslus in de energiespoelen van de aandrijving versnelde de terugkeer van de expeditie, waardoor die eerder aankwam dan verwacht. Eerste rapporten wijzen er echter op dat er verder niets te melden valt.
sys_expe_time_fast_2: De nogal gedurfde nieuwe commandant gebruikte een instabiel wormgat om de terugreis te verkorten - met succes! De expeditie zelf leverde echter geen nieuwe inzichten op.
sys_expe_time_fast_3: Je expeditie meldde geen afwijkingen in de verkende sector. Tijdens de terugvlucht kwam de vloot echter een zonnewind tegen, die de reis aanzienlijk versnelde. Je expeditie keert nu iets eerder dan verwacht terug naar huis.
sys_expe_time_slow_1: Een ernstige blunder van de navigator zette de vloot op een heel verkeerde plek af. De terugreis duurde daardoor aanzienlijk langer.
sys_expe_time_slow_2: Om nog onbekende redenen ging de sprong van de vloot compleet mis. Ze kwamen bijna midden in een ster terecht! Gelukkig belandden ze in een bekend stelsel, maar de terugreis duurt langer dan oorspronkelijk gepland.
sys_expe_time_slow_3: De nieuwe navigatiemodule lijkt nog steeds last te hebben van wat bugs. De expeditievloot vloog niet alleen helemaal de verkeerde kant op, maar verbruikte ook al zijn deuterium! Teleurgesteld keert de expeditie nu terug op reservevermogen.
sys_expe_time_slow_4: Je expeditie vloog een sector in met verhevigde deeltjesstormen. Daardoor raakten de energieopslagsystemen overbelast en vielen de hoofdsystemen van alle schepen uit. Je monteurs konden het ergste voorkomen, maar de expeditie keert nu met aanzienlijke vertraging terug.
sys_expe_time_slow_5: Het vlaggenschip van je expeditievloot botste tegen een buitenaards vaartuig dat zonder waarschuwing rechtstreeks de vloot in sprong. Het buitenaardse schip ontplofte en de schade aan het vlaggenschip was aanzienlijk. Zodra de ergste reparaties klaar zijn, beginnen je schepen aan hun terugreis, want in de huidige staat kan de expeditie niet doorgaan.
sys_expe_time_slow_6: De sterrenwind van een rode reus verstoorde de sprong van de expeditie, waardoor de navigatiesystemen de terugreis volledig verkeerd berekenden. Daardoor bevindt de expeditie zich in de uitgestrekte leegte tussen onbekende sterren.
