  A 0. és 1. szinten csak a többi játékos összpontszámát látod. A 2. szinttől
  az épületpontjaikat is, a 4. szinttől a kutatási pontjaikat. A 6. szinttől a
  hajó- és védelmi pontjaikat is látod, valamint a csatastatisztikáikat.
