tutorial_text:
  step0: "Willkommen bei {game_name}!<br><br>\r\nDieses kurze Tutorial zeigt dir die Grundlagen.<br>\r\nWir verlinken oft auf unser Wiki, weil nicht alles in ein Tutorial passt. Du erreichst es jederzeit über das Menü links.<br>\r\nDu kannst das Tutorial jederzeit überspringen, aber später nicht neu starten.<br><br>\r\nViel Erfolg, Imperator!"
  step1: "Dein Ziel: so viele Punkte wie möglich. Du bekommst einen Punkt für je 1.000 ausgegebene Rohstoffe, und die beste Quelle dafür sind deine eigenen Minen.<br>\r\nSorge zuerst für deine Grundversorgung: Du brauchst Metall und Kristall aus den Minen sowie Energie aus dem Solarkraftwerk, damit sie laufen. Reicht die Energie nicht, produzieren deine Minen weniger als 100 %.<br>\r\nBaue diese Gebäude im Menü <b>Gebäude</b> aus. Klick auf den Namen eines Gebäudes, um zu sehen, was die nächste Stufe bringt und wie viel Energie sie verbraucht.<br><br>\r\nMehr dazu findest du im <b>Wiki</b>: \r\n<a href=\"{wiki_url}/wiki/Rohstoffe\" target=\"_blank\">Rohstoffproduktion</a>"
  step2: "Zusammen spielt es sich besser. Die meisten Spieler treffen sich auf unserem Discord: Dort bekommst du Antworten auf deine Fragen und findest Mitspieler.<br>\r\nKommst du nicht weiter? Hier kannst du auch ein Support-Ticket eröffnen."
  step3: "Andere Spieler zu überfallen ist eine weitere Möglichkeit, an Rohstoffe zu kommen – und das kann auch dir passieren. Bau dir also deine erste Verteidigung!<br>\r\nSchon eine kleine Verteidigung schützt deine Produktion über Nacht.<br><br>\r\nEntscheidend ist nicht nur die Masse; auch die Zusammensetzung der angreifenden Flotte zählt.<br>\r\nAngreifer müssen erst an deiner Verteidigung vorbei, bevor sie plündern können. Jedes Schiff, das sie dafür mitschicken müssen, schmälert ihren Gewinn und kann sie weitere Schiffe kosten.<br>\r\nVerteidigungsanlagen baust du in der <b>Raumschiffwerft</b> im Tab <b>Verteidigung</b>. Dafür brauchst du eine Raumschiffwerft (die wiederum eine Roboterfabrik voraussetzt) und etwas Deuterium.<br><br>\r\nDen passenden Wiki-Artikel findest du hier: \r\n<a href=\"{wiki_url}/wiki/Verteidigung\" target=\"_blank\">Verteidigungsanlagen</a>"
  step4: "Halte den Nachschub am Laufen und baue deine Minen aus!<br>\r\nGebäude, Schiffe, Verteidigung und Forschung werden mit der Zeit teurer, deine Produktion muss also mitwachsen. Öffne jetzt „Gebäude“ und baue deine Minen aus, sobald du die Rohstoffe dafür hast."
  step5: "Bau dir einen Kleinen Transporter!<br>\r\nKleine Transporter sind schnelle, praktische Frachter.<br>\r\nMit Impulstriebwerk sind sie auf langen Strecken schneller als der Große Transporter.<br>\r\nDamit verschiebst du Rohstoffe zwischen deinen Planeten, handelst mit anderen Spielern oder überfällst sie.<br><br>\r\nMehr im Wiki: \r\n<a href=\"{wiki_url}/wiki/Schiffe\" target=\"_blank\">Schiffe</a>"
  step6: "Gib deinem Planeten einen Namen, damit du den Überblick behältst. Klicke dazu in der Übersicht auf den Planetennamen in der Kopfzeile der Punkteanzeige. Probier es gleich aus.<br><br>\r\nDu kannst außerdem Buddyanfragen an andere Spieler schicken. Sobald sie annehmen, könnt ihr leichter kommunizieren und seht gegenseitig euren Onlinestatus. Dafür müsst ihr nicht in derselben Allianz sein. Buddys können außerdem Flotten auf den Planeten des anderen halten, sodass ihr auch ohne Allianz gemeinsam verteidigen könnt.<br><br>\r\nOder tritt einer Allianz bei und spielt im Team. Für das Halten von Flotten braucht ihr dann keine eigenen Buddyanfragen mehr. In der Allianz könnt ihr Rundnachrichten verschicken und – je nach Allianzrang – Onlinestatus und Punktestand der anderen Mitglieder sehen."
  step7: "Um herauszufinden, welche Rohstoffe, Gebäude, Forschungen, Schiffe und Verteidigung ein anderer Spieler hat, musst du ihn ausspionieren. Schicke dafür über das Flottenmenü oder die Galaxieansicht eine Spionagesonde zu ihm.<br>\r\nBedenke: Andere Spieler können dich genauso ausspionieren!"
  step8: >-
    Eine Expedition kann Rohstoffe, Schiffe, besondere Ereignisse oder Verluste
    bringen. Zum Ausprobieren nimmst du ein Schiff, wählst im Flottenmenü
    Planetenposition 16 als Ziel und den Auftrag „Expedition“.<br>

    Jeder Schiffstyp erhöht die Größe deiner Expeditionsflotte, bis die maximale
    Ereignisgröße erreicht ist.<br><br>

    Im Wiki steht, was du ändern kannst, um deinen Gewinn zu maximieren: 

    <a href="{wiki_url}/wiki/Expoanleitung"
    target="_blank">Expeditionen</a>
  step9: "Je mehr Planeten du kolonisierst, desto schneller wächst du: Du kannst auf mehreren Planeten gleichzeitig Rohstoffe produzieren und Schiffe bauen. Beachte, dass du nur mit ausreichend hoher Astrophysik am inneren oder äußeren Rand eines Systems siedeln kannst. Das Kolonieschiff selbst lässt sich ohne Astrophysik bauen, aber für deine erste Kolonie brauchst du sie!<br><br>\r\nKolonien im eigenen oder direkt im Nachbarsystem halten die Transportwege kurz. Der Nachteil: Später im Spiel setzen manche Spieler eine Kolonie in dein System, nicht wegen der Minen, sondern als vorübergehende Flottenbasis – eine sogenannte Raidkolo.<br><br>\r\nMehr im Wiki: \r\n<a href=\"{wiki_url}/wiki/Astrophysik\" target=\"_blank\">Astrophysik</a>"
  step10: "Willst du schneller an Rohstoffe kommen? Greife andere Spieler an. Wäge Kosten und Nutzen ab, damit sich dein Angriff lohnt, und plane ihn mit Spionageberichten und dem Kampfsimulator.<br><br>\r\nVorsicht! Andere Spieler können viele Flottenmissionen auf verschiedene Arten verfolgen.<br>\r\nDeine hart erarbeitete Flotte nicht zu verlieren, gehört zu den wichtigsten Dingen im Spiel.<br><br>\r\nLies dir deshalb unbedingt diese Wiki-Themen durch: \r\n<a href=\"{wiki_url}/wiki/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Saven</a> - \r\n<a href=\"{wiki_url}/wiki/Sensorenphalanx\" target=\"_blank\">Sensorenphalanx</a>"
  step10_u6: >-
    Willst du schneller an Rohstoffe kommen? Greife andere Spieler an. Wäge
    Kosten und Nutzen ab, damit sich dein Angriff lohnt, und plane ihn mit
    Spionageberichten und dem Kampfsimulator.<br><br>

    Vorsicht! Andere Spieler können viele Flottenmissionen auf verschiedene
    Arten verfolgen.<br>

    Deine hart erarbeitete Flotte nicht zu verlieren, gehört zu den wichtigsten
    Dingen im Spiel.<br><br>

    Lies dir deshalb unbedingt diese Wiki-Themen durch:

    <a
    href="{wiki_url}/wiki/Slippys_progame_flottensicherung_leitfaden"
    target="_blank">Saven</a>
  step11: "Wenn Flotten zerstört werden, hinterlassen sie ein Trümmerfeld, das du abbauen kannst. Dafür brauchst du Recycler mit je 20.000 Ladekapazität. Eine große Flotte auszulöschen kann eine lukrative Rohstoffquelle sein.<br><br>\r\nRecycler kannst du auch direkt in der Galaxieansicht per Klick auf ein Trümmerfeld losschicken, statt das Flottenmenü zu benutzen."
  step12: "Glückwunsch, du hast das Tutorial geschafft!<br><br>\r\nDas Spiel hat noch viel mehr zu bieten.<br>\r\nZum Beispiel gibt es grob drei Spielstile, die sich auch im Zeitaufwand unterscheiden:<br>\r\n<ul>\r\n<li>Miner: baut Minen auf vielen Kolonien aus und fliegt hauptsächlich Transporter</li>\r\n<li>Fleeter: steckt die meisten Punkte in Kampfschiffe, produziert kaum selbst und lebt vom Überfallen anderer Spieler</li>\r\n<li>Comber: eine Mischung aus beidem</li>\r\n</ul>\r\nMonde werden später im Spiel wichtig, und die Sensorenphalanx solltest du inzwischen kennengelernt haben.<br><br>\r\nNoch Fragen? Lies im Wiki nach oder frag die Community auf Discord."
  step12_u6: >-
    Glückwunsch, du hast das Tutorial geschafft!<br><br>

    Das Spiel hat noch viel mehr zu bieten.<br>

    Zum Beispiel gibt es grob drei Spielstile, die sich auch im Zeitaufwand
    unterscheiden:<br>

    <ul>

    <li>Miner: baut Minen auf vielen Kolonien aus und fliegt hauptsächlich
    Transporter</li>

    <li>Fleeter: steckt die meisten Punkte in Kampfschiffe, produziert kaum
    selbst und lebt vom Überfallen anderer Spieler</li>

    <li>Comber: eine Mischung aus beidem</li>

    </ul>

    Noch Fragen? Lies im Wiki nach oder frag die Community auf Discord.
tutorial_title:
  step0: Willkommen, Imperator!
  step1: Ran an die Minen!
  step2: Komm mal unter Leute!
  step3: Stell dich nicht nackt auf eine Lichtung!
  step4: Denk voraus!
  step5: Schiffe, wir brauchen Schiffe!
  step6: Gib deinem Planeten einen Namen und finde Freunde!
  step7: Sieh nach, was die anderen haben!
  step8: Ab ins Unbekannte!
  step9: Ein Planet ist nie genug!
  step10: Keine Lust mehr, auf deine Minen zu warten?
  step11: Spiel doch mal Müllmann!
  step12: Geschafft!
