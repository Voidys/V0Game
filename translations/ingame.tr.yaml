Achievement_text:
  '1': 'Aynı gece gece yarısı ile sabah 6 arasında 5 saldırının ulaşmasını sağla ve hiçbirini kazanma.'
  '2': 90 gün boyunca durmadan hareket halinde filolarının oldu.
  '3': Dilin “Fransızca” iken filonu kaybettin.
  '4': İyon Tekniğini 10. seviyeye araştır.
  '5': Gravitasyon Araştırmasını 2. seviyeye araştır, sırf yapabildiğin için.
  '6': Saldırılarından biri sadece 1 metal, 1 kristal ve 1 deuterium ile döndü.
  '7': Toplamda en az 10.000 gemiden oluşan bir korsan ya da uzaylı filosunu yen. Uzay bizim!
  '8': Strammtisch'e katıl (Salı günleri akşam 8'de Discord'da).
  '9': İlk Ölüm Yıldızını inşa et.
  '10': Bir oyuncunun ayını yok et.
  '11': 14 gün boyunca yalnızca telefondan oyna.
  '12': İlk keşif seferinde filon bir kara delik tarafından yok edildi.
  '13': Gelen bir saldırının varmasına 5 saniyeden az kalmışken filonu uzağa gönder.
  '14': 10 filoyu kara deliklere kaybet. Boşluk aç.
  '15': 'En yüksek ay şansıyla girdiğin 10 savaşta ilk ayını elde edemeyeceksin.'
  '16': 250'den fazla Geri Dönüşümcün boş döndü.
  '17': Tek bir inşa emrinde en az 5000 Roketatar sıraya al.
  '18': 24 saat içinde tek bir gezegende yakıt olarak 5 milyon deuterium yak.
  '19': Zırhlandırma Tekniğini 3. seviyeye araştır.
  '20': Zırhlandırma Tekniğini 6. seviyeye araştır.
  '21': Zırhlandırma Tekniğini 9. seviyeye araştır.
  '22': Zırhlandırma Tekniğini 12. seviyeye araştır.
  '23': Zırhlandırma Tekniğini 15. seviyeye araştır.
  '24': Lazer Tekniğini 12. seviyeye araştır.
  '25': Rekorlara katılmayı seç.
  '26': Sana en çok puan kazandıran gezegeni sil (en az 100.000 puan).
  '27': Galaksilerarası Araştırma Ağını 1. seviyeye araştır.
  '28': Bir aydaki üç depoyu da en az 3. seviyeye yükselt.
  '29': Puanı daha yüksek bir oyuncunun filosunu 5 kişilik bir İSS ile yok et.
  '30': 5 kişilik bir İSS saldırısını tek başına püskürt.
  '31': Saldırınla bir oyuncuyu tatil moduna gönder.
  '32': “SetSail” temasını kullanırken 1000 gezegene baskın yap. Arr!
  '33': Tatil modundan dön.
  '34': İlk kez saldırıya uğra. Evrene hoş geldin.
  '35': Puanının 1/10'undan azına sahip aktif bir oyuncuya saldır.
  '36': 'Şu ifadelerden birini içeren bir mesaj al:

    "Hurensohn", "gleichstarke Ziele", "gegen Schwächere", "ehrenlos"'
  '37': 5 kişilik bir İSS tarafından yok edil.
  '38': Kendi ittifak üyelerine saldır. Dost ateşi, kimse?
  '39': Tam 42 gemiyle birine saldır.
  '40': En az yarım evren uzaklıktaki bir gezegeni kolonileştir.
  '41': Kötü bir pazar teklifiyle bir filo yuvasını bir hafta boyunca meşgul et.
  '42': Savaş Salonu'na 4 kez kaybeden tarafta gir.
  '43': 'Hesabın Pasif olarak işaretliyken bir savaş kazan;

    bu savaş, daha önce uçuş süresi 7 günden fazla olan bir filonun vardığı gezegenlerinden birinde olmalı.'
  '44': Bir gezegende 7 günden uzun süre %100'ün altında enerjiyle bir kaynak üret.
  '45': Savunmada ilk 5'te olan bir oyuncuya karşı saldırı kazan.
  '46': Gezegenlerarası roketler fırlatarak bash korumasını tetikle.
  '47': 5 ay yok et.
  '48': Ayları yok etmeye çalışırken 5 Ölüm Yıldızı kaybet. Eyvah.
  '49': Bir kolonini kurulduktan kısa süre sonra yık.
  '50': 'Gravitasyon Araştırmasını yapmak için yeterli enerjisi olan bir gezegende, Gravitasyon Araştırmasını yapmadan

    tüm solar uydularını kaybet.'
  '51': Galaksi görünümünde gezinirken tüm deuteriumunu harca.
  '52': Önce başka savaş gemisi (Hafif Avcı, Ağır Avcı, Kruvazör, Komuta Gemisi, Bombardıman Gemisi, Muhrip ya da Fırkateyn) inşa etmeden bir Ölüm Yıldızı inşa et.
  '53': Aynı anda 5 araştırmada en yüksek seviyede ol.
  '54': Aktif bir oyuncuya yapılan saldırıyı 01.01. 00:00:00'da varacak şekilde zamanla.
  '55': Özel Başarım
