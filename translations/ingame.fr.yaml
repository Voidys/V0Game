op_activate_vacation_mode_descrip: Le mode vacances te protège lors d'absences prolongées. Il ne peut être activé que si aucune de tes flottes n'est en mouvement. Une fois actif, il te protège des nouvelles attaques. Les attaques déjà lancées se poursuivent toutefois, et les flottes amies qui stationnent chez toi seront renvoyées ! La production de ressources, les constructions de bâtiments, les commandes du chantier spatial et les recherches sont suspendues pendant ce temps et reprennent ensuite. Le mode vacances ne peut pas être désactivé pendant les 48 premières heures !
