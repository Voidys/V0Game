Achievement_text:
  '1': 'Fais atterrir 5 de tes attaques entre minuit et 6 h du matin dans une même nuit sans en gagner aucune.'
  '2': Tes flottes ont été en mouvement sans interruption pendant 90 jours.
  '3': Tu as perdu ta flotte alors que ta langue était réglée sur « Français ».
  '4': Rechercher la technologie Ion niveau 10.
  '5': Rechercher la technologie Graviton niveau 2, juste parce qu'on le peut.
  '6': Une de tes attaques est revenue avec seulement 1 métal, 1 cristal et 1 deutérium.
  '7': Vaincre une flotte pirate ou extraterrestre totalisant au moins 10 000 vaisseaux. L'espace est à nous !
  '8': Passer au Stammtisch (le mardi à 20 h sur Discord).
  '9': Construire ta première Étoile de la mort.
  '10': Détruire la lune d'un joueur.
  '11': Jouer 14 jours exclusivement sur mobile.
  '12': Ta flotte a été détruite par un trou noir lors de ta première expédition.
  '13': Envoyer ta flotte en vol à moins de 5 secondes de l'impact d'une attaque entrante.
  '14': Perdre 10 flottes dans des trous noirs. Le vide a faim.
  '15': 'Rater l''obtention de ta première lune en 10 combats avec la chance de lune maximale.'
  '16': Plus de 250 de tes recycleurs sont revenus à vide.
  '17': Mettre en file au moins 5 000 lanceurs de missiles dans un seul ordre de construction.
  '18': Brûler 5 millions de deutérium en carburant sur une seule planète en 24 heures.
  '19': Rechercher la technologie Blindage niveau 3.
  '20': Rechercher la technologie Blindage niveau 6.
  '21': Rechercher la technologie Blindage niveau 9.
  '22': Rechercher la technologie Blindage niveau 12.
  '23': Rechercher la technologie Blindage niveau 15.
  '24': Rechercher la technologie Laser niveau 12.
  '25': Participer aux Records (opt-in).
  '26': Supprimer la planète qui te rapporte le plus de points (au moins 100 000 points).
  '27': Rechercher le Réseau de recherche intergalactique niveau 1.
  '28': Améliorer les trois hangars d'une lune au moins au niveau 3.
  '29': Collectiviser la flotte d'un joueur mieux classé avec une attaque groupée de 5 joueurs.
  '30': Repousser seul une attaque groupée de 5 joueurs.
  '31': Envoyer un joueur en mode vacances grâce à ton attaque.
  '32': Raider 1 000 planètes avec le thème « SetSail ». Arr !
  '33': Revenir du mode vacances.
  '34': Se faire attaquer pour la première fois. Bienvenue dans l'univers.
  '35': Attaquer un joueur actif qui a moins d'un dixième de tes points.
  '36': "Recevoir un message contenant l'un des éléments suivants :\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Se faire anéantir par une attaque groupée de 5 joueurs.
  '38': Attaquer des membres de sa propre alliance. Tir ami, quelqu'un ?
  '39': Attaquer quelqu'un avec exactement 42 vaisseaux.
  '40': Coloniser une planète située à au moins la moitié de l'univers de distance.
  '41': Bloquer un slot de flotte pendant une semaine avec une mauvaise offre sur le marché.
  '42': Se retrouver 4 fois dans le Hall des batailles du côté des perdants.
  '43': Gagner un combat alors que ton compte est marqué comme inactif, sur l'une de tes planètes où une flotte est arrivée après un temps de vol de plus de 7 jours.
  '44': Produire une ressource sur une planète pendant plus de 7 jours avec une énergie inférieure à 100 %.
  '45': Gagner une attaque contre un joueur du top 5 de la défense.
  '46': Déclencher la protection anti-bash en tirant des missiles interplanétaires.
  '47': Détruire 5 lunes.
  '48': Perdre 5 Étoiles de la mort en tentant de détruire des lunes. Aïe.
  '49': Démolir une colonie peu après sa création.
  '50': Perdre tous tes satellites solaires sur une planète disposant d'assez d'énergie pour rechercher la technologie Graviton, sans avoir recherché la technologie Graviton.
  '51': Épuiser tout ton deutérium en parcourant la vue Galaxie.
  '52': Construire une Étoile de la mort sans avoir d'abord construit d'autres vaisseaux de combat (chasseur léger, chasseur lourd, croiseur, vaisseau de bataille, bombardier, destructeur ou traqueur).
  '53': Détenir le niveau le plus élevé dans 5 recherches en même temps.
  '54': Caler une attaque sur un joueur actif pour qu'elle arrive le 01/01 à 00:00:00.
  '55': Succès spécial
  '56': 'Atteins le niveau 15 du réacteur à hyperespace.'
  '57': 'Atteins le niveau 15 de l''astrophysique.'
  '58': 'Recherche chaque technologie (sauf Graviton) au moins une fois.'
  '59': 'Amène chaque recherche (sauf Graviton) au niveau 10.'
  '60': 'Possède 1 000 000 000 d''une seule ressource sur une planète ou une lune.'
  '61': 'Possède 1000 satellites solaires en même temps sur une planète.'
  '62': 'Construis sur chaque case d''une planète d''au moins 250 cases.'
  '63': 'Amène les hangars de métal, de cristal et de deutérium au niveau 15 sur une planète.'
  '64': 'Possède une mine de métal de niveau 30 ou plus sur 9 planètes.'
  '65': 'Lance un seul ordre de construction de plus de 30 jours.'
  '66': 'Fais acheter 50 de tes offres du marché par d''autres joueurs.'
  '67': 'Gagne une défense contre des attaquants valant au moins 10 fois ta flotte et ta défense (attaquants d''au moins 1 000 000 de ressources).'
  '68': 'Gagne une attaque qui détruit au moins 1000 unités ennemies sans perdre la moindre unité.'
  '69': 'Termine un combat par un match nul après le nombre maximal de rounds, chaque camp perdant au moins 10 000 unités.'
  '70': 'Subis une attaque sur une planète sans vaisseaux ni défense, de sorte que l''attaquant ne pille rien.'
  '71': 'Obtiens une lune lors d''un combat qui n''avait que 1 % de chance de lune.'
  '72': 'Détruis au moins 100 unités de défense avec une seule attaque de missiles interplanétaires.'
  '73': 'Détruis au moins 100 sondes d''espionnage ennemies lors d''un combat sur ta planète.'
  '74': 'Pille 1 000 000 000 de ressources au total.'
  '75': 'Recycle 1 000 000 000 de ressources au total.'
  '76': 'Répare 1000 vaisseaux à partir de champs de ruines au total.'
  '77': 'Gagne 1000 points d''honneur.'
  '78': 'Deviens hors-la-loi pour la première fois.'
  '79': 'Participe en tant qu''attaquant à 25 attaques groupées gagnées.'
  '80': 'Vis chaque issue d''expédition possible au moins une fois.'
  '81': 'Envoie 1000 expéditions.'
  '82': 'Gagne un combat d''expédition contre une grande flotte alien.'
  '83': 'Trouve de grandes quantités de ressources lors de 50 expéditions.'
  '84': 'Envoie une flotte pour un vol aller de plus de 24 heures.'
  '85': 'Fais arriver une flotte à destination un 29 février.'
  '86': 'Perds toute une flotte d''attaque un vendredi 13.'
  '87': 'Fais atterrir deux de tes attaques (hors attaque groupée) sur la même cible à la même seconde.'
  '88': 'Aie en même temps des flottes en route vers chaque galaxie de l''univers.'
  '89': 'Termine le tutoriel.'
  '90': 'Aie en même temps des pactes actifs avec 3 autres alliances (tous les membres de l''alliance l''obtiennent).'
  '91': 'Crée 5 pages wiki d''alliance.'
  '92': 'Aie 10 demandes d''ami acceptées.'
  '93': 'Sois numéro 1 du classement des points totaux pendant 7 jours consécutifs.'
  '94': 'Possède 100 Étoiles de la mort en même temps sur une planète ou une lune.'
  '95': 'Occupe tous les emplacements de planète permis par ton astrophysique (au moins 9), chaque planète avec au moins 200 cases.'
  '96': 'Possède 50 autres succès.'
