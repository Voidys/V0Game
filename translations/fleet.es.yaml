sys_destruc_echec: 'Temblores sacuden la luna, pero algo sale mal: las Estrellas de la muerte explotan y se hacen pedazos, y las ondas expansivas destruyen toda la flota.'
sys_destruc_lune: 'Probabilidad de destruir la luna: %d%%'
sys_destruc_mess1: Las Estrellas de la muerte han disparado su descomunal energía contra la luna.
sys_destruc_null: Las Estrellas de la muerte no han podido cargarse del todo antes de disparar.<br> La luna no ha sido destruida.
sys_destruc_reussi: Los rayos de las Estrellas de la muerte han alcanzado la luna y la han despedazado. <br>¡La luna ha quedado completamente destruida!
