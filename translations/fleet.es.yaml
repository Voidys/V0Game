sys_destruc_title: 'Las siguientes flotas se enfrentan para destruir una luna:'
sys_expe_attack_1_1_1: Un pirata espacial desesperado ha intentado apoderarse de nuestra flota de expedición.
sys_expe_attack_1_1_2: Unos bárbaros primitivos nos han atacado con naves espaciales, por llamarlas de alguna manera. Si su potencia de fuego llega a ser una amenaza seria, tendremos que responder con la nuestra.
sys_expe_attack_1_1_3: Hemos interceptado un par de mensajes de radio de unos piratas muy borrachos. Parece que nos van a atacar.
sys_expe_attack_1_1_4: Hemos tenido que luchar contra unos piratas, pero por suerte les superábamos en número.
sys_expe_attack_1_1_5: Nuestra flota informa de que un tal Moa Tikarr y su tripulación han exigido la rendición incondicional. Si van en serio, descubrirán que sabemos defendernos muy bien.
sys_expe_attack_1_2_1: Tu flota de expedición ha tenido un encuentro imprevisto con unos piratas espaciales.
sys_expe_attack_1_2_2: ¡Hemos caído en una emboscada de unos piratas estelares! Por desgracia, no se pudo evitar el combate.
sys_expe_attack_1_2_3: La petición de auxilio de otra flota de expedición resultó ser una trampa de unos piratas astutos. El combate fue inevitable.
sys_expe_attack_1_3_1: Las señales interceptadas no venían de alienígenas desconocidos, ¡sino de una base pirata secreta! Los piratas no se alegraron nada de nuestra presencia en su sector.
sys_expe_attack_1_3_2: La flota de expedición informa de combates intensos con naves piratas no identificadas.
sys_expe_attack_1_3_3: 'Acabamos de recibir un mensaje urgente del comandante de la expedición: «¡Vienen a por nosotros! Han salido del hiperespacio. Por suerte solo son piratas, así que tenemos una oportunidad: ¡lucharemos!»'
sys_expe_attack_2_1_1: Tu flota de expedición ha tenido un primer contacto poco amistoso con una especie desconocida.
sys_expe_attack_2_1_2: ¡Unas naves extrañas han atacado a la flota de expedición sin previo aviso!
sys_expe_attack_2_1_3: ¡Nuestra expedición fue atacada por un pequeño grupo de naves desconocidas!
sys_expe_attack_2_1_4: La flota de expedición informa de contacto con naves desconocidas. No se pueden descifrar los mensajes de radio, pero las naves extrañas parecen estar cargando sus armas.
sys_expe_attack_2_2_1: ¡Una especie desconocida ataca a nuestra expedición!
sys_expe_attack_2_2_2: Al parecer, tu flota de expedición ha violado el territorio de una raza alienígena hasta ahora desconocida pero muy agresiva.
sys_expe_attack_2_2_3: Se ha cortado de golpe la conexión con nuestra flota de expedición. Lo último que supimos es que la flota recibía fuego intenso. No se ha podido identificar a los atacantes.
sys_expe_attack_2_3_1: ¡Tu expedición se ha topado con una flota de invasión alienígena y informa de combates masivos!
sys_expe_attack_2_3_2: Un gran grupo de naves cristalinas de origen desconocido va en rumbo de colisión directo con nuestra flota de expedición. Hay que prepararse para lo peor.
sys_expe_attack_2_3_3: Tuvimos algo de dificultad para pronunciar bien el dialecto de la raza alienígena. Nuestro diplomático gritó sin querer «¡Fuego!» en lugar de «¡Paz!».
sys_expe_attackname_1: Piratas
sys_expe_attackname_2: Alienígenas
