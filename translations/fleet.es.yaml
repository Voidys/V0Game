sys_expe_back_home_ress: Trae %s %s, %s %s y %s %s.
sys_expe_back_home_ships_flound: 'Se han encontrado las siguientes naves:'
sys_expe_back_home_ships_lost: 'Se han perdido las siguientes naves:'
sys_expe_depleted_max_1: 'Entrada del diario del oficial de comunicaciones: Si alguna vez nos sentimos inseguros, siempre podemos unir fuerzas con las otras expediciones que vuelan por aquí.'
sys_expe_depleted_max_2: 'Entrada del diario del oficial de comunicaciones: Si esto sigue así, tendremos que instalar boyas de navegación para gestionar tanto tráfico.'
sys_expe_depleted_max_3: 'Entrada del diario del oficial de comunicaciones: Quizá sería más útil abrir aquí una tienda de recuerdos que enviar otra expedición más.'
sys_expe_depleted_med_1: 'Entrada del diario del oficial de comunicaciones: Hemos encontrado señales de varias flotas de expedición en la zona. Volvemos a casa.'
sys_expe_depleted_med_2: 'Entrada del diario del oficial de comunicaciones: Hemos establecido contacto de radio amistoso con otras expediciones de este sector.'
sys_expe_depleted_med_3: 'Entrada del diario del oficial de comunicaciones: Hemos celebrado el final de la expedición con la tripulación de otra flota de expedición que viajaba por el mismo sector. Tampoco tienen nada nuevo que contar.'
sys_expe_depleted_min_1: 'Entrada del diario del oficial de comunicaciones: Parece que ya ha habido humanos antes en esta parte de la galaxia.'
sys_expe_depleted_min_2: 'Entrada del diario del oficial de comunicaciones: Hemos encontrado restos de naves antiguas. No somos los primeros en llegar.'
sys_expe_depleted_min_3: 'Entrada del diario del oficial de comunicaciones: Casi chocamos con otra flota de expedición. Nunca pensé que hubiera nadie más por aquí.'
sys_expe_depleted_not_1: 'Entrada del diario del oficial de comunicaciones: Parece que esta parte del universo aún no ha sido explorada.'
sys_expe_depleted_not_2: 'Entrada del diario del oficial de comunicaciones: Da gusto ser los primeros en cruzar un sector inexplorado.'
sys_expe_feqeuence_few: Más de 10 expediciones en las últimas 24 horas
sys_expe_feqeuence_many: Más de 50 expediciones en las últimas 24 horas
sys_expe_feqeuence_medium: Más de 25 expediciones en las últimas 24 horas
sys_expe_found_goods: Se han extraído %s %s.
sys_expe_found_ress_1_1: Tu expedición ha descubierto un pequeño cúmulo de asteroides del que se han podido extraer algunos recursos.
sys_expe_found_ress_1_2: En un planetoide remoto se han encontrado varios campos de recursos de fácil acceso y se han extraído materias primas con éxito.
sys_expe_found_ress_1_3: Tu expedición ha dado con restos de naves muy antiguas de una batalla lejana. Se han podido recuperar y reciclar algunos componentes.
sys_expe_found_ress_1_4: La expedición ha descubierto un planeta contaminado por radiación y con una atmósfera muy tóxica. Sin embargo, los escáneres mostraron que contiene muchas materias primas. Se enviaron drones automáticos para extraer todos los recursos posibles.
sys_expe_found_ress_2_1: 'Tu expedición ha encontrado un antiguo convoy de carga, lleno pero abandonado. Se han podido obtener algunos recursos. '
sys_expe_found_ress_2_2: Tu expedición ha encontrado grandes yacimientos de materias primas en una pequeña luna con atmósfera propia. La tripulación está extrayendo ese tesoro ahora mismo.
sys_expe_found_ress_2_3: Nos hemos cruzado con un pequeño convoy de naves civiles que necesitaba con urgencia alimentos y medicinas. A cambio, hemos recibido una buena cantidad de recursos útiles.
sys_expe_found_ress_3_1: Tu flota de expedición informa del descubrimiento de un enorme naufragio alienígena. Aunque no pudieron hacer nada con su tecnología, la nave se pudo desmontar en piezas sueltas y se obtuvieron valiosas materias primas.
sys_expe_found_ress_3_2: El cinturón de asteroides de un planeta desconocido contenía enormes cantidades de materias primas. ¡La flota de expedición ha llenado sus bodegas!
sys_expe_found_ress_logbook_1: 'Entrada del diario del primer oficial: Hemos aprovechado hasta el último rincón libre, pero aun así no hemos podido llevarnos todos los recursos que encontramos.'
sys_expe_found_ress_logbook_2: 'Entrada del diario del primer oficial: ¡Si tuviéramos unos cuantos cargueros más! Ahora tendremos que dejar atrás montones de recursos.'
sys_expe_found_ress_logbook_3: 'Entrada del diario del primer oficial: Ya hemos tirado todo lo que no necesitamos, pero aun así no conseguimos hacer sitio para todos los recursos que hemos encontrado.'
sys_expe_found_ress_logbook_4: 'Entrada del diario del primer oficial: Incluso después de convertir la cafetería y todas las salas de descanso en bodegas, no hemos podido transportar todos los recursos que encontramos.'
sys_expe_found_ships_1_1: ¡Hemos descubierto los restos de una expedición anterior! Nuestros técnicos están comprobando si pueden volver a poner en marcha algunos de los restos.
sys_expe_found_ships_1_2: Hemos encontrado una base pirata abandonada. En el hangar todavía hay algunas naves viejas. Nuestros técnicos están comprobando si siguen siendo utilizables.
sys_expe_found_ships_1_3: Nuestra expedición ha encontrado un planeta casi completamente arrasado por las guerras. En órbita flotaban varios restos de naves. Los técnicos intentaron reparar algunos. Quizá podamos averiguar más de lo que pasó aquí.
sys_expe_found_ships_1_4: La expedición ha dado con una vieja base estelar que parece abandonada desde hace una eternidad. En el hangar de la fortaleza se han encontrado algunas naves. Los técnicos han conseguido que algunas vuelvan a volar.
sys_expe_found_ships_2_1: Hemos encontrado los restos de una armada. Los técnicos de la expedición subieron enseguida a las naves, en parte intactas, y han conseguido reparar algunas.
sys_expe_found_ships_2_2: Nuestra expedición ha descubierto un viejo astillero automático con algunas naves todavía en fase de producción. Tras restablecer el suministro de energía del astillero, nuestros técnicos se pusieron manos a la obra para terminarlas.
sys_expe_found_ships_3_1: Hemos encontrado un gigantesco cementerio de naves. Algunos técnicos de la expedición han conseguido poner en marcha una o dos naves de nuevo.
sys_expe_found_ships_3_2: Hemos descubierto un planeta con restos de una civilización. Desde el espacio se ha divisado otra gigantesca estación de naves que sigue intacta. Algunos de nuestros técnicos y pilotos han bajado a la superficie para ver si se pueden recuperar un par de naves.
sys_expe_found_ships_logbook_1: 'Entrada del diario del oficial de máquinas: Si hubiéramos traído algunas naves más, ¡habría sido fácil llevarnos a casa unas cuantas de esas bellezas!'
sys_expe_found_ships_logbook_2: 'Entrada del diario del oficial de máquinas: Por desgracia, no teníamos capacidad para traer de vuelta todas las naves que descubrimos en esta misión.'
sys_expe_found_ships_logbook_3: 'Entrada del diario del oficial de máquinas: Por desgracia, no tenemos capacidad suficiente para traer de vuelta todas las naves que hemos encontrado.'
sys_expe_found_ships_nothing: No se ha encontrado ninguna nave.
sys_expe_lost_fleet_1: 'Lo único que queda de la expedición es el siguiente mensaje de radio: ¡Zzzrrt, oh Dios!... Krrrzzzzt el zrrrtrzt ve krgzzzz sí, cómo Krzzzzzzzztzzzz...'
sys_expe_lost_fleet_2: Lo último que recibimos de la expedición fueron unos primeros planos increíbles de un agujero negro que se abría.
sys_expe_lost_fleet_3: Una fuga nuclear en una de las naves de mando provocó una reacción en cadena que destruyó toda la expedición en una explosión espectacular.
sys_expe_lost_fleet_4: La flota de expedición no ha vuelto de su salto hiperespacial. Nuestros científicos siguen sin entender qué ha podido pasar, pero la flota parece perdida para siempre.
sys_expe_nothing_1: Esta expedición no trae nada emocionante, salvo unos curiosos animalillos de un planeta pantanoso desconocido.
sys_expe_nothing_2: Tu expedición ha tomado unas fotos preciosas de una supernova. Aun así, no ha aportado ningún descubrimiento nuevo. Pero tiene muchas papeletas de ganar este año el concurso a la Mejor Imagen del Universo.
sys_expe_nothing_3: Un extraño virus informático dejó inutilizada la navegación poco después de salir del sistema solar. Como resultado, toda la flota de expedición estuvo volando en círculos todo el tiempo. Ni que decir tiene que la expedición no tuvo mucho éxito.
sys_expe_nothing_4: Una forma de vida de pura energía hizo que todos los miembros de la expedición se quedaran mirando durante varios días unos símbolos hipnóticos en sus pantallas. Cuando por fin la mayoría recuperó la claridad, la expedición tuvo que cancelarse por falta de deuterio.
sys_expe_nothing_5: Bueno, al menos ahora sabemos que las anomalías rojas de clase 5 no solo tienen efectos caóticos en los sistemas de la nave, sino que también pueden provocar alucinaciones masivas en la tripulación. Por desgracia, no se descubrió nada más en esta expedición.
sys_expe_nothing_6: A pesar de que los escáneres de este sector parecían prometedores, por desgracia hemos vuelto con las manos vacías.
sys_expe_nothing_7: Quizá no debimos celebrar el cumpleaños del capitán en este planeta remoto. Una desagradable fiebre hemorrágica mandó a la enfermería a gran parte de la tripulación, y la falta aguda de personal hizo fracasar la expedición.
sys_expe_nothing_8: Tu expedición no ha encontrado más que el inmenso vacío del espacio. Ni siquiera había un asteroide, radiación, partículas o cualquier otra cosa que hiciera la expedición un poco emocionante.
sys_expe_nothing_9: Un fallo del reactor de la nave de mando estuvo a punto de destruir toda la expedición. Por suerte, los técnicos fueron más que competentes y evitaron lo peor. Sin embargo, la reparación llevó tanto tiempo que la expedición volvió sin haber conseguido nada.
sys_expe_report: Informe de expedición
sys_expe_report_msg: 'Informe de expedición de la flota de %s %s en %s:'
sys_expe_time_fast_1: Un bucle de retroalimentación imprevisto en las bobinas de energía del sistema de propulsión aceleró el regreso de la expedición, que llega antes de lo esperado. Los primeros informes indican, sin embargo, que no hay nada más que contar.
sys_expe_time_fast_2: El nuevo comandante, algo temerario, usó un agujero de gusano inestable para acortar el viaje de vuelta, ¡y le salió bien! Eso sí, la expedición en sí no aportó ningún descubrimiento nuevo.
sys_expe_time_fast_3: Tu expedición no informó de anomalías en el sector explorado. Sin embargo, durante el vuelo de regreso la flota se topó con un viento solar que aceleró el trayecto de forma notable. Tu expedición volverá a casa algo antes de lo previsto.
sys_expe_time_slow_1: Un grave error del navegador dejó a la flota en un lugar completamente equivocado. Como consecuencia, el viaje de vuelta duró bastante más.
sys_expe_time_slow_2: Por razones aún desconocidas, el salto de la flota salió del todo mal. ¡Casi acaban en el corazón de una estrella! Por suerte aterrizaron en un sistema conocido, pero el viaje de vuelta durará más de lo previsto.
sys_expe_time_slow_3: El nuevo módulo de navegación parece seguir plagado de errores. La flota de expedición no solo voló en dirección completamente equivocada, ¡sino que además consumió todo su deuterio! Decepcionada, la expedición regresa ahora con la energía de reserva.
sys_expe_time_slow_4: Tu expedición entró en un sector con tormentas de partículas intensificadas. Esto sobrecargó los sistemas de almacenamiento de energía y los sistemas principales de todas las naves fallaron. Tus mecánicos lograron evitar lo peor, pero la expedición volverá con un retraso considerable.
sys_expe_time_slow_5: La nave insignia de tu flota de expedición chocó con una nave alienígena que saltó sin previo aviso justo encima de la flota. La nave alienígena explotó y los daños en la insignia fueron considerables. Cuando terminen las reparaciones más graves, tus naves emprenderán el regreso, porque la expedición no puede continuar en este estado.
sys_expe_time_slow_6: El viento estelar de una gigante roja distorsionó el salto de la expedición y los sistemas de navegación calcularon del todo mal el viaje de vuelta. Como resultado, la expedición se encuentra en el inmenso vacío entre estrellas desconocidas.
