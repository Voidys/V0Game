intro_text: 'V0Game è un gioco di strategia spaziale open source nel browser: fai crescere i tuoi pianeti, ricerca nuove tecnologie, invia flotte e sfida centinaia di giocatori contemporaneamente.<br><br>Questa procedura guidata configura una nuova installazione passo dopo passo: controlla il tuo server, si collega al database e lo crea, genera le tabelle, ti lascia dare un nome al tuo gioco e crea l''amministratore.'
