install_desc: >-
  Per attivare lo strumento di installazione, crea il file
  "var/ENABLE_INSTALL_TOOL".<br> Il nome del file distingue maiuscole e
  minuscole e non ha estensione.<br> Il file può essere vuoto.

  Viene eliminato automaticamente a installazione completata, oppure se ha più
  di un'ora.
