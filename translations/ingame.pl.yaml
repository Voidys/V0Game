Achievement_text:
  '1': 'Spraw, by 5 twoich ataków wylądowało między północą a 6 rano w jedną noc, nie wygrywając żadnego.'
  '2': Przez 90 dni bez przerwy miałeś floty w ruchu.
  '3': Straciłeś flotę, gdy językiem gry był „francuski”.
  '4': Zbadaj Technologię Jonową 10.
  '5': Zbadaj Rozwój Grawitonów 2, tylko dlatego, że możesz.
  '6': Jeden z twoich ataków wrócił z zaledwie 1 metalem, 1 kryształem i 1 deuterium.
  '7': Pokonaj flotę piratów lub obcych liczącą łącznie co najmniej 10 000 statków. Kosmos jest nasz!
  '8': Pojaw się na Strammtisch (wtorki o 20:00 na Discordzie).
  '9': Zbuduj swoją pierwszą Gwiazdę Śmierci.
  '10': Zniszcz księżyc gracza.
  '11': Graj przez 14 dni wyłącznie na telefonie komórkowym.
  '12': Twoja flota została zniszczona przez czarną dziurę podczas pierwszej ekspedycji.
  '13': Wyślij flotę w drogę, gdy do uderzenia nadlatującego ataku zostało mniej niż 5 sekund.
  '14': Strać 10 flot w czarnych dziurach. Pustka jest głodna.
  '15': 'Nie zdobądź swojego pierwszego księżyca w 10 walkach przy maksymalnej szansie na księżyc.'
  '16': Ponad 250 twoich recyklerów wróciło puste.
  '17': Zleć w jednym zamówieniu budowy co najmniej 5000 Wyrzutni Rakiet.
  '18': Spal 5 milionów deuterium jako paliwo na jednej planecie w ciągu 24 godzin.
  '19': Zbadaj Technologię Opancerzenia 3.
  '20': Zbadaj Technologię Opancerzenia 6.
  '21': Zbadaj Technologię Opancerzenia 9.
  '22': Zbadaj Technologię Opancerzenia 12.
  '23': Zbadaj Technologię Opancerzenia 15.
  '24': Zbadaj Technologię Laserową 12.
  '25': Włącz udział w rekordach.
  '26': Usuń planetę, która daje ci najwięcej punktów (co najmniej 100 000 punktów).
  '27': Zbadaj Międzygalaktyczną Sieć Badań 1.
  '28': Rozbuduj wszystkie trzy magazyny na księżycu do co najmniej poziomu 3.
  '29': Skolektywizuj flotę gracza z wyższym wynikiem za pomocą 5-osobowego AKS.
  '30': Odeprzyj 5-osobowy AKS zupełnie sam.
  '31': Wyślij gracza w tryb urlopowy swoim atakiem.
  '32': Napadnij 1000 planet, korzystając z motywu „SetSail”. Arr!
  '33': Wróć z trybu urlopowego.
  '34': Zostań zaatakowany po raz pierwszy. Witaj w uniwersum.
  '35': Zaatakuj aktywnego gracza, który ma mniej niż 1/10 twoich punktów.
  '36': "Otrzymaj wiadomość zawierającą jeden z następujących fragmentów:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Zostań rozgromiony przez 5-osobowy AKS.
  '38': Zaatakuj członków własnego sojuszu. Ogień przyjacielski, ktoś chętny?
  '39': Zaatakuj kogoś, kto ma dokładnie 42 statki.
  '40': Skolonizuj planetę oddaloną o co najmniej pół uniwersum.
  '41': Zablokuj slot floty na tydzień kiepską ofertą na rynku.
  '42': Trafij 4 razy do Hali Bitew po stronie przegranych.
  '43': "Wygraj bitwę, gdy twoje konto jest oznaczone jako nieaktywne,\r\n            na jednej z twoich planet, do której wcześniej dotarła flota o czasie lotu dłuższym niż 7 dni."
  '44': Produkuj surowiec na planecie przez ponad 7 dni przy energii poniżej 100%.
  '45': Wygraj atak na gracza z pierwszej piątki w obronie.
  '46': Uruchom ochronę przed bashingiem, wystrzeliwując rakiety międzyplanetarne.
  '47': Zniszcz 5 księżyców.
  '48': Strać 5 Gwiazd Śmierci podczas prób zniszczenia księżyców. Auć.
  '49': Zniszcz kolonię krótko po jej założeniu.
  '50': "Strać wszystkie satelity słoneczne na planecie z wystarczającą ilością\r\n            energii do zbadania Rozwoju Grawitonów, nie mając zbadanego Rozwoju Grawitonów."
  '51': Zużyj całe deuterium podczas przeglądania widoku Galaktyki.
  '52': Zbuduj Gwiazdę Śmierci, nie budując wcześniej innych okrętów bojowych (Lekki Myśliwiec, Ciężki Myśliwiec, Krążownik, Okręt Wojenny, Bombowiec, Niszczyciel lub Pancernik).
  '53': Miej najwyższy poziom w 5 badaniach jednocześnie.
  '54': Zgraj atak na aktywnego gracza tak, żeby uderzył 01.01. o 00:00:00.
  '55': Osiągnięcie specjalne
  '56': 'Osiągnij 15. poziom napędu nadprzestrzennego.'
  '57': 'Osiągnij 15. poziom astrofizyki.'
  '58': 'Zbadaj każdą technologię (poza grawitonem) co najmniej raz.'
  '59': 'Wybadaj każde badanie (poza grawitonem) do poziomu 10.'
  '60': 'Zgromadź 1 000 000 000 jednego surowca na jednej planecie lub księżycu.'
  '61': 'Miej jednocześnie 1000 satelitów słonecznych na jednej planecie.'
  '62': 'Zabuduj każde pole planety mającej co najmniej 250 pól.'
  '63': 'Rozbuduj magazyny metalu, kryształu i deuteru do poziomu 15 na jednej planecie.'
  '64': 'Miej na 9 planetach kopalnię metalu poziomu 30 lub wyższego.'
  '65': 'Zleć jedno zlecenie budowy trwające dłużej niż 30 dni.'
  '66': 'Spraw, by inni gracze kupili 50 twoich ofert z targowiska.'
  '67': 'Wygraj obronę przeciwko atakującym wartym co najmniej 10 razy więcej niż twoja flota i obrona (atakujący warci co najmniej 1 000 000 surowców).'
  '68': 'Wygraj atak, w którym zniszczysz co najmniej 1000 jednostek wroga, nie tracąc żadnej jednostki.'
  '69': 'Zakończ walkę remisem po maksymalnej liczbie rund, a każda strona niech straci co najmniej 10 000 jednostek.'
  '70': 'Zostań zaatakowany na planecie bez statków i obrony, tak że atakujący niczego nie zrabuje.'
  '71': 'Zdobądź księżyc z walki, która miała tylko 1 % szansy na księżyc.'
  '72': 'Zniszcz jednym atakiem rakiet międzyplanetarnych co najmniej 100 jednostek obrony.'
  '73': 'Zniszcz w jednej walce na swojej planecie co najmniej 100 wrogich sond szpiegowskich.'
  '74': 'Zrabuj łącznie 1 000 000 000 surowców.'
  '75': 'Przetwórz łącznie 1 000 000 000 surowców.'
  '76': 'Napraw łącznie 1000 statków z pól zniszczeń.'
  '77': 'Zdobądź 1000 punktów honoru.'
  '78': 'Zostań po raz pierwszy banitą.'
  '79': 'Weź udział jako atakujący w 25 wygranych atakach zespołowych.'
  '80': 'Przeżyj każdy możliwy wynik wyprawy co najmniej raz.'
  '81': 'Wyślij 1000 wypraw.'
  '82': 'Wygraj walkę podczas wyprawy z dużą flotą obcych.'
  '83': 'Znajdź duże ilości surowców podczas 50 wypraw.'
  '84': 'Wyślij flotę w lot w jedną stronę trwający ponad 24 godziny.'
  '85': 'Spraw, by flota dotarła do celu 29 lutego.'
  '86': 'Strać całą flotę atakującą w piątek trzynastego.'
  '87': 'Spraw, by dwa twoje ataki (poza zespołowym) wylądowały na tym samym celu w tej samej sekundzie.'
  '88': 'Miej jednocześnie floty lecące do każdej galaktyki wszechświata.'
  '89': 'Ukończ samouczek.'
  '90': 'Miej jednocześnie aktywne pakty z 3 innymi sojuszami (dostają go wszyscy członkowie sojuszu).'
  '91': 'Utwórz 5 stron wiki sojuszu.'
  '92': 'Miej 10 przyjętych zaproszeń do znajomych.'
  '93': 'Bądź numerem 1 w rankingu punktów ogółem przez 7 dni z rzędu.'
  '94': 'Miej jednocześnie 100 Gwiazd Śmierci na jednej planecie lub księżycu.'
  '95': 'Zajmij każdy slot planety, na który pozwala twoja astrofizyka (co najmniej 9), każda planeta z co najmniej 200 polami.'
  '96': 'Zdobądź 50 innych osiągnięć.'
