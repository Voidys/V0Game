Achievement_text:
  '1': You had a whole night to yourself and didn't land a single shot.
  '2': You had fleets in motion non-stop for 90 days.
  '3': 'You lost your fleet while your language was set to "French".'
  '4': Research Ion Technology 10.
  '5': Research Graviton Research 2, just because you can.
  '6': One of your attacks came back with just 1 metal, 1 crystal and 1 deuterium.
  '7': 'Defeat a fleet of pirate or alien ships totaling at least 10,000 ships. Space is ours!'
  '8': Show up to the Strammtisch (Tuesdays at 8 pm on Discord).
  '9': Build your first Death Star.
  '10': Destroy a player's moon.
  '11': Play 14 days exclusively on mobile.
  '12': Your fleet was destroyed by a black hole during your first expedition.
  '13': Send your fleet away with less than 5 seconds left before an incoming attack lands.
  '14': Lose 10 fleets to black holes. The void is hungry.
  '15': Fail to create a moon at a planet after 10 tries. Better luck next time.
  '16': More than 250 of your recyclers came back empty.
  '17': Queue at least 5000 Missile Launchers in a single build order.
  '18': Burn 5 million deuterium as fuel on a single planet within 24 hours.
  '19': Research Armour Technology 3.
  '20': Research Armour Technology 6.
  '21': Research Armour Technology 9.
  '22': Research Armour Technology 12.
  '23': Research Armour Technology 15.
  '24': Research Laser Technology 12.
  '25': Opt in to Records.
  '26': Delete the planet that gives you the most points (at least 100,000 points).
  '27': Research Intergalactic Research Network 1.
  '28': Upgrade all three storages on a moon to at least level 3.
  '29': Collectivize the fleet of a higher scoring player with a 5-player ACS.
  '30': Fend off a 5-player ACS all by yourself.
  '31': Send a player into vacation mode with your attack.
  '32': 'Raid 1000 planets while using the "SetSail" theme. Arr!'
  '33': Come back from vacation mode.
  '34': Get attacked for the first time. Welcome to the universe.
  '35': Attack an active player who has less than 1/10 of your points.
  '36': "Receive a message that contains one of the following blocks:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Get wiped out by a 5-player ACS.
  '38': 'Attack members of your own alliance. Friendly fire, anyone?'
  '39': Attack someone with exactly 42 ships.
  '40': Colonize a planet at least half a universe away.
  '41': Block a fleet slot for a week with a bad marketplace offer.
  '42': Join the Battlehall 4 times on the losing side.
  '43': "Win a battle while your account is flagged as Inactive,\r\n            on one of your planets where a fleet has previously arrived that had a flight time of more than 7 days."
  '44': 'Produce a resource on a planet for more than 7 days while running at less than 100% energy.'
  '45': Win an attack against a player who is in the top 5 for defense.
  '46': Trigger bash protection by firing interplanetary missiles.
  '47': Destroy 5 moons.
  '48': Lose 5 Death Stars trying to destroy moons. Ouch.
  '49': Demolish a colony shortly after creation.
  '50': "Lose all of your solar satellites on a planet with enough\r\n            energy to research Graviton technology, without having researched Graviton technology."
  '51': Use up all your deuterium while browsing the galaxy view.
  '52': >-
    Build a Death Star without having built other combat ships (Light Fighter,
    Heavy Fighter, Cruiser, Battleship, Bomber, Destroyer or Battle Cruiser)
    first.
  '53': Hold the top level in 5 researches at the same time.
  '54': 'Time an attack on an active player to land at 01/01 00:00:00.'
  '55': Special Achievement
