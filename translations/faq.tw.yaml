questions:
  '1':
    category: "新手入門"
    icon: "rocket"
    '1':
      title: "你的第一步"
      body: |-
        <p>一開始你有一顆行星和少量資源（預設是 500 金屬和 500 晶體）。其他東西全都靠三種資源來蓋：金屬、晶體、重氫，再加上讓礦場運轉的能源。</p>
        <h2 id="order">合理的開局順序</h2>
        <ol>
        <li>先蓋<b>太陽能發電廠</b>。沒有能源，礦場就沒辦法正常運作。</li>
        <li>接著蓋<b>金屬礦</b>，再蓋<b>晶體礦</b>。幾乎所有東西都要用到金屬，早期讓它比其他礦場高幾級。</li>
        <li><b>重氫精煉廠</b>。重氫是艦隊的燃料，好幾種重要的建築和研究也需要它。</li>
        <li>當建造變慢，或第一批研究可以做的時候，就蓋<b>機器人工廠</b>和<b>研究實驗室</b>。</li>
        <li><b>太空船廠</b>：造幾艘小型運輸艦和一些防禦。</li>
        </ol>
        <h2 id="queues">佇列</h2>
        <p>建築、研究和太空船廠各有自己的佇列，所以你可以同時蓋建築、做研究、造艦船。預設每顆行星的佇列可容納 5 個建築、2 個研究和 10 筆太空船廠訂單，各宇宙可能會調整。</p>
        <h2 id="progress">進度怎麼算</h2>
        <p>你的分數來自你投入的資源，預設每 1,000 單位資源 1 分（見<a href="game/faq/11/3">統計與分數</a>）。<a href="game/faq/1/3">教學</a>會帶你走完最初幾步，還會發獎勵。</p>
    '2':
      title: "東西在哪裡"
      body: |-
        <p>側邊面板把所有頁面分好類了。最重要的幾個：</p>
        <table class="faq-table">
        <tr><th>頁面</th><th>用途</th></tr>
        <tr><td>總覽</td><td>你的行星、進行中的佇列，以及來襲和出發的艦隊。</td></tr>
        <tr><td>資源</td><td>每小時產量、能源收支，以及每棟建築的產能百分比。</td></tr>
        <tr><td>建築、研究、艦船庫、防禦</td><td>建造、研究、造艦船和蓋防禦。每個都會顯示成本、建造時間和需求。</td></tr>
        <tr><td>科技</td><td>科技樹，列出每個建築、研究、艦船和防禦的需求。</td></tr>
        <tr><td>艦隊、銀河系</td><td>派出艦隊；瀏覽星系、偵查、攻擊、回收、發射飛彈。</td></tr>
        <tr><td>聯盟、好友</td><td>聯盟管理和好友名單。</td></tr>
        <tr><td>市集、艦隊商人</td><td>和其他玩家交易資源或艦船；把艦船賣掉換資源。</td></tr>
        <tr><td>模擬器</td><td>派出艦隊前先試打一場。</td></tr>
        <tr><td>統計、紀錄、名人堂</td><td>排名、宇宙紀錄和最大的戰鬥。</td></tr>
        <tr><td>帝國</td><td>你所有的行星和月球，整理在同一張表。</td></tr>
        <tr><td>訊息、筆記、客服</td><td>報告和信件、個人筆記、寄給團隊的客服單。</td></tr>
        <tr><td>選項、規則</td><td>帳號設定、假期模式，以及這個宇宙的規則。</td></tr>
        </table>
        <p>有些頁面只有在宇宙啟用對應模組時才會出現；如果這裡寫的東西你找不到，請到<a href="game/faq/11/4">客服</a>詢問。</p>
    '3':
      title: "教學與成就"
      body: |-
        <p>如果宇宙有開啟教學，會有一個教學方塊一步一步帶你：蓋第一批礦場和防禦、派出第一次運輸、偵查玩家、回收殘骸、殖民、派遠征、幫行星改名、送出好友邀請或聯盟申請。完成的目標可能會給獎勵；你可以跳過單一目標，也可以整個教學都跳過。選項裡的<b>新手介面</b>會讓選單保持精簡，直到你做完教學。</p>
        <h2 id="achievements">成就</h2>
        <p>成就頁面列出長期目標（第一顆月球、遠征的初次發現、大型戰鬥等等）。你在玩的時候它們會自動解鎖。</p>
    '4':
      title: "其他玩家、機器人和海盜基地"
      body: |-
        <p>每個宇宙都和其他玩家共用。依宇宙設定，伺服器控制的<b>機器人</b>可能會一起玩。機器人和玩家遵守同樣的規則；如果開啟了機器人突襲，它們會在同樣的限制下（洗點上限、保護、假期模式）進行偵察、偵查和攻擊。</p>
        <h2 id="pirates">海盜基地</h2>
        <p>如果宇宙啟用海盜基地，每位活躍玩家（最近 7 天內上線過，且分數高於最低門檻）會有一個基地，出現在該玩家其中一顆行星所在的星系，並且每週更換。基地擁有該玩家一部分的艦船和幾個小時的產量；掠奪基地時會拿走全部資源，而不是只有一半。比例和最低分數由宇宙設定決定。</p>
  '2':
    category: "經濟與建築"
    icon: "building-2"
    '1':
      title: "資源與產量"
      body: |-
        <p>金屬、晶體和重氫由每顆行星上的礦場生產，另外每小時還有少量<b>基本收入</b>（預設 20 金屬和 10 晶體）。每座礦場都需要能源。</p>
        <h2 id="percent">產能百分比</h2>
        <p>在資源頁面，你可以把每個生產設施設成 0-100&nbsp;%。設得越低，消耗的能源和重氫越少（核融合發電廠會燒重氫），產量也越低。用這個來平衡能源。</p>
        <h2 id="factors">哪些會影響產量</h2>
        <ul>
        <li>礦場等級（產量成長的速度比線性還快，成本也是）。</li>
        <li>行星溫度：越冷的行星，重氫精煉廠產量越高；越熱的行星，太陽能衛星發電越多。</li>
        <li>生產類研究（金屬、晶體、重氫生產）：每級各 +2&nbsp;%。</li>
        <li>宇宙的資源倍率。</li>
        </ul>
        <h2 id="full">倉庫滿了</h2>
        <p>行星上某種資源的倉庫一滿，該資源就停止生產（預設剛好在容量上限）。掠奪或遠征帶回的資源可以讓你超過上限。</p>
    '2':
      title: "能源"
      body: |-
        <p>礦場會消耗能源；資源頁面會顯示產出和使用的能源。如果消耗大於產出，<b>每個生產設施都會被降速</b>到正常產量乘以產出 / 需求，所以能源不足會讓金屬、晶體和重氫一起減產。</p>
        <h2 id="sources">來源</h2>
        <ul>
        <li><b>太陽能發電廠</b>：便宜，沒有運轉成本。先蓋它。</li>
        <li><b>核融合發電廠</b>：燒重氫。能源 = 30 x 等級 x (1.05 + 0.01 x 能源科技等級)^等級，所以能源科技會讓它更強。</li>
        <li><b>太陽能衛星</b>：在艦船庫建造，不佔用欄位；發電量取決於行星溫度。它們會被擊落，所以戰鬥中算作艦船。</li>
        </ul>
    '3':
      title: "倉庫與保護資源"
      body: |-
        <p>每種資源都有倉儲容量（沒有倉庫建築時是 10,000 單位），會隨金屬倉庫、晶體倉庫和重氫槽的等級快速成長。</p>
        <h2 id="stash">防範掠奪</h2>
        <p>如果宇宙使用資源藏匿機制，每級倉庫會保護該行星每日產量的 1&nbsp;% 不被掠奪，最高 10&nbsp;%（倉庫 10 級）。除此之外，一次掠奪最多只能拿走行星上某種資源的一半；見<a href="game/faq/5/2">戰利品</a>。</p>
        <p>最好的保護，還是在下線前把資源花掉，或是排進佇列裡。</p>
    '4':
      title: "建造建築"
      body: |-
        <p>每一級的成本比上一級多固定倍率（例如金屬礦 1.5 倍、晶體礦 1.6 倍、大多數其他建築 2 倍），所以真正的價格請看建築頁面。</p>
        <h2 id="time">建造時間</h2>
        <p>在一般宇宙速度下：（金屬 + 晶體成本）/（2500 x (1 + 機器人工廠等級)）小時，奈米機器人工廠每升一級再減半。機器人工廠在月球上也有效。艦船的建造時間是（金屬 + 晶體）/（2500 x (1 + 太空船廠等級)）小時，同樣每級奈米再減半；研究請見<a href="game/faq/3/1">研究</a>。宇宙速度設定會等比例縮放這些時間。</p>
        <h2 id="cancel">取消與拆除</h2>
        <p>取消建築或研究會全額退還成本。取消太空船廠訂單退還 60&nbsp;%。拆除建築比蓋它快得多（大約 36&nbsp;% 的時間）。</p>
        <h2 id="catchup">追趕機制</h2>
        <p>宇宙可能會啟用追趕機制：遠遠落後領先者的玩家，建造和研究會更便宜、更快，上限為設定的最大值（預設 50&nbsp;%）。</p>
    '5':
      title: "行星欄位與地形改造器"
      body: |-
        <p>每顆行星和月球的欄位數量有限；行星上每個建築等級佔用一格（研究和艦船不佔）。</p>
        <ul>
        <li><b>地形改造器</b>（僅限行星）：每級 +5 格，偶數等級再 +1 格；每一級自己也佔一格。它需要能源（不會被消耗），而且不能拆除。</li>
        <li><b>月球基地</b>（僅限月球）：每級 +3 格，自己也佔一格。見<a href="game/faq/7/2">月球建築</a>。</li>
        </ul>
    '6':
      title: "殖民地"
      body: |-
        <p>用<b>殖民船</b>（任務：殖民）去殖民空的行星。船會被消耗掉，變成新的殖民地。你需要天體物理學研究。</p>
        <h2 id="limit">能有幾顆行星</h2>
        <p>預設行星總數（含母星）是 1 + 天體物理學等級 / 2（無條件進位），最多 12 顆：</p>
        <p>1-2 級 = 2 顆，3-4 = 3，5-6 = 4，7-8 = 5，9-10 = 6，11-12 = 7，13-14 = 8，15-16 = 9，17-18 = 10，19-20 = 11，21 級以上 = 12。</p>
        <h2 id="positions">哪些位置</h2>
        <p>外圈和內圈的位置需要更高的天體物理學：位置 4-12 從 1 級開始，位置 3 和 13 要 4 級，位置 2 和 14 要 6 級，位置 1 和 15 要 8 級（以 15 個位置的星系為準）。</p>
  '3':
    category: "研究"
    icon: "flask-conical"
    '1':
      title: "研究與研究實驗室"
      body: |-
        <p>研究在<b>研究實驗室</b>裡進行，對你所有行星都有效。實驗室等級和一份需求清單決定你能研究什麼；科技頁面會列出來。</p>
        <ul>
        <li>同一時間只能進行一項研究（佇列預設可放 2 項）。研究進行中，任何研究實驗室都不能升級。</li>
        <li>研究時間 =（金屬 + 晶體成本）/（1000 x (1 + 實驗室等級)）小時（一般速度）。<b>大學</b>可以縮短時間，預設每級 8&nbsp;%。</li>
        <li><b>星際研究網路</b>讓你其他行星的實驗室一起幫忙：每級多加一間實驗室（取符合該研究自身實驗室需求的最高幾間），並把它們的等級加總來計算。</li>
        <li>取消進行中的研究會全額退還成本。</li>
        </ul>
    '2':
      title: "各項科技有什麼用"
      body: |-
        <h2 id="fleet">艦隊</h2>
        <ul>
        <li><b>電腦科技</b>：每級 +1 個艦隊欄位（一開始有 1 個欄位）。</li>
        <li><b>燃燒 / 脈衝 / 超空間引擎</b>：使用該引擎的艦船，每級飛行速度增加基礎速度的 +10 / +20 / +30&nbsp;%。有些艦船到特定等級會換引擎（例如小型運輸艦裝上脈衝引擎）。脈衝引擎等級也決定飛彈射程。</li>
        <li><b>燃料效率</b>：每級 -2&nbsp;% 燃料消耗。</li>
        <li><b>天體物理學</b>：殖民地、遠征和可殖民位置，見<a href="game/faq/2/6">殖民地</a>和<a href="game/faq/8/1">遠征</a>。</li>
        <li><b>間諜科技</b>：更詳細的間諜報告；也決定你能看到多少來襲艦隊的資訊。</li>
        </ul>
        <h2 id="combat">戰鬥</h2>
        <ul>
        <li><b>武器、護盾和裝甲科技</b>：每級讓你所有單位的攻擊、護盾和裝甲 +10&nbsp;%。</li>
        <li>雷射、離子和電漿科技解鎖武器；摧毀月球需要重力子研究。</li>
        </ul>
        <h2 id="economy">經濟</h2>
        <ul>
        <li><b>能源科技</b>：提高核融合發電廠的產出，並開啟許多科技。</li>
        <li><b>金屬 / 晶體 / 重氫生產</b>：每級 +2&nbsp;% 產量。</li>
        </ul>
  '4':
    category: "艦隊與任務"
    icon: "send"
    '1':
      title: "派出艦隊"
      body: |-
        <ol>
        <li>在艦隊頁面<b>選擇艦船</b>（或在銀河系檢視全部派出）。</li>
        <li><b>目標與速度</b>：輸入座標（銀河:星系:位置）和類型：行星、殘骸場或月球。速度是 10-100&nbsp;%，以 10 為單位；越慢越省燃料，但花的時間越久。</li>
        <li><b>任務與貨物</b>：選一個該目標可用的任務，需要的話裝載資源，然後確認。駐守、遠征和交易任務還要選擇停留多久。</li>
        </ol>
        <p>確認前，頁面會顯示飛行時間、抵達時間和燃料。艦隊需要行星上有足夠的重氫來支付這趟飛行。</p>
        <p>你同時最多能飛出的艦隊數量等於你的<b>艦隊欄位</b>：1 + 電腦科技等級。遠征有自己的上限，見<a href="game/faq/8/1">遠征</a>。</p>
    '2':
      title: "速度、飛行時間與燃料"
      body: |-
        <ul>
        <li>艦隊的飛行速度取決於<b>最慢的那艘船</b>。</li>
        <li>艦船速度 = 基礎速度 x (1 + 0.1 / 0.2 / 0.3 x 引擎等級)，取該船能用的最好引擎；見<a href="game/faq/3/2">科技</a>。</li>
        <li>飛行時間 = (3500 / (速度&nbsp;% x 0.1) x 平方根 (距離 x 10 / 艦隊速度) + 10) / 宇宙艦隊速度。最短 5 秒。</li>
        <li>距離會隨著跨越的銀河系和星系數量增加；同一個銀河系、同一個星系，比去別的星系短得多。</li>
        <li>燃料消耗上升的速度比飛行時間縮短的速度快：飛慢一點能省重氫。每級燃料效率減少 2&nbsp;% 消耗。</li>
        </ul>
        <p>有些宇宙是環狀的（星系或銀河系首尾相連）。艦隊頁面的計算已經把這個算進去了。</p>
    '3':
      title: "所有任務一覽"
      body: |-
        <table class="faq-table">
        <tr><th>任務</th><th>目標</th><th>會發生什麼事</th></tr>
        <tr><td>攻擊</td><td>其他玩家的行星或月球</td><td>開打；倖存者帶著戰利品返航。見<a href="game/faq/5/1">戰鬥</a>。</td></tr>
        <tr><td>聯盟攻擊</td><td>同上，組隊進行</td><td>多位玩家一起攻擊，見<a href="game/faq/9/3">聯盟戰</a>。</td></tr>
        <tr><td>運輸</td><td>任何有人居住的行星</td><td>送達資源後返航。</td></tr>
        <tr><td>部署</td><td>你自己的行星或月球</td><td>艦船和貨物留在那裡；不會返航。</td></tr>
        <tr><td>駐守</td><td>聯盟成員或好友的行星</td><td>艦隊在那裡待命並防守該行星，見<a href="game/faq/9/4">駐守</a>。</td></tr>
        <tr><td>轉讓</td><td>聯盟成員或好友的行星</td><td>把艦船和貨物送給對方；它們不會回來。</td></tr>
        <tr><td>間諜</td><td>其他玩家的行星或月球</td><td>只有全是間諜衛星的艦隊才能偵查；見<a href="game/faq/6/1">間諜</a>。</td></tr>
        <tr><td>殖民</td><td>空的行星位置</td><td>需要殖民船，見<a href="game/faq/2/6">殖民地</a>。</td></tr>
        <tr><td>回收</td><td>殘骸場</td><td>需要回收船，見<a href="game/faq/4/4">回收</a>。</td></tr>
        <tr><td>摧毀</td><td>一顆月球</td><td>需要死星，見<a href="game/faq/7/5">摧毀月球</a>。</td></tr>
        <tr><td>遠征</td><td>星系的遠征位置（16）</td><td>抽事件，見<a href="game/faq/8/1">遠征</a>。</td></tr>
        <tr><td>交易</td><td>星系的交易位置（17）</td><td>配送<a href="game/faq/4/6">市集</a>交易的貨物。</td></tr>
        <tr><td>飛彈攻擊</td><td>飛彈射程內的行星</td><td>飛彈轟擊防禦，見<a href="game/faq/5/5">飛彈</a>。</td></tr>
        </table>
        <p>能不能選某個任務，取決於目標，以及宇宙啟用了哪些模組。對假期模式玩家的敵對任務會直接掉頭。</p>
    '4':
      title: "殘骸場與回收"
      body: |-
        <p>戰鬥中被擊毀的艦船會在目標位置留下<b>殘骸場</b>。預設包含雙方所有被擊毀艦船的金屬和晶體成本的 30&nbsp;%，防禦則是 0&nbsp;%；重氫不會變成殘骸。宇宙可以更改這兩個百分比。</p>
        <ul>
        <li>派出<b>回收船</b>（任務：回收，目標類型：殘骸場）來收集。艦隊能載多少就裝多少；金屬和晶體按比例拿，剩下的留在殘骸場。</li>
        <li>任何人都可以收殘骸場。誰先到就是誰的。</li>
        <li>偵查時被擊落的衛星也會留下殘骸。</li>
        <li>回收頁面和報告會告訴你還需要多少回收船。</li>
        </ul>
    '5':
      title: "召回艦隊"
      body: |-
        <p>你可以在艦隊頁面或總覽召回出發中的艦隊。它會掉頭，返航所需時間等於它已經飛行的時間。</p>
        <ul>
        <li>艦隊一旦抵達目標就<b>無法召回</b>（會先結算抵達，所以你沒辦法躲戰鬥）；抵達後的遠征艦隊和星際飛彈也不能召回。</li>
        <li>駐守中的艦隊可以提前召回；返航所需時間等於它去程花的時間。</li>
        <li>如果聯盟攻擊的發起者召回，整個團隊都會被召回。加入的艦隊只會召回自己。</li>
        </ul>
    '6':
      title: "艦隊商人、市集與轉讓"
      body: |-
        <h2 id="dealer">艦隊商人</h2>
        <p>艦隊商人會以資源成本扣掉手續費（預設 30&nbsp;%）向你收購艦船。只有設定好的艦船清單可以賣（預設是小型運輸艦到戰鬥巡洋艦，不含最大的艦船）。假期模式下無法使用。</p>
        <h2 id="market">市集</h2>
        <p>玩家掛出資源或艦船，並用其他資源標價。交易由艦隊飛往該掛單所在星系的交易位置來配送（15 顆行星的星系中是位置 17，任務：交易）。參考價格取自最近 7 天完成的交易（維持在 0.5 到 5 之間）。</p>
        <h2 id="transfer">轉讓</h2>
        <p>轉讓任務會把艦船和資源送給聯盟成員或好友。什麼都不會回來。</p>
        <p>大額的單向贈與會受到檢查，見<a href="game/faq/10/5">灌資與交易限制</a>。</p>
  '5':
    category: "戰鬥"
    icon: "swords"
    '1':
      title: "戰鬥怎麼進行"
      body: |-
        <p>當進攻艦隊抵達目標時，所有進攻艦隊（包括聯盟戰的參與者）會對上行星本身的防禦和艦隊，以及所有駐守在那裡的艦隊。最多打 <b>6 回合</b>。</p>
        <ul>
        <li>每回合，每艘船會對隨機一艘敵艦開一次火（快速射擊可能追加射擊）。</li>
        <li>護盾先吸收一發攻擊；弱於目標護盾 1&nbsp;% 的攻擊會被彈開。護盾在每回合結束後恢復，裝甲的損傷則不會。</li>
        <li>一艘船的裝甲 =（金屬 + 晶體成本）/ 10。裝甲低於 70&nbsp;% 的船，下一次被擊中時可能爆炸；受損越重越容易。</li>
        <li><b>快速射擊</b>：如果目標類型在射手的快速射擊清單裡，數值為 N，射手有 (N-1)/N 的機率再開一次火。可在科技頁面查看。</li>
        <li>武器、護盾和裝甲科技每級為攻擊、護盾和裝甲增加 10&nbsp;%。</li>
        <li>一回合中所有射擊同時進行；裝甲歸零的船會在回合結束後被移除。</li>
        </ul>
        <h2 id="result">結果</h2>
        <p>防守方被全滅，進攻方就贏了，並可以掠奪。如果 6 回合後雙方都還有船，戰鬥算平手，沒人能掠奪。如果進攻方被全滅，防守方獲勝。戰鬥報告（含每一回合）會發給所有參戰方；每份報告都有公開連結。</p>
    '2':
      title: "戰利品"
      body: |-
        <p>只有獲勝的進攻方能掠奪。倖存進攻艦船的剩餘載貨空間（間諜衛星不算）會依下列順序裝滿：</p>
        <ol>
        <li>先用金屬裝滿最多 1/3 的容量，</li>
        <li>再用晶體裝滿剩餘容量的一半，</li>
        <li>其餘用重氫裝滿，</li>
        <li>如果還有剩餘空間，再用金屬（一半）和晶體補滿。</li>
        </ol>
        <p>每種資源最多只能拿走<b>行星庫存的一半</b>。其他限制：<a href="game/faq/2/3">倉庫</a>的受保護部分（若啟用）。榮譽紀錄非常差的玩家可能被掠奪超過一半，見<a href="game/faq/5/7">榮譽點數</a>。</p>
        <p>海盜基地是例外：掠奪它時，容量允許多少就拿多少。</p>
    '3':
      title: "殘骸、殘骸場與修理船塢"
      body: |-
        <h2 id="debris">殘骸</h2>
        <p>見<a href="game/faq/4/4">殘骸場與回收</a>：預設為損失艦船的金屬和晶體的 30&nbsp;%。</p>
        <h2 id="wreck">殘骸場</h2>
        <p>如果宇宙有修理船塢模組，<b>行星擁有者</b>損失的艦船（不含防禦）可能會留下<b>殘骸場</b>，但必須一次損失很多：預設至少價值 150,000 單位，且損失 75&nbsp;% 的艦隊。殘骸場包含沒有變成殘骸的那部分艦船。</p>
        <h2 id="dock">修理船塢</h2>
        <p>修理船塢（僅限行星）可以修復殘骸場中的艦船：修復率是殘骸的 24&nbsp;% + 等級^1.5&nbsp;%，最高 100&nbsp;%。修理訂單需要艦船的建造時間，但至少在殘骸出現後 30 分鐘，最多 12 小時。要在 3 天內開始，然後在修理船塢頁面讓修好的艦船重新服役；如果你忘了，3 天後它們會自動回歸服役。殘骸場 72 小時後消失。</p>
    '4':
      title: "防禦"
      body: |-
        <ul>
        <li>防禦單位和行星上所有艦隊一起戰鬥。它們不會飛行。</li>
        <li>戰鬥結束後，<b>被摧毀的防禦會部分免費重建</b>：某種類型損失超過 10 個，其中 60-80&nbsp;% 會回來（隨機）；如果是 10 個以下，每個單位有 70&nbsp;% 的機率。</li>
        <li>沒被重建的防禦，預設不會留下殘骸。</li>
        <li>飛彈會摧毀<b>不會</b>被重建的防禦，見<a href="game/faq/5/5">飛彈</a>。</li>
        <li>護盾罩、行星防護盾和軌道防禦平台每顆行星只能蓋一個。</li>
        <li>行星上的太陽能衛星以艦船身分戰鬥，算艦隊而不是防禦。</li>
        </ul>
    '5':
      title: "飛彈"
      body: |-
        <p>你需要<b>飛彈發射井</b>。預設每級有 10 格；攔截飛彈佔 1 格，星際飛彈佔 2 格。</p>
        <ul>
        <li><b>星際飛彈</b>會攻擊同一個銀河系、射程內行星的防禦。它們用完即消耗、無法召回，傷害取決於你的武器科技。</li>
        <li>射程 = 5 x 脈衝引擎等級 - 1 個星系（宇宙係數可能改變）。飛行時間 =（30 + 60 x 星系距離）/ 宇宙艦隊速度 秒。</li>
        <li>選擇<b>主要目標</b>：該防禦類型會最先被打。不選的話，由飛彈發射器先吃。</li>
        <li><b>攔截飛彈</b>以一對一擊落來襲的飛彈；每攔截一枚飛彈，防守方就損失一枚攔截飛彈。</li>
        <li>被摧毀的防禦不會重建。</li>
        <li>飛彈攻擊會計入洗點上限，除非宇宙關閉了這點。</li>
        </ul>
    '6':
      title: "模擬器與戰鬥報告"
      body: |-
        <p><b>模擬器</b>會用你輸入的科技和艦隊跑一場戰鬥，並顯示結果和損失。間諜報告可以一鍵連到它。模擬戰鬥和真實戰鬥規則相同，但隨機性（快速射擊、爆炸）讓結果可能和實際戰鬥略有出入；多跑幾次來抓個大概。</p>
        <p>真實的戰鬥報告會存在你的訊息裡，並有公開連結，可以拿去分享。名人堂會列出宇宙中最大的戰鬥。</p>
    '7':
      title: "榮譽點數"
      body: |-
        <p>如果宇宙使用榮譽點數，公平的 1 對 1 戰鬥會讓雙方獲得榮譽點數，而攻擊明顯較弱的玩家會讓進攻方扣點。</p>
        <ul>
        <li><b>光榮</b>（雙方都加點）：進攻方的分數不高於防守方，且軍事實力不超過對方兩倍，或防守方是已知的惡徒。</li>
        <li><b>不光榮</b>（進攻方扣點）：進攻方的軍事分數超過防守方的兩倍（且差距超過 10 分），而防守方的榮譽排名不錯。</li>
        <li>對不活躍玩家、聯盟成員和好友的戰鬥屬於中立。預設同樣兩位玩家在 24 小時內，最多只有 3 場戰鬥能賺到榮譽。</li>
        </ul>
        <h2 id="effects">效果</h2>
        <ul>
        <li>高榮譽（500 點，並位居宇宙前 30 / 20 / 10&nbsp;%）會讓你的飛行燃料減少 5 / 12 / 20&nbsp;%。</li>
        <li>極低榮譽（-500 點或更低，後 30 / 20 / 10&nbsp;%）表示進攻方可以掠奪你庫存的 60 / 80 / 100&nbsp;%，而不是一半。見<a href="game/faq/5/2">戰利品</a>。</li>
        </ul>
  '6':
    category: "間諜"
    icon: "scan-eye"
    '1':
      title: "用衛星偵查"
      body: |-
        <p>只有<b>全由間諜衛星組成</b>的艦隊才能使用間諜任務。你會在訊息中收到一份報告，而目標會被告知看到了外來艦隊。</p>
        <h2 id="level">報告顯示什麼</h2>
        <p>資源永遠看得到。你還能看到多少，取決於衛星的數量，以及雙方的間諜科技等級（你的是 <i>s</i>，目標的是 <i>t</i>）：看到艦隊所需的衛星數是 n0 = (|s - t|)^2，如果你的等級比較高則為負數。防禦需要 n0 + 1 艘衛星，建築 n0 + 3，研究 n0 + 5。多派一些，比你覺得需要的還多。</p>
        <h2 id="risk">反間諜</h2>
        <p>目標行星可能會把衛星擊落。機率（%）= 2^(t - s) x 衛星數 x（行星上的艦船和防禦數）x 0.0025，最高 100。沒有艦船或防禦的行星從不開火。損失的衛星會留下殘骸。不論如何，報告都會送達。</p>
        <p>間諜報告有個連結，會帶著目標資料預先填好並跳到模擬器。</p>
    '2':
      title: "你能看到的來襲艦隊資訊"
      body: |-
        <p>你自己的間諜科技等級，也決定總覽會顯示多少朝你而來的外來艦隊資訊：</p>
        <ul>
        <li>0-1 級：只知道有艦隊靠近。</li>
        <li>2-3 級：有多少艘船。</li>
        <li>4-7 級：有哪些艦船類型。</li>
        <li>8 級以上：每種類型各有多少艘。</li>
        </ul>
        <p>如果宇宙啟用該模組，其他玩家的統計也可能取決於你的間諜科技。</p>
  '7':
    category: "月球與感應密集陣"
    icon: "moon"
    '1':
      title: "月球怎麼形成"
      body: |-
        <p>在還沒有月球的<b>行星</b>上打完一場戰鬥後，可能形成月球。機率是<b>該場戰鬥產生的每 100,000 單位殘骸有 1&nbsp;%</b>（套用宇宙係數），最高不超過宇宙上限（預設 20&nbsp;%）。月球上不會再形成月球。</p>
        <ul>
        <li>只計算該場戰鬥的殘骸：雙方損失的艦船，以及（若宇宙允許防禦產生殘骸）防禦。</li>
        <li>有些宇宙會在月球形成時清除殘骸場。</li>
        <li>宇宙可能加入連鎖加成：在最高機率下連續失敗後逐步加成，直到第一顆月球出現。</li>
        <li>月球屬於目標行星的擁有者。一顆行星只能有一顆月球。</li>
        </ul>
        <h2 id="size">大小</h2>
        <p>直徑 = 平方根 (10-20 + 3 x 機率&nbsp;%) x 1,000 公里，再乘以宇宙大小係數。在 20&nbsp;% 機率下，大約在 8,370 到 8,940 公里之間。剛形成的月球剛好只有 1 格空間。</p>
    '2':
      title: "月球建築"
      body: |-
        <p>在月球上你可以蓋機器人工廠、太空船廠、三種倉庫，以及月球專屬建築：</p>
        <h2 id="base">月球基地</h2>
        <p>每級給 3 格並佔用 1 格。不能拆除。先蓋它。</p>
        <h2 id="phalanx">感應密集陣</h2>
        <p>見<a href="game/faq/7/3">感應密集陣</a>。</p>
        <h2 id="gate">躍遷門</h2>
        <p>見<a href="game/faq/7/4">躍遷門</a>。</p>
        <p>月球不產出資源，而且欄位很少、放不下所有東西：蓋之前先規劃好欄位預算。</p>
    '3':
      title: "感應密集陣"
      body: |-
        <p>月球上的感應密集陣可以顯示<b>同一個銀河系</b>、射程內行星的艦隊動向。月球無法被掃描。</p>
        <ul>
        <li><b>射程</b> = 等級^2 - 1 個星系（1 級只涵蓋自己的星系），再乘以宇宙係數。</li>
        <li><b>成本</b>：每次掃描 5,000 重氫，從月球扣除。</li>
        <li>你能看到從被掃描行星出發或飛往它的艦隊：抵達、駐守結束和返航。部署和飛彈不會顯示。</li>
        <li>假期模式下無效，對因保護而無法攻擊的玩家也無效。</li>
        </ul>
        <p>從月球打開銀河系檢視，點射程內的行星即可。</p>
    '4':
      title: "躍遷門"
      body: |-
        <p>躍遷門能讓艦船在你自己的兩顆月球之間瞬間移動，不消耗燃料。資源無法搬運。</p>
        <ul>
        <li>兩座門都必須準備就緒。跳躍後每座門都需要冷卻：1 級是 60 分鐘，隨等級下降，15 級起是 10 分鐘（宇宙係數可能改變）。</li>
        <li>太陽能衛星無法跳躍。</li>
        </ul>
    '5':
      title: "摧毀月球"
      body: |-
        <p>如果艦隊包含<b>死星</b>，就能對月球使用<b>摧毀</b>任務。進攻方打贏戰鬥之後，才會發生摧毀。</p>
        <ul>
        <li><b>摧毀月球的機率</b>（%）=（100 - 月球直徑的平方根）x 死星數量的平方根，最高 100。越大的月球越難摧毀。</li>
        <li><b>艦隊風險</b>：不論月球有沒有被摧毀，進攻艦隊都有（直徑的平方根）/ 2&nbsp;% 的機率全軍覆沒。</li>
        <li>月球被摧毀時，駐紮在月球上的艦隊會被移到行星上。被摧毀的月球不留殘骸。</li>
        </ul>
  '8':
    category: "遠征"
    icon: "compass"
    '1':
      title: "派出遠征"
      body: |-
        <p>遠征要去任何星系的<b>位置 16</b>（在 15 顆行星的星系中，最後一顆行星後面那個位置）。需要<b>天體物理學</b>研究。</p>
        <ul>
        <li><b>欄位</b>：天體物理學等級的平方根，無條件捨去（1-3 級 = 1，4-8 = 2，9-15 = 3，16-24 = 4，…）。它們和你一般的艦隊欄位是分開的。</li>
        <li><b>停留</b>：最多每級天體物理學 1 小時（宇宙係數可能改變）。</li>
        <li>只有衛星組成的艦隊不能去遠征。</li>
        <li>遠征抵達後<b>無法召回</b>。事件在停留結束時結算，然後艦隊飛回家。</li>
        <li>遠征結果會寫在你的訊息裡，並計入你的統計。</li>
        </ul>
    '2':
      title: "遠征能發現什麼"
      body: |-
        <p>每位玩家從自己專屬的牌組抽事件牌，牌組抽完會重新洗牌補滿，所以長期下來頻率會趨近一致。預設牌組是 1,000 張牌（宇宙可以更改）：</p>
        <table class="faq-table">
        <tr><th>事件</th><th>比例</th><th>詳情</th></tr>
        <tr><td>資源</td><td>37&nbsp;%</td><td>小型、中型或大型發現。預設金屬佔 50&nbsp;%，晶體 33&nbsp;%，重氫 17&nbsp;%。</td></tr>
        <tr><td>艦船</td><td>26.4&nbsp;%</td><td>艦船加入你的艦隊；只有特定艦船類型能被發現。</td></tr>
        <tr><td>什麼都沒有</td><td>19&nbsp;%</td><td>艦隊空手而回。</td></tr>
        <tr><td>延遲</td><td>6.7&nbsp;%</td><td>返航多花 2、3 或 5 小時（小、中、大）。</td></tr>
        <tr><td>海盜</td><td>5.7&nbsp;%</td><td>你要和一支海盜艦隊開打。</td></tr>
        <tr><td>外星人</td><td>2.6&nbsp;%</td><td>你要和一支外星艦隊開打。</td></tr>
        <tr><td>提早返航</td><td>2.3&nbsp;%</td><td>返航縮短 20、30 或 50&nbsp;%。</td></tr>
        <tr><td>黑洞</td><td>0.3&nbsp;%</td><td>整支艦隊全滅。</td></tr>
        </table>
        <h2 id="size">能找到多少</h2>
        <p>資源發現的量會隨你的艦隊價值成長（有宇宙上限），並受艦隊載貨容量限制：小型發現是 10-50 倍，中型 50-100 倍，大型 100-200 倍的一個價值單位；晶體的發現量減半，重氫除以三。想要大發現，就帶運輸艦。</p>
        <h2 id="depletion">枯竭的位置</h2>
        <p>如果最近 24 小時內有很多遠征去同一個座標，抽到的牌可能變成「什麼都沒有」：超過 10 次遠征有 25&nbsp;% 的機率，超過 25 次有 50&nbsp;%，超過 50 次有 75&nbsp;%。把你的遠征分散開來。</p>
  '9':
    category: "聯盟與聯盟戰"
    icon: "handshake"
    '1':
      title: "創立與管理聯盟"
      body: |-
        <p>打開側邊面板的<b>聯盟</b>，用標籤和名稱建立一個（字母、數字和空格；兩者都不能已被使用）。有些宇宙要求達到最低分數才能創立聯盟。</p>
        <h2 id="manage">管理</h2>
        <ul>
        <li><b>階級</b>：為每個階級設定權限（申請、踢人、群發訊息…）。</li>
        <li><b>成員</b>：指派階級、踢除成員、查看成員上次上線的時間。</li>
        <li><b>申請</b>：開放或關閉招募、閱讀並回覆申請；申請文字是給申請者用的範本。</li>
        <li><b>文字</b>：對外文字是公開的，對內文字只有成員看得到。</li>
        <li>對所有人或選定階級發送<b>群體訊息</b>。</li>
        <li>與其他聯盟的<b>外交</b>，見<a href="game/faq/9/2">外交</a>。</li>
        <li>你可以把聯盟轉讓給其他成員，或解散它。</li>
        </ul>
    '2':
      title: "聯盟外交"
      body: |-
        <p>聯盟之間可以互相提出條約，對方接受或拒絕。類型有：主盟、分盟、聯盟、貿易協定、互不侵犯條約、戰爭、秘密聯盟和和平。</p>
        <p>條約記錄兩個聯盟之間的關係。處於<b>戰爭</b>中的聯盟之間的攻擊，可能不受洗點上限限制（宇宙設定），條件是戰爭已被接受超過一天，而且進攻方與目標之間沒有帳號關聯。</p>
    '3':
      title: "一起進攻（聯盟戰）"
      body: |-
        <h2 id="start">發起團隊</h2>
        <p>先派出一支任務為<b>攻擊</b>的艦隊。然後打開艦隊頁面，對該艦隊使用聯盟戰功能，並邀請其他玩家。每位被邀請的玩家各自派出自己的艦隊，飛往同一個座標，任務為<b>聯盟攻擊</b>。</p>
        <h2 id="rules">規則</h2>
        <ul>
        <li>團隊會隨最慢的艦隊一起抵達。</li>
        <li>加入的艦隊最多能讓團隊延遲剩餘時間的 <b>30&nbsp;%</b>。</li>
        <li>預設一個團隊最多 16 支艦隊、最多 5 位玩家（宇宙設定）。</li>
        <li>戰利品依容量分配；所有參與者都會加入戰鬥。</li>
        </ul>
        <p><b>小心：</b>如果發起者召回，整個團隊都會被召回。</p>
    '4':
      title: "防守：駐守與聯盟倉庫"
      body: |-
        <p>派出任務為<b>駐守</b>的艦隊，前往聯盟成員或好友的行星。它會待命 1、2、4、8、12、16 或 32 小時，如果期間該行星遭到攻擊，就以防守方身分參戰。它在間諜報告上會顯示得像是行星的一部分。</p>
        <ul>
        <li>出發時除了飛行燃料以外沒有額外成本。</li>
        <li>每顆行星上駐守的艦隊數和玩家數，受宇宙的聯盟戰設定限制。</li>
        <li>你可以隨時召回駐守中的艦隊。</li>
        </ul>
        <h2 id="depot">聯盟倉庫</h2>
        <p>行星擁有者可以用聯盟倉庫的重氫補給駐守艦隊，讓它們待更久：每次補給 1 到（倉庫等級）小時。每小時成本是艦隊基礎燃料消耗總和的十分之一，無條件進位。艦隊剩餘的停留時間永遠不會超過 32 小時。</p>
    '5':
      title: "好友"
      body: |-
        <p>朋友（好友）可以在好友頁面或玩家個人資料互相送出邀請。好友之間可以互相使用駐守和轉讓，不受榮譽變動影響，並且會出現在彼此的好友名單中。</p>
        <p>如果宇宙啟用，離線超過 7 天的玩家（假期模式除外）會被自動從好友名單和聯盟中移除。</p>
  '10':
    category: "保護與假期"
    icon: "shield-check"
    '1':
      title: "新手保護與亡命之徒"
      body: |-
        <p>保護是以<b>分數</b>為基礎。預設情況下，當一位玩家的分數在 5,000 以下，<b>而且</b>對方的分數超過他的 5 倍時，他就受到保護。兩個數字都是宇宙設定，整個保護機制也可以關閉。</p>
        <ul>
        <li>涵蓋攻擊、聯盟攻擊、摧毀月球、駐守、間諜、飛彈攻擊和感應密集陣掃描。</li>
        <li>雙向生效：如果<i>你</i>低於分數門檻，而對方的分數超過你的 5 倍，你也不能攻擊他（除非宇宙使用亡命之徒系統，見下方）。</li>
        <li>被停權的玩家不適用保護，預設離線 7 天的玩家也不適用。</li>
        <li>銀河系檢視會標示受保護的玩家（N = 弱，S = 強）。</li>
        </ul>
        <h2 id="outlaw">亡命之徒</h2>
        <p>如果宇宙使用亡命之徒系統，弱的玩家仍然可以攻擊強很多的玩家。他會因此成為<b>亡命之徒</b>：保護對他失效 2 天（第一次）或 7 天（之後每一次），所以強的玩家可以反擊。</p>
    '2':
      title: "洗點上限"
      body: |-
        <p>洗點上限用來阻止對同一個目標重複攻擊。預設你<b>24 小時內最多攻擊同一顆行星 6 次</b>；也可以設定針對單一玩家的上限（預設關閉）。飛彈攻擊也算，除非宇宙關閉這點。</p>
        <ul>
        <li>同一個聯盟戰團隊的多支艦隊算一次攻擊。</li>
        <li>單顆衛星的間諜行動不計入。</li>
        <li>不活躍的目標（7 天）不受保護。</li>
        <li>如果宇宙設有「戰爭解除洗點上限」，處於戰爭中的聯盟之間的攻擊也不計入。</li>
        </ul>
    '3':
      title: "重建保護"
      body: |-
        <p>預設關閉。如果宇宙啟用它（需要有新手保護），一位在單次戰鬥中失去大部分財產的玩家會獲得<b>重建保護</b>：艦隊和防禦價值損失超過 70&nbsp;%，或運輸容量損失超過 80&nbsp;%，並且至少達到一個跟隨新手保護上限的最低價值（最高 5,000,000 單位）。</p>
        <ul>
        <li>它在戰鬥後 3 小時開始（對攻擊他的玩家是 6 小時），並在戰鬥後 48 小時結束。這段期間他不能被攻擊。</li>
        <li>玩家可以提前結束它。</li>
        <li>每個月最多觸發一次，而且如果所有對手都與輸家有關聯（相同 IP、裝置或多帳號群組、聯盟、好友），就不會觸發。</li>
        </ul>
    '4':
      title: "假期模式"
      body: |-
        <p>假期模式會在你不在的時候凍結你的帳號。到<b>選項</b>裡啟用它。</p>
        <ul>
        <li>你必須<b>沒有艦隊</b>在飛行。</li>
        <li>所有行星的生產停止；你的佇列暫停，等你回來再繼續。駐守在你行星上的艦隊會被送回家。</li>
        <li>對你的敵對任務（攻擊、間諜、飛彈）會掉頭。</li>
        <li>必須過了最短時間才能離開（預設 48 小時）。</li>
        <li>你回來時，所有行星的生產會以 100&nbsp;% 重新開始。你不在的期間不會產出任何東西。</li>
        <li>如果宇宙啟用，處於假期模式且離線 28 天的玩家會被移出該模式。</li>
        </ul>
        <p>長期不活躍的帳號仍然會被刪除，不管有沒有開假期，見<a href="game/faq/11/2">不活躍與帳號刪除</a>。</p>
    '5':
      title: "灌資與交易限制"
      body: |-
        <p>灌資是指把資源或艦船餵給另一位玩家（通常是小號）。這違反規則，而且會被自動檢查。</p>
        <ul>
        <li>預設情況下，如果在過去 7 天內，你送給某位玩家的價值比他回送給你的多出超過 100,000（以重氫換算），那你對他的運輸、駐守或轉讓就會被拒絕。</li>
        <li>市集交易必須在宇宙的灌資容許範圍內（掛出和要求的價值必須接近）。</li>
        <li>使用相同 IP、裝置或多帳號群組的帳號會被關聯，並受到更嚴格的對待。</li>
        </ul>
        <p>宇宙的規則寫在規則頁面。</p>
  '11':
    category: "帳號與設定"
    icon: "user-cog"
    '1':
      title: "帳號設定"
      body: |-
        <p>打開<b>選項</b>可以設定：</p>
        <ul>
        <li><b>使用者資料</b>：使用者名稱（只能用字母和數字，每 7 天可更改一次）、電子信箱、新密碼（至少 8 個字元；更改時需要輸入目前的密碼）、語言、時區和主題。</li>
        <li><b>一般</b>：行星排序、把買不起的項目變暗、太空船廠篩選、合併間諜報告、訊息選項、封鎖私人訊息，以及<b>新手介面</b>（簡化的選單，隨著你完成教學逐步解鎖項目）。</li>
        <li><b>銀河系與間諜</b>：從銀河系檢視派出多少衛星，以及間諜報告多舊還算新鮮或近期。</li>
        <li><a href="game/faq/10/4">假期模式</a>和帳號刪除（「&quot;危險區域&quot;」）。</li>
        </ul>
    '2':
      title: "不活躍與帳號刪除"
      body: |-
        <ul>
        <li><b>7 天</b>沒登入，玩家會顯示為不活躍 (i)；<b>28 天</b>則顯示為長期不活躍 (I)。不活躍的玩家不受洗點上限保護，預設也不受以分數為基礎的保護。</li>
        <li>離線 <b>90 天</b>後（宇宙設定，0 = 永不），帳號會連同行星和艦隊被自動刪除。</li>
        <li>如果你在選項裡自行申請刪除，至少要等 7 天才會執行（宇宙設定）；期間你可以取消。</li>
        </ul>
    '3':
      title: "統計與分數"
      body: |-
        <p>統計頁面依總分，以及建築、研究、艦隊和防禦的分數，為玩家和聯盟排名。它們依排程更新，不是即時的。</p>
        <ul>
        <li>分數 = 投入的資源除以 1,000（預設；宇宙設定）。</li>
        <li>聯盟分數只計算 7 天內上過線的成員。</li>
        <li>紀錄顯示宇宙中最高的建築和研究等級。</li>
        <li>如果宇宙啟用，有些統計需要足夠的間諜科技才看得到。</li>
        </ul>
    '4':
      title: "更多協助"
      body: |-
        <!--wiki_url--><h2 id="wiki">Wiki 與社群</h2><p><a href="{wiki_url}/wiki/En/Hauptseite" target="_blank">Wiki 首頁</a>、<a href="{wiki_url}/wiki/En/Buildorder" target="_blank">建造順序</a>、<a href="{wiki_url}/wiki/En/Saven" target="_blank">艦隊保全</a>、<a href="{wiki_url}/wiki/En/Expoanleitung" target="_blank">遠征</a>。</p><!--/wiki_url-->
        <h2 id="support">客服</h2>
        <p>關於帳號的問題或錯誤回報：到<b>客服</b>頁面開一張單子。在你掠奪、交易或使用多個帳號之前，請先讀過<b>規則</b>頁面。</p>
