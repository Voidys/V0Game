se_noob_protection_multi_info: >-
  Csak olyan játékosokat támadhatsz, akiknek a pontszáma a te pontjaid × ez a
  tényező határán belül van. Példa 18-cal: ha 1000 pontod van, megtámadhatod a
  18 000 pontnál kevesebbel rendelkező játékosokat. Egy 20 000 pontos játékos
  bárkit megtámadhat 360 000 pontig, így egy 50 000 pontos játékos is a
  hatókörébe esik.
