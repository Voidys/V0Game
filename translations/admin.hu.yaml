se_planet_creation: Anyabolygó elhelyezése
se_planet_creation_info: >-
  Az új anyabolygók elhelyezhetők iteratívan a rendszereken és galaxisokon át,
  véletlenszerűen, blokkokban, vagy 50% véletlenszerűen és 50% blokkban.<br>A
  véletlenszerű elhelyezés egyenletesen, véletlen pozíciókon tölti fel a
  galaxisokat és rendszereket.<br>A blokkos elhelyezés olyan rendszert választ,
  amelyben már van egy vagy két bolygó. Ha nincs ilyen rendszer, vagy 50-nél
  kevesebb a játékos, az elhelyezés véletlenszerű.
