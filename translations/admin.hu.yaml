se_pow_adaptive: Botvédelem - adaptív nehézség
se_pow_adaptive_info: >-
  Be: a gyanús IP-címek és hálózatok (/24 vagy /64) sokkal nehezebb feladványt
  kapnak (sok kérés, hiba vagy regisztráció rövid időn belül). Ki: minden
  látogató az alapfeladványt kapja, és nem olvasunk számlálókat.
se_pow_elevated_factor: Botvédelem - tényező emelkedett kockázatnál
se_pow_elevated_factor_info: A feladvány ennyiszer nehezebb lesz (alapérték 20).
se_pow_high_factor: Botvédelem - tényező magas kockázatnál
se_pow_high_factor_info: A feladvány ennyiszer nehezebb lesz (alapérték 100).
se_pow_max_cap: Botvédelem - nehézségi plafon
se_pow_max_cap_info: >-
  A tényezők alkalmazása utáni legmagasabb szám. Az 1500000 egy lassú
  okostelefonon nagyjából 25 másodpercig tart.
se_pow_sensitivity: Botvédelem - kockázatészlelés érzékenysége
se_pow_sensitivity_info: >-
  Az alapküszöbök százaléka (emelkedett: IP-nként 10 percen belül 5 kéréstől,
  óránként 3 hibától vagy 24 órán belül 2 regisztrációtól; magas: 20 / 10 / 5-től;
  hálózatoknál háromszor annyi). 200 = kétszer annyi esemény kell, 50 = fele annyi.
se_pow_max_number: Botvédelem - nehézség (maximális szám)
se_pow_max_number_info: >-
  A böngésző eddig a számig próbál hasheket, átlagosan a felét. A 25000 jóval
  egy másodperc alatt van. Minél magasabb, annál több munka a botoknak.
se_pow_min_seconds: Botvédelem - minimális idő a beküldés előtt (másodperc)
se_pow_min_seconds_info: >-
  Az ennél gyorsabban, betöltés után beküldött űrlapokat elutasítjuk. A 0
  kikapcsolja az ellenőrzést.
se_proofofwork: Botvédelem
se_proofofwork_info: >-
  A regisztrációt és az elfelejtett jelszót egy apró számítás védi, amelyet a
  böngésző magától megold, harmadik fél nélkül.
se_rebuild_protection: Újjáépítési védelem
se_rebuild_protection_info: >-
  Nagy veszteségek után a játékosok 6 óra múlva újjáépítési védelmet kapnak a
  további támadások ellen, amely a támadástól számított 48 óráig tart. Egyetlen
  támadásban a flotta 70%-ának vagy a szállítókapacitás 80%-ának meg kell
  semmisülnie, és ennek a veszteségnek legalább az újoncvédelmi pontok × 1000
  egységnek vagy kapacitásnak kell lennie. A játékos korán befejezheti a módot.
