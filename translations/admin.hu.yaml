se_social: "Közösségi bejelentkezés"
se_social_info: "Lehetővé teszi, hogy a játékosok egy meglévő Discord-, Facebook-, GitHub- vagy Google-fiókkal jelentkezzenek be vagy regisztráljanak (OAuth2). Minden szolgáltató alapból ki van kapcsolva. Hozz létre egy alkalmazást a szolgáltatónál, regisztráld ott az alább látható callback URL-t, és add meg itt a kliensazonosítót és a titkot."
se_social_site_url_missing: "A játék alap-URL-je (DEFAULT_URI a .env.local fájlban) nincs beállítva, így nem építhető callback URL, és a szolgáltatók használhatatlanok maradnak."
se_social_incomplete: "Bekapcsolva, de hiányzik a kliensazonosító vagy a klienstitok: a bejelentkezési gomb rejtve marad."
se_social_enabled: "Engedélyezve"
se_social_enabled_info: "Megjeleníti a bejelentkezési gombot a kezdőlapon és a regisztrációs oldalon."
se_social_client_id: "Kliensazonosító"
se_social_client_id_info: "Az alkalmazás (kliens) azonosítója a szolgáltatónál."
se_social_client_secret: "Klienstitok"
se_social_client_secret_info: "Soha többé nem jelenik meg. Hagyd üresen a tárolt titok megtartásához."
se_social_callback: "Callback URL"
se_social_callback_info: "Pontosan ezt a címet regisztráld átirányítási / callback URL-ként a szolgáltatónál."
se_social_create_app: "Az alkalmazás létrehozása"
se_social_discord_help: "Discord Developer Portal: New Application, majd OAuth2: add hozzá az átirányítást, másold ki a kliensazonosítót és a kliens titkát."
se_social_facebook_help: "Meta for Developers: hozz létre egy alkalmazást a Facebook Login használati esettel, és add hozzá az URL-t az érvényes OAuth-átirányítási URI-k alatt. A Facebook e-mail-címét soha nem tekintjük ellenőrzöttnek: új játékosok nem regisztrálhatnak vele, a meglévő fiókokat nem párosítjuk e-mail alapján; a fiókbeállításokból való összekapcsolás működik."
se_social_github_help: "GitHub Settings, Developer settings, OAuth Apps: New OAuth App, add meg a callback URL-t az authorization callback URL-ként."
se_social_google_help: "Google Cloud Console, APIs and Services, Credentials: hozz létre egy Web application típusú OAuth-kliensazonosítót, és add hozzá a callback URL-t az authorized redirect URIs alatt."
se_social_scopes: "Kért hatókörök: %s"
se_del_user_automatic_on: "Inaktív játékosok automatikus törlése"
se_del_user_automatic_on_info: "Kapcsoló a normál inaktív játékosok (nem nyaralás módban lévők, nem kitiltottak) automatikus törléséhez a fent beállított napszám után. Ki: az inaktív játékosokat soha nem töröljük automatikusan."
se_del_user_vacation_on: "Nyaralás módban lévő játékosok automatikus törlése"
se_del_user_vacation_on_info: "Kapcsoló azoknak a játékosoknak az automatikus törléséhez, akik nyaralás módban vannak, és a lent megadott napszámig nem jelentkeztek be. Ki: a nyaralás módban lévő játékosokat soha nem töröljük automatikusan."
se_del_user_vacation: "Nyaralás módban lévő játékosok törlése ennyi után"
se_del_user_vacation_info: "Bejelentkezés nélküli napok, amelyek után egy nyaralás módban lévő játékost törlünk. 0 = ugyanannyi nap, mint az inaktív játékosoknál."
se_del_user_banned_on: "Kitiltott játékosok automatikus törlése"
se_del_user_banned_on_info: "Kapcsoló azoknak a kitiltott játékosoknak az automatikus törléséhez, akik a lent megadott napszámig nem jelentkeztek be. Ki: a kitiltott játékosokat soha nem töröljük automatikusan (a kitiltásuk megmarad)."
se_del_user_banned: "Kitiltott játékosok törlése ennyi után"
se_del_user_banned_info: "Bejelentkezés nélküli napok, amelyek után egy kitiltott játékost törlünk. 0 = ugyanannyi nap, mint az inaktív játékosoknál."
se_vmode_allow_incoming: "Nyaralás mód beérkező ellenséges flottákkal"
se_vmode_allow_incoming_info: "Be: a játékosok nyaralás módba léphetnek, miközben idegen flották tartanak feléjük (a támadás lepattan). Ki: a nyaralás módot megtagadjuk, amíg támadó, ACS-támadó, rakéta-, pusztító vagy kémküldetésű idegen flották tartanak a játékos egyik bolygója vagy Holdja felé."
rp_fleets_error: "Még repülnek játékosok flottái vagy hozzájuk tartó flották!"
abuse_reviews_menu: "Review queue"
abuse_reviews_title: "Anti-multi / push-trade review queue"
abuse_reviews_info: "Pairs are scored 0-100 from shared IP (30), shared device (30), multi group not marked known (20), same subnet (10), one-sided transfers (10-30), repeated skewed trades (10-20) and trade-graph cluster membership (15), refreshed hourly. Pairs from %s points are queued; a dismissed pair re-opens only when its score rises by 20 or more."
