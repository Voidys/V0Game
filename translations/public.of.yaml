registerWelcomePMText: 'Willgommne bei %s! Baue zuerschd a Solargraftwerg, den Energie wird für die sbätere Rohstoffprodugtion benödigd und alles. Um diese zu baune, kligge lings im Menu uff *ferstellt Schdimme:* "Äh, Gebäude". Danach baue des 4. Gebäude von obne alda. Da du nun Energie haschd, gannst du anfangne Minene zu baune tadsächlich sogar. Gehe dazu widda im Menü uff Gebäude und baue ne Medallmine, danach scho widder ne Gristallmine hätt ich gsachd. Um Schiffe baune zu gönnene musschd du zuerschd ne Raumschiffswerfd gebaud habne alde. Was dafür benödigd wird findeschd du lings im Menüpungt Dechnologie tadsächlich sogar. Das Deam wünschd dir wiel Schbaß beim Ergundne des Uniwersums alda! '
