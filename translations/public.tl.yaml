home_team: Team
home_meme_alt: Comic meme mula sa command deck ng {game_name}
home_meme_alt_deep_space_transit: 'Comic: dalawang cadet sa isang shuttle – ang isa ay napaupo sa panghihina sa nakitang asteroid field, ang isa naman ay nakangiti sa kumikinang na nebula. “Karaniwang patrol sa sector vs. pagkakatuklas ng hindi pa nasasaliksik na nebula na mayaman sa resource.”'
home_meme_alt_deuterium_joyride: 'Comic: isang pagod na commander sa observation deck ang nanonood sa dalawang recruit na lumulutang sa labas – “Pinapanood ang mga bagong recruit na ubusin ang lahat ng Deuterium nila sa joyride sa labas habang naghihintay ako ng 12 oras para sa mga upgrade ng mine ko.”'
home_meme_alt_enemy_fleet: 'Comic: hawak ng isang cadet ang ulo niya sa pagkataranta habang kumikislap ang mga alarm – “1000 kalabang destroyer ang paparating?! Akala ko ligtas ang sector na ito?!”'
home_meme_alt_fleet_decimated: 'Comic: isang sundalong gulat na gulat ang nakatitig habang sumasabog ang mga barko sa labas ng basag na dome – “Kapag 20 oras kang nag-farm ng resource tapos biglang dumating ang fleet ng isang top 3 player at winasak ang lahat sa loob ng 3 segundo.”'
home_meme_alt_solo_scouting: 'Comic: nakangiti si Commander Kamioka at ipinatong ang robotic niyang kamay sa balikat ng isang cadet – “Huwag kang mag-alala, cadet. ‘Buong-buo’ ang tiwala ng High Command sa solo scouting mission mo sa kalawakan.”'
home_meme_alt_this_is_fine: 'Comic: isang aso sa space suit ang kalmadong nakaupo sa nasusunog na command hub at nagsabing “This is fine” – “Huwag kang mag-alala. 4 na oras lang namang huli ang balik ng fleet ko.”'
