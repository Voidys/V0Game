home_meme_alt: 'Comic meme from the {game_name} command deck'
home_meme_alt_deep_space_transit: "Comic: two cadets in a shuttle – one slumps at the sight of an asteroid field, the other grins at a glowing nebula. “Standard sector patrols vs. finding an unexplored resource-rich nebula.”"
home_meme_alt_deuterium_joyride: "Comic: a weary commander on the observation deck watches two recruits float around outside – “Watching the new recruits waste all their Deuterium joyriding outside while I wait 12 hours for mine upgrades.”"
home_meme_alt_enemy_fleet: "Comic: a cadet clutches his head in panic as alarms flash – “1000 enemy destroyers inbound?! I thought this sector was safe?!”"
home_meme_alt_fleet_decimated: "Comic: a shell-shocked soldier stares ahead while ships explode outside a shattered dome – “When you spend 20 hours farming resources only for a top 3 player’s fleet to jump in and dismantle everything in 3 seconds.”"
home_meme_alt_solo_scouting: "Comic: Commander Kamioka grins and rests a robotic hand on a cadet’s shoulder – “Don’t worry, cadet. High Command has ‘complete’ confidence in your solo scouting mission into Space.”"
home_meme_alt_this_is_fine: "Comic: a dog in a space suit sits calmly in a burning command hub and says “This is fine” – “Don’t worry. My fleet is only 4 hours late returning.”"
