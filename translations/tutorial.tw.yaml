tutorial_text:
  step0: "歡迎來到 {game_name}！<br><br>\r\n這個簡短的教學會帶你熟悉基本操作。<br>\r\n我們常常會連到 Wiki，因為教學塞不下所有內容。你隨時都能從左邊選單打開它。<br>\r\n你可以隨時跳過教學，但跳過之後就不能重來了。<br><br>\r\n祝你好運，帝國領袖！"
  step1: "你的目標：盡可能拿到最多分數。每花掉 1,000 單位資源就能得 1 分，而最好的資源來源就是你自己的礦場。<br>\r\n先從基本補給開始：你需要金屬礦和晶體礦產出金屬與晶體，還要太陽能發電廠供電讓它們運轉。能源不夠的話，礦場的產量就會低於 100%。<br>\r\n到<b>建築</b>選單升級這些建築。點建築名稱就能看到下一級的效果，以及會多吃多少能源。<br><br>\r\n想知道更多？去看看 <b>Wiki</b>： \r\n<a href=\"{wiki_url}/wiki/En/Rohstoffe\" target=\"_blank\">資源</a>"
  step2: "一起玩更好玩。大多數玩家都窩在我們的 Discord，你可以在那裡得到解答，也能找到一起玩的夥伴。<br>\r\n還是卡關？你也可以在這裡開一張客服單。"
  step3: "掠奪其他玩家的行星也是拿資源的方法，而且你自己也可能被掠奪。所以快蓋第一批防禦吧！<br>\r\n就算只有一點點防禦，也能在你睡覺時保護你的產出。<br><br>\r\n勝負不只看數量，進攻艦隊的組成也很重要。<br>\r\n攻擊方得先突破你的防禦才能搶東西，而每多派一艘船，利潤就少一點，還可能折更多船。<br>\r\n在<b>防禦</b>選單蓋防禦設施。你需要太空船廠（它又要先有機器人工廠）和一些重氫。<br><br>\r\n這是 Wiki 上對應的文章： \r\n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">防禦設施</a>"
  step4: "擴建礦場，讓補給源源不絕！<br>\r\n建築、艦船、防禦和研究的成本會越來越高，所以你的產量也得跟著成長。現在就打開建築選單，有資源就升級礦場。"
  step5: "幫自己造一艘小型運輸艦吧！<br>\r\n小型運輸艦速度快，用起來又順手。<br>\r\n裝上脈衝引擎後，長距離飛行比大型運輸艦還快。<br>\r\n拿它在行星之間搬資源、跟其他玩家交易，或是去搶別人。<br><br>\r\nWiki 上有更多： \r\n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">艦船</a>"
  step6: "幫你的行星取個名字，才不會搞混。在總覽頁面，點分數顯示區標題裡的行星名稱就能改。快試試看吧。<br><br>\r\n你也可以向其他玩家送出好友邀請。對方接受後，聊天更方便，也能看到彼此的上線狀態。不用加入同一個聯盟就能這樣做。好友還能把艦隊駐守在彼此的行星上，不用結盟也能一起防守。<br><br>\r\n或者加入聯盟，組隊一起玩。駐守艦隊就不用再另外送好友邀請了。在聯盟裡你可以發送群體訊息，並依你的聯盟階級查看其他成員的上線狀態和分數。"
  step7: "想知道其他玩家有什麼資源、建築、研究、艦船和防禦，就得去偵查他們。從艦隊選單或銀河系檢視，派一艘間諜衛星過去。<br>\r\n記得，別人也可以偵查你喔！"
  step8: >-
    遠征可能帶回資源、艦船、特殊事件，也可能慘賠。想試試的話，帶一艘船，在艦隊選單選行星位置 16 當目標，任務選「遠征」。<br>

    每種艦船都會增加遠征艦隊的規模，直到達到事件規模的上限。<br><br>

    Wiki 說明了要怎麼調整才能把收益拉到最高： 

    <a href="{wiki_url}/wiki/En/Expoanleitung"
    target="_blank">遠征</a>
  step9: "殖民的行星越多，成長越快：你可以同時在多顆行星上產資源、造艦船。注意，天體物理學等級夠高，才能殖民星系的內側或外側邊緣。殖民船本身不需要天體物理學就能造，但你的第一個殖民地需要它！<br><br>\r\n在自己的星系或隔壁星系殖民，運輸路線會比較短。缺點是：遊戲後期，別人可能不是為了礦場，而是把你星系裡的殖民地當成暫時的艦隊基地，也就是所謂的突襲殖民地。<br><br>\r\nWiki 上有更多： \r\n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">天體物理學</a>"
  step10: "想更快拿到資源？去攻擊其他玩家。算清楚成本和收益，攻擊才划算，並利用間諜報告和戰鬥模擬器來規劃。<br><br>\r\n小心！其他玩家有各種方法追蹤很多艦隊任務。<br>\r\n別把辛苦累積的艦隊賠掉，是這遊戲最重要的課題之一。<br><br>\r\n一定要讀這幾篇 Wiki 主題： \r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">艦隊保全</a> - \r\n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">感應密集陣</a>"
  step10_u6: >-
    想更快拿到資源？去攻擊其他玩家。算清楚成本和收益，攻擊才划算，並利用間諜報告和戰鬥模擬器來規劃。<br><br>

    小心！其他玩家有各種方法追蹤很多艦隊任務。<br>

    別把辛苦累積的艦隊賠掉，是這遊戲最重要的課題之一。<br><br>

    一定要讀這幾篇 Wiki 主題：

    <a
    href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden"
    target="_blank">艦隊保全</a>
  step11: "艦隊被擊毀後會留下殘骸場，你可以去收割。這需要回收船，每艘的載貨量是 20,000。把一支大艦隊轟成渣，可能是很肥的資源來源。<br><br>\r\n你也可以直接在銀河系檢視點殘骸場來派出回收船，不用經過艦隊選單。"
  step12: "恭喜，你完成教學了！<br><br>\r\n遊戲裡還有很多東西等著你。<br>\r\n舉例來說，大致有三種玩法，花的時間也不一樣：<br>\r\n<ul>\r\n<li>礦工：在很多殖民地擴建礦場，主要飛運輸艦</li>\r\n<li>艦隊流：大部分分數投入戰艦，自己幾乎不生產，靠掠奪其他玩家過活</li>\r\n<li>混合流：兩者兼顧</li>\r\n</ul>\r\n月球在遊戲後期會變得很重要，到這時你應該已經見識過感應密集陣了。<br><br>\r\n還有問題？去讀 Wiki，或是到 Discord 問社群。"
  step12_u6: >-
    恭喜，你完成教學了！<br><br>

    遊戲裡還有很多東西等著你。<br>

    舉例來說，大致有三種玩法，花的時間也不一樣：<br>

    <ul>

    <li>礦工：在很多殖民地擴建礦場，主要飛運輸艦</li>

    <li>艦隊流：大部分分數投入戰艦，自己幾乎不生產，靠掠奪其他玩家過活</li>

    <li>混合流：兩者兼顧</li>

    </ul>

    還有問題？去讀 Wiki，或是到 Discord 問社群。
