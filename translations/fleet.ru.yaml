sys_expe_found_ress_1_1: Твоя экспедиция обнаружила небольшое скопление астероидов, откуда удалось добыть немного ресурсов.
sys_expe_found_ress_1_2: На далёком планетоиде нашлось несколько легкодоступных залежей, и ресурсы были успешно добыты.
sys_expe_found_ress_1_3: Твоя экспедиция наткнулась на очень старые обломки кораблей давно отгремевшей битвы. Отдельные детали удалось собрать и переработать.
sys_expe_found_ress_1_4: Экспедиция обнаружила планету с радиоактивным заражением и крайне ядовитой атмосферой. Однако сканирование показало, что на ней много сырья. Автоматические дроны постарались добыть как можно больше ресурсов.
sys_expe_found_ress_2_1: Твоя экспедиция нашла древний грузовой конвой, полностью гружёный, но брошенный. Часть ресурсов удалось забрать.
sys_expe_found_ress_2_2: На небольшой луне с собственной атмосферой твоя экспедиция нашла богатые залежи сырья. Экипаж сейчас добывает это сокровище.
sys_expe_found_ress_2_3: Мы встретили небольшой конвой гражданских кораблей, которым срочно нужны были еда и лекарства. В обмен мы получили немало полезных ресурсов.
sys_expe_found_ress_3_1: Твой экспедиционный флот сообщает об огромном обломке инопланетного корабля. Разобраться в его технологиях не вышло, зато корабль удалось разобрать на детали и получить ценное сырьё.
sys_expe_found_ress_3_2: Пояс астероидов вокруг неизвестной планеты оказался богат сырьём. Экспедиционный флот забил трюмы под завязку!
sys_expe_found_ress_logbook_1: "Запись из бортового журнала первого офицера: Мы использовали каждый свободный уголок, но забрать все найденные ресурсы всё равно не смогли."
sys_expe_found_ress_logbook_2: "Запись из бортового журнала первого офицера: Будь у нас ещё пара транспортов! А так приходится оставлять кучу ресурсов."
sys_expe_found_ress_logbook_3: "Запись из бортового журнала первого офицера: Мы уже выбросили всё ненужное, но места для всех найденных ресурсов всё равно не хватает."
sys_expe_found_ress_logbook_4: "Запись из бортового журнала первого офицера: Даже когда мы переделали столовую и все кают-компании в склады, увезти все найденные ресурсы не получилось."
sys_expe_found_ships_1_1: Мы наткнулись на остатки предыдущей экспедиции! Наши техники проверяют, можно ли вернуть в строй какие-то из обломков.
sys_expe_found_ships_1_2: Мы нашли заброшенную пиратскую базу. В ангаре ещё стоят старые корабли. Наши техники проверяют, нельзя ли какие-то из них снова поднять в воздух.
sys_expe_found_ships_1_3: Наша экспедиция нашла планету, почти полностью разрушенную войнами. На орбите дрейфовали обломки разных кораблей. Техники попытались починить часть из них. Возможно, мы узнаем больше о том, что здесь произошло.
sys_expe_found_ships_1_4: Экспедиция наткнулась на старую космическую базу, которую, похоже, покинули целую вечность назад. В ангаре крепости нашлось несколько кораблей. Техникам удалось снова поднять часть из них в воздух.
sys_expe_found_ships_2_1: Мы нашли остатки армады. Техники экспедиции сразу перебрались на частично уцелевшие корабли и сумели отремонтировать некоторые из них.
sys_expe_found_ships_2_2: "Наша экспедиция обнаружила старую автоматическую верфь: часть кораблей на ней всё ещё в производстве. Когда техники восстановили энергоснабжение верфи, они взялись достраивать их."
sys_expe_found_ships_3_1: Мы нашли огромное кладбище кораблей. Техникам экспедиции удалось вернуть в строй один-два корабля.
sys_expe_found_ships_3_2: Мы обнаружили планету с остатками цивилизации. Из космоса видна ещё одна гигантская корабельная станция, которая сохранилась целой. Часть наших техников и пилотов отправилась на поверхность, чтобы выяснить, можно ли вернуть в строй пару кораблей.
sys_expe_found_ships_logbook_1: "Запись из бортового журнала инженера: Возьми мы с собой побольше кораблей, мы бы легко утащили домой часть этих красавцев!"
sys_expe_found_ships_logbook_2: "Запись из бортового журнала инженера: К сожалению, у нас не хватило вместимости, чтобы забрать все корабли, найденные за эту экспедицию."
sys_expe_found_ships_logbook_3: "Запись из бортового журнала инженера: К сожалению, у нас не хватает места, чтобы забрать с собой все найденные корабли."
sys_expe_found_ships_nothing: Не удалось найти ни одного корабля.
sys_expe_lost_fleet_1: "От экспедиции осталась только такая радиограмма: Ззззрт, о боже!.. Кррррзззт... зззрртрзт видит ккргззз да, как Крззззззтззз..."
sys_expe_lost_fleet_2: Последнее, что мы получили от экспедиции, — потрясающие крупные планы раскрывающейся чёрной дыры.
sys_expe_lost_fleet_3: Ядерная авария на одном из командных кораблей вызвала цепную реакцию, и вся экспедиция погибла в зрелищном взрыве.
sys_expe_lost_fleet_4: Экспедиционный флот не вернулся из гиперпространственного прыжка. Учёные всё ещё ломают голову, что могло случиться, но флот, похоже, потерян навсегда.
sys_expe_nothing_1: Ничего захватывающего экспедиция не привезла — разве что пару любопытных зверушек с неизвестной болотистой планеты.
sys_expe_nothing_2: Твоя экспедиция сделала красивые снимки сверхновой. Новых знаний она, правда, не принесла. Зато есть хорошие шансы выиграть в этом году конкурс «Лучший снимок Вселенной».
sys_expe_nothing_3: Вскоре после вылета из звёздной системы странный компьютерный вирус вывел из строя навигацию. Из-за этого весь экспедиционный флот всё время летал по кругу. Нечего и говорить, что экспедиция вышла не слишком удачной.
sys_expe_nothing_4: Форма жизни из чистой энергии заставила всех участников экспедиции несколько дней пялиться на гипнотические символы на экранах. Когда большинство наконец пришло в себя, экспедицию пришлось прервать из-за нехватки дейтерия.
sys_expe_nothing_5: Что ж, теперь мы хотя бы знаем, что красные аномалии 5-го класса не только хаотично влияют на корабельные системы, но и вызывают у экипажа массовые галлюцинации. Больше эта экспедиция, к сожалению, ничего не обнаружила.
sys_expe_nothing_6: Несмотря на многообещающие первые сканирования этого сектора, мы, к сожалению, вернулись с пустыми руками.
sys_expe_nothing_7: Возможно, день рождения капитана не стоило праздновать на этой далёкой планете. Мерзкая геморрагическая лихорадка уложила большую часть экипажа в лазарет, и острая нехватка людей поставила крест на экспедиции.
sys_expe_nothing_8: Твоя экспедиция не нашла ничего, кроме бескрайней космической пустоты. Не было даже крошечного астероида, излучения, частиц или чего-нибудь ещё, что хоть немного оживило бы этот полёт.
sys_expe_nothing_9: Неполадка реактора на командном корабле чуть не уничтожила всю экспедицию. К счастью, техники оказались на высоте и предотвратили худшее. Но ремонт занял столько времени, что экспедиция вернулась ни с чем.
sys_expe_report: Отчёт об экспедиции
sys_expe_report_msg: "Отчёт об экспедиции флота %s %s на %s:"
sys_expe_time_fast_1: Непредвиденная обратная связь в энергетических катушках двигателей ускорила возвращение экспедиции, и она прилетит раньше срока. Первые сообщения говорят, что больше докладывать нечего.
sys_expe_time_fast_2: Довольно дерзкий новый командир использовал нестабильную червоточину, чтобы сократить обратный путь, и успешно! Но сама экспедиция ничего нового не принесла.
sys_expe_time_fast_3: Твоя экспедиция не обнаружила аномалий в исследованном секторе. Зато на обратном пути флот попал в солнечный ветер, который заметно ускорил полёт. Теперь экспедиция вернётся домой немного раньше срока.
sys_expe_time_slow_1: Серьёзный промах навигатора занёс флот совсем не туда. Обратный путь из-за этого занял заметно больше времени.
sys_expe_time_slow_2: По неизвестным причинам прыжок флота пошёл совсем не так. Они чуть не вынырнули в сердце звезды! К счастью, флот оказался в знакомой системе, но обратный путь займёт больше времени, чем планировалось.
sys_expe_time_slow_3: Новый навигационный модуль, похоже, всё ещё страдает от багов. Экспедиционный флот не только полетел совсем в другую сторону, но и израсходовал весь дейтерий! Разочарованная экспедиция возвращается на резервной тяге.
sys_expe_time_slow_4: Твоя экспедиция вошла в сектор с усиленными штормами частиц. Они перегрузили накопители энергии, и основные системы всех кораблей отказали. Механики сумели предотвратить худшее, но экспедиция вернётся со значительной задержкой.
sys_expe_time_slow_5: "Флагман твоего экспедиционного флота столкнулся с инопланетным кораблём, который без предупреждения выпрыгнул прямо в строй флота. Чужой корабль взорвался, а флагман получил серьёзные повреждения. Как только самый срочный ремонт будет закончен, твои корабли отправятся домой: в таком состоянии экспедиция продолжаться не может."
sys_expe_time_slow_6: Звёздный ветер красного гиганта исказил прыжок экспедиции, и навигационные системы совершенно неверно рассчитали обратный путь. В итоге экспедиция оказалась в бескрайней пустоте между незнакомыми звёздами.
