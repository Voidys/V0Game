sys_expe_attack_1_1_1: Отчаявшийся космический пират попытался угнать наш экспедиционный флот.
sys_expe_attack_1_1_2: Какие-то примитивные варвары напали на нас на космических кораблях. Правда, корабли у них в ужасном состоянии. Будь их огневая мощь серьёзной угрозой, нам пришлось бы ответить огнём.
sys_expe_attack_1_1_3: Мы перехватили пару радиограмм сильно подвыпивших пиратов. Похоже, на нас собираются напасть.
sys_expe_attack_1_1_4: Пришлось отбиваться от нескольких пиратов, но, к счастью, нас было больше.
sys_expe_attack_1_1_5: Наш флот докладывает, что некий Моа Тикарр со своей командой потребовал безоговорочной капитуляции. Если они не шутят, то скоро узнают, что мы умеем отлично защищаться.
sys_expe_attack_1_2_1: Твой экспедиционный флот неожиданно столкнулся с космическими пиратами.
sys_expe_attack_1_2_2: Мы угодили в засаду звёздных пиратов! К сожалению, боя было не избежать.
sys_expe_attack_1_2_3: Призыв о помощи от другого экспедиционного флота оказался ловушкой хитрых пиратов. Бой был неизбежен.
sys_expe_attack_1_3_1: Перехваченные сигналы шли не от неизвестных инопланетян, а с тайной пиратской базы! Пираты были не слишком рады нашему присутствию в их секторе.
sys_expe_attack_1_3_2: Экспедиционный флот сообщает об ожесточённых боях с неопознанными пиратскими кораблями!
sys_expe_attack_1_3_3: "Мы только что получили срочное сообщение от командира экспедиции: «Они идут на нас! Выпрыгнули из гиперпространства... К счастью, это всего лишь пираты, так что шансы у нас есть. Будем драться!»"
sys_expe_attack_2_1_1: У твоего экспедиционного флота вышел недружелюбный первый контакт с неизвестной расой.
sys_expe_attack_2_1_2: Какие-то странные корабли без предупреждения напали на экспедиционный флот!
sys_expe_attack_2_1_3: На нашу экспедицию напала небольшая группа неопознанных космических кораблей!
sys_expe_attack_2_1_4: Экспедиционный флот сообщил о контакте с неизвестными кораблями. Радиопередачи расшифровать не удаётся, но чужие корабли, похоже, приводят оружие в боевую готовность.
sys_expe_attack_2_2_1: Неизвестные существа напали на нашу экспедицию!
sys_expe_attack_2_2_2: Твой экспедиционный флот, судя по всему, нарушил границы владений неизвестной ранее, но крайне агрессивной инопланетной расы.
sys_expe_attack_2_2_3: "Связь с нашим экспедиционным флотом внезапно оборвалась. Последнее, что мы слышали: флот попал под шквальный огонь. Нападавших опознать не удалось."
sys_expe_attack_2_3_1: Твоя экспедиция столкнулась с флотом вторжения чужих и сообщает о грандиозных сражениях!
sys_expe_attack_2_3_2: Большая группа кристаллических кораблей неизвестного происхождения идёт прямым курсом на наш экспедиционный флот. Готовимся к худшему.
sys_expe_attack_2_3_3: Нам не сразу удалось правильно произнести слова на диалекте инопланетной расы. Наш дипломат случайно крикнул «Огонь!» вместо «Мир!»
