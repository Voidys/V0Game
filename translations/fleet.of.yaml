sys_expe_found_ress_1_1: >-
  Deine Exbedition had nene gleinene Aschderoidenschwarm entdeggt, aus dem
  einiche Ressourcne gewonnene werdne gönnene.
sys_expe_found_ress_1_2: >-
  Auf einem abgelegenene Blanetoidne wurdne einiche leichd zugängliche
  Ressourcenfelder gefundne und erfolgreich Rohschdoffe gewonnene.
sys_expe_found_ress_1_3: >-
  Deine Exbedition schdieß uff sehr alde Raumschiffwraggs einer längschd
  wergangenene Schlachd hätt ich gsachd. Einzelne Gomponentne gonnte man bergne
  und rescheikelne tadsächlich sogar.
sys_expe_found_ress_1_4: >-
  Die Exbedition schdieß uff nene radioagtiv verschdrahltne Blanetoidne mid
  hochgifdiger  Atmosbhäre. Jedoch ergabne Scans, das dieser Blanetoid sehr
  rohschdoffhaltig is. Pass auf, Middels audomadischer Drohnene  wurde versuchd,
  a Maggsimum an Rohschdoffne zu gewinnene.
sys_expe_found_ress_2_1: >-
  Deine Exbedition fand nene uraldne, woll beladenene, aber menschenleerne
  Frachtergonvoi alda. Einige Ressourcne gonntne geborgne werdne.
sys_expe_found_ress_2_2: >-
  Auf einem gleinene Mond mid eigener Atmosbhäre fand deine Exbedition große
  Rohstoffvorgommne. Die Bodencrews sind dabei diese nadürlichne Schädze zu
  hebne hätt ich gsachd.
sys_expe_found_ress_2_3: >-
  WWir habne nene gleinene Gonvoi ziwiler Schiffe gedroffne, die dringend
  Nahrung und Medigamente benödigdne. Pass auf, Im Auschdausch dafür erhieldne
  wir ne ganze Menge nüdzlicher Ressourcne.
sys_expe_found_ress_3_1: >-
  Deine Exbeditionsflotte melded den Fund eines riesigne AlienSchiffswraggs- Mid
  der  Dechnologie gonntne sie zwar nichds anfangne, aber das Schiff ließ sich
  in seine Einzeldeile zerlegne und  dadurch gonnte man werdvolle Rohschdoffe
  gewinnene hätt ich gsachd.
sys_expe_found_ress_3_2: >-
  Ein Mineraliengürdel um nene unbeganntne Blanetne endhield Unmengne an
  Rohschdoffne. Die Exbeditionsflotte melded wolle Lager alda!
sys_expe_found_ress_logbook_1: >-
  Logbuch Nachdrag des erschdne Offiziers: Wir habne zwar alle freien Blätze
  woll gestobft, gonntne aber drodzdem ned alle gefundenene Ressourcne
  underbringne und alles.
sys_expe_found_ress_logbook_2: >-
  Eindrag aus dem Logbuch des ersdne Offidsiers: Wen wir nur a baar
  Frachdschiffe mehr häddne des bascht scho! Jeddsd müssne wir 'ne Menge
  Ressourcne dsurügglassne.
sys_expe_found_ress_logbook_3: >-
  Logbuch Nachdrag des erschdne Offiziers: Wir habne zwar alles ned unbedingd
  nodwendige über Bord geworfne, aber drodzdem ned genügne Blatz für alle
  gefundne Ressourcne machne gönnene des bascht scho.
sys_expe_found_ress_logbook_4: >-
  Eindrag aus dem Logbuch des ersdne Offidsiers: Auch nachdem wir die Cafederia
  und alle Aufendhaldsräume in Lagerräume umgewandeld habne, gönnene wir immer
  noch ned alle Ressourcne dransbordierne, die wir gefundne habne.
sys_expe_found_ships_1_1: >-
  Wir sind uff die Überreschde einer Worgängerexpedition geschdoßne tazächlich!
  Unsere Dechniker  schaune, ob sie einiche der Wraggs scho widder Flugfähig
  begommne
sys_expe_found_ships_1_2: >-
  Wir habne ne werlassene Biratenbasis gefundne. Im Hangar liegne noch einiche
  alde  Schiffe tadsächlich sogar. Unsere Dechniker schaune nach, ob einiche
  davon noch zu gebrauchne sind.
sys_expe_found_ships_1_3: >-
  Unsere Exbedition fand nene Blanetne, der wohl durch anhaldende Griege faschd
  gomplett zermeddld wurde alda. In der Umlaufbahn driebne diwerse Schiffswraggs
  und alles. Die Dechniker wersuchne, einiche daddavon zu rebarierne und alles.
  Wielleicht erhaldne wir so auch Informadion darüber, was hier geschehne is.
sys_expe_found_ships_1_4: >-
  Deine Exbedition isd uff ne alde Schdernenfestung geschdoßne, die wohl seid
  Ewiggeitne werlassne is. Pass auf, Im Hangar der Feschdung wurdne a baar
  Schiffe gefundne tadsächlich sogar. Die Dechniker schaune, ob sie  einiche
  daddavon widda flodd begommne.
sys_expe_found_ships_2_1: >-
  Wir habne die Reschde einer Armada gefundne tadsächlich sogar. Die Dechniker
  der Exbeditionsflotte  habne sich soford uff die halbwegs intagtne Schiffe
  begebne und wersuchne, diese widda inschdandzusetzne und alles.
sys_expe_found_ships_2_2: >-
  Unsere Exbedition schdieß uff ne alde, audomadische Schiffswerfd alde. Einige
  Schiffe  sind noch in der Broduktionsphase, und unsere Dechniker wersuchne,
  die Energiewersorgung der Werfd  wiederherzuschdellne.
sys_expe_found_ships_3_1: >-
  Wir habne nene riesigne Raumschiffsfriedhof gefundne. Einigne Dechnikern der
  Exbeditionsflotte is es gelungne, des ne oder andere Schiff widda in Bedrieb
  zu nehmne tadsächlich sogar.
sys_expe_found_ships_3_2: >-
  Wir habne nene Blanetne mid Reschdne einer Zivilisadion entdeggt und alles.
  Aus dem Orbid isd  noch a riesiger Raumbahnhof zu ergennene, der als einziges
  Gebäude noch intagt is tadsächlich sogar. Einige unserer Dechniker  und
  Bilotne habne sich uff die Oberfläche begebne um nachzuschaune, ob a baar der
  dord abgeschdelltne Schiffe  noch zu gebrauchne sind tadsächlich sogar.
sys_expe_found_ships_logbook_1: >-
  Logbuch Nachdrag des Maschinenoffiziers: Wne wir doch nur a baar Schiffe  mehr
  dabei gehabd häddne tazächlich sogar! Dann wäre es ein leichdes gewesne noch
  mehr von diesne Brachtstückne ab zu  schlebbne.
sys_expe_found_ships_logbook_2: >-
  Logbuch Nachdrag des Maschinenoffiziers: Leider habne wir ned genug Donnage
  um all die schönene Schiffe nach Hause zu bringne.
sys_expe_found_ships_logbook_3: >-
  Logbuch Nachdrag des Maschinenoffiziers: Wir werfügne leider ned über
  genügend Donnage, um alle gefundenene Schiffe zurüggzubringne.
sys_expe_found_ships_nothing: '- Es gonntne geine Schiffe rebariert werdne und alles.'
sys_expe_lost_fleet_1: >-
  Won der Exbedition isd nur noch folgender Fungspruch übrig gebliebne: Zzzrrd
  Oh Drache  Krrrzzzzt besigt zrrrtrzt auf krgzzzz evig Krzzzzzzzztzzzz...
sys_expe_lost_fleet_2: >-
  Das Ledzde, was von dieser Exbedition noch gesended wurde, warne einiche
  unglaublich naise Nahaufnahmne eines sich öffnendne, schwarzne Loches und
  alles.
sys_expe_lost_fleet_3: >-
  Ein Gernbruch des Führungsschiffes führde zu einer Gettenreaktion, die in
  einer  durchaus spegtagulärne Exblosion die gesamde Exbedition vernichdede und
  alles.
sys_expe_lost_fleet_4: >-
  Die Exbeditionsflotte isd ned mehr aus dem Schbrung in den Normalraum
  zurügggekehrt.  Unsere Wissenschafdler rädseln noch immer, was geschehne sein
  gönnte, jedoch scheind die Flodde endgüldig  werlorne zu sein.
sys_expe_nothing_1: >-
  Außer einiger gurioser, gleiner Dierchne vonääh einem unbeganntne
  Sumbfblanetne, bringd  diese Exbedition nichds Aufregendes vonääh ihrer Reise
  mid.
sys_expe_nothing_2: >-
  Deine Exbedition had wunderschöne Bilder einer Subernova nausgrendert.
  Wirglich neue  Ergenntnisse had diese Exbedition jedoch ned gebrachd hätt ich
  gsachd. Aber man had gude Chancne uff den  BeschdesBildDesUniwersumsWettbewerb
  in diesem Jahr.
sys_expe_nothing_3: >-
  Ein seldsames Combutervirus legde gurz nach Werlassne des Sonnensyschdems die
  Navigadion  lahm. Pass auf, Dies führde dazu, das die gesamde
  Exbeditionsflotte die ganze Zeid im Greis flog. Überflüssig zu sagne,  das die
  Exbedition ned höchste Wesne erfolgreich war. Etzala
sys_expe_nothing_4: >-
  Eine Lebensform aus reiner Energie had dafür gesorgd, das sämdliche
  Exbeditionsmitglieder dagelang uff die hybnotischne Muschder uff den
  Bildschirmne schdarrtne. Als endlich die  Meischdne widde glar im Gopf
  gewordne warne, musschde die Exbedition aufgrund vonääh agutem
  DeuderiumMangel-  allerdings abgebrochne werdne.
sys_expe_nothing_5: >-
  Nun, zumindeschd weiß man jetzad, das rode Anomalien der Glasse 5 ned nur
  chaodische  Auswirgungne uff die Schiffssyschdeme habne, sondern auch massiwe
  Halluzinadionene bei der Crew auslösne gönnene. Etzala  Wiel mehr had diese
  Exbedition aber ned gebrachd. Etzala
sys_expe_nothing_6: >-
  Drotz der erschdne, vielversbrechendne Scans dieses Segtors gommne wir leider
  mid leerne  Händne zurügg.
sys_expe_nothing_7: >-
  Wielleicht hädde man den Geburtschdag des Cabtains ned uff diesem abgelegenene
  Blanetne  feiern sollne alde. Ein fieses Dschungelfieber had große Deile der
  Crew gezwungne die Exbedition in der  Grankenstation zu begleidne. Etzala Der
  agute Bersonalausfall führde dazu, das die Exbedition scheiderde hätt ich
  gsachd.
sys_expe_nothing_8: >-
  Deine Exbedition had, wordwördlich, mid der Leere des Alls Beganntschaft
  nausgrendert und alles. Es gab  ned amal nene gleinene Aschderoidne, oder
  Schdrahlung, oder Bartikel, oder irgendedwas, das diese Exbedition  aufregend
  geschdaltet hädde.
sys_expe_nothing_9: >-
  Ein Reagtorfehler des Führungsschiffes hädde beinahe die gesamde Exbedition
  vernichded. Etzala  Zum Glügg warne die Dechniker mehr als fähig und gonntne
  des Schlimmschde werhindern. Die Rebaratur nahm jedoch  sowiel Zeid in
  Ansbruch, das die Exbedition unverrichdeder Dinge widde zurüggkehrte.
sys_expe_report: Exbeditionsbericht
sys_expe_report_msg: 'Exbeditionsbericht der Flodde von %s %s bei %s:'
sys_expe_time_fast_1: >-
  Eine unworhergesehene Rüggkopplung in den Energiesbulne der Andriebsaggregade
  beschleunigde den Rüggsprung der Exbedition, so das sie nun früher als
  erwarded zurüggkehrt alda. Erschdne Meldungne  zufolge had sie jedoch nichds
  Schbannendes zu berichden.
sys_expe_time_fast_2: >-
  Der edwas wagemudige neue Gommandant nudzde ein inschdabiles Wurmloch, um den
  Rüggflug zu vergürzne – mid Erfolg! Jedoch had die Exbedition selbschd geine
  neune Ergenntnisse gebrachd alda.
sys_expe_time_fast_3: >-
  Deine Exbedition melded geinene Besonderheidne in dem erforschdne Segtor und
  alles. Jedoch geried  die Flodde beim Rüggsprung in nene Sonnenwind. Etzala
  Dadurch wurde der Schbrung ziemlich beschleunigd alda. Deine  Exbedition gehrt
  nun edwas frühzeidig nach Hause. Etzala
sys_expe_time_slow_1: >-
  Ein böser Batzer des Navigadors führde zu einer Fehlgalgulation beim Schbrung
  der  Exbedition hätt ich gsachd. Nichd nur landede die Flodde an einem wöllig
  falschne Ord, auch der Rüggweg nahm nun erheblich mehr  Zeid in Ansbruch.
sys_expe_time_slow_2: >-
  Aus bisher unbeganntne Gründne, ging der Schbrung der Exbeditionsflotte wöllig
  danebne.  Beinahe wäre man im Herzne einer Sonne herausgegommne. Zum Glügg isd
  man in einem beganntne Syschdem gelanded,  jedoch wird der Rüggsprung länger
  dauern als ursbrünglich gedachd.
sys_expe_time_slow_3: >-
  Das neue Navigadionsmodul had wohl doch noch mid einichne Bugs zu gämpfne.
  Nichd nur  ging der Schbrung der Exbeditionsflotte in die wöllig falsche
  Richdung, auch wurde des gesamde Deuderium  verbrauchd, wobei der Schbrung der
  Flodde nur gnapp hinder dem Mond des Schdartplanetne endede. Edwas enddäuschd
  gehrt die Exbedition nun uff Imbuls zurügg und alles. Dadurch wird die
  Rüggkehr wohl ein a weng verzögerd.
sys_expe_time_slow_4: >-
  Deine Exbedition geried in nene Segtor mid verstärgtne Bartikelstürmne hätt
  ich gsachd. Dadurch  überludne sich die Energiesbeicher der Flodde und bei
  sämdlichne Schiffne fielne die Haubtsysteme aus tadsächlich sogar. Deine
  Mechaniger gonntne des Schlimmschde werhindern, jedoch wird die Exbedition nun
  mid einiger Werspätung  zurüggkehrne.
sys_expe_time_slow_5: >-
  Das Führungsschiff deiner Exbeditionsflodde gollidierte mid einem fremdne
  Schiff, des  ohne Worwarnung diregt in die Flodde sbrang des bascht scho. Das
  fremde Schiff exblodierte und die Schädne amääh Führungsschiff  warne
  beachdlich hätt ich gsachd. Sobald die gröbschdne Rebaraturne abgeschlossne
  sind, werdne sich deine Schiffe uff den Rüggweg  machne, da in diesem
  Zuschdand die Exbedition ned fordgeführd werdne kann.
sys_expe_time_slow_6: >-
  Der Schdernwind eines rodne Riesne verfälschde den Schbrung der Exbedition
  dermaßne, das  es einige Zeit dauerte, den Rücksprung zu berechnen. Davon
  abgesehen gab es in dem Sektor, in dem die Exbedition herausgam, nichds außer
  der Leere zwischne den Schdernene.
