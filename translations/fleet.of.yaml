sys_expe_attack_1_1_1: >-
  Ein baar anscheinend sehr verzweifelde Weltraumbiratne habne versuchd, unsere
  Exbeditionsflotte zu gapern.
sys_expe_attack_1_1_2: >-
  Einige brimitive Barbarne greifne uns mid Raumschiffne an, die ned amal
  ansadzweise die Bezeichnung Raumschiff verdiend habne alde. Sollde der
  Beschuss ernschd zu nehmende Ausmaße annehmne , sehne wir uns gezwungne das
  Feuer zu erwidern.
sys_expe_attack_1_1_3: >-
  Wir habne a baar Fungsprüche sehr betrungener Biratne aufgefangne.
  Anscheinend  sollne wir überfallne werdne.
sys_expe_attack_1_1_4: >-
  Wir musschdne uns gechen einiche Biratne wehrne, die zum Glügg ned allzu
  zahlreich  warne .
sys_expe_attack_1_1_5: >-
  Unsere Exbeditionsflotte melded, das a gewisser Moa Dikarr und seine wilde
  Meude  die bedingungslose Gapitulation unserer Flodde werlangne hätt ich
  gsachd. Solldne sie Ernschd machne, werdne sie feschdschdellne müssne, das
  sich unsere Schiffe durchaus zu wehrne wissne.
sys_expe_attack_1_2_1: >-
  Deine Exbeditionsflodde hadde a unschönes Zusammendreffne mid einichne
  Weltraumbiratne .
sys_expe_attack_1_2_2: >-
  Wir sind in den Hinderhald einiger SchdernenFreibeuter- geradne tazächlich
  sogar! Ein Gampf war leider  unwermeidlich .
sys_expe_attack_1_2_3: >-
  Der Hilferuf, dem die Exbedition folgde, schdellte sich als böse Falle
  einiger  arglischdiger SchdernenFreibeuter- heraus alde. Ein Gefechd war
  unwermeidlich hätt ich gsachd.
sys_expe_attack_1_3_1: >-
  Die aufgefangenene Signale schdammtne ned vonääh Fremdwesne, sondern von einer
  geheimne  Biratenbasis etzala! Die Biratne warne von unserer Anwesenheid in
  ihrem Segtor ned höchste Wesne begeischdert.
sys_expe_attack_1_3_2: >-
  Die Exbeditionsflotte melded schwere Gämpfe mid nichdidendifizierdne-
  Biratenschiffne!
sys_expe_attack_1_3_3: >-
  Wir habne gerade ne dringende Nachrichd wom Expeditionsgommandantne erhaldne:
  *ferstellt Schdimme:* "Äh, Sie  gommne uff uns zu! Sie sind aus dem Hyberraum
  gesbrungne, zum Glügg sind es nur Biratne, wir habne also ne  Chance, wir
  werdne gämpfen" alda!
sys_expe_attack_2_1_1: >-
  Deine Exbeditionsflotte hadde nene ned höchste Wesne freundlichne Erstgontagt
  mid einer  unbeganntne Schbezies hätt ich gsachd.
sys_expe_attack_2_1_2: >-
  Einige fremdardig anmudende Schiffe habne ohne Worwarnung die
  Exbeditionsflotte  angegriffne!
sys_expe_attack_2_1_3: >-
  Unsere Exbedition wurde von einer gleinene Grubbe unbegannter Schiffe
  angegriffne alda!
sys_expe_attack_2_1_4: >-
  Die Exbeditionsflotte melded Gontakt mid unbeganntne Schiffne hätt ich gsachd.
  Die Fungsprüche sind  ned endschlüsselbar, jedoch scheinene die fremdne
  Schiffe ihre Waffne zu agtivierne .
sys_expe_attack_2_2_1: 'Eine unbegannte Schbezies greifd unsere Exbedition an tazächlich! '
sys_expe_attack_2_2_2: >-
  Deine Exbeditionsflotte had anscheinend des Hoheidsgebied einer bisher
  unbeganntne,  aber äußerschd aggressiwne und griegerischne Alienrasse
  verledzd.
sys_expe_attack_2_2_3: >-
  Die Werbindung zu unserer Exbeditionsflotte wurde gurzfristig geschdört.
  Soweid wir die  ledzde Bodschafd richdig endschlüsseld habne, schdeht die
  Flodde under schwerem Feuer – die Aggressorne gonntne  ned idendifizierd
  werdne. Etzala
sys_expe_attack_2_3_1: >-
  Deine Exbedition isd in ne AlienInvasionsFlodde- geradne und melded schwere
  Gefechde!
sys_expe_attack_2_3_2: >-
  Ein großer Werband gristalliner Schiffe unbegannter Hergunft häld diregtne
  Gollisionskurs mid unserer Exbeditionsflotte. Wir müssne nun wohl wom
  Schlimmschdne ausgehne.
sys_expe_attack_2_3_3: >-
  Wir haddne a a weng Schwieriggeitne, den Dialegt der fremdne Rasse richdig
  auszusbrechne alde. Unser Diblomat nannde versehendlich *ferstellt Schdimme:*
  "Äh, Feuer"! schdatt *ferstellt Schdimme:* "Äh, Friedne! ".
