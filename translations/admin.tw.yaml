se_pow_max_cap_info: >-
  套用係數後的最高數字。1500000 在一支很慢的智慧型手機上大約需要 25 秒。
se_pow_sensitivity: 機器人防護 - 風險偵測靈敏度
se_pow_sensitivity_info: >-
  預設門檻的百分比（每個 IP：升高為 10 分鐘 5 次請求、每小時 3 次失敗或 24 小時 2 次註冊；高風險為 20 / 10 / 5；網段則是三倍）。200 = 需要兩倍多的事件，50 = 一半。
se_pow_max_number: 機器人防護 - 難度（最大數字）
se_pow_max_number_info: >-
  瀏覽器會嘗試最高到這個數字的雜湊，平均試一半。25000 遠低於一秒就能完成。越高，機器人要做的工作越多。
se_pow_min_seconds: 機器人防護 - 送出前的最短時間（秒）
se_pow_min_seconds_info: >-
  載入後比這個時間更快送出的表單會被拒絕。0 表示停用檢查。
se_proofofwork: 機器人防護
se_proofofwork_info: >-
  註冊和忘記密碼受到一個小型運算保護，由瀏覽器自己解開，不需要任何第三方。
se_rebuild_protection: 重建保護
se_rebuild_protection_info: >-
