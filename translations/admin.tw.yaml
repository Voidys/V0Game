se_bots_raids: "機器人：突襲與目標"
se_bots_defense: "機器人：艦隊撤離與威脅"
se_bots_growth: "機器人：成長與活躍度"
se_bots_features: "機器人：行為開關"
se_bots_preset: "難度預設"
se_bots_preset_info: "選擇預設並儲存會填入下方的機器人數值（突襲開／關與容量設定不受影響）；之後若修改任一數值，預設將切換為自訂。每個預設都保留保護玩家的限制：每個目標每天的攻擊次數、每個目標的冷卻時間，絕不攻擊新手保護或休假中的玩家。個別機器人可在機器人列表中覆寫該預設。"
se_bots_preset_custom: "自訂"
se_bots_preset_relaxed: "輕鬆"
se_bots_preset_normal: "普通"
se_bots_preset_hard: "困難"
se_bots_preset_brutal: "殘酷"
se_bots_max_fleets: "同時在飛的機器人突襲艦隊上限"
se_bots_max_fleets_info: "本宇宙中同時飛行的機器人偵察與攻擊艦隊的上限（0 = 不限制）。"
se_bots_aggression: "攻擊性（0-100）"
se_bots_aggression_info: "50 = 經典行為。較高：機器人每次連線更常突襲，並接受單位成本收益較低的突襲；較低：相反。"
se_bots_attack_actives: "攻擊活躍玩家"
se_bots_attack_actives_info: "關：機器人只攻擊過去一小時內不活躍的玩家（不活躍玩家與其他機器人）。"
se_bots_raids_per_target_day: "每個目標每天的突襲次數"
se_bots_raids_per_target_day_info: "一個機器人在 24 小時內攻擊同一玩家的最大次數。0 = 使用機器人檔案中的值（2-4）。遊戲的 bash 限制一律另外生效。"
se_bots_target_cooldown_hours: "每個目標的冷卻時間（小時）"
se_bots_target_cooldown_hours_info: "在一次無利可圖的查看、被拒絕的飛行或召回之後，目標被放過多久。"
se_bots_min_target_points: "目標最低點數"
se_bots_min_target_points_info: "機器人忽略點數低於此值的玩家（0 = 關閉）。"
se_bots_min_target_ratio_percent: "目標最小規模（佔機器人點數的百分比）"
se_bots_min_target_ratio_percent_info: "機器人忽略點數低於自身點數該百分比的玩家（0 = 關閉）。"
se_bots_probes_per_target_day: "每個目標每天的探測器飛行次數"
se_bots_probes_per_target_day_info: "一個機器人在 24 小時內飛往同一星球的最大偵察次數（0 = 僅受偵察冷卻限制）。"
se_bots_probes_wanted: "突襲機器人在家保留的探測器"
se_bots_probes_wanted_info: "準備突襲的機器人會建造探測器，直到達到這個數量。"
se_bots_min_loot: "最低戰利品（價值）"
se_bots_min_loot_info: "一次攻擊必須至少預期這麼多戰利品（金屬 + 1.5 晶體 + 2 重氫）。"
se_bots_escort_shares: "護航比例（百分比）"
se_bots_escort_shares_info: "作為護航嘗試的星球戰艦比例，從最小開始，以逗號分隔（例如 0, 15, 30, 50, 75, 100）。"
se_bots_simulation_runs: "每支艦隊的模擬戰鬥次數"
se_bots_simulation_runs_info: "只有艦隊贏下每一場模擬戰鬥才會派出（1-5）。"
se_bots_spy_cooldown_minutes: "偵察冷卻時間（分鐘）"
se_bots_spy_cooldown_minutes_info: "機器人再次偵察同一星球前的等待分鐘數（目標每次都會收到反偵察訊息）。"
se_bots_spy_cooldown_streak_minutes: "連續突襲中的偵察冷卻時間（分鐘）"
se_bots_spy_cooldown_streak_minutes_info: "連續突襲期間同樣適用，此時新鮮的報告很重要。"
se_bots_recall_loot_percent: "低於最低戰利品此比例時召回（%）"
se_bots_recall_loot_percent_info: "撞擊前的再次偵察發現預期戰利品低於最低戰利品的這個百分比時，召回艦隊。"
se_bots_recall_ratio_percent: "低於所需收益比此比例時召回（%）"
se_bots_recall_ratio_percent_info: "同樣適用於戰利品與燃料和損失之比。"
se_bots_streak_loot_percent: "一次價值達到多少的戰果後開始連續突襲（最低戰利品的 %）"
se_bots_streak_loot_percent_info: "帶來至少這一比例最低戰利品的戰果會開始一輪連續突襲。"
se_bots_raids_per_human_day: "每個玩家每天的突襲次數（所有機器人合計）"
se_bots_raids_per_human_day_info: "所有機器人合計，24 小時內攻擊同一名真人玩家的最大次數，按整個宇宙的全部機器人計算（防挫敗限制，一律開啟）。"
se_bots_human_cooldown_hours: "機器人攻擊之間每個玩家的間隔（小時）"
se_bots_human_cooldown_hours_info: "機器人攻擊某真人後，在此時間內不會有任何機器人再攻擊他，且在另一次針對他的機器人攻擊仍在途中時絕不會。"
se_bots_probes_per_human_day: "每個玩家每天的探測器飛行次數（所有機器人合計）"
se_bots_probes_per_human_day_info: "24 小時內飛往同一名真人玩家的機器人偵察次數上限，按整個宇宙的全部機器人計算。"
se_bots_scout_range_max: "最大偵察範圍（星系）"
se_bots_scout_range_max_info: "無論檔案如何設定，機器人都不會查看其星球周圍超過這個數量的星系：大致相當於玩家在銀河檢視中瀏覽的範圍。"
se_bots_respy_jitter_seconds: "再次偵察的隨機時間偏移（秒）"
se_bots_respy_jitter_seconds_info: "突襲撞擊前的再次偵察會隨機提前最多這麼多秒發出（0 = 精確計時）。"
se_bots_timezone_spread_hours: "個人時區分散（小時）"
se_bots_timezone_spread_hours_info: "每個機器人會獲得相對伺服器時鐘最多這麼多小時（正負）的固定個人偏移，使同一檔案的機器人不會都在同一小時遊玩（0 = 關閉）。"
se_bots_fleetsave_enabled: "機器人撤離艦隊"
se_bots_fleetsave_enabled_info: "關：機器人從不撤離艦隊，無論是連線結束時還是遇到來襲攻擊時。"
se_bots_fleetsave_keep_percent: "艦隊撤離時留在家中的資源（%）"
se_bots_fleetsave_keep_percent_info: "每種庫存留在星球上的比例，使建造得以繼續。"
se_bots_fleetsave_min_offline_minutes: "值得撤離艦隊的最短離線時間（分鐘）"
se_bots_fleetsave_min_offline_minutes_info: "連線結束時，機器人只有預計至少離開這麼久才會撤離艦隊。"
se_bots_threat_window_hours: "威脅視窗（小時）"
se_bots_threat_window_hours_info: "來襲的敵方艦隊會在撞擊前這麼多小時被發覺。"
se_bots_ship_weight_percent: "造船權重（%）"
se_bots_ship_weight_percent_info: "機器人相對於其他事項偏好造船的倍率（100 = 經典）。"
se_bots_defense_weight_percent: "防禦建造權重（%）"
se_bots_defense_weight_percent_info: "機器人偏好建造防禦的倍率（100 = 經典）。"
se_bots_growth_speed_percent: "成長速度（%）"
se_bots_growth_speed_percent_info: "機器人檔案每日技能增長的倍率（100 = 經典；沒有技能增長的檔案保持不變）。"
se_bots_growth_bonus: "每天額外技能增長（千分比）"
se_bots_growth_bonus_info: "加到每個機器人的每日技能增長上（10 = 每天一個百分點），受檔案最高技能限制。"
se_bots_max_planets: "每個機器人的最大星球數"
se_bots_max_planets_info: "機器人在達到此星球數時停止殖民（0 = 僅適用遊戲本身的限制）。"
se_bots_activity_percent: "活躍度倍率（%）"
se_bots_activity_percent_info: "縮放機器人每小時上線的機率（100 = 檔案的表格；高於 100 時機器人更常登入）。"
se_bots_hidden_rhythm_percent: "隱藏節奏的機器人比例（%）"
se_bots_hidden_rhythm_percent_info: "這些機器人每天以不同的幅度移動其日常節奏，因此無法透過上線時間預測。"
se_bots_revenge: "復仇"
se_bots_revenge_info: "機器人會記仇（玩家攻擊或偵察它們時上升，每天下降 10 %），當其突襲規劃器找到可獲勝的方案時，會偵察並反擊範圍內最敵對的玩家。每個玩家與每天的上限仍然適用。"
se_bots_bot_acs: "機器人聯合攻擊"
se_bots_bot_acs_info: "單獨無法擊敗目標的機器人會發起聯合攻擊，並邀請在線的盟友機器人（同一聯盟）；它們像玩家一樣加入。每個玩家與每天的上限將一個聯合攻擊計為一次攻擊。"
se_bots_recycling: "回收"
se_bots_recycling_info: "當收穫超過燃料時，機器人會派回收船前往其星球周圍看到的殘骸場（先處理自己的戰鬥），沒有回收船時會建造幾艘。"
se_bots_moons: "月球"
se_bots_moons_info: "機器人會使用其月球：登出時艦隊駐紮在月球上，突襲也可以從月球出發。"
se_bots_missiles: "飛彈"
se_bots_missiles_info: "擁有飛彈發射井（等級 4）、脈衝引擎與星際飛彈的機器人會向阻止突襲的目標防禦開火，然後再次偵察並攻擊。開啟此開關後機器人會建造發射井與飛彈。"
se_bots_warmonger: "後期好戰者"
se_bots_warmonger_info: "從下方的點數起，機器人會更頻繁地突襲、接受更薄的利潤，並也把活躍玩家當作目標。突襲規劃器與每個玩家的上限仍然適用。"
se_bots_warmonger_points: "好戰者點數門檻"
se_bots_warmonger_points_info: "機器人可能成為好戰者的點數。"
bot_difficulty: "難度"
bot_override_preset: "此機器人的預設"
bot_override_universe: "同宇宙設定"
bot_override_aggression: "攻擊性"
bot_override_save: "儲存"
bot_override_reset: "重設"
bot_override_saved: "機器人難度已儲存。"
