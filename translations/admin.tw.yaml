se_pow_adaptive_info: >-
  開啟：可疑的 IP 位址和網段（/24 或 /64）會拿到難得多的謎題（短時間內有很多請求、失敗或註冊）。關閉：每位訪客都拿到基本謎題，也不讀取任何計數器。
