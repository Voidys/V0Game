ins_admin_pass_mismatch: Паролі не співпадають.
ins_done_checklist: Твій чек-лист
ins_done_login: Увійди в адміністрування.
ins_done_login_info: 'Ти вже увійшов як «%s». Наступного разу використовуй:'
ins_done_cron: Налаштуй cron-завдання (обов'язково).
ins_done_cron_info: 'Без нього в грі нічого не просувається (флоти, черги будівництва, статистика). Додай цей рядок до crontab користувача веб-сервера (crontab -e) або створи cron-завдання з ним у панелі хостингу:'
ins_done_cron_help: "Як налаштувати cron-завдання (зокрема в панелі хостингу)"
ins_done_locked: Інструмент встановлення тепер заблоковано.
ins_done_locked_info: Майстер більше не можна запустити. Щоб оновити пізніше, дотримуйся розділу про оновлення в документації.
ins_done_https: Використовуй HTTPS.
ins_done_https_info: 'Зараз сторінка відкривається через HTTP: паролі передаються без шифрування. Налаштуй сертифікат (наприклад, Let''s Encrypt), перш ніж запрошувати гравців.'
ins_done_https_ok: Ця сторінка відкрита через HTTPS — добре.
ins_done_settings: Змінюй налаштування пізніше.
ins_done_settings_info: 'Адмін — Налаштування: назва гри, швидкість, реєстрація, е-пошта (SMTP), боти та багато іншого.'
ins_done_bots: Боти.
ins_done_bots_info: 'Створено ботів: %d. Вони діятимуть під час запуску cron-завдання. Керуй ними в адмін-панелі.'
ins_done_bots_failed: Адміністратора створено, але ботів створити не вдалося. Додати їх можна пізніше в адмін-панелі.
ins_done_migrationpw: Запиши свій пароль для міграцій (показується лише один раз).
