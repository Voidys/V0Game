ins_done_docs: 'Документація:'
ins_done_to_admin: До адміністрування
ins_step_legal: Юридичне
ins_legal_desc: Вибери, де розміщується гра і з чого почнуться юридичні сторінки та дошка спільноти. Усе це можна змінити пізніше в адмін-зоні (Налаштування, Сторінки).
ins_group_privacy: Регіон розміщення
