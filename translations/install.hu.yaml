intro_text: 'A V0Game egy nyílt forráskódú űrstratégiai játék a böngészőben: építsd ki a bolygóidat, kutass, küldj flottákat, és csapj össze több száz játékossal egyszerre.<br><br>Ez a varázsló lépésről lépésre felállít egy új telepítést: ellenőrzi a szervered, csatlakozik az adatbázishoz és létrehozza, felépíti a táblákat, megadhatod a játékod nevét, és létrehozza az adminisztrátort.'
