install_desc: >-
  A telepítőeszköz engedélyezéséhez hozd létre a
  „var/ENABLE_INSTALL_TOOL” fájlt.<br> A fájlnév kis- és nagybetűérzékeny, és
  nincs fájlkiterjesztése.<br> A fájl lehet üres.

  A telepítés befejezése után automatikusan törlődik, vagy ha egy óránál
  régebbi.
