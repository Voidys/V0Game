ins_db_help: V0Game stocke tout dans une base de données MySQL ou MariaDB. Vous obtenez les valeurs ci-dessous auprès du panneau de votre hébergeur (cherchez « Bases de données » ou « MySQL ») ou de la personne qui a configuré votre serveur. Si vous avez installé MySQL vous-même, les valeurs par défaut fonctionnent généralement.
ins_db_host: Serveur de base de données
ins_db_host_info: Presque toujours « localhost ». Certains hébergeurs donnent un nom comme « db1.example.com ».
ins_db_name_info: Le nom de la base de données du jeu. Créez-la d'abord dans le panneau de votre hébergeur ou laissez l'installateur la créer (voir l'encadré ci-dessous).
ins_db_advanced: Avancé (port, préfixe des tables, mot de passe de migration) - normalement inutile
ins_db_prefix_info: Ajouté devant chaque nom de table. Ne le modifiez que si vous partagez une base de données avec d'autres logiciels.
ins_db_migrationpw_info: Protège la page de mise à jour (install/?mode=upgrade) pour les futures mises à jour du jeu. Laissé vide, l'installateur en génère un solide et l'affiche une seule fois sur la dernière page.
ins_db_migrationpw_placeholder: généré automatiquement
ins_migrationpw_invalid: Le mot de passe de migration ne doit pas contenir de guillemets, de barres obliques inverses, de $ ni de sauts de ligne.
ins_err_technical: détails techniques
ins_err_access_denied: Le serveur de base de données a refusé le nom d'utilisateur ou le mot de passe. Vérifiez les deux dans le panneau de votre hébergeur (les majuscules et minuscules comptent).
ins_err_unknown_db: Cette base de données n'existe pas sur le serveur. Vérifiez le nom ou cochez « Créer la base de données » ci-dessous.
ins_err_no_privilege: Cet utilisateur de base de données n'a pas le droit d'utiliser cette base. Donnez-lui tous les privilèges dessus dans le panneau de votre hébergeur.
ins_err_no_create: Cet utilisateur n'a pas le droit de créer des bases de données. Créez une base vide dans le panneau de votre hébergeur et décochez « Créer la base de données ».
ins_err_socket: Le socket du serveur de base de données est introuvable. Essayez l'hôte « 127.0.0.1 » au lieu de « localhost ».
ins_err_unreachable: Le serveur de base de données « %s » est injoignable. Vérifiez le nom d'hôte et le port, et que le serveur de base de données est démarré. De nombreux hébergeurs n'autorisent que les connexions de leurs propres serveurs web, « localhost » est donc généralement correct.
