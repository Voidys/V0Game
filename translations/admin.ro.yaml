se_pow_sensitivity_info: >-
  Procent din pragurile implicite (ridicat de la 5 cereri/10 min, 3
  eșecuri/oră sau 2 înregistrări/24 h per IP; mare de la 20 / 10 / 5; rețelele
  de trei ori mai multe). 200 = sunt necesare de două ori mai multe evenimente,
  50 = jumătate.
se_pow_max_number: Protecție anti-boți - dificultate (număr maxim)
se_pow_max_number_info: >-
  Browserul încearcă hash-uri până la acest număr, în medie jumătate dintre ele.
  25000 durează mult sub o secundă. Mai mare înseamnă mai multă muncă pentru
  boți.
se_pow_min_seconds: Protecție anti-boți - timp minim înainte de trimitere (secunde)
se_pow_min_seconds_info: >-
  Formularele trimise mai repede decât atât după încărcare sunt refuzate. 0
  dezactivează verificarea.
se_proofofwork: Protecție anti-boți
se_proofofwork_info: >-
  Înregistrarea și parola uitată sunt protejate printr-un mic calcul pe care
  browserul îl rezolvă singur, fără niciun terț.
se_rebuild_protection: Protecția de reconstrucție
se_rebuild_protection_info: >-
  După pierderi grele, jucătorii primesc protecție de reconstrucție împotriva
  atacurilor ulterioare după 6 ore, care durează 48 de ore de la atac. În
  cadrul unui atac trebuie distruse 70% din flotă sau 80% din capacitatea de
  transport, iar pierderea trebuie să fie de cel puțin puncte de protecție a
  începătorilor × 1.000 în unități sau capacitate. Jucătorul poate încheia
  modul mai devreme.
