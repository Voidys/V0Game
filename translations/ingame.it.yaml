Achievement_text:
  '1': 'Fai atterrare 5 tuoi attacchi tra mezzanotte e le 6 del mattino nella stessa notte senza vincerne nemmeno uno.'
  '2': Hai avuto flotte in movimento senza sosta per 90 giorni.
  '3': 'Hai perso la tua flotta mentre la tua lingua era impostata su "Francese".'
  '4': Ricerca Tecnologia ionica 10.
  '5': Ricerca Ricerca sui gravitoni 2, solo perché puoi.
  '6': Uno dei tuoi attacchi è tornato con appena 1 di metallo, 1 di cristallo e 1 di deuterio.
  '7': 'Sconfiggi una flotta di navi pirata o aliene per un totale di almeno 10.000 navi. Lo spazio è nostro!'
  '8': Presentati allo Strammtisch (il martedì alle 20 su Discord).
  '9': Costruisci la tua prima Morte Nera.
  '10': Distruggi la luna di un giocatore.
  '11': Gioca 14 giorni esclusivamente da mobile.
  '12': La tua flotta è stata distrutta da un buco nero durante la tua prima spedizione.
  '13': Manda via la tua flotta con meno di 5 secondi prima che arrivi un attacco in arrivo.
  '14': Perdi 10 flotte nei buchi neri. Il vuoto ha fame.
  '15': 'Non ottenere la tua prima luna in 10 battaglie con la massima probabilità di luna.'
  '16': Più di 250 delle tue riciclatrici sono tornate a vuoto.
  '17': Metti in coda almeno 5000 Lanciamissili in un solo ordine di costruzione.
  '18': Brucia 5 milioni di deuterio come carburante su un singolo pianeta entro 24 ore.
  '19': Ricerca Tecnologia della corazza 3.
  '20': Ricerca Tecnologia della corazza 6.
  '21': Ricerca Tecnologia della corazza 9.
  '22': Ricerca Tecnologia della corazza 12.
  '23': Ricerca Tecnologia della corazza 15.
  '24': Ricerca Tecnologia laser 12.
  '25': Aderisci ai Record.
  '26': Elimina il pianeta che ti dà più punti (almeno 100.000 punti).
  '27': Ricerca Rete di ricerca intergalattica 1.
  '28': Potenzia tutti e tre i magazzini di una luna ad almeno il livello 3.
  '29': Collettivizza la flotta di un giocatore con più punti di te con un ACS da 5 giocatori.
  '30': Respingi da solo un ACS da 5 giocatori.
  '31': Manda un giocatore in modalità vacanza con il tuo attacco.
  '32': 'Razzia 1000 pianeti usando il tema "SetSail". Arr!'
  '33': Torna dalla modalità vacanza.
  '34': Vieni attaccato per la prima volta. Benvenuto nell'universo.
  '35': Attacca un giocatore attivo che ha meno di 1/10 dei tuoi punti.
  '36': "Ricevi un messaggio che contiene uno dei seguenti blocchi:\r\n                        \"Hurensohn\", \"gleichstarke Ziele\", \"gegen Schwächere\", \"ehrenlos\""
  '37': Vieni spazzato via da un ACS da 5 giocatori.
  '38': 'Attacca membri della tua stessa alleanza. Fuoco amico, qualcuno?'
  '39': Attacca qualcuno con esattamente 42 navi.
  '40': Colonizza un pianeta ad almeno mezzo universo di distanza.
  '41': Blocca uno slot flotta per una settimana con una brutta offerta sul mercato.
  '42': Finisci 4 volte nella Sala delle battaglie dalla parte dei perdenti.
  '43': "Vinci una battaglia mentre il tuo account è segnato come Inattivo,\r\n            su un tuo pianeta dove in precedenza è arrivata una flotta con un tempo di volo di più di 7 giorni."
  '44': 'Produci una risorsa su un pianeta per più di 7 giorni con l''energia sotto il 100%.'
  '45': Vinci un attacco contro un giocatore che è nella top 5 per difesa.
  '46': Fai scattare la protezione bash lanciando missili interplanetari.
  '47': Distruggi 5 lune.
  '48': Perdi 5 Morti Nere cercando di distruggere lune. Ahia.
  '49': Demolisci una colonia poco dopo la sua creazione.
  '50': "Perdi tutti i tuoi satelliti solari su un pianeta con abbastanza\r\n            energia per ricercare la tecnologia dei gravitoni, senza aver ricercato la tecnologia dei gravitoni."
  '51': Finisci tutto il tuo deuterio mentre sfogli la vista Galassia.
  '52': >-
    Costruisci una Morte Nera senza aver prima costruito altre navi da
    combattimento (Caccia leggero, Caccia pesante, Incrociatore, Nave da
    battaglia, Bombardiere, Corazzata o Incrociatore da battaglia).
  '53': Detieni il livello massimo in 5 ricerche contemporaneamente.
  '54': 'Pianifica un attacco a un giocatore attivo in modo che arrivi il 01/01 alle 00:00:00.'
  '55': Obiettivo speciale
  '56': 'Raggiungi il livello 15 del propulsore a iperspazio.'
  '57': 'Raggiungi il livello 15 dell''astrofisica.'
  '58': 'Ricerca ogni tecnologia (tranne gravitone) almeno una volta.'
  '59': 'Porta ogni ricerca (tranne gravitone) al livello 10.'
  '60': 'Possiedi 1.000.000.000 di una singola risorsa su un pianeta o una luna.'
  '61': 'Possiedi 1000 satelliti solari contemporaneamente su un pianeta.'
  '62': 'Costruisci su ogni campo di un pianeta con almeno 250 campi.'
  '63': 'Porta i depositi di metallo, cristallo e deuterio al livello 15 su un pianeta.'
  '64': 'Possiedi una miniera di metallo di livello 30 o superiore su 9 pianeti.'
  '65': 'Avvia un singolo ordine di costruzione che dura più di 30 giorni.'
  '66': 'Fai acquistare 50 delle tue offerte del mercato da altri giocatori.'
  '67': 'Vinci una difesa contro attaccanti che valgono almeno 10 volte la tua flotta e difesa (attaccanti da almeno 1.000.000 di risorse).'
  '68': 'Vinci un attacco che distrugge almeno 1000 unità nemiche senza perdere nessuna unità.'
  '69': 'Pareggia uno scontro dopo il numero massimo di round, con ogni parte che perde almeno 10.000 unità.'
  '70': 'Vieni attaccato su un pianeta senza navi né difese, così l''attaccante non saccheggia nulla.'
  '71': 'Ottieni una luna da uno scontro che aveva solo l''1 % di probabilità di luna.'
  '72': 'Distruggi almeno 100 unità di difesa con un singolo attacco di missili interplanetari.'
  '73': 'Distruggi almeno 100 sonde spia nemiche in uno scontro sul tuo pianeta.'
  '74': 'Saccheggia 1.000.000.000 di risorse in totale.'
  '75': 'Ricicla 1.000.000.000 di risorse in totale.'
  '76': 'Ripara 1000 navi dai campi di detriti in totale.'
  '77': 'Guadagna 1000 punti onore.'
  '78': 'Diventa un fuorilegge per la prima volta.'
  '79': 'Partecipa come attaccante a 25 attacchi di flotta riuniti vinti.'
  '80': 'Vivi ogni possibile esito di spedizione almeno una volta.'
  '81': 'Invia 1000 spedizioni.'
  '82': 'Vinci uno scontro di spedizione contro una grande flotta aliena.'
  '83': 'Trova grandi quantità di risorse in 50 spedizioni.'
  '84': 'Invia una flotta in un volo di sola andata di oltre 24 ore.'
  '85': 'Fai arrivare una flotta a destinazione il 29 febbraio.'
  '86': 'Perdi un''intera flotta d''attacco di venerdì 13.'
  '87': 'Fai atterrare due tuoi attacchi (non riuniti) sullo stesso bersaglio nello stesso secondo.'
  '88': 'Avere contemporaneamente flotte in viaggio verso ogni galassia dell''universo.'
  '89': 'Completa il tutorial.'
  '90': 'Avere contemporaneamente patti attivi con 3 altre alleanze (tutti i membri dell''alleanza lo ottengono).'
  '91': 'Crea 5 pagine wiki dell''alleanza.'
  '92': 'Avere 10 richieste di amicizia accettate.'
  '93': 'Sii il numero 1 della classifica dei punti totali per 7 giorni consecutivi.'
  '94': 'Possiedi 100 Stelle della Morte contemporaneamente su un pianeta o una luna.'
  '95': 'Occupa ogni slot pianeta consentito dalla tua astrofisica (almeno 9), ogni pianeta con almeno 200 campi.'
  '96': 'Possiedi altri 50 successi.'
