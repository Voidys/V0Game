se_pow_adaptive: Proteção contra bots - dificuldade adaptativa
se_pow_adaptive_info: 'Ligado: endereços IP e redes suspeitos (/24 ou /64) recebem um cálculo bem mais difícil (muitas requisições, falhas ou cadastros em pouco tempo). Desligado: todos os visitantes recebem o cálculo básico e nenhum contador é lido.'
se_pow_elevated_factor: Proteção contra bots - fator com risco elevado
se_pow_elevated_factor_info: O cálculo fica tantas vezes mais difícil (padrão 20).
se_pow_high_factor: Proteção contra bots - fator com risco alto
se_pow_high_factor_info: O cálculo fica tantas vezes mais difícil (padrão 100).
se_pow_max_cap: Proteção contra bots - limite de dificuldade
se_pow_max_cap_info: Maior número depois de aplicar os fatores. 1500000 leva cerca de 25 segundos em um smartphone lento.
se_pow_sensitivity: Proteção contra bots - sensibilidade da detecção de risco
se_pow_sensitivity_info: Porcentagem dos limiares padrão (elevado a partir de 5 requisições/10 min, 3 falhas/hora ou 2 cadastros/24 h por IP; alto a partir de 20 / 10 / 5; redes, o triplo). 200 = precisa do dobro de eventos, 50 = metade.
se_pow_max_number: Proteção contra bots - dificuldade (número máximo)
se_pow_max_number_info: O navegador testa hashes até este número, em média metade dele. 100000 leva de meio a um segundo. Um valor mais alto dá mais trabalho aos bots.
se_pow_min_seconds: Proteção contra bots - tempo mínimo antes de enviar (segundos)
se_pow_min_seconds_info: Formulários enviados mais rápido que isso depois de carregar são recusados. 0 desativa a verificação.
se_proofofwork: Proteção contra bots
se_proofofwork_info: O cadastro e a recuperação de senha são protegidos por um pequeno cálculo que o navegador resolve sozinho, sem nenhum serviço de terceiros.
se_rebuild_protection: Proteção de reconstrução
se_rebuild_protection_info: Em caso de grandes perdas, os jogadores recebem proteção de reconstrução contra novos ataques, 6 horas depois do ataque e por 48 horas. É preciso que 70% da frota ou 80% da capacidade de transporte seja destruída em um único ataque. Além disso, isso precisa equivaler a pelo menos os pontos da proteção de novatos * 1000 em unidades ou capacidade. O jogador pode encerrar o modo antes do tempo.
