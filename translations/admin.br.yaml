se_bots_target_cooldown_hours: "Pausa por alvo (horas)"
se_bots_target_cooldown_hours_info: "Durante quanto tempo um alvo é deixado em paz após um olhada pouco rentável, um voo recusado ou uma retirada."
se_bots_min_target_points: "Pontos mínimos do alvo"
se_bots_min_target_points_info: "Os bots ignoram jogadores com menos pontos (0 = desligado)."
se_bots_min_target_ratio_percent: "Tamanho mínimo do alvo em porcentagem do bot"
se_bots_min_target_ratio_percent_info: "Os bots ignoram jogadores cujos pontos estão abaixo desta porcentagem dos seus (0 = desligado)."
se_bots_probes_per_target_day: "Voos de sondas por alvo e dia"
se_bots_probes_per_target_day_info: "Máximo de voos de espionagem de um bot ao mesmo planeta em 24 horas (0 = só a pausa de espionagem os limita)."
se_bots_probes_wanted: "Sondas que um bot de ataques mantém em casa"
se_bots_probes_wanted_info: "Um bot que vai atacar constrói sondas até ter tantas."
se_bots_min_loot: "Saque mínimo (valor)"
se_bots_min_loot_info: "Um ataque tem de prometer pelo menos este saque (metal + 1,5 cristal + 2 deutério)."
se_bots_escort_shares: "Cotas de escolta em porcentagem"
se_bots_escort_shares_info: "Cotas das naves de guerra do planeta experimentadas como escolta, da menor para a maior, separadas por vírgulas (ex.: 0, 15, 30, 50, 75, 100)."
se_bots_simulation_runs: "Combates simulados por frota"
