adm_info_chk_php: Versão do PHP (8.4 ou superior)
adm_info_chk_php_hint: O jogo precisa de PHP 8.4 ou superior.
adm_info_chk_ext_required: Extensões PHP necessárias
adm_info_chk_ext_required_hint: Instale as extensões que estão faltando; o jogo não funciona sem elas.
adm_info_chk_ext_optional: Extensões PHP opcionais
adm_info_chk_ext_optional_hint: Não são obrigatórias, mas ativam recursos mais rápidos ou extras (veja a lista de extensões).
adm_info_chk_opcache: OPcache
adm_info_chk_opcache_hint: O OPcache está desativado. Ative em produção, ele acelera bastante o PHP.
adm_info_chk_environment: Ambiente (APP_ENV / depuração)
adm_info_chk_environment_hint: Rode com APP_ENV=prod e debug desativado em um servidor público.
adm_info_chk_display_errors: display_errors
adm_info_chk_display_errors_hint: A exibição de erros nas páginas pode expor dados internos. Defina display_errors=Off em servidores públicos.
adm_info_chk_writable: Diretórios com permissão de escrita
adm_info_chk_writable_hint: O usuário do servidor web precisa poder escrever nestes diretórios (caches, logs, sessões, uploads).
adm_info_chk_install_tool: Ferramenta de instalação
adm_info_chk_install_tool_hint: var/ENABLE_INSTALL_TOOL existe. Exclua o arquivo quando não estiver instalando.
adm_info_chk_migrations: Migrações do banco de dados
adm_info_chk_migrations_hint: Há migrações pendentes. Elas são aplicadas na próxima requisição do jogo; confira o log se continuarem pendentes.
adm_info_chk_battle_engine: Motor de batalha
adm_info_chk_battle_engine_hint: O motor Rust não está utilizável (bin/battlerust, bin/libbattlerust.so, proc_open). As batalhas rodam no motor PHP, que é mais lento.
adm_info_chk_cron: Cronjobs
adm_info_chk_cron_hint: O cron parece travado ou não está rodando. Confira se bin/console app:cron:run roda a cada minuto e destrave as tarefas travadas em Cron jobs.
adm_info_chk_https: HTTPS
adm_info_chk_https_hint: Esta requisição não usou HTTPS. Senhas e sessões trafegam sem criptografia.
adm_info_chk_mail: Envio de e-mail
adm_info_chk_mail_hint: O e-mail está desativado ou incompleto (os e-mails de ativação e de redefinição de senha não vão chegar). Veja as configurações.
