se_bots: Bots
se_bots_enabled: Ativar bots
se_bots_enabled_info: Permite que bots rodados pelo servidor joguem neste universo. Eles são processados pelo cron job uma vez por minuto.
se_bots_llm_daily_limit: Chamadas ao LLM por bot por dia
se_bots_llm_daily_limit_info: Número máximo de chamadas ao LLM que um bot pode fazer por dia. Depois disso, ele usa alternativas locais.
se_bots_llm_enabled: Usar LLM para nomes e chat
se_bots_llm_enabled_info: Ativa apelidos, personas, nomes de planetas e chat (mensagens, alianças, amigos) gerados por LLM com o provedor ativo. As decisões de jogo continuam sempre locais.
se_bots_max_count: Número máximo de bots
se_bots_max_count_info: Limite máximo de bots gerados neste universo.
se_bots_ticks_per_run: Bots por execução do cron
se_bots_ticks_per_run_info: Número máximo de bots processados em uma execução do cron.
se_bots_raids_enabled: Os bots atacam outros jogadores
se_bots_raids_enabled_info: Permite que os bots façam reconhecimento, espionem e ataquem jogadores e outros bots próximos, com as mesmas regras dos jogadores (limite de bash, proteção, modo de férias). Desativado por padrão.
