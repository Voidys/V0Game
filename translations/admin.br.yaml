se_noob_protection_multi_info: 'Você só pode atacar jogadores cujos pontos estejam entre os seus pontos * (fator), por exemplo *18: com 1.000 pontos, você pode atacar jogadores com menos de 18.000 pontos. Do mesmo jeito, se você tem 50.000 pontos, pode ser atacado por jogadores em cujo alcance você entra. Exemplo: um inimigo com 20.000 pontos * 18 = 360.000, então você está no alcance dele e ele pode atacar você.'
