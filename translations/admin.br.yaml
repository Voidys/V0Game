hof_cleared: Dados do Hall da Fama excluídos.
hof_error_nofile: Nenhum arquivo válido foi enviado.
hof_error_invalid: 'Importação recusada:'
se_bash_war_exempt: Guerras suspendem o limite de bash
se_bash_war_exempt_info: 'Ataques entre alianças em guerra (aceita há mais de um dia) não contam para os limites de bash. Desligado: ataques de guerra contam como todos os outros.'
se_honor_pair_cap: Lutas honrosas por dupla (24 h)
se_honor_pair_cap_info: Quantas lutas honrosas entre os mesmos dois jogadores (em qualquer sentido) rendem honra em 24 horas. As lutas seguintes contam como neutras. 0 = ilimitado.
se_market_push_tolerance: Tolerância de push no mercado
se_market_push_tolerance_info: 'Diferença de valor aceita em uma negociação do mercado, em porcentagem (0-90), antes de contar como push. Padrão: 30.'
se_transport_push_check: Proteção contra push por transporte
se_transport_push_check_info: Recusa transportes, permanências e transferências (carga e naves) para outro jogador quando, nos últimos 7 dias, o valor enviado a ele passou do valor que ele devolveu por mais que o limite abaixo.
se_transport_push_limit: Limite de push por transporte
se_transport_push_limit_info: Valor da carga em unidades de deutério (razões do mercado) acima do qual a proteção vale. 0 = proteção desligada.
se_depot_cost_real_consumption: Custo do depósito pelo consumo real
se_depot_cost_real_consumption_info: O Depósito da Aliança cobra o consumo real de combustível da frota (com as tecnologias de propulsão e de combustível do dono) / 10 por hora, em vez do consumo base / 10.
se_hours: Horas
se_remember_me_days: '"Manter conectado" dura'
se_remember_me_days_info: Dias em que um login com a caixa "Manter conectado" marcada sobrevive a reinícios do navegador e a sessões expiradas. Trocar a senha encerra o login. 0 desativa a opção.
se_session_lifetime: A sessão expira após inatividade de
se_session_lifetime_info: Horas sem nenhuma requisição, depois das quais o jogador é desconectado ("sessão expirada").
