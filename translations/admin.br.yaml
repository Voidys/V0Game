abuse_link_multi_known: grupo de multicontas (conhecido)
abuse_link_subnet: mesma sub-rede (mais fraco)
abuse_thresholds: 'Limiares: um par de transferências aparece quando um sentido passa de %s unidades de metal e no máximo %s voltam; os pares de mercado aparecem a partir de %s negociações, marcados acima de %s de diferença. Sem linhas significa que nada atingiu esses limiares (ou que os registros estão vazios), não que nada tenha acontecido.'
abuse_transfers: Transportes e permanências unilaterais
abuse_transfers_info: Transportes, permanências e transferências de naves (não recolhidas; naves contadas pelo custo de construção) entre dois jogadores em que a carga valia pelo menos %s unidades de metal em um sentido, enquanto no máximo %s desse valor voltou. Ordenado pelo valor líquido; os pesos são as razões de mercado salvas.
abuse_trades: Negociações repetidas no mercado
abuse_trades_info: Trocas de recursos entre os mesmos dois jogadores, pelo menos %s vezes. Motivo = valor dado pelo lado que mais deu, dividido pelo do outro lado (1,00 = referência do mercado); acima de %s de diferença a dupla é marcada.
abuse_giver: Deu mais
abuse_receiver: Recebeu mais
abuse_ratio: Motivo
abuse_outlier: fora do padrão
abuse_protections: Concessões de proteção de reconstrução
abuse_protections_info: Jogadores que receberam proteção de reconstrução no período. Os oponentes são a outra parte do relatório de combate daquele confronto; o saque é o valor que as frotas deles ganharam nele (os destroços e o valor destruído não são guardados).
abuse_protected: Jogador protegido
abuse_granted: Concedida
abuse_opponents: Oponentes
abuse_loot: Saque do oponente
abuse_report: Relatório
abuse_recalls: Chamadas de volta na chegada ou depois
abuse_recalls_info: Frotas de ataque, ACS e destruição que foram chamadas de volta quando a hora de chegada já tinha sido atingida (padrão de recall depois da chegada).
abuse_mission: Missão
abuse_arrival: Chegada
abuse_recalled: Chamada de volta
abuse_late: Depois da chegada
abuse_fought: lutou
abuse_mission_1: Ataque
abuse_mission_2: Ataque de ACS
abuse_mission_9: Destruição
abuse_missiles_skipped: 'Lançamentos de mísseis em comparação com o conteúdo dos silos não fazem parte deste relatório: as tabelas não guardam histórico de silos para comparar.'
abuse_link_device: mesmo dispositivo
abuse_graph: Grupos de fluxo de valor
abuse_graph_info: 'Jogadores ligados por fluxo de valor nos últimos %s dias (período fixo): transportes, permanências, transferências de naves (pelo custo de construção), negociações no mercado (os dois lados) e saque de ataques, somados nos dois sentidos. Só pares com pelo menos %s unidades de metal movimentadas e %s fluxos se ligam; são listados os grupos ligados de dois ou mais (top %s por valor). Líquido = valor da dupla mais unilateral do grupo (parte do valor total). As marcas de vínculo indicam se os membros compartilham IP, dispositivo ou grupo de multicontas com outro membro. As linhas são lidas com um limite por origem.'
abuse_members: Membros
abuse_value: Valor total
abuse_flows: Fluxos
abuse_top_edge: Dupla mais unilateral
abuse_activity: Atividade de envio de frotas (24 h)
abuse_activity_info: Contas com mais envios de frota nas últimas 24 horas; pico = envios na hora de maior movimento. Picos altos e constantes podem indicar jogo automatizado.
abuse_player: Jogador
abuse_launches: Envios
abuse_peak: Pico / hora
adm_dash_unprotected: 'As proteções contra abuso estão desligadas neste universo:'
adm_dash_unprotected_push: A proteção contra push por transporte, permanência e transferência está desligada (transport_push_check / transport_push_limit).
adm_dash_unprotected_honor: O limite de lutas honrosas é 0 (honra ilimitada entre os mesmos dois jogadores).
adm_dash_unprotected_bash: Guerras declaradas suspendem o limite de bash (bash_war_exempt).
adm_dash_unprotected_depot: As permanências no depósito custam só o consumo base, barato (depot_cost_real_consumption desligado).
adm_dash_unprotected_market: A tolerância de push no mercado está acima de 10% (market_push_tolerance).
