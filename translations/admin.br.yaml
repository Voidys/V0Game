adm_nav_social: Login social
se_social: Login social
se_social_info: Permite que os jogadores entrem ou se cadastrem com uma conta existente do Discord, Facebook, GitHub ou Google (OAuth2). Todos os provedores vêm desativados por padrão. Crie um app no provedor, registre lá a URL de callback mostrada abaixo e digite aqui o ID do cliente e o segredo.
se_social_site_url_missing: A URL base do jogo (DEFAULT_URI em .env.local) não está definida, então não dá para montar a URL de callback e os provedores ficam inutilizáveis.
se_social_incomplete: 'Ativado, mas faltam o ID do cliente ou o segredo: o botão de login continua oculto.'
se_social_enabled: Ativado
se_social_enabled_info: Mostra o botão de login na página inicial e na página de cadastro.
se_social_client_id: ID do cliente
se_social_client_id_info: ID do aplicativo (cliente) no provedor.
se_social_client_secret: Segredo do cliente
se_social_client_secret_info: Nunca é mostrado de novo. Deixe vazio para manter o segredo salvo.
se_social_callback: URL de callback
