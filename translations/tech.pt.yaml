spytechStatsDescription: Nos níveis 0 e 1, só vês os pontos totais dos outros jogadores. A partir do nível 2, vês também os pontos de edifícios; a partir do nível 4, os pontos de pesquisa. A partir do nível 6, vês ainda os pontos de naves e de defesa, bem como as estatísticas de batalha.
