longDescription:
  '1': As minas de metal extraem o minério em que assenta todo o império, novo ou estabelecido.
  '2': O cristal é o ingrediente-chave dos circuitos eletrónicos e de certas ligas.
  '3': O deutério abastece as tuas naves espaciais e é colhido nas profundezas do mar. É uma substância rara, por isso é relativamente caro.
  '4': As plantas de energia solar transformam a luz do sol em energia. Todas as minas precisam de energia para funcionar.
  '6': Por predefinição, cada nível reduz o tempo de pesquisa em 8%.
  '12': A Planta de Fusão produz energia ao fundir deutério. Rende mais energia do que a Planta de Energia Solar, mas custa mais a construir. A produção sobe com a Tecnologia de Energia e com o nível da própria planta. A fórmula da produção de energia é:<br> Energia produzida = 30 x nível da Planta de Fusão x (1,05 + (0,01 * nível da Tecnologia de Energia))^nível da Planta de Fusão
  '14': As fábricas de robots fornecem robots de construção que ajudam a erguer os teus edifícios. Cada nível acelera a melhoria dos edifícios.
  '15': O expoente máximo da robótica. Cada nível reduz para metade o tempo de construção de edifícios, naves e defesas.
  '21': Todas as naves e defesas são construídas no hangar do planeta.
  '22': Armazena o excesso de metal.
  '23': Armazena o excesso de cristal.
  '24': Armazena o excesso de deutério.
  '31': Precisas de um laboratório de pesquisas para pesquisar novas tecnologias. O nível do laboratório define a velocidade das pesquisas e as tecnologias que podes desbloquear. A pesquisa decorre no laboratório do planeta onde a iniciares, e o resultado vale para todos os teus planetas. Enquanto uma pesquisa estiver a decorrer, nenhum laboratório de pesquisas pode ser melhorado.
  '33': 'O Terra-Formador aumenta a área utilizável do planeta. Cada nível dá-te mais 5 campos, e mais um campo extra em cada nível par. Cada nível do Terra-Formador ocupa ele próprio um campo.<br>A construção gasta energia, mas esta não se esgota: o teu planeta só tem de a produzir em quantidade suficiente (1000 para o nível 1, a duplicar a cada nível), mesmo que as tuas minas já a estejam a usar. Depois de construído, o Terra-Formador nunca pode ser demolido.'
  '34': 'O depósito da aliança permite-te reabastecer com deutério as frotas amigas que ficam no teu planeta e assim prolongar a sua estadia. Abres-o na página de edifícios: para cada frota parada escolhes entre 1 hora e tantas horas quanto o nível do depósito, e pagas as horas vezes o custo de manutenção por hora da frota com o deutério do teu planeta. O custo por hora é um décimo do consumo base de combustível somado das naves da frota, arredondado para cima. Uma frota pode ser reabastecida vezes sem conta, mas nunca pode ter mais de 32 horas de estadia restantes. Só podem ser reabastecidas frotas de outros jogadores que estejam neste momento em órbita do teu planeta.'
  '35': A doca de reparação pode reparar naves destruídas em combate que tenham deixado um campo de escombros. Uma reparação demora no máximo 12 horas e só pode terminar 30 minutos depois de o campo de escombros aparecer.<br>Quando o campo de escombros aparece, tens 3 dias para iniciar a reparação. Quando a reparação termina, tens de recolocar tu mesmo as naves em serviço. Se não o fizeres, regressam ao serviço automaticamente passados 3 dias.
  '41': A lua não tem atmosfera e uma lua nova só tem espaço para um edifício, por isso começa pela Base Lunar. Cada nível dá 3 campos extra e ocupa ele próprio um campo. Depois de construída, a Base Lunar nunca pode ser desmantelada.
  '42': 'O Sensor Phalanx permite-te observar movimentos de frotas. Quanto mais alto o nível, maior o alcance do Phalanx: (nível do Phalanx)^2 - 1 sistemas por predefinição, por isso o nível 1 cobre apenas o sistema da própria lua. Cada scan custa 5000 de deutério, que tem de estar na lua. Para fazer scan, abre a vista Galáxia a partir da lua e clica num planeta ao alcance. As próprias luas não podem ser analisadas com o Phalanx, porque não têm atmosfera.<br><br>O Phalanx mostra as frotas que partem do planeta analisado ou voam para ele: quando chegam, quando termina uma permanência e quando as frotas do dono regressam a casa. Estacionamentos e mísseis nunca são mostrados, nem voos de reciclagem ou de comércio com destino ao planeta.'
  '43': 'Os Portais de Salto Quântico são enormes transmissores que enviam grandes frotas através do universo sem perder um segundo. Não gastam deutério, mas não podes transferir recursos desta forma. Ambos os portais têm de estar prontos: depois de um salto, cada portal precisa de um tempo de arrefecimento, que por predefinição é de 60 minutos no nível 1 e diminui a cada nível, até 10 minutos a partir do nível 15.'
  '44': Os silos de mísseis guardam os teus mísseis. Por predefinição, cada nível acrescenta 10 espaços. Um míssil de interceção ocupa 1 espaço, um míssil interplanetário ocupa 2.
  '106': 'Esta tecnologia permite-te recolher informações sobre outros planetas e luas. Quando envias sondas, a tua Tecnologia de Espionagem é comparada com a do alvo: quanto mais alto o teu nível, mais informação no relatório e menor a probabilidade de as tuas sondas serem detetadas. Mais sondas revelam mais detalhes, mas aumentam o risco de deteção. Em certos níveis de Tecnologia de Espionagem também ficas a saber mais sobre frotas estrangeiras na Vista Geral:<br><br><li>No nível 0-1 só vês que uma frota se aproxima do teu planeta</li><li>Nos níveis 2-3 vês quantas naves se aproximam</li><li>Nos níveis 4-7 vês que tipos de naves estão na frota</li><li>No nível 8+ vês quantas naves de cada tipo estão na frota</li>'
  '108': Computadores melhores permitem-te comandar mais frotas. Cada nível de Tecnologia de Computadores aumenta em um o teu número máximo de frotas.
  '109': A Tecnologia de Armas torna os sistemas de armas mais eficazes. Cada nível aumenta o poder de ataque de todas as unidades em 10%, calculado sobre o valor base.
  '110': A Tecnologia de Escudo torna mais eficazes os escudos das naves e das estruturas defensivas. Cada nível aumenta a força dos escudos em 10%, calculado sobre o valor base.
  '111': Ligas especiais melhoram a blindagem das naves e das estruturas defensivas. Cada nível aumenta a eficácia da blindagem em 10%.
  '113': Dominar os diferentes tipos de energia é a chave de muitas tecnologias novas. Cada nível de Tecnologia de Energia aumenta também a produção de energia da Planta de Fusão.
  '114': Ao integrar a 4.ª e a 5.ª dimensões, podes pesquisar um novo tipo de motor, mais económico e eficiente.
  '115': 'Desenvolver este motor torna algumas naves mais rápidas, mas cada nível só acrescenta 10% da velocidade base. Naves afetadas: Cargueiro Pequeno, Cargueiro Grande, Caça Ligeiro, Reciclador e Sonda de Espionagem (o Cargueiro Pequeno e o Reciclador passam mais tarde para motores melhores).'
  '117': 'O motor de impulsão funciona pelo princípio da reação. Desenvolvê-lo torna algumas naves mais rápidas, mas cada nível só acrescenta 20% da velocidade base: Bombardeiro, Cruzador, Caça Pesado e Nave de Colonização, mais o Cargueiro Pequeno e o Reciclador quando passam para este motor. Os mísseis interplanetários também voam mais longe a cada nível.'
  '118': 'O motor de hiperespaço curva o espaço à volta de uma nave. Desenvolvê-lo torna algumas naves mais rápidas, mas cada nível só acrescenta 30% da velocidade base: Intercetor, Nave de Batalha, Destruidor, Estrela da Morte, Estrela Destruidora, Cargueiro Armado, Avatar e Reciclador de Batalha, mais o Bombardeiro e o Reciclador quando passam para este motor. Requer Tecnologia de Hiperespaço (nível 3) e Laboratório de Pesquisas (nível 7).'
  '120': A luz focada produz um feixe que danifica tudo o que atinge. Requer Laboratório de Pesquisas (nível 1) e Tecnologia de Energia (nível 2).
  '121': Um feixe mortal de iões acelerados que causa danos enormes no impacto.
  '122': Um desenvolvimento da tecnologia de iões que acelera plasma de alta energia, criado ao sobreaquecer iões. Tem um efeito devastador no impacto.
  '123': Os investigadores de planetas diferentes comunicam através desta rede. Cada nível permite que mais um laboratório se junte ao laboratório onde iniciares uma pesquisa. São escolhidos os laboratórios de nível mais alto, e um laboratório em rede tem de ser suficientemente avançado para realizar essa pesquisa sozinho. Os níveis são somados para calcular o tempo de pesquisa.
  '124': 'A Tecnologia de Astrofísica desbloqueia a colonização e as expedições ao espaço profundo. O limite de colónias, o tempo de permanência e as posições abaixo são as definições predefinidas; o teu universo pode ser diferente.<br><br> <li>Limite de colónias</li> Nível 1-2 = 2 planetas<br> Nível 3-4 = 3 planetas<br> Nível 5-6 = 4 planetas<br> Nível 7-8 = 5 planetas<br> Nível 9-10 = 6 planetas<br> Nível 11-12 = 7 planetas<br> Nível 13-14 = 8 planetas<br> Nível 15-16 = 9 planetas<br> Nível 17-18 = 10 planetas<br> Nível 19-20 = 11 planetas<br> Nível 21+ = 12 planetas<br><br> <li>Slots de expedição</li> Nível 1-3 = 1 expedição<br> Nível 4-8 = 2 expedições<br> Nível 9-15 = 3 expedições<br> Nível 16-24 = 4 expedições<br>(mais uma em cada nível quadrado seguinte: 25, 36, ...)<br><br> <li>Tempo de permanência em expedição</li> Nível = tempo máximo de permanência em horas<br><br> <li>Posições colonizáveis</li> Nível 1-3 = 4-12<br> Nível 4-5 = 3-13<br> Nível 6-7 = 2-14<br> Nível 8+ = 1-15'
  '131': Aumenta a produção de metal em 2% por nível.
  '132': Aumenta a produção de cristal em 2% por nível.
  '133': Aumenta a produção de deutério em 2% por nível.
  '134': Reduz os custos de voo em 2% por nível.
  '199': Disparar uma carga concentrada de partículas de gravitões cria um campo de gravidade artificial que pode destruir naves e até luas. Requer Laboratório de Pesquisas (nível 12).
  '202': O Cargueiro Pequeno é uma nave ágil que transporta recursos rapidamente para outros planetas.<br>Voa com o motor de combustão até o teu Motor de Impulsão chegar ao nível 5. A partir daí passa para o motor de impulsão, que duplica a sua velocidade base.
  '203': Este cargueiro transporta muito mais do que o Cargueiro Pequeno e, graças a um motor melhorado, costuma ser mais rápido.
  '204': A primeira nave de combate que todo o imperador constrói. O Caça Ligeiro é ágil, mas vulnerável sozinho; em grande número, torna-se uma ameaça real para qualquer império. Os Caças Ligeiros são os primeiros a escoltar Cargueiros Pequenos e Grandes até planetas hostis com defesas fracas.
  '205': Este caça tem melhor blindagem e bate mais forte do que o Caça Ligeiro.
  '206': Os Cruzadores têm quase três vezes a blindagem dos Caças Pesados e mais do dobro do poder de fogo. Também são muito rápidos.
  '207': As Naves de Batalha são a espinha dorsal de uma frota. Canhões pesados, alta velocidade e grandes porões fazem delas adversários a levar a sério.
  '208': 'Esta nave bem blindada conquista novos planetas, de que um império emergente precisa para crescer. Na nova colónia, a nave é desmontada e todo o material reciclável vai para o desenvolvimento do novo mundo. O número de planetas que podes colonizar depende diretamente da Tecnologia de Astrofísica: o primeiro nível e cada segundo nível a seguir permitem mais uma colónia (por predefinição).'
  '209': O Reciclador recolhe matérias-primas de campos de destroços. A sua capacidade de carga é de 20 000. Começa com o motor de combustão, passa para o motor de impulsão quando o teu Motor de Impulsão chega ao nível 17, e para o motor de hiperespaço quando o teu Motor Propulsor de Hiperespaço chega ao nível 15.
  '210': As Sondas de Espionagem são drones pequenos e ágeis que entregam dados sobre frotas e planetas a grandes distâncias.
  '211': O Bombardeiro foi construído especificamente para destruir as defesas de um planeta.<br>Voa com o motor de impulsão e passa para o motor de hiperespaço quando o teu Motor Propulsor de Hiperespaço chega ao nível 8.
  '212': Os Satélites Solares são plataformas simples de células solares numa órbita alta e estacionária. Recolhem a luz solar e enviam-na por laser para a estação em terra.
  '213': 'O Destruidor é o rei das naves de guerra. Contra Lasers Ligeiros tem fogo rápido: depois de cada tiro certeiro, em 9 de cada 10 casos ganha mais um tiro.'
  '214': O poder destrutivo da Estrela da Morte não tem rival, e consegue destruir luas.
  '215': O Intercetor é especialista em intercetar frotas hostis.
  '216': 'O sucessor da popular Estrela da Morte: muito mais rápida e resistente, com um porão enorme, mas bate um pouco menos forte.'
  '217': Uma evolução do Cargueiro Grande com muito mais capacidade de carga. Usa o motor de hiperespaço, por isso começa mais lento do que o Cargueiro Grande, mas passa-o à frente à medida que o teu Motor Propulsor de Hiperespaço sobe de nível.
  '218': O pior cenário possível de todos, embora muito lento.
  '219': Um porão enorme e motores novos permitem-lhe voar mais depressa e recolher mais dos campos de destroços.
  '220': 'O Colosso de Aço é uma verdadeira fortaleza no espaço, protegido por barreiras inabaláveis e blindagem maciça. Mesmo os ataques mais ferozes ressaltam enquanto avança implacavelmente. Mas esta superioridade defensiva tem um custo: o seu armamento mal merece menção e os seus motores lentos fazem dele um gigante vagaroso. Em vez de ataques-relâmpago ou manobras ágeis, esta nave conta com pura resistência. Quem quiser detê-la precisa de grande resistência – ou de um poder de fogo esmagador.'
  '221': 'A Lâmina da Tempestade é um caça de topo: incrivelmente rápido e armado sem piedade. Os adversários mal a veem antes de atacar. A defesa é uma preocupação secundária – não precisa de resistir ao que simplesmente consegue ultrapassar. O seu único foco são as frotas de transportadores e recicladores, que são obliteradas sem resistência. Com a sua velocidade estonteante, pode atacar à vontade e desaparecer antes de chegarem reforços. Quem for alvo da Lâmina da Tempestade tem poucas hipóteses de escapar.'
  '222': O Cruzador Pesado é uma evolução reforçada do cruzador padrão. Com escudos melhorados e armamento poderoso, consegue aguentar-se contra inimigos pesados. Destaca-se quando usado junto com Colossos de Aço, Destruidores e Bombardeiros, onde o seu poder de fogo realmente brilha. No entanto, apesar da sua força, continua lento e menos manobrável.
  '223': O Drone de Escudo representa uma nova abordagem na defesa da frota, centrada sobretudo na proteção da tripulação. Tecnologias de blindagem inovadoras mas pesadas reduziram significativamente a velocidade de voo e a manobrabilidade. Apesar da fraca velocidade e agilidade, é muito eficaz na defesa. A estrutura desatualizada foi levada ao limite para proporcionar uma defesa quase impenetrável.
  '224': O Transporte de Assalto Improvisado é uma nave de transporte não testada, equipada com armamento mínimo, criada especificamente para incomodar vizinhos descuidados e desprevenidos. Este veículo improvisado não foi concebido para uso prolongado, mas para ataques rápidos e impulsivos que provocam reações imediatas. Uma disputa de vizinhança está praticamente garantida assim que for utilizado. Com o seu equipamento limitado e natureza imprevisível, torna-se uma ferramenta perigosa para a rápida escalada de conflitos.
  '225': O Transportador Tempestade é uma verdadeira maravilha da tecnologia, oferecendo o equilíbrio perfeito entre poder de combate, velocidade e capacidade de transporte. A sua capacidade de destacar rapidamente tropas e recursos, entregando ao mesmo tempo um poder de fogo impressionante ao campo de batalha, tornou-o um elemento essencial de qualquer frota poderosa. Seja para unidades de assalto rápidas ou para apoiar operações prolongadas, o Transportador Tempestade é fundamental para uma guerra eficaz e um item indispensável em qualquer frota.
  '226': O Transportador de Batalha Colossal representa o auge da engenharia. Apesar do seu design ligeiramente volumoso e da consequente baixa velocidade de voo, é o transportador de batalha mais blindado alguma vez visto por qualquer frota. O seu poder de fogo esmagador torna-o uma força imparável no campo de batalha. Este colosso consegue romper facilmente as linhas inimigas enquanto proporciona proteção máxima à tripulação. Encarna força e resistência, sendo um recurso essencial para qualquer frota fortemente armada.
  '227': O Reciclador Otimizado é uma atualização de ponta do reciclador padrão. Equipado com um poderoso motor de impulso, chega aos campos de destroços mais depressa e com menor custo, sendo um recurso essencial para qualquer frota avançada. O seu design otimizado reduz os custos de construção e aumenta a eficiência da recuperação de recursos. Disponível a partir do meio do jogo, proporciona uma vantagem estratégica a qualquer império em expansão.
  '228': 'O Reciclador Ómega representa o auge da tecnologia de reciclagem – mas a um custo elevado. O seu poderoso motor de hiperespaço permite-lhe chegar aos campos de destroços em tempo recorde e recuperar recursos mais depressa do que qualquer outra nave. No entanto, esta velocidade tem o custo da eficiência: os seus custos de construção e combustível são imensos, tornando-o uma opção viável apenas para comandantes ricos no final do jogo. Para quem prioriza a velocidade em vez do custo, este é o Reciclador definitivo.'
  '229': Desenvolvida para quebrar o domínio dos Xer, a Víbora é a arma definitiva contra Caças ligeiros, Caças pesados e Cruzadores. Com os seus canhões de disparo rápido e tecnologia avançada, altera o equilíbrio de poder no universo.
  '230': 'Rápido. Preciso. Intocável. O Intercetor não foi feito para combates justos: foi concebido para atacar depressa e com força, criando uma vantagem esmagadora num piscar de olhos.'
  '231': O Beemote é o resultado de décadas de investigação de gravitões, combinando esta tecnologia numa plataforma de combate implacável. Ao contrário das Estrelas da morte, não foi concebido para a destruição planetária, mas para a máxima eficiência no campo de batalha. Ao abandonar os sistemas de elevado consumo de energia necessários para destruir luas, o seu design foi significativamente aligeirado, permitindo motores mais fortes, maior agilidade e maior poder de fogo. O seu canhão de gravitões compacto transforma-o numa máquina de destruição móvel, capaz de aniquilar sozinha até frotas enormes.
  '232': 'O Titã do Vazio representa o auge da moderna tecnologia de gravitões. Cada aspeto do seu design serve um único propósito: a rápida aniquilação de luas inimigas. As torres de armas convencionais foram deliberadamente omitidas para reduzir a massa e dar espaço a colossais geradores de cristal. Estes alimentam as bobinas de aceleração mais avançadas alguma vez construídas nas galáxias conhecidas, conferindo à nave um nível de mobilidade sem igual. As imensas necessidades de cristal fazem de cada Titã do Vazio uma conquista industrial monumental – e um símbolo de poder destrutivo ilimitado.'
  '401': O Lançador de Mísseis é uma defesa simples mas económica. Depois de uma batalha, em média cerca de 70% das defesas destruídas são reconstruídas.
  '402': Os lasers ligeiros são armas simples assentes no solo. Sistemas de pontaria especiais seguem o inimigo e um laser de alta intensidade corta o casco do alvo. Depois de uma batalha, em média cerca de 70% das defesas destruídas são reconstruídas.
  '403': O Laser Pesado é uma versão prática e melhorada do Laser Ligeiro. Depois de uma batalha, em média cerca de 70% das defesas destruídas são reconstruídas.
  '404': O Canhão de Gauss dispara projéteis metálicos de alta densidade a uma velocidade altíssima. Depois de uma batalha, em média cerca de 70% das defesas destruídas são reconstruídas.
  '405': Um canhão de iões dispara feixes de iões (partículas com carga positiva ou negativa). Depois de uma batalha, em média cerca de 70% das defesas destruídas são reconstruídas.
  '406': O Canhão de Plasma usa uma grande célula de combustível de reator nuclear para alimentar um acelerador eletromagnético que dispara pulsos (toroides) de plasma. Depois de uma batalha, em média cerca de 70% das defesas destruídas são reconstruídas.
  '407': O Pequeno Escudo Planetário envolve o planeta inteiro num campo que absorve quantidades enormes de energia. Só pode ser construído um por planeta.
  '408': O Grande Escudo Planetário é um desenvolvimento que precisa de substancialmente mais energia para resistir aos ataques. Só pode ser construído um por planeta.
  '409': A evolução da tecnologia dos escudos planetários. Usa muito mais energia, mas aguenta mais ataques do que qualquer outro escudo. Só pode ser construído um por planeta.
  '410': Após anos de investigação sobre a gravidade, os cientistas desenvolveram um canhão de gravitões que gera um pequeno campo de gravitões concentrado e o dispara contra o inimigo.
  '411': Uma plataforma de defesa imóvel, sem propulsão própria, mantida numa órbita estável à volta do planeta pela gravidade. Iniciar este processo exige enormes quantidades de energia. Só pode ser construída uma por planeta.
  '412': O Bunker é uma estrutura fortemente fortificada, concebida para resistir até aos ataques mais poderosos. Proporciona uma proteção inigualável aos habitantes do planeta e às infraestruturas essenciais, tornando-se assim uma pedra angular da defesa planetária.
  '413': O Laser Titã é uma arma colossal com um poder destrutivo sem igual.
  '414': O Engodo é um sistema defensivo sofisticado, concebido para enganar e confundir as forças inimigas. Ao disfarçar-se de Lançador de Mísseis, dissuade ataques.
  '502': Os mísseis de interceção destroem os mísseis interplanetários que se aproximam. É preciso um míssil de interceção por cada míssil interplanetário.
  '503': Os mísseis interplanetários destroem as defesas do adversário, a não ser que sejam abatidos por mísseis de interceção. As defesas destruídas desta forma não são reconstruídas. Por predefinição, o seu alcance (em sistemas solares) depende do nível do teu Motor de Impulsão:<br>Alcance = (5 x nível do Motor de Impulsão) - 1
  '901': O metal é o recurso principal para edifícios e naves. É o recurso mais barato, mas também o que mais precisas e, tal como o cristal, é o que gasta menos energia a produzir. Quanto maiores as minas, mais fundo escavam na terra.
  '902': O cristal é o recurso principal dos circuitos eletrónicos e de certas ligas. É produzido em minas subterrâneas, onde a matéria-prima é logo transformada em circuitos.
  '903': O deutério encontra-se nos mares mais profundos e é um dos recursos mais raros do universo. Tens de chegar ao fundo do mar para o obter, o que faz dele o recurso mais caro.
  '911': A energia é necessária para produzir todos os recursos.
secureResources: Cada nível de um edifício de armazenamento protege 1% da produção diária desse recurso contra o saque durante os ataques, até um máximo de 10%.
shortDescription:
  '1': As minas de metal extraem o minério em que assenta todo o império, novo ou estabelecido.
  '2': O cristal é o ingrediente-chave dos circuitos eletrónicos e de certas ligas.
  '3': O deutério abastece as tuas naves espaciais e é colhido nas profundezas do mar. É uma substância rara, por isso é relativamente caro.
  '4': As plantas de energia solar transformam a luz do sol em energia. Todas as minas precisam de energia para funcionar.
  '6': Por predefinição, cada nível reduz o tempo de pesquisa em 8%.
  '12': A Planta de Fusão funde deutério para produzir energia.
  '14': As fábricas de robots fornecem robots de construção que ajudam a erguer os teus edifícios. Cada nível acelera a melhoria dos edifícios.
  '15': O expoente máximo da robótica. Cada nível reduz para metade o tempo de construção de edifícios, naves e defesas.
  '21': Todas as naves e defesas são construídas no hangar do planeta.
  '22': Armazena o excesso de metal.
  '23': Armazena o excesso de cristal.
  '24': Armazena o excesso de deutério.
  '31': Precisas de um laboratório de pesquisas para pesquisar novas tecnologias.
  '33': 'O Terra-Formador aumenta a área utilizável do planeta: 5 campos adicionais por nível, mais um extra em cada nível par. Cada nível ocupa ele próprio um campo.'
  '34': 'O depósito da aliança permite-te prolongar, em troca de deutério, a estadia das frotas amigas paradas no teu planeta: por reabastecimento até tantas horas quanto o nível do depósito.'
  '35': A doca de reparação restaura naves a partir de um campo de escombros.
  '41': A lua não tem atmosfera e uma lua nova só tem espaço para um edifício, por isso começa pela Base Lunar.
  '42': O Sensor Phalanx permite-te observar movimentos de frotas. Quanto mais alto o nível, maior o alcance do Phalanx.
  '43': Os Portais de Salto Quântico são enormes transmissores que enviam grandes frotas através do universo sem perder um segundo.
  '44': Os silos de mísseis guardam os teus mísseis.
  '106': Esta tecnologia permite-te recolher informações sobre outros planetas e luas.
  '108': Computadores melhores permitem-te comandar mais frotas. Cada nível de Tecnologia de Computadores aumenta em um o teu número máximo de frotas.
  '109': A Tecnologia de Armas torna os sistemas de armas mais eficazes. Cada nível aumenta o poder de ataque de todas as unidades em 10%, calculado sobre o valor base.
  '110': A Tecnologia de Escudo torna mais eficazes os escudos das naves e das estruturas defensivas. Cada nível aumenta a força dos escudos em 10%, calculado sobre o valor base.
  '111': Ligas especiais melhoram a blindagem das naves e das estruturas defensivas. Cada nível aumenta a eficácia da blindagem em 10%.
  '113': Dominar os diferentes tipos de energia é a chave de muitas tecnologias novas.
  '114': Ao integrar a 4.ª e a 5.ª dimensões, podes pesquisar um novo tipo de motor, mais económico e eficiente.
  '115': Desenvolver este motor torna algumas naves mais rápidas, mas cada nível só acrescenta 10% da velocidade base.
  '117': O motor de impulsão funciona pelo princípio da reação. Desenvolvê-lo torna algumas naves mais rápidas, mas cada nível só acrescenta 20% da velocidade base.
  '118': O motor de hiperespaço curva o espaço à volta de uma nave. Desenvolvê-lo torna algumas naves mais rápidas, mas cada nível só acrescenta 30% da velocidade base.
  '120': A luz focada produz um feixe que danifica tudo o que atinge.
  '121': Um feixe mortal de iões acelerados que causa danos enormes no impacto.
  '122': Um desenvolvimento da tecnologia de iões que acelera plasma de alta energia, criado ao sobreaquecer iões. Tem um efeito devastador no impacto.
  '123': Os investigadores de planetas diferentes comunicam através desta rede.
  '124': Desbloqueia a colonização e as expedições ao espaço profundo. Planetas extra em níveis ímpares, slots de expedição extra em níveis quadrados, permanências em expedição mais longas e mais posições de planeta num sistema.
  '131': Aumenta a produção de metal em 2% por nível.
  '132': Aumenta a produção de cristal em 2% por nível.
  '133': Aumenta a produção de deutério em 2% por nível.
  '134': Reduz os custos de voo em 2% por nível.
  '199': Disparar uma carga concentrada de partículas de gravitões cria um campo de gravidade artificial que pode destruir naves e até luas.
  '202': O Cargueiro Pequeno é uma nave ágil que transporta recursos rapidamente para outros planetas.
  '203': Este cargueiro transporta muito mais do que o Cargueiro Pequeno e, graças a um motor melhorado, costuma ser mais rápido.
  '204': A primeira nave de combate que todo o imperador constrói. O Caça Ligeiro é ágil, mas vulnerável sozinho; em grande número, torna-se uma ameaça real para qualquer império. Os Caças Ligeiros são os primeiros a escoltar Cargueiros Pequenos e Grandes até planetas hostis com defesas fracas.
  '205': Este caça tem melhor blindagem e bate mais forte do que o Caça Ligeiro.
  '206': Os Cruzadores têm quase três vezes a blindagem dos Caças Pesados e mais do dobro do poder de fogo. Também são muito rápidos.
  '207': As Naves de Batalha são a espinha dorsal de uma frota. Canhões pesados, alta velocidade e grandes porões fazem delas adversários a levar a sério.
  '208': Os planetas vagos podem ser colonizados com esta nave.
  '209': O Reciclador recolhe matérias-primas de campos de destroços.
  '210': As Sondas de Espionagem são drones pequenos e ágeis que entregam dados sobre frotas e planetas a grandes distâncias.
  '211': O Bombardeiro foi construído especificamente para destruir as defesas de um planeta.
  '212': Os Satélites Solares são plataformas simples de células solares numa órbita alta e estacionária. Recolhem a luz solar e enviam-na por laser para a estação em terra.
  '213': O Destruidor é o rei das naves de guerra.
  '214': O poder destrutivo da Estrela da Morte não tem rival, e consegue destruir luas.
  '215': O Intercetor é especialista em intercetar frotas hostis.
  '216': 'O sucessor da popular Estrela da Morte: muito mais rápida e resistente, com um porão enorme, mas bate um pouco menos forte.'
  '217': Uma evolução do Cargueiro Grande com muito mais capacidade de carga. Usa o motor de hiperespaço, por isso começa mais lento do que o Cargueiro Grande, mas passa-o à frente à medida que o teu Motor Propulsor de Hiperespaço sobe de nível.
  '218': O pior cenário possível de todos, embora muito lento.
  '219': Um porão enorme e motores novos permitem-lhe voar mais depressa e recolher mais dos campos de destroços.
  '220': O Colosso de Aço resiste a qualquer ataque com escudos maciços e blindagem espessa, mas as suas armas e motores deixam muito a desejar.
  '221': A Lâmina da Tempestade é um caça relâmpago, armado até aos dentes. Defesa? Desnecessária – as suas presas são transportadores e recicladores indefesos.
  '222': Um cruzador lento mas fortemente armado, com escudos melhorados e capacidades ofensivas reforçadas.
  '223': Uma reformulação do caça ligeiro, que prioriza a segurança da tripulação à custa de fracas características de voo.
  '224': Uma nave de transporte não testada com armamento mínimo, concebida para incomodar vizinhos descuidados e desencadear conflito imediato.
  '225': Uma nave que combina poder de combate, velocidade e capacidade de transporte, tornando-a indispensável para qualquer frota poderosa.
  '226': Um transportador de batalha fortemente blindado, de design imponente e ligeiramente volumoso, cujo poder de fogo esmagador pode derrotar até os adversários mais duros.
  '227': Uma versão melhorada do reciclador clássico com motores de impulso, permitindo missões de recuperação mais eficientes a menor custo.
  '228': Uma atualização do Reciclador extremamente rápida mas ineficiente, com motor de hiperespaço.
  '229': Desenvolvida para quebrar o domínio dos Xer, a Víbora é a arma definitiva contra Caças ligeiros, Caças pesados e Cruzadores. Com os seus canhões de disparo rápido e tecnologia avançada, altera o equilíbrio de poder no universo.
  '230': 'Rápido. Preciso. Intocável. O Intercetor não foi feito para combates justos: foi concebido para atacar depressa e com força, criando uma vantagem esmagadora num piscar de olhos.'
  '231': Uma Estrela da Morte mais pequena e mais rápida, sem a capacidade de destruir luas. «Mortal contra frotas» é o que melhor descreve o Behemoth.
  '232': Mais rápido, mais explosivo, sempre uma boa surpresa. O Titã do Vazio é o terror das luas.
  '401': O Lançador de Mísseis é uma defesa simples mas económica.
  '402': Os lasers ligeiros são armas de defesa simples assentes no solo. Sistemas de pontaria especiais seguem as naves inimigas e um laser de alta intensidade corta o casco do alvo.
  '403': O Laser Pesado é uma versão melhorada do Laser Ligeiro.
  '404': O Canhão de Gauss dispara projéteis metálicos de alta densidade a uma velocidade altíssima.
  '405': Um canhão de iões dispara feixes de iões (partículas com carga positiva ou negativa).
  '406': O Canhão de Plasma usa uma grande célula de combustível de reator nuclear para alimentar um acelerador eletromagnético que dispara pulsos (toroides) de plasma.
  '407': O Pequeno Escudo Planetário envolve o planeta inteiro num campo que absorve quantidades enormes de energia.
  '408': O Grande Escudo Planetário consegue absorver substancialmente mais energia durante os ataques.
  '409': A evolução da tecnologia dos escudos planetários. Usa muito mais energia, mas aguenta mais ataques do que qualquer outro escudo.
  '410': Após anos de investigação sobre a gravidade, os cientistas desenvolveram um canhão de gravitões que gera um pequeno campo de gravitões concentrado e o dispara contra o inimigo.
  '411': Uma plataforma de defesa imóvel, sem propulsão própria, mantida numa órbita estável à volta do planeta pela gravidade. Iniciar este processo exige enormes quantidades de energia.
  '412': Protege! Como o bloco de Lego no Kindergarten TD.
  '413': O Laser Titã é um laser colossal.
  '414': O Engodo é um sistema defensivo sofisticado, concebido para enganar e confundir as forças inimigas. Ao disfarçar-se de Lançador de Mísseis, dissuade ataques.
  '502': Os mísseis de interceção destroem os mísseis interplanetários que se aproximam.
  '503': Os mísseis interplanetários destroem as defesas do adversário.
  '901': O metal é o recurso principal para edifícios e naves. É o recurso mais barato, mas também o que mais precisas.
  '902': O cristal é o recurso principal usado para construir circuitos eletrónicos e formar certas ligas.
  '903': O deutério encontra-se nos mares mais profundos. É o recurso mais caro e também o que precisa de mais energia.
  '911': A energia é necessária para produzir todos os recursos.
