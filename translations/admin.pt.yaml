adm_nav_social: Início de sessão social
se_social: Início de sessão social
se_social_info: Permite que os jogadores iniciem sessão ou se registem com uma conta existente do Discord, Facebook, GitHub ou Google (OAuth2). Todos os fornecedores estão desativados por defeito. Cria uma aplicação no fornecedor, regista lá o URL de callback indicado abaixo e introduz aqui o ID de cliente e o segredo.
se_social_site_url_missing: O URL base do jogo (DEFAULT_URI em .env.local) não está definido, por isso não é possível criar o URL de callback e os fornecedores ficam inutilizáveis.
se_social_incomplete: 'Ativado, mas falta o ID de cliente ou o segredo: o botão de início de sessão permanece oculto.'
se_social_enabled: Ativado
se_social_enabled_info: Mostra o botão de início de sessão na página inicial e na página de registo.
se_social_client_id: ID de cliente
se_social_client_id_info: ID da aplicação (cliente) no fornecedor.
se_social_client_secret: Segredo de cliente
se_social_client_secret_info: Nunca mais é mostrado. Deixa vazio para manter o segredo guardado.
se_social_callback: URL de callback
