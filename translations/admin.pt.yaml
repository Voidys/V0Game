abuse_link_multi: grupo multi
abuse_link_multi_known: grupo multi (conhecido)
abuse_link_subnet: mesma sub-rede (mais fraco)
abuse_thresholds: 'Limiares: um par de transferências aparece quando um sentido ultrapassa %s unidades de metal e no máximo %s regressam; os pares de mercado aparecem a partir de %s trocas, assinalados acima de %s de diferença. Sem linhas significa que nada atingiu estes limiares (ou que os registos estão vazios), não que nada tenha acontecido.'
abuse_transfers: Transportes e retenções unilaterais
abuse_transfers_info: Transportes, retenções e transferências de naves (não recolhidas; naves contadas pelo custo de construção) entre dois jogadores cuja carga valia pelo menos %s unidades de metal num sentido, enquanto no máximo %s desse valor regressou. Ordenado pelo valor líquido; os pesos são os rácios de mercado guardados.
abuse_trades: Trocas repetidas no mercado
abuse_trades_info: Trocas de recursos entre os mesmos dois jogadores, pelo menos %s vezes. Rácio = valor dado pelo lado que mais deu, dividido pelo do outro lado (1,00 = referência do mercado); acima de %s de diferença o par é assinalado.
abuse_giver: Deu mais
abuse_receiver: Recebeu mais
abuse_ratio: Rácio
abuse_outlier: atípico
abuse_protections: Concessões de proteção de reconstrução
abuse_protections_info: Jogadores que receberam uma proteção de reconstrução no período. Os oponentes são a outra parte do relatório de combate desse confronto; o saque é o valor que as suas frotas ganharam nele (os destroços e o valor destruído não são guardados).
abuse_protected: Jogador protegido
abuse_granted: Concedida
abuse_opponents: Oponentes
abuse_loot: Saque do oponente
abuse_report: Relatório
abuse_recalls: Recolhas na chegada ou depois
abuse_recalls_info: Frotas de ataque, ACS e destruição que foram recolhidas quando a hora de chegada já tinha sido atingida (padrão de recolha após a chegada).
abuse_mission: Missão
abuse_arrival: Chegada
abuse_recalled: Recolhida
abuse_late: Após a chegada
abuse_fought: combateu
abuse_mission_1: Ataque
abuse_mission_2: Ataque ACS
abuse_mission_9: Destruição
abuse_missiles_skipped: 'Os lançamentos de mísseis face ao conteúdo dos silos não fazem parte deste relatório: as tabelas não guardam histórico de silos com que comparar.'
abuse_link_device: mesmo dispositivo
abuse_graph: Grupos de fluxo de valor
abuse_graph_info: 'Jogadores ligados por fluxo de valor nos últimos %s dias (período fixo): transportes, retenções, transferências de naves (ao custo de construção), trocas no mercado (ambos os lados) e saque de ataques, somados nos dois sentidos. Só se ligam pares com pelo menos %s unidades de metal movidas e %s fluxos; são listados os grupos ligados de dois ou mais (top %s por valor). Líquido = valor do par mais unilateral do grupo (parte do seu valor total). As marcas de ligação indicam se os membros partilham IP, dispositivo ou grupo multi com outro membro. As linhas são lidas com um limite por origem.'
abuse_members: Membros
abuse_value: Valor total
abuse_flows: Fluxos
abuse_top_edge: Par mais unilateral
abuse_activity: Atividade de envio de frotas (24 h)
abuse_activity_info: Contas com mais envios de frotas nas últimas 24 horas; pico = envios na hora de maior movimento. Picos altos e constantes podem indicar jogo automatizado.
abuse_player: Jogador
abuse_launches: Envios
abuse_peak: Pico / hora
adm_dash_unprotected: 'As proteções anti-abuso estão desligadas neste universo:'
adm_dash_unprotected_push: A proteção contra pressão por transporte, retenção e transferência está desligada (transport_push_check / transport_push_limit).
adm_dash_unprotected_honor: O limite de combates honrosos é 0 (honra ilimitada entre os mesmos dois jogadores).
adm_dash_unprotected_bash: As guerras declaradas levantam o limite bash (bash_war_exempt).
adm_dash_unprotected_depot: As retenções no depósito custam o consumo base barato (depot_cost_real_consumption desligado).
adm_dash_unprotected_market: A tolerância de pressão no mercado está acima de 10 % (market_push_tolerance).
