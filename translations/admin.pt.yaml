se_bots_attack_actives: "Atacar jogadores ativos"
se_bots_attack_actives_info: "Desligado: os bots só atacam jogadores que não estiveram ativos na última hora (jogadores inativos e outros bots)."
se_bots_raids_per_target_day: "Ataques por alvo e dia"
se_bots_raids_per_target_day_info: "Máximo de ataques de um bot ao mesmo jogador em 24 horas. 0 = valor do perfil do bot (2-4). O limite de bash do jogo aplica-se sempre além disto."
se_bots_target_cooldown_hours: "Pausa por alvo (horas)"
se_bots_target_cooldown_hours_info: "Durante quanto tempo um alvo é deixado em paz após um olhar pouco rentável, um voo recusado ou uma retirada."
se_bots_min_target_points: "Pontos mínimos do alvo"
se_bots_min_target_points_info: "Os bots ignoram jogadores com menos pontos (0 = desligado)."
se_bots_min_target_ratio_percent: "Tamanho mínimo do alvo em percentagem do bot"
se_bots_min_target_ratio_percent_info: "Os bots ignoram jogadores cujos pontos estão abaixo desta percentagem dos seus (0 = desligado)."
se_bots_probes_per_target_day: "Voos de sondas por alvo e dia"
se_bots_probes_per_target_day_info: "Máximo de voos de espionagem de um bot ao mesmo planeta em 24 horas (0 = só a pausa de espionagem os limita)."
se_bots_probes_wanted: "Sondas que um bot de ataques mantém em casa"
se_bots_probes_wanted_info: "Um bot que vai atacar constrói sondas até ter tantas."
se_bots_min_loot: "Saque mínimo (valor)"
se_bots_min_loot_info: "Um ataque tem de prometer pelo menos este saque (metal + 1,5 cristal + 2 deutério)."
se_bots_escort_shares: "Quotas de escolta em percentagem"
se_bots_escort_shares_info: "Quotas das naves de guerra do planeta experimentadas como escolta, da menor para a maior, separadas por vírgulas (ex.: 0, 15, 30, 50, 75, 100)."
se_bots_simulation_runs: "Combates simulados por frota"
se_bots_simulation_runs_info: "Uma frota só é enviada se vencer todos os combates simulados (1-5)."
se_bots_spy_cooldown_minutes: "Pausa de espionagem (minutos)"
se_bots_spy_cooldown_minutes_info: "Minutos antes de um bot espiar o mesmo planeta de novo (o alvo recebe de cada vez uma mensagem de contraespionagem)."
se_bots_spy_cooldown_streak_minutes: "Pausa de espionagem numa série de ataques (minutos)"
se_bots_spy_cooldown_streak_minutes_info: "O mesmo durante uma série de ataques, em que os relatórios recentes contam."
se_bots_recall_loot_percent: "Retirada abaixo desta quota do saque mínimo (%)"
se_bots_recall_loot_percent_info: "A nova espionagem antes do impacto retira uma frota quando o saque esperado cai abaixo desta percentagem do saque mínimo."
se_bots_recall_ratio_percent: "Retirada abaixo desta quota da razão de lucro exigida (%)"
se_bots_recall_ratio_percent_info: "O mesmo para a razão entre saque e combustível e perdas."
se_bots_streak_loot_percent: "Série de ataques após um golpe no valor de (% do saque mínimo)"
se_bots_streak_loot_percent_info: "Um golpe que rendeu pelo menos esta quota do saque mínimo inicia uma série de ataques."
se_bots_raids_per_human_day: "Ataques por jogador e dia (todos os bots juntos)"
se_bots_raids_per_human_day_info: "Máximo de ataques de bots ao mesmo jogador humano em 24 horas, contados em todos os bots do universo (limite antifrustração, sempre ativo)."
se_bots_human_cooldown_hours: "Pausa por jogador entre ataques de bots (horas)"
se_bots_human_cooldown_hours_info: "Depois de um ataque de bot a um humano, nenhum bot o ataca durante este tempo, e nunca enquanto outro ataque de bot contra ele estiver a caminho."
se_bots_probes_per_human_day: "Voos de sondas por jogador e dia (todos os bots juntos)"
se_bots_probes_per_human_day_info: "Máximo de voos de espionagem de bots ao mesmo jogador humano em 24 horas, contados em todos os bots do universo."
se_bots_scout_range_max: "Maior alcance de exploração (sistemas)"
se_bots_scout_range_max_info: "Os bots nunca olham para além deste número de sistemas em redor dos seus planetas, diga o que disser o perfil: aproximadamente o que um jogador percorre na vista da galáxia."
se_bots_respy_jitter_seconds: "Desvio aleatório da nova espionagem (segundos)"
se_bots_respy_jitter_seconds_info: "A espionagem pouco antes do impacto de um ataque é enviada ao acaso até este número de segundos antes do previsto (0 = tempo exato)."
se_bots_timezone_spread_hours: "Dispersão do fuso horário pessoal (horas)"
se_bots_timezone_spread_hours_info: "Cada bot recebe um desvio pessoal estável até este número de horas (mais ou menos) face ao relógio do servidor, para que os bots de um perfil não joguem todos à mesma hora (0 = desligado)."
se_bots_fleetsave_enabled: "Os bots põem a frota a salvo"
se_bots_fleetsave_enabled_info: "Desligado: os bots nunca põem a frota a salvo, nem no fim de uma sessão nem perante um ataque a caminho."
se_bots_fleetsave_keep_percent: "Recursos que uma fuga de frota deixa em casa (%)"
se_bots_fleetsave_keep_percent_info: "Parte de cada reserva que fica no planeta para que a construção continue."
se_bots_fleetsave_min_offline_minutes: "Menor tempo offline que justifica uma fuga de frota (minutos)"
se_bots_fleetsave_min_offline_minutes_info: "No fim de uma sessão, um bot só põe a frota a salvo se espera ficar ausente pelo menos este tempo."
se_bots_threat_window_hours: "Janela de ameaça (horas)"
se_bots_threat_window_hours_info: "As frotas hostis a caminho são notadas este número de horas antes do impacto."
se_bots_ship_weight_percent: "Peso da construção de naves (%)"
se_bots_ship_weight_percent_info: "Multiplicador de quanto os bots preferem construir naves em vez de outras coisas (100 = clássico)."
se_bots_defense_weight_percent: "Peso da construção de defesas (%)"
se_bots_defense_weight_percent_info: "Multiplicador de quanto os bots preferem construir defesas (100 = clássico)."
se_bots_growth_speed_percent: "Velocidade de crescimento (%)"
se_bots_growth_speed_percent_info: "Multiplicador do ganho diário de habilidade dos perfis de bots (100 = clássico; perfis sem ganho de habilidade ficam como estão)."
se_bots_growth_bonus: "Ganho de habilidade extra por dia (milésimos)"
se_bots_growth_bonus_info: "Somado ao ganho diário de habilidade de cada bot (10 = um ponto percentual por dia), limitado pela habilidade máxima do perfil."
se_bots_max_planets: "Máximo de planetas por bot"
se_bots_max_planets_info: "Os bots deixam de colonizar com este número de planetas (0 = só se aplica o limite do jogo)."
se_bots_activity_percent: "Multiplicador de atividade (%)"
se_bots_activity_percent_info: "Escala a probabilidade horária de um bot ficar online (100 = tabela do perfil; acima de 100 os bots entram mais vezes)."
se_bots_hidden_rhythm_percent: "Percentagem de bots com ritmo oculto (%)"
se_bots_hidden_rhythm_percent_info: "Estes bots deslocam o seu ritmo diário de uma quantidade diferente todos os dias, por isso não são previsíveis pelas horas online."
se_bots_revenge: "Vingança"
se_bots_revenge_info: "Os bots guardam rancor (sobe quando um jogador os ataca ou espia, desce 10 % por dia) e exploram e contra-atacam o jogador mais hostil ao alcance, quando o planeador de ataques encontra um plano vencível. Os limites por jogador e dia continuam a aplicar-se."
se_bots_bot_acs: "Ataques de grupo de bots"
se_bots_bot_acs_info: "Um bot que não consegue vencer um alvo sozinho abre um ataque de grupo e convida bots aliados (mesma aliança) que estejam online; juntam-se como os jogadores. Os limites por jogador e dia contam um grupo como um só ataque."
se_bots_recycling: "Reciclagem"
se_bots_recycling_info: "Os bots enviam recicladores para os campos de destroços que veem em redor dos seus planetas (primeiro os dos seus próprios combates) quando a colheita supera o combustível, e constroem alguns recicladores se não tiverem."
se_bots_moons: "Luas"
se_bots_moons_info: "Os bots usam as suas luas: as frotas são estacionadas na lua ao sair e os ataques podem partir de uma lua."
se_bots_missiles: "Mísseis"
se_bots_missiles_info: "Os bots com silo de mísseis (nível 4), propulsor de impulso e mísseis interplanetários disparam contra a defesa de um alvo que bloqueia um ataque, espiam de novo e atacam. Com este interruptor ligado, os bots constroem silos e mísseis."
se_bots_warmonger: "Belicista de fim de jogo"
se_bots_warmonger_info: "A partir dos pontos abaixo, um bot ataca mais vezes, aceita menos lucro e também toma jogadores ativos como alvos. O planeador de ataques e os limites por jogador continuam a aplicar-se."
se_bots_warmonger_points: "Limiar de pontos do belicista"
se_bots_warmonger_points_info: "Pontos a partir dos quais um bot pode tornar-se belicista."
