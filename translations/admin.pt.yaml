se_bots_preset: "Predefinição de dificuldade"
se_bots_preset_info: "Escolher uma predefinição e guardar preenche os valores dos bots abaixo (ataques ligados/desligados e as definições de capacidade não são alterados); editar um valor depois muda a predefinição para personalizada. Cada predefinição mantém os limites que protegem os jogadores: ataques por alvo e dia, pausa por alvo, nunca jogadores com proteção de novato ou de férias. Cada bot pode substituir a predefinição na lista de bots."
