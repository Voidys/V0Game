hof_cleared: Dados do Hall da Fama apagados.
hof_error_nofile: Não foi carregado nenhum ficheiro válido.
hof_error_invalid: 'Importação recusada:'
se_bash_war_exempt: As guerras levantam o limite bash
se_bash_war_exempt_info: 'Os ataques entre alianças em guerra (aceites, com mais de um dia) não contam para os limites bash. Desligado: os ataques de guerra contam como todos os outros.'
se_honor_pair_cap: Combates honrosos por par (24 h)
se_honor_pair_cap_info: Quantos combates honrosos entre os mesmos dois jogadores (em qualquer sentido) dão honra em 24 horas. Os combates seguintes contam como neutros. 0 = ilimitado.
se_market_push_tolerance: Tolerância de pressão no mercado
se_market_push_tolerance_info: Diferença de valor aceite numa troca do mercado, em percentagem (0-90), antes de contar como pressão. Predefinido 30.
se_transport_push_check: Proteção contra pressão por transporte
se_transport_push_check_info: Recusa transportes, retenções e transferências (carga e naves) para outro jogador quando, nos últimos 7 dias, o valor enviado para ele excede em mais do que o limite abaixo o valor que ele devolveu.
se_transport_push_limit: Limite de pressão por transporte
se_transport_push_limit_info: Valor da carga em unidades de deutério (rácios do mercado) acima do qual a proteção se aplica. 0 = proteção desligada.
se_depot_cost_real_consumption: Custo do depósito por consumo real
se_depot_cost_real_consumption_info: O depósito da aliança cobra o consumo real de combustível da frota (com as tecnologias de propulsão e de combustível do dono) / 10 por hora, em vez do consumo base / 10.
se_hours: Horas
se_remember_me_days: «Manter sessão iniciada» dura
se_remember_me_days_info: Dias em que um início de sessão com a caixa «Manter sessão iniciada» marcada sobrevive a reinícios do navegador e a sessões expiradas. Uma alteração da palavra-passe termina-o. 0 desativa a opção.
se_session_lifetime: A sessão expira após um período de inatividade de
se_session_lifetime_info: Horas sem qualquer pedido após as quais um jogador é desconectado («sessão expirada»).
