se_pow_adaptive: Proteção contra bots - dificuldade adaptativa
se_pow_adaptive_info: 'Ativado: endereços IP e redes suspeitos (/24 ou /64) recebem um cálculo muito mais difícil (muitos pedidos, falhas ou registos em pouco tempo). Desativado: todos os visitantes recebem o cálculo básico e não são lidos contadores.'
se_pow_elevated_factor: Proteção contra bots - fator com risco elevado
se_pow_elevated_factor_info: O cálculo fica tantas vezes mais difícil (predefinido 20).
se_pow_high_factor: Proteção contra bots - fator com risco alto
se_pow_high_factor_info: O cálculo fica tantas vezes mais difícil (predefinido 100).
se_pow_max_cap: Proteção contra bots - limite de dificuldade
se_pow_max_cap_info: O número mais alto depois de aplicar os fatores. 1500000 demora cerca de 25 segundos num smartphone lento.
se_pow_sensitivity: Proteção contra bots - sensibilidade da deteção de risco
se_pow_sensitivity_info: Percentagem dos limiares predefinidos (elevado a partir de 5 pedidos/10 min, 3 falhas/hora ou 2 registos/24 h por IP; alto a partir de 20 / 10 / 5; redes, o triplo). 200 = são precisos o dobro de eventos, 50 = metade.
se_pow_max_number: Proteção contra bots - dificuldade (número máximo)
se_pow_max_number_info: O navegador testa hashes até este número, metade em média. 100000 demora cerca de meio a um segundo. Um valor mais alto dá mais trabalho aos bots.
se_pow_min_seconds: Proteção contra bots - tempo mínimo antes de enviar (segundos)
se_pow_min_seconds_info: Os formulários enviados mais depressa do que isto após o carregamento são recusados. 0 desativa a verificação.
se_proofofwork: Proteção contra bots
se_proofofwork_info: O registo e a recuperação da palavra-passe estão protegidos por um pequeno cálculo que o navegador resolve por si, sem qualquer terceiro.
se_rebuild_protection: Reconstrução da proteção
se_rebuild_protection_info: Em caso de grandes perdas, os jogadores recebem proteção de reconstrução contra novos ataques após 6 horas e durante 48 horas após o ataque. 70% da frota ou 80% da capacidade de transporte deve ser destruída num só ataque. Além disso, isto deve corresponder a pelo menos os pontos de proteção Noop * 1000 em unidades ou capacidade. O utilizador pode terminar o modo prematuramente.
