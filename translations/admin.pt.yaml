se_bots_raids_enabled: Os bots atacam outros jogadores
se_bots_raids_enabled_info: Permite que os bots explorem, espiem e ataquem jogadores e outros bots próximos, com as mesmas regras dos jogadores (limite de bash, proteção, modo de férias). Desativado por defeito.
