se_bots: Bots
se_bots_enabled: Ativar bots
se_bots_enabled_info: Permite que bots do lado do servidor joguem neste universo. São processados pelo cronjob uma vez por minuto.
se_bots_llm_daily_limit: Chamadas ao LLM por bot e dia
se_bots_llm_daily_limit_info: Número máximo de chamadas ao LLM que um bot pode fazer por dia. Depois são usadas alternativas locais.
se_bots_llm_enabled: Usar LLM para nomes e chat
se_bots_llm_enabled_info: Ativa alcunhas, personas, nomes de planetas e chat (mensagens, alianças, amigos) gerados por LLM com o fornecedor ativo. As decisões de jogo permanecem sempre locais.
