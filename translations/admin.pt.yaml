adm_info_chk_php: Versão do PHP (8.4 ou superior)
adm_info_chk_php_hint: O jogo precisa de PHP 8.4 ou superior.
adm_info_chk_ext_required: Extensões PHP necessárias
adm_info_chk_ext_required_hint: Instala as extensões em falta; o jogo não funciona sem elas.
adm_info_chk_ext_optional: Extensões PHP opcionais
adm_info_chk_ext_optional_hint: Não são obrigatórias, mas ativam funcionalidades mais rápidas ou extra (vê a lista de extensões).
adm_info_chk_opcache: OPcache
adm_info_chk_opcache_hint: O OPcache está desativado. Ativa-o em produção, acelera muito o PHP.
adm_info_chk_environment: Ambiente (APP_ENV / depuração)
adm_info_chk_environment_hint: Corre com APP_ENV=prod e a depuração desativada num servidor público.
adm_info_chk_display_errors: display_errors
adm_info_chk_display_errors_hint: A saída de erros nas páginas pode expor dados internos. Define display_errors=Off em servidores públicos.
adm_info_chk_writable: Diretórios com permissão de escrita
adm_info_chk_writable_hint: O utilizador do servidor web tem de poder escrever nestes diretórios (caches, registos, sessões, uploads).
adm_info_chk_install_tool: Ferramenta de instalação
adm_info_chk_install_tool_hint: var/ENABLE_INSTALL_TOOL existe. Apaga-o quando não estiveres a instalar.
adm_info_chk_migrations: Migrações da base de dados
adm_info_chk_migrations_hint: Há migrações pendentes. São aplicadas no próximo pedido do jogo; verifica o registo se continuarem pendentes.
adm_info_chk_battle_engine: Motor de batalha
adm_info_chk_battle_engine_hint: O motor Rust não é utilizável (bin/battlerust, bin/libbattlerust.so, proc_open). As batalhas correm no motor PHP, mais lento.
adm_info_chk_cron: Cronjobs
adm_info_chk_cron_hint: O cron parece bloqueado ou não está a correr. Verifica se o bin/console app:cron:run corre a cada minuto e desbloqueia as tarefas bloqueadas em Cronjobs.
adm_info_chk_https: HTTPS
adm_info_chk_https_hint: Este pedido não usou HTTPS. Palavras-passe e sessões viajam sem cifra.
adm_info_chk_mail: Envio de correio
adm_info_chk_mail_hint: O correio está desativado ou incompleto (os e-mails de ativação e de reposição da palavra-passe não vão chegar). Vê as definições.
