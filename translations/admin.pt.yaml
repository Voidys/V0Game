se_community_links: Links da comunidade
se_discord_url: URL de convite do Discord
se_discord_url_info: Link de convite do teu servidor Discord (https://...). Mostrado no menu, na página de login, em e-mails e textos. Vazio = oculto.
se_discord_widget_guild: ID do servidor Discord (widget online)
se_discord_widget_guild_info: ID do teu servidor Discord (17-20 dígitos; em Definições do servidor → Widget, «Ativar widget do servidor» tem de estar ativo). Mostra uma caixa com o número de online na página inicial, atualizada a cada 5 minutos. Vazio oculta-a.
se_wiki_url: URL da wiki
se_wiki_url_info: URL base de uma wiki externa, sem barra final (https://...). Os links da wiki no FAQ, tutorial e regras são formados a partir dela. Vazio = ocultos.
se_donate_url: URL de doações
se_donate_url_info: Link para doações (https://...), mostrado no menu. Vazio = oculto.
se_userscripts_url: URL de userscripts
se_userscripts_url_info: Página com userscripts para o teu jogo (https://...), ligada nas definições. Vazio = oculto.
se_bots_alliances_enabled: Os bots formam alianças
se_bots_alliances_enabled_info: 'Os bots fundam as suas próprias alianças e de vez em quando juntam-se a outras. Desligado: os bots ficam lobos solitários, não se candidatam a nada e saem das alianças de que são membros (as alianças fundadas por um bot mantêm-se).'
se_bots_join_human_alliances: Os bots podem juntar-se a alianças de jogadores
se_bots_join_human_alliances_info: 'Os bots também se podem candidatar a alianças fundadas por jogadores humanos. Desligado: os bots só se juntam a alianças fundadas por bots e saem das alianças de jogadores.'
se_bot_reply_delay_hours: Atraso de resposta (horas)
se_bot_reply_delay_hours_info: Horas que a mensagem privada mais antiga sem resposta de um jogador espera antes de um bot responder a todas as mensagens pendentes desse jogador numa única resposta. É também o intervalo mínimo entre duas mensagens iniciadas pelos bots (reações a ataques, provocações de saque) para o mesmo jogador. 0 = sem atraso.
se_bot_chatter: Os bots conversam
se_bot_chatter_info: 'Ativado: os bots respondem às mensagens privadas. Desligado: as mensagens continuam a ser lidas e contadas, mas só são enviadas reações de combate (depois de serem atacados ou de saquearem um jogador que lhes escreveu). Os bots nunca escrevem primeiro aos jogadores.'
