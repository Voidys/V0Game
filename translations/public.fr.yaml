registerWelcomePMText: 'Bienvenue sur %s ! Construis d’abord une centrale solaire : il faut de l’énergie pour produire des ressources. Ouvre Bâtiments dans le menu de gauche et commence par la centrale solaire.<br>Une fois l’énergie assurée, tu peux construire des mines. Reste dans Bâtiments et construis une mine de métal, puis une mine de cristal.<br><br>Pour construire des vaisseaux, il te faut un chantier spatial. Le menu Technologie à gauche indique ce qu’il faut pour le débloquer.<br>Si tu as d’autres questions, consulte la FAQ, le wiki, ou ouvre un ticket de support.<br><br>L’équipe te souhaite beaucoup de plaisir à explorer l’univers !'
