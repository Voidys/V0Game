tutorial_text:
  step0: "Welcome to {game_name}!<br><br>\r\nThis short tutorial walks you through the basics.<br>\r\nWe link to our wiki a lot, because not everything fits in a tutorial. You can open it any time from the menu on the left.<br>\r\nYou can skip the tutorial whenever you like, but you can't restart it later.<br><br>\r\nGood luck, Imperator!"
  step1: "Your goal: score as many points as you can. You earn one point for every 1,000 resources you spend, and the best source of resources is your own mines.<br>\r\nStart with your basic supplies: you need Metal and Crystal from their mines, plus Energy from the Solar Power Plant to keep them running. If Energy runs short, your mines produce below 100%.<br>\r\nUpgrade these buildings in the <b>Buildings</b> menu. Click a building's name to see what the next level gives you, and how much Energy it will use.<br><br>\r\nWant to know more? Have a look at the <b>Wiki</b>: \r\n<a href=\"{wiki_url}/wiki/En/Rohstoffe\" target=\"_blank\">Resources</a>"
  step2: "Playing is more fun together. Most players hang out on our Discord, where you can get answers and find people to play with.<br>\r\nStill stuck? You can also open a support ticket here."
  step3: "Raiding other players' planets is another way to get resources - and it can happen to you, too. So build your first defense!<br>\r\nEven a small defense protects your production overnight.<br><br>\r\nNumbers alone don't decide a fight; the make-up of the attacking fleet matters as well.<br>\r\nAttackers have to get past your defense before they can plunder, and every ship they have to send cuts their profit and may cost them more ships.<br>\r\nBuild defenses in the <b>Shipyard</b>, on the <b>Defense</b> tab. You need a Shipyard (which in turn needs a Robot Factory) and some Deuterium.<br><br>\r\nHere is the matching article in the wiki: \r\n<a href=\"{wiki_url}/wiki/En/Verteidigung\" target=\"_blank\">Defense facilities</a>"
  step4: "Keep your supplies flowing by expanding your mines!<br>\r\nBuildings, ships, defenses and research get more expensive over time, so your production has to grow with them. Open Buildings now and upgrade your mines whenever you have the resources."
  step5: "Build yourself a Light Cargo!<br>\r\nLight Cargos are fast, handy transporters.<br>\r\nWith the Impulse Engine they are faster than the Heavy Cargo over longer distances.<br>\r\nUse them to move resources between your planets, to trade with other players, or to raid them.<br><br>\r\nMore in the wiki: \r\n<a href=\"{wiki_url}/wiki/En/Schiffe\" target=\"_blank\">Ships</a>"
  step6: "Give your planet a name to keep track of it. In the Overview, click the planet name in the header of the points display. Go on, try it now.<br><br>\r\nYou can also send buddy requests to other players. Once they accept, you can chat more easily and see each other's online status. You don't need to share an alliance for this. Buddies can also hold fleets at each other's planets, so you can defend together outside an alliance.<br><br>\r\nOr join an alliance and play as a team. You no longer need separate buddy requests to hold fleets. Inside the alliance you can send circular messages and see online status and score of other members, depending on your alliance rank."
  step7: "To find out what resources, buildings, research, ships and defenses another player has, you have to spy on them. Send a Spy Probe to a player from the Fleet menu or from the Galaxy view.<br>\r\nKeep in mind that other players can spy on you, too!"
  step8: >-
    An expedition can bring resources, ships, special events or losses. To try
    one, take a ship, choose planet position 16 as the target and the mission
    "Expedition" in the Fleet menu.<br>

    Every ship type adds to the size of your expedition fleet, up to a limit
    where the maximum event size is reached.<br><br>

    The wiki explains what you can change to maximize your profit: 

    <a href="{wiki_url}/wiki/En/Expoanleitung"
    target="_blank">Expeditions</a>
  step9: "The more planets you colonize, the faster you grow: you can produce resources and build ships on several planets at once. Note that you can only settle the inner or outer edge of a system if your Astrophysics level is high enough. The Colony Ship itself can be built without Astrophysics, but your first colony needs it!<br><br>\r\nColonizing in your own system or directly next door keeps transport routes short. The downside: later in the game, players may place a colony in your system not for its mines but as a temporary fleet base - a so-called raid colony.<br><br>\r\nMore in the wiki: \r\n<a href=\"{wiki_url}/wiki/En/Astrophysik\" target=\"_blank\">Astrophysics</a>"
  step10: "Want resources faster? Attack other players. Weigh cost against benefit so your attack pays off, and use spy reports and the combat simulator to plan it.<br><br>\r\nCareful! Other players can track many fleet missions in various ways.<br>\r\nNot losing your hard-earned fleet is one of the most important parts of the game.<br><br>\r\nSo be sure to read these wiki topics: \r\n<a href=\"{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden\" target=\"_blank\">Fleet saving</a> - \r\n<a href=\"{wiki_url}/wiki/En/Sensorenphalanx\" target=\"_blank\">Sensor Phalanx</a>"
  step10_u6: >-
    Want resources faster? Attack other players. Weigh cost against benefit so
    your attack pays off, and use spy reports and the combat simulator to plan
    it.<br><br>

    Careful! Other players can track many fleet missions in various ways.<br>

    Not losing your hard-earned fleet is one of the most important parts of the
    game.<br><br>

    So be sure to read these wiki topics:

    <a
    href="{wiki_url}/wiki/En/Slippys_progame_flottensicherung_leitfaden"
    target="_blank">Fleet saving</a>
  step11: "When fleets are destroyed, they leave a debris field that you can harvest. For that you need Recyclers, with a cargo capacity of 20,000 each. Wiping out a large fleet can be a lucrative source of resources.<br><br>\r\nYou can also send Recyclers straight from the Galaxy view by clicking a debris field, instead of using the Fleet menu."
  step12: "Congratulations, you have completed the tutorial!<br><br>\r\nThe game has plenty more to offer.<br>\r\nFor example, there are roughly three playstyles, which also differ in the time they demand:<br>\r\n<ul>\r\n<li>Miner: expands mines on many colonies and mainly flies transporters</li>\r\n<li>Fleeter: puts most points into warships, has hardly any production of their own and lives from raiding other players</li>\r\n<li>Comber: a mix of both</li>\r\n</ul>\r\nMoons become important later in the game, and by now you should have met the Sensor Phalanx.<br><br>\r\nStill have questions? Read the wiki or ask the community on Discord."
  step12_u6: >-
    Congratulations, you have completed the tutorial!<br><br>

    The game has plenty more to offer.<br>

    For example, there are roughly three playstyles, which also differ in the
    time they demand:<br>

    <ul>

    <li>Miner: expands mines on many colonies and mainly flies
    transporters</li>

    <li>Fleeter: puts most points into warships, has hardly any production of
    their own and lives from raiding other players</li>

    <li>Comber: a mix of both</li>

    </ul>

    Still have questions? Read the wiki or ask the community on Discord.
tutorial_title:
  step0: "Welcome, Imperator!"
  step1: Time to start mining!
  step2: Come and meet people!
  step3: "Don't leave your planet undefended!"
  step4: "Think ahead!"
  step5: Ships, we need ships!
  step6: "Name your planet and find friends!"
  step7: "See what the others have!"
  step8: "Into the unknown!"
  step9: "One planet is never enough!"
  step10: Tired of waiting for your mines?
  step11: "Time to take out the trash!"
  step12: "You made it!"
