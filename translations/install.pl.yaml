ins_credits_head: Na ramionach gigantów
ins_credits_text: 'V0Game kontynuuje długą linię otwartoźródłowych gier przeglądarkowych. Szacunek dla wszystkich, którzy zbudowali ją i podtrzymywali przy życiu przed nami:'
ins_credits_thanks: 'Dziękujemy wszystkim programistom i opiekunom, którzy przez lata tworzyli tę grę i utrzymywali ją przy życiu, od 2Moons i SteemNova po pr0game.'
ins_licence_note: Wolne oprogramowanie na licencji GNU AGPL v3
ins_task_images: Optymalizuj obrazy (WebP)
ins_db_help: V0Game przechowuje wszystko w bazie danych MySQL lub MariaDB. Poniższe wartości otrzymasz w panelu swojego hostingu (szukaj „Bazy danych” lub „MySQL”) albo od osoby, która skonfigurowała serwer. Jeśli samodzielnie zainstalowałeś MySQL, zwykle działają wartości domyślne.
ins_db_host: Serwer bazy danych
ins_db_host_info: Prawie zawsze „localhost”. Niektórzy dostawcy podają nazwę typu „db1.example.com”.
ins_db_name_info: Nazwa bazy danych dla gry. Utwórz ją najpierw w panelu hostingu lub pozwól instalatorowi ją utworzyć (patrz ramka poniżej).
ins_db_advanced: Zaawansowane (port, prefiks tabel, hasło migracji) - zwykle niepotrzebne
ins_db_prefix_info: Dodawany przed każdą nazwą tabeli. Zmieniaj tylko, jeśli dzielisz jedną bazę danych z innym oprogramowaniem.
ins_db_migrationpw_info: Chroni stronę aktualizacji (install/?mode=upgrade) przy późniejszych aktualizacjach gry. Pozostaw puste, a instalator wygeneruje silne hasło i pokaże je raz na ostatniej stronie.
ins_db_migrationpw_placeholder: generowane automatycznie
ins_migrationpw_invalid: Hasło migracji nie może zawierać cudzysłowów, ukośników odwrotnych, $ ani znaków nowej linii.
ins_err_technical: szczegóły techniczne
ins_err_access_denied: Serwer bazy danych odrzucił nazwę użytkownika lub hasło. Sprawdź oba w panelu hostingu pod kątem literówek (wielkość liter ma znaczenie).
ins_err_unknown_db: Ta baza danych nie istnieje na serwerze. Sprawdź nazwę lub zaznacz poniżej „Utwórz bazę danych”.
ins_err_no_privilege: Ten użytkownik bazy danych nie ma uprawnień do tej bazy. Nadaj mu w panelu hostingu wszystkie uprawnienia do niej.
ins_err_no_create: Ten użytkownik nie ma uprawnień do tworzenia baz danych. Utwórz pustą bazę w panelu hostingu i odznacz „Utwórz bazę danych”.
ins_err_socket: Nie znaleziono gniazda serwera bazy danych. Spróbuj hosta „127.0.0.1” zamiast „localhost”.
ins_err_unreachable: Serwer bazy danych „%s” jest nieosiągalny. Sprawdź nazwę hosta i port oraz czy serwer bazy danych działa. Wielu dostawców zezwala tylko na połączenia z własnych serwerów WWW, więc zwykle właściwy jest „localhost”.
ins_game_desc: Nazwij swoją grę i wybierz, jak ma działać. Wszystko tutaj można później zmienić w administracji (Admin - Ustawienia).
ins_group_general: Ogólne
ins_uni_name: Nazwa uniwersum
ins_uni_name_info: Wyświetlana graczom przy wyborze uniwersum. Puste = „Uniwersum 1”.
ins_uni_name_invalid: Nazwa uniwersum może mieć maksymalnie 60 znaków.
