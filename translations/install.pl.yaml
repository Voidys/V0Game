ins_timezone_info: Wstępnie wybrana na podstawie serwera. Używana do wyświetlanego czasu serwera.
ins_timezone_invalid: Nieznana strefa czasowa.
ins_group_speed: Szybkość gry
ins_speed_info: Jak szybko przebiegają budowy, badania, statki, floty i produkcja. Klasyczna to oryginalne tempo; szybsze ustawienia pasują do małych społeczności i krótkich rund.
ins_speed_classic: Klasyczna
ins_speed_classic_info: oryginalne tempo, rundy trwają miesiącami
ins_speed_fast: Szybka
ins_speed_fast_info: około trzy razy szybciej, rundy trwają tygodniami
ins_speed_blitz: Blitz
ins_speed_blitz_info: do dziesięciu razy szybciej, rundy trwają dniami
ins_speed_detail: Budowa/badania %bx, floty %fx, surowce %rx
ins_speed_invalid: Nieznane ustawienie szybkości.
ins_group_players: Gracze
ins_registration: Rejestracja
ins_registration_open: Otwarta - każdy może się zarejestrować
ins_registration_closed: Zamknięta - tylko ty możesz tworzyć konta
ins_registration_info: Wybierz „zamknięta”, dopóki jeszcze konfigurujesz. Później możesz ją otworzyć w Admin - Ustawienia.
ins_registration_invalid: Nieznane ustawienie rejestracji.
ins_bots: Gracze komputerowi (boty)
ins_bots_info: Od 0 do 50. Boty grają jak prawdziwi gracze o różnych nawykach, więc nowe uniwersum nie jest puste. 0 = brak botów.
ins_bots_invalid: Liczba botów musi mieścić się w zakresie od 0 do 50.
ins_mail: Wysyłaj e-maile (rejestracja, reset hasła)
ins_mail_info: Domyślnie wyłączone. Włącz tylko, gdy serwer może wysyłać pocztę; SMTP można skonfigurować później w Admin - Ustawienia.
ins_admin_mail_info: Używany do resetowania haseł i jako adres kontaktowy.
ins_admin_mail_invalid: Podaj poprawny adres e-mail.
ins_admin_pass_confirm: Powtórz hasło
ins_admin_pass_rules: Hasło musi mieć co najmniej %d znaków (maksymalnie 64). Zdanie złożone z kilku słów łatwo zapamiętać i trudno odgadnąć.
ins_admin_pass_short: Hasło musi mieć co najmniej %d znaków.
ins_admin_pass_long: Hasło może mieć maksymalnie 64 znaki.
ins_admin_pass_mismatch: Oba hasła nie są zgodne.
