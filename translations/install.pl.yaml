ins_done_settings: Zmień ustawienia później.
ins_done_settings_info: 'Admin - Ustawienia: nazwa gry, szybkość, rejestracja, e-mail (SMTP), boty i wiele więcej.'
ins_done_bots: Boty.
ins_done_bots_info: Utworzono %d botów. Działają, gdy uruchamia się cronjob. Zarządzaj nimi w administracji.
ins_done_bots_failed: Administrator został utworzony, ale nie udało się utworzyć botów. Możesz dodać je później w administracji.
ins_done_migrationpw: Zapisz swoje hasło migracji (pokazywane tylko raz).
ins_done_migrationpw_info: Potrzebujesz go do aktualizacji gry. Jest też zapisane w config/game.php.
