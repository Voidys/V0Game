# engagement features (step 5)
ins_group_features: 'Opcjonalne funkcje gry'
ins_features_desc: 'Wszystkie domyślnie wyłączone. Każdą można później włączyć, wyłączyć i dostroić w panelu administracyjnym (ustawienia uniwersum).'
ins_feat_events: 'Wydarzenia uniwersum'
ins_feat_events_info: 'Zaplanowane wydarzenia czasowe w panelu administracyjnym: burze jonowe, targi handlowe, maksima słoneczne, najazdy piratów, weekendy z przyspieszeniem.'
ins_feat_catchup: 'Wzmocnienie dla nadrabiających'
ins_feat_catchup_info: 'Młode konta znacznie poniżej średniej dostają bonus do kopalń, który zmniejsza się przez kilka dni.'
ins_feat_contracts: 'Cotygodniowe kontrakty'
ins_feat_contracts_info: 'Trzy rotujące cele na gracza i tydzień, z nagrodą kosmetyczną lub niewielką nagrodą surowcową.'
ins_feat_alliance_goals: 'Cele sojuszu'
ins_feat_alliance_goals_info: 'Lider sojuszu ustawia cotygodniowy cel dla członków; jego wykonanie daje odznaki.'
ins_feat_returning: 'Witaj z powrotem'
ins_feat_returning_info: 'Gracze wracający po długiej przerwie widzą, co się wydarzyło, i mogą dostać krótką ochronę.'
ins_feat_seasons: 'Sezony'
ins_feat_seasons_info: 'Miesięczna tabela (najeźdźca, wojownik, obrońca, odkrywca, recykler) bez resetów; zwycięzcy dostają odznaki.'
ins_feat_cosmetics: 'Odznaki i tytuły'
ins_feat_cosmetics_info: 'Pokazuje zdobyte odznaki, tytuły i kolory nazw na karcie gracza i w czacie.'
ins_feat_bounties: 'Nagrody za głowę'
ins_feat_bounties_info: 'Gracze wystawiają surowce na innego gracza; kto zniszczy wystarczająco dużo jego floty, zbiera je.'
ins_feat_alliance_wars: 'Wynik wojny sojuszu'
ins_feat_alliance_wars_info: 'Tablica wyników na żywo dla wojen wypowiedzianych w dyplomacji sojuszu.'
ins_feat_battle_feed: 'Kanał bitew'
ins_feat_battle_feed_info: 'Duże walki są ogłaszane na czacie globalnym (wymaga czatu).'
ins_feat_derelicts: 'Pola wraków'
ins_feat_derelicts_info: 'Pola odzysku pojawiają się na pewien czas w galaktyce; pierwsi recyklerzy, którzy tam dotrą, je zbierają.'
ins_feat_mothership: 'Piracki okręt-matka'
ins_feat_mothership_info: 'Rzadki boss świata, którego można pokonać tylko w ACS; łup dzieli się według zadanych obrażeń.'
ins_feat_expedition_stories: 'Historie wypraw'
ins_feat_expedition_stories_info: 'Rzadkie sygnały prowadzą gracza przez krótki quest wyprawy z większą nagrodą.'
ins_feat_relics: 'Relikty'
ins_feat_relics_info: 'Wyprawy mogą znaleźć relikty (od pospolitych do epickich, z bonusami zestawów), które gracze montują na planetach dla małych wzmocnień.'
