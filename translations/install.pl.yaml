install_desc: "Aby włączyć narzędzie instalacyjne, utwórz plik \"var/ENABLE_INSTALL_TOOL\"<br> W nazwie pliku uwzględniana jest wielkość liter i nie ma końcówki typu pliku.<br> Plik może być pusty. \nZostanie on automatycznie usunięty po zakończeniu instalacji lub jeśli jest starszy niż godzinę."
