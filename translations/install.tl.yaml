install_desc: 'Para ma-enable ang installation tool, gumawa ng file na "var/ENABLE_INSTALL_TOOL".<br> Case-sensitive ang pangalan ng file at walang file extension.<br> Puwedeng walang laman ang file.

  Awtomatikong binubura ito kapag tapos na ang installation, o kapag mahigit isang oras na ang edad nito.'
install_title: Naka-lock ang installation tool
intro_install: I-install
intro_lang: Wika
intro_text: 'Ang V0Game ay open-source na space strategy game sa browser: palaguin ang mga planeta mo, mag-research, magpadala ng fleet at makipaglaban sa daan-daang manlalaro nang sabay-sabay.<br><br>Ihahanda ng wizard na ito ang bagong installation hakbang-hakbang: susuriin nito ang server mo, kokonekta at gagawa ng database, bubuo ng mga table, hahayaan kang pangalanan ang laro mo at gagawa ng administrator.'
intro_upgrade_head: Naka-install na ang V0Game?
intro_upgrade_text: <p>Naka-install na ang V0Game at gusto mo lang mag-update?</p><p>Puwede mong i-update dito ang existing database mo sa ilang click lang!</p>
intro_welcome: Maligayang pagdating sa V0Game!
licence_accept: Tinatanggap mo ba ang mga tuntunin ng lisensya? Puwede mo lang i-install ang software kung tatanggapin mo ang mga ito.
