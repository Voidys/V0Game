# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Reverse proxies whose X-Forwarded-* headers are trusted (client IP, scheme, host): comma separated
    # IPs/CIDRs, or "REMOTE_ADDR" for any directly connected proxy. Default: none (headers are ignored,
    # Request::getClientIp() = the TCP peer). See docs/INSTALL.md "Security".
    trusted_proxies: '%env(default::SYMFONY_TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Per-session CSRF token (id "game"), checked for every state-changing game/account/admin request by
    # App\EventListener\CsrfListener; handed to the browser as <meta name="csrf-token"> (public/scripts/app/csrf.js).
    csrf_protection: true

    # Abuse limits of the public forms (App\Security\AuthRateLimits); the game login itself is throttled by
    # security.firewalls.main.login_throttling.
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        lost_password:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # social login (App\Security\Social\SocialRateLimits): flow start/callback per IP, password of the link step per
        # IP and account, registration step per IP
        social_flow:
            policy: sliding_window
            limit: 40
            interval: '10 minutes'
        social_link_password:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        social_complete:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        admin_elevation:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # checks of the current password on the account settings page (password / e-mail change), per account
        account_settings_password:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # private messages sent or forwarded, per player (App\Security\AuthRateLimits::allowPrivateMessage);
        # limit and window are the parameters app.pm_rate_limit / app.pm_rate_interval (config/services.yaml)
        private_messages:
            policy: sliding_window
            limit: '%app.pm_rate_limit%'
            interval: '%app.pm_rate_interval%'
        # postbacks of the vote sites (App\Controller\VoteCallbackController): per client IP
        vote_callback:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        # CSP violation reports (App\Controller\CspReportController): per client IP
        csp_report:
            policy: sliding_window
            limit: 30
            interval: '1 minute'

        # in-game request budget per account (App\Security\GameRateLimits, listener RateLimitListener); token buckets:
        # `limit` = burst, refilled by rate.amount per rate.interval. All values are parameters in config/services.yaml
        game_actions:
            policy: token_bucket
            limit: '%app.game_rate_limit.action_burst%'
            rate:
                interval: '%app.game_rate_limit.action_interval%'
                amount: '%app.game_rate_limit.action_amount%'
        game_reads:
            policy: token_bucket
            limit: '%app.game_rate_limit.read_burst%'
            rate:
                interval: '%app.game_rate_limit.read_interval%'
                amount: '%app.game_rate_limit.read_amount%'
        # visitors without a login, per client IP, on the public pages (battle reports, board)
        game_anonymous:
            policy: token_bucket
            limit: '%app.game_rate_limit.anonymous_burst%'
            rate:
                interval: '%app.game_rate_limit.anonymous_interval%'
                amount: 1
        # open support tickets are capped by TicketController itself; new tickets per account and hour / day
        ticket_hour:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        ticket_day:
            policy: sliding_window
            limit: 10
            interval: '1 day'
        # alliance applications per account and day
        alliance_applications:
            policy: sliding_window
            limit: '%app.alliance_applications_per_day%'
            interval: '1 day'
        # board votes and posts/comments per account and day (AuthRateLimits::allowBoardVote / allowBoardWrite)
        board_votes:
            policy: sliding_window
            limit: '%app.board_votes_per_day%'
            interval: '1 day'
        # fleet launches and attacks per account and day (FleetDailyCaps; the cap itself is skipped when the parameter is 0)
        fleet_launches:
            policy: fixed_window
            limit: '%app.fleet_launches_per_day%'
            interval: '1 day'
        fleet_attacks:
            policy: fixed_window
            limit: '%app.attacks_per_day%'
            interval: '1 day'
        board_writes:
            policy: sliding_window
            limit: '%app.board_writes_per_day%'
            interval: '1 day'

    # Note that the session will be started ONLY if you read or write from it.
    # The game session (App\Game\Core\SessionManager) lives in this session ("obj" attribute).
    # Storage: SESSION_HANDLER_DSN (e.g. redis://host:6379), default files in var/sessions.
    session:
        name: 2Moons
        handler_id: '%env(default:session_handler_default:SESSION_HANDLER_DSN)%'
        # browser-session cookie; the idle limit is the admin setting session_lifetime (checked against the game
        # session's lastActivity, gc_maxlifetime is set per request by App\Security\SessionStorageFactory)
        cookie_lifetime: 0
        gc_maxlifetime: 43200
        cookie_path: /
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
