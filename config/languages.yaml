# Selectable game languages (formerly language/<locale>/LANG.cfg).
# number_suffixes: compact shortly_number suffixes (/1000 steps); number_profile: short|long;
# decimal_separator: 0 = European 1.234,56, 1 = US/UK 1,234.56.
# fun: true = joke language (SetSails, Ogerfränkisch): listed last, in its own group in the language selectors.
de:
    name: Deutsch
    tag: de
    author: 'Jan-Otto Kröpke'
    date: 30.10.2012
    number_suffixes:
        - ''
        - k
        - Mio
        - Mrd
        - Bio
        - Brd
        - Tr
        - Trd
        - Qa
        - Qad
        - Qi
