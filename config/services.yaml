# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # admin update notice: latest-release endpoint (App\Runtime\UpdateCheck); override with env UPDATE_CHECK_URL
    app.update_check_url: 'https://api.github.com/repos/Voidys/V0Game/releases/latest'
    app.config_cache: true
    # game session storage unless SESSION_HANDLER_DSN is set (framework.session.handler_id)
    session_handler_default: 'file://%kernel.project_dir%/var/sessions'
    # private messages one player may send or forward per window (rate limiter "private_messages")
    app.pm_rate_limit: 20
    app.pm_rate_interval: '10 minutes'
    # in-game request limits per account (App\Security\GameRateLimits): token buckets, burst = bucket size,
    # refill = amount per interval. Generous on purpose: a human clicking fast must never see the 429 page.
    # actions = POST requests and the state-changing GET links of CsrfPolicy::GET_RULES (game and account areas);
    # reads = expensive pages (galaxy, playerCard, search, statistics, battleHall, raport, records).
    app.game_rate_limit.enabled: true
    app.game_rate_limit.action_burst: 30
    app.game_rate_limit.action_interval: '1 second'
    app.game_rate_limit.action_amount: 1
    app.game_rate_limit.read_burst: 60
    app.game_rate_limit.read_interval: '1 second'
    app.game_rate_limit.read_amount: 2
    app.game_rate_limit.anonymous_burst: 30
    app.game_rate_limit.anonymous_interval: '2 seconds'
    # board: votes and posts+comments one account may make per day (sliding window)
    # fleet caps per account and day (FleetDailyCaps, fixed window of 24 h; 0 = off): launches = every fleet dispatch
    # incl. spy/recycle shortcuts and missiles (market purchase fleets excluded); attacks = attack, ACS attack/join, destruction, missile
    app.fleet_launches_per_day: 0
    app.attacks_per_day: 0
    app.board_votes_per_day: 200
    app.board_writes_per_day: 50
    app.alliance_applications_per_day: 10
    app.table_prefix: '%env(TABLE_PREFIX)%'
    # minimum level of the framework logger (it writes to the PHP error log = var/log/game.log). The Symfony runtime sets
    # SHELL_VERBOSITY=3 in debug mode, which would log every kernel event; override with env APP_LOG_LEVEL (e.g. debug)
    app.log_level: 'warning'
    # Content-Security-Policy: CSP_MODE=enforce|report|off (default enforce); in "enforce" mode only these
    # areas (game, login, account, admin, install) are enforced, the others are report-only until verified
    app.csp.default_mode: enforce
    app.csp.enforced_areas: ['game', 'login', 'account', 'admin', 'install']

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # the framework logger with a fixed minimum level instead of the verbosity-derived one (see app.log_level)
    logger:
        class: Symfony\Component\HttpKernel\Log\Logger
        autowire: false
        autoconfigure: false
        arguments:
            $minLevel: '%env(default:app.log_level:APP_LOG_LEVEL)%'
            $requestStack: '@request_stack'
            $debug: '%kernel.debug%'
        tags:
            - { name: kernel.reset, method: clear, on_invalid: ignore }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'
            # Game core (App\Game\*): uses game constants at class level and is loaded only after the
            # game bootstrap; classes are registered explicitly where needed.
            - '../src/Game/'

    App\Security\ContentSecurityPolicy:
        arguments:
            $mode: '%env(default:app.csp.default_mode:CSP_MODE)%'
            $enforcedAreas: '%app.csp.enforced_areas%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # --- Game core as container services -------------------------------------------------------
    # Game state, database and configuration are plain shared services; the game classes get them
    # through their constructors (GameUtilities hands them on to the utility objects).
    App\Game\Core\Singleton: ~
    App\Game\Core\DatabaseConfig: ~
    # lazy: connects on first use (the installer runs before a database config exists)
    App\Game\Core\Database:
        lazy: true
        arguments:
            $connection: '@doctrine.dbal.default_connection'
            $debug: '%kernel.debug%'
    # parsed config in var/game/cache.config.php (ConfigCache); off in tests, which write the config tables directly
    App\Game\Core\ConfigRegistry:
        arguments:
            $cacheEnabled: '%app.config_cache%'
    App\Game\Core\DeviceLinks:
        arguments:
            $secret: '%kernel.secret%'
    # bot check of the public forms (self-hosted proof of work, single-use challenge ids live in the app cache)
    App\Security\ProofOfWork:
        arguments:
            $secret: '%kernel.secret%'
    App\Game\Core\ViewHelpers: ~
    App\Game\Core\ErrorReporter: ~
    App\Game\Cronjob\Cronjob: ~
    App\Game\Core\FlyingFleetHandler:
        lazy: true

    # Cronjob tasks (schedules in table cronjobs) are services, resolved by Cronjob::execute()
    App\Game\Cronjob\:
        resource: '../src/Game/Cronjob/'
        exclude: '../src/Game/Cronjob/{Cronjob.php,CronjobTaskInterface.php}'
        tags: ['app.game_cronjob']

    # Bots (App\Game\Bots\*): game logic, registered explicitly (src/Game is excluded from discovery)
    App\Game\Bots\:
        resource: '../src/Game/Bots/'
        exclude: '../src/Game/Bots/{BotActions.php,Llm/LlmClient.php,Llm/LlmException.php,Llm/LlmUrlGuard.php}'

when@test:
    parameters:
        app.config_cache: false
