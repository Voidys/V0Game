# Every local project gets its own APP_SECRET: on start, a random one is written to .env.local (git-ignored)
# unless it already has one. The repository ships no working secret (.env.dev / .env stay empty).
hooks:
  post-start:
    - exec: "grep -qs '^APP_SECRET=' .env.local || printf 'APP_SECRET=%s\\n' \"$(php -r 'echo bin2hex(random_bytes(32));')\" >> .env.local"
